uples. Bras croisés sur la poitrine.","exe":"1. Recule les hanches comme pour fermer une porte avec les fesses · 2. La poitrine descend toute seule, dos droit, en 2 s · 3. Arrête-toi quand tu sens l’arrière des cuisses · 4. Serre les fessiers et remonte en 2 s","tip":"Genoux souples, sans t’accroupir.","zones":["Fessiers","Arrière de la cuisse"]},"catcow":{"n":"Chat-vache","pos":"À quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos plat, coudes souples, regard au sol.","exe":"1. Vache : sors les fesses, poitrine en avant, regard devant (3 s) · 2. Reviens au dos plat · 3. Chat : repousse le sol, arrondis le dos, menton rentré (3 s) · 4. Enchaîne sans te presser.","tip":"Bouge avec ta respiration, sans forcer.","zones":["Dos","Fessiers","Abdos"]},"squat_half":{"n":"Demi-squat","pos":"Debout, pieds à la largeur des hanches, pointes un peu ouvertes. Poids sur tout le pied. Dos droit, bras devant.","exe":"1. Serre le ventre et envoie les hanches en arrière · 2. Descends en 2 s jusqu’à mi-hauteur · 3. Pousse le sol avec tout le pied, remonte en 1 s · 4. Redresse les hanches sans bloquer les genoux.","tip":"Les genoux suivent la direction des pieds. Poids sur les talons.","zones":["Avant de la cuisse","Fessiers"]},"donkey":{"n":"Kick arrière (donkey kick)","pos":"À quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos plat, regard vers le sol.","exe":"1. Serre le ventre pour que le dos ne bouge pas · 2. Genou plié, monte le talon vers le plafond en 1 s · 3. Serre le fessier 1 s en haut · 4. Redescends en 2 s sans reposer complètement. Puis l’autre jambe","tip":"Monte seulement tant que le dos reste plat.","zones":["Fessiers","Arrière de la cuisse"]},"bridge":{"n":"Pont fessier","pos":"Allongée sur le dos, genoux pliés. Pieds à la largeur des hanches, à une main des fessiers. Bras le long du corps, paumes au sol.","exe":"1. Serre le ventre et plaque doucement le bas du dos au sol · 2. Pousse dans les talons et monte les hanches en 1 s · 3. Serre les fessiers 1 s en haut · 4. Redescends en 2 s, vertèbre par vertèbre.","tip":"Pousse avec les talons. Ne cambre pas le bas du dos.","zones":["Fessiers","Arrière de la cuisse"]},"goodmorning":{"n":"Good morning","pos":"Debout, pieds largeur de hanches. Genoux souples. Bras croisés sur la poitrine.","exe":"1. Serre le ventre · 2. Recule les hanches et penche le buste en 3 s, dos droit · 3. Descends presque à l’horizontale ou tant que le dos reste droit · 4. Serre les fessiers et remonte en 2 s","tip":"Descends seulement tant que le dos reste droit.","zones":["Fessiers","Arrière de la cuisse"]},"calfraise":{"n":"Montées sur pointes","pos":"Debout, pieds à la largeur des hanches et parallèles. Genoux tendus sans les bloquer. Bras le long du corps, regard sur un point fixe.","exe":"1. Monte sur la pointe en 1 s, poids sur le gros orteil · 2. Courte pause en haut, chevilles droites · 3. Descends en 2 s, le talon frôle le sol · 4. Répète sans rebondir.","tip":"Fixe un point devant toi pour garder l’équilibre.","zones":["Mollets","Fessiers"]},"squathold_half":{"n":"Demi-squat tenu","pos":"Debout, pieds largeur de hanches, pointes un peu vers l’extérieur. Bras devant pour l’équilibre.","exe":"1. Recule les hanches et descends à mi-hauteur en 2 s · 2. Poids sur tout le pied, genoux vers le deuxième orteil · 3. Reste là en respirant le temps indiqué · 4. Remonte en 2 s","tip":"Si les jambes tremblent, remonte un peu : ça compte quand même.","zones":["Avant de la cuisse","Fessiers"]},"lowlunge":{"n":"Fente basse","pos":"Genou arrière sur le tapis, dessus du pied au sol. Pied avant à plat, genou au-dessus de la cheville. Mains sur le genou ou les hanches.","exe":"1. Rentre un peu le bassin (coccyx vers le bas) · 2. Avance un peu les hanches jusqu’à une tension douce · 3. Buste grand, côtes basses · 4. Reste là, puis change de côté","tip":"Mets quelque chose de doux sous le genou si ça gêne.","zones":["Hanches","Avant de la cuisse"]},"gluteknee":{"n":"Genou à la poitrine","pos":"Allongée sur le dos, tête posée. Une jambe tendue au sol. Serre l’autre genou avec les 2 mains.","exe":"1. Ramène le genou vers la poitrine en 3 s · 2. Guide-le un peu vers l’épaule opposée jusqu’à sentir le fessier · 3. Relâche 1 s sans lâcher · 4. Recommence doucement et, au changement, fais l’autre jambe","tip":"Si tu n’atteins pas le genou, tiens l’arrière de la cuisse.","zones":["Fessiers","Dos"]},"pushup_knee":{"n":"Pompe sur les genoux","pos":"Genoux sur le tapis, écartés comme ton bassin. Mains sous les épaules. Corps droit des genoux à la tête, regard au sol.","exe":"1. Serre le ventre et les fessiers · 2. Descends en 2 s, coudes en diagonale vers l’arrière · 3. Arrête-toi, poitrine à un poing du sol · 4. Repousse le sol en 1 s et tends sans verrouiller","tip":"Coudes à environ 45 degrés du corps, pas trop écartés.","zones":["Poitrine","Épaules"]},"shouldertap_knee":{"n":"Touchers d’épaules sur les genoux","pos":"Planche haute sur les genoux : mains sous les épaules. Genoux un peu plus écartés que le bassin. Corps droit des genoux à la tête.","exe":"1. Serre ventre et fessiers, repousse le sol des 2 mains · 2. Amène une main à l’épaule opposée en 1 s · 3. Replace-la sous l’épaule en 1 s · 4. Change de main sans tourner le bassin","tip":"Écarte un peu les genoux pour plus de stabilité.","zones":["Abdos","Épaules"]},"floordip":{"n":"Dips au sol","pos":"Assise, mains derrière les hanches, doigts vers toi. Genoux pliés à angle droit, pieds à plat. Décolle un peu les hanches et ouvre la poitrine.","exe":"1. Éloigne les épaules des oreilles, hanches hautes · 2. Plie les coudes vers l’arrière en 2 s, au maximum à angle droit · 3. Pousse en 1 s et tends sans verrouiller","tip":"Niveau facile : petit mouvement. Épaules loin des oreilles.","zones":["Bras","Épaules"]},"downdog":{"n":"Chien tête en bas pédalé","pos":"Commence à quatre pattes, doigts bien écartés. Monte les hanches pour former un V à l’envers. Bras près des oreilles, tête relâchée.","exe":"1. Repousse le sol et éloigne la poitrine des mains · 2. Plie un genou pendant que l’autre talon descend, en 1 à 2 s · 3. Alterne en rythme, sans bouger les hanches","tip":"Tu peux garder les genoux pliés : l’important, c’est le dos long.","zones":["Épaules","Abdos"]},"plank_knee":{"n":"Planche sur les genoux","pos":"Avant-bras ou mains sous les épaules. Genoux posés derrière, hanches tendues. Corps droit des genoux à la tête, regard au sol.","exe":"1. Repousse le sol et écarte un peu les omoplates · 2. Serre ventre et fessiers, bassin droit · 3. Tiens le temps indiqué sans perdre la ligne","tip":"Regarde le sol pour ne pas forcer sur la nuque.","zones":["Abdos","Fessiers"]},"proneW":{"n":"Buste levé, bras en arrière","pos":"Allongée sur le ventre, front près du sol. Bras tendus le long du corps, paumes vers le sol. Jambes détendues.","exe":"1. Éloigne les épaules des oreilles · 2. Serre les omoplates et décolle poitrine et bras en 1 s · 3. Tiens 1 s, bras tendus vers les pieds · 4. Redescends en 2 s","tip":"Monte peu : le travail est dans le haut du dos.","zones":["Haut du dos","Dos","Épaules"]},"childpose":{"n":"Posture de l’enfant","pos":"À genoux sur le tapis, gros orteils joints. Genoux écartés à largeur de hanches ou plus. Assieds-toi sur les talons.","exe":"1. Avance les mains jusqu’à tendre les bras · 2. Pose le front sur le tapis · 3. Laisse les fessiers descendre vers les talons · 4. Relâche épaules et nuque, et reste là","tip":"Écarte les genoux si c’est plus confortable.","zones":["Dos","Abdos"]},"tricepstretch":{"n":"Étirement des triceps","pos":"Debout, pieds à largeur de hanches. Genoux souples, dos droit. Épaules relâchées.","exe":"1. Lève un bras et plie le coude, main entre les omoplates · 2. De l’autre main, pousse doucement le coude en arrière · 3. Côtes basses, sans cambrer · 4. Reste là, puis change de bras","tip":"Garde la nuque détendue.","zones":["Bras","Dos","Abdos"]},"deadbug_easy":{"n":"Dead bug facile","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras tendus vers le plafond. Plaque le bas du dos au tapis.","exe":"1. Serre le ventre comme une ceinture et baisse les côtes · 2. Descends un talon en 2 s, genou plié, jusqu’à effleurer le sol · 3. Reviens en table en 1 s · 4. Change de jambe sans bouger les hanches","tip":"Le bas du dos reste collé au tapis.","zones":["Abdos"]},"crunch":{"n":"Crunch","pos":"Allonge-toi sur le dos, genoux pliés. Pieds au sol, écartés comme tes hanches. Doigts sur les tempes ou bras croisés. Garde un poing entre menton et poitrine.","exe":"1. Serre le ventre et rapproche les côtes des hanches · 2. Monte tête et épaules en 1 s, omoplates décollées · 3. Pause 1 s · 4. Redescends en 2-3 s sans tout relâcher","tip":"Garde l’espace d’un poing entre le menton et la poitrine.","zones":["Abdos"]},"legraise_single":{"n":"Levée d’une jambe","pos":"Allonge-toi sur le dos, jambes tendues. Bras le long du corps, paumes au sol, ou mains sous les fesses. Plaque le bas du dos au tapis.","exe":"1. Serre le ventre et garde le bassin immobile · 2. Monte une jambe tendue en 2 s, vers le plafond · 3. Redescends-la en 3 s sans toucher le sol · 4. Change de jambe","tip":"Mains sous les fessiers si tu sens le bas du dos.","zones":["Abdos"]},"birddog_easy":{"n":"Bird dog facile","pos":"Mets-toi à quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, ni creusé ni arrondi. Regard au sol, ventre serré.","exe":"1. Tends un bras devant en 2 s, à hauteur d’épaule · 2. Reviens et tends la jambe opposée derrière en 2 s · 3. Monte-la seulement à hauteur de hanche, puis reviens · 4. Change de côté sans bouger le bassin","tip":"Dos plat comme une table.","zones":["Dos","Fessiers"]},"hollow_tuck":{"n":"Position creuse groupée","pos":"Allonge-toi sur le dos, genoux pliés au-dessus des hanches. Tête et omoplates décollées. Bras tendus le long des cuisses. Bas du dos plaqué.","exe":"1. Rentre un peu les fesses et plaque le bas du dos · 2. Décolle tête et omoplates, côtes basses · 3. Ramène les genoux au-dessus des hanches · 4. Tiens le temps indiqué en respirant","tip":"Plus les genoux sont proches, plus c’est facile.","zones":["Abdos"]},"sphinx":{"n":"Sphinx","pos":"Allongée sur le ventre, jambes tendues à largeur de hanches. Dessus des pieds au sol. Avant-bras sur le tapis, coudes sous les épaules.","exe":"1. Pousse le sol avec les avant-bras et monte la poitrine · 2. Descends les épaules vers l’arrière · 3. Pubis au sol, fessiers relâchés · 4. Regarde devant, nuque longue, et reste là","tip":"Si le bas du dos gêne, avance les coudes.","zones":["Abdos","Poitrine"]},"kneehug":{"n":"Genoux à la poitrine","pos":"Allongée sur le dos, tête et épaules au sol. Ramène les deux genoux à la poitrine. Enlace-les sous les genoux ou aux tibias.","exe":"1. Rapproche les genoux de la poitrine, tension douce · 2. Laisse le bas du dos au tapis · 3. Berce-toi lentement d’un côté à l’autre, un peu · 4. Reviens au centre et relâche","tip":"C’est un massage pour le bas du dos.","zones":["Dos"]},"swimming":{"n":"Nageuse","pos":"Allonge-toi sur le ventre, jambes serrées et tendues. Bras devant, écartés comme tes épaules. Front un peu décollé, regard au sol.","exe":"1. Serre le ventre et les fessiers, épaules loin des oreilles · 2. Lève bras droit et jambe gauche un peu en 1 s · 3. Redescends en 1 s sans tout relâcher · 4. Change de côté à rythme calme","tip":"Regarde le sol pour ne pas forcer sur la nuque.","zones":["Dos","Fessiers"]},"proneY":{"n":"Élévations en Y","pos":"Allonge-toi sur le ventre, bras tendus en Y, à environ 45 degrés de la tête. Pouces vers le haut, front près du sol. Jambes tendues, fessiers serrés.","exe":"1. Omoplates vers l’arrière et le bas · 2. Lève les bras en Y en 1 s, buste près du sol · 3. Courte pause en haut · 4. Redescends en 2 s","tip":"Les épaules descendent loin des oreilles.","zones":["Haut du dos","Dos","Épaules"]},"bear":{"n":"Ours","pos":"Mets-toi à quatre pattes, mains sous les épaules et genoux sous les hanches. Appuie-toi sur la pointe des pieds. Dos plat, regard au sol.","exe":"1. Repousse le sol et serre le ventre · 2. Décolle les genoux de 2 cm en 1 s · 3. Tiens le temps indiqué sans bouger le dos · 4. Repose les genoux en contrôlant","tip":"Si c’est trop dur, pose les genoux et remonte.","zones":["Abdos","Avant de la cuisse"]},"climber_slow":{"n":"Mountain climber lent","pos":"Mets-toi en planche haute, mains sous les épaules. Corps droit de la tête aux talons. Pieds écartés comme ton bassin, ventre et fessiers serrés.","exe":"1. Amène un genou vers la poitrine en 2 s · 2. Courte pause, bassin immobile · 3. Ramène le pied en arrière en 2 s · 4. Change de jambe","tip":"Épaules au-dessus des mains.","zones":["Abdos","Hanches"]},"lunge_short":{"n":"Fente arrière courte","pos":"Debout, pieds à la largeur des hanches. Dos droit, ventre ferme. Mains sur la taille ou devant.","exe":"1. Fais un petit pas en arrière sur l’avant du pied · 2. Plie les 2 genoux en 2 s jusqu’à mi-hauteur · 3. Pousse avec le talon avant et reviens en 1 s · 4. Change de jambe.","tip":"Garde le poids sur la jambe avant. Va lentement pour garder l’équilibre.","zones":["Avant de la cuisse","Fessiers"]},"burpee_step":{"n":"Burpee sans saut","pos":"Debout, pieds écartés comme ton bassin. Bras relâchés, dos droit et ventre un peu serré.","exe":"1. Plie hanches et genoux, mains sous les épaules · 2. Recule un pied puis l’autre, jusqu’en planche · 3. Reviens pas à pas, pieds près des mains · 4. Relève-toi en tendant les hanches","tip":"Sans te presser : chaque pas bien fait.","zones":["Avant de la cuisse","Fessiers"]},"hamstring":{"n":"Étirement des ischios","pos":"Allongée sur le dos. Une jambe tendue, ou pliée pied au sol. Lève l’autre et tiens l’arrière de la cuisse ou du mollet.","exe":"1. Lève la jambe, genou presque tendu · 2. Rapproche-la jusqu’à une tension douce derrière la cuisse · 3. Bassin et bas du dos au tapis · 4. Reste là, puis change de jambe","tip":"Tu peux plier un peu le genou.","zones":["Arrière de la cuisse","Mollets"]},"pelvictilt":{"n":"Bascule du bassin","pos":"Allongée sur le dos, genoux pliés, pieds largeur de hanches. Bras le long du corps.","exe":"1. Plaque le bas du dos au tapis · 2. Continue d’enrouler et décolle un peu les hanches en 2 s · 3. Reste 1 s · 4. Redescends en 2 s, vertèbre par vertèbre","tip":"C’est un petit mouvement doux.","zones":["Dos","Fessiers"]},"breathe":{"n":"Respiration finale","pos":"Allongée sur le dos, jambes tendues ou genoux pliés. Bras relâchés ou une main sur le ventre. Yeux fermés.","exe":"1. Inspire par le nez sur 4 temps, en gonflant ventre et côtes · 2. Expire sur 6 temps, doucement et en continu · 3. Laisse le corps peser sur le tapis · 4. Répète plusieurs fois","tip":"Laisse ton corps peser sur le tapis.","zones":["Fessiers","Abdos"]},"rockback":{"n":"Balancier à quatre pattes","pos":"À quatre pattes. Mains sous les épaules. Genoux plus écartés que les hanches, pieds plus rapprochés, dessus des pieds au tapis.","exe":"1. Dos long, regard vers le sol · 2. Emmène les hanches vers les talons en 3 s · 3. Reste 1 s là où tu sens l’intérieur des cuisses · 4. Reviens à quatre pattes en 3 s","tip":"Descends seulement tant que c’est confortable.","zones":["Intérieur de la cuisse","Fessiers"]},"sidequad":{"n":"Quadriceps sur le côté","pos":"Allongée sur le côté, tête sur le bras du dessous. Corps bien aligné. Jambe du dessous un peu pliée pour rester stable.","exe":"1. Plie le genou du dessus et tiens la cheville · 2. Amène le talon vers le fessier · 3. Genoux joints, bassin un peu rentré (coccyx vers le bas) · 4. Reste là, puis change de côté","tip":"Si tu n’atteins pas la cheville, tiens ton pantalon.","zones":["Avant de la cuisse","Hanches"]},"yogisquat":{"n":"Squat profond","pos":"Debout, pieds un peu plus larges que les hanches. Pointes légèrement vers l’extérieur. Mains jointes devant la poitrine.","exe":"1. Descends lentement en pliant hanches et genoux · 2. Genoux dans l’axe des pieds · 3. Coudes à l’intérieur des genoux, écarte-les doucement · 4. Poitrine haute, reste là et remonte lentement","tip":"Si les talons se lèvent, écarte davantage les pieds.","zones":["Intérieur de la cuisse","Fessiers"]},"childreach":{"n":"De l’enfant à quatre pattes","pos":"À quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, regard vers le sol.","exe":"1. Expire et recule les hanches vers les talons · 2. Pause 1 ou 2 s, bras allongés · 3. Inspire et reviens lentement à quatre pattes · 4. Répète calmement","tip":"Laisse-toi descendre en douceur, sans forcer.","zones":["Fessiers","Dos"]},"cobra":{"n":"Cobra doux","pos":"Allongée sur le ventre, jambes tendues à largeur de hanches. Dessus des pieds au sol. Mains sous les épaules, coudes près du corps.","exe":"1. Inspire et monte la poitrine avec le dos · 2. Coudes un peu pliés, épaules basses · 3. Pubis et hanches restent au sol · 4. Expire et redescends lentement","tip":"La hauteur ne compte pas. Aucune douleur.","zones":["Abdos","Poitrine"]},"seatedfwd":{"n":"Pince assise","pos":"Assise sur les os des fesses, jambes tendues et serrées. Pointes des pieds vers toi. Dos long, mains sur les cuisses.","exe":"1. Inspire et grandis-toi vers le plafond · 2. Expire et penche-toi depuis les hanches, pas depuis le dos · 3. Glisse les mains vers les pieds jusqu’à une tension douce · 4. Reste là, puis remonte lentement","tip":"Plie les genoux si ça tire trop.","zones":["Arrière de la cuisse","Mollets"]},"shouldercircle":{"n":"Cercles d’épaules","pos":"Debout ou assise, dos droit. Pieds à largeur de hanches. Bouts des doigts sur les épaules, coudes vers l’avant.","exe":"1. Dessine de grands cercles avec les coudes · 2. Laisse bouger les omoplates aussi · 3. À mi-temps, change de sens · 4. Rythme lent et contrôlé","tip":"À mi-parcours, change de sens.","zones":["Épaules","Haut du dos","Dos"]},"neck":{"n":"Mobilité de la nuque","pos":"Debout ou assise, dos droit. Épaules basses et relâchées, bras détendus. Amène doucement le menton vers la poitrine.","exe":"1. Dos grand, épaules basses · 2. Descends le menton vers la poitrine en 3 s · 3. Reste 1 s en sentant la nuque · 4. Regarde de nouveau devant en 3 s","tip":"Ne bascule jamais la tête en arrière.","zones":["Haut du dos","Dos"]},"squat":{"n":"Squat","pos":"Debout, pieds à la largeur des hanches ou un peu plus. Pointes un peu ouvertes. Dos droit, bras devant à hauteur de poitrine.","exe":"1. Serre le ventre, envoie les hanches en arrière et en bas · 2. Descends en 3 s, cuisses presque parallèles au sol · 3. Pousse le sol et remonte en 1 s · 4. Serre les fessiers en haut sans cambrer.","tip":"Dos long et talons bien au sol. Bras devant pour l’équilibre.","zones":["Avant de la cuisse","Fessiers"]},"lunge":{"n":"Fente arrière","pos":"Debout, pieds à la largeur des hanches. Dos droit, ventre ferme. Mains sur la taille, regard devant.","exe":"1. Fais un grand pas en arrière, pieds largeur de hanches · 2. Descends en 2 s, genoux à angle droit, sans toucher le sol · 3. Pousse avec le talon avant et reviens en 1 s · 4. Change de jambe.","tip":"Le genou avant reste au-dessus de la cheville. Buste droit.","zones":["Avant de la cuisse","Fessiers"]},"bridgehold":{"n":"Pont fessier tenu","pos":"Allongée sur le dos, genoux pliés. Pieds à la largeur des hanches, à une main des fessiers. Bras le long du corps, paumes au sol.","exe":"1. Pousse dans les talons et monte les hanches en 2 s · 2. Forme une ligne droite des genoux aux épaules, côtes basses · 3. Tiens, fessiers serrés, le temps indiqué · 4. Redescends en 2 ou 3 s, vertèbre par vertèbre.","tip":"Si tu sens le bas du dos, descends un peu les hanches.","zones":["Fessiers","Arrière de la cuisse"]},"squathold":{"n":"Squat isométrique","pos":"Debout, pieds à la largeur des hanches, pointes un peu ouvertes. Dos droit. Bras devant à hauteur de poitrine.","exe":"1. Envoie les hanches en arrière et descends en 3 s · 2. Arrête-toi à mi-hauteur, ou plus bas si tu peux · 3. Tiens immobile, ventre ferme, poids dans les talons · 4. À la fin, remonte en 2 s.","tip":"Niveau facile : reste à mi-hauteur.","zones":["Avant de la cuisse","Fessiers"]},"pushup":{"n":"Pompe","pos":"Planche haute (bras tendus) : mains sous les épaules. Pieds écartés comme ton bassin. Corps droit des talons à la tête, regard au sol.","exe":"1. Serre ventre et fessiers, genoux tendus · 2. Descends en 2 s, coudes en diagonale vers l’arrière · 3. Arrête-toi, poitrine à un poing du sol · 4. Pousse en 1 s et écarte un peu les omoplates","tip":"Si les hanches s’affaissent, passe aux pompes sur les genoux.","zones":["Poitrine","Épaules"]},"shouldertap":{"n":"Touchers d’épaules en planche","pos":"Planche haute : mains sous les épaules. Pieds un peu plus écartés que le bassin, jambes tendues. Corps droit des talons à la tête.","exe":"1. Serre fessiers et ventre, repousse le sol · 2. Touche l’épaule opposée en 1 s · 3. Replace la main sous l’épaule en 1 s · 4. Change de main sans bouger le bassin","tip":"Pieds écartés = plus facile ; pieds joints = plus difficile.","zones":["Abdos","Épaules"]},"pike":{"n":"Pompe en pike","pos":"V à l’envers : mains écartées comme tes épaules. Pieds à 1 mètre des mains. Hanches hautes, jambes tendues ou genoux un peu pliés. Regarde entre tes mains.","exe":"1. Porte le poids sur les mains, hanches hautes · 2. Descends en 2 s en pliant les coudes vers l’arrière · 3. Approche la tête du sol, devant les mains · 4. Pousse en 1 s jusqu’à tendre les bras","tip":"Ça travaille les épaules. Rapproche les pieds des mains pour corser l’exercice.","zones":["Épaules","Bras"]},"plank":{"n":"Planche","pos":"Mains sous les épaules, bras tendus sans verrouiller. Jambes tendues, pieds écartés comme ton bassin. Corps droit des talons à la tête.","exe":"1. Repousse le sol et éloigne la poitrine des mains · 2. Serre fessiers et cuisses, nombril rentré · 3. Tiens le temps indiqué en respirant calmement","tip":"Si le bas du dos se creuse, pose les genoux.","zones":["Abdos","Fessiers"]},"plankdog":{"n":"Planche vers chien tête en bas","pos":"Planche haute : mains sous les épaules, doigts écartés. Pieds écartés comme ton bassin. Corps droit. Plus facile : genoux posés.","exe":"1. Serre le ventre et repousse le sol · 2. Monte les hanches en haut et en arrière en 2 s · 3. Arrive au V à l’envers, bras près des oreilles · 4. Reviens en planche en 2 s, épaules au-dessus des mains","tip":"Niveau facile : fais-le avec les genoux posés en planche.","zones":["Épaules","Abdos"]},"deadbug":{"n":"Dead bug","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras tendus vers le plafond. Plaque le bas du dos au tapis.","exe":"1. Serre le ventre comme une ceinture et baisse les côtes · 2. Tends un bras en arrière et la jambe opposée en 2 s · 3. Arrête avant le sol. Reviens en table en 1 s · 4. Change de côté","tip":"Expire en tendant. Si le bas du dos se décolle, tends moins loin.","zones":["Abdos"]},"crunch_tt":{"n":"Crunch jambes en table","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Doigts sur les tempes. Plaque le bas du dos au tapis.","exe":"1. Garde les jambes immobiles en table et serre le ventre · 2. Monte tête et épaules en 1 s, omoplates décollées · 3. Pause 1 s · 4. Redescends en 2-3 s sans bouger les jambes","tip":"Expire en montant.","zones":["Abdos"]},"sideplank":{"n":"Planche latérale","pos":"Allonge-toi sur le côté, jambes tendues. Pose l’avant-bras, coude sous l’épaule. Pieds l’un sur l’autre, ou celui du dessus devant. Tout le corps aligné.","exe":"1. Repousse le sol avec l’avant-bras et serre le ventre · 2. Monte le bassin en 1 s, droite de la tête aux pieds · 3. Tiens sans tourner le buste · 4. Redescends avec contrôle et change de côté","tip":"Pour simplifier, pose le genou du bas.","zones":["Abdos","Dos"]},"reversecrunch":{"n":"Crunch inversé","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras le long du corps, paumes au sol. Bas du dos plaqué.","exe":"1. Serre le ventre et baisse les côtes · 2. Enroule le bassin en 1 s, genoux à la poitrine, fesses décollées · 3. Pause 1 s · 4. Redescends en 3 s jusqu’à la table","tip":"Sans élan : le mouvement est petit.","zones":["Abdos"]},"birddog":{"n":"Bird dog","pos":"Mets-toi à quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, ni creusé ni arrondi. Regard au sol, ventre serré.","exe":"1. Serre le ventre comme une ceinture · 2. Tends ensemble un bras et la jambe opposée en 2 s · 3. Pause 1 s, bien alignée · 4. Reviens en 2 s et change de côté","tip":"Imagine un verre d’eau sur ton dos qui ne doit pas tomber.","zones":["Dos","Fessiers"]},"hollow":{"n":"Position creuse","pos":"Allonge-toi sur le dos, bras tendus au-dessus de la tête. Jambes serrées et tendues. Tête, omoplates, bras et jambes décollés de quelques centimètres.","exe":"1. Rentre un peu les fesses et plaque le bas du dos · 2. Décolle tête et omoplates, bras près des oreilles · 3. Monte les jambes tendues tant que le dos reste plaqué · 4. Tiens en respirant","tip":"Monte davantage les jambes si le bas du dos se décolle.","zones":["Abdos"]},"superman":{"n":"Superman","pos":"Allonge-toi sur le ventre, bras et jambes tendus. Jambes serrées, dessus des pieds au sol. Regard au sol, ventre un peu serré.","exe":"1. Serre les fessiers, omoplates vers l’arrière et le bas · 2. Lève bras, buste et jambes d’une main en 1 s · 3. Tiens 1 s en haut · 4. Redescends en 2 s en contrôlant","tip":"Serre les fessiers pour protéger le bas du dos.","zones":["Dos","Fessiers"]},"bridgemarch":{"n":"Pont fessier en marche","pos":"Allongée sur le dos, genoux pliés. Pieds à la largeur des hanches, à une main des fessiers. Bras le long du corps, pressés au sol.","exe":"1. Monte en pont, ligne droite des genoux aux épaules · 2. Poids sur un talon, monte l’autre genou en 2 s · 3. Repose le pied sans que les hanches baissent · 4. Change de jambe. À la fin, redescends en 2 s.","tip":"Si les hanches descendent, fais le pont classique.","zones":["Fessiers","Arrière de la cuisse"]},"climber":{"n":"Mountain climber","pos":"Mets-toi en planche haute, mains sous les épaules. Corps droit de la tête aux talons. Pieds écartés comme ton bassin, ventre et fessiers serrés.","exe":"1. Amène un genou à la poitrine · 2. Change de jambe d’un pas léger, sur la pointe du pied · 3. Garde environ 2 changements par seconde · 4. Ne fais pas rebondir le bassin","tip":"Hanches basses, alignées avec les épaules.","zones":["Abdos","Hanches"]},"jumpsquat":{"n":"Squat sauté","pos":"Debout, pieds à la largeur des hanches, pointes un peu ouvertes. Dos droit. Bras le long du corps, prêts pour l’élan.","exe":"1. Descends en 2 s en squat, hanches en arrière · 2. Saute fort en lançant les bras vers le haut · 3. Atterris sur l’avant du pied, puis le talon, genoux fléchis · 4. Reste stable 1 s et recommence.","tip":"Si tu ne peux pas sauter (voisins, genoux), fais des squats avec 3 secondes de pause en bas.","zones":["Avant de la cuisse","Fessiers"]},"lunge_knee":{"n":"Fente arrière avec montée de genou","pos":"Debout, pieds à la largeur des hanches. Dos droit, ventre ferme. Bras le long du corps ou sur la taille. Fixe un point.","exe":"1. Fais un grand pas en arrière et descends en 2 s · 2. Pousse avec le talon avant et remonte en 1 s · 3. Sans poser le pied, monte le genou arrière, tiens 1 s · 4. Répète la même jambe ou change.","tip":"Si tu perds l’équilibre, pose le pied un instant avant de monter le genou.","zones":["Avant de la cuisse","Fessiers"]},"bridge1leg":{"n":"Pont fessier sur une jambe","pos":"Allongée sur le dos. Pose un pied au centre, genou plié. Tends l’autre jambe, cuisses à la même hauteur. Paumes pressées au sol.","exe":"1. Serre le ventre et plaque doucement le bas du dos · 2. Pousse dans le talon et monte les hanches en 1 s · 3. Tiens 1 s en haut, bassin bien à niveau · 4. Redescends en 2 s. Change de jambe à mi-temps.","tip":"Les hanches montent droites, sans basculer d’un côté.","zones":["Fessiers","Arrière de la cuisse"]},"sldl":{"n":"Soulevé de terre sur une jambe","pos":"Debout sur une jambe, genou souple. L’autre jambe juste derrière, pointe au sol. Bras relâchés.","exe":"1. Serre le ventre et regarde le sol · 2. Penche le buste en 3 s pendant que l’autre jambe monte derrière · 3. Buste et jambe en ligne droite, hanches face au sol · 4. Remonte en 2 s en serrant le fessier d’appui","tip":"Si tu perds l’équilibre, pose la pointe du pied arrière.","zones":["Fessiers","Arrière de la cuisse"]},"calfraise_slow":{"n":"Montées sur pointes lentes","pos":"Debout, pieds à la largeur des hanches et parallèles. Genoux tendus sans les bloquer. Bras le long du corps, regard sur un point fixe.","exe":"1. Monte haut en 1 s, poids sur le gros orteil · 2. Tiens 2 s en haut sans osciller · 3. Descends en 3 s, lentement et en contrôle · 4. Effleure le sol avec le talon et recommence.","tip":"Plus c’est lent, plus les mollets travaillent.","zones":["Mollets"]},"pushup_slow":{"n":"Pompe lente","pos":"Planche haute : mains sous les épaules, pieds écartés comme ton bassin. Corps droit des talons à la tête. Si tu perds la ligne, pose les genoux.","exe":"1. Serre fessiers et ventre · 2. Descends en comptant 3 s, coudes en diagonale vers l’arrière · 3. Remonte en comptant 3 s, toujours à la même vitesse · 4. Tends les coudes sans verrouiller et recommence","tip":"La lenteur fait la difficulté : pas besoin d’en faire beaucoup.","zones":["Poitrine","Épaules"]},"shouldertap_hard":{"n":"Touchers d’épaules, pieds joints","pos":"Planche haute : mains sous les épaules. Pieds joints, jambes tendues, fessiers serrés. Corps droit des talons à la tête.","exe":"1. Serre fessiers, cuisses et ventre · 2. Amène la main à l’épaule opposée en 2 s · 3. Replace-la sous l’épaule en 2 s · 4. Change de main sans tourner bassin ni épaules","tip":"Compte deux secondes à chaque toucher.","zones":["Abdos","Épaules"]},"floordip_leg":{"n":"Dips au sol, jambe tendue","pos":"Assise, mains derrière les hanches, doigts vers toi. Un genou plié, pied à plat. L’autre jambe tendue, talon au sol. Hanches hautes et bien droites.","exe":"1. Monte les hanches en serrant le fessier de la jambe pliée · 2. Plie les coudes vers l’arrière en 2 s, jusqu’à angle droit · 3. Pousse en 1 s et tends sans verrouiller · 4. À la moitié de la série, change de jambe","tip":"Garde les hanches hautes tout le temps.","zones":["Bras","Épaules"]},"pike_slow":{"n":"Pompe en pike lente","pos":"V à l’envers, pieds un peu plus près des mains, à 70 ou 80 centimètres environ. Mains écartées comme tes épaules. Hanches hautes, regard entre les mains.","exe":"1. Porte le poids sur les mains · 2. Descends en comptant 3 s, coudes vers l’arrière · 3. Courte pause, tête à 2 ou 3 centimètres du sol · 4. Pousse en 1 s jusqu’à tendre les bras","tip":"Coudes vers l’arrière, pas sur les côtés.","zones":["Épaules","Bras"]},"plankleg":{"n":"Planche avec jambe levée","pos":"Planche haute : mains sous les épaules, pieds écartés comme ton bassin. Corps droit des talons à la tête. Bassin bien droit, sans pencher.","exe":"1. Serre le ventre et repousse le sol · 2. Lève une jambe tendue d’une main en 1 s · 3. Tiens 1 s, redescends en 1 s · 4. Change de jambe sans bouger le bassin","tip":"Les hanches ne tournent pas quand tu lèves la jambe.","zones":["Fessiers","Arrière de la cuisse"]},"deadbug_slow":{"n":"Dead bug lent","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras tendus vers le plafond. Plaque le bas du dos au tapis.","exe":"1. Depuis la table, serre le ventre comme une ceinture · 2. Tends un bras et la jambe opposée en 3 s · 3. Pause 1 s, bas du dos plaqué · 4. Reviens en 2 s et change de côté","tip":"C’est la lenteur qui le rend difficile.","zones":["Abdos"]},"situp":{"n":"Sit-up","pos":"Allonge-toi sur le dos, genoux pliés. Pieds au sol, écartés comme tes hanches. Bras tendus devant toi ou croisés sur la poitrine.","exe":"1. Décolle tête et omoplates, comme pour un crunch · 2. Continue d’enrouler jusqu’à être assise en 2 s · 3. Déroule-toi vertèbre par vertèbre en 3 s · 4. Repose les épaules et recommence","tip":"Si tu tires sur la nuque, tends les bras devant toi.","zones":["Abdos"]},"sideplank_dip":{"n":"Planche latérale avec descentes","pos":"Mets-toi en planche sur le côté, sur l’avant-bras et le bord du pied. Coude sous l’épaule. Corps droit de la tête aux pieds, ventre serré.","exe":"1. Pars en planche sur le côté, bassin aligné · 2. Descends le bassin en 2 s, presque jusqu’au sol · 3. Remonte en 1 s, un peu au-dessus de la ligne · 4. Termine la série et change de côté","tip":"Mouvement contrôlé, sans à-coups.","zones":["Abdos","Dos"]},"legraise":{"n":"Levée de jambes","pos":"Allonge-toi sur le dos, jambes serrées et tendues. Bras le long du corps, paumes au sol, ou mains sous les fesses. Bas du dos plaqué, côtes basses.","exe":"1. Serre le ventre et plaque le bas du dos au tapis · 2. Monte les jambes en 2 s, vers le plafond · 3. Descends en 3 s tant que le dos reste plaqué · 4. Recommence sans toucher le sol","tip":"Si le bas du dos se décolle, plie un peu les genoux.","zones":["Abdos"]},"birddog_crunch":{"n":"Bird dog coude-genou","pos":"Mets-toi à quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, ni creusé ni arrondi. Regard au sol, ventre serré.","exe":"1. Tends un bras et la jambe opposée en 2 s · 2. Pause 1 s, bien alignée · 3. Ramène coude et genou sous le corps en 2 s, dos rond · 4. Fais la moitié des répétitions puis change de côté","tip":"Va lentement pour garder l’équilibre.","zones":["Abdos"]},"hollowrock":{"n":"Position creuse en balancier","pos":"Mets-toi en barque : bas du dos plaqué au sol, côtes basses. Bras près des oreilles. Jambes tendues et décollées du sol.","exe":"1. Installe la barque, bas du dos plaqué · 2. Bascule vers la tête en 1 s sans changer la forme · 3. Bascule vers les pieds en 1 s · 4. Garde un rythme régulier. Si la forme casse, tiens immobile","tip":"Si tu perds la forme, reviens à la position tenue immobile.","zones":["Abdos"]},"supermanhold":{"n":"Superman tenu","pos":"Allonge-toi sur le ventre, bras et jambes tendus. Jambes serrées, regard au sol, ventre serré.","exe":"1. Serre les fessiers, omoplates vers l’arrière et le bas · 2. Lève bras, buste et jambes en 2 s, à hauteur tenable · 3. Tiens le temps indiqué sans t’affaisser · 4. Redescends en 2 s","tip":"Mieux vaut peu de hauteur bien faite que beaucoup en forçant.","zones":["Dos","Fessiers"]},"proneY_slow":{"n":"Élévations en Y avec pause","pos":"Allonge-toi sur le ventre, bras tendus en Y, à environ 45 degrés de la tête. Pouces vers le haut, regard au sol. Jambes tendues, fessiers serrés.","exe":"1. Omoplates vers l’arrière et le bas · 2. Lève les bras en Y en 2 s · 3. Tiens 2 s en serrant entre les omoplates · 4. Redescends en 2 s","tip":"Pas d’élan : monte avec le dos.","zones":["Haut du dos","Dos","Épaules"]},"swimming_fast":{"n":"Nageuse rapide","pos":"Allonge-toi sur le ventre, bras et jambes tendus. Décolle un peu le buste et les jambes. Regard au sol, fessiers serrés.","exe":"1. Décolle un peu buste, bras et jambes · 2. Alterne bras et jambe opposés en battements courts et rapides · 3. Fais environ 2 battements par seconde · 4. Garde la même hauteur jusqu’à la fin","tip":"Respire calmement même si le rythme est rapide.","zones":["Dos","Fessiers"]},"burpee":{"n":"Burpee","pos":"Debout, pieds écartés comme ton bassin. Bras relâchés, dos droit et ventre un peu serré.","exe":"1. Accroupis-toi, mains sous les épaules · 2. Saute en arrière en planche, bassin aligné · 3. Ramène les pieds près des mains d’un saut · 4. Saute bras en haut, atterris sur l’avant des pieds, genoux fléchis","tip":"Si besoin, supprime le saut final.","zones":["Avant de la cuisse","Fessiers"]}},"lv":["Facile","Moyen","Difficile"],"sec":{"warm":"Échauffement","ma et","Blanc de poulet en morceaux"]],["Céréales et fruits secs",["Riz","Pain complet","Pâtes complètes","Quinoa"]]]},{"name":"Octobre","lunch":["oct-c1","oct-c2","sep-c1","sep-c2","nov-c1","nov-c2","exp-c1"],"dinner":["oct-n1","oct-n2","sep-n1","sep-n2","nov-n1","nov-n2","exp-n1"],"shop":[["Frais : fruits et légumes",["Aubergine","Courge","Oignon","Chou","Citron","Poireau","Champignons","Tomates","Carotte"]],["Surgelés",["Courge surgelée","Chou-fleur surgelé"]],["Conserves et bocaux",["Bouillon de poulet","Bouillon de légumes","Lentilles","Lentilles cuites"]],["Œufs et produits laitiers",["Œuf","Lait de coco","Fromage feta","Fromage râpé"]],["Viande et poisson",["Blanc de poulet","Blanc de poulet en morceaux"]],["Céréales et fruits secs",["Riz","Pain complet","Pâtes complètes","Quinoa"]]]},{"name":"Novembre","lunch":["nov-c1","nov-c2","sep-c1","sep-c2","oct-c1","oct-c2","exp-c1"],"dinner":["nov-n1","nov-n2","sep-n1","sep-n2","oct-n1","oct-n2","exp-n1"],"shop":[["Frais : fruits et légumes",["Aubergine","Courge","Oignon","Chou","Citron","Poireau","Champignons","Tomates","Carotte"]],["Surgelés",["Courge surgelée","Chou-fleur surgelé"]],["Conserves et bocaux",["Bouillon de poulet","Bouillon de légumes","Lentilles","Lentilles cuites"]],["Œufs et produits laitiers",["Œuf","Lait de coco","Fromage feta","Fromage râpé"]],["Viande et poisson",["Blanc de poulet","Blanc de poulet en morceaux"]],["Céréales et fruits secs",["Riz","Pain complet","Pâtes complètes","Quinoa"]]]},{"name":"Décembre","lunch":["dic-c1","dic-c2","ene-c1","ene-c2","feb-c1","feb-c2","exp-c1"],"dinner":["dic-n1","dic-n2","ene-n1","ene-n2","feb-n1","feb-n2","exp-n1"],"shop":[["Frais : fruits et légumes",["Brocoli","Oignon","Épinards","Citron","Poireau","Tomates","Carotte"]],["Surgelés",["Brocoli surgelé","Chou-fleur surgelé"]],["Conserves et bocaux",["Bouillon de légumes","Pois chiches","Lentilles","Lentilles cuites"]],["Œufs et produits laitiers",["Œuf","Fromage feta","Fromage râpé"]],["Viande et poisson",["Blanc de poulet","Saumon"]],["Céréales et fruits secs",["Riz","Riz blanc","Pain complet","Pain complet pour accompagner","Quinoa"]]]}],"recipes":{"ene-c1":{"n":"Soupe de poireau et lentilles","time":"20 min","ing":["1 poireau","2 carottes","1 boîte de lentilles cuites (400g)","1L de bouillon de légumes","1 c. à soupe d'huile d'olive","Sel, cumin","1 tomate (facultatif · râpée, en faisant revenir)"],"steps":["Coupe le poireau et la carotte en rondelles. Fais-les revenir avec l'huile dans une casserole à feu moyen 5 min en remuant","Ajoute le bouillon, monte le feu jusqu'à ébullition, baisse à moyen et cuis 10 min à couvert","Égoutte les lentilles et ajoute-les avec le sel et le cumin. 5 min de plus en remuant et c'est prêt"],"tip":"Utilise des lentilles en boîte — elles sont déjà cuites. Elles ont juste besoin de 5 min de chaleur pour s'imprégner de saveur."},"ene-c2":{"n":"Riz au brocoli et à l'œuf","time":"18 min","ing":["½ tasse de riz blanc","150g de brocoli surgelé","1 œuf","1 tasse d'eau","1 c. à soupe d'huile d'olive","Sel, ail en poudre","1 tomate (facultatif · en dés, par-dessus au service)"],"steps":["Mets le riz, l'eau et le sel dans une casserole. Porte à ébullition, baisse au minimum, couvre. Règle une alarme de 15 min","Au bout de 10 min : pose le brocoli surgelé sur le riz sans mélanger. Couvre de nouveau","Fais frire l'œuf dans une poêle à part avec l'huile. Sers le riz et le brocoli avec l'œuf dessus et l'ail en poudre"],"tip":"Le brocoli surgelé va directement dans la casserole sans décongeler. L'œuf peut être frit si tu ne maîtrises pas le pochage."},"ene-n1":{"n":"Velouté de chou-fleur","time":"15 min","ing":["300g de chou-fleur surgelé","½ oignon","1 verre de bouillon de légumes","1 c. à soupe d'huile d'olive","Sel, noix de muscade","Pain complet pour accompagner"],"steps":["Émince l'oignon. Fais-le revenir avec l'huile dans une casserole 3 min à feu moyen","Ajoute le chou-fleur surgelé et le bouillon. Monte le feu. À ébullition, baisse à moyen et couvre 10 min","Mixe au mixeur plongeant, ajoute le sel et la noix de muscade. Sers avec du pain complet"],"tip":"Mixe bien pour que ce soit onctueux. Un filet de lait de coco à la fin le rend plus crémeux."},"ene-n2":{"n":"Omelette au poireau","time":"10 min","ing":["1 poireau (partie blanche)","2 œufs","1 c. à soupe d'huile d'olive","Sel","1 tomate (facultatif · en rondelles, pour accompagner)"],"steps":["Coupe le poireau en fines rondelles. Fais-le revenir avec l'huile 5 min à feu moyen jusqu'à ce qu'il ramollisse","Bats les œufs avec le sel. Verse sur le poireau à feu moyen-doux. 3 min sans remuer","Retourne-la à l'aide d'une assiette. 2 min de plus et c'est prêt"],"tip":"Fais bien revenir le poireau jusqu'à ce qu'il soit translucide — comme ça il n'a pas un goût de cru dans l'omelette."},"feb-c1":{"n":"Bol d'épinards et pois chiches","time":"10 min","ing":["1 boîte de pois chiches (400g)","2 poignées d'épinards frais","30g de feta","Jus d'½ citron","2 c. à soupe d'huile d'olive","Sel, cumin","1 tomate (facultatif · en dés)"],"steps":["Égoutte et rince les pois chiches à l'eau froide","Mets les épinards dans un bol, ajoute les pois chiches et la feta émiettée","Assaisonne avec le citron, l'huile, le sel et le cumin. Mélange et c'est prêt à déguster"],"tip":"Si les épinards sont frais, ils sont prêts tels quels. S'ils sont surgelés, décongèle-les et égoutte-les bien."},"feb-c2":{"n":"Poulet au brocoli et citron","time":"20 min","ing":["1 blanc de poulet en escalopes","150g de brocoli surgelé","½ tasse de riz","1 citron","1 c. à soupe d'huile d'olive","Sel, ail en poudre"],"steps":["Mets le riz avec l'eau et le sel dans une casserole. Porte à ébullition, baisse au minimum, couvre 15 min. Au bout de 10 min ajoute le brocoli dessus","Sale le poulet. Poêle avec l'huile à feu moyen-vif. 4 min sans le bouger. Retourne","4 min de plus, presse le citron dessus et éteins. Sers avec le riz et le brocoli"],"tip":"Ne bouge pas le poulet tant qu'il ne se décolle pas tout seul de la poêle — comme ça il est doré et moelleux."},"feb-n1":{"n":"Velouté de brocoli et curcuma","time":"12 min","ing":["250g de brocoli surgelé","½ oignon","1 verre de bouillon de légumes","1 c. à soupe d'huile d'olive","½ c. à café de curcuma","Pincée de poivre noir","Sel"],"steps":["Fais revenir l'oignon avec l'huile 3 min. Ajoute le brocoli surgelé et le bouillon","Porte à ébullition et cuis 8 min à couvert à feu moyen","Ajoute le curcuma, le poivre et le sel. Mixe jusqu'à ce que ce soit onctueux"],"tip":"Le curcuma a besoin d'un peu de poivre noir pour s'activer. Ajoute une pincée au moment de mixer."},"feb-n2":{"n":"Épinards à l'œuf poché","time":"8 min","ing":["2 poignées d'épinards","1 œuf","1 gousse d'ail (ou ail en poudre)","1 c. à soupe d'huile d'olive","Sel","Pain complet"],"steps":["Fais sauter les épinards avec l'ail et l'huile 3 min à feu moyen jusqu'à ce qu'ils réduisent","En parallèle : porte l'eau à ébullition, ajoute une pincée de vinaigre, remue et casse l'œuf. 3 min","Sers les épinards avec l'œuf dessus et du pain complet à côté"],"tip":"Pour l'œuf poché : eau bouillante avec une pincée de vinaigre, remue pour faire un tourbillon et casse l'œuf. 3 min."},"mar-c1":{"n":"Quinoa aux asperges et à l'œuf","time":"15 min","ing":["½ tasse de quinoa prélavé","1 botte d'asperges","2 œufs","1 c. à soupe d'huile d'olive","Jus d'½ citron","Sel","1 tomate (facultatif · en dés)"],"steps":["Porte le quinoa à ébullition avec 1 tasse d'eau et du sel. À ébullition, baisse au minimum et couvre 12 min","Cuis les œufs 8 min dans l'eau bouillante. Refroidis et écale","Fais les asperges à la plancha avec l'huile et le sel 4 min. Sers le tout ensemble avec le citron"],"tip":"Les asperges blanches en bocal font aussi l'affaire. Égoutte-les et fais-les 2 min à la plancha."},"mar-c2":{"n":"Riz aux petits pois et au thon","time":"18 min","ing":["½ tasse de riz","100g de petits pois (surgelés ou en boîte)","1 boîte de thon au naturel","1 c. à soupe d'huile d'olive","Sel, persil (facultatif)","1 tomate (facultatif · râpée, en faisant revenir)"],"steps":["Porte le riz à ébullition avec l'eau et le sel 15-18 min. Dans les 5 dernières min ajoute les petits pois dessus","Égoutte le thon. Mélange le riz et les petits pois avec le thon, l'huile et le sel"],"tip":"Le thon s'ajoute à la fin, hors du feu — comme ça il ne se dessèche pas. Égoutte-le bien de l'huile de la boîte."},"mar-n1":{"n":"Asperges à la plancha avec œuf","time":"8 min","ing":["1 botte d'asperges vertes","1 œuf","1 c. à soupe d'huile d'olive","Gros sel","Pain complet"],"steps":["Chauffe la poêle à feu vif avec l'huile. Fais les asperges à la plancha 4 min avec du sel","Dans la même poêle, baisse le feu et fais frire l'œuf. 2 min","Sers les asperges avec l'œuf dessus et du pain complet"],"tip":"Les asperges sont prêtes quand elles deviennent vert vif et que tu peux les piquer facilement."},"mar-n2":{"n":"Bol de petits pois à la feta","time":"5 min","ing":["1 boîte de petits pois cuits (400g)","50g de feta","1 c. à soupe d'huile d'olive","Jus d'½ citron","Menthe fraîche ou séchée","Sel"],"steps":["Égoutte et rince les petits pois. Mets-les dans un bol","Émiette la feta dessus. Assaisonne avec l'huile, le citron, la menthe et le sel. C'est prêt"],"tip":"Utilise des petits pois en boîte égouttés — ils sont déjà cuits. Les surgelés n'ont besoin que de 3 min au micro-ondes."},"abr-c1":{"n":"Riz aux fèves et au poulet","time":"20 min","ing":["1 blanc de poulet en morceaux","150g de fèves (fraîches ou surgelées)","½ tasse de riz","1 c. à soupe d'huile d'olive","1 gousse d'ail","Sel, persil","1 tomate (facultatif · râpée, en faisant revenir)"],"steps":["Mets le riz à cuire avec l'eau et le sel. 15-18 min selon le type","Fais sauter le poulet en morceaux avec l'huile et l'ail 5 min à feu moyen-vif jusqu'à ce qu'il soit doré","Ajoute les fèves au poulet. 5 min de plus à feu moyen. Sers avec le riz"],"tip":"Les fèves surgelées n'ont pas besoin d'être décongelées — elles vont directement à la poêle. Le temps de cuisson est le même."},"abr-c2":{"n":"Pâtes complètes aux asperges et à l'œuf","time":"15 min","ing":["80g de pâtes complètes","1 botte d'asperges vertes","1 œuf","2 c. à soupe d'huile d'olive","1 gousse d'ail","Sel, fromage râpé","1 tomate (facultatif · en dés)"],"steps":["Porte l'eau à ébullition avec du sel. Cuis les pâtes selon le paquet (8-10 min). Réserve un peu de l'eau","Fais sauter les asperges coupées avec l'ail et l'huile 4 min. Ajoute les pâtes égouttées et mélange","Fais un puits, casse l'œuf et remue le tout 1 min. Éteins, ajoute le fromage"],"tip":"Les pâtes complètes rassasient plus que les blanches et ont plus de fibres. Cuis-les al dente — tu les termineras à la poêle."},"abr-n1":{"n":"Omelette aux asperges","time":"10 min","ing":["1 botte d'asperges vertes","2 œufs","1 c. à soupe d'huile d'olive","Sel"],"steps":["Coupe les asperges en morceaux. Fais-les sauter avec l'huile et le sel 4 min à feu moyen","Bats les œufs avec le sel, verse sur les asperges. 3 min à feu doux sans remuer","Retourne-la à l'aide d'une assiette. 2 min de plus et c'est prêt"],"tip":"Coupe les asperges en morceaux de 2 cm — comme ça elles se répartissent bien dans toute l'omelette."},"abr-n2":{"n":"Velouté de petits pois","time":"12 min","ing":["250g de petits pois surgelés","½ oignon","1 verre de bouillon de légumes","1 c. à soupe d'huile d'olive","Menthe (facultatif)","Sel"],"steps":["Fais revenir l'oignon avec l'huile 3 min. Ajoute les petits pois et le bouillon","Porte à ébullition et cuis 8 min à feu moyen à couvert","Ajoute la menthe et le sel. Mixe jusqu'à ce que ce soit onctueux"],"tip":"Une touche de menthe au moment de mixer apporte beaucoup de fraîcheur. Sans mixeur, écrase à la fourchette — c'est plus rustique."},"may-c1":{"n":"Lentilles aux fèves et carotte","time":"18 min","ing":["1 boîte de lentilles cuites (400g)","150g de fèves surgelées","1 carotte","½ oignon","1 c. à soupe d'huile d'olive","Sel, cumin, paprika","1 tomate (facultatif · râpée, en faisant revenir)"],"steps":["Émince l'oignon et la carotte. Fais-les revenir avec l'huile 5 min à feu moyen","Ajoute les fèves surgelées et 1 verre d'eau. Cuis 8 min à couvert","Ajoute les lentilles égouttées, le sel, le cumin et le paprika. 5 min de plus et c'est prêt"],"tip":"Les fèves surgelées vont directement dans la casserole. Elles sont bien moins chères que les fraîches et tout aussi bonnes."},"may-c2":{"n":"Pâtes au thon et petits pois","time":"15 min","ing":["80g de pâtes complètes","100g de petits pois surgelés","1 boîte de thon au naturel","2 c. à soupe d'huile d'olive","Jus d'½ citron","Sel","2 c. à soupe de tomate concassée (facultatif)"],"steps":["Cuis les pâtes dans l'eau salée selon le paquet. Dans les 3 dernières min ajoute les petits pois dans la même casserole","Égoutte le tout. Mélange avec le thon égoutté, l'huile, le citron et le sel. C'est prêt"],"tip":"Le thon s'ajoute hors du feu à la fin — comme ça il reste moelleux et ne se dessèche pas. Ajoute un filet de citron pour rehausser la saveur."},"may-n1":{"n":"Œufs brouillés aux asperges et fromage","time":"8 min","ing":["2 œufs","1 botte d'asperges vertes","30g de fromage râpé","1 c. à soupe d'huile d'olive","Sel"],"steps":["Coupe les asperges en morceaux. Fais-les revenir avec l'huile 4 min à feu moyen","Bats les œufs avec du sel. Verse sur les asperges à feu moyen-doux en remuant doucement","Éteins quand ils sont encore crémeux. Ajoute le fromage râpé par-dessus"],"tip":"Le brouillé réussit mieux à feu moyen-doux en remuant lentement — les œufs restent crémeux, pas secs."},"may-n2":{"n":"Salade de fèves à la feta","time":"5 min","ing":["1 bocal de fèves cuites","50g de feta","Jus d'½ citron","2 c. à soupe d'huile d'olive","Menthe fraîche ou séchée","Sel","1 tomate (facultatif · en dés)"],"steps":["Égoutte et rince les fèves. Mets-les dans un bol","Ajoute la feta émiettée, le citron, l'huile, la menthe et le sel. Mélange doucement et c'est prêt"],"tip":"Les fèves en bocal sont déjà cuites — il suffit de les égoutter et de les rincer. Si tu utilises des surgelées, 3 min au micro-ondes."},"jun-c1":{"n":"Bol de quinoa aux courgettes","time":"15 min","ing":["½ tasse de quinoa","1 courgette","50g de feta","½ concombre","2 c. à soupe d'huile d'olive","Jus de citron","Sel","1 tomate (facultatif · en dés)"],"steps":["Fais bouillir la quinoa avec 1 tasse d'eau et du sel. À l'ébullition, baisse au minimum et couvre 12 min","Poêle la courgette en rondelles avec l'huile et le sel 4 min de chaque côté","Mélange la quinoa, la courgette, le concombre en morceaux et la feta. Assaisonne avec le citron et l'huile"],"tip":"Laisse refroidir la quinoa avant de la mélanger avec la courgette — comme ça le bol est bien frais."},"jun-c2":{"n":"Poulet aux poivrons et riz","time":"20 min","ing":["1 blanc de poulet en escalopes","1 poivron rouge ou vert","½ tasse de riz","1 c. à soupe d'huile d'olive","Sel, paprika, ail en poudre","1 tomate (facultatif · râpée, en faisant revenir)"],"steps":["Mets le riz à cuire avec de l'eau et du sel 18 min","Fais revenir le poulet 4 min. Ajoute le poivron en lanières et le paprika. Cuis 5 min de plus","Sers le poulet avec les poivrons sur le riz"],"tip":"Les poivrons ramollissent vite à la chaleur. Ne les couvre pas — comme ça ils cuisent sans vapeur et restent plus savoureux."},"jun-n1":{"n":"Gaspacho vert au pain","time":"5 min","ing":["1 gros concombre","½ courgette crue","2 c. à soupe d'huile d'olive","Jus d'½ citron","1 gousse d'ail","Sel","Pain complet"],"steps":["Coupe le concombre et la courgette crue non pelés en morceaux. Mets-les dans le bol du mixeur","Ajoute l'ail, l'huile, le citron et le sel. Mixe jusqu'à ce que ce soit lisse. Goûte le sel","Sers froid avec du pain complet. Si c'est trop épais, ajoute un peu d'eau"],"tip":"Mets tous les ingrédients au frigo 1 heure avant de les mixer — beaucoup plus frais et savoureux."},"jun-n2":{"n":"Omelette de courgette","time":"10 min","ing":["1 petite courgette","2 œufs","1 c. à soupe d'huile d'olive","Sel"],"steps":["Râpe ou coupe la courgette finement. Fais-la revenir avec l'huile et le sel 4 min jusqu'à ce que l'eau s'évapore","Bats les œufs avec du sel. Verse sur la courgette à feu moyen-doux. 3 min sans remuer","Retourne-la et 2 min de plus. C'est prêt"],"tip":"La courgette rend beaucoup d'eau — mets-la à la poêle avec du sel et attends qu'elle s'évapore avant d'ajouter les œufs."},"jul-c1":{"n":"Salade de pois chiches, concombre et maïs","time":"5 min","ing":["1 bocal de pois chiches (400g)","1 concombre","½ poivron rouge","½ boîte de maïs doux","Olives noires","2 c. à soupe d'huile d'olive","Sel, origan","1 tomate (facultatif · en dés)"],"steps":["Égoutte et rince les pois chiches. Mets-les dans un grand saladier","Coupe le concombre et le poivron. Ajoute au saladier avec le maïs et les olives","Assaisonne avec l'huile, le sel et l'origan. Mélange et à table"],"tip":"Le concombre et le poivron d'été sont croquants et bon marché. Le maïs en boîte apporte la touche sucrée."},"jul-c2":{"n":"Riz à l'aubergine et pois chiches","time":"20 min","ing":["1 aubergine","1 bocal de pois chiches (400g)","½ tasse de riz","1 c. à soupe d'huile d'olive","1 gousse d'ail","Sel, cumin, paprika","1 tomate (facultatif · râpée, en faisant revenir)"],"steps":["Mets le riz à cuire avec de l'eau et du sel 18 min","Pendant ce temps : fais revenir l'aubergine en dés avec l'ail et l'huile 8 min jusqu'à ce qu'elle soit dorée","Ajoute les pois chiches égouttés, le cumin et le paprika. 3 min de plus. Sers avec le riz"],"tip":"Coupe l'aubergine en dés et sale-la avant de la cuisiner — comme ça elle perd son amertume et absorbe moins d'huile."},"jul-n1":{"n":"Soupe froide de concombre au yaourt","time":"5 min","ing":["2 concombres","2 yaourts nature","1 petite gousse d'ail","2 c. à soupe d'huile d'olive","Jus d'½ citron","Sel, menthe"],"steps":["Épluche et coupe les concombres en morceaux. Mets-les dans le bol du mixeur","Ajoute le yaourt, l'ail, l'huile, le citron et le sel. Mixe 1 minute","Goûte le sel. Sers bien froide avec des feuilles de menthe"],"tip":"Prépare-la la veille et garde-la au frigo bien couverte — bien froide, elle est deux fois meilleure."},"jul-n2":{"n":"Poivron farci au thon","time":"15 min","ing":["2 poivrons (italiens ou piquillos)","2 boîtes de thon au naturel","2 c. à soupe d'huile d'olive","Sel, origan","Jus de citron","2 c. à soupe de tomate concassée (facultatif · dans la farce)"],"steps":["Mélange le thon égoutté avec l'huile, le citron, le sel et l'origan dans un bol","Coupe le haut des poivrons et vide les graines. Farcis avec le mélange de thon","Chauffe à la poêle couverte à feu moyen 8 min jusqu'à ce que le poivron soit tendre"],"tip":"Les poivrons italiens ou piquillos sont parfaits à farcir. Coupe le haut et vide les graines."},"ago-c1":{"n":"Bol de quinoa au pisto","time":"18 min","ing":["½ tasse de quinoa","1 courgette","1 poivron rouge","1 petite aubergine","1 c. à soupe d'huile d'olive","1 gousse d'ail","Sel, origan","2 tomates mûres (facultatif · pour la ratatouille)"],"steps":["Fais bouillir la quinoa avec de l'eau et du sel 12 min au minimum à couvert","Coupe tous les légumes en dés. Fais-les revenir avec l'ail et l'huile 10 min à feu moyen en remuant","Ajoute l'origan et le sel au pisto. Sers sur la quinoa"],"tip":"Le pisto est meilleur le lendemain — prépares-en le double et garde la moitié pour demain."},"ago-c2":{"n":"Saumon en papillote aux courgettes","time":"15 min","ing":["1 filet de saumon (150g)","1 courgette en rondelles","1 c. à soupe d'huile d'olive","Jus d'½ citron","Sel, aneth (facultatif)","Papier cuisson"],"steps":["Allume le four à 200°C. Mets la courgette en rondelles sur le papier cuisson","Pose le saumon dessus, ajoute l'huile, le citron et le sel. Plie le papier en fermant bien comme une enveloppe","Enfourne 12 min. Le paquet gonfle — c'est bon signe. Ouvre en faisant attention à la vapeur"],"tip":"Papillote = papier cuisson plié en enveloppe. La vapeur qui reste à l'intérieur cuit parfaitement le poisson."},"ago-n1":{"n":"Ajoblanco au melon","time":"10 min","ing":["50g d'amandes crues ou en poudre","1 tranche de pain rassis","1 petite gousse d'ail","3 c. à soupe d'huile d'olive","1 c. à soupe de vinaigre","1 verre d'eau très froide","Melon en dés"],"steps":["Fais tremper le pain dans l'eau. Mets-le dans le mixeur avec les amandes, l'ail, l'huile et le vinaigre","Ajoute le verre d'eau très froide et mixe jusqu'à ce que ce soit très fin","Sers bien froid avec les dés de melon par-dessus"],"tip":"Le pain rassis de la veille est parfait — il donne du corps. Si tu n'as pas de poudre d'amande, une poignée d'amandes crues fait l'affaire."},"ago-n2":{"n":"Aubergine grillée au fromage","time":"15 min","ing":["1 grosse aubergine","60g de mozzarella ou de fromage à fondre","1 c. à soupe d'huile d'olive","Sel, origan","1 tomate (facultatif · en rondelles)"],"steps":["Coupe l'aubergine en rondelles de 1 cm. Sale et laisse 5 min. Sèche avec du papier","Poêle avec l'huile à feu moyen-vif 4 min de chaque côté jusqu'à ce qu'elles soient dorées","Ajoute le fromage par-dessus, couvre 2 min jusqu'à ce qu'il fonde. Ajoute l'origan"],"tip":"Sale les rondelles 10 min avant de les cuisiner et sèche-les avec du papier — comme ça elles restent croustillantes et ne s'imbibent pas d'huile."},"sep-c1":{"n":"Velouté de potiron aux lentilles","time":"18 min","ing":["250g de potiron surgelé","1 bocal de lentilles cuites (400g)","½ oignon","1 verre de bouillon de légumes","1 c. à soupe d'huile d'olive","Sel, curcuma, gingembre"],"steps":["Fais revenir l'oignon avec l'huile 3 min. Ajoute le potiron surgelé et le bouillon","Porte à ébullition et cuis 12 min à couvert à feu moyen jusqu'à ce que le potiron soit tendre","Mixe. Ajoute les lentilles égouttées, le curcuma, le sel. Chauffe 3 min de plus"],"tip":"Le potiron surgelé est déjà coupé et épluché. C'est la version la plus pratique et la moins chère."},"sep-c2":{"n":"Riz aux champignons et poulet","time":"20 min","ing":["1 blanc de poulet en morceaux","150g de champignons (frais ou surgelés)","½ tasse de riz","1 c. à soupe d'huile d'olive","1 gousse d'ail","Sel, persil"],"steps":["Mets le riz à cuire avec de l'eau et du sel 18 min","Fais revenir le poulet avec l'huile et l'ail 5 min. Ajoute les champignons. Cuis 6 min sans couvrir","Ajoute le sel et le persil. Sers avec le riz"],"tip":"Les champignons n'ont pas besoin de beaucoup d'eau — ils cuisent dans leur propre jus. Ne mets pas de couvercle quand tu les fais revenir."},"sep-n1":{"n":"Soupe de champignons au pain","time":"12 min","ing":["150g de champignons variés","½ oignon","1 gousse d'ail","1L de bouillon de légumes","1 c. à soupe d'huile d'olive","Sel, persil","Pain complet"],"steps":["Hache l'oignon et l'ail. Fais revenir avec l'huile 3 min. Ajoute les champignons coupés et fais revenir 4 min","Ajoute le bouillon. Porte à ébullition et cuis 5 min. Ajoute le sel et le persil","Sers avec du pain complet grillé"],"tip":"Un filet de sauce soja à la fin intensifie beaucoup le goût. Juste une cuillère à café."},"sep-n2":{"n":"Quinoa à l'aubergine rôtie","time":"18 min","ing":["1 aubergine","½ tasse de quinoa","50g de feta","2 c. à soupe d'huile d'olive","Sel, origan","Jus de citron","1 tomate (facultatif · en dés)"],"steps":["Allume le four à 200°C. Coupe l'aubergine en dés, mélange avec l'huile et le sel. Enfourne 12 min","Fais bouillir la quinoa avec de l'eau et du sel 12 min au minimum à couvert","Mélange la quinoa avec l'aubergine rôtie, la feta émiettée, le citron et l'origan"],"tip":"L'aubergine rôtie au four est plus tendre et sans amertume qu'à la poêle. Ça vaut le coup d'allumer le four."},"oct-c1":{"n":"Bowl de courge et lentilles","time":"20 min","ing":["250g de courge (surgelée ou fraîche)","1 bocal de lentilles (400g)","½ tasse de riz","1 c. à soupe d'huile d'olive","Sel, cumin, curcuma"],"steps":["Mets le riz à cuire 18 min. En parallèle : mets la courge en dés dans une poêle avec l'huile à feu moyen","Cuis la courge 10 min en remuant jusqu'à ce qu'elle soit tendre. Ajoute le cumin et le curcuma","Ajoute les lentilles égouttées et le sel. Encore 2 min. Sers avec le riz"],"tip":"Tu peux utiliser de la courge surgelée ou en bocal pour aller plus vite. Le résultat est tout aussi bon."},"oct-c2":{"n":"Pâtes aux champignons et fromage","time":"18 min","ing":["80g de pâtes complètes","150g de champignons","30g de fromage râpé","1 gousse d'ail","2 c. à soupe d'huile d'olive","Sel, persil"],"steps":["Cuis les pâtes dans l'eau salée selon le paquet. Garde ½ verre de l'eau","Fais revenir les champignons avec l'ail et l'huile 6 min à feu moyen sans couvrir","Mélange les pâtes égouttées avec les champignons et un peu de l'eau réservée. Ajoute le fromage et le persil"],"tip":"Garde un peu de l'eau de cuisson des pâtes — elle aide à émulsionner la sauce pour qu'elle accroche bien aux pâtes."},"oct-n1":{"n":"Velouté de courge épicé","time":"12 min","ing":["300g de courge surgelée","½ oignon","1 verre de bouillon de légumes","½ boîte de lait de coco","1 c. à soupe d'huile d'olive","Gingembre en poudre, curcuma, sel"],"steps":["Fais revenir l'oignon avec l'huile 3 min. Ajoute la courge surgelée et le bouillon","Porte à ébullition et cuis 8 min à couvert. Éteins le feu","Mixe. Ajoute le lait de coco, le curcuma, le gingembre et le sel. Mélange et sers"],"tip":"Le lait de coco le rend plus crémeux et rassasiant. Sans lui, il reste délicieux avec juste le bouillon."},"oct-n2":{"n":"Champignons à l'œuf et à l'ail","time":"8 min","ing":["150g de champignons","1 gousse d'ail","1 œuf","1 c. à soupe d'huile d'olive","Sel, persil","Pain complet"],"steps":["Fais sauter les champignons avec l'ail et l'huile à feu vif 5 min sans couvrir. Sale à la fin","Fais un creux dans la poêle, fais frire l'œuf à feu moyen 2 min","Sers avec du pain complet et du persil haché"],"tip":"Ne mets pas de couvercle quand tu fais sauter les champignons — la vapeur les cuirait et ils deviendraient mous au 'à ce qu'ils perdent leur eau","Bats les œufs avec du sel et ajoute-les. Remue doucement jusqu'à ce qu'ils prennent. Grille le pain"],"tip":"Les épinards surgelés vont directement dans la poêle — ils rendent leur eau et en 3 minutes ils sont prêts."},"exp-n2":{"n":"Pois chiches sautés épicés","time":"10 min","ing":["1 bocal de pois chiches (400g)","Poignée d'épinards surgelés","1 c. à soupe d'huile d'olive","Paprika, cumin, sel","1 tomate (facultatif · en dés)"],"steps":["Égoutte les pois chiches. Fais-les sauter avec l'huile à feu moyen-vif 5 min jusqu'à ce qu'ils dorent","Ajoute les épinards surgelés, le paprika et le cumin. Encore 4 min et c'est prêt"],"tip":"Le paprika et le cumin transforment un bocal de pois chiches en quelque chose de délicieux. Ne les zappe pas."}},"lunch":"manger","dinner":"dîner"},"clean":[{"name":"Cuisine","day":1,"dayName":"Lunes","tasks":[{"n":"Ranger et dégager la cuisine","min":3,"tip":"Remets chaque chose à sa place avant de nettoyer"},{"n":"Nettoyer plans de travail et crédences","min":5,"tip":"Spray dégraissant, passe le chiffon de gauche à droite"},{"n":"Plaque ou feux","min":5,"tip":"Plaque froide, utilise le racloir pour les taches tenaces"},{"n":"Évier et robinet","min":3,"tip":"Un peu de nettoyant vitres sur le robinet le fait briller"},{"n":"Extérieur des appareils","min":3,"tip":"Frigo, micro-ondes, cafetière — juste la surface extérieure"},{"n":"Balayer et passer la serpillière","min":5,"tip":"Commence du fond et avance vers la porte"}]},{"name":"Salle de bain","day":2,"dayName":"Martes","tasks":[{"n":"Ranger le meuble","min":2,"tip":"Jette ce qui est périmé ou vide"},{"n":"Lavabo et robinet","min":4,"tip":"Laisse agir le nettoyant 2 minutes avant de rincer"},{"n":"Miroir et surfaces","min":3,"tip":"Papier journal avec nettoyant vitres — zéro trace"},{"n":"Toilettes dedans et dehors","min":5,"tip":"Commence par l’extérieur, finis par l’intérieur"},{"n":"Douche ou baignoire","min":4,"tip":"Spray anticalcaire sur le robinet p   h+='<p class="m">~'+day.mins+' '+L.min+'</p><a href="#run/'+d+'">'+L.start+'</a>';
  var u=uniq(day.items);for(var k=0;k<u.length;k++){var it=u[k],x=D.ex.info[it.id];
    h+='<div class="ex"><h3>'+esc(x.n)+'</h3><p class="m">'+it.dur+' '+L.sec+(it.sides===2?' ('+L.sides+')':'')+(x.zones.length?' &middot; '+L.works+': '+esc(x.zones.join(', ')):'')+'</p>'
      +'<img class="fig" src="fig/'+it.id+'.png" alt="'+esc(L.fig)+'">'
      +'<p><b>'+L.pos+':</b> '+esc(x.pos)+'</p>'+(x.exe?'<ol><li>'+esc(x.exe).split(' &middot; ').join('</li><li>').split(' · ').join('</li><li>').replace(/<li>\d+\.\s*/g,'<li>')+'</li></ol>':'')+'</div>';}
  return h;}
/* sesión: prepárate → ejercicio (→ cambio de lado) → descanso */
function run(d){var lv=get('lvl',0);S={d:d,items:dayOf(lv,d).items,i:0,ph:'prep',t:8,side:1,paused:false};tick0();}
function phaseLabel(){return S.ph==='prep'?L.prep:S.ph==='rest'?L.rest:S.ph==='switch'?L.side2:'';}
function drawRun(){if(!S)return;var it=S.items[S.i],x=D.ex.info[it.id],nx=S.items[S.i+1];
  var show=S.ph==='rest'&&nx?nx:it,sx=D.ex.info[show.id];
  H.innerHTML=bar('#ex/'+S.d)+'<p class="m">'+L.exOf.replace('{i}',S.i+1).replace('{n}',S.items.length)+'</p>'
   +'<p class="ph">'+(S.paused?L.pause:(S.ph==='rest'?L.rest+' &middot; '+L.next:phaseLabel()))+'</p>'
   +'<div class="big" id="t">'+S.t+'</div><h1 style="text-align:center">'+esc(sx.n)+(show.sides===2&&S.ph!=='rest'?' &middot; '+(S.side===1?L.side1:L.side2):'')+'</h1>'
   +'<img class="fig" style="margin:0 auto" src="fig/'+show.id+'.png" alt="">'
   +'<div class="row"><button class="b" onclick="pz()">'+(S.paused?L.resume:L.pause)+'</button><button class="b" onclick="nx()">'+L.next+'</button><button class="b" onclick="ex()">'+L.exit+'</button></div>'
   +'<p>'+esc(sx.pos)+'</p>';}
function tick0(){stop();drawRun();tm=setInterval(tick,1000);}
function tick(){if(!S||S.paused)return;S.t--;var e=document.getElementById('t');if(S.t>0){if(e)e.innerHTML=S.t;return;}adv();}
function adv(){var it=S.items[S.i];
  if(S.ph==='prep'||S.ph==='switch'){S.ph='work';S.t=it.dur;}
  else if(S.ph==='work'&&it.sides===2&&S.side===1){S.ph='switch';S.side=2;S.t=5;}
  else if(S.ph==='work'&&it.rest>0&&S.i<S.items.length-1){S.ph='rest';S.t=it.rest;}
  else{S.i++;S.side=1;if(S.i>=S.items.length){stop();var d=S.d;S=null;put('done_'+todayKey(),1);H.innerHTML=bar('#ex/'+d)+'<h1>'+L.done+'</h1><a href="#">'+L.back+'</a>';return;}S.ph='prep';S.t=5;}
  drawRun();}
function pz(){if(S){S.paused=!S.paused;drawRun();}}
function nx(){if(S){S.t=1;S.paused=false;adv();}}
function ex(){var d=S?S.d:dayIdx();stop();S=null;location.hash='#ex/'+d;}
/* ── Comida ── */
function food(){var m=D.food.months[new Date().getMonth()],h=bar('#')+'<h1>'+L.home[1]+' &middot; '+esc(m.name)+'</h1>';
  h+='<h2>'+L.lunch+'</h2>';for(var i=0;i<m.lunch.length;i++)h+='<a href="#r/'+m.lunch[i]+'">'+esc(D.food.recipes[m.lunch[i]].n)+' <span class="m">&middot; '+esc(D.food.recipes[m.lunch[i]].time)+'</span></a>';
  h+='<h2>'+L.dinner+'</h2>';for(var j=0;j<m.dinner.length;j++)h+='<a href="#r/'+m.dinner[j]+'">'+esc(D.food.recipes[m.dinner[j]].n)+' <span class="m">&middot; '+esc(D.food.recipes[m.dinner[j]].time)+'</span></a>';
  h+='<a href="#shop">'+L.shop+'</a>';return h;}
function recipe(id){var r=D.food.recipes[id];if(!r)return food();var h=bar('#food')+'<h1>'+esc(r.n)+'</h1><p class="m">'+esc(r.time)+'</p><h2>'+L.ing+'</h2><ul>';
  for(var i=0;i<r.ing.length;i++)h+='<li>'+esc(r.ing[i])+'</li>';h+='</ul><h2>'+L.steps+'</h2><ol>';
  for(var j=0;j<r.steps.length;j++)h+='<li>'+esc(r.steps[j])+'</li>';h+='</ol>'+(r.tip?'<p class="n"><b>'+L.tip+':</b> '+esc(r.tip)+'</p>':'');return h;}
function shop(){var m=D.food.months[new Date().getMonth()],k='shop_'+new Date().getMonth(),ck=get(k,{}),h=bar('#food')+'<h1>'+L.shop+'</h1>';
  for(var i=0;i<m.shop.length;i++){h+='<h2>'+esc(m.shop[i][0])+'</h2>';for(var j=0;j<m.shop[i][1].length;j++){var id=i+'_'+j;
    h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+id+'\',this.checked)"'+(ck[id]?' checked':'')+'>'+esc(m.shop[i][1][j])+'</label>';}}
  return h;}
function ck(k,id,v){var o=get(k,{});o[id]=v;put(k,o);}
/* ── Limpieza ── */
function zone(z,k){var h='<h2>'+esc(z.name)+' <span class="m">&middot; '+esc(z.dayName)+'</span></h2>',ck_=get(k,{});
  for(var i=0;i<z.tasks.length;i++){var t=z.tasks[i];h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+i+'\',this.checked)"'+(ck_[i]?' checked':'')+'><b>'+esc(t.n)+'</b> <span class="m">('+t.min+' '+L.min+')</span><br><span class="m">'+esc(t.tip)+'</span></label>';}
  return h;}
function clean(){var wd=new Date().getDay(),h=bar('#')+'<h1>'+L.home[2]+'</h1>',today=null,i;
  for(i=0;i<D.clean.length;i++)if(D.clean[i].day===wd)today=D.clean[i];
  h+=today?zone(today,'clean_'+todayKey()):'<p class="n">'+L.noclean+'</p>';
  h+='<h2>'+L.other+'</h2>';for(i=0;i<D.clean.length;i++)if(D.clean[i]!==today)h+='<a href="#zone/'+i+'">'+esc(D.clean[i].name)+' <span class="m">&middot; '+esc(D.clean[i].dayName)+'</span></a>';return h;}
/* ── Noche ── */
function night(){var h=bar('#')+'<h1>'+L.home[3]+'</h1>',k='night_'+todayKey(),c=get(k,{});
  for(var i=0;i<D.night.length;i++){var s=D.night[i];h+='<h2>'+(i+1)+'. '+esc(s.title)+'</h2><p>'+esc(s.desc)+'</p>';
    for(var j=0;j<s.list.length;j++){var id=i+'_'+j;h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+id+'\',this.checked)"'+(c[id]?' checked':'')+'>'+esc(s.list[j])+'</label>';}
    if(s.str.length){h+='<ul>';for(var q=0;q<s.str.length;q++)h+='<li><b>'+esc(s.str[q].n)+'</b> ('+esc(s.str[q].t)+'): '+esc(s.str[q].d)+'</li>';h+='</ul>';}}
  return h;}
/* ── Calma ── */
function calm(){var h=bar('#')+'<h1>'+L.home[4]+'</h1>';
  for(var j=0;j<D.calm.rescues.length;j++)h+='<a href="#res/'+j+'">'+esc(D.calm.rescues[j].name)+'<br><span class="m">'+esc(D.calm.rescues[j].when)+'</span></a>';
  h+='<div class="n">'+L.calmCall;for(var i=0;i<D.calm.crisis.length;i++)h+='<br><b>'+esc(D.calm.crisis[i][0])+'</b> &middot; '+esc(D.calm.crisis[i][1]);return h+'</div>';}
function rescue(j){var r=D.calm.rescues[j],h=bar('#calm')+'<h1>'+esc(r.name)+'</h1><p>'+esc(r.desc)+'</p><ol>';
  for(var i=0;i<r.steps.length;i++)h+='<li><b>'+esc(r.steps[i].t)+'</b> ('+r.steps[i].s+' '+L.sec+'): '+esc(r.steps[i].i)+'</li>';return h+'</ol>';}
/* ── Navegación por #ruta ── */
function route(){stop();S=null;var p=(location.hash||'#').slice(1).split('/'),h;
  if(p[0]==='lvl'){put('lvl',+p[1]);location.hash='#ex/'+p[2];return;}
  if(p[0]==='ex')h=exDay(p[1]?+p[1]:dayIdx());
  else if(p[0]==='run'){run(+p[1]);window.scrollTo(0,0);return;}
  else if(p[0]==='food')h=food();else if(p[0]==='r')h=recipe(p[1]);else if(p[0]==='shop')h=shop();
  else if(p[0]==='clean')h=clean();else if(p[0]==='zone')h=bar('#clean')+zone(D.clean[+p[1]],'clean_'+todayKey());
  else if(p[0]==='night')h=night();else if(p[0]==='calm')h=calm();else if(p[0]==='res')h=rescue(+p[1]);
  else h=home();
  H.innerHTML=h;window.scrollTo(0,0);}
window.onhashchange=route;route();
</script></body></html>
