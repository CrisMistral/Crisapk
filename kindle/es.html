aja solo, espalda recta, en 2 s · 3. Para cuando notes la parte de atrás del muslo · 4. Aprieta los glúteos y vuelve arriba en 2 s","tip":"Rodillas un poco sueltas, sin agacharte.","zones":["Glúteos","Muslo trasero"]},"catcow":{"n":"Gato y vaca","pos":"A cuatro patas. Manos bajo los hombros y rodillas bajo las caderas. Espalda recta, codos sin bloquear y mirada al suelo.","exe":"1. Vaca: saca el culete, pecho adelante, mira al frente (3 s) · 2. Vuelve a la espalda recta · 3. Gato: empuja el suelo, redondea la espalda, barbilla abajo (3 s) · 4. Encadena sin prisa.","tip":"Muévete con la respiración, sin forzar.","zones":["Espalda","Glúteos","Abdomen"]},"squat_half":{"n":"Media sentadilla","pos":"De pie, pies al ancho de caderas y puntas un poco hacia fuera. Peso en todo el pie. Espalda recta y brazos al frente.","exe":"1. Aprieta la barriga y lleva la cadera atrás · 2. Baja en 2 s hasta media altura · 3. Empuja el suelo con todo el pie y sube en 1 s · 4. Estira la cadera arriba sin bloquear las rodillas.","tip":"Las rodillas siguen la dirección de los pies. Peso en los talones.","zones":["Muslo delantero","Glúteos"]},"donkey":{"n":"Patada de glúteo","pos":"A cuatro patas. Manos bajo los hombros y rodillas bajo la cadera. Espalda recta, mirada al suelo.","exe":"1. Aprieta la barriga para que la espalda no se mueva · 2. Con la rodilla doblada, sube el talón hacia el techo en 1 s · 3. Aprieta el glúteo 1 s arriba · 4. Baja en 2 s sin apoyar del todo. Luego, la otra pierna","tip":"Sube solo hasta donde la espalda no se arquea.","zones":["Glúteos","Muslo trasero"]},"bridge":{"n":"Puente de glúteo","pos":"Tumbada boca arriba, rodillas dobladas. Pies al ancho de caderas, a un palmo de los glúteos. Brazos junto al cuerpo, palmas abajo.","exe":"1. Aprieta la barriga y pega un poco la espalda baja al suelo · 2. Empuja con los talones y sube la cadera en 1 s · 3. Aprieta los glúteos 1 s arriba · 4. Baja en 2 s, vértebra a vértebra.","tip":"Empuja con los talones. No arquees la zona lumbar.","zones":["Glúteos","Muslo trasero"]},"goodmorning":{"n":"Buenos días","pos":"De pie, pies al ancho de caderas. Rodillas un poco sueltas. Brazos cruzados en el pecho.","exe":"1. Aprieta la barriga · 2. Lleva la cadera atrás e inclina el cuerpo en 3 s, espalda recta · 3. Baja hasta casi la horizontal o hasta donde la espalda siga recta · 4. Aprieta los glúteos y sube en 2 s","tip":"Baja solo hasta donde la espalda siga recta.","zones":["Glúteos","Muslo trasero"]},"calfraise":{"n":"Elevación de talones","pos":"De pie, pies al ancho de caderas y paralelos. Rodillas estiradas pero sin bloquear. Brazos a los lados y mirada a un punto fijo.","exe":"1. Sube de puntillas en 1 s, peso en el dedo gordo · 2. Para un instante arriba, tobillos rectos · 3. Baja en 2 s hasta que el talón casi roce el suelo · 4. Repite sin rebotar.","tip":"Mira un punto fijo delante para mantener el equilibrio.","zones":["Gemelos","Glúteos"]},"squathold_half":{"n":"Media sentadilla mantenida","pos":"De pie, pies al ancho de caderas y puntas un poco hacia fuera. Brazos al frente para equilibrarte.","exe":"1. Lleva la cadera atrás y baja en 2 s a media altura · 2. Peso en todo el pie, rodillas hacia el segundo dedo · 3. Quédate ahí respirando el tiempo marcado · 4. Sube en 2 s","tip":"Si tiemblan las piernas, sube un poco: también cuenta.","zones":["Muslo delantero","Glúteos"]},"lowlunge":{"n":"Zancada baja","pos":"Rodilla de atrás en la esterilla, empeine apoyado. Pie de delante plano, rodilla encima del tobillo. Manos en la rodilla o la cadera.","exe":"1. Mete un poco la pelvis (culo hacia abajo) · 2. Lleva la cadera un poco adelante hasta tirantez suave · 3. Tronco alto y costillas abajo · 4. Quédate así y cambia de lado","tip":"Pon algo blando bajo la rodilla si molesta.","zones":["Cadera","Muslo delantero"]},"gluteknee":{"n":"Rodilla al pecho","pos":"Tumbada boca arriba, cabeza apoyada. Una pierna estirada en la esterilla. Abraza la rodilla de la otra pierna con las 2 manos.","exe":"1. Acerca la rodilla al pecho en 3 s · 2. Llévala un poco hacia el hombro contrario hasta notar el glúteo · 3. Afloja 1 s sin soltar · 4. Repite suave y, al cambiar, haz la otra pierna","tip":"Si no llegas a la rodilla, sujeta por detrás del muslo.","zones":["Glúteos","Espalda"]},"pushup_knee":{"n":"Flexión con rodillas","pos":"Rodillas en la esterilla, separadas como tu cadera. Manos debajo de los hombros. Cuerpo recto de rodillas a cabeza y mirada al suelo.","exe":"1. Aprieta la barriga y los glúteos · 2. Baja en 2 s con los codos en diagonal hacia atrás · 3. Para con el pecho a un puño del suelo · 4. Empuja el suelo en 1 s y estira sin bloquear","tip":"Codos a unos 45 grados del cuerpo, no abiertos del todo.","zones":["Pecho","Hombros"]},"shouldertap_knee":{"n":"Toques de hombro con rodillas","pos":"Plancha alta con rodillas apoyadas: manos debajo de los hombros. Rodillas algo más separadas que la cadera. Cuerpo recto de rodillas a cabeza.","exe":"1. Aprieta barriga y glúteos, empuja el suelo con las 2 manos · 2. Lleva una mano al hombro contrario en 1 s · 3. Devuélvela debajo del hombro en 1 s · 4. Cambia de mano sin girar la cadera","tip":"Separa un poco las rodillas para estar más estable.","zones":["Abdomen","Hombros"]},"floordip":{"n":"Fondos en el suelo","pos":"Sentada, con las manos detrás de la cadera y los dedos hacia ti. Rodillas dobladas en ángulo recto, pies planos. Levanta un poco la cadera y abre el pecho.","exe":"1. Baja los hombros lejos de las orejas, cadera arriba · 2. Dobla los codos hacia atrás en 2 s, como máximo en ángulo recto · 3. Empuja en 1 s y estira los codos sin bloquear","tip":"Nivel fácil: movimiento pequeño. Hombros lejos de las orejas.","zones":["Brazos","Hombros"]},"downdog":{"n":"Perro boca abajo pedaleando","pos":"Empieza a cuatro patas, con los dedos de las manos abiertos. Sube la cadera hasta formar una V al revés. Brazos junto a las orejas y cabeza relajada.","exe":"1. Empuja el suelo y aleja el pecho de las manos · 2. Dobla una rodilla mientras el otro talón baja, en 1 a 2 s · 3. Alterna con ritmo, sin mover la cadera","tip":"Puedes tener las rodillas dobladas: lo importante es la espalda larga.","zones":["Hombros","Abdomen"]},"plank_knee":{"n":"Plancha con rodillas","pos":"Antebrazos o manos debajo de los hombros. Rodillas apoyadas detrás, cadera estirada. Cuerpo recto de rodillas a cabeza y mirada al suelo.","exe":"1. Empuja el suelo y separa un poco los omóplatos · 2. Aprieta barriga y glúteos, cadera recta · 3. Aguanta el tiempo indicado sin perder la línea","tip":"Mira al suelo para no forzar el cuello.","zones":["Abdomen","Glúteos"]},"proneW":{"n":"Pecho arriba, brazos atrás","pos":"Tumbada boca abajo, frente cerca del suelo. Brazos estirados junto al cuerpo, palmas hacia el suelo. Piernas relajadas.","exe":"1. Baja los hombros lejos de las orejas · 2. Junta los omóplatos y despega pecho y brazos en 1 s · 3. Aguanta 1 s con los brazos estirados hacia los pies · 4. Baja en 2 s","tip":"Sube poco: el trabajo está en la espalda alta.","zones":["Espalda alta","Espalda","Hombros"]},"childpose":{"n":"Postura del niño","pos":"De rodillas en la esterilla, dedos gordos de los pies juntos. Rodillas separadas como tu cadera o más. Siéntate sobre los talones.","exe":"1. Desliza las manos adelante hasta estirar los brazos · 2. Apoya la frente en la esterilla · 3. Deja caer los glúteos hacia los talones · 4. Suelta hombros y cuello, y quédate así","tip":"Separa las rodillas si te resulta más cómodo.","zones":["Espalda","Abdomen"]},"tricepstretch":{"n":"Estiramiento de tríceps","pos":"De pie, pies separados como tu cadera. Rodillas sin bloquear y espalda recta. Hombros sueltos.","exe":"1. Sube un brazo y dobla el codo, mano entre los omóplatos · 2. Con la otra mano empuja suave el codo atrás · 3. Costillas abajo, sin arquear la espalda · 4. Quédate así y cambia de brazo","tip":"Mantén el cuello relajado.","zones":["Brazos","Espalda","Abdomen"]},"deadbug_easy":{"n":"Bicho muerto fácil","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos estirados hacia el techo. Pega la espalda baja a la esterilla.","exe":"1. Aprieta la barriga como un cinturón y baja las costillas · 2. Baja un talón en 2 s, rodilla doblada, hasta rozar el suelo · 3. Vuelve a la mesa en 1 s · 4. Cambia de pierna sin mover la cadera","tip":"La zona lumbar pegada a la esterilla.","zones":["Abdomen"]},"crunch":{"n":"Encogimiento","pos":"Túmbate boca arriba con las rodillas dobladas. Pies apoyados, separados como tu cadera. Dedos en las sienes o brazos cruzados. Deja un puño entre barbilla y pecho.","exe":"1. Aprieta la barriga y acerca las costillas a la cadera · 2. Sube cabeza y hombros en 1 s, hasta despegar los omóplatos · 3. Pausa 1 s · 4. Baja en 2-3 s sin soltar del todo","tip":"Deja un puño de espacio entre barbilla y pecho.","zones":["Abdomen"]},"legraise_single":{"n":"Elevación de una pierna","pos":"Túmbate boca arriba con las piernas estiradas. Brazos a los lados con las palmas abajo, o manos bajo los glúteos. Pega la espalda baja a la esterilla.","exe":"1. Aprieta la barriga y deja la cadera quieta · 2. Sube una pierna estirada en 2 s, hasta apuntar al techo · 3. Bájala en 3 s sin tocar el suelo · 4. Cambia de pierna","tip":"Manos bajo los glúteos si notas la lumbar.","zones":["Abdomen"]},"birddog_easy":{"n":"Perro de caza fácil","pos":"Ponte a cuatro patas. Manos bajo los hombros y rodillas bajo la cadera. Espalda recta, sin hundirla ni redondearla. Mirada al suelo y barriga apretada.","exe":"1. Estira un brazo al frente en 2 s, a la altura del hombro · 2. Vuelve y estira la pierna contraria atrás en 2 s · 3. Súbela solo hasta la altura de la cadera y vuelve · 4. Cambia de lado sin mover la cadera","tip":"Espalda plana como una mesa.","zones":["Espalda","Glúteos"]},"hollow_tuck":{"n":"Barquito recogido","pos":"Túmbate boca arriba con las rodillas dobladas encima de la cadera. Cabeza y omóplatos despegados. Brazos estirados junto a los muslos. Espalda baja pegada.","exe":"1. Mete un poco el culo y pega la espalda baja al suelo · 2. Despega cabeza y omóplatos con las costillas abajo · 3. Recoge las rodillas encima de la cadera · 4. Aguanta el tiempo indicado, respirando","tip":"Cuanto más cerca las rodillas, más fácil.","zones":["Abdomen"]},"sphinx":{"n":"Esfinge","pos":"Boca abajo, piernas estiradas y separadas como tu cadera. Empeines en el suelo. Antebrazos en la esterilla, codos debajo de los hombros.","exe":"1. Empuja el suelo con los antebrazos y sube el pecho · 2. Lleva los hombros abajo y atrás · 3. Pubis en el suelo y glúteos sueltos · 4. Mira al frente con el cuello largo y quédate","tip":"Si molesta la lumbar, adelanta los codos.","zones":["Abdomen","Pecho"]},"kneehug":{"n":"Rodillas al pecho","pos":"Boca arriba, cabeza y hombros apoyados. Lleva las dos rodillas al pecho. Abrázalas por debajo de las rodillas o por las espinillas.","exe":"1. Acerca las rodillas al pecho con tirantez suave · 2. Deja la zona lumbar apoyada · 3. Mécete lento de lado a lado, poquito · 4. Vuelve al centro y suelta","tip":"Es un masaje para la zona lumbar.","zones":["Espalda"]},"swimming":{"n":"Natación","pos":"Túmbate boca abajo con las piernas juntas y estiradas. Brazos al frente, separados como tus hombros. Frente un poco despegada y mirada al suelo.","exe":"1. Aprieta barriga y glúteos, hombros lejos de las orejas · 2. Sube brazo derecho y pierna izquierda un poco en 1 s · 3. Baja en 1 s sin apoyar del todo · 4. Cambia de lado con ritmo tranquilo","tip":"Mira al suelo para no forzar el cuello.","zones":["Espalda","Glúteos"]},"proneY":{"n":"Elevaciones en Y","pos":"Túmbate boca abajo con los brazos estirados en Y, a unos 45 grados de la cabeza. Pulgares arriba y frente cerca del suelo. Piernas estiradas y glúteos apretados.","exe":"1. Lleva los omóplatos atrás y abajo · 2. Sube los brazos en Y en 1 s, pecho casi quieto · 3. Pausa corta arriba · 4. Baja en 2 s","tip":"Los hombros bajan lejos de las orejas.","zones":["Espalda alta","Espalda","Hombros"]},"bear":{"n":"Oso","pos":"Ponte a cuatro patas, con las manos bajo los hombros y las rodillas bajo la cadera. Apoya las puntas de los pies. Espalda plana y mirada al suelo.","exe":"1. Empuja el suelo con las manos y aprieta la barriga · 2. Despega las rodillas 2 cm en 1 s · 3. Aguanta el tiempo indicado sin mover la espalda · 4. Apoya las rodillas con control","tip":"Si cuesta mucho, baja las rodillas y vuelve a subir.","zones":["Abdomen","Muslo delantero"]},"climber_slow":{"n":"Escalador lento","pos":"Ponte en plancha alta, con las manos bajo los hombros. Cuerpo recto de cabeza a talones. Pies separados como la cadera, barriga y glúteos apretados.","exe":"1. Lleva una rodilla hacia el pecho en 2 s · 2. Pausa corta, con la cadera quieta · 3. Devuelve el pie atrás en 2 s · 4. Cambia de pierna","tip":"Hombros encima de las manos.","zones":["Abdomen","Cadera"]},"lunge_short":{"n":"Zancada corta atrás","pos":"De pie, pies al ancho de caderas. Espalda recta y barriga firme. Manos en la cintura o al frente.","exe":"1. Da un paso corto atrás y apoya la punta · 2. Dobla las 2 rodillas en 2 s hasta media altura · 3. Empuja con el talón de delante y vuelve en 1 s · 4. Cambia de pierna.","tip":"Mantén el peso en la pierna de delante. Hazlo despacio para no perder el equilibrio.","zones":["Muslo delantero","Glúteos"]},"burpee_step":{"n":"Burpee sin salto","pos":"De pie, con los pies separados como la cadera. Brazos relajados, espalda recta y barriga un poco apretada.","exe":"1. Dobla cadera y rodillas y apoya las manos bajo los hombros · 2. Lleva un pie atrás y luego el otro, hasta la plancha · 3. Vuelve paso a paso, pies cerca de las manos · 4. Ponte de pie estirando la cadera","tip":"Sin prisa: cada paso bien hecho.","zones":["Muslo delantero","Glúteos"]},"hamstring":{"n":"Estiramiento de isquios","pos":"Boca arriba. Una pierna estirada, o doblada con el pie en el suelo. Sube la otra y sujétala detrás del muslo o de la pantorrilla.","exe":"1. Sube la pierna con la rodilla casi estirada · 2. Acércala hasta notar tirantez suave detrás del muslo · 3. Pelvis y zona lumbar apoyadas · 4. Quédate así y cambia de pierna","tip":"Puedes doblar un poco la rodilla.","zones":["Muslo trasero","Gemelos"]},"pelvictilt":{"n":"Báscula de pelvis","pos":"Tumbada boca arriba, rodillas dobladas, pies al ancho de caderas. Brazos junto al cuerpo.","exe":"1. Pega la espalda baja a la esterilla · 2. Sigue enrollando y despega un poco la cadera en 2 s · 3. Quédate 1 s · 4. Baja en 2 s, vértebra a vértebra","tip":"Es un movimiento pequeño y suave.","zones":["Espalda","Glúteos"]},"breathe":{"n":"Respiración final","pos":"Boca arriba, piernas estiradas o rodillas dobladas. Brazos sueltos o una mano en la barriga. Ojos cerrados.","exe":"1. Coge aire por la nariz en 4 tiempos, hinchando barriga y costillas · 2. Suéltalo en 6 tiempos, suave y seguido · 3. Deja que el cuerpo pese sobre la esterilla · 4. Repite varias veces","tip":"Deja que el cuerpo pese sobre la esterilla.","zones":["Glúteos","Abdomen"]},"rockback":{"n":"Balanceo a cuatro patas","pos":"A cuatro patas. Manos bajo los hombros. Rodillas más separadas que la cadera y pies más juntos, empeines en la esterilla.","exe":"1. Espalda larga, mirada al suelo · 2. Lleva la cadera atrás hacia los talones en 3 s · 3. Quédate 1 s donde notes la cara interna del muslo · 4. Vuelve a cuatro patas en 3 s","tip":"Baja solo hasta donde estés cómoda.","zones":["Muslo interior","Glúteos"]},"sidequad":{"n":"Cuádriceps de lado","pos":"Tumbada de lado, cabeza sobre el brazo de abajo. Cuerpo en línea recta. Pierna de abajo algo doblada para no caerte.","exe":"1. Dobla la rodilla de arriba y sujeta el tobillo · 2. Lleva el talón hacia el glúteo · 3. Rodillas juntas y pelvis un poco hacia dentro (culo metido) · 4. Quédate así y cambia de lado","tip":"Si no llegas al tobillo, sujeta el pantalón.","zones":["Muslo delantero","Cadera"]},"yogisquat":{"n":"Sentadilla profunda","pos":"De pie, pies algo más abiertos que la cadera. Puntas un poco hacia fuera. Manos juntas delante del pecho.","exe":"1. Baja despacio doblando cadera y rodillas · 2. Rodillas en la línea de los pies · 3. Codos por dentro de las rodillas, ábrelas suave · 4. Pecho alto, quédate así y sube despacio","tip":"Si los talones se levantan, abre más los pies.","zones":["Muslo interior","Glúteos"]},"childreach":{"n":"Del niño a cuatro patas","pos":"A cuatro patas. Manos debajo de los hombros y rodillas debajo de la cadera. Espalda recta y mirada al suelo.","exe":"1. Suelta aire y lleva la cadera a los talones · 2. Para 1 o 2 s con los brazos estirados · 3. Coge aire y vuelve despacio a cuatro patas · 4. Repite con calma","tip":"Déjate caer suave, sin forzar.","zones":["Glúteos","Espalda"]},"cobra":{"n":"Cobra suave","pos":"Boca abajo, piernas estiradas y separadas como tu cadera. Empeines en el suelo. Manos debajo de los hombros y codos pegados al cuerpo.","exe":"1. Coge aire y sube el pecho con la espalda · 2. Codos algo doblados y hombros abajo · 3. Pubis y cadera siguen en el suelo · 4. Suelta aire y baja despacio","tip":"La altura no importa. Nada de dolor.","zones":["Abdomen","Pecho"]},"seatedfwd":{"n":"Pinza sentada","pos":"Sentada sobre los huesos del culo, piernas estiradas y juntas. Puntas de los pies hacia ti. Espalda larga y manos en los muslos.","exe":"1. Coge aire y crece hacia el techo · 2. Suelta aire e inclínate desde la cadera, no desde la espalda · 3. Desliza las manos hacia los pies hasta tirantez suave · 4. Quédate así y sube despacio","tip":"Dobla las rodillas si tiran mucho.","zones":["Muslo trasero","Gemelos"]},"shouldercircle":{"n":"Círculos de hombros","pos":"De pie o sentada, espalda recta. Pies separados como tu cadera. Yemas de los dedos en los hombros, codos hacia delante.","exe":"1. Dibuja círculos grandes con los codos · 2. Deja que los omóplatos se muevan también · 3. A mitad de tiempo, cambia de sentido · 4. Ritmo lento y controlado","tip":"A mitad, cambia de sentido.","zones":["Hombros","Espalda alta","Espalda"]},"neck":{"n":"Movilidad de cuello","pos":"De pie o sentada, espalda recta. Hombros bajos y sueltos, brazos relajados. Lleva la barbilla suave hacia el pecho.","exe":"1. Espalda alta y hombros bajos · 2. Baja la barbilla al pecho en 3 s · 3. Quédate 1 s notando la nuca · 4. Vuelve a mirar al frente en 3 s","tip":"Nunca eches la cabeza hacia atrás.","zones":["Espalda alta","Espalda"]},"squat":{"n":"Sentadilla","pos":"De pie, pies al ancho de caderas o algo más. Puntas un poco hacia fuera. Espalda recta y brazos al frente, a la altura del pecho.","exe":"1. Aprieta la barriga y lleva la cadera atrás y abajo · 2. Baja en 3 s hasta muslos casi paralelos al suelo · 3. Empuja el suelo y sube en 1 s · 4. Aprieta los glúteos arriba sin arquear la espalda.","tip":"Espalda larga y talones pegados al suelo. Brazos al frente para equilibrarte.","zones":["Muslo delantero","Glúteos"]},"lunge":{"n":"Zancada atrás","pos":"De pie, pies al ancho de caderas. Espalda recta y barriga firme. Manos en la cintura, mirada al frente.","exe":"1. Da un paso largo atrás, pies al ancho de caderas · 2. Baja en 2 s, rodillas en ángulo recto, sin tocar el suelo · 3. Empuja con el talón de delante y vuelve en 1 s · 4. Cambia de pierna.","tip":"La rodilla de delante queda encima del tobillo. Tronco recto.","zones":["Muslo delantero","Glúteos"]},"bridgehold":{"n":"Puente mantenido","pos":"Tumbada boca arriba, rodillas dobladas. Pies al ancho de caderas, a un palmo de los glúteos. Brazos junto al cuerpo, palmas abajo.","exe":"1. Empuja con los talones y sube la cadera en 2 s · 2. Forma una línea recta de rodillas a hombros, costillas abajo · 3. Aguanta con glúteos apretados el tiempo marcado · 4. Baja en 2 o 3 s, vértebra a vértebra.","tip":"Si notas la lumbar, baja un poco la cadera.","zones":["Glúteos","Muslo trasero"]},"squathold":{"n":"Sentadilla isométrica","pos":"De pie, pies al ancho de caderas y puntas un poco hacia fuera. Espalda recta. Brazos al frente, a la altura del pecho.","exe":"1. Lleva la cadera atrás y baja en 3 s · 2. Para a media altura, o más abajo si puedes · 3. Aguanta quieta, barriga firme y peso en los talones · 4. Al terminar, sube en 2 s.","tip":"Nivel fácil: quédate a media altura.","zones":["Muslo delantero","Glúteos"]},"pushup":{"n":"Flexión","pos":"Plancha alta (brazos estirados): manos debajo de los hombros. Pies separados como tu cadera. Cuerpo recto de talones a cabeza y mirada al suelo.","exe":"1. Aprieta barriga y glúteos, rodillas estiradas · 2. Baja en 2 s con los codos en diagonal hacia atrás · 3. Para con el pecho a un puño del suelo · 4. Empuja en 1 s y separa un poco los omóplatos","tip":"Si se hunde la cadera, pasa a flexión con rodillas.","zones":["Pecho","Hombros"]},"shouldertap":{"n":"Toques de hombro en plancha","pos":"Plancha alta: manos debajo de los hombros. Pies algo más separados que la cadera y piernas estiradas. Cuerpo recto de talones a cabeza.","exe":"1. Aprieta glúteos y barriga, empuja el suelo · 2. Toca el hombro contrario en 1 s · 3. Devuelve la mano debajo del hombro en 1 s · 4. Cambia de mano sin mover la cadera","tip":"Pies más separados = más fácil; pies juntos = más difícil.","zones":["Abdomen","Hombros"]},"pike":{"n":"Flexión en pica","pos":"V al revés: manos separadas como tus hombros. Pies a 1 metro de las manos. Cadera alta, piernas estiradas o rodillas un poco dobladas. Mira entre tus manos.","exe":"1. Pasa el peso a las manos con la cadera alta · 2. Baja en 2 s doblando los codos hacia atrás · 3. Acerca la cabeza al suelo, por delante de las manos · 4. Empuja en 1 s hasta estirar los brazos","tip":"Trabaja los hombros. Acerca los pies a las manos para hacerla más difícil.","zones":["Hombros","Brazos"]},"plank":{"n":"Plancha","pos":"Manos debajo de los hombros y brazos estirados sin bloquear. Piernas estiradas, pies separados como tu cadera. Cuerpo recto de talones a cabeza.","exe":"1. Empuja el suelo y aleja el pecho de las manos · 2. Aprieta glúteos y muslos, ombligo hacia dentro · 3. Aguanta el tiempo indicado respirando con calma","tip":"Si se hunde la lumbar, apoya las rodillas.","zones":["Abdomen","Glúteos"]},"plankdog":{"n":"Plancha a perro","pos":"Plancha alta: manos debajo de los hombros con los dedos abiertos. Pies separados como tu cadera. Cuerpo recto. Más fácil: rodillas apoyadas.","exe":"1. Aprieta la barriga y empuja el suelo · 2. Sube la cadera arriba y atrás en 2 s, hasta la V al revés · 3. Vuelve a la plancha en 2 s, hombros sobre las manos","tip":"Nivel fácil: hazlo con las rodillas apoyadas en la plancha.","zones":["Hombros","Abdomen"]},"deadbug":{"n":"Bicho muerto","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos estirados hacia el techo. Pega la espalda baja a la esterilla.","exe":"1. Aprieta la barriga como un cinturón y baja las costillas · 2. Estira un brazo atrás y la pierna contraria en 2 s · 3. Para antes de tocar el suelo. Vuelve a la mesa en 1 s · 4. Cambia de lado","tip":"Exhala al estirar. Si la lumbar se despega, no estires tanto.","zones":["Abdomen"]},"crunch_tt":{"n":"Encogimiento con piernas en mesa","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Dedos en las sienes. Pega la espalda baja a la esterilla.","exe":"1. Deja las piernas quietas en mesa y aprieta la barriga · 2. Sube cabeza y hombros en 1 s, hasta despegar los omóplatos · 3. Pausa 1 s · 4. Baja en 2-3 s sin mover las piernas","tip":"Exhala al subir.","zones":["Abdomen"]},"sideplank":{"n":"Plancha lateral","pos":"Túmbate de lado con las piernas estiradas. Apoya el antebrazo con el codo bajo el hombro. Pies uno encima del otro, o el de arriba delante. Cuerpo en línea.","exe":"1. Empuja el suelo con el antebrazo y aprieta la barriga · 2. Sube la cadera en 1 s: línea recta de cabeza a pies · 3. Aguanta sin girar el tronco · 4. Baja con control y cambia de lado","tip":"Para hacerlo más fácil, apoya la rodilla de abajo.","zones":["Abdomen","Espalda"]},"reversecrunch":{"n":"Encogimiento inverso","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos a los lados, palmas abajo. Espalda baja pegada.","exe":"1. Aprieta la barriga y baja las costillas · 2. Enrolla la pelvis en 1 s, rodillas al pecho, glúteos algo despegados · 3. Pausa 1 s · 4. Baja en 3 s hasta la mesa","tip":"Sin impulso: el movimiento es pequeño.","zones":["Abdomen"]},"birddog":{"n":"Perro de caza","pos":"Ponte a cuatro patas. Manos bajo los hombros y rodillas bajo la cadera. Espalda recta, sin hundirla ni redondearla. Mirada al suelo y barriga apretada.","exe":"1. Aprieta la barriga como un cinturón · 2. Estira un brazo y la pierna contraria a la vez en 2 s · 3. Pausa 1 s en línea recta · 4. Vuelve en 2 s y cambia de lado","tip":"Imagina un vaso de agua sobre la espalda que no se puede caer.","zones":["Espalda","Glúteos"]},"hollow":{"n":"Barquito","pos":"Túmbate boca arriba con los brazos estirados por encima de la cabeza. Piernas juntas y estiradas. Cabeza, omóplatos, brazos y piernas despegados unos centímetros.","exe":"1. Mete un poco el culo y pega la espalda baja al suelo · 2. Despega cabeza y omóplatos, brazos junto a las orejas · 3. Sube las piernas estiradas hasta donde la espalda siga pegada · 4. Aguanta respirando","tip":"Sube más las piernas si se despega la lumbar.","zones":["Abdomen"]},"superman":{"n":"Superman","pos":"Túmbate boca abajo con brazos y piernas estirados. Piernas juntas y empeines en el suelo. Mirada al suelo y barriga un poco apretada.","exe":"1. Aprieta glúteos y lleva los omóplatos atrás y abajo · 2. Sube brazos, pecho y piernas un palmo en 1 s · 3. Aguanta 1 s arriba · 4. Baja en 2 s con control","tip":"Aprieta los glúteos para proteger la zona lumbar.","zones":["Espalda","Glúteos"]},"bridgemarch":{"n":"Puente con marcha","pos":"Tumbada boca arriba, rodillas dobladas. Pies al ancho de caderas, a un palmo de los glúteos. Brazos junto al cuerpo, apretando el suelo.","exe":"1. Sube la cadera al puente, en línea de rodillas a hombros · 2. Peso en un talón, sube la otra rodilla en 2 s · 3. Apoya el pie sin que baje la cadera · 4. Cambia de pierna. Al terminar, baja en 2 s.","tip":"Si la cadera baja, haz el puente normal.","zones":["Glúteos","Muslo trasero"]},"climber":{"n":"Escalador","pos":"Ponte en plancha alta, con las manos bajo los hombros. Cuerpo recto de cabeza a talones. Pies separados como la cadera, barriga y glúteos apretados.","exe":"1. Lleva una rodilla al pecho · 2. Cámbiala por la otra con un paso ágil, en puntas · 3. Mantén unos 2 cambios por segundo · 4. No rebotes con la cadera","tip":"La cadera baja, en línea con los hombros.","zones":["Abdomen","Cadera"]},"jumpsquat":{"n":"Sentadilla con salto","pos":"De pie, pies al ancho de caderas y puntas un poco hacia fuera. Espalda recta. Brazos a los lados, listos para impulsar.","exe":"1. Baja en 2 s a sentadilla, cadera atrás · 2. Salta con fuerza y lanza los brazos arriba · 3. Cae sobre la punta y apoya luego el talón, rodillas dobladas · 4. Quédate estable 1 s y repite.","tip":"Si no puedes saltar (vecinos, rodillas), haz sentadillas con 3 segundos de pausa abajo.","zones":["Muslo delantero","Glúteos"]},"lunge_knee":{"n":"Zancada con rodilla arriba","pos":"De pie, pies al ancho de caderas. Espalda recta y barriga firme. Brazos a los lados o en la cintura. Mira un punto fijo.","exe":"1. Da un paso largo atrás y baja en 2 s · 2. Empuja con el talón de delante y sube en 1 s · 3. Sin apoyar, sube la rodilla de atrás y aguanta 1 s · 4. Repite con la misma pierna o cambia.","tip":"Si te desequilibras, apoya el pie un momento antes de subir la rodilla.","zones":["Muslo delantero","Glúteos"]},"bridge1leg":{"n":"Puente a una pierna","pos":"Tumbada boca arriba. Apoya un pie en el centro, rodilla doblada. Estira la otra pierna, muslos a la misma altura. Palmas contra el suelo.","exe":"1. Aprieta la barriga y pega un poco la espalda baja · 2. Empuja con el talón y sube la cadera en 1 s · 3. Aguanta 1 s arriba, cadera a la misma altura · 4. Baja en 2 s. A mitad de tiempo, cambia de pierna.","tip":"La cadera sube recta, sin torcerse hacia un lado.","zones":["Glúteos","Muslo trasero"]},"sldl":{"n":"Peso muerto a una pierna","pos":"De pie sobre una pierna, rodilla un poco suelta. La otra pierna, justo detrás, con la punta en el suelo. Brazos colgando.","exe":"1. Aprieta la barriga y mira al suelo · 2. Inclina el cuerpo en 3 s mientras la otra pierna sube atrás · 3. Cuerpo y pierna en línea recta, cadera mirando al suelo · 4. Vuelve arriba en 2 s apretando el glúteo de apoyo","tip":"Si pierdes el equilibrio, apoya la punta del pie de atrás.","zones":["Glúteos","Muslo trasero"]},"calfraise_slow":{"n":"Talones lentos con pausa","pos":"De pie, pies al ancho de caderas y paralelos. Rodillas estiradas pero sin bloquear. Brazos a los lados y mirada a un punto fijo.","exe":"1. Sube en 1 s lo más alto posible, sobre el dedo gordo · 2. Aguanta 2 s arriba sin balancearte · 3. Baja en 3 s, muy controlada · 4. Roza el suelo con el talón y repite.","tip":"Cuanto más lento, más trabajan los gemelos.","zones":["Gemelos"]},"pushup_slow":{"n":"Flexión lenta","pos":"Plancha alta: manos debajo de los hombros, pies separados como tu cadera. Cuerpo recto de talones a cabeza. Si pierdes la línea, apoya las rodillas.","exe":"1. Aprieta glúteos y barriga · 2. Baja contando 3 s, codos en diagonal hacia atrás · 3. Sube contando 3 s, siempre a la misma velocidad · 4. Estira los codos sin bloquear y repite","tip":"La lentitud es la dificultad: no hace falta hacer muchas.","zones":["Pecho","Hombros"]},"shouldertap_hard":{"n":"Toques de hombro, pies juntos","pos":"Plancha alta: manos debajo de los hombros. Pies juntos, piernas estiradas y glúteos apretados. Cuerpo recto de talones a cabeza.","exe":"1. Aprieta glúteos, muslos y barriga · 2. Lleva la mano al hombro contrario en 2 s · 3. Devuélvela debajo del hombro en 2 s · 4. Cambia de mano sin girar cadera ni hombros","tip":"Cuenta dos segundos en cada toque.","zones":["Abdomen","Hombros"]},"floordip_leg":{"n":"Fondos con pierna estirada","pos":"Sentada, manos detrás de la cadera y dedos hacia ti. Una rodilla doblada con el pie plano. La otra pierna estirada, talón en el suelo. Cadera alta y recta.","exe":"1. Sube la cadera apretando el glúteo de la pierna doblada · 2. Dobla los codos hacia atrás en 2 s, hasta ángulo recto · 3. Empuja en 1 s y estira sin bloquear · 4. A mitad de la serie, cambia de pierna","tip":"Mantén la cadera alta todo el rato.","zones":["Brazos","Hombros"]},"pike_slow":{"n":"Flexión en pica lenta","pos":"V al revés con los pies algo más cerca de las manos, a unos 70 u 80 centímetros. Manos separadas como tus hombros. Cadera alta y mirada entre las manos.","exe":"1. Pasa el peso a las manos · 2. Baja contando 3 s, codos hacia atrás · 3. Pausa breve con la cabeza a 2 o 3 centímetros del suelo · 4. Empuja en 1 s hasta estirar los brazos","tip":"Codos hacia atrás, no hacia los lados.","zones":["Hombros","Brazos"]},"plankleg":{"n":"Plancha con pierna arriba","pos":"Plancha alta: manos debajo de los hombros, pies separados como tu cadera. Cuerpo recto de talones a cabeza. Cadera recta, sin ladearse.","exe":"1. Aprieta la barriga y empuja el suelo · 2. Sube una pierna estirada un palmo en 1 s · 3. Aguanta 1 s y baja en 1 s · 4. Cambia de pierna sin mover la cadera","tip":"La cadera no se gira al subir la pierna.","zones":["Glúteos","Muslo trasero"]},"deadbug_slow":{"n":"Bicho muerto lento","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos estirados hacia el techo. Pega la espalda baja a la esterilla.","exe":"1. Desde la mesa, aprieta la barriga como un cinturón · 2. Estira un brazo y la pierna contraria en 3 s · 3. Pausa 1 s con la espalda baja pegada · 4. Vuelve en 2 s y cambia de lado","tip":"La lentitud es lo que lo hace difícil.","zones":["Abdomen"]},"situp":{"n":"Abdominal completo","pos":"Túmbate boca arriba con las rodillas dobladas. Pies apoyados, separados como tu cadera. Brazos estirados al frente o cruzados en el pecho.","exe":"1. Despega cabeza y omóplatos, como en un encogimiento · 2. Sigue enrollándote hasta sentarte en 2 s · 3. Baja en 3 s, apoyando la espalda vértebra a vértebra · 4. Apoya los hombros y repite","tip":"Si tiras del cuello, lleva los brazos al frente.","zones":["Abdomen"]},"sideplank_dip":{"n":"Plancha lateral con bajadas","pos":"Ponte en plancha de lado sobre el antebrazo y el borde del pie. Codo bajo el hombro. Cuerpo recto de cabeza a pies y barriga apretada.","exe":"1. Empieza en plancha de lado con la cadera en línea · 2. Baja la cadera en 2 s, casi hasta el suelo · 3. Súbela en 1 s, un poco por encima de la línea · 4. Termina las repeticiones y cambia de lado","tip":"Movimiento controlado, sin tirones.","zones":["Abdomen","Espalda"]},"legraise":{"n":"Elevación de piernas","pos":"Túmbate boca arriba con las piernas juntas y estiradas. Brazos a los lados con las palmas abajo, o manos bajo los glúteos. Espalda baja pegada y costillas abajo.","exe":"1. Aprieta la barriga y pega la espalda baja a la esterilla · 2. Sube las piernas en 2 s, hasta apuntar al techo · 3. Baja en 3 s solo mientras la espalda siga pegada · 4. Repite sin tocar el suelo","tip":"Si la lumbar se despega, dobla un poco las rodillas.","zones":["Abdomen"]},"birddog_crunch":{"n":"Perro de caza con codo a rodilla","pos":"Ponte a cuatro patas. Manos bajo los hombros y rodillas bajo la cadera. Espalda recta, sin hundirla ni redondearla. Mirada al suelo y barriga apretada.","exe":"1. Estira un brazo y la pierna contraria en 2 s · 2. Pausa 1 s en línea recta · 3. Junta codo y rodilla bajo el cuerpo en 2 s, espalda redonda · 4. Haz la mitad de repeticiones y cambia de lado","tip":"Hazlo lento para no perder el equilibrio.","zones":["Abdomen"]},"hollowrock":{"n":"Barquito balanceo","pos":"Ponte en barquito: espalda baja pegada al suelo y costillas abajo. Brazos junto a las orejas. Piernas estiradas y despegadas del suelo.","exe":"1. Haz el barquito con la espalda baja pegada · 2. Balancéate hacia la cabeza en 1 s sin cambiar la forma · 3. Balancéate hacia los pies en 1 s · 4. Sigue con ritmo constante. Si pierdes la forma, aguanta quieta","tip":"Si se rompe la forma, vuelve a aguantar quieta.","zones":["Abdomen"]},"supermanhold":{"n":"Superman mantenido","pos":"Túmbate boca abajo con brazos y piernas estirados. Piernas juntas, mirada al suelo y barriga apretada.","exe":"1. Aprieta glúteos y lleva los omóplatos atrás y abajo · 2. Sube brazos, pecho y piernas en 2 s, a altura que aguantes · 3. Aguanta el tiempo indicado sin bajar · 4. Baja en 2 s","tip":"Mejor poca altura bien hecha que mucha forzada.","zones":["Espalda","Glúteos"]},"proneY_slow":{"n":"Elevaciones en Y con pausa","pos":"Túmbate boca abajo con los brazos estirados en Y, a unos 45 grados de la cabeza. Pulgares arriba y mirada al suelo. Piernas estiradas y glúteos apretados.","exe":"1. Lleva los omóplatos atrás y abajo · 2. Sube los brazos en Y en 2 s · 3. Aguanta 2 s apretando entre los omóplatos · 4. Baja en 2 s","tip":"Nada de impulso: sube con la espalda.","zones":["Espalda alta","Espalda","Hombros"]},"swimming_fast":{"n":"Natación rápida","pos":"Túmbate boca abajo con brazos y piernas estirados. Despega un poco el pecho y las piernas. Mirada al suelo y glúteos apretados.","exe":"1. Sube un poco pecho, brazos y piernas · 2. Alterna brazo y pierna contrarios con movimientos cortos y rápidos · 3. Haz unos 2 cambios por segundo · 4. Mantén la misma altura hasta el final","tip":"Respira con calma aunque el ritmo sea rápido.","zones":["Espalda","Glúteos"]},"burpee":{"n":"Burpee","pos":"De pie, con los pies separados como la cadera. Brazos relajados, espalda recta y barriga un poco apretada.","exe":"1. Agáchate y apoya las manos bajo los hombros · 2. Salta atrás a plancha, con la cadera en línea · 3. Salta con los pies junto a las manos · 4. Salta, brazos arriba, y aterriza en puntas con rodillas dobladas","tip":"Si necesitas, quita el salto final.","zones":["Muslo delantero","Glúteos"]}},"lv":["Fácil","Medio","Difícil"],"sec":{"warm":"Calentamiento","main":"Circuito · {r} rondas","cool":"Vuelta a la calma","st":"Estiramientos"}},"food":{"months":[{"name":"Enero","lunch":["ene-c1","ene-c2","dic-c1","dic-c2","feb-c1","feb-c2","exp-c1"],"dinner":["ene-n1","ene-n2","dic-n1","dic-n2","feb-n1","feb-n2","exp-n1"],"shop":[["Frescos: fruta y verdura",["Brócoli","Cebolla","Espinacas","Limón","Puerro","Tomate","Zanahoria"]],["Congelados",["Brócoli congelado","Coliflor congelada"]],["Conservas y botes",["Caldo de verduras","Garbanzos","Lentejas","Lentejas cocidas"]],["Huevos y lácteos",["Huevo","Queso feta","Queso rallado"]],["Carne y pescado",["Pechuga de pollo","Salmón"]],["Cereales y frutos secos",["Arroz","Arroz blanco","Pan integral","Pan integral para acompañar","Quinoa"]]]},{"name":"Febrero","lunch":["feb-c1","feb-c2","dic-c1","dic-c2","ene-c1","ene-c2","exp-c1"],"dinner":["feb-n1","feb-n2","dic-n1","dic-n2","ene-n1","ene-n2","exp-n1"],"shop":[["Frescos: fruta y verdura",["Brócoli","Cebolla","Espinacas","Limón","Puerro","Tomate","Zanahoria"]],["Congelados",["Brócoli congelado","Coliflor congelada"]],["Conservas y botes",["Caldo de verduras","Garbanzos","Lentejas","Lentejas cocidas"]],["Huevos y lácteos",["Huevo","Queso feta","Queso rallado"]],["Carne y pescado",["Pechuga de pollo","Salmón"]],["Cereales y frutos secos",["Arroz","Arroz blanco","Pan integral","Pan integral para acompañar","Quinoa"]]]},{"name":"Marzo","lunch":["mar-c1","mar-c2","abr-c1","abr-c2","may-c1","may-c2","exp-c1"],"dinner":["mar-n1","mar-n2","abr-n1","abr-n2","may-n1","may-n2","exp-n1"],"shop":[["Frescos: fruta y verdura",["Cebolla","Guisantes","Guisantes cocidos","Habas","Habas cocidas","Limón","Manojo espárragos","Manojo espárragos verdes","Tomate","Tomate triturado", zos","Lentejas","Lentejas cocidas"]],["Huevos y lácteos",["Huevo","Queso feta","Queso rallado"]],["Carne y pescado",["Pechuga de pollo","Salmón"]],["Cereales y frutos secos",["Arroz","Arroz blanco","Pan integral","Pan integral para acompañar","Quinoa"]]]}],"recipes":{"ene-c1":{"n":"Sopa de Puerro y Lentejas","time":"20 min","ing":["1 puerro","2 zanahorias","1 bote lentejas cocidas (400g)","1L caldo de verduras","1 cda aceite de oliva","Sal, comino","1 tomate (opcional · rallado, al rehogar)"],"steps":["Corta el puerro y zanahoria en rodajas. Rehoga con aceite en olla a fuego medio 5 min removiendo","Añade el caldo, sube el fuego hasta que hierva, baja a medio y cocina 10 min tapado","Escurre las lentejas y añádelas con sal y comino. 5 min más removiendo y lista"],"tip":"Usa lentejas de bote — ya están cocidas. Solo necesitan 5 min de calor para absorber el sabor."},"ene-c2":{"n":"Arroz con Brócoli y Huevo","time":"18 min","ing":["½ taza arroz blanco","150g brócoli congelado","1 huevo","1 taza agua","1 cda aceite de oliva","Sal, ajo en polvo","1 tomate (opcional · en dados, por encima al servir)"],"steps":["Pon arroz, agua y sal en olla. Hierve, baja al mínimo, tapa. Pon 15 min de alarma","A los 10 min: pon el brócoli congelado encima del arroz sin mezclar. Tapa de nuevo","Fríe el huevo en sartén aparte con aceite. Sirve arroz+brócoli con el huevo encima y ajo en polvo"],"tip":"El brócoli congelado va directo a la olla sin descongelar. El huevo puede ir frito si no dominas el pochado."},"ene-n1":{"n":"Crema de Coliflor","time":"15 min","ing":["300g coliflor congelada","½ cebolla","1 vaso caldo de verduras","1 cda aceite de oliva","Sal, nuez moscada","Pan integral para acompañar"],"steps":["Pica la cebolla. Rehoga con aceite en olla 3 min a fuego medio","Añade la coliflor congelada y el caldo. Sube el fuego. Al hervir, baja a medio y tapa 10 min","Tritura con batidora de mano, añade sal y nuez moscada. Sirve con pan integral"],"tip":"Tritura bien para que quede suave. Un chorrito de leche de coco al final la hace más cremosa."},"ene-n2":{"n":"Tortilla de Puerro","time":"10 min","ing":["1 puerro (parte blanca)","2 huevos","1 cda aceite de oliva","Sal","1 tomate (opcional · en rodajas, para acompañar)"],"steps":["Corta el puerro en rodajas finas. Rehoga con aceite 5 min a fuego medio hasta que ablande","Bate huevos con sal. Vierte sobre el puerro a fuego medio-bajo. 3 min sin mover","Dale la vuelta con un plato. 2 min más y lista"],"tip":"Rehoga bien el puerro hasta que esté transparente — así no sabe crudo dentro de la tortilla."},"feb-c1":{"n":"Bowl de Espinacas y Garbanzos","time":"10 min","ing":["1 bote garbanzos (400g)","2 puñados espinacas frescas","30g queso feta","Zumo de ½ limón","2 cdas aceite de oliva","Sal, comino","1 tomate (opcional · en dados)"],"steps":["Escurre y lava los garbanzos con agua fría","Pon las espinacas en un bowl, añade los garbanzos y el feta desmenuzado","Aliña con limón, aceite, sal y comino. Mezcla y a comer"],"tip":"Si las espinacas son frescas, están listas tal cual. Si son congeladas, descongela y escurre bien."},"feb-c2":{"n":"Pollo con Brócoli al Limón","time":"20 min","ing":["1 pechuga de pollo fileteada","150g brócoli congelado","½ taza arroz","1 limón","1 cda aceite de oliva","Sal, ajo en polvo"],"steps":["Pon arroz con agua y sal en olla. Hierve, baja al mínimo, tapa 15 min. A los 10 min añade el brócoli encima","Sala el pollo. Sartén con aceite a fuego medio-alto. 4 min sin moverlo. Voltea","4 min más, exprime el limón encima y apaga. Sirve con arroz y brócoli"],"tip":"No muevas el pollo hasta que se despegue solo de la sartén — así queda dorado y jugoso."},"feb-n1":{"n":"Crema de Brócoli y Cúrcuma","time":"12 min","ing":["250g brócoli congelado","½ cebolla","1 vaso caldo de verduras","1 cda aceite de oliva","½ cdita cúrcuma","Pizca pimienta negra","Sal"],"steps":["Rehoga cebolla con aceite 3 min. Añade brócoli congelado y caldo","Hierve y cocina 8 min tapado a fuego medio","Añade cúrcuma, pimienta y sal. Tritura hasta que quede suave"],"tip":"La cúrcuma necesita un poquito de pimienta negra para activarse. Añade una pizca al triturar."},"feb-n2":{"n":"Espinacas con Huevo Pochado","time":"8 min","ing":["2 puñados espinacas","1 huevo","1 diente ajo (o ajo en polvo)","1 cda aceite de oliva","Sal","Pan integral"],"steps":["Saltea las espinacas con ajo y aceite 3 min a fuego medio hasta que reduzcan","En paralelo: hierve agua, añade pizca de vinagre, remueve y echa el huevo. 3 min","Sirve espinacas con el huevo encima y pan integral al lado"],"tip":"Para el huevo pochado: agua hirviendo con una pizca de vinagre, remueve para hacer un remolino y echa el huevo. 3 min."},"mar-c1":{"n":"Quinoa con Espárragos y Huevo","time":"15 min","ing":["½ taza quinoa prelavada","1 manojo espárragos","2 huevos","1 cda aceite de oliva","Zumo de ½ limón","Sal","1 tomate (opcional · en dados)"],"steps":["Hierve quinoa con 1 taza agua y sal. Al hervir, baja al mínimo y tapa 12 min","Cuece los huevos 8 min en agua hirviendo. Enfría y pela","Plancha los espárragos con aceite y sal 4 min. Sirve todo junto con limón"],"tip":"Los espárragos blancos de bote también sirven. Escúrrelos y hazlos 2 min a la plancha."},"mar-c2":{"n":"Arroz con Guisantes y Atún","time":"18 min","ing":["½ taza arroz","100g guisantes (congelados o de bote)","1 lata atún al natural","1 cda aceite de oliva","Sal, perejil (opcional)","1 tomate (opcional · rallado, al rehogar)"],"steps":["Hierve arroz con agua y sal 15-18 min. En los últimos 5 min añade los guisantes encima","Escurre el atún. Mezcla arroz+guisantes con el atún, aceite y sal"],"tip":"El atún va al final, fuera del fuego — así no se reseca. Escúrrelo bien del aceite de la lata."},"mar-n1":{"n":"Espárragos a la Plancha con Huevo","time":"8 min","ing":["1 manojo espárragos verdes","1 huevo","1 cda aceite de oliva","Sal gruesa","Pan integral"],"steps":["Calienta sartén a fuego fuerte con aceite. Plancha los espárragos 4 min con sal","En la misma sartén baja el fuego y fríe el huevo. 2 min","Sirve espárragos con el huevo encima y pan integral"],"tip":"Los espárragos están listos cuando cambian a verde brillante y puedes pincharlos fácilmente."},"mar-n2":{"n":"Bowl de Guisantes con Feta","time":"5 min","ing":["1 bote guisantes cocidos (400g)","50g queso feta","1 cda aceite de oliva","Zumo de ½ limón","Menta fresca o seca","Sal"],"steps":["Escurre y lava los guisantes. Ponlos en un bowl","Desmenúzales el feta encima. Aliña con aceite, limón, menta y sal. Listo"],"tip":"Usa guisantes de bote escurridos — ya están cocidos. Los congelados necesitan solo 3 min de microondas."},"abr-c1":{"n":"Arroz con Habas y Pollo","time":"20 min","ing":["1 pechuga pollo en trozos","150g habas (frescas o congeladas)","½ taza arroz","1 cda aceite de oliva","1 diente ajo","Sal, perejil","1 tomate (opcional · rallado, al rehogar)"],"steps":["Pon el arroz a cocer con agua y sal. 15-18 min según el tipo","Saltea el pollo en trozos con aceite y ajo 5 min a fuego medio-alto hasta que esté dorado","Añade las habas al pollo. 5 min más a fuego medio. Sirve con el arroz"],"tip":"Las habas congeladas no necesitan descongelarse — van directas a la sartén. El tiempo de cocción es el mismo."},"abr-c2":{"n":"Pasta Integral con Espárragos y Huevo","time":"15 min","ing":["80g pasta integral","1 manojo espárragos verdes","1 huevo","2 cdas aceite de oliva","1 diente ajo","Sal, queso rallado","1 tomate (opcional · en dados)"],"steps":["Hierve agua con sal. Cuece la pasta según el paquete (8-10 min). Reserva un poco del agua","Saltea espárragos cortados con ajo y aceite 4 min. Añade la pasta escurrida y mezcla","Haz un hueco, casca el huevo y remueve todo 1 min. Apaga, añade queso"],"tip":"La pasta integral sacia más que la blanca y tiene más fibra. Cuécela al dente — luego termina en la sartén."},"abr-n1":{"n":"Tortilla de Espárragos","time":"10 min","ing":["1 manojo espárragos verdes","2 huevos","1 cda aceite de oliva","Sal"],"steps":["Corta espárragos en trozos. Saltea con aceite y sal 4 min a fuego medio","Bate los huevos con sal, vierte sobre los espárragos. 3 min a fuego bajo sin mover","Dale la vuelta con un plato. 2 min más y lista"],"tip":"Corta los espárragos en trozos de 2 cm — así se reparten bien por toda la tortilla."},"abr-n2":{"n":"Crema de Guisantes","time":"12 min","ing":["250g guisantes congelados","½ cebolla","1 vaso caldo de verduras","1 cda aceite de oliva","Menta (opcional)","Sal"],"steps":["Rehoga cebolla con aceite 3 min. Añade guisantes y caldo","Hierve y cocina 8 min a fuego medio tapado","Añade menta y sal. Tritura hasta que quede suave"],"tip":"Un toque de menta al triturar le da mucha frescura. Sin batidora, aplasta con tenedor — queda más rústica."},"may-c1":{"n":"Lentejas con Habas y Zanahoria","time":"18 min","ing":["1 bote lentejas cocidas (400g)","150g habas congeladas","1 zanahoria","½ cebolla","1 cda aceite de oliva","Sal, comino, pimentón","1 tomate (opcional · rallado, al rehogar)"],"steps":["Pica cebolla y zanahoria. Rehoga con aceite 5 min a fuego medio","Añade las habas congeladas y 1 vaso de agua. Cocina 8 min tapado","Añade las lentejas escurridas, sal, comino y pimentón. 5 min más y listo"],"tip":"Las habas congeladas van directas a la olla. Son mucho más baratas que las frescas y igual de buenas."},"may-c2":{"n":"Pasta con Atún y Guisantes","time":"15 min","ing":["80g pasta integral","100g guisantes congelados","1 lata atún al natural","2 cdas aceite de oliva","Zumo de ½ limón","Sal","2 cdas tomate triturado (opcional)"],"steps":["Cuece la pasta en agua con sal según el paquete. En los últimos 3 min añade los guisantes a la misma olla","Escurre todo. Mezcla con atún escurrido, aceite, limón y sal. Listo"],"tip":"El atún va fuera del fuego al final — así queda jugoso y no se reseca. Añade un chorrito de limón para potenciar el sabor."},"may-n1":{"n":"Revuelto de Espárragos y Queso","time":"8 min","ing":["2 huevos","1 manojo espárragos verdes","30g queso rallado","1 cda aceite de oliva","Sal"],"steps":["Corta espárragos en trozos. Saltea con aceite 4 min a fuego medio","Bate los huevos con sal. Vierte sobre los espárragos a fuego medio-bajo removiendo suave","Apaga cuando todavía estén cremosos. Añade queso rallado encima"],"tip":"El revuelto sale mejor a fuego medio-bajo y removiendo lentamente — los huevos quedan cremosos, no secos."},"may-n2":{"n":"Ensalada de Habas con Feta","time":"5 min","ing":["1 bote habas cocidas","50g queso feta","Zumo de ½ limón","2 cdas aceite de oliva","Menta fresca o seca","Sal","1 tomate (opcional · en dados)"],"steps":["Escurre y lava las habas. Ponlas en un bowl","Añade el feta desmenuzado, limón, aceite, menta y sal. Mezcla suavemente y listo"],"tip":"Las habas de bote están cocidas — solo hay que escurrirlas y lavarlas. Si usas congeladas, 3 min en microondas."},"jun-c1":{"n":"Bowl de Quinoa con Calabacín","time":"15 min","ing":["½ taza quinoa","1 calabacín","50g queso feta","½ pepino","2 cdas aceite de oliva","Zumo de limón","Sal","1 tomate (opcional · en dados)"],"steps":["Hierve quinoa con 1 taza agua y sal. Al hervir baja al mínimo y tapa 12 min","Plancha el calabacín en rodajas con aceite y sal 4 min por lado","Mezcla quinoa, calabacín, pepino en trozos y feta. Aliña con limón y aceite"],"tip":"Deja enfriar la quinoa antes de mezclarla con el calabacín — así el bowl está fresquito."},"jun-c2":{"n":"Pollo con Pimientos y Arroz","time":"20 min","ing":["1 pechuga pollo fileteada","1 pimiento rojo o verde","½ taza arroz","1 cda aceite de oliva","Sal, pimentón, ajo en polvo","1 tomate (opcional · rallado, al rehogar)"],"steps":["Pon arroz a cocer con agua y sal 18 min","Saltea el pollo 4 min. Añade pimiento en tiras y pimentón. Cocina 5 min más","Sirve pollo con pimientos encima del arroz"],"tip":"Los pimientos se ablandan rápido con el calor. No los tapes — así se hacen sin vapor y quedan más sabrosos."},"jun-n1":{"n":"Gazpacho Verde con Pan","time":"5 min","ing":["1 pepino grande","½ calabacín crudo","2 cdas aceite de oliva","Zumo de ½ limón","1 diente ajo","Sal","Pan integral"],"steps":["Trocea pepino y calabacín crudo sin pelar. Ponlos en el vaso de la batidora","Añade ajo, aceite, limón y sal. Tritura hasta que quede suave. Prueba de sal","Sirve frío con pan integral. Si queda muy espeso añade un poco de agua"],"tip":"Mete todos los ingredientes en la nevera 1 hora antes de triturarlo — mucho más fresco y rico."},"jun-n2":{"n":"Tortilla de Calabacín","time":"10 min","ing":["1 calabacín pequeño","2 huevos","1 cda aceite de oliva","Sal"],"steps":["Ralla o corta el calabacín fino. Saltea con aceite y sal 4 min hasta que el agua evapore","Bate los huevos con sal. Vierte sobre el calabacín a fuego medio-bajo. 3 min sin mover","Dale la vuelta y 2 min más. Lista"],"tip":"El calabacín suelta mucha agua — ponlo en la sartén con sal y espera a que evapore antes de echar los huevos."},"jul-c1":{"n":"Ensalada de Garbanzos, Pepino y Maíz","time":"5 min","ing":["1 bote garbanzos (400g)","1 pepino","½ pimiento rojo","½ lata maíz dulce","Aceitunas negras","2 cdas aceite de oliva","Sal, orégano","1 tomate (opcional · en dados)"],"steps":["Escurre y lava los garbanzos. Pon en un bol grande","Trocea el pepino y el pimiento. Añade al bol con el maíz y las aceitunas","Aliña con aceite, sal y orégano. Mezcla y a comer"],"tip":"El pepino y el pimiento de verano están crujientes y baratos. El maíz de lata da el toque dulce."},"jul-c2":{"n":"Arroz con Berenjena y Garbanzos","time":"20 min","ing":["1 berenjena","1 bote garbanzos (400g)","½ taza arroz","1 cda aceite de oliva","1 diente ajo","Sal, comino, pimentón","1 tomate (opcional · rallado, al rehogar)"],"steps":["Pon arroz a cocer con agua y sal 18 min","Mientras: saltea berenjena en dados con ajo y aceite 8 min hasta que esté dorada","Añade garbanzos escurridos, comino y pimentón. 3 min más. Sirve con el arroz"],"tip":"Corta la berenjena en dados y sala antes de cocinarla — así pierde el amargor y absorbe menos aceite."},"jul-n1":{"n":"Sopa Fría de Pepino y Yogur","time":"5 min","ing":["2 pepinos","2 yogures naturales","1 diente ajo pequeño","2 cdas aceite de oliva","Zumo de ½ limón","Sal, menta o hierbabuena"],"steps":["Pela y trocea los pepinos. Ponlos en el vaso de la batidora","Añade yogur, ajo, aceite, limón y sal. Tritura 1 minuto","Prueba de sal. Sirve muy fría con hojitas de menta"],"tip":"Prepárala la noche anterior y guárdala en la nevera bien tapada — muy fría sabe el doble de buena."},"jul-n2":{"n":"Pimiento Relleno de Atún","time":"15 min","ing":["2 pimientos (italianos o de piquillo)","2 latas atún al natural","2 cdas aceite de oliva","Sal, orégano","Zumo de limón","2 cdas tomate triturado (opcional · en el relleno)"],"steps":["Mezcla el atún escurrido con aceite, limón, sal y orégano en un bowl","Corta la parte superior de los pimientos y vacía las semillas. Rellena con la mezcla de atún","Calienta en sartén tapada a fuego medio 8 min hasta que el pimiento esté tierno"],"tip":"Los pimientos italianos o de piquillo son perfectos para rellenar. Corta la parte superior y vacía las semillas."},"ago-c1":{"n":"Bowl de Quinoa con Pisto","time":"18 min","ing":["½ taza quinoa","1 calabacín","1 pimiento rojo","1 berenjena pequeña","1 cda aceite de oliva","1 diente ajo","Sal, orégano","2 tomates maduros (opcional · para el pisto)"],"steps":["Hierve quinoa con agua y sal 12 min al mínimo tapado","Trocea todas las verduras en dados. Saltea con ajo y aceite 10 min a fuego medio removiendo","Añade orégano y sal al pisto. Sirve sobre la quinoa"],"tip":"El pisto mejora de un día para otro — prepara el doble y guarda la mitad para mañana."},"ago-c2":{"n":"Salmón al Papillote con Calabacín","time":"15 min","ing":["1 filete salmón (150g)","1 calabacín en rodajas","1 cda aceite de oliva","Zumo de ½ limón","Sal, eneldo (opcional)","Papel de horno"],"steps":["Enciende horno a 200°C. Pon el calabacín en rodajas sobre papel de horno","Coloca el salmón encima, añade aceite, limón y sal. Dobla el papel cerrando bien como un sobre","Hornea 12 min. El paquete se infla — es buena señal. Abre con cuidado del vapor"],"tip":"Papillote = papel de horno doblado en sobre. El vapor que queda dentro cocina perfectamente el pescado."},"ago-n1":{"n":"Ajoblanco con Melón","time":"10 min","ing":["50g almendras crudas o molidas","1 rebanada pan duro","1 diente ajo pequeño","3 cdas aceite de oliva","1 cda vinagre","1 vaso agua muy fría","Melón en dados"],"steps":["Remoja el pan en agua. Ponlo en la batidora con almendras, ajo, aceite y vinagre","Añade el vaso de agua muy fría y tritura hasta que quede muy fino","Sirve muy frío con los dados de melón por encima"],"tip":"El pan duro del día anterior va perfecto — le da cuerpo. Si no tienes almendra molida, vale un puñado de almendras crudas."},"ago-n2":{"n":"Berenjena a la Plancha con Queso","time":"15 min","ing":["1 berenjena grande","60g queso mozzarella o queso para fundir","1 cda aceite de oliva","Sal, orégano","1 tomate (opcional · en rodajas)"],"steps":["Corta la berenjena en rodajas de 1 cm. Sala y deja 5 min. Seca con papel","Plancha con aceite a fuego medio-alto 4 min por lado hasta que estén doradas","Añade el queso encima, tapa 2 min hasta que funda. Añade orégano"],"tip":"Sala las rodajas 10 min antes de cocinarlas y sécalas con papel — así quedan crujientes y no se empapan de aceite."},"sep-c1":{"n":"Crema de Calabaza con Lentejas","time":"18 min","ing":["250g calabaza congelada","1 bote lentejas cocidas (400g)","½ cebolla","1 vaso caldo de verduras","1 cda aceite de oliva","Sal, cúrcuma, jengibre"],"steps":["Rehoga cebolla con aceite 3 min. Añade calabaza congelada y caldo","Hierve y cocina 12 min tapado a fuego medio hasta que la calabaza esté tierna","Tritura. Añade lentejas escurridas, cúrcuma, sal. Calienta 3 min más"],"tip":"La calabaza congelada ya está cortada y pelada. Es la versión más práctica y barata."},"sep-c2":{"n":"Arroz con Setas y Pollo","time":"20 min","ing":["1 pechuga pollo en trozos","150g setas (frescas o congeladas)","½ taza arroz","1 cda aceite de oliva","1 diente ajo","Sal, perejil"],"steps":["Pon arroz a cocer con agua y sal 18 min","Saltea el pollo con aceite y ajo 5 min. Añade las setas. Cocina 6 min sin tapar","Añade sal y perejil. Sirve con el arroz"],"tip":"Las setas no necesitan mucha agua — cocinan en su propio jugo. No pongas tapa cuando las saltees."},"sep-n1":{"n":"Sopa de Setas con Pan","time":"12 min","ing":["150g setas variadas","½ cebolla","1 diente ajo","1L caldo de verduras","1 cda aceite de oliva","Sal, perejil","Pan integral"],"steps":["Pica cebolla y ajo. Rehoga con aceite 3 min. Añade las setas troceadas y saltea 4 min","Añade el caldo. Hierve y cocina 5 min. Añade sal y perejil","Sirve con pan integral tostado"],"tip":"Un chorrito de salsa de soja al final intensifica mucho el sabor. Solo una cucharadita."},"sep-n2":{"n":"Quinoa con Berenjena Asada","time":"18 min","ing":["1 berenjena","½ taza quinoa","50g queso feta","2 cdas aceite de oliva","Sal, orégano","Zumo de limón","1 tomate (opcional · en dados)"],"steps":["Enciende horno a 200°C. Corta berenjena en dados, mezcla con aceite y sal. Hornea 12 min","Hierve quinoa con agua y sal 12 min al mínimo tapado","Mezcla quinoa con berenjena asada, feta desmenuzado, limón y orégano"],"tip":"La berenjena asada en el horno queda más suave y sin amargor que en la sartén. Vale la pena encender el horno."},"oct-c1":{"n":"Bowl de Calabaza y Lentejas","time":"20 min","ing":["250g calabaza (congelada o fresca)","1 bote lentejas (400g)","½ taza arroz","1 cda aceite de oliva","Sal, comino, cúrcuma"],"steps":["Pon arroz a cocer 18 min. En paralelo: pon calabaza en dados en sartén con aceite a fuego medio","Cocina la calabaza 10 min removiendo hasta que esté tierna. Añade comino y cúrcuma","Añade las lentejas escurridas y sal. 2 min más. Sirve con el arroz"],"tip":"Puedes usar calabaza congelada o de bote para hacerlo más rápido. El resultado es igual de bueno."},"oct-c2":{"n":"Pasta con Setas y Queso","time":"18 min","ing":["80g pasta integral","150g setas","30g queso rallado","1 diente ajo","2 cdas aceite de oliva","Sal, perejil"],"steps":["Cuece la pasta en agua con sal según el paquete. Reserva ½ vaso del agua","Saltea setas con ajo y aceite 6 min a fuego medio sin tapar","Mezcla pasta escurrida con las setas y un poco del agua reservada. Añade queso y perejil"],"tip":"Reserva un poco del agua de cocer la pasta — ayuda a emulsionar la salsa y que se pegue bien a la pasta."},"oct-n1":{"n":"Crema de Calabaza Especiada","time":"12 min","ing":["300g calabaza congelada","½ cebolla","1 vaso caldo de verduras","½ lata leche de coco","1 cda aceite de oliva","Jengibre en polvo, cúrcuma, sal"],"steps":["Rehoga cebolla con aceite 3 min. Añade calabaza congelada y caldo","Hierve y cocina 8 min tapado. Apaga el fuego","Tritura. Añade leche de coco, cúrcuma, jengibre y sal. Mezcla y sirve"],"tip":"La leche de coco la hace más cremosa y saciante. Sin ella también queda rica con solo el caldo."},"oct-n2":{"n":"Setas con Huevo y Ajo","time":"8 min","ing":["150g setas","1 diente ajo","1 huevo","1 cda aceite de oliva","Sal, perejil","Pan integral"],"steps":["Saltea las setas con ajo y aceite a fuego fuerte 5 min sin tapar. Salan al final","Haz un hueco en la sartén, fríe el huevo a fuego medio 2 min","Sirve con pan integral y perejil picado"],"tip":"No pongas tapa cuando saltees las setas — el vapor las cocinaría y quedarían blandas en lugar de doradas."},"nov-c1":{"n":"Sopa de Puerro y Pollo","time":"18 min","ing":["1 pechuga pollo (o 2 muslos)","2 puerros","1 zanahoria","1L caldo de pollo","1 cda aceite de oliva","Sal, perejil"],"steps":["Corta puerros y zanahoria. Rehoga con aceite en olla grande 5 min a fuego medio","Añade el pollo en dados pequeños y el caldo. Cuando hierva, baja a fuego medio y cocina 10 min tapado","Añade perejil y sal. Prueba y sirve"],"tip":"El muslo de pollo en dados queda más jugoso que la pechuga en la sopa. Es también más barato."},"nov-c2":{"n":"Lentejas con Setas","time":"18 min","ing":["1 bote lentejas (400g)","150g setas","1 zanahoria","½ cebolla","1 cda aceite de oliva","Sal, pimentón, ajo"],"steps":["Pica cebolla y zanahoria. Rehoga con aceite y ajo 5 min","Añade las setas troceadas. Saltea 5 min sin tapar. Añade pimentón","Añade lentejas escurridas y ½ vaso agua. Sal. Cocina 8 min removiendo"],"tip":"Las setas deshidratadas dan mucho sabor al caldo. Remójalas 10 min en agua caliente antes de usar."},"nov-n1":{"n":"Crema de Coliflor y Puerro","time":"12 min","ing":["200g coliflor congelada","1 puerro","1 vaso caldo de verduras","1 cda aceite de oliva","Sal, nuez moscada","Pan integral"],"steps":["Corta el puerro en rodajas. Rehoga con aceite 4 min a fuego medio","Añade coliflor congelada y caldo. Hierve y cocina 8 min tapado","Tritura bien. Añade nuez moscada y sal. Sirve con pan"],"tip":"El puerro le da un sabor más dulce y suave a la crema que la cebolla. Es el secreto de esta receta."},"nov-n2":{"n":"Col Salteada con Huevo y Ajo","time":"8 min","ing":["¼ col (repollo o col rizada)","1 diente ajo","1 huevo","1 cda aceite de oliva","Sal","Pan integral"],"steps":["Corta la col en tiras finas. Saltea con ajo y aceite a fuego alto 4 min sin tapar","Añade sal, empuja la col a los lados y fríe el huevo en el centro 3 min","Sirve con pan integral"],"tip":"La col necesita fuego alto para saltear — así queda ligeramente dorada y no blanda. Muévela poco."},"dic-c1":{"n":"Bowl de Quinoa con Brócoli y Salmón","time":"18 min","ing":["½ taza quinoa","1 filete salmón (150g)","150g brócoli congelado","1 cda aceite de oliva","Zumo de limón","Sal, eneldo"],"steps":["Hierve quinoa 12 min al mínimo. A los 8 min pon el brócoli encima sin mezclar","Sala el salmón. Plancha con aceite 3 min por lado a fuego medio-alto","Sirve quinoa+brócoli con el salmón encima. Exprime el limón y añade eneldo"],"tip":"El salmón congelado en filete es mucho más barato que el fresco. Descongélalo la noche anterior."},"dic-c2":{"n":"Lentejas con Puerro y Zanahoria","time":"20 min","ing":["1 bote lentejas (400g)","1 puerro","1 zanahoria","½ cebolla","1 cda aceite de oliva","Sal, pimentón, laurel"],"steps":["Pica cebolla, puerro y zanahoria. Rehoga con aceite y laurel 5 min","Añade ½ vaso agua y pimentón. Cocina 10 min a fuego medio tapado","Añade lentejas escurridas y sal. 5 min más y listo"],"tip":"Un chorro de vinagre de vino al servir activa la absorción del hierro de las lentejas. Un truco sencillo."},"dic-n1":{"n":"Crema de Puerro","time":"12 min","ing":["2 puerros (todo, incluida la parte verde)","1 vaso caldo de verduras","1 cda aceite de oliva","Sal, nuez moscada","Pan integral"],"steps":["Corta los puerros en rodajas. Rehoga con aceite en olla 4 min a fuego medio","Añade el caldo. Hierve y cocina 8 min tapado","Tritura. Añade nuez moscada y sal. Sirve con pan tostado"],"tip":"Usa la parte verde del puerro también — da más sabor y no hay razón para tirarla."},"dic-n2":{"n":"Brócoli con Huevo y Queso","time":"10 min","ing":["200g brócoli (fresco o congelado)","1 huevo","30g queso rallado","1 cda aceite de oliva","Sal"],"steps":["Brócoli al microondas: ponlo en un bol con 2 cdas agua, tapa con film 4 min","Fríe el huevo con aceite en sartén 2 min","Sirve brócoli con el huevo encima y queso rallado. Añade sal"],"tip":"El brócoli al microondas tarda solo 4 minutos con un poco de agua — mucho más rápido que hervido."},"exp-c1":{"n":"Pasta Exprés con Atún","time":"10 min","ing":["80g pasta integral","1 lata atún al natural","Puñado guisantes congelados","2 cdas aceite de oliva","Ajo en polvo, orégano, sal","2 cdas tomate triturado (opcional)"],"steps":["Pon agua a hervir con sal y cuece la pasta el tiempo del paquete. Últimos 3 min: añade los guisantes congelados al agua","Escurre todo junto. Mezcla con el atún, aceite, ajo en polvo y orégano"],"tip":"Echa los guisantes congelados al agua de la pasta los últimos 3 minutos — una olla menos que fregar."},"exp-c2":{"n":"Arroz Salteado con Huevo var L=K,H=document.getElementById('app'),tm=null,S=null;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function get(k,d){try{var v=localStorage.getItem('qk_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function put(k,v){try{localStorage.setItem('qk_'+k,JSON.stringify(v));}catch(e){}}
function dayIdx(){var d=new Date().getDay();return d===0?6:d-1;}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function bar(back){return '<div class="top"><a href="'+back+'">&larr; '+L.back+'</a></div>';}
function stop(){if(tm){clearInterval(tm);tm=null;}}
function home(){var h='<h1>'+L.title+'</h1>',r=['#ex','#food','#clean','#night','#calm'];
  for(var i=0;i<r.length;i++)h+='<a href="'+r[i]+'">'+L.home[i]+'</a>';
  h+='<p class="m">'+L.lang+': <a class="s" href="es.html">Español</a><a class="s" href="en.html">English</a><a class="s" href="fr.html">Français</a></p><p class="n">'+L.note+'</p>';return h;}

function dayOf(lv,d){var a=D.ex.days;for(var i=0;i<a.length;i++)if(a[i].lv===lv&&a[i].d===d)return a[i];return null;}
function uniq(items){var s={},o=[];for(var i=0;i<items.length;i++)if(!s[items[i].id]){s[items[i].id]=1;o.push(items[i]);}return o;}
function exDay(d){var lv=get('lvl',0),day=dayOf(lv,d),h=bar('#')+'<h1>'+esc(day.name)+': '+esc(day.focus)+'</h1>';
  h+='<p>'+L.level+': ';for(var i=0;i<3;i++)h+='<a class="s'+(i===lv?' on':'')+'" href="#lvl/'+i+'/'+d+'">'+L.lv[i]+'</a>';h+='</p>';
  h+='<p class="m">';for(var j=0;j<7;j++)h+='<a class="s'+(j===d?' on':'')+'" href="#ex/'+j+'">'+L.week[j].slice(0,3)+'</a>';h+='</p>';
  h+='<p class="m">~'+day.mins+' '+L.min+'</p><a href="#run/'+d+'">'+L.start+'</a>';
  var u=uniq(day.items);for(var k=0;k<u.length;k++){var it=u[k],x=D.ex.info[it.id];
    h+='<div class="ex"><h3>'+esc(x.n)+'</h3><p class="m">'+it.dur+' '+L.sec+(it.sides===2?' ('+L.sides+')':'')+(x.zones.length?' &middot; '+L.works+': '+esc(x.zones.join(', ')):'')+'</p>'
      +'<img class="fig" src="fig/'+it.id+'.png" alt="'+esc(L.fig)+'">'
      +'<p><b>'+L.pos+':</b> '+esc(x.pos)+'</p>'+(x.exe?'<ol><li>'+esc(x.exe).split(' &middot; ').join('</li><li>').split(' · ').join('</li><li>').replace(/<li>\d+\.\s*/g,'<li>')+'</li></ol>':'')+'</div>';}
  return h;}
/* sesión: prepárate → ejercicio (→ cambio de lado) → descanso */
function run(d){var lv=get('lvl',0);S={d:d,items:dayOf(lv,d).items,i:0,ph:'prep',t:8,side:1,paused:false};tick0();}
function phaseLabel(){return S.ph==='prep'?L.prep:S.ph==='rest'?L.rest:S.ph==='switch'?L.side2:'';}
function drawRun(){if(!S)return;var it=S.items[S.i],x=D.ex.info[it.id],nx=S.items[S.i+1];
  var show=S.ph==='rest'&&nx?nx:it,sx=D.ex.info[show.id];
  H.innerHTML=bar('#ex/'+S.d)+'<p class="m">'+L.exOf.replace('{i}',S.i+1).replace('{n}',S.items.length)+'</p>'
   +'<p class="ph">'+(S.paused?L.pause:(S.ph==='rest'?L.rest+' &middot; '+L.next:phaseLabel()))+'</p>'
   +'<div class="big" id="t">'+S.t+'</div><h1 style="text-align:center">'+esc(sx.n)+(show.sides===2&&S.ph!=='rest'?' &middot; '+(S.side===1?L.side1:L.side2):'')+'</h1>'
   +'<img class="fig" style="margin:0 auto" src="fig/'+show.id+'.png" alt="">'
   +'<div class="row"><button class="b" onclick="pz()">'+(S.paused?L.resume:L.pause)+'</button><button class="b" onclick="nx()">'+L.next+'</button><button class="b" onclick="ex()">'+L.exit+'</button></div>'
   +'<p>'+esc(sx.pos)+'</p>';}
function tick0(){stop();drawRun();tm=setInterval(tick,1000);}
function tick(){if(!S||S.paused)return;S.t--;var e=document.getElementById('t');if(S.t>0){if(e)e.innerHTML=S.t;return;}adv();}
function adv(){var it=S.items[S.i];
  if(S.ph==='prep'||S.ph==='switch'){S.ph='work';S.t=it.dur;}
  else if(S.ph==='work'&&it.sides===2&&S.side===1){S.ph='switch';S.side=2;S.t=5;}
  else if(S.ph==='work'&&it.rest>0&&S.i<S.items.length-1){S.ph='rest';S.t=it.rest;}
  else{S.i++;S.side=1;if(S.i>=S.items.length){stop();var d=S.d;S=null;put('done_'+todayKey(),1);H.innerHTML=bar('#ex/'+d)+'<h1>'+L.done+'</h1><a href="#">'+L.back+'</a>';return;}S.ph='prep';S.t=5;}
  drawRun();}
function pz(){if(S){S.paused=!S.paused;drawRun();}}
function nx(){if(S){S.t=1;S.paused=false;adv();}}
function ex(){var d=S?S.d:dayIdx();stop();S=null;location.hash='#ex/'+d;}

/* ── Limpieza ── */
function zone(z,k){var h='<h2>'+esc(z.name)+' <span class="m">&middot; '+esc(z.dayName)+'</span></h2>',ck_=get(k,{});
  for(var i=0;i<z.tasks.length;i++){var t=z.tasks[i];h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+i+'\',this.checked)"'+(ck_[i]?' checked':'')+'><b>'+esc(t.n)+'</b> <span class="m">('+t.min+' '+L.min+')</span><br><span class="m">'+esc(t.tip)+'</span></label>';}
  return h;}
function clean(){var wd=new Date().getDay(),h=bar('#')+'<h1>'+L.home[2]+'</h1>',today=null,i;
  for(i=0;i<D.clean.length;i++)if(D.clean[i].day===wd)today=D.clean[i];
  h+=today?zone(today,'clean_'+todayKey()):'<p class="n">'+L.noclean+'</p>';
  h+='<h2>'+L.other+'</h2>';for(i=0;i<D.clean.length;i++)if(D.clean[i]!==today)h+='<a href="#zone/'+i+'">'+esc(D.clean[i].name)+' <span class="m">&middot; '+esc(D.clean[i].dayName)+'</span></a>';return h;}
/* ── Noche ── */
function night(){var h=bar('#')+'<h1>'+L.home[3]+'</h1>',k='night_'+todayKey(),c=get(k,{});
  for(var i=0;i<D.night.length;i++){var s=D.night[i];h+='<h2>'+(i+1)+'. '+esc(s.title)+'</h2><p>'+esc(s.desc)+'</p>';
    for(var j=0;j<s.list.length;j++){var id=i+'_'+j;h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+id+'\',this.checked)"'+(c[id]?' checked':'')+'>'+esc(s.list[j])+'</label>';}
    if(s.str.length){h+='<ul>';for(var q=0;q<s.str.length;q++)h+='<li><b>'+esc(s.str[q].n)+'</b> ('+esc(s.str[q].t)+'): '+esc(s.str[q].d)+'</li>';h+='</ul>';}}
  return h;}
/* ── Calma ── */
function calm(){var h=bar('#')+'<h1>'+L.home[4]+'</h1><div class="n"><b>'+L.calmCall+'</b>';
  for(var i=0;i<D.calm.crisis.length;i++)h+='<br><span class="tel">'+esc(D.calm.crisis[i][0])+'</span> &middot; '+esc(D.calm.crisis[i][1]);h+='</div>';
  for(var j=0;j<D.calm.rescues.length;j++)h+='<a href="#res/'+j+'">'+esc(D.calm.rescues[j].name)+'<br><span class="m">'+esc(D.calm.rescues[j].when)+'</span></a>';return h;}
function rescue(j){var r=D.calm.rescues[j],h=bar('#calm')+'<h1>'+esc(r.name)+'</h1><p>'+esc(r.desc)+'</p><ol>';
  for(var i=0;i<r.steps.length;i++)h+='<li><b>'+esc(r.steps[i].t)+'</b> ('+r.steps[i].s+' '+L.sec+'): '+esc(r.steps[i].i)+'</li>';return h+'</ol>';}
/* ── Navegación por #ruta ── */
function route(){stop();S=null;var p=(location.hash||'#').slice(1).split('/'),h;
  if(p[0]==='lvl'){put('lvl',+p[1]);location.hash='#ex/'+p[2];return;}
  if(p[0]==='ex')h=exDay(p[1]?+p[1]:dayIdx());
  else if(p[0]==='run'){run(+p[1]);window.scrollTo(0,0);return;}
  else if(p[0]==='food')h=food();else if(p[0]==='r')h=recipe(p[1]);else if(p[0]==='shop')h=shop();
  else if(p[0]==='clean')h=clean();else if(p[0]==='zone')h=bar('#clean')+zone(D.clean[+p[1]],'clean_'+todayKey());
  else if(p[0]==='night')h=night();else if(p[0]==='calm')h=calm();else if(p[0]==='res')h=rescue(+p[1]);
  else h=home();
  H.innerHTML=h;window.scrollTo(0,0);}
window.onhashchange=route;route();
</script></body></html>
