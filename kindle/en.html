p, chest forward, look ahead (3 s) · 2. Come back to a flat back · 3. Cat: push the floor away, round your back, chin down (3 s) · 4. Flow between them without rushing.","tip":"Move with your breath, don’t force it.","zones":["Back","Glutes","Core"]},"squat_half":{"n":"Half squat","pos":"Stand with feet hip-width, toes turned slightly out. Weight on the whole foot. Back straight, arms forward.","exe":"1. Tighten your belly and push your hips back · 2. Lower in 2 s to half height · 3. Push the floor with your whole foot, rise in 1 s · 4. Stand tall at the top without locking your knees.","tip":"Knees follow your toes. Weight in your heels.","zones":["Front thigh","Glutes"]},"donkey":{"n":"Donkey kick","pos":"On all fours. Hands under shoulders, knees under hips. Back flat, eyes on the floor.","exe":"1. Tighten your belly so your back stays still · 2. With your knee bent, lift the heel toward the ceiling in 1 s · 3. Squeeze the glute for 1 s at the top · 4. Lower in 2 s without fully resting. Then the other leg","tip":"Only lift as high as your back stays flat.","zones":["Glutes","Back thigh"]},"bridge":{"n":"Glute bridge","pos":"Lie on your back, knees bent. Feet hip-width, a hand’s length from your bottom. Arms by your sides, palms down.","exe":"1. Tighten your belly, press your lower back gently down · 2. Push through your heels and lift your hips in 1 s · 3. Squeeze your bottom for 1 s at the top · 4. Lower in 2 s, one vertebra at a time.","tip":"Push through your heels. Don’t arch your lower back.","zones":["Glutes","Back thigh"]},"goodmorning":{"n":"Good mornings","pos":"Standing, feet hip-width apart. Knees soft. Arms crossed on your chest.","exe":"1. Tighten your belly · 2. Push your hips back and tilt forward in 3 s, back straight · 3. Go down until almost level or as far as your back stays straight · 4. Squeeze your glutes and come up in 2 s","tip":"Only go as low as your back stays straight.","zones":["Glutes","Back thigh"]},"calfraise":{"n":"Calf raise","pos":"Stand with feet hip-width and parallel. Knees straight but not locked. Arms by your sides, eyes on a fixed point.","exe":"1. Rise onto your toes in 1 s, weight over the big toe · 2. Pause briefly at the top, ankles straight · 3. Lower in 2 s until the heel almost touches · 4. Repeat without bouncing.","tip":"Look at a fixed point ahead to keep your balance.","zones":["Calves","Glutes"]},"squathold_half":{"n":"Half squat hold","pos":"Standing, feet hip-width apart, toes turned slightly out. Arms forward for balance.","exe":"1. Push your hips back and lower halfway in 2 s · 2. Weight on the whole foot, knees toward the second toe · 3. Stay there breathing for the set time · 4. Come up in 2 s","tip":"If your legs shake, come up a little: it still counts.","zones":["Front thigh","Glutes"]},"lowlunge":{"n":"Low lunge","pos":"Back knee on the mat, top of the foot down. Front foot flat, knee above the ankle. Hands on your knee or hips.","exe":"1. Tuck your pelvis a little (tailbone down) · 2. Shift your hips slightly forward to a gentle pull · 3. Tall body, ribs down · 4. Stay there, then switch sides","tip":"Put something soft under your knee if it bothers you.","zones":["Hips","Front thigh"]},"gluteknee":{"n":"Knee to chest","pos":"Lie on your back, head down. One leg straight on the mat. Hug the other knee with both hands.","exe":"1. Draw the knee to your chest in 3 s · 2. Guide it slightly toward the opposite shoulder until you feel your glute · 3. Ease off for 1 s without letting go · 4. Repeat gently and, when you switch, do the other leg","tip":"If you can’t reach your knee, hold behind your thigh.","zones":["Glutes","Back"]},"pushup_knee":{"n":"Knee push-up","pos":"Knees on the mat, hip-width apart. Hands under your shoulders. Body straight from knees to head, eyes on the floor.","exe":"1. Squeeze your tummy and your glutes · 2. Lower in 2 s, elbows angled back · 3. Stop with your chest a fist from the floor · 4. Push the floor for 1 s and straighten without locking","tip":"Elbows about 45 degrees from your body, not flared out.","zones":["Chest","Shoulders"]},"shouldertap_knee":{"n":"Knee plank shoulder taps","pos":"High plank on your knees: hands under your shoulders. Knees a little wider than your hips. Body straight from knees to head.","exe":"1. Squeeze tummy and glutes, push the floor with 2 hands · 2. Bring one hand to the opposite shoulder in 1 s · 3. Put it back under the shoulder in 1 s · 4. Switch hands without twisting your hips","tip":"Spread your knees a little for more stability.","zones":["Core","Shoulders"]},"floordip":{"n":"Floor dips","pos":"Sit with your hands behind your hips, fingers pointing to you. Knees bent at a right angle, feet flat. Lift your hips a little and open your chest.","exe":"1. Draw your shoulders away from your ears, hips up · 2. Bend your elbows backward in 2 s, no deeper than a right angle · 3. Push for 1 s and straighten without locking","tip":"Easy level: small movement. Shoulders away from your ears.","zones":["Arms","Shoulders"]},"downdog":{"n":"Downward dog pedal","pos":"Start on all fours with your fingers spread. Lift your hips into an upside-down V. Arms by your ears, head relaxed.","exe":"1. Push the floor and move your chest away from your hands · 2. Bend one knee as the other heel lowers, over 1 to 2 s · 3. Alternate with rhythm, keeping your hips still","tip":"You can keep your knees bent: a long back is what matters.","zones":["Shoulders","Core"]},"plank_knee":{"n":"Knee plank","pos":"Forearms or hands under your shoulders. Knees down behind you, hips straight. Body straight from knees to head, eyes on the floor.","exe":"1. Push the floor and spread your shoulder blades slightly · 2. Squeeze tummy and glutes, hips level · 3. Hold for the set time without losing the line","tip":"Look at the floor so you don’t strain your neck.","zones":["Core","Glutes"]},"proneW":{"n":"Chest lift, arms back","pos":"Lying face down, forehead near the floor. Arms straight by your sides, palms down. Legs relaxed.","exe":"1. Draw your shoulders away from your ears · 2. Squeeze your shoulder blades and lift chest and arms in 1 s · 3. Hold 1 s with arms reaching toward your feet · 4. Lower in 2 s","tip":"Lift only a little: the work is in your upper back.","zones":["Upper back","Back","Shoulders"]},"childpose":{"n":"Child’s pose","pos":"Kneel on the mat, big toes together. Knees hip-width apart or wider. Sit back on your heels.","exe":"1. Walk your hands forward until your arms are long · 2. Rest your forehead on the mat · 3. Let your hips sink toward your heels · 4. Relax your shoulders and neck, and stay","tip":"Spread your knees if that feels more comfortable.","zones":["Back","Core"]},"tricepstretch":{"n":"Triceps stretch","pos":"Stand with feet hip-width apart. Knees soft, back straight. Shoulders relaxed.","exe":"1. Raise one arm and bend the elbow, hand between your shoulder blades · 2. With the other hand, gently press the elbow back · 3. Ribs down, no arch in your back · 4. Stay there, then switch arms","tip":"Keep your neck relaxed.","zones":["Arms","Back","Core"]},"deadbug_easy":{"n":"Easy dead bug","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms straight up to the ceiling. Press your lower back into the mat.","exe":"1. Tighten your belly like a belt and drop your ribs · 2. Lower one heel in 2 s, knee bent, to tap the floor · 3. Return to tabletop in 1 s · 4. Switch legs without moving your hips","tip":"Lower back pressed into the mat.","zones":["Core"]},"crunch":{"n":"Crunch","pos":"Lie on your back with knees bent. Feet flat, hip-width apart. Fingers at your temples or arms crossed on your chest. Keep a fist between chin and chest.","exe":"1. Tighten your belly and draw your ribs toward your hips · 2. Lift head and shoulders in 1 s, shoulder blades off the mat · 3. Pause 1 s · 4. Lower in 2-3 s without fully relaxing","tip":"Keep a fist of space between chin and chest.","zones":["Core"]},"legraise_single":{"n":"Single-leg raise","pos":"Lie on your back, legs straight. Arms by your sides, palms down, or hands under your bottom. Press your lower back into the mat.","exe":"1. Tighten your belly and keep your hips still · 2. Raise one straight leg in 2 s, pointing to the ceiling · 3. Lower it in 3 s without touching the floor · 4. Switch legs","tip":"Hands under your glutes if you feel your lower back.","zones":["Core"]},"birddog_easy":{"n":"Easy bird dog","pos":"Get on all fours. Hands under shoulders, knees under hips. Back straight, not sagging or rounded. Eyes on the floor, belly tight.","exe":"1. Reach one arm forward in 2 s, at shoulder height · 2. Come back and stretch the opposite leg back in 2 s · 3. Lift it only to hip height, then return · 4. Switch sides without moving your hips","tip":"Back flat like a table.","zones":["Back","Glutes"]},"hollow_tuck":{"n":"Tuck hollow hold","pos":"Lie on your back, knees bent over your hips. Head and shoulder blades lifted. Arms straight beside your thighs. Lower back flat.","exe":"1. Tuck your tailbone slightly and press your lower back down · 2. Lift head and shoulder blades, ribs down · 3. Bring your knees over your hips · 4. Hold for the set time, breathing","tip":"The closer your knees, the easier it is.","zones":["Core"]},"sphinx":{"n":"Sphinx","pos":"Lie face down, legs long and hip-width apart. Tops of your feet on the floor. Forearms on the mat, elbows under your shoulders.","exe":"1. Press your forearms down and lift your chest · 2. Draw your shoulders down and back · 3. Pubic bone down, bottom relaxed · 4. Look ahead with a long neck and stay","tip":"If your lower back complains, move your elbows forward.","zones":["Core","Chest"]},"kneehug":{"n":"Knees to chest","pos":"Lie on your back, head and shoulders down. Bring both knees to your chest. Hug them below the knees or at the shins.","exe":"1. Draw your knees to your chest to a gentle pull · 2. Let your lower back rest on the mat · 3. Rock slowly side to side, just a little · 4. Come back to centre and let go","tip":"It’s a massage for your lower back.","zones":["Back"]},"swimming":{"n":"Swimmers","pos":"Lie face down with legs together and long. Arms in front, shoulder-width apart. Forehead just off the floor, eyes down.","exe":"1. Squeeze your tummy and glutes, shoulders away from ears · 2. Lift right arm and left leg a little in 1 s · 3. Lower in 1 s without fully resting · 4. Switch sides at a calm pace","tip":"Look at the floor so you don’t strain your neck.","zones":["Back","Glutes"]},"proneY":{"n":"Prone Y raise","pos":"Lie face down with arms long in a Y, about 45 degrees from your head. Thumbs up, forehead near the floor. Legs long, glutes tight.","exe":"1. Draw your shoulder blades back and down · 2. Lift your arms into a Y in 1 s, chest stays low · 3. Short pause at the top · 4. Lower in 2 s","tip":"Shoulders drop away from your ears.","zones":["Upper back","Back","Shoulders"]},"bear":{"n":"Bear hold","pos":"Get on all fours, hands under your shoulders and knees under your hips. Rest on the balls of your feet. Flat back, eyes on the floor.","exe":"1. Push the floor away and tighten your tummy · 2. Lift your knees 2 cm in 1 s · 3. Hold for the set time, back still · 4. Lower your knees with control","tip":"If it’s too hard, lower your knees and lift again.","zones":["Core","Front thigh"]},"climber_slow":{"n":"Slow mountain climber","pos":"Get into a high plank, hands under your shoulders. Body straight from head to heels. Feet hip-width apart, tummy and glutes tight.","exe":"1. Bring one knee toward your chest in 2 s · 2. Short pause, hips still · 3. Take the foot back in 2 s · 4. Switch legs","tip":"Shoulders over your hands.","zones":["Core","Hips"]},"lunge_short":{"n":"Short reverse lunge","pos":"Stand with feet hip-width. Back straight, belly firm. Hands on your waist or forward.","exe":"1. Take a short step back onto the ball of your foot · 2. Bend both knees in 2 s to half height · 3. Push through the front heel and come back in 1 s · 4. Switch legs.","tip":"Keep your weight on your front leg. Go slowly to stay balanced.","zones":["Front thigh","Glutes"]},"burpee_step":{"n":"Step-back burpee","pos":"Stand with your feet hip-width apart. Arms relaxed, back tall and tummy lightly tight.","exe":"1. Bend your hips and knees, hands under your shoulders · 2. Step one foot back, then the other, into a plank · 3. Step back in, feet near your hands · 4. Stand up by straightening your hips","tip":"No rush: each step done well.","zones":["Front thigh","Glutes"]},"hamstring":{"n":"Hamstring stretch","pos":"Lie on your back. One leg long, or bent with the foot flat. Raise the other and hold behind the thigh or calf.","exe":"1. Lift the leg with the knee almost straight · 2. Draw it in until the back of your thigh gently pulls · 3. Pelvis and lower back stay on the mat · 4. Stay there, then switch legs","tip":"You can bend your knee a little.","zones":["Back thigh","Calves"]},"pelvictilt":{"n":"Pelvic tilt","pos":"Lying on your back, knees bent, feet hip-width apart. Arms by your sides.","exe":"1. Press your lower back into the mat · 2. Keep curling and lift your hips a little in 2 s · 3. Stay 1 s · 4. Lower in 2 s, one vertebra at a time","tip":"It’s a small, gentle movement.","zones":["Back","Glutes"]},"breathe":{"n":"Closing breath","pos":"Lie on your back, legs long or knees bent. Arms loose or one hand on your belly. Eyes closed.","exe":"1. Breathe in through your nose for 4 counts, filling belly and ribs · 2. Breathe out for 6 counts, soft and steady · 3. Let your body sink into the mat · 4. Repeat several times","tip":"Let your body sink into the mat.","zones":["Glutes","Core"]},"rockback":{"n":"All-fours rock back","pos":"On all fours. Hands under shoulders. Knees wider than hips and feet closer together, tops of the feet on the mat.","exe":"1. Long back, eyes on the floor · 2. Take your hips back toward your heels in 3 s · 3. Stay 1 s where you feel your inner thighs · 4. Return to all fours in 3 s","tip":"Only go as far as feels comfortable.","zones":["Inner thigh","Glutes"]},"sidequad":{"n":"Side-lying quad stretch","pos":"Lie on your side, head on your lower arm. Body in a straight line. Lower leg slightly bent so you stay steady.","exe":"1. Bend your top knee and hold the ankle · 2. Bring your heel toward your bottom · 3. Knees together, tuck your pelvis a little (tailbone under) · 4. Stay there, then switch sides","tip":"If you can’t reach your ankle, hold your trousers.","zones":["Front thigh","Hips"]},"yogisquat":{"n":"Deep squat","pos":"Stand with feet a bit wider than your hips. Toes turned slightly out. Palms together in front of your chest.","exe":"1. Lower slowly by bending hips and knees · 2. Knees in line with your feet · 3. Elbows inside your knees, gently open them · 4. Chest tall, stay there, then rise slowly","tip":"If your heels lift, widen your feet.","zones":["Inner thigh","Glutes"]},"childreach":{"n":"Child’s pose to all fours","pos":"On all fours. Hands under your shoulders, knees under your hips. Back straight, eyes on the floor.","exe":"1. Breathe out and send your hips to your heels · 2. Pause 1 or 2 s with arms long · 3. Breathe in and slowly return to all fours · 4. Repeat calmly","tip":"Sink in gently, don’t force it.","zones":["Glutes","Back"]},"cobra":{"n":"Gentle cobra","pos":"Lie face down, legs long and hip-width apart. Tops of your feet down. Hands under your shoulders, elbows close to your body.","exe":"1. Breathe in and lift your chest using your back · 2. Elbows slightly bent, shoulders down · 3. Pubic bone and hips stay down · 4. Breathe out and lower slowly","tip":"Height doesn’t matter. No pain.","zones":["Core","Chest"]},"seatedfwd":{"n":"Seated forward fold","pos":"Sit on your sit bones, legs straight and together. Toes pulled toward you. Back long, hands on your thighs.","exe":"1. Breathe in and grow tall · 2. Breathe out and fold from your hips, not your back · 3. Slide your hands toward your feet to a gentle pull · 4. Stay there, then come up slowly","tip":"Bend your knees if they pull a lot.","zones":["Back thigh","Calves"]},"shouldercircle":{"n":"Shoulder circles","pos":"Stand or sit with a straight back. Feet hip-width apart. Fingertips on your shoulders, elbows pointing forward.","exe":"1. Draw big circles with your elbows · 2. Let your shoulder blades move too · 3. Halfway through, change direction · 4. Keep a slow, controlled pace","tip":"Halfway through, switch direction.","zones":["Shoulders","Upper back","Back"]},"neck":{"n":"Neck mobility","pos":"Stand or sit with a straight back. Shoulders low and loose, arms relaxed. Gently bring your chin toward your chest.","exe":"1. Tall back, shoulders down · 2. Lower your chin to your chest in 3 s · 3. Stay 1 s feeling the back of your neck · 4. Look forward again in 3 s","tip":"Never tip your head back.","zones":["Upper back","Back"]},"squat":{"n":"Squat","pos":"Stand with feet hip-width or a bit wider. Toes turned slightly out. Back straight, arms forward at chest height.","exe":"1. Tighten your belly, push hips back and down · 2. Lower in 3 s until thighs are almost level · 3. Push the floor away and rise in 1 s · 4. Squeeze your bottom at the top without arching.","tip":"Long back, heels on the floor. Arms forward for balance.","zones":["Front thigh","Glutes"]},"lunge":{"n":"Reverse lunge","pos":"Stand with feet hip-width. Back straight, belly firm. Hands on your waist, eyes forward.","exe":"1. Take a long step back, feet hip-width apart · 2. Lower in 2 s, knees at right angles, not touching down · 3. Push through the front heel and come back in 1 s · 4. Switch legs.","tip":"Front knee stays over your ankle. Torso upright.","zones":["Front thigh","Glutes"]},"bridgehold":{"n":"Glute bridge hold","pos":"Lie on your back, knees bent. Feet hip-width, a hand’s length from your bottom. Arms by your sides, palms down.","exe":"1. Push through your heels and lift your hips in 2 s · 2. Make a straight line from knees to shoulders, ribs down · 3. Hold with your bottom squeezed for the set time · 4. Lower in 2 or 3 s, one vertebra at a time.","tip":"If you feel it in your lower back, lower your hips a little.","zones":["Glutes","Back thigh"]},"squathold":{"n":"Squat hold","pos":"Stand with feet hip-width, toes slightly out. Back straight. Arms forward at chest height.","exe":"1. Push your hips back and lower in 3 s · 2. Stop at half height, or lower if you can · 3. Hold still, belly firm, weight in your heels · 4. When done, rise in 2 s.","tip":"Easy level: stay halfway down.","zones":["Front thigh","Glutes"]},"pushup":{"n":"Push-up","pos":"High plank (arms straight): hands under your shoulders. Feet hip-width apart. Body straight from heels to head, eyes on the floor.","exe":"1. Squeeze tummy and glutes, knees straight · 2. Lower in 2 s, elbows angled back · 3. Stop with your chest a fist from the floor · 4. Push for 1 s and spread your shoulder blades slightly","tip":"If your hips sag, switch to knee push-ups.","zones":["Chest","Shoulders"]},"shouldertap":{"n":"Plank shoulder taps","pos":"High plank: hands under your shoulders. Feet a little wider than your hips, legs straight. Body straight from heels to head.","exe":"1. Squeeze glutes and tummy, push the floor · 2. Tap the opposite shoulder in 1 s · 3. Put the hand back under the shoulder in 1 s · 4. Switch hands without moving your hips","tip":"Feet wider = easier; feet together = harder.","zones":["Core","Shoulders"]},"pike":{"n":"Pike push-up","pos":"Upside-down V: hands shoulder-width apart. Feet about 1 metre from your hands. Hips high, legs straight or knees slightly bent. Look between your hands.","exe":"1. Shift your weight onto your hands, hips high · 2. Lower in 2 s, bending your elbows back · 3. Bring your head near the floor, ahead of your hands · 4. Push for 1 s until your arms are straight","tip":"It works your shoulders. Walk your feet closer to your hands to make it harder.","zones":["Shoulders","Arms"]},"plank":{"n":"Plank","pos":"Hands under your shoulders, arms straight but not locked. Legs straight, feet hip-width apart. Body straight from heels to head.","exe":"1. Push the floor and move your chest away from your hands · 2. Squeeze glutes and thighs, navel in · 3. Hold for the set time, breathing calmly","tip":"If your lower back sags, drop your knees.","zones":["Core","Glutes"]},"plankdog":{"n":"Plank to downward dog","pos":"High plank: hands under your shoulders, fingers spread. Feet hip-width apart. Body straight. Easier: knees down.","exe":"1. Firm your tummy and push the floor · 2. Send hips up and back in 2 s into the upside-down V · 3. Return to plank in 2 s, shoulders over hands","tip":"Easy level: do it with your knees down in the plank.","zones":["Shoulders","Core"]},"deadbug":{"n":"Dead bug","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms straight up to the ceiling. Press your lower back into the mat.","exe":"1. Tighten your belly like a belt and drop your ribs · 2. Reach one arm back and the opposite leg out in 2 s · 3. Stop before touching the floor. Return to tabletop in 1 s · 4. Switch sides","tip":"Exhale as you extend. If your lower back lifts, don’t reach as far.","zones":["Core"]},"crunch_tt":{"n":"Tabletop crunch","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Fingers at your temples. Press your lower back into the mat.","exe":"1. Keep your legs still in tabletop and tighten your belly · 2. Lift head and shoulders in 1 s, shoulder blades off the mat · 3. Pause 1 s · 4. Lower in 2-3 s without moving your legs","tip":"Exhale as you lift.","zones":["Core"]},"sideplank":{"n":"Side plank","pos":"Lie on your side, legs straight. Put your forearm down, elbow under your shoulder. Feet stacked, or top foot in front. Whole body in one line.","exe":"1. Push the floor with your forearm and tighten your belly · 2. Lift your hips in 1 s: straight line from head to feet · 3. Hold without twisting your trunk · 4. Lower with control and switch sides","tip":"To make it easier, rest your bottom knee down.","zones":["Core","Back"]},"reversecrunch":{"n":"Reverse crunch","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms by your sides, palms down. Lower back on the mat.","exe":"1. Tighten your belly and drop your ribs · 2. Curl your pelvis in 1 s, knees to chest, bottom slightly up · 3. Pause 1 s · 4. Lower in 3 s back to tabletop","tip":"No swinging: the movement is small.","zones":["Core"]},"birddog":{"n":"Bird dog","pos":"Get on all fours. Hands under shoulders, knees under hips. Back straight, not sagging or rounded. Eyes on the floor, belly tight.","exe":"1. Tighten your belly like a belt · 2. Reach one arm and the opposite leg together in 2 s · 3. Pause 1 s in a straight line · 4. Return in 2 s and switch sides","tip":"Imagine a glass of water on your back that mustn’t spill.","zones":["Back","Glutes"]},"hollow":{"n":"Hollow hold","pos":"Lie on your back, arms straight above your head. Legs together and straight. Head, shoulder blades, arms and legs lifted a few centimetres.","exe":"1. Tuck your tailbone slightly and press your lower back down · 2. Lift head and shoulder blades, arms by your ears · 3. Lift your straight legs to where your back stays flat · 4. Hold while breathing","tip":"Raise your legs higher if your lower back lifts.","zones":["Core"]},"superman":{"n":"Superman","pos":"Lie face down with arms and legs long. Legs together, tops of the feet on the floor. Eyes down, tummy lightly tight.","exe":"1. Squeeze your glutes, shoulder blades back and down · 2. Lift arms, chest and legs a hand-width in 1 s · 3. Hold 1 s at the top · 4. Lower in 2 s with control","tip":"Squeeze your glutes to protect your lower back.","zones":["Back","Glutes"]},"bridgemarch":{"n":"Glute bridge march","pos":"Lie on your back, knees bent. Feet hip-width, a hand’s length from your bottom. Arms by your sides, pressing the floor.","exe":"1. Lift into a bridge, a straight line from knees to shoulders · 2. Weight on one heel, lift the other knee in 2 s · 3. Set the foot down without your hips dropping · 4. Switch legs. At the end, lower in 2 s.","tip":"If your hips drop, do a regular bridge.","zones":["Glutes","Back thigh"]},"climber":{"n":"Mountain climber","pos":"Get into a high plank, hands under your shoulders. Body straight from head to heels. Feet hip-width apart, tummy and glutes tight.","exe":"1. Drive one knee to your chest · 2. Switch legs with a light step, on the ball of the foot · 3. Keep about 2 switches per second · 4. Do not bounce your hips","tip":"Hips low, in line with your shoulders.","zones":["Core","Hips"]},"jumpsquat":{"n":"Jump squat","pos":"Stand with feet hip-width, toes slightly out. Back straight. Arms by your sides, ready to swing.","exe":"1. Lower in 2 s into a squat, hips back · 2. Jump hard and swing your arms up · 3. Land on the balls of your feet, then heels, knees bent · 4. Stay steady for 1 s and repeat.","tip":"If you can’t jump (neighbours, knees), do squats with a 3-second pause at the bottom.","zones":["Front thigh","Glutes"]},"lunge_knee":{"n":"Reverse lunge with knee drive","pos":"Stand with feet hip-width. Back straight, belly firm. Arms by your sides or on your waist. Look at a fixed point.","exe":"1. Take a long step back and lower in 2 s · 2. Push through the front heel and rise in 1 s · 3. Without touching down, lift the back knee, hold 1 s · 4. Repeat on the same leg or switch.","tip":"If you lose balance, touch your foot down for a moment before lifting the knee.","zones":["Front thigh","Glutes"]},"bridge1leg":{"n":"Single-leg glute bridge","pos":"Lie on your back. Put one foot in the middle, knee bent. Stretch the other leg out, thighs level. Palms press the floor.","exe":"1. Tighten your belly, press your lower back gently down · 2. Push through the heel and lift your hips in 1 s · 3. Hold 1 s at the top, hips level · 4. Lower in 2 s. Switch legs halfway through.","tip":"Hips rise level, without tilting to one side.","zones":["Glutes","Back thigh"]},"sldl":{"n":"Single-leg deadlift","pos":"Standing on one leg, knee soft. The other leg just behind, toes on the floor. Arms hanging.","exe":"1. Tighten your belly and look at the floor · 2. Tilt forward in 3 s while the other leg rises behind · 3. Body and leg in a straight line, hips facing the floor · 4. Come back up in 2 s squeezing the standing glute","tip":"If you lose balance, touch down with the back toes.","zones":["Glutes","Back thigh"]},"calfraise_slow":{"n":"Slow calf raise with pause","pos":"Stand with feet hip-width and parallel. Knees straight but not locked. Arms by your sides, eyes on a fixed point.","exe":"1. Rise high in 1 s, weight over the big toe · 2. Hold 2 s at the top without swaying · 3. Lower in 3 s, slowly and with control · 4. Brush the floor with your heel and repeat.","tip":"The slower you go, the harder your calves work.","zones":["Calves"]},"pushup_slow":{"n":"Slow push-up","pos":"High plank: hands under your shoulders, feet hip-width apart. Body straight from heels to head. If you lose the line, drop to your knees.","exe":"1. Squeeze glutes and tummy · 2. Lower for a count of 3, elbows angled back · 3. Rise for a count of 3 at the same speed · 4. Straighten your elbows without locking and repeat","tip":"Slowness is the challenge: you don’t need to do many.","zones":["Chest","Shoulders"]},"shouldertap_hard":{"n":"Shoulder taps, feet together","pos":"High plank: hands under your shoulders. Feet together, legs straight, glutes squeezed. Body straight from heels to head.","exe":"1. Squeeze glutes, thighs and tummy · 2. Bring the hand to the opposite shoulder in 2 s · 3. Put it back under the shoulder in 2 s · 4. Switch hands without turning hips or shoulders","tip":"Count two seconds on each tap.","zones":["Core","Shoulders"]},"floordip_leg":{"n":"Floor dips, leg extended","pos":"Sit with your hands behind your hips, fingers toward you. One knee bent, foot flat. Other leg straight, heel on the floor. Hips high and level.","exe":"1. Lift your hips by squeezing the bent-leg glute · 2. Bend your elbows backward in 2 s, to a right angle · 3. Push for 1 s and straighten without locking · 4. Halfway through the set, switch legs","tip":"Keep your hips high the whole time.","zones":["Arms","Shoulders"]},"pike_slow":{"n":"Slow pike push-up","pos":"Upside-down V with your feet a bit closer to your hands, about 70 to 80 centimetres. Hands shoulder-width apart. Hips high, look between your hands.","exe":"1. Shift your weight onto your hands · 2. Lower for a count of 3, elbows back · 3. Pause briefly, head 2 or 3 centimetres off the floor · 4. Push for 1 s until your arms are straight","tip":"Elbows go back, not out to the sides.","zones":["Shoulders","Arms"]},"plankleg":{"n":"Plank leg lift","pos":"High plank: hands under your shoulders, feet hip-width apart. Body straight from heels to head. Hips level, not tilting.","exe":"1. Firm your tummy and push the floor · 2. Lift one straight leg a hand’s width in 1 s · 3. Hold 1 s, lower in 1 s · 4. Switch legs without moving your hips","tip":"Your hips don’t twist as you lift the leg.","zones":["Glutes","Back thigh"]},"deadbug_slow":{"n":"Slow dead bug","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms straight up to the ceiling. Press your lower back into the mat.","exe":"1. From tabletop, tighten your belly like a belt · 2. Reach one arm and the opposite leg in 3 s · 3. Pause 1 s with your lower back flat · 4. Return in 2 s and switch sides","tip":"Slowness is what makes it hard.","zones":["Core"]},"situp":{"n":"Sit-up","pos":"Lie on your back with knees bent. Feet flat, hip-width apart. Arms straight in front or crossed on your chest.","exe":"1. Lift head and shoulder blades, like a crunch · 2. Keep curling up to sitting in 2 s · 3. Roll down one vertebra at a time in 3 s · 4. Touch your shoulders down and repeat","tip":"If you pull on your neck, reach your arms forward.","zones":["Core"]},"sideplank_dip":{"n":"Side plank hip dips","pos":"Get into a side plank on your forearm and the edge of your foot. Elbow under your shoulder. Body straight from head to feet, belly tight.","exe":"1. Start in a side plank with hips in line · 2. Lower your hips in 2 s, almost to the floor · 3. Lift them in 1 s, a little above the line · 4. Finish the reps and switch sides","tip":"Controlled movement, no jerking.","zones":["Core","Back"]},"legraise":{"n":"Leg raise","pos":"Lie on your back, legs together and straight. Arms by your sides, palms down, or hands under your bottom. Lower back flat, ribs down.","exe":"1. Tighten your belly and press your lower back into the mat · 2. Raise your legs in 2 s, pointing to the ceiling · 3. Lower in 3 s only while your back stays flat · 4. Repeat without touching the floor","tip":"If your lower back lifts, bend your knees a little.","zones":["Core"]},"birddog_crunch":{"n":"Bird dog elbow to knee","pos":"Get on all fours. Hands under shoulders, knees under hips. Back straight, not sagging or rounded. Eyes on the floor, belly tight.","exe":"1. Reach one arm and the opposite leg in 2 s · 2. Pause 1 s in a straight line · 3. Bring elbow and knee together under you in 2 s, back rounded · 4. Do half the reps and switch sides","tip":"Go slowly to keep your balance.","zones":["Core"]},"hollowrock":{"n":"Hollow rock","pos":"Get into the hollow boat shape: lower back flat, ribs down. Arms by your ears. Legs straight and off the floor.","exe":"1. Set the boat shape with your lower back flat · 2. Rock toward your head in 1 s without changing shape · 3. Rock toward your feet in 1 s · 4. Keep a steady rhythm. If the shape breaks, hold still","tip":"If the shape breaks, go back to holding still.","zones":["Core"]},"supermanhold":{"n":"Superman hold","pos":"Lie face down with arms and legs long. Legs together, eyes on the floor, tummy tight.","exe":"1. Squeeze your glutes, shoulder blades back and down · 2. Lift arms, chest and legs in 2 s, not too high · 3. Hold for the set time without sinking · 4. Lower in 2 s","tip":"A little height done well beats a lot forced.","zones":["Back","Glutes"]},"proneY_slow":{"n":"Prone Y raise with pause","pos":"Lie face down with arms long in a Y, about 45 degrees from your head. Thumbs up, eyes on the floor. Legs long, glutes tight.","exe":"1. Draw your shoulder blades back and down · 2. Lift your arms into a Y in 2 s · 3. Hold 2 s, squeezing between your shoulder blades · 4. Lower in 2 s","tip":"No momentum: lift with your back.","zones":["Upper back","Back","Shoulders"]},"swimming_fast":{"n":"Fast swimmers","pos":"Lie face down with arms and legs long. Lift your chest and legs slightly off the floor. Eyes down, glutes tight.","exe":"1. Lift your chest, arms and legs slightly · 2. Alternate opposite arm and leg in short, quick moves · 3. Do about 2 switches per second · 4. Keep the same height until the end","tip":"Breathe calmly even though the pace is fast.","zones":["Back","Glutes"]},"burpee":{"n":"Burpee","pos":"Stand with your feet hip-width apart. Arms relaxed, back tall and tummy lightly tight.","exe":"1. Squat and place your hands under your shoulders · 2. Jump back to a plank, hips in line · 3. Jump your feet next to your hands · 4. Jump up, arms high, land on your toes, knees bent","tip":"If you need to, skip the final jump.","zones":["Front thigh","Glutes"]}},"lv":["Easy","Medium","Hard"],"sec":{"warm":"Warm-up","main":"Circuit · {r} rounds","cool":"Cool-down","st":"Stretching"}},"food":{"months":[{"name":"January","lunch":["ene-c1","ene-c2","dic-c1","dic-c2","feb-c1","feb-c2","exp-c1"],"dinner":["ene-n1","ene-n2","dic-n1","dic-n2","feb-n1","feb-n2","exp-n1"],"shop":[["Fresh: fruit and vegetables",["Broccoli","Onion","Spinach","Lemon","Leek","Tomatoes","Carrot"]],["Frozen",["Frozen broccoli","Frozen cauliflower"]],["Canned and jarred goods",["Vegetable broth","C nd nuts",["Rice","Whole wheat bread","Whole wheat pasta","Quinoa"]]]},{"name":"November","lunch":["nov-c1","nov-c2","sep-c1","sep-c2","oct-c1","oct-c2","exp-c1"],"dinner":["nov-n1","nov-n2","sep-n1","sep-n2","oct-n1","oct-n2","exp-n1"],"shop":[["Fresh: fruit and vegetables",["Eggplant","Pumpkin","Onion","Cabbage","Lemon","Leek","Mushrooms","Tomatoes","Carrot"]],["Frozen",["Frozen pumpkin","Frozen cauliflower"]],["Canned and jarred goods",["Chicken broth","Vegetable broth","Lentils","Cooked lentils"]],["Eggs and dairy",["Egg","Coconut milk","Feta cheese","Grated cheese"]],["Meat and fish",["Chicken breast","Chicken breast in chunks"]],["Grains and nuts",["Rice","Whole wheat bread","Whole wheat pasta","Quinoa"]]]},{"name":"December","lunch":["dic-c1","dic-c2","ene-c1","ene-c2","feb-c1","feb-c2","exp-c1"],"dinner":["dic-n1","dic-n2","ene-n1","ene-n2","feb-n1","feb-n2","exp-n1"],"shop":[["Fresh: fruit and vegetables",["Broccoli","Onion","Spinach","Lemon","Leek","Tomatoes","Carrot"]],["Frozen",["Frozen broccoli","Frozen cauliflower"]],["Canned and jarred goods",["Vegetable broth","Chickpeas","Lentils","Cooked lentils"]],["Eggs and dairy",["Egg","Feta cheese","Grated cheese"]],["Meat and fish",["Chicken breast","Salmon"]],["Grains and nuts",["Rice","White rice","Whole wheat bread","Whole wheat bread on the side","Quinoa"]]]}],"recipes":{"ene-c1":{"n":"Leek and Lentil Soup","time":"20 min","ing":["1 leek","2 carrots","1 can cooked lentils (400g)","1L vegetable broth","1 tbsp olive oil","Salt, cumin","1 tomato (optional · grated, when sautéing)"],"steps":["Slice the leek and carrot into rounds. Sauté with oil in a pot over medium heat for 5 min, stirring","Add the broth, turn up the heat until it boils, lower to medium and cook 10 min covered","Drain the lentils and add them with salt and cumin. 5 min more, stirring, and it's ready"],"tip":"Use canned lentils — they're already cooked. They only need 5 min of heat to soak up the flavor."},"ene-c2":{"n":"Rice with Broccoli and Egg","time":"18 min","ing":["½ cup white rice","150g frozen broccoli","1 egg","1 cup water","1 tbsp olive oil","Salt, garlic powder","1 tomato (optional · diced, on top to serve)"],"steps":["Put rice, water and salt in a pot. Bring to a boil, lower to the minimum, cover. Set a 15 min timer","At 10 min: put the frozen broccoli on top of the rice without stirring. Cover again","Fry the egg in a separate pan with oil. Serve rice + broccoli with the egg on top and garlic powder"],"tip":"The frozen broccoli goes straight into the pot without thawing. The egg can be fried if you haven't mastered poaching."},"ene-n1":{"n":"Cauliflower Cream Soup","time":"15 min","ing":["300g frozen cauliflower","½ onion","1 glass vegetable broth","1 tbsp olive oil","Salt, nutmeg","Whole grain bread to serve alongside"],"steps":["Chop the onion. Sauté with oil in a pot for 3 min over medium heat","Add the frozen cauliflower and the broth. Turn up the heat. Once it boils, lower to medium and cover 10 min","Blend with a hand blender, add salt and nutmeg. Serve with whole grain bread"],"tip":"Blend it well so it turns out smooth. A splash of coconut milk at the end makes it creamier."},"ene-n2":{"n":"Leek Omelette","time":"10 min","ing":["1 leek (white part)","2 eggs","1 tbsp olive oil","Salt","1 tomato (optional · sliced, on the side)"],"steps":["Slice the leek into thin rounds. Sauté with oil for 5 min over medium heat until softened","Beat the eggs with salt. Pour over the leek over medium-low heat. 3 min without stirring","Flip it over with a plate. 2 min more and it's ready"],"tip":"Sauté the leek well until it's translucent — that way it won't taste raw inside the omelette."},"feb-c1":{"n":"Spinach and Chickpea Bowl","time":"10 min","ing":["1 can chickpeas (400g)","2 handfuls fresh spinach","30g feta cheese","Juice of ½ lemon","2 tbsp olive oil","Salt, cumin","1 tomato (optional · diced)"],"steps":["Drain and rinse the chickpeas with cold water","Put the spinach in a bowl, add the chickpeas and the crumbled feta","Dress with lemon, oil, salt and cumin. Mix and dig in"],"tip":"If the spinach is fresh, it's ready as is. If it's frozen, thaw and drain it well."},"feb-c2":{"n":"Lemon Chicken with Broccoli","time":"20 min","ing":["1 chicken breast, sliced","150g frozen broccoli","½ cup rice","1 lemon","1 tbsp olive oil","Salt, garlic powder"],"steps":["Put rice with water and salt in a pot. Boil, lower to the minimum, cover 15 min. At 10 min add the broccoli on top","Salt the chicken. Pan with oil over medium-high heat. 4 min without moving it. Flip","4 min more, squeeze the lemon over it and turn off. Serve with rice and broccoli"],"tip":"Don't move the chicken until it releases from the pan on its own — that way it turns out golden and juicy."},"feb-n1":{"n":"Broccoli and Turmeric Cream Soup","time":"12 min","ing":["250g frozen broccoli","½ onion","1 glass vegetable broth","1 tbsp olive oil","½ tsp turmeric","Pinch black pepper","Salt"],"steps":["Sauté onion with oil for 3 min. Add frozen broccoli and broth","Bring to a boil and cook 8 min covered over medium heat","Add turmeric, pepper and salt. Blend until smooth"],"tip":"Turmeric needs a little black pepper to activate. Add a pinch when blending."},"feb-n2":{"n":"Spinach with Poached Egg","time":"8 min","ing":["2 handfuls spinach","1 egg","1 clove garlic (or garlic powder)","1 tbsp olive oil","Salt","Whole grain bread"],"steps":["Sauté the spinach with garlic and oil for 3 min over medium heat until it wilts down","At the same time: boil water, add a pinch of vinegar, stir and drop in the egg. 3 min","Serve the spinach with the egg on top and whole grain bread on the side"],"tip":"For the poached egg: boiling water with a pinch of vinegar, stir to make a whirlpool and drop in the egg. 3 min."},"mar-c1":{"n":"Quinoa with Asparagus and Egg","time":"15 min","ing":["½ cup pre-rinsed quinoa","1 bunch asparagus","2 eggs","1 tbsp olive oil","Juice of ½ lemon","Salt","1 tomato (optional · diced)"],"steps":["Boil quinoa with 1 cup water and salt. Once it boils, lower to the minimum and cover 12 min","Boil the eggs for 8 min in boiling water. Cool and peel","Grill the asparagus with oil and salt for 4 min. Serve it all together with lemon"],"tip":"Canned white asparagus works too. Drain them and grill them for 2 min."},"mar-c2":{"n":"Rice with Peas and Tuna","time":"18 min","ing":["½ cup rice","100g peas (frozen or canned)","1 can tuna in water","1 tbsp olive oil","Salt, parsley (optional)","1 tomato (optional · grated, when sautéing)"],"steps":["Boil rice with water and salt for 15-18 min. In the last 5 min add the peas on top","Drain the tuna. Mix rice + peas with the tuna, oil and salt"],"tip":"The tuna goes in at the end, off the heat — that way it doesn't dry out. Drain it well of the oil from the can."},"mar-n1":{"n":"Grilled Asparagus with Egg","time":"8 min","ing":["1 bunch green asparagus","1 egg","1 tbsp olive oil","Coarse salt","Whole grain bread"],"steps":["Heat a pan over high heat with oil. Grill the asparagus for 4 min with salt","In the same pan lower the heat and fry the egg. 2 min","Serve the asparagus with the egg on top and whole grain bread"],"tip":"The asparagus is ready when it turns bright green and you can pierce it easily."},"mar-n2":{"n":"Pea and Feta Bowl","time":"5 min","ing":["1 can cooked peas (400g)","50g feta cheese","1 tbsp olive oil","Juice of ½ lemon","Fresh or dried mint","Salt"],"steps":["Drain and rinse the peas. Put them in a bowl","Crumble the feta on top. Dress with oil, lemon, mint and salt. Ready"],"tip":"Use drained canned peas — they're already cooked. Frozen ones need just 3 min in the microwave."},"abr-c1":{"n":"Rice with Fava Beans and Chicken","time":"20 min","ing":["1 chicken breast in pieces","150g fava beans (fresh or frozen)","½ cup rice","1 tbsp olive oil","1 clove garlic","Salt, parsley","1 tomato (optional · grated, when sautéing)"],"steps":["Put the rice to cook with water and salt. 15-18 min depending on the type","Sauté the chicken pieces with oil and garlic for 5 min over medium-high heat until golden","Add the fava beans to the chicken. 5 min more over medium heat. Serve with the rice"],"tip":"Frozen fava beans don't need thawing — they go straight into the pan. The cooking time is the same."},"abr-c2":{"n":"Whole Wheat Pasta with Asparagus and Egg","time":"15 min","ing":["80g whole wheat pasta","1 bunch green asparagus","1 egg","2 tbsp olive oil","1 clove garlic","Salt, grated cheese","1 tomato (optional · diced)"],"steps":["Boil water with salt. Cook the pasta according to the package (8-10 min). Reserve a little of the water","Sauté the cut asparagus with garlic and oil for 4 min. Add the drained pasta and mix","Make a well, crack the egg and stir everything for 1 min. Turn off, add cheese"],"tip":"Whole wheat pasta is more filling than white and has more fiber. Cook it al dente — then finish it in the pan."},"abr-n1":{"n":"Asparagus Omelette","time":"10 min","ing":["1 bunch green asparagus","2 eggs","1 tbsp olive oil","Salt"],"steps":["Cut the asparagus into pieces. Sauté with oil and salt for 4 min over medium heat","Beat the eggs with salt, pour over the asparagus. 3 min over low heat without stirring","Flip it over with a plate. 2 min more and it's ready"],"tip":"Cut the asparagus into 2 cm pieces — that way they spread evenly through the whole omelette."},"abr-n2":{"n":"Pea Cream Soup","time":"12 min","ing":["250g frozen peas","½ onion","1 glass vegetable broth","1 tbsp olive oil","Mint (optional)","Salt"],"steps":["Sauté onion with oil for 3 min. Add peas and broth","Bring to a boil and cook 8 min over medium heat covered","Add mint and salt. Blend until smooth"],"tip":"A touch of mint when blending gives it lots of freshness. Without a blender, mash with a fork — it comes out more rustic."},"may-c1":{"n":"Lentils with Fava Beans and Carrot","time":"18 min","ing":["1 can cooked lentils (400g)","150g frozen fava beans","1 carrot","½ onion","1 tbsp olive oil","Salt, cumin, paprika","1 tomato (optional · grated, when sautéing)"],"steps":["Chop onion and carrot. Sauté with oil for 5 min over medium heat","Add the frozen fava beans and 1 glass of water. Cook 8 min covered","Add the drained lentils, salt, cumin and paprika. 5 min more and it's ready"],"tip":"Frozen fava beans go straight into the pot. They're much cheaper than fresh ones and just as good."},"may-c2":{"n":"Pasta with Tuna and Peas","time":"15 min","ing":["80g whole wheat pasta","100g frozen peas","1 can tuna in water","2 tbsp olive oil","Juice of ½ lemon","Salt","2 tbsp crushed tomato (optional)"],"steps":["Cook the pasta in salted water according to the package. In the last 3 min add the peas to the same pot","Drain everything. Mix with drained tuna, oil, lemon and salt. Ready"],"tip":"The tuna goes in off the heat at the end — that way it stays juicy and doesn't dry out. Add a splash of lemon to boost the flavor."},"may-n1":{"n":"Scrambled Eggs with Asparagus and Cheese","time":"8 min","ing":["2 eggs","1 bunch green asparagus","30g grated cheese","1 tbsp olive oil","Salt"],"steps":["Cut the asparagus into pieces. Sauté with oil for 4 min over medium heat","Beat the eggs with salt. Pour over the asparagus over medium-low heat, stirring gently","Turn off the heat while they're still creamy. Add grated cheese on top"],"tip":"The scramble turns out best over medium-low heat, stirring slowly — the eggs stay creamy, not dry."},"may-n2":{"n":"Broad Bean Salad with Feta","time":"5 min","ing":["1 can cooked broad beans","50g feta cheese","Juice of ½ lemon","2 tbsp olive oil","Fresh or dried mint","Salt","1 tomato (optional · diced)"],"steps":["Drain and rinse the broad beans. Put them in a bowl","Add the crumbled feta, lemon, oil, mint and salt. Mix gently and it's ready"],"tip":"Canned broad beans are already cooked — you just need to drain and rinse them. If you use frozen ones, 3 min in the microwave."},"jun-c1":{"n":"Quinoa Bowl with Zucchini","time":"15 min","ing":["½ cup quinoa","1 zucchini","50g feta cheese","½ cucumber","2 tbsp olive oil","Lemon juice","Salt","1 tomato (optional · diced)"],"steps":["Boil the quinoa with 1 cup water and salt. Once boiling, lower to the minimum and cover for 12 min","Grill the sliced zucchini with oil and salt for 4 min per side","Mix the quinoa, zucchini, chopped cucumber and feta. Dress with lemon and oil"],"tip":"Let the quinoa cool before mixing it with the zucchini — that way the bowl stays nice and fresh."},"jun-c2":{"n":"Chicken with Peppers and Rice","time":"20 min","ing":["1 chicken breast, sliced into fillets","1 red or green pepper","½ cup rice","1 tbsp olive oil","Salt, paprika, garlic powder","1 tomato (optional · grated, when sautéing)"],"steps":["Put the rice on to cook with water and salt for 18 min","Sauté the chicken for 4 min. Add the pepper in strips and paprika. Cook 5 min more","Serve the chicken with peppers on top of the rice"],"tip":"Peppers soften quickly with the heat. Don't cover them — that way they cook without steam and turn out tastier."},"jun-n1":{"n":"Green Gazpacho with Bread","time":"5 min","ing":["1 large cucumber","½ raw zucchini","2 tbsp olive oil","Juice of ½ lemon","1 garlic clove","Salt","Whole-grain bread"],"steps":["Chop the cucumber and raw zucchini without peeling. Put them in the blender jug","Add garlic, oil, lemon and salt. Blend until smooth. Taste for salt","Serve cold with whole-grain bread. If it's too thick, add a little water"],"tip":"Put all the ingredients in the fridge 1 hour before blending — much fresher and tastier."},"jun-n2":{"n":"Zucchini Omelette","time":"10 min","ing":["1 small zucchini","2 eggs","1 tbsp olive oil","Salt"],"steps":["Grate or thinly slice the zucchini. Sauté with oil and salt for 4 min until the water evaporates","Beat the eggs with salt. Pour over the zucchini over medium-low heat. 3 min without moving","Flip it and 2 min more. Ready"],"tip":"Zucchini releases a lot of water — put it in the pan with salt and wait for it to evaporate before adding the eggs."},"jul-c1":{"n":"Chickpea, Cucumber and Corn Salad","time":"5 min","ing":["1 can chickpeas (400g)","1 cucumber","½ red pepper","½ can sweet corn","Black olives","2 tbsp olive oil","Salt, oregano","1 tomato (optional · diced)"],"steps":["Drain and rinse the chickpeas. Put in a large bowl","Chop the cucumber and the pepper. Add to the bowl with the corn and the olives","Dress with oil, salt and oregano. Mix and dig in"],"tip":"Summer cucumber and pepper are crunchy and cheap. Canned corn adds the sweet touch."},"jul-c2":{"n":"Rice with Eggplant and Chickpeas","time":"20 min","ing":["1 eggplant","1 can chickpeas (400g)","½ cup rice","1 tbsp olive oil","1 garlic clove","Salt, cumin, paprika","1 tomato (optional · grated, when sautéing)"],"steps":["Put the rice on to cook with water and salt for 18 min","Meanwhile: sauté the cubed eggplant with garlic and oil for 8 min until golden","Add the drained chickpeas, cumin and paprika. 3 min more. Serve with the rice"],"tip":"Cut the eggplant into cubes and salt it before cooking — that way it loses the bitterness and absorbs less oil."},"jul-n1":{"n":"Cold Cucumber and Yogurt Soup","time":"5 min","ing":["2 cucumbers","2 plain yogurts","1 small garlic clove","2 tbsp olive oil","Juice of ½ lemon","Salt, mint or spearmint"],"steps":["Peel and chop the cucumbers. Put them in the blender jug","Add yogurt, garlic, oil, lemon and salt. Blend for 1 minute","Taste for salt. Serve very cold with little mint leaves"],"tip":"Make it the night before and keep it well covered in the fridge — very cold it tastes twice as good."},"jul-n2":{"n":"Tuna-Stuffed Peppers","time":"15 min","ing":["2 peppers (Italian or piquillo)","2 cans tuna in water","2 tbsp olive oil","Salt, oregano","Lemon juice","2 tbsp crushed tomato (optional · in the filling)"],"steps":["Mix the drained tuna with oil, lemon, salt and oregano in a bowl","Cut off the top of the peppers and scoop out the seeds. Fill with the tuna mixture","Heat in a covered pan over medium heat for 8 min until the pepper is tender"],"tip":"Italian or piquillo peppers are perfect for stuffing. Cut off the top and scoop out the seeds."},"ago-c1":{"n":"Quinoa Bowl with Pisto","time":"18 min","ing":["½ cup quinoa","1 zucchini","1 red pepper","1 small eggplant","1 tbsp olive oil","1 garlic clove","Salt, oregano","2 ripe tomatoes (optional · for the ratatouille)"],"steps":["Boil the quinoa with water and salt for 12 min on the minimum, covered","Chop all the vegetables into cubes. Sauté with garlic and oil for 10 min over medium heat, stirring","Add oregano and salt to the pisto. Serve over the quinoa"],"tip":"Pisto gets better from one day to the next — make double and save half for tomorrow."},"ago-c2":{"n":"Salmon en Papillote with Zucchini","time":"15 min","ing":["1 salmon fillet (150g)","1 sliced zucchini","1 tbsp olive oil","Juice of ½ lemon","Salt, dill (optional)","Parchment paper"],"steps":["Turn the oven on to 200°C. Put the sliced zucchini on parchment paper","Place the salmon on top, add oil, lemon and salt. Fold the paper, closing it well like an envelope","Bake for 12 min. The packet puffs up — that's a good sign. Open carefully, watch out for the steam"],"tip":"Papillote = parchment paper folded into an envelope. The steam trapped inside cooks the fish perfectly."},"ago-n1":{"n":"Ajoblanco with Melon","time":"10 min","ing":["50g raw or ground almonds","1 slice stale bread","1 small garlic clove","3 tbsp olive oil","1 tbsp vinegar","1 glass very cold water","Cubed melon"],"steps":["Soak the bread in water. Put it in the blender with almonds, garlic, oil and vinegar","Add the glass of very cold water and blend until very smooth","Serve very cold with the cubed melon on top"],"tip":"Day-old stale bread works perfectly — it gives it body. If you don't have ground almonds, a handful of raw almonds will do."},"ago-n2":{"n":"Grilled Eggplant with Cheese","time":"15 min","ing":["1 large eggplant","60g mozzarella or melting cheese","1 tbsp olive oil","Salt, oregano","1 tomato (optional · sliced)"],"steps":["Cut the eggplant into 1 cm slices. Salt and leave for 5 min. Pat dry with paper","Grill with oil over medium-high heat for 4 min per side until golden","Add the cheese on top, cover for 2 min until it melts. Add oregano"],"tip":"Salt the slices 10 min before cooking them and pat them dry with paper — that way they turn out crispy and don't soak up oil."},"sep-c1":{"n":"Pumpkin Cream Soup with Lentils","time":"18 min","ing":["250g frozen pumpkin","1 can cooked lentils (400g)","½ onion","1 glass vegetable stock","1 tbsp olive oil","Salt, turmeric, ginger"],"steps":["Sauté the onion with oil for 3 min. Add the frozen pumpkin and stock","Bring to a boil and cook for 12 min covered over medium heat until the pumpkin is tender","Blend. Add the drained lentils, turmeric, salt. Heat 3 min more"],"tip":"Frozen pumpkin comes already cut and peeled. It's the most practical and cheapest version."},"sep-c2":{"n":"Rice with Mushrooms and Chicken","time":"20 min","ing":["1 chicken breast in pieces","150g mushrooms (fresh or frozen)","½ cup rice","1 tbsp olive oil","1 garlic clove","Salt, parsley"],"steps":["Put the rice on to cook with water and salt for 18 min","Sauté the chicken with oil and garlic for 5 min. Add the mushrooms. Cook 6 min uncovered","Add salt and parsley. Serve with the rice"],"tip":"Mushrooms don't need much water — they cook in their own juices. Don't put a lid on when you sauté them."},"sep-n1":{"n":"Mushroom Soup with Bread","time":"12 min","ing":["150g mixed mushrooms","½ onion","1 garlic clove","1L vegetable stock","1 tbsp olive oil","Salt, parsley","Whole-grain bread"],"steps":["Chop the onion and garlic. Sauté with oil for 3 min. Add the chopped mushrooms and sauté 4 min","Add the stock. Bring to a boil and cook for 5 min. Add salt and parsley","Serve with toasted whole-grain bread"],"tip":"A splash of soy sauce at the end really intensifies the flavor. Just one teaspoon."},"sep-n2":{"n":"Quinoa with Roasted Eggplant","time":"18 min","ing":["1 eggplant","½ cup quinoa","50g feta cheese","2 tbsp olive oil","Salt, oregano","Lemon juice","1 tomato (optional · diced)"],"steps":["Turn the oven on to 200°C. Cut the eggplant into cubes, mix with oil and salt. Bake for 12 min","Boil the quinoa with water and salt for 12 min on the minimum, covered","Mix the quinoa with the roasted eggplant, crumbled feta, lemon and oregano"],"tip":"Eggplant roasted in the oven turns out softer and without bitterness than in the pan. It's worth turning the oven on."},"oct-c1":{"n":"Pumpkin and Lentil Bowl","time":"20 min","ing":["250g pumpkin (frozen or fresh)","1 can lentils (400g)","½ cup rice","1 tbsp olive oil","Salt, cumin, turmeric"],"steps":["Put the rice on to cook for 18 min. Meanwhile: put the diced pumpkin in a pan with oil over medium heat","Cook the pumpkin for 10 min, stirring, until tender. Add the cumin and turmeric","Add the drained lentils and salt. 2 min more. Serve with the rice"],"tip":"You can use frozen or jarred pumpkin to make it faster. The result is just as good."},"oct-c2":{"n":"Pasta with Mushrooms and Cheese","time":"18 min","ing":["80g whole-wheat pasta","150g mushrooms","30g grated cheese","1 clove garlic","2 tbsp olive oil","Salt, parsley"],"steps":["Cook the pasta in salted water according to the package. Reserve ½ glass of the water","Sauté the mushrooms with garlic and oil for 6 min over medium heat, uncovered","Mix the drained pasta with the mushrooms and a little of the reserved water. Add the cheese and parsley"],"tip":"Save a little of the pasta cooking water — it helps emulsify the sauce so it clings nicely to the pasta."},"oct-n1":{"n":"Spiced Pumpkin Soup","time":"12 min","ing":["300g frozen pumpkin","½ onion","1 glass vegetable broth","½ can coconut milk","1 tbsp olive oil","Ground ginger, turmeric, salt"],"steps":["Sauté the onion with oil for 3 min. Add the frozen pumpkin and broth","Bring to a boil and cook for 8 min, covered. Turn off the heat","Blend. Add the coconut milk, turmeric, ginger, and salt. Mix and serve"],"tip":"Coconut milk makes it creamier and more filling. Without it, it's still tasty with just the broth."},"oct-n2":{"n":"Mushrooms with Egg and Garlic","time":"8 min","ing":["150g mushrooms","1 clove garlic","1 egg","1 tbsp olive oil","Salt, parsley","Whole-wheat bread"],"steps":["Sauté the mushrooms with garlic and oil over high heat for 5 min, uncovered. Salt them at the end","Make a gap in the pan and fry the egg over medium heat for 2 min","Serve with whole-wheat bread and chopped parsley"],"tip":"Don't cover the pan when you sauté the mushrooms — the steam would cook them and they'd turn soft instead of golden."},"nov-c1":{"n":"Leek and Chicken Soup","time":"18 min","ing":["1 chicken breast (or 2 thighs)","2 leeks","1 carrot","1L chicken broth","1 tbsp olive oil","Salt, parsley"],"steps":["Chop the leeks and carrot. Sauté with oil in a large pot for 5 min over medium heat","Add the chicken in small cubes and the broth. When it boils, lower to medium heat and cook 10 min covered","Add parsley and salt. Taste and serve"],"tip":"Diced chicken thigh stays juicier than breast in the soup. It's also cheaper."},"nov-c2":{"n":"Lentils with Mushrooms","time":"18 min","ing":["1 can lentils (400g)","150g mushrooms","1 carrot","½ onion","1 tbsp olive oil","Salt, paprika, garlic"],"steps":["Chop the onion and carrot. Sauté with oil and garlic for 5 min","Add the chopped mushrooms. Sauté for 5 min, uncovered. Add the paprika","Add the drained lentils and ½ glass of water. Salt. Cook for 8 min, stirring"],"tip":"Dried mushrooms add lots of flavor to the broth. Soak them for 10 min in hot water before using."},"nov-n1":{"n":"Cauliflower and Leek Soup","time":"12 min","ing":["200g frozen cauliflower","1 leek","1 glass vegetable broth","1 tbsp olive oil","Salt, nutmeg","Whole-wheat bread"],"steps":["Slice the leek. Sauté with oil for 4 min over medium heat","Add the frozen cauliflower and broth. Bring to a boil and cook for 8 min, covered","Blend well. Add the nutmeg and salt. Serve with bread"],"tip":"The leek gives the soup a sweeter, milder flavor than onion. It's the secret of this recipe."},"nov-n2":{"n":"Sautéed Cabbage with Egg and Garlic","time":"8 min","ing":["¼ cabbage (green or kale)","1 clove garlic","1 egg","1 tbsp olive oil","Salt","Whole-wheat bread"],"steps":["Cut the cabbage into thin strips. Sauté with garlic and oil over high heat for 4 min, uncovered","Add salt, push the cabbage to the sides, and fry the egg in the center for 3 min","Serve with whole-wheat bread"],"tip":"Cabbage needs high heat to sauté — that way it turns slightly golden and not soft. Stir it little."},"dic-c1":{"n":"Quinoa Bowl with Broccoli and Salmon","time":"18 min","ing":["½ cup quinoa","1 salmon fillet (150g)","150g frozen broccoli","1 tbsp olive oil","Lemon juice","Salt, dill"],"steps":["Boil the quinoa for 12 min on low. At the 8-min mark, put the broccoli on top without mixing","Salt the salmon. Pan-sear with oil for 3 min per side over medium-high heat","Serve the quinoa and broccoli with the salmon on top. Squeeze the lemon and add the dill"],"tip":"Frozen salmon fillet is much cheaper than fresh. Thaw it the night before."},"dic-c2":{"n":"Lentils with Leek and Carrot","time":"20 min","ing":["1 can lentils (400g)","1 leek","1 carrot","½ onion","1 tbsp olive oil","Salt, paprika, bay leaf"],"steps":["Chop the onion, leek, and carrot. Sauté with oil and bay leaf for 5 min","Add ½ glass of water and paprika. Cook for 10 min over medium heat, covered","Add the drained lentils and salt. 5 min more and it's ready"],"tip":"A splash of wine vinegar when serving boosts the iron absorption from the lentils. A simple trick."},"dic-n1":{"n":"Leek Soup","time":"12 min","ing":["2 leeks (all of it, including the green part)","1 glass vegetable broth","1 tbsp olive oil","Salt, nutmeg","Whole-wheat bread"],"steps":["Slice the leeks. Sauté with oil in a pot for 4 min over medium heat","Add the broth. Bring to a boil and cook for 8 min, covered","Blend. Add the nutmeg and salt. Serve with toasted bread"],"tip":"Use the green part of the leek too — it adds more flavor and there's no reason to throw it away."},"dic-n2":{"n":"Broccoli with Egg and Cheese","time":"10 min","ing":["200g broccoli (fresh or frozen)","1 egg","30g grated cheese","1 tbsp olive oil","Salt"],"steps":["Broccoli in the microwave: put it in a bowl with 2 tbsp water, cover with plastic wrap, 4 min","Fry the egg with oil in a pan for 2 min","Serve the broccoli with the egg on top and grated cheese. Add salt"],"tip":"Broccoli in the microwave takes only 4 minutes with a little water — much faster than boiling."},"exp-c1":{"n":"Express Pasta with Tuna","time":"10 min","ing":["80g whole-wheat pasta","1 can tuna in water","Handful of frozen peas","2 tbsp olive oil","Garlic powder, oregano, salt","2 tbsp crushed tomato (optional)"],"steps":["Put salted water on to boil and cook the pasta for the time on the package. Last 3 min: add the frozen peas to the water","Drain it all together. Mix with the tuna, oil, garlic powder, and oregano"],"tip":"Toss the frozen peas into the pasta water for the last 3 minutes — one less pot to wash."},"exp-c2":{"n":"Sautéed Rice with Egg","time":"12 min","ing":["½ cup rice (or yesterday's rice)","2 eggs","Handful of frozen peas","1 tbsp olive oil","Garlic powder, salt, paprika"],"steps":["Cook the rice for 12 min (skip this step if you're using yesterday's rice or a pouch)","Sauté the peas with oil for 2 min. Add the rice and sauté for 2 min more","Make a gap in the center, crack in the eggs, and stir until set. Season"],"tip":"If you have cooked rice from another day (or a microwave rice pouch), this dish comes together in 6 minutes."},"exp-n1":{"n":"Spinach Scramble with Bread","time":"8 min","ing":["3 eggs","2 handfuls of frozen spinach","1 slice whole-wheat bread","1 tbsp olive oil","Salt, pepper"],"steps":["Sauté the frozen spinach with oil for 3 min until it loses its water","Beat the eggs with salt and add them. Stir gently until set. Toast the bread"],"tip":"Frozen spinach goes straight into the pan — it releases its water and in 3 minutes it's ready."},"exp-n2":{"n":"Spiced Sautéed Chickpeas","time":"10 min","ing":["1 can chickpeas (400g)","Handful of frozen spinach","1 tbsp olive oil","Paprika, cumin, salt","1 tomato (optional · diced)"],"steps":["Drain the chickpeas. Sauté them with oil over medium-high heat for 5 min until golden","Add the frozen spinach, paprika, and cumin. 4 min more and it's ready"],"tip":"Paprika and cumin turn a can of chickpeas into something delicious. Don't skip them."}},"lunch":"lunch","dinner":"dinner"},"clean":[{"name":"Kitchen","day":1,"dayName":"Lunes","tasks":[{"n":"Tidy and clear the kitchen","min":3,"tip":"Put each thing in its place before cleaning"},{"n":"Clean worktops and splashbacks","min":5,"tip":"Degreaser spray, wipe left to right"},{"n":"Hob or stovetop","min":5,"tip":"With the hob cold, use the scraper for stubborn marks"},{"n":"Sink and tap","min":3,"tip":"A little glass cleaner on the tap makes it shine"},{"n":"Outside of appliances","min":3,"tip":"Fridge, microwave, coffee maker — outside surface only"},{"n":"Sweep and mop","min":5,"tip":"Start from the back and move toward the door"}]},{"name":"Bathroom","day":2,"dayName":"Martes","tasks":[{"n":"Tidy the vanity","min":2,"tip":"Throw out anything expired or empty"},{"n":"Basin and tap","min":4,"tip":"Let the cleaner sit 2 minutes before rinsing"},{"n":"Mirror and surfaces","min":3,"tip":"Newspaper with glass cleaner — zero streaks"},{"n":"Toilet inside and out","min":5,"tip":"Start outside, finish with the inside"},{"n":"Shower or bathtub","min":4,"tip":"Anti-limescale spray on the tap while you clean the base"},{"n":"Sweep and wash the floor","min":4,"tip":"The bathroom is small — this goes super fast"}]},{"name":"Living room","day":3,"dayName":"Miércole makeup / cleanse face","Apply moisturiser","Eye contour cream","Put on comfy pyjamas"],"str":[]},{"title":"Gentle stretches","desc":"A stretching sequence to release the day’s tension","list":[],"str":[{"n":"Neck & shoulders","d":"Turn your head slowly to both sides. Raise your shoulders and let them drop.","t":"30-45 sec"},{"n":"Arms & wrists","d":"Extend one arm, pull gently with the other hand. Rotate your wrists.","t":"30 sec each arm"},{"n":"Upper back","d":"Interlace fingers, stretch arms upward. Lean gently to each side.","t":"30 sec each side"},{"n":"Spine","d":"Seated, turn your torso slowly to the right and then to the left.","t":"30 sec each side"},{"n":"Hips & legs","d":"Standing, bring one knee toward your chest. Switch legs.","t":"20 sec each leg"},{"n":"Ankles","d":"Seated or standing, rotate your ankles in circles. Flex and point your feet.","t":"20 sec each foot"}]},{"title":"Shiné meditation","desc":"Meditation for mental calm and mindful breathing","list":[],"str":[]},{"title":"Digital disconnection","desc":"A letting-go phrase and putting devices away","list":[],"str":[]}],"calm":{"crisis":[["988","Support line · 24 h (US)"],["116 123","Samaritans · 24 h (UK & Ireland)"],["112","Emergencies (EU) · 911 US/Canada · 999 UK"]],"rescues":[{"name":"Cold water (crisis)","when":"When the emotion is unbearable — full crisis","desc":"Changes your body chemistry in seconds","steps":[{"t":"COLD WATER","i":"Splash cold water on your face or wrists for 30 seconds. It triggers the dive reflex","s":30},{"t":"MOVE","i":"Run in place or jump with all your energy","s":60},{"t":"STOP","i":"Stop. Breathe. Feel your body starting to calm","s":30},{"t":"RELAX","i":"Relax shoulders, jaw, hands. Muscle by muscle","s":30}]},{"name":"4-7-8 breathing","when":"When anxiety or panic kicks in","desc":"Calms the nervous system in minutes","steps":[{"t":"INHALE 4","i":"Inhale slowly through your nose counting to 4","s":4},{"t":"HOLD 7","i":"Hold the air gently, count to 7","s":7 n’t minimise it","s":15},{"t":"HUMANITY","i":"Remember: everyone suffers sometimes. You’re not alone","s":15},{"t":"KINDNESS","i":"Say softly: “May I be well. May I treat myself with care”","s":20},{"t":"STAY","i":"Feel the warmth of your hand on your chest. Breathe. Here is comfort","s":20}]},{"name":"Free writing","when":"When you need to get out what’s inside","desc":"Empty your mind with no filters","steps":[{"t":"PREPARE","i":"Grab paper or notes. No filters — whatever comes out is fine","s":10},{"t":"WRITE","i":"Write everything you feel, non-stop, without erasing. Let it flow","s":120},{"t":"READ","i":"Read what you wrote once. Without judging","s":30},{"t":"RELEASE","i":"Close it or save it. It’s out of you now. That’s enough","s":10}]},{"name":"Connect","when":"When you feel alone or isolated","desc":"A small gesture breaks the isolation","steps":[{"t":"CHOOSE","i":"Think of someone you feel safe with. Just one","s":10},{"t":"REACH OUT","i":"Send a voice note, a message, or call them right now","s":60},{"t":"RECEIVE","i":"If they can’t answer, that’s okay. You made the gesture — that counts","s":15},{"t":"ACKNOWLEDGE","i":"You broke the isolation. That’s courage","s":10}]}]}};try{localStorage.setItem('qk_lang','en');}catch(e){}

var L=K,H=document.getElementById('app'),tm=null,S=null;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function get(k,d){try{var v=localStorage.getItem('qk_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function put(k,v){try{localStorage.setItem('qk_'+k,JSON.stringify(v));}catch(e){}}
function dayIdx(){var d=new Date().getDay();return d===0?6:d-1;}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function bar(back){return '<div class="top"><a href="'+back+'">&larr; '+L.back+'</a></div>';}
function stop(){if(tm){clearInterval(tm);tm=null;}}
function home(){var h='<h1>'+L.title+'</h1>',r=['#ex','#food','#clean','#night','#calm'];
  for(var i=0;i<r.length;i++)h+='<a href="'+r[i]+'">'+L.home[i]+'</a>';
  h+='<p class="m">'+L.lang+': <a class="s" href="es.html">Español</a><a class="s" href="en.html">English</a><a class="s" href="fr.html">Français</a></p><p class="n">'+L.note+'</p>';return h;}
/* ── Ejercicio ── */
function dayOf(lv,d){var a=D.ex.days;for(var i=0;i<a.length;i++)if(a[i].lv===lv&&a[i].d===d)return a[i];return null;}
function uniq(items){var s={},o=[];for(var i=0;i<items.length;i++)if(!s[items[i].id]){s[items[i].id]=1;o.push(items[i]);}return o;}
function exDay(d){var lv=get('lvl',0),day=dayOf(lv,d),h=bar('#')+'<h1>'+esc(day.name)+': '+esc(day.focus)+'</h1>';
  h+='<p>'+L.level+': ';for(var i=0;i<3;i++)h+='<a class="s'+(i===lv?' on':'')+'" href="#lvl/'+i+'/'+d+'">'+L.lv[i]+'</a>';h+='</p>';
  h+='<p class="m">';for(var j=0;j<7;j++)h+='<a class="s'+(j===d?' on':'')+'" href="#ex/'+j+'">'+L.week[j].slice(0,3)+'</a>';h+='</p>';
  h+='<p class="m">~'+day.mins+' '+L.min+'</p><a href="#run/'+d+'">'+L.start+'</a>';
  var u=uniq(day.items);for(var k=0;k<u.length;k++){var it=u[k],x=D.ex.info[it.id];
    h+='<div class="ex"><h3>'+esc(x.n)+'</h3><p class="m">'+it.dur+' '+L.sec+(it.sides===2?' ('+L.sides+')':'')+(x.zones.length?' &middot; '+L.works+': '+esc(x.zones.join(', ')):'')+'</p>'
      +'<img class="fig" src="fig/'+it.id+'.png" alt="'+esc(L.fig)+'">'
      +'<p><b>'+L.pos+':</b> '+esc(x.pos)+'</p>'+(x.exe?'<ol><li>'+esc(x.exe).split(' &middot; ').join('</li><li>').split(' · ').join('</li><li>').replace(/<li>\d+\.\s*/g,'<li>')+'</li></ol>':'')+'</div>';}
  return h;}
/* sesión: prepárate → ejercicio (→ cambio de lado) → descanso */
function run(d){var lv=get('lvl',0);S={d:d,items:dayOf(lv,d).items,i:0,ph:'prep',t:8,side:1,paused:false};tick0();}
function phaseLabel(){return S.ph==='prep'?L.prep:S.ph==='rest'?L.rest:S.ph==='switch'?L.side2:'';}
function drawRun(){if(!S)return;var it=S.items[S.i],x=D.ex.info[it.id],nx=S.items[S.i+1];
  var show=S.ph==='rest'&&nx?nx:it,sx=D.ex.info[show.id];
  H.innerHTML=bar('#ex/'+S.d)+'<p class="m">'+L.exOf.replace('{i}',S.i+1).replace('{n}',S.items.length)+'</p>'
   +'<p class="ph">'+(S.paused?L.pause:(S.ph==='rest'?L.rest+' &middot; '+L.next:phaseLabel()))+'</p>'
   +'<div class="big" id="t">'+S.t+'</div><h1 style="text-align:center">'+esc(sx.n)+(show.sides===2&&S.ph!=='rest'?' &middot; '+(S.side===1?L.side1:L.side2):'')+'</h1>'
   +'<img class="fig" style="margin:0 auto" src="fig/'+show.id+'.png" alt="">'
   +'<div class="row"><button class="b" onclick="pz()">'+(S.paused?L.resume:L.pause)+'</button><button class="b" onclick="nx()">'+L.next+'</button><button class="b" onclick="ex()">'+L.exit+'</button></div>'
   +'<p>'+esc(sx.pos)+'</p>';}
function tick0(){stop();drawRun();tm=setInterval(tick,1000);}
function tick(){if(!S||S.paused)return;S.t--;var e=document.getElementById('t');if(S.t>0){if(e)e.innerHTML=S.t;return;}adv();}
function adv(){var it=S.items[S.i];
  if(S.ph==='prep'||S.ph==='switch'){S.ph='work';S.t=it.dur;}
  else if(S.ph==='work'&&it.sides===2&&S.side===1){S.ph='switch';S.side=2;S.t=5;}
  else if(S.ph==='work'&&it.rest>0&&S.i<S.items.length-1){S.ph='rest';S.t=it.rest;}
  else{S.i++;S.side=1;if(S.i>=S.items.length){stop();var d=S.d;S=null;put('done_'+todayKey(),1);H.innerHTML=bar('#ex/'+d)+'<h1>'+L.done+'</h1><a href="#">'+L.back+'</a>';return;}S.ph='prep';S.t=5;}
  drawRun();}
function pz(){if(S){S.paused=!S.paused;drawRun();}}
function nx(){if(S){S.t=1;S.paused=false;adv();}}
function ex(){var d=S?S.d:dayIdx();stop();S=null;location.hash='#ex/'+d;}
/* ── Comida ── */
function food(){var m=D.food.months[new Date().getMonth()],h=bar('#')+'<h1>'+L.home[1]+' &middot; '+esc(m.name)+'</h1>';
  h+='<h2>'+L.lunch+'</h2>';for(var i=0;i<m.lunch.length;i++)h+='<a href="#r/'+m.lunch[i]+'">'+esc(D.food.recipes[m.lunch[i]].n)+' <span class="m">&middot; '+esc(D.food.recipes[m.lunch[i]].time)+'</span></a>';
  h+='<h2>'+L.dinner+'</h2>';for(var j=0;j<m.dinner.length;j++)h+='<a href="#r/'+m.dinner[j]+'">'+esc(D.food.recipes[m.dinner[j]].n)+' <span class="m">&middot; '+esc(D.food.recipes[m.dinner[j]].time)+'</span></a>';
  h+='<a href="#shop">'+L.shop+'</a>';return h;}
function recipe(id){var r=D.food.recipes[id];if(!r)return food();var h=bar('#food')+'<h1>'+esc(r.n)+'</h1><p class="m">'+esc(r.time)+'</p><h2>'+L.ing+'</h2><ul>';
  for(var i=0;i<r.ing.length;i++)h+='<li>'+esc(r.ing[i])+'</li>';h+='</ul><h2>'+L.steps+'</h2><ol>';
  for(var j=0;j<r.steps.length;j++)h+='<li>'+esc(r.steps[j])+'</li>';h+='</ol>'+(r.tip?'<p class="n"><b>'+L.tip+':</b> '+esc(r.tip)+'</p>':'');return h;}
function shop(){var m=D.food.months[new Date().getMonth()],k='shop_'+new Date().getMonth(),ck=get(k,{}),h=bar('#food')+'<h1>'+L.shop+'</h1>';
  for(var i=0;i<m.shop.length;i++){h+='<h2>'+esc(m.shop[i][0])+'</h2>';for(var j=0;j<m.shop[i][1].length;j++){var id=i+'_'+j;
    h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+id+'\',this.checked)"'+(ck[id]?' checked':'')+'>'+esc(m.shop[i][1][j])+'</label>';}}
  return h;}
function ck(k,id,v){var o=get(k,{});o[id]=v;put(k,o);}
/* ── Limpieza ── */
function zone(z,k){var h='<h2>'+esc(z.name)+' <span class="m">&middot; '+esc(z.dayName)+'</span></h2>',ck_=get(k,{});
  for(var i=0;i<z.tasks.length;i++){var t=z.tasks[i];h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+i+'\',this.checked)"'+(ck_[i]?' checked':'')+'><b>'+esc(t.n)+'</b> <span class="m">('+t.min+' '+L.min+')</span><br><span class="m">'+esc(t.tip)+'</span></label>';}
  return h;}
function clean(){var wd=new Date().getDay(),h=bar('#')+'<h1>'+L.home[2]+'</h1>',today=null,i;
  for(i=0;i<D.clean.length;i++)if(D.clean[i].day===wd)today=D.clean[i];
  h+=today?zone(today,'clean_'+todayKey()):'<p class="n">'+L.noclean+'</p>';
  h+='<h2>'+L.other+'</h2>';for(i=0;i<D.clean.length;i++)if(D.clean[i]!==today)h+='<a href="#zone/'+i+'">'+esc(D.clean[i].name)+' <span class="m">&middot; '+esc(D.clean[i].dayName)+'</span></a>';return h;}
/* ── Noche ── */
function night(){var h=bar('#')+'<h1>'+L.home[3]+'</h1>',k='night_'+todayKey(),c=get(k,{});
  for(var i=0;i<D.night.length;i++){var s=D.night[i];h+='<h2>'+(i+1)+'. '+esc(s.title)+'</h2><p>'+esc(s.desc)+'</p>';
    for(var j=0;j<s.list.length;j++){var id=i+'_'+j;h+='<label class="c"><input type="checkbox" onclick="ck(\''+k+'\',\''+id+'\',this.checked)"'+(c[id]?' checked':'')+'>'+esc(s.list[j])+'</label>';}
    if(s.str.length){h+='<ul>';for(var q=0;q<s.str.length;q++)h+='<li><b>'+esc(s.str[q].n)+'</b> ('+esc(s.str[q].t)+'): '+esc(s.str[q].d)+'</li>';h+='</ul>';}}
  return h;}
/* ── Calma ── */
function calm(){var h=bar('#')+'<h1>'+L.home[4]+'</h1>';
  for(var j=0;j<D.calm.rescues.length;j++)h+='<a href="#res/'+j+'">'+esc(D.calm.rescues[j].name)+'<br><span class="m">'+esc(D.calm.rescues[j].when)+'</span></a>';
  h+='<div class="n">'+L.calmCall;for(var i=0;i<D.calm.crisis.length;i++)h+='<br><b>'+esc(D.calm.crisis[i][0])+'</b> &middot; '+esc(D.calm.crisis[i][1]);return h+'</div>';}
function rescue(j){var r=D.calm.rescues[j],h=bar('#calm')+'<h1>'+esc(r.name)+'</h1><p>'+esc(r.desc)+'</p><ol>';
  for(var i=0;i<r.steps.length;i++)h+='<li><b>'+esc(r.steps[i].t)+'</b> ('+r.steps[i].s+' '+L.sec+'): '+esc(r.steps[i].i)+'</li>';return h+'</ol>';}
/* ── Navegación por #ruta ── */
function route(){stop();S=null;var p=(location.hash||'#').slice(1).split('/'),h;
  if(p[0]==='lvl'){put('lvl',+p[1]);location.hash='#ex/'+p[2];return;}
  if(p[0]==='ex')h=exDay(p[1]?+p[1]:dayIdx());
  else if(p[0]==='run'){run(+p[1]);window.scrollTo(0,0);return;}
  else if(p[0]==='food')h=food();else if(p[0]==='r')h=recipe(p[1]);else if(p[0]==='shop')h=shop();
  else if(p[0]==='clean')h=clean();else if(p[0]==='zone')h=bar('#clean')+zone(D.clean[+p[1]],'clean_'+todayKey());
  else if(p[0]==='night')h=night();else if(p[0]==='calm')h=calm();else if(p[0]==='res')h=rescue(+p[1]);
  else h=home();
  H.innerHTML=h;window.scrollTo(0,0);}
window.onhashchange=route;route();
</script></body></html>
