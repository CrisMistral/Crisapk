<header class="site-header">

    <a class="brand" href="index.html">Art<em>dequé</em></a>

<div class="archivo-cab">
  <p class="eyebrow" data-i18n="archive_eyebrow">El archivo</p>

<script src="taxonomias.js"></script>
<script src="i18n.js"></script>
<script src="galeria.js"></script>
<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var T=function(k,v){return I18N.t(k,v);};
  var DIAS=30; // últimos 30 días de portada
  var TODAS=[];

  function pintar(todas){
    TODAS=todas||TODAS;
    var hoy=GD.epochDay();
    var out=[];
    var i;
    for(i=0;i<DIAS;i++){
      var dia=hoy-i;
      var o=GD.obraDelDiaPara(dia,TODAS);
      if(!o) continue;
      var fecha=new Date(dia*86400000);
      var etq=(i===0?T('today'):(i===1?T('yesterday'):GD.fechaCorta(fecha)));
      out.push(
        '<a class="dia'+(i===0?' hoy':'')+'" href="obra.html?id='+encodeURIComponent(o.id)+'">'+
          GD.thumbHTML(o)+
          '<div class="f">'+etq+'</div>'+
          '<div class="t">'+GD.esc(o.titulo)+'</div>'+
        '</a>'
      );
    }
    $('grid').innerHTML=out.join('') || '<p class="muted">'+T('archive_empty')+'</p>';
  }

  GD.cargarObras().then(pintar).catch(function(){
    $('grid').innerHTML='<p class="muted">'+T('archive_empty')+'</p>';
  });

  document.addEventListener('i18n:change',function(){ pintar(); });
})();
</script>
</body>
</html>
