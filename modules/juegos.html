<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>¿Quién fue? · Quico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#26a69a;--td:#1a6b64;--mint:#d6f0eb;--mm:#b8e4dd;--ms:#e8f8f5;--fg:#1a2e2b;--fg2:#2d6b64;--gold:#f5c518;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;background:var(--ms);}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;color:var(--fg);padding:16px 12px 100px;}
.screen{display:none;width:100%;max-width:460px;flex-direction:column;align-items:center;}
.screen.active{display:flex;}
h1{color:var(--td);font-size:1.5rem;font-weight:800;text-align:center;}
.sub{color:var(--fg2);font-size:.85rem;text-align:center;margin-bottom:18px;font-weight:600;line-height:1.45;}
/* Picker */
.pick-grid{display:flex;flex-direction:column;gap:12px;width:100%;}
.pick-card{background:#fff;border:none;border-radius:18px;padding:16px;cursor:pointer;box-shadow:0 3px 12px rgba(38,166,154,.12);position:relative;font-family:'Outfit',sans-serif;display:flex;align-items:center;gap:14px;text-align:left;}
.pick-card:active{transform:scale(.98);}
.pick-em{font-size:2rem;flex-shrink:0;}
.pick-info h3{font-size:1rem;font-weight:800;color:var(--td);}
.pick-info p{font-size:.78rem;color:var(--fg2);font-weight:600;margin-top:2px;}
.pick-badge{position:absolute;top:12px;right:14px;font-size:1.1rem;}
.pick-num{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--td);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem;}
/* Game */
.topbar{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:12px;}
.back-btn{width:42px;height:42px;border:none;background:#fff;border-radius:13px;font-size:1.3rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:var(--td);flex-shrink:0;}
.topbar h2{font-size:1.05rem;font-weight:800;color:var(--td);}
.story{background:#fff;border-radius:16px;padding:14px 16px;font-size:.86rem;line-height:1.5;color:var(--fg);box-shadow:0 3px 12px rgba(38,166,154,.1);margin-bottom:14px;width:100%;}
.seclabel{font-size:.72rem;font-weight:800;color:var(--fg2);text-transform:uppercase;letter-spacing:.06em;margin:2px 2px 8px;align-self:flex-start;}
/* Sillas */
.seats{display:flex;gap:8px;justify-content:center;width:100%;margin-bottom:16px;flex-wrap:wrap;}
.seat{flex:1;min-width:60px;max-width:88px;aspect-ratio:1;background:#fff;border:2.5px dashed var(--mm);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .1s,border-color .1s;}
.seat:active{transform:scale(.96);}
.seat.sel{border-color:var(--teal);border-style:solid;box-shadow:0 0 0 3px rgba(38,166,154,.18);}
.seat.filled{border-style:solid;border-color:var(--mm);background:var(--ms);}
.seat .seat-n{position:absolute;top:5px;left:8px;font-size:.66rem;font-weight:800;color:var(--fg2);}
.seat .seat-em{font-size:2rem;}
.seat.culprit{border-color:#e5484d;border-style:solid;box-shadow:0 0 0 3px rgba(229,72,77,.35);background:#fff2f2;}
.seat.nope{animation:nope .3s ease;}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.seat.pop{animation:pop .28s ease;}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
/* Pistas */
.clues{background:#fff;border-radius:16px;padding:6px 4px;width:100%;box-shadow:0 3px 12px rgba(38,166,154,.1);margin-bottom:16px;}
.clue{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;font-size:.85rem;line-height:1.4;color:var(--fg);}
.clue+.clue{border-top:1px solid var(--ms);}
.clue .ci{color:var(--teal);font-weight:800;flex-shrink:0;}
/* Sospechosos */
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;margin-bottom:16px;}
.sus{border:2px solid var(--mm);background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:'Outfit',sans-serif;font-weight:700;color:var(--td);font-size:.9rem;transition:transform .1s;}
.sus:active{transform:scale(.95);}
.sus.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(38,166,154,.18);}
.sus.placed{opacity:.32;pointer-events:none;}
.sus .se{font-size:1.3rem;}
.btn{border:none;border-radius:14px;padding:14px 22px;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:800;cursor:pointer;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-soft{background:var(--mm);color:var(--td);}
.btn:disabled{opacity:.45;pointer-events:none;}
.msg{min-height:22px;font-size:.85rem;font-weight:700;color:var(--fg2);text-align:center;margin-bottom:10px;}
/* Win */
.done-hero{position:fixed;inset:0;background:rgba(15,77,71,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:22px;}
.done-hero.show{display:flex;}
.dh-card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:320px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .3s ease;}
.dh-em{font-size:3.4rem;}
.dh-card h3{font-size:1.5rem;font-weight:800;color:var(--td);margin:6px 0 4px;}
.dh-card p{font-size:1rem;color:var(--fg2);font-weight:700;line-height:1.4;margin-bottom:16px;}
.row-btns{display:flex;gap:10px;}.row-btns .btn{flex:1;padding:12px;}
.spark{position:fixed;font-size:1.3rem;pointer-events:none;animation:spark 1.2s ease-out forwards;z-index:21;}
@keyframes spark{0%{transform:scale(0);opacity:0}30%{opacity:1}100%{transform:scale(1.5) translateY(-40px);opacity:0}}
.calm *,.calm *::before,.calm *::after{animation:none !important;transition:none !important}
</style>
</head>
<body>

<!-- PICKER -->
<div id="v-pick" class="screen active">
  <img src="../quico/quico_happy.png" alt="Quico" style="width:112px;height:auto;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 10px rgba(93,64,55,.18))">
  <h1 data-i18n="title">🔍 ¿Quién fue?</h1>
  <p class="sub" data-i18n="sub">Lee las pistas, coloca a los sospechosos y descubre al culpable.</p>
  <div class="pick-grid" id="pick-grid"></div>
</div>

<!-- GAME -->
<div id="v-game" class="screen">
  <div class="topbar">
    <button class="back-btn" onclick="go('v-pick')">←</button>
    <h2 id="game-title">Caso</h2>
  </div>
  <div class="story" id="story"></div>
  <div class="seclabel" data-i18n="seats_label">Sillas</div>
  <div class="seats" id="seats"></div>
  <div class="seclabel" data-i18n="clues_label">Pistas</div>
  <div class="clues" id="clues"></div>
  <div class="seclabel" data-i18n="tray_label">Sospechosos</div>
  <div class="tray" id="tray"></div>
  <div class="msg" id="msg"></div>
  <button class="btn btn-teal" id="check-btn" onclick="checkCase()" data-i18n="check">Comprobar</button>
  <div class="done-hero" id="done-hero">
    <div class="dh-card">
      <div class="dh-em" id="dh-em">🔍</div>
      <h3 data-i18n="win_t">¡Resuelto!</h3>
      <p id="dh-culprit"></p>
      <div class="row-btns">
        <button class="btn btn-soft" onclick="go('v-pick')" data-i18n="gallery">← Casos</button>
        <button class="btn btn-teal" id="next-btn">→</button>
      </div>
    </div>
  </div>
</div>

<script>
/* Ajustes globales compartidos */
function __cfg(){try{return JSON.parse(localStorage.getItem('cris_cfg')||'{}');}catch(e){return{};}}
function __allow(k){const c=__cfg();return c[k]!==false&&c.calm!==true;}
if(__cfg().calm)document.documentElement.classList.add('calm');

/* ── IDIOMAS ── */
const I18N={
 es:{title:'🔍 ¿Quién fue?',sub:'Lee las pistas, coloca a los sospechosos en su silla y descubre al culpable. ¡Pura lógica!',
   seats_label:'Sillas',clues_label:'Pistas',tray_label:'Sospechosos',check:'🔎 Comprobar',
   fillall:'Coloca a todos primero 🙂',wrong:'Mmm… algo no cuadra. Relee las pistas 🔍',
   win_t:'¡Resuelto!',win_s:'El culpable es…',gallery:'← Casos',seat_word:'Silla',solved:'Resuelto',caseword:'Caso',
   names:{conejo:'Conejo',zorro:'Zorro',buho:'Búho',mapache:'Mapache',gato:'Gato'},
   cases:{
    c1:{title:'La tarta robada',story:'¡Alguien se comió la tarta de zanahoria! 🍰 Los tres amigos estaban sentados en fila. Coloca a cada uno con las pistas y pilla al culpable.',
      clues:['El Zorro está justo a la derecha del Conejo.','El Conejo no se sienta en el medio.','El culpable es quien está en la silla 3.']},
    c2:{title:'El tarro de miel',story:'Ha desaparecido el tarro de miel. 🍯 Cuatro sospechosos, cuatro sillas. ¿Quién se lo llevó?',
      clues:['El Búho está en la silla 1.','El Mapache está justo a la izquierda del Conejo.','El Zorro está justo a la derecha del Conejo.','El culpable se sienta justo a la derecha del Búho.']},
    c3:{title:'Los bigotes pintados',story:'Alguien pintó bigotes en el retrato del abuelo. 🖍️ Cuatro en fila. Usa la cabeza y descúbrelo.',
      clues:['El Gato está en un extremo (silla 1 o 4).','El Búho está justo a la izquierda del Zorro.','El Conejo está a la derecha del Gato (en cualquier silla).','El Conejo no se sienta al lado del Búho.','El culpable se sienta en la silla 4.']}
   }},
 en:{title:'🔍 Whodunnit?',sub:'Read the clues, seat the suspects and find the culprit. Pure logic!',
   seats_label:'Seats',clues_label:'Clues',tray_label:'Suspects',check:'🔎 Check',
   fillall:'Seat everyone first 🙂',wrong:'Hmm… something’s off. Re-read the clues 🔍',
   win_t:'Solved!',win_s:'The culprit is…',gallery:'← Cases',seat_word:'Seat',solved:'Solved',caseword:'Case',
   names:{conejo:'Rabbit',zorro:'Fox',buho:'Owl',mapache:'Raccoon',gato:'Cat'},
   cases:{
    c1:{title:'The stolen cake',story:'Someone ate the carrot cake! 🍰 The three friends were sitting in a row. Seat each one with the clues and catch the culprit.',
      clues:['The Fox sits just to the right of the Rabbit.','The Rabbit is not in the middle.','The culprit is the one in seat 3.']},
    c2:{title:'The honey jar',story:'The honey jar has vanished. 🍯 Four suspects, four seats. Who took it?',
      clues:['The Owl is in seat 1.','The Raccoon is just to the left of the Rabbit.','The Fox is just to the right of the Rabbit.','The culprit sits just to the right of the Owl.']},
    c3:{title:'The painted moustache',story:'Someone drew a moustache on grandpa’s portrait. 🖍️ Four in a row. Use your head and find out who.',
      clues:['The Cat is at one end (seat 1 or 4).','The Owl is just to the left of the Fox.','The Rabbit is somewhere to the right of the Cat.','The Rabbit doesn’t sit next to the Owl.','The culprit sits in seat 4.']}
   }},
 fr:{title:'🔍 Qui a fait ça ?',sub:'Lis les indices, place les suspects sur leur siège et trouve le coupable. Pure logique !',
   seats_label:'Sièges',clues_label:'Indices',tray_label:'Suspects',check:'🔎 Vérifier',
   fillall:'Place tout le monde d’abord 🙂',wrong:'Hmm… ça ne colle pas. Relis les indices 🔍',
   win_t:'Résolu !',win_s:'Le coupable est…',gallery:'← Affaires',seat_word:'Siège',solved:'Résolu',caseword:'Affaire',
   names:{conejo:'Lapin',zorro:'Renard',buho:'Hibou',mapache:'Raton',gato:'Chat'},
   cases:{
    c1:{title:'Le gâteau volé',story:'Quelqu’un a mangé le gâteau aux carottes ! 🍰 Les trois amis étaient assis en rang. Place chacun avec les indices et attrape le coupable.',
      clues:['Le Renard est juste à droite du Lapin.','Le Lapin n’est pas au milieu.','Le coupable est celui qui est sur le siège 3.']},
    c2:{title:'Le pot de miel',story:'Le pot de miel a disparu. 🍯 Quatre suspects, quatre sièges. Qui l’a pris ?',
      clues:['Le Hibou est sur le siège 1.','Le Raton est juste à gauche du Lapin.','Le Renard est juste à droite du Lapin.','Le coupable est assis juste à droite du Hibou.']},
    c3:{title:'La moustache dessinée',story:'Quelqu’un a dessiné une moustache sur le portrait du grand-père. 🖍️ Quatre en rang. Réfléchis et trouve qui.',
      clues:['Le Chat est à une extrémité (siège 1 ou 4).','Le Hibou est juste à gauche du Renard.','Le Lapin est quelque part à droite du Chat.','Le Lapin ne s’assoit pas à côté du Hibou.','Le coupable est sur le siège 4.']}
   }}
};
function crisLang(){const l=localStorage.getItem('cris_lang');return I18N[l]?l:'es';}
function t(k){const s=I18N[crisLang()][k];return s!==undefined?s:(I18N.es[k]!==undefined?I18N.es[k]:k);}
function nm(id){const n=I18N[crisLang()].names;return (n&&n[id])||I18N.es.names[id]||id;}
function caseL(id){return (I18N[crisLang()].cases&&I18N[crisLang()].cases[id])||I18N.es.cases[id];}
function applyStaticI18n(){document.documentElement.lang=crisLang();document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.getAttribute('data-i18n'));});}
applyStaticI18n();

/* ── Datos estructurales (verificados: solución única) ── */
const EM={conejo:'🐰',zorro:'🦊',buho:'🦉',mapache:'🦝',gato:'🐱'};
const CASES=[
 {id:'c1',emoji:'🍰',N:3,pool:['conejo','zorro','buho'],sol:['conejo','zorro','buho'],culprit:2},
 {id:'c2',emoji:'🍯',N:4,pool:['buho','mapache','conejo','zorro'],sol:['buho','mapache','conejo','zorro'],culprit:1},
 {id:'c3',emoji:'🖍️',N:4,pool:['gato','buho','zorro','conejo'],sol:['gato','buho','zorro','conejo'],culprit:3}
];

/* ── Estado ── */
let cur=null, placement=[], selSus=null;

function go(v){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(v).classList.add('active');
  window.scrollTo(0,0);
  if(v==='v-pick'){document.getElementById('done-hero').classList.remove('show');renderPicker();}
}

/* ── Persistencia ── */
function getDone(){try{return JSON.parse(localStorage.getItem('cris_detective_done')||'[]');}catch(e){return[];}}
function markDone(id){const d=getDone();if(!d.includes(id)){d.push(id);localStorage.setItem('cris_detective_done',JSON.stringify(d));}
  try{var _n=new Date();localStorage.setItem('cris_juego_v1_'+_n.getFullYear()+'-'+String(_n.getMonth()+1).padStart(2,'0')+'-'+String(_n.getDate()).padStart(2,'0'),'1');}catch(e){}}

/* ── Audio/vibración ── */
let __beepCtx=null;function __getCtx(){try{if(!__beepCtx)__beepCtx=new(window.AudioContext||window.webkitAudioContext)();if(__beepCtx.state==='suspended')__beepCtx.resume();return __beepCtx;}catch(e){return null;}}
function beep(f=600,d=.12){if(!__allow('sound'))return;try{const a=__getCtx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.16,a.currentTime);g.gain.exponentialRampToValueAtTime(.01,a.currentTime+d);o.start();o.stop(a.currentTime+d);}catch(e){}}
function vib(ms){if(!__allow('vib'))return;try{navigator.vibrate(ms);}catch(e){}}

/* ── PICKER ── */
function renderPicker(){
  const done=getDone();
  document.getElementById('pick-grid').innerHTML=CASES.map((c,i)=>{
    const L=caseL(c.id);
    return `<button class="pick-card" onclick="startCase('${c.id}')">
      ${done.includes(c.id)?'<span class="pick-badge">✅</span>':''}
      <span class="pick-num">${i+1}</span>
      <span class="pick-em">${c.emoji}</span>
      <span class="pick-info"><h3>${L.title}</h3><p>${c.pool.map(id=>EM[id]).join(' ')} · ${c.N} ${t('tray_label').toLowerCase()}</p></span>
    </button>`;
  }).join('');
}

/* ── EMPEZAR ── */
function startCase(id){
  cur=CASES.find(c=>c.id===id);
  placement=new Array(cur.N).fill(null);
  selSus=null;
  const L=caseL(cur.id);
  document.getElementById('game-title').textContent=cur.emoji+' '+L.title;
  document.getElementById('story').textContent=L.story;
  document.getElementById('done-hero').classList.remove('show');
  document.getElementById('msg').textContent='';
  renderClues();renderSeats();renderTray();
  go('v-game');
}
function renderClues(){
  const L=caseL(cur.id);
  document.getElementById('clues').innerHTML=L.clues.map((c,i)=>{
    const last=i===L.clues.length-1;
    return `<div class="clue"><span class="ci">${last?'🔍':(i+1)+'.'}</span><span>${c}</span></div>`;
  }).join('');
}
function renderSeats(){
  document.getElementById('seats').innerHTML=cur.sol.map((_,i)=>{
    const s=placement[i];
    return `<button class="seat${s?' filled':''}" onclick="tapSeat(${i})">
      <span class="seat-n">${t('seat_word')} ${i+1}</span>
      <span class="seat-em">${s?EM[s]:''}</span>
    </button>`;
  }).join('');
}
function renderTray(){
  document.getElementById('tray').innerHTML=cur.pool.map(id=>{
    const placed=placement.includes(id);
    return `<button class="sus${placed?' placed':''}${selSus===id?' sel':''}" onclick="selectSus('${id}')">
      <span class="se">${EM[id]}</span>${nm(id)}
    </button>`;
  }).join('');
}
function selectSus(id){
  if(placement.includes(id))return;
  selSus=(selSus===id)?null:id;
  beep(680,.07);
  document.querySelectorAll('.sus').forEach(b=>b.classList.remove('sel'));
  if(selSus){const b=[...document.querySelectorAll('.sus')].find(x=>x.textContent.includes(nm(id)));}
  renderTray();
  document.querySelectorAll('.seat').forEach(s=>s.classList.toggle('sel',!!selSus&&!s.classList.contains('filled')));
}
function tapSeat(i){
  document.getElementById('msg').textContent='';
  if(placement[i]){ // vaciar
    placement[i]=null;beep(400,.08);vib(10);renderSeats();renderTray();
    document.querySelectorAll('.seat').forEach(s=>s.classList.toggle('sel',!!selSus&&!s.classList.contains('filled')));
    return;
  }
  if(!selSus)return;
  placement[i]=selSus;selSus=null;
  const seat=document.getElementById('seats').children[i];
  beep(720,.07);vib(12);
  renderSeats();renderTray();
  const ns=document.getElementById('seats').children[i];if(ns){ns.classList.add('pop');setTimeout(()=>ns.classList.remove('pop'),300);}
}
function checkCase(){
  if(placement.some(p=>!p)){document.getElementById('msg').textContent=t('fillall');beep(400,.1);return;}
  const ok=placement.every((p,i)=>p===cur.sol[i]);
  if(!ok){
    document.getElementById('msg').textContent=t('wrong');
    beep(300,.14);vib([30,40,30]);
    const seats=document.getElementById('seats');[...seats.children].forEach(s=>{s.classList.add('nope');setTimeout(()=>s.classList.remove('nope'),320);});
    return;
  }
  winCase();
}
function winCase(){
  markDone(cur.id);
  document.getElementById('msg').textContent='';
  const seats=document.getElementById('seats');
  const cs=seats.children[cur.culprit];if(cs)cs.classList.add('culprit');
  const culpritId=cur.sol[cur.culprit];
  beep(880,.16);setTimeout(()=>beep(1120,.22),160);vib([60,40,90]);
  sparkle();
  document.getElementById('dh-em').textContent=EM[culpritId];
  document.getElementById('dh-culprit').textContent=t('win_s')+' '+nm(culpritId)+' '+EM[culpritId];
  const idx=CASES.findIndex(c=>c.id===cur.id);
  const next=CASES[(idx+1)%CASES.length];
  const nb=document.getElementById('next-btn');
  nb.textContent=next.emoji+' →';nb.onclick=()=>startCase(next.id);
  setTimeout(()=>document.getElementById('done-hero').classList.add('show'),700);
}
function sparkle(){
  const em=['🔍','✨','🎉','⭐','💚'];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');s.className='spark';s.textContent=em[i%em.length];
    s.style.left=(12+Math.random()*76)+'%';s.style.top=(20+Math.random()*50)+'%';
    s.style.animationDelay=(Math.random()*.5)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),1800);
  }
}

/* ── Boot ── */
renderPicker();
/* Atrás del móvil: el padre llama __crisBack() (síncrono); true = retrocedió */
window.__crisBack=function(){
  if(document.getElementById('done-hero').classList.contains('show')){document.getElementById('done-hero').classList.remove('show');return true;}
  var el=document.querySelector('.screen.active .back-btn');
  if(el){el.click();return true;}
  return false;
};
window.addEventListener('message',function(e){
  if(e&&e.data==='cris:back'&&window.__crisBack&&window.__crisBack()){
    try{parent.postMessage('cris:back-ok','*');}catch(_){}
  }
});
</script>
</body>
</html>
