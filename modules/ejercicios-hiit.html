, chest up, keep breathing.","pos":"Feet 1.5× shoulder width, toes out 30–45°, neutral spine, hands at chest, weight on heels and mid-foot, gaze ahead.","exe":"1. Lower in 3 s into sumo, thighs near parallel · 2. Actively press the knees out · 3. Hold with the core braced for the set time · 4. Rise slowly in 2 s when done.","resp":"Continuous, controlled breathing; never hold your breath.","err":"Holding your breath: breathe rhythmically · Knees drifting in: press them out · Torso tipping as you tire: rise slightly and restore a tall chest.","mus":"Adductors, gluteus maximus, quadriceps, gluteus medius, erector spinae"},"fr":{"d":"Isométrie en squat sumo, cuisses presque parallèles, rotation externe de hanche active, buste vertical et colonne neutre. Garde la tension dans fessiers et adducteurs tout du long.","v":"Immobile en bas, genoux ouverts, poitrine haute, respire.","pos":"Pieds à 1,5 fois la largeur d’épaules, pointes ouvertes de 30–45°, colonne neutre, mains à la poitrine, poids sur talons et milieu du pied, regard devant.","exe":"1. Descends en 3 s en position sumo, cuisses presque parallèles · 2. Pousse activement les genoux vers l’extérieur · 3. Tiens la position, gainage actif, le temps indiqué · 4. Remonte lentement en 2 s à la fin.","resp":"Respiration continue et contrôlée ; ne bloque jamais l’air (évite l’apnée).","err":"Bloquer la respiration : respire en rythme · Genoux qui se referment : pousse-les vers l’extérieur · Buste qui penche avec la fatigue : remonte un peu et redresse la poitrine.","mus":"Adducteurs, grand fessier, quadriceps, moyen fessier, érecteurs du rachis"}},"calfraise":{"es":{"d":"Flexión plantar bilateral desde bipedestación con rodillas extendidas sin bloquear, peso sobre el primer y segundo metatarsiano y tobillos alineados. Bajada controlada sin apoyar del todo el talón.","v":"Sube recta sobre el dedo gordo, baja lenta sin apoyar el talón.","pos":"De pie, pies al ancho de caderas y paralelos, rodillas extendidas sin bloquear, columna neutra, core activo, brazos a los lados y mirada a un punto fijo.","exe":"1. Sube a la punta de los pies en 1 s, peso sobre el dedo gordo · 2. Pausa breve arriba con los tobillos rectos · 3. Baja en 2 s hasta que el talón casi roce el suelo · 4. Repite sin rebotar.","resp":"Exhala al subir; inhala al bajar.","err":"Tobillos que se abren hacia fuera (peso en el meñique): carga el primer metatarsiano · Rebotar: baja controlada · Adelantar la cadera: mantén el cuerpo en línea.","mus":"Gastrocnemio, sóleo, tibial posterior, peroneos"},"en":{"d":"Bilateral standing plantar flexion with knees straight but unlocked, weight over the first and second metatarsals and ankles aligned. Controlled lowering without fully grounding the heel.","v":"Rise straight over the big toe, lower slowly, heels hovering.","pos":"Stand with feet hip-width and parallel, knees straight but unlocked, neutral spine, core engaged, arms by your sides, gaze on a fixed point.","exe":"1. Rise onto the balls of your feet in 1 s, weight over the big toe · 2. Brief pause at the top with straight ankles · 3. Lower in 2 s until the heel almost touches · 4. Repeat without bouncing.","resp":"Exhale as you rise; inhale as you lower.","err":"Ankles rolling out (weight on the little toe): load the first metatarsal · Bouncing: lower with control · Pushing the hips forward: keep the body in one line.","mus":"Gastrocnemius, soleus, tibialis posterior, peroneals"},"fr":{"d":"Flexion plantaire bilatérale debout, genoux tendus sans verrouiller, poids sur le premier et le deuxième métatarsien, chevilles alignées. Descente contrôlée sans reposer complètement le talon.","v":"Monte droite sur le gros orteil, descends lentement sans poser le talon.","pos":"Debout, pieds largeur de hanches et parallèles, genoux tendus sans verrouiller, colonne neutre, gainage actif, bras le long du corps, regard sur un point fixe.","exe":"1. Monte sur la pointe des pieds en 1 s, poids sur le gros orteil · 2. Courte pause en haut, chevilles droites · 3. Descends en 2 s jusqu’à ce que le talon frôle le sol · 4. Répète sans rebondir.","resp":"Expire en montant ; inspire en descendant.","err":"Chevilles qui partent vers l’extérieur : charge le premier métatarsien · Rebondir : descends en contrôle · Avancer les hanches : garde le corps aligné.","mus":"Gastrocnémiens, soléaire, tibial postérieur, fibulaires"}},"calfraise_slow":{"es":{"d":"Elevación de talones con tempo lento para más tiempo bajo tensión: 1 s subida, 2 s isometría en máxima flexión plantar, 3 s bajada excéntrica. Tobillos alineados y cuerpo en línea.","v":"Arriba y aguanta dos, baja en tres, tobillos rectos.","pos":"De pie, pies al ancho de caderas y paralelos, rodillas extendidas sin bloquear, columna neutra, core activo, brazos a los lados y mirada a un punto fijo delante.","exe":"1. Sube en 1 s a máxima altura sobre el dedo gordo · 2. Aguanta 2 s arriba sin balancearte · 3. Baja en 3 s de forma controlada (excéntrica) · 4. Roza el suelo con el talón y repite.","resp":"Exhala al subir, respira suave en la pausa e inhala durante la bajada.","err":"Acortar la pausa o la bajada: cuenta los segundos · Perder altura arriba: sube al máximo rango · Balancearte: activa el core y fija la mirada.","mus":"Gastrocnemio, sóleo, tibial posterior, peroneos, flexores de los dedos"},"en":{"d":"Slow-tempo calf raise for more time under tension: 1 s up, 2 s hold at peak plantar flexion, 3 s eccentric lowering. Ankles aligned and body in one line.","v":"Up and hold two, lower for three, ankles straight.","pos":"Stand with feet hip-width and parallel, knees straight but unlocked, neutral spine, core engaged, arms by your sides, gaze on a fixed point ahead.","exe":"1. Rise in 1 s to full height over the big toe · 2. Hold 2 s at the top without swaying · 3. Lower in 3 s under control (eccentric) · 4. Brush the floor with the heel and repeat.","resp":"Exhale as you rise, breathe softly in the hold, inhale on the way down.","err":"Cutting the hold or lowering short: count the seconds · Losing height at the top: rise to full range · Swaying: brace the core and fix your gaze.","mus":"Gastrocnemius, soleus, tibialis posterior, peroneals, toe flexors"},"fr":{"d":"Montée sur pointes à tempo lent pour plus de temps sous tension : 1 s montée, 2 s de maintien en flexion plantaire maximale, 3 s de descente excentrique. Chevilles alignées, corps droit.","v":"En haut tiens deux, descends en trois, chevilles droites.","pos":"Debout, pieds largeur de hanches et parallèles, genoux tendus sans verrouiller, colonne neutre, gainage actif, bras le long du corps, regard sur un point fixe devant.","exe":"1. Monte en 1 s au plus haut, sur le gros orteil · 2. Tiens 2 s en haut sans osciller · 3. Descends en 3 s en contrôle (excentrique) · 4. Effleure le sol avec le talon et recommence.","resp":"Expire en montant, respire doucement pendant le maintien, inspire en descendant.","err":"Raccourcir la pause ou la descente : compte les secondes · Perdre de la hauteur en haut : monte au maximum · Osciller : gaine et fixe le regard.","mus":"Gastrocnémiens, soléaire, tibial postérieur, fibulaires, fléchisseurs des orteils"}},"squathold":{"es":{"d":"Isometría en sentadilla con cadera atrás, columna neutra, talones apoyados y rodillas alineadas con el segundo dedo. Nivel fácil a ≈60° de rodilla; progresa hacia muslos paralelos (90°).","v":"Cadera atrás, talones firmes, rodillas fuera, respira.","pos":"De pie, pies al ancho de caderas, puntas 10–15° hacia fuera, columna neutra, brazos al frente a la altura del pecho, peso en talones y centro del pie, mirada al frente.","exe":"1. Lleva la cadera atrás y baja en 3 s · 2. Detente a media altura (fácil) o con muslos casi paralelos (más difícil) · 3. Mantén la posición con el core activo y el peso en los talones · 4. Sube en 2 s al terminar.","resp":"Respiración continua y controlada; evita la apnea durante la isometría.","err":"Peso en las puntas: siéntate más atrás y carga los talones · Rodillas hacia dentro: empújalas en línea con el segundo dedo · Espalda redondeada o arqueada: pecho alto y columna neutra.","mus":"Cuádriceps, glúteo mayor, aductores, isquiotibiales, transverso del abdomen"},"en":{"d":"Isometric squat hold with hips back, neutral spine, heels grounded and knees tracking over the second toe. Easy level at ≈60° knee flexion; progress toward parallel thighs (90°).","v":"Hips back, heels heavy, knees out, keep breathing.","pos":"Stand with feet hip-width, toes out 10–15°, neutral spine, arms forward at chest height, weight on heels and mid-foot, gaze ahead.","exe":"1. Send the hips back and lower in 3 s · 2. Stop at half depth (easy) or thighs near parallel (harder) · 3. Hold with the core braced and weight in the heels · 4. Rise in 2 s when done.","resp":"Continuous, controlled breathing; avoid holding your breath during the hold.","err":"Weight on the toes: sit further back and load the heels · Knees caving: push them in line with the second toe · Rounded or arched back: chest up, neutral spine.","mus":"Quadriceps, gluteus maximus, adductors, hamstrings, transversus abdominis"},"fr":{"d":"Isométrie en squat, hanches en arrière, colonne neutre, talons au sol, genoux alignés sur le deuxième orteil. Niveau facile à ≈60° au genou ; progresse vers les cuisses parallèles (90°).","v":"Hanches en arrière, talons lourds, genoux ouverts, respire.","pos":"Debout, pieds largeur de hanches, pointes ouvertes de 10–15°, colonne neutre, bras devant à hauteur de poitrine, poids sur talons et milieu du pied, regard devant.","exe":"1. Envoie les hanches en arrière et descends en 3 s · 2. Arrête-toi à mi-hauteur (facile) ou cuisses presque parallèles (plus dur) · 3. Tiens, gainage actif et poids dans les talons · 4. Remonte en 2 s à la fin.","resp":"Respiration continue et contrôlée ; évite l’apnée pendant l’isométrie.","err":"Poids sur les pointes : assieds-toi plus en arrière, charge les talons · Genoux qui rentrent : aligne-les sur le deuxième orteil · Dos arrondi ou cambré : poitrine haute, colonne neutre.","mus":"Quadriceps, grand fessier, adducteurs, ischio-jambiers, transverse de l’abdomen"}},"bridge":{"es":{"d":"Extensión de cadera en decúbito supino con ligera retroversión pélvica, hasta alinear rodillas, cadera y hombros. Empuje desde los talones, sin hiperextensión lumbar. Tempo 1 s subida / 1 s pausa / 2 s bajada.","v":"Retroversión, empuja con los talones, aprieta glúteos, costillas abajo.","pos":"Tumbada boca arriba, rodillas flexionadas a ≈90°, pies al ancho de caderas a un palmo de los glúteos, brazos junto al cuerpo con palmas abajo, columna neutra y mirada al techo.","exe":"1. Activa el core y haz una ligera retroversión pélvica · 2. Empuja con los talones y sube la cadera en 1 s hasta la línea rodillas-cadera-hombros · 3. Aprieta glúteos 1 s arriba · 4. Baja en 2 s vértebra a vértebra.","resp":"Exhala al subir la cadera; inhala al bajar.","err":"Arquear la zona lumbar arriba: mantén las costillas abajo y la retroversión · Empujar con las puntas: carga los talones · Rodillas que se abren o cierran: mantenlas al ancho de caderas.","mus":"Glúteo mayor, isquiotibiales, glúteo medio, transverso del abdomen, erectores espinales"},"en":{"d":"Supine hip extension with a slight posterior pelvic tilt until knees, hips and shoulders align. Drive through the heels without lumbar hyperextension. Tempo 1 s up / 1 s hold / 2 s down.","v":"Tuck the pelvis, drive through heels, squeeze glutes, ribs down.","pos":"Lie on your back, knees bent ≈90°, feet hip-width about a hand’s length from your glutes, arms by your sides palms down, neutral spine, gaze at the ceiling.","exe":"1. Brace the core and add a slight posterior pelvic tilt · 2. Drive through the heels and lift the hips in 1 s to a knees-hips-shoulders line · 3. Squeeze the glutes for 1 s at the top · 4. Lower in 2 s, one vertebra at a time.","resp":"Exhale as you lift the hips; inhale as you lower.","err":"Arching the lower back at the top: keep ribs down and the pelvic tilt · Pushing through the toes: load the heels · Knees splaying or caving: keep them hip-width.","mus":"Gluteus maximus, hamstrings, gluteus medius, transversus abdominis, erector spinae"},"fr":{"d":"Extension de hanche allongée sur le dos avec légère rétroversion, jusqu’à aligner genoux, hanches et épaules. Pousse dans les talons sans cambrer. Tempo 1 s montée / 1 s pause / 2 s descente.","v":"Rétroversion, pousse dans les talons, serre les fessiers, côtes basses.","pos":"Allongée sur le dos, genoux fléchis à ≈90°, pieds largeur de hanches à une main des fessiers, bras le long du corps paumes au sol, colonne neutre, regard au plafond.","exe":"1. Gaine et fais une légère rétroversion du bassin · 2. Pousse dans les talons et monte les hanches en 1 s jusqu’à l’alignement genoux-hanches-épaules · 3. Serre les fessiers 1 s en haut · 4. Redescends en 2 s, vertèbre par vertèbre.","resp":"Expire en montant les hanches ; inspire en descendant.","err":"Cambrer en haut : garde les côtes basses et la rétroversion · Pousser sur les pointes : charge les talons · Genoux qui s’ouvrent ou se ferment : garde-les largeur de hanches.","mus":"Grand fessier, ischio-jambiers, moyen fessier, transverse de l’abdomen, érecteurs du rachis"}},"bridgehold":{"es":{"d":"Isometría de puente de glúteo: cadera extendida en línea rodillas-cadera-hombros, retroversión pélvica ligera y costillas abajo. Mantén la contracción de glúteos sin cargar la zona lumbar.","v":"Cadera arriba, glúteos apretados, costillas abajo, respira.","pos":"Tumbada boca arriba, rodillas a ≈90°, pies al ancho de caderas a un palmo de los glúteos, brazos junto al cuerpo con palmas abajo, columna neutra y mirada al techo.","exe":"1. Retroversión ligera y sube la cadera en 2 s empujando con los talones · 2. Fija la línea rodillas-cadera-hombros · 3. Mantén con glúteos apretados y core activo el tiempo marcado · 4. Baja en 2–3 s vértebra a vértebra.","resp":"Respira de forma continua con exhalaciones largas; no bloquees el aire.","err":"Molestia lumbar: baja un poco la cadera y refuerza la retroversión · Cadera que cae con la fatiga: vuelve a apretar glúteos · Sentir sobre todo isquiotibiales: acerca los pies a los glúteos.","mus":"Glúteo mayor, isquiotibiales, glúteo medio, transverso del abdomen, aductores"},"en":{"d":"Isometric glute bridge: hips extended in a knees-hips-shoulders line, slight posterior pelvic tilt and ribs down. Hold the glute squeeze without loading the lower back.","v":"Hips up, glutes tight, ribs down, keep breathing.","pos":"Lie on your back, knees at ≈90°, feet hip-width about a hand’s length from your glutes, arms by your sides palms down, neutral spine, gaze at the ceiling.","exe":"1. Slight posterior tilt and lift the hips in 2 s driving through the heels · 2. Lock in the knees-hips-shoulders line · 3. Hold with glutes squeezed and core braced for the set time · 4. Lower in 2–3 s one vertebra at a time.","resp":"Breathe continuously with long exhales; don’t hold your breath.","err":"Lower-back discomfort: drop the hips slightly and increase the tilt · Hips sagging as you tire: re-squeeze the glutes · Feeling mostly hamstrings: bring the feet closer to your glutes.","mus":"Gluteus maximus, hamstrings, gluteus medius, transversus abdominis, adductors"},"fr":{"d":"Pont fessier isométrique : hanches tendues dans l’alignement genoux-hanches-épaules, légère rétroversion et côtes basses. Tiens la contraction des fessiers sans charger le bas du dos.","v":"Hanches hautes, fessiers serrés, côtes basses, respire.","pos":"Allongée sur le dos, genoux à ≈90°, pieds largeur de hanches à une main des fessiers, bras le long du corps paumes au sol, colonne neutre, regard au plafond.","exe":"1. Légère rétroversion et monte les hanches en 2 s en poussant dans les talons · 2. Fixe l’alignement genoux-hanches-épaules · 3. Tiens, fessiers serrés et gainage actif, le temps indiqué · 4. Redescends en 2–3 s vertèbre par vertèbre.","resp":"Respire en continu avec des expirations longues ; ne bloque pas l’air.","err":"Gêne lombaire : baisse un peu les hanches et accentue la rétroversion · Hanches qui tombent : resserre les fessiers · Tu sens surtout les ischios : rapproche les pieds des fessiers.","mus":"Grand fessier, ischio-jambiers, moyen fessier, transverse de l’abdomen, adducteurs"}},"bridge1leg":{"es":{"d":"Puente de glúteo unilateral con la pierna libre extendida en prolongación del muslo. Pelvis nivelada sin rotar ni caer, empuje desde el talón de apoyo. Tempo 1 s / 1 s pausa / 2 s. Cambia a mitad.","v":"Pelvis nivelada, empuja con el talón, glúteo de apoyo apretado.","pos":"Tumbada boca arriba, pie de apoyo centrado y rodilla a ≈90°, la otra pierna extendida con los muslos paralelos, brazos junto al cuerpo con palmas abajo presionando el suelo, columna neutra.","exe":"1. Activa el core y haz ligera retroversión · 2. Empuja con el talón y sube la cadera en 1 s manteniendo ambas crestas ilíacas a la misma altura · 3. Pausa 1 s arriba · 4. Baja en 2 s. A mitad de tiempo, cambia de pierna.","resp":"Exhala al subir; inhala al bajar.","err":"Pelvis que cae hacia el lado libre: activa el glúteo medio de apoyo · Arquear la lumbar: costillas abajo y retroversión · Rango excesivo con compensación: sube solo lo que controles nivelado.","mus":"Glúteo mayor, glúteo medio, isquiotibiales, transverso del abdomen, oblicuos"},"en":{"d":"Single-leg glute bridge with the free leg extended in line with its thigh. Keep the pelvis level without rotating or dropping; drive through the working heel. Tempo 1 s / 1 s hold / 2 s. Switch halfway.","v":"Level pelvis, drive through the heel, squeeze the working glute.","pos":"Lie on your back, working foot centred and knee at ≈90°, other leg extended with thighs parallel, arms by your sides pressing palms into the floor, neutral spine.","exe":"1. Brace the core with a slight posterior tilt · 2. Drive through the heel and lift the hips in 1 s, both hip bones at the same height · 3. Hold 1 s at the top · 4. Lower in 2 s. Switch legs halfway through.","resp":"Exhale as you lift; inhale as you lower.","err":"Pelvis dropping to the free side: fire the working gluteus medius · Arching the lower back: ribs down, pelvis tucked · Too much range with compensation: lift only as high as you stay level.","mus":"Gluteus maximus, gluteus medius, hamstrings, transversus abdominis, obliques"},"fr":{"d":"Pont fessier unilatéral, jambe libre tendue dans le prolongement de la cuisse. Bassin de niveau sans rotation ni chute, poussée dans le talon d’appui. Tempo 1 s / 1 s pause / 2 s. Change à mi-temps.","v":"Bassin de niveau, pousse dans le talon, fessier d’appui serré.","pos":"Allongée sur le dos, pied d’appui centré et genou à ≈90°, l’autre jambe tendue, cuisses parallèles, bras le long du corps paumes pressées au sol, colonne neutre.","exe":"1. Gaine avec une légère rétroversion · 2. Pousse dans le talon et monte les hanches en 1 s, les deux crêtes iliaques à la même hauteur · 3. Pause 1 s en haut · 4. Redescends en 2 s. Change de jambe à mi-temps.","resp":"Expire en montant ; inspire en descendant.","err":"Bassin qui chute côté libre : active le moyen fessier d’appui · Cambrer : côtes basses et rétroversion · Trop d’amplitude avec compensation : monte seulement tant que tu restes de niveau.","mus":"Grand fessier, moyen fessier, ischio-jambiers, transverse de l’abdomen, obliques"}},"bridgemarch":{"es":{"d":"Puente de glúteo mantenido con flexión alterna de cadera a 90° (marcha). Exige estabilidad anti-rotación: pelvis nivelada y cadera alta en cada cambio. Unos 2 s por pierna, sin prisa.","v":"Cadera alta y quieta, sube una rodilla, pelvis nivelada.","pos":"Tumbada boca arriba, rodillas a ≈90°, pies al ancho de caderas a un palmo de los glúteos, brazos junto al cuerpo presionando el suelo. Sube al puente con retroversión ligera.","exe":"1. Sube al puente en línea rodillas-cadera-hombros · 2. Transfiere el peso a un talón y lleva la otra rodilla hacia el pecho a 90° en 2 s · 3. Apoya el pie sin que baje la cadera · 4. Alterna piernas; al terminar, baja en 2 s.","resp":"Exhala al elevar cada rodilla; inhala al apoyar el pie.","err":"Cadera que cae al levantar el pie: aprieta el glúteo de apoyo o vuelve al puente normal · Pelvis que rota: mueve más lento · Arquear la lumbar: costillas abajo y core activo.","mus":"Glúteo mayor, glúteo medio, isquiotibiales, psoas ilíaco, transverso del abdomen, oblicuos"},"en":{"d":"Held glute bridge with alternating hip flexion to 90° (march). Demands anti-rotation stability: level pelvis and high hips at every switch. About 2 s per leg, unhurried.","v":"Hips high and still, lift one knee, pelvis level.","pos":"Lie on your back, knees at ≈90°, feet hip-width about a hand’s length from your glutes, arms by your sides pressing the floor. Lift into a bridge with a slight posterior tilt.","exe":"1. Lift into a bridge in a knees-hips-shoulders line · 2. Shift weight to one heel and bring the other knee toward your chest to 90° in 2 s · 3. Set the foot down without the hips dropping · 4. Alternate legs; lower in 2 s at the end.","resp":"Exhale as each knee lifts; inhale as the foot returns.","err":"Hips dropping as the foot lifts: squeeze the working glute or switch to a regular bridge · Pelvis rotating: slow down · Arching the lower back: ribs down, core braced.","mus":"Gluteus maximus, gluteus medius, hamstrings, iliopsoas, transversus abdominis, obliques"},"fr":{"d":"Pont fessier maintenu avec flexion alternée de hanche à 90° (marche). Exige une stabilité anti-rotation : bassin de niveau et hanches hautes à chaque changement. Environ 2 s par jambe.","v":"Hanches hautes et stables, monte un genou, bassin de niveau.","pos":"Allongée sur le dos, genoux à ≈90°, pieds largeur de hanches à une main des fessiers, bras le long du corps pressés au sol. Monte en pont avec une légère rétroversion.","exe":"1. Monte en pont, alignement genoux-hanches-épaules · 2. Transfère le poids sur un talon et amène l’autre genou vers la poitrine à 90° en 2 s · 3. Repose le pied sans que les hanches baissent · 4. Alterne ; à la fin, redescends en 2 s.","resp":"Expire en montant chaque genou ; inspire en reposant le pied.","err":"Hanches qui tombent en levant le pied : serre le fessier d’appui ou reviens au pont simple · Bassin qui tourne : ralentis · Cambrer : côtes basses, gainage actif.","mus":"Grand fessier, moyen fessier, ischio-jambiers, ilio-psoas, transverse de l’abdomen, obliques"}},"pushup_knee":{"es":{"d":"Flexión apoyando rodillas con columna neutra y línea recta rodillas-cadera-cabeza. Codos a ~45° del tronco, core (transverso) y glúteos activos. Tempo 2 s bajada / 1 s subida.","v":"Codos a 45°, pecho al suelo y empuja. Glúteos y abdomen firmes.","pos":"Rodillas en la esterilla a la anchura de la cadera, manos bajo los hombros con dedos al frente. Cadera extendida, cuerpo recto de rodillas a cabeza, mirada al suelo algo adelantada.","exe":"1. Activa transverso y glúteos, escápulas estables · 2. Baja en 2 s con codos a ~45° hasta que el pecho quede a un puño del suelo · 3. Empuja el suelo en 1 s hasta estirar los codos sin bloquearlos","resp":"Inhala al bajar, exhala al empujar hacia arriba.","err":"Cadera flexionada (glúteos arriba): aprieta glúteos y extiende la cadera · Codos abiertos a 90°: llévalos a ~45° · Cabeza adelantada: cuello alineado, mirada al suelo","mus":"Pectoral mayor, deltoides anterior, tríceps braquial, serrato anterior, transverso del abdomen"},"en":{"d":"Kneeling push-up with a neutral spine and a straight knee-hip-head line. Elbows at ~45° from the torso, core (transversus) and glutes engaged. Tempo 2 s down / 1 s up.","v":"Elbows at 45°, chest to the floor, push. Glutes and abs tight.","pos":"Knees on the mat hip-width apart, hands under your shoulders, fingers forward. Hips extended, body straight from knees to head, gaze on the floor slightly ahead.","exe":"1. Brace your transversus and glutes, shoulder blades stable · 2. Lower for 2 s, elbows at ~45°, until your chest is a fist from the floor · 3. Push the floor away for 1 s until your elbows are straight but not locked","resp":"Inhale on the way down, exhale as you push up.","err":"Hips bent (bottom up): squeeze glutes and extend hips · Elbows flared to 90°: bring them to ~45° · Head jutting forward: keep your neck in line, gaze down","mus":"Pectoralis major, anterior deltoid, triceps brachii, serratus anterior, transversus abdominis"},"fr":{"d":"Pompe sur les genoux, colonne neutre et ligne droite genoux-hanches-tête. Coudes à ~45° du tronc, gainage (transverse) et fessiers actifs. Tempo 2 s descente / 1 s montée.","v":"Coudes à 45°, poitrine vers le sol, pousse. Fessiers et abdos serrés.","pos":"Genoux sur le tapis écartés de la largeur du bassin, mains sous les épaules, doigts vers l’avant. Hanches en extension, corps droit des genoux à la tête, regard au sol un peu devant.","exe":"1. Active transverse et fessiers, omoplates stables · 2. Descends en 2 s, coudes à ~45°, jusqu’à un poing du sol · 3. Repousse le sol en 1 s jusqu’à tendre les coudes sans les verrouiller","resp":"Inspire en descendant, expire en poussant vers le haut.","err":"Hanches fléchies (fesses en l’air) : serre les fessiers et tends les hanches · Coudes ouverts à 90° : ramène-les à ~45° · Tête en avant : nuque alignée, regard au sol","mus":"Grand pectoral, deltoïde antérieur, triceps brachial, dentelé antérieur, transverse de l’abdomen"}},"pushup":{"es":{"d":"Flexión completa en plancha alta con columna neutra, core y glúteos activos. Codos a ~45°, rango completo hasta que el pecho casi toca el suelo. Tempo 2 s bajada / 1 s subida.","v":"Cuerpo en bloque, codos a 45°, baja y empuja.","pos":"Plancha alta: manos bajo los hombros, dedos al frente, pies a la anchura de la cadera. Cuerpo recto de talones a cabeza, pelvis neutra, mirada al suelo ligeramente adelantada.","exe":"1. Aprieta glúteos y abdomen, rodillas estiradas · 2. Baja en 2 s con codos a ~45° hasta que el pecho quede a un puño del suelo · 3. Empuja en 1 s hasta estirar los brazos, con leve protracción escapular arriba","resp":"Inhala al bajar, exhala al empujar.","err":"Cadera hundida: activa transverso y glúteos, o apoya rodillas · Rango corto: baja hasta un puño del suelo · Codos abiertos: llévalos a ~45° del tronco","mus":"Pectoral mayor, deltoides anterior, tríceps braquial, serrato anterior, recto y transverso del abdomen"},"en":{"d":"Full push-up from a high plank with a neutral spine, core and glutes engaged. Elbows at ~45°, full range until your chest nearly touches the floor. Tempo 2 s down / 1 s up.","v":"Body in one piece, elbows at 45°, lower and push.","pos":"High plank: hands under your shoulders, fingers forward, feet hip-width apart. Body straight from heels to head, neutral pelvis, gaze on the floor slightly ahead.","exe":"1. Squeeze glutes and abs, knees straight · 2. Lower for 2 s, elbows at ~45°, until your chest is a fist from the floor · 3. Push for 1 s until your arms are straight, with slight scapular protraction at the top","resp":"Inhale on the way down, exhale as you push.","err":"Sagging hips: brace transversus and glutes, or drop to your knees · Short range: lower to a fist from the floor · Flared elbows: bring them to ~45° from the torso","mus":"Pectoralis major, anterior deltoid, triceps brachii, serratus anterior, rectus and transversus abdominis"},"fr":{"d":"Pompe complète en planche haute, colonne neutre, gainage et fessiers actifs. Coudes à ~45°, amplitude complète jusqu’à frôler le sol avec la poitrine. Tempo 2 s descente / 1 s montée.","v":"Corps gainé d’un bloc, coudes à 45°, descends et pousse.","pos":"Planche haute : mains sous les épaules, doigts vers l’avant, pieds écartés de la largeur du bassin. Corps droit des talons à la tête, bassin neutre, regard au sol un peu devant.","exe":"1. Serre fessiers et abdos, genoux tendus · 2. Descends en 2 s, coudes à ~45°, jusqu’à un poing du sol · 3. Pousse en 1 s jusqu’à tendre les bras, avec une légère protraction des omoplates en haut","resp":"Inspire en descendant, expire en poussant.","err":"Hanches qui s’affaissent : active transverse et fessiers, ou pose les genoux · Amplitude courte : descends à un poing du sol · Coudes ouverts : ramène-les à ~45° du tronc","mus":"Grand pectoral, deltoïde antérieur, triceps brachial, dentelé antérieur, grand droit et transverse de l’abdomen"}},"pushup_slow":{"es":{"d":"Flexión con tempo 3 s bajada / 3 s subida para aumentar el tiempo bajo tensión. Columna neutra, codos a ~45°, core y glúteos activos durante todo el rango.","v":"Tres segundos abajo, tres arriba. Cuerpo en bloque.","pos":"Plancha alta: manos bajo los hombros, pies a la anchura de la cadera, cuerpo recto de talones a cabeza, mirada al suelo. Si no mantienes la línea, apoya las rodillas.","exe":"1. Activa glúteos y transverso · 2. Baja contando 3 s, codos a ~45°, hasta un puño del suelo · 3. Sube contando 3 s a velocidad constante · 4. Estira los codos sin bloquear y repite","resp":"Inhala durante la bajada, exhala de forma continua al subir; no bloquees la respiración.","err":"Acelerar al final de la bajada: cuenta en voz baja · Subir primero el pecho y dejar la cadera: sube en bloque apretando glúteos · Apnea: exhala al empujar","mus":"Pectoral mayor, deltoides anterior, tríceps braquial, serrato anterior, transverso del abdomen"},"en":{"d":"Push-up with a 3 s down / 3 s up tempo to increase time under tension. Neutral spine, elbows at ~45°, core and glutes engaged through the whole range.","v":"Three seconds down, three up. Body in one piece.","pos":"High plank: hands under your shoulders, feet hip-width apart, body straight from heels to head, gaze down. If you can’t hold the line, drop to your knees.","exe":"1. Brace glutes and transversus · 2. Lower for a count of 3, elbows at ~45°, to a fist from the floor · 3. Rise for a count of 3 at a steady speed · 4. Straighten your elbows without locking and repeat","resp":"Inhale throughout the lowering, exhale steadily as you rise; don’t hold your breath.","err":"Speeding up at the bottom: count quietly · Chest rising before the hips: move in one piece, squeezing glutes · Breath-holding: exhale as you push","mus":"Pectoralis major, anterior deltoid, triceps brachii, serratus anterior, transversus abdominis"},"fr":{"d":"Pompe au tempo 3 s descente / 3 s montée pour augmenter le temps sous tension. Colonne neutre, coudes à ~45°, gainage et fessiers actifs sur toute l’amplitude.","v":"Trois secondes en bas, trois en haut. Corps d’un bloc.","pos":"Planche haute : mains sous les épaules, pieds largeur de bassin, corps droit des talons à la tête, regard au sol. Si tu perds l’alignement, pose les genoux.","exe":"1. Active fessiers et transverse · 2. Descends en comptant 3 s, coudes à ~45°, jusqu’à un poing du sol · 3. Remonte en comptant 3 s à vitesse constante · 4. Tends les coudes sans verrouiller et recommence","resp":"Inspire pendant la descente, expire en continu en montant ; ne bloque pas ta respiration.","err":"Accélérer en fin de descente : compte à voix basse · Poitrine qui monte avant les hanches : remonte d’un bloc en serrant les fessiers · Apnée : expire en poussant","mus":"Grand pectoral, deltoïde antérieur, triceps brachial, dentelé antérieur, transverse de l’abdomen"}},"shouldertap_knee":{"es":{"d":"Antirrotación en plancha sobre rodillas: toca el hombro contrario sin rotar pelvis ni tronco. Columna neutra, transverso y glúteos activos, empujando el suelo con la mano de apoyo.","v":"Empuja el suelo, toca el hombro. Pelvis quieta.","pos":"Plancha alta sobre rodillas: manos bajo los hombros, rodillas algo más separadas que la cadera, cadera extendida, cuerpo recto de rodillas a cabeza, mirada al suelo.","exe":"1. Activa core y glúteos, empuja el suelo con ambas manos · 2. Lleva una mano al hombro contrario en 1 s · 3. Devuélvela en 1 s bajo el hombro · 4. Alterna lados sin girar la pelvis","resp":"Respiración continua: exhala en cada toque, inhala al devolver la mano.","err":"Balancear la cadera: separa más las rodillas y ve más lenta · Hundir el pecho sobre el brazo de apoyo: empuja el suelo (protracción) · Cadera flexionada: alinea rodillas, cadera y hombros","mus":"Transverso del abdomen, oblicuos, deltoides, serrato anterior, pectoral mayor, glúteo medio"},"en":{"d":"Anti-rotation drill in a kneeling plank: tap the opposite shoulder without rotating pelvis or torso. Neutral spine, transversus and glutes on, pushing the floor with the support hand.","v":"Push the floor, tap the shoulder. Pelvis still.","pos":"Kneeling high plank: hands under your shoulders, knees slightly wider than your hips, hips extended, body straight from knees to head, gaze down.","exe":"1. Brace core and glutes, push the floor with both hands · 2. Bring one hand to the opposite shoulder in 1 s · 3. Return it under the shoulder in 1 s · 4. Alternate sides without twisting your pelvis","resp":"Breathe continuously: exhale on each tap, inhale as the hand returns.","err":"Hips swaying: widen your knees and slow down · Chest sinking over the support arm: push the floor (protraction) · Hips bent: line up knees, hips and shoulders","mus":"Transversus abdominis, obliques, deltoids, serratus anterior, pectoralis major, gluteus medius"},"fr":{"d":"Anti-rotation en planche sur les genoux : touche l’épaule opposée sans tourner bassin ni tronc. Colonne neutre, transverse et fessiers actifs, main d’appui qui repousse le sol.","v":"Repousse le sol, touche l’épaule. Bassin immobile.","pos":"Planche haute sur les genoux : mains sous les épaules, genoux un peu plus écartés que le bassin, hanches tendues, corps droit des genoux à la tête, regard au sol.","exe":"1. Active gainage et fessiers, repousse le sol des deux mains · 2. Amène une main à l’épaule opposée en 1 s · 3. Replace-la sous l’épaule en 1 s · 4. Alterne sans tourner le bassin","resp":"Respiration continue : expire à chaque touche, inspire en reposant la main.","err":"Bassin qui balance : écarte plus les genoux et ralentis · Poitrine qui s’affaisse sur le bras d’appui : repousse le sol (protraction) · Hanches fléchies : aligne genoux, hanches et épaules","mus":"Transverse de l’abdomen, obliques, deltoïdes, dentelé antérieur, grand pectoral, moyen fessier"}},"shouldertap":{"es":{"d":"Antirrotación en plancha alta: toca el hombro contrario manteniendo pelvis y hombros paralelos al suelo. Columna neutra, core y glúteos activos, pies separados para ganar estabilidad.","v":"Toca el hombro y alterna. Cadera quieta, glúteos firmes.","pos":"Plancha alta: manos bajo los hombros, pies algo más separados que la cadera, piernas estiradas, cuerpo recto de talones a cabeza, mirada al suelo.","exe":"1. Aprieta glúteos y transverso, empuja el suelo · 2. Toca el hombro contrario en 1 s · 3. Devuelve la mano en 1 s bajo el hombro · 4. Alterna lados sin que la cadera se desplace","resp":"Respiración continua: exhala en cada toque, inhala al apoyar la mano.","err":"Balanceo lateral de cadera: separa más los pies y ralentiza · Cadera alta o hundida: mantén la línea talones-cabeza · Hombro de apoyo hundido: empuja el suelo","mus":"Transverso del abdomen, oblicuos, recto abdominal, deltoides, serrato anterior, glúteo medio"},"en":{"d":"Anti-rotation in a high plank: tap the opposite shoulder, keeping pelvis and shoulders parallel to the floor. Neutral spine, core and glutes on, feet apart for stability.","v":"Tap the shoulder and switch. Hips still, glutes tight.","pos":"High plank: hands under your shoulders, feet slightly wider than your hips, legs straight, body straight from heels to head, gaze down.","exe":"1. Squeeze glutes and transversus, push the floor · 2. Tap the opposite shoulder in 1 s · 3. Return the hand under the shoulder in 1 s · 4. Alternate sides without shifting your hips","resp":"Breathe continuously: exhale on each tap, inhale as you place the hand.","err":"Hips swaying side to side: widen your feet and slow down · Hips too high or sagging: keep the heel-to-head line · Support shoulder sinking: push the floor","mus":"Transversus abdominis, obliques, rectus abdominis, deltoids, serratus anterior, gluteus medius"},"fr":{"d":"Anti-rotation en planche haute : touche l’épaule opposée en gardant bassin et épaules parallèles au sol. Colonne neutre, gainage et fessiers actifs, pieds écartés pour la stabilité.","v":"Touche l’épaule et alterne. Bassin immobile, fessiers serrés.","pos":"Planche haute : mains sous les épaules, pieds un peu plus écartés que le bassin, jambes tendues, corps droit des talons à la tête, regard au sol.","exe":"1. Serre fessiers et transverse, repousse le sol · 2. Touche l’épaule opposée en 1 s · 3. Replace la main sous l’épaule en 1 s · 4. Alterne sans déplacer le bassin","resp":"Respiration continue : expire à chaque touche, inspire en reposant la main.","err":"Bassin qui balance : écarte plus les pieds et ralentis · Hanches trop hautes ou affaissées : garde la ligne talons-tête · Épaule d’appui qui s’affaisse : repousse le sol","mus":"Transverse de l’abdomen, obliques, grand droit, deltoïdes, dentelé antérieur, moyen fessier"}},"shouldertap_hard":{"es":{"d":"Toques de hombro en plancha alta con pies juntos: base de apoyo mínima y máxima exigencia antirrotacional. Tempo lento, 2 s por toque, pelvis inmóvil y columna neutra.","v":"Pies juntos, toques de dos segundos. Nada se mueve.","pos":"Plancha alta: manos bajo los hombros, pies juntos, piernas estiradas y glúteos apretados. Cuerpo recto de talones a cabeza, mirada al suelo.","exe":"1. Aprieta glúteos, cuádriceps y transverso · 2. Lleva la mano al hombro contrario en 2 s · 3. Devuélvela en 2 s bajo el hombro · 4. Alterna sin rotar pelvis ni hombros","resp":"Exhala lento durante cada toque, inhala al apoyar la mano. Sin apnea.","err":"Cadera que rota hacia el lado libre: aprieta el glúteo contrario y ralentiza · Toques rápidos para compensar: cuenta 2 s · Si pierdes la línea: separa un poco los pies","mus":"Transverso del abdomen, oblicuos, recto abdominal, deltoides, serrato anterior, glúteos medio y mayor"},"en":{"d":"Shoulder taps in a high plank with feet together: minimal base of support, maximal anti-rotation demand. Slow tempo, 2 s per tap, still pelvis and neutral spine.","v":"Feet together, two-second taps. Nothing moves.","pos":"High plank: hands under your shoulders, feet together, legs straight and glutes squeezed. Body straight from heels to head, gaze down.","exe":"1. Squeeze glutes, quads and transversus · 2. Bring the hand to the opposite shoulder in 2 s · 3. Return it under the shoulder in 2 s · 4. Alternate without rotating pelvis or shoulders","resp":"Exhale slowly during each tap, inhale as you place the hand. No breath-holding.","err":"Hips rotating toward the free side: squeeze the opposite glute and slow down · Rushing taps to compensate: count 2 s · Losing the line: widen your feet slightly","mus":"Transversus abdominis, obliques, rectus abdominis, deltoids, serratus anterior, gluteus medius and maximus"},"fr":{"d":"Touches d’épaule en planche haute pieds joints : base d’appui minimale, exigence anti-rotation maximale. Tempo lent, 2 s par touche, bassin immobile et colonne neutre.","v":"Pieds joints, touches de deux secondes. Rien ne bouge.","pos":"Planche haute : mains sous les épaules, pieds joints, jambes tendues et fessiers serrés. Corps droit des talons à la tête, regard au sol.","exe":"1. Serre fessiers, quadriceps et transverse · 2. Amène la main à l’épaule opposée en 2 s · 3. Replace-la sous l’épaule en 2 s · 4. Alterne sans tourner bassin ni épaules","resp":"Expire lentement pendant chaque touche, inspire en reposant la main. Pas d’apnée.","err":"Bassin qui tourne vers le côté libre : serre le fessier opposé et ralentis · Touches rapides pour compenser : compte 2 s · Si tu perds l’alignement : écarte un peu les pieds","mus":"Transverse de l’abdomen, obliques, grand droit, deltoïdes, dentelé antérieur, moyen et grand fessier"}},"floordip":{"es":{"d":"Fondos de tríceps en el suelo con cadera elevada: flexiona los codos hacia atrás y extiéndelos. Depresión escapular (hombros lejos de las orejas), rango corto y controlado. Tempo 2 s / 1 s.","v":"Hombros abajo, codos atrás, empuja hasta estirar.","pos":"Sentada, manos en la esterilla detrás de la cadera a la anchura de los hombros, dedos hacia ti. Rodillas a ~90°, pies planos. Eleva la cadera unos cm, pecho abierto, mirada al frente.","exe":"1. Baja los hombros lejos de las orejas y mantén la cadera elevada · 2. Flexiona los codos hacia atrás en 2 s, sin pasar de ~90° · 3. Empuja en 1 s hasta estirar los codos sin bloquearlos","resp":"Inhala al flexionar los codos, exhala al empujar.","err":"Hombros encogidos o adelantados: deprime y retrae las escápulas · Codos abiertos: apúntalos hacia atrás · Mover la cadera en vez de los brazos: fija la cadera y reduce el rango","mus":"Tríceps braquial, deltoides anterior, pectoral mayor, romboides, trapecio inferior, glúteo mayor"},"en":{"d":"Floor triceps dips with hips lifted: bend your elbows straight back and extend them. Scapular depression (shoulders away from ears), short controlled range. Tempo 2 s / 1 s.","v":"Shoulders down, elbows back, push until straight.","pos":"Seated, hands on the mat behind your hips, shoulder-width apart, fingers toward you. Knees at ~90°, feet flat. Lift your hips a few cm, chest open, gaze forward.","exe":"1. Draw your shoulders away from your ears and keep hips lifted · 2. Bend your elbows backward for 2 s, no deeper than ~90° · 3. Push for 1 s until your elbows are straight but not locked","resp":"Inhale as your elbows bend, exhale as you push.","err":"Shrugged or rolled-forward shoulders: depress and retract the shoulder blades · Flared elbows: point them backward · Moving the hips instead of the arms: fix your hips and shorten the range","mus":"Triceps brachii, anterior deltoid, pectoralis major, rhomboids, lower trapezius, gluteus maximus"},"fr":{"d":"Dips triceps au sol, hanches décollées : fléchis les coudes vers l’arrière puis tends-les. Abaissement des omoplates (épaules loin des oreilles), amplitude courte et contrôlée. Tempo 2 s / 1 s.","v":"Épaules basses, coudes en arrière, pousse jusqu’à tendre.","pos":"Assise, mains sur le tapis derrière les hanches, largeur d’épaules, doigts vers toi. Genoux à ~90°, pieds à plat. Décolle les hanches de quelques cm, poitrine ouverte, regard devant.","exe":"1. Éloigne les épaules des oreilles et garde les hanches hautes · 2. Fléchis les coudes vers l’arrière en 2 s, sans dépasser ~90° · 3. Pousse en 1 s jusqu’à tendre les coudes sans les verrouiller","resp":"Inspire en fléchissant les coudes, expire en poussant.","err":"Épaules haussées ou enroulées : abaisse et resserre les omoplates · Coudes ouverts : oriente-les vers l’arrière · Bouger les hanches au lieu des bras : fixe le bassin et réduis l’amplitude","mus":"Triceps brachial, deltoïde antérieur, grand pectoral, rhomboïdes, trapèze inférieur, grand fessier"}},"floordip_leg":{"es":{"d":"Fondos en el suelo con una pierna estirada: menos apoyo y más carga en los tríceps. Cadera alta y nivelada, depresión escapular, codos hacia atrás. Tempo 2 s / 1 s; cambia de pierna a mitad.","v":"Cadera alta, codos atrás y estira. Cambia de pierna a mitad.","pos":"Sentada, manos detrás de la cadera a la anchura de los hombros, dedos hacia ti. Una rodilla a ~90° con el pie plano, la otra pierna estirada con el talón en el suelo. Cadera elevada y nivelada.","exe":"1. Eleva la cadera activando el glúteo de la pierna flexionada · 2. Flexiona los codos hacia atrás en 2 s, hasta ~90° · 3. Empuja en 1 s hasta estirar sin bloquear · 4. A mitad de la serie, cambia de pierna","resp":"Inhala al flexionar los codos, exhala al empujar.","err":"Cadera que cae o se inclina: aprieta el glúteo y nivela la pelvis · Hombros encogidos: aléjalos de las orejas · Codos abiertos: apúntalos hacia atrás","mus":"Tríceps braquial, deltoides anterior, pectoral mayor, romboides, glúteo mayor, isquiotibiales"},"en":{"d":"Floor dips with one leg straight: less support, more load on the triceps. Hips high and level, scapular depression, elbows back. Tempo 2 s / 1 s; switch legs halfway.","v":"Hips high, elbows back and extend. Switch legs halfway.","pos":"Seated, hands behind your hips shoulder-width apart, fingers toward you. One knee at ~90° with the foot flat, the other leg straight with the heel down. Hips lifted and level.","exe":"1. Lift your hips by squeezing the bent-leg glute · 2. Bend your elbows backward for 2 s, to ~90° · 3. Push for 1 s until straight, without locking · 4. Halfway through the set, switch legs","resp":"Inhale as your elbows bend, exhale as you push.","err":"Hips dropping or tilting: squeeze the glute and level your pelvis · Shrugged shoulders: draw them away from your ears · Flared elbows: point them backward","mus":"Triceps brachii, anterior deltoid, pectoralis major, rhomboids, gluteus maximus, hamstrings"},"fr":{"d":"Dips au sol avec une jambe tendue : moins d’appui, plus de charge sur les triceps. Hanches hautes et à niveau, omoplates abaissées, coudes vers l’arrière. Tempo 2 s / 1 s ; change de jambe à mi-série.","v":"Hanches hautes, coudes en arrière et tends. Change de jambe à mi-série.","pos":"Assise, mains derrière les hanches largeur d’épaules, doigts vers toi. Un genou à ~90° pied à plat, l’autre jambe tendue talon au sol. Hanches décollées et à niveau.","exe":"1. Monte les hanches en serrant le fessier de la jambe pliée · 2. Fléchis les coudes vers l’arrière en 2 s, jusqu’à ~90° · 3. Pousse en 1 s jusqu’à tendre sans verrouiller · 4. À mi-série, change de jambe","resp":"Inspire en fléchissant les coudes, expire en poussant.","err":"Hanches qui tombent ou penchent : serre le fessier et remets le bassin à niveau · Épaules haussées : éloigne-les des oreilles · Coudes ouverts : oriente-les vers l’arrière","mus":"Triceps brachial, deltoïde antérieur, grand pectoral, rhomboïdes, grand fessier, ischio-jambiers"}},"downdog":{"es":{"d":"Perro boca abajo dinámico: V invertida con columna larga por bisagra de cadera, flexionando una rodilla mientras el talón contrario baja hacia el suelo. Brazos junto a las orejas, empuja el suelo.","v":"Empuja el suelo, cadera arriba, pedalea suave.","pos":"Desde cuadrupedia, manos a la anchura de los hombros con dedos abiertos, pies a la anchura de la cadera. Eleva la cadera en V invertida, brazos junto a las orejas, cabeza relajada entre los brazos.","exe":"1. Empuja el suelo alejando el pecho de las manos, espalda larga · 2. Dobla una rodilla elevando el talón mientras bajas el otro (1–2 s) · 3. Alterna de forma rítmica sin desplazar la cadera","resp":"Respira lento y continuo; exhala al bajar cada talón.","err":"Espalda redondeada: dobla ambas rodillas y lleva la cadera atrás y arriba · Hombros hacia las orejas: empuja el suelo y rota los brazos hacia fuera · Peso en las muñecas: repártelo en toda la mano","mus":"Deltoides, serrato anterior, tríceps, erectores espinales, isquiotibiales, gastrocnemio, sóleo"},"en":{"d":"Dynamic downward dog: inverted V with a long spine via a hip hinge, bending one knee while the opposite heel lowers toward the floor. Arms by your ears, push the floor away.","v":"Push the floor, hips high, pedal gently.","pos":"From all fours, hands shoulder-width apart with fingers spread, feet hip-width apart. Lift your hips into an inverted V, arms by your ears, head relaxed between your arms.","exe":"1. Push the floor, moving your chest away from your hands, long back · 2. Bend one knee lifting that heel while the other heel lowers (1–2 s) · 3. Alternate rhythmically without shifting your hips","resp":"Breathe slowly and steadily; exhale as each heel lowers.","err":"Rounded back: bend both knees and send your hips back and up · Shoulders creeping to ears: push the floor and rotate arms outward · Weight in the wrists: spread it through the whole hand","mus":"Deltoids, serratus anterior, triceps, erector spinae, hamstrings, gastrocnemius, soleus"},"fr":{"d":"Chien tête en bas dynamique : V inversé, dos long grâce à la charnière de hanche, en pliant un genou pendant que le talon opposé descend vers le sol. Bras près des oreilles, repousse le sol.","v":"Repousse le sol, hanches hautes, pédale doucement.","pos":"Depuis la position à quatre pattes, mains largeur d’épaules doigts écartés, pieds largeur de bassin. Monte les hanches en V inversé, bras près des oreilles, tête relâchée entre les bras.","exe":"1. Repousse le sol en éloignant la poitrine des mains, dos long · 2. Plie un genou en levant le talon pendant que l’autre descend (1–2 s) · 3. Alterne en rythme sans déplacer les hanches","resp":"Respire lentement et en continu ; expire quand chaque talon descend.","err":"Dos arrondi : plie les deux genoux et envoie les hanches en arrière et en haut · Épaules vers les oreilles : repousse le sol et tourne les bras vers l’extérieur · Poids sur les poignets : répartis-le sur toute la main","mus":"Deltoïdes, dentelé antérieur, triceps, érecteurs du rachis, ischio-jambiers, gastrocnémien, soléaire"}},"pike":{"es":{"d":"Flexión en pica: desde V invertida, flexiona los codos hacia atrás (~45°) llevando la cabeza hacia el suelo algo por delante de las manos. Empuje vertical de hombros, cadera alta, columna neutra.","v":"Cadera alta, codos atrás, cabeza al suelo y empuja.","pos":"V invertida: manos a la anchura de los hombros, pies a ~1 m de las manos, cadera alta, piernas estiradas o rodillas levemente flexionadas. Columna larga, mirada entre las manos.","exe":"1. Carga el peso sobre las manos con la cadera alta · 2. Baja en 2 s doblando los codos hacia atrás hasta acercar la cabeza al suelo, por delante de las manos · 3. Empuja en 1 s hasta estirar los brazos","resp":"Inhala al bajar, exhala al empujar.","err":"Codos abiertos a los lados: apúntalos atrás a ~45° · Bajar la cadera y convertirla en flexión normal: mantenla alta · Apoyar la cabeza con peso: para a 2–3 cm del suelo","mus":"Deltoides anterior y medio, tríceps braquial, trapecio superior, serrato anterior, pectoral mayor clavicular"},"en":{"d":"Pike push-up: from an inverted V, bend your elbows back (~45°), bringing your head toward the floor just ahead of your hands. Vertical shoulder press, hips high, neutral spine.","v":"Hips high, elbows back, head to the floor, push.","pos":"Inverted V: hands shoulder-width apart, feet ~1 m from your hands, hips high, legs straight or knees slightly bent. Long spine, gaze between your hands.","exe":"1. Shift your weight onto your hands, hips high · 2. Lower for 2 s, elbows bending back, until your head nears the floor ahead of your hands · 3. Push for 1 s until your arms are straight","resp":"Inhale on the way down, exhale as you push.","err":"Elbows flaring out: point them back at ~45° · Hips dropping into a regular push-up: keep them high · Resting weight on your head: stop 2–3 cm above the floor","mus":"Anterior and middle deltoid, triceps brachii, upper trapezius, serratus anterior, clavicular pectoralis major"},"fr":{"d":"Pompe en pike : depuis le V inversé, fléchis les coudes vers l’arrière (~45°) en amenant la tête vers le sol juste devant les mains. Poussée verticale des épaules, hanches hautes, colonne neutre.","v":"Hanches hautes, coudes en arrière, tête vers le sol, pousse.","pos":"V inversé : mains largeur d’épaules, pieds à ~1 m des mains, hanches hautes, jambes tendues ou genoux légèrement fléchis. Colonne longue, regard entre les mains.","exe":"1. Porte le poids sur les mains, hanches hautes · 2. Descends en 2 s, coudes vers l’arrière, jusqu’à approcher la tête du sol devant les mains · 3. Pousse en 1 s jusqu’à tendre les bras","resp":"Inspire en descendant, expire en poussant.","err":"Coudes ouverts sur les côtés : oriente-les en arrière à ~45° · Hanches qui descendent en pompe classique : garde-les hautes · Poser la tête avec du poids : arrête-toi à 2–3 cm du sol","mus":"Deltoïde antérieur et moyen, triceps brachial, trapèze supérieur, dentelé antérieur, grand pectoral (claviculaire)"}},"pike_slow":{"es":{"d":"Flexión en pica con excéntrica lenta: 3 s de bajada y 1 s de subida. Pies más cerca de las manos para verticalizar el empuje. Codos hacia atrás, cadera alta, columna neutra.","v":"Baja en tres segundos, codos atrás. Empuja.","pos":"V invertida con los pies algo más cerca de las manos (~70–80 cm): manos a la anchura de los hombros, cadera alta, columna larga, mirada entre las manos.","exe":"1. Carga el peso sobre las manos · 2. Baja contando 3 s, codos hacia atrás a ~45° · 3. Pausa breve con la cabeza a 2–3 cm del suelo · 4. Empuja en 1 s hasta estirar los brazos","resp":"Inhala durante la bajada lenta, exhala al empujar.","err":"Codos hacia los lados: llévalos atrás · Caer rápido al final: controla los 3 s completos · Espalda redondeada: dobla un poco las rodillas y eleva la cadera","mus":"Deltoides anterior y medio, tríceps braquial, trapecio superior, serrato anterior, pectoral mayor clavicular"},"en":{"d":"Pike push-up with a slow eccentric: 3 s down, 1 s up. Feet closer to your hands for a more vertical press. Elbows back, hips high, neutral spine.","v":"Lower for three seconds, elbows back. Push.","pos":"Inverted V with feet a bit closer to your hands (~70–80 cm): hands shoulder-width apart, hips high, long spine, gaze between your hands.","exe":"1. Shift your weight onto your hands · 2. Lower for a count of 3, elbows back at ~45° · 3. Brief pause with your head 2–3 cm off the floor · 4. Push for 1 s until your arms are straight","resp":"Inhale through the slow lowering, exhale as you push.","err":"Elbows out to the sides: bring them back · Dropping fast at the end: control the full 3 s · Rounded back: bend your knees slightly and lift your hips","mus":"Anterior and middle deltoid, triceps brachii, upper trapezius, serratus anterior, clavicular pectoralis major"},"fr":{"d":"Pompe en pike avec excentrique lente : 3 s de descente, 1 s de montée. Pieds plus proches des mains pour une poussée plus verticale. Coudes en arrière, hanches hautes, colonne neutre.","v":"Descends en trois secondes, coudes en arrière. Pousse.","pos":"V inversé, pieds un peu plus proches des mains (~70–80 cm) : mains largeur d’épaules, hanches hautes, colonne longue, regard entre les mains.","exe":"1. Porte le poids sur les mains · 2. Descends en comptant 3 s, coudes en arrière à ~45° · 3. Courte pause, tête à 2–3 cm du sol · 4. Pousse en 1 s jusqu’à tendre les bras","resp":"Inspire pendant la descente lente, expire en poussant.","err":"Coudes sur les côtés : ramène-les en arrière · Chute rapide en fin de descente : contrôle les 3 s · Dos arrondi : plie un peu les genoux et monte les hanches","mus":"Deltoïde antérieur et moyen, triceps brachial, trapèze supérieur, dentelé antérieur, grand pectoral (claviculaire)"}},"plank_knee":{"es":{"d":"Isometría en plancha sobre rodillas: línea recta rodillas-cadera-cabeza, pelvis neutra con leve retroversión, transverso y glúteos activos, empujando el suelo con antebrazos o manos.","v":"Ombligo adentro, glúteos firmes. Respira.","pos":"Antebrazos bajo los hombros (codos a 90°) o manos bajo los hombros; rodillas apoyadas detrás, cadera extendida. Cuerpo recto de rodillas a cabeza, mirada al suelo.","exe":"1. Empuja el suelo separando ligeramente las escápulas · 2. Activa transverso y glúteos, pelvis neutra · 3. Mantén la posición el tiempo indicado sin perder la línea","resp":"Respiración diafragmática: inhala por la nariz, exhala lento por la boca sin soltar el abdomen.","err":"Cadera alta: extiéndela apretando glúteos · Lumbar hundida: leve retroversión y abdomen activo · Pecho hundido entre los hombros: empuja el suelo","mus":"Transverso del abdomen, recto abdominal, oblicuos, glúteo mayor, serrato anterior, deltoides"},"en":{"d":"Kneeling plank hold: straight knee-hip-head line, neutral pelvis with a slight posterior tilt, transversus and glutes engaged, pushing the floor with forearms or hands.","v":"Navel in, glutes tight. Breathe.","pos":"Forearms under your shoulders (elbows at 90°) or hands under your shoulders; knees down behind you, hips extended. Body straight from knees to head, gaze down.","exe":"1. Push the floor, spreading your shoulder blades slightly · 2. Brace transversus and glutes, pelvis neutral · 3. Hold for the set time without losing the line","resp":"Diaphragmatic breathing: inhale through your nose, exhale slowly through your mouth, keeping abs on.","err":"Hips too high: extend them by squeezing glutes · Sagging lower back: slight posterior tilt, abs on · Chest sinking between the shoulders: push the floor","mus":"Transversus abdominis, rectus abdominis, obliques, gluteus maximus, serratus anterior, deltoids"},"fr":{"d":"Gainage isométrique sur les genoux : ligne droite genoux-hanches-tête, bassin neutre en légère rétroversion, transverse et fessiers actifs, avant-bras ou mains qui repoussent le sol.","v":"Nombril rentré, fessiers serrés. Respire.","pos":"Avant-bras sous les épaules (coudes à 90°) ou mains sous les épaules ; genoux au sol derrière, hanches tendues. Corps droit des genoux à la tête, regard au sol.","exe":"1. Repousse le sol en écartant légèrement les omoplates · 2. Active transverse et fessiers, bassin neutre · 3. Tiens la position le temps indiqué sans perdre l’alignement","resp":"Respiration diaphragmatique : inspire par le nez, expire lentement par la bouche sans relâcher le ventre.","err":"Hanches trop hautes : tends-les en serrant les fessiers · Bas du dos creusé : légère rétroversion, abdos actifs · Poitrine qui s’affaisse entre les épaules : repousse le sol","mus":"Transverse de l’abdomen, grand droit, obliques, grand fessier, dentelé antérieur, deltoïdes"}},"plank":{"es":{"d":"Plancha alta isométrica: línea recta talones-cadera-cabeza, pelvis neutra, transverso, glúteos y cuádriceps activos. Protracción escapular ligera empujando el suelo.","v":"Cuerpo recto, glúteos firmes, respira tranquila.","pos":"Manos bajo los hombros con dedos al frente, brazos estirados sin bloquear, piernas estiradas y pies a la anchura de la cadera. Cuerpo recto de talones a cabeza, mirada al suelo.","exe":"1. Empuja el suelo alejando el pecho de las manos · 2. Aprieta glúteos y cuádriceps, ombligo hacia dentro · 3. Mantén la posición el tiempo indicado respirando con calma","resp":"Respiración diafragmática continua; exhala largo sin soltar el abdomen.","err":"Lumbar hundida: retroversión leve y glúteos, o apoya rodillas · Cadera demasiado alta: bájala a la línea hombros-talones · Hombros hundidos: empuja el suelo","mus":"Transverso del abdomen, recto abdominal, oblicuos, glúteo mayor, cuádriceps, serrato anterior, deltoides"},"en":{"d":"Isometric high plank: straight heel-hip-head line, neutral pelvis, transversus, glutes and quads engaged. Slight scapular protraction by pushing the floor away.","v":"Body straight, glutes tight, breathe calmly.","pos":"Hands under your shoulders, fingers forward, arms straight but not locked, legs straight and feet hip-width apart. Body straight from heels to head, gaze down.","exe":"1. Push the floor, moving your chest away from your hands · 2. Squeeze glutes and quads, navel in · 3. Hold for the set time, breathing calmly","resp":"Continuous diaphragmatic breathing; long exhales without letting your abs go.","err":"Sagging lower back: slight posterior tilt and glutes, or drop to your knees · Hips too high: lower to the shoulder-heel line · Sinking shoulders: push the floor","mus":"Transversus abdominis, rectus abdominis, obliques, gluteus maximus, quadriceps, serratus anterior, deltoids"},"fr":{"d":"Planche haute isométrique : ligne droite talons-hanches-tête, bassin neutre, transverse, fessiers et quadriceps actifs. Légère protraction des omoplates en repoussant le sol.","v":"Corps droit, fessiers serrés, respire calmement.","pos":"Mains sous les épaules doigts vers l’avant, bras tendus sans verrouiller, jambes tendues et pieds largeur de bassin. Corps droit des talons à la tête, regard au sol.","exe":"1. Repousse le sol en éloignant la poitrine des mains · 2. Serre fessiers et quadriceps, nombril rentré · 3. Tiens le temps indiqué en respirant calmement","resp":"Respiration diaphragmatique continue ; expire longuement sans relâcher le ventre.","err":"Bas du dos creusé : légère rétroversion et fessiers, ou pose les genoux · Hanches trop hautes : descends-les sur la ligne épaules-talons · Épaules affaissées : repousse le sol","mus":"Transverse de l’abdomen, grand droit, obliques, grand fessier, quadriceps, dentelé antérieur, deltoïdes"}},"plankleg":{"es":{"d":"Plancha alta con extensión de cadera alterna: eleva una pierna estirada ~15 cm sin rotar ni inclinar la pelvis. Columna neutra, core activo, glúteo de la pierna que sube. Tempo 1 s arriba / 1 s abajo.","v":"Plancha firme, sube una pierna, pelvis quieta. Alterna.","pos":"Plancha alta: manos bajo los hombros, pies a la anchura de la cadera, cuerpo recto de talones a cabeza, pelvis nivelada, mirada al suelo.","exe":"1. Activa transverso y empuja el suelo · 2. Eleva una pierna estirada un palmo en 1 s con el glúteo · 3. Mantén 1 s y baja en 1 s · 4. Alterna piernas sin mover la cadera","resp":"Exhala al elevar la pierna, inhala al bajarla.","err":"Pelvis que rota hacia la pierna elevada: sube menos y aprieta el glúteo contrario · Arquear la lumbar: la pierna solo sube un palmo · Cadera hundida: mantén el abdomen activo","mus":"Glúteo mayor, glúteo medio, isquiotibiales, transverso del abdomen, oblicuos, deltoides, serrato anterior"},"en":{"d":"High plank with alternating hip extension: lift one straight leg ~15 cm without rotating or tilting the pelvis. Neutral spine, core on, glute of the lifting leg. Tempo 1 s up / 1 s down.","v":"Strong plank, lift one leg, pelvis still. Alternate.","pos":"High plank: hands under your shoulders, feet hip-width apart, body straight from heels to head, pelvis level, gaze down.","exe":"1. Brace your transversus and push the floor · 2. Lift one straight leg a hand’s width in 1 s using the glute · 3. Hold 1 s, lower in 1 s · 4. Alternate legs without moving your hips","resp":"Exhale as you lift the leg, inhale as you lower it.","err":"Pelvis rotating toward the lifted leg: lift lower and squeeze the opposite glute · Arching the lower back: the leg only rises a hand’s width · Sagging hips: keep your abs on","mus":"Gluteus maximus, gluteus medius, hamstrings, transversus abdominis, obliques, deltoids, serratus anterior"},"fr":{"d":"Planche haute avec extension de hanche alternée : lève une jambe tendue de ~15 cm sans tourner ni pencher le bassin. Colonne neutre, gainage actif, fessier de la jambe levée. Tempo 1 s / 1 s.","v":"Planche solide, lève une jambe, bassin immobile. Alterne.","pos":"Planche haute : mains sous les épaules, pieds largeur de bassin, corps droit des talons à la tête, bassin à niveau, regard au sol.","exe":"1. Active le transverse et repousse le sol · 2. Lève une jambe tendue d’une main en 1 s avec le fessier · 3. Tiens 1 s, redescends en 1 s · 4. Alterne sans bouger les hanches","resp":"Expire en levant la jambe, inspire en la reposant.","err":"Bassin qui tourne vers la jambe levée : lève moins haut et serre le fessier opposé · Cambrer le bas du dos : la jambe ne monte que d’une main · Hanches affaissées : garde les abdos actifs","mus":"Grand fessier, moyen fessier, ischio-jambiers, transverse de l’abdomen, obliques, deltoïdes, dentelé antérieur"}},"plankdog":{"es":{"d":"Transición plancha-perro boca abajo: flexiona la cadera (bisagra) hasta la V invertida empujando el suelo con brazos estirados y vuelve a plancha con columna neutra. Tempo 2 s / 2 s.","v":"Empuja el suelo, cadera arriba. Vuelve a plancha firme.","pos":"Plancha alta: manos bajo los hombros con dedos abiertos, pies a la anchura de la cadera, cuerpo recto de talones a cabeza, mirada al suelo. Nivel fácil: rodillas apoyadas.","exe":"1. Activa core y empuja el suelo · 2. Lleva la cadera arriba y atrás en 2 s hasta la V invertida, brazos junto a las orejas · 3. Vuelve en 2 s a plancha alineada, hombros sobre las manos","resp":"Exhala al subir la cadera, t allonge la colonne · Hanches qui s’affaissent au retour : stoppe sur la ligne droite avec les fessiers · Épaules haussées : repousse le sol","mus":"Deltoïdes, dentelé antérieur, triceps, transverse de l’abdomen, grand droit, ischio-jambiers, gastrocnémien"}},"scap":{"es":{"d":"Flexión escapular: en plancha con codos estirados, alterna retracción (el pecho baja entre las manos) y protracción (empuja el suelo separando las escápulas). Solo se mueven las escápulas. Tempo 2 s / 2 s.","v":"Junta las escápulas, luego empuja el suelo y sepáralas.","pos":"Plancha alta: manos bajo los hombros, codos estirados sin bloquear, cuerpo recto de talones a cabeza, mirada al suelo. Nivel fácil: rodillas apoyadas y cadera extendida.","exe":"1. Con brazos rectos, deja bajar el pecho 2 s juntando las escápulas (retracción) · 2. Empuja el suelo 2 s separándolas al máximo (protracción) · 3. Repite sin doblar codos ni mover la cadera","resp":"Inhala al juntar las escápulas, exhala al empujar el suelo.","err":"Doblar los codos: mantenlos estirados, el movimiento es pequeño · Hundir la cadera o la lumbar: glúteos y transverso activos · Encoger los hombros: aléjalos de las orejas","mus":"Serrato anterior, romboides, trapecio medio e inferior, pectoral menor, transverso del abdomen"},"en":{"d":"Scapular push-up: in a plank with straight elbows, alternate retraction (chest sinks between your hands) and protraction (push the floor, spreading your shoulder blades). Only the blades move. Tempo 2 s / 2 s.","v":"Squeeze the shoulder blades, then push the floor apart.","pos":"High plank: hands under your shoulders, elbows straight but not locked, body straight from heels to head, gaze down. Easier level: knees down, hips extended.","exe":"1. Arms straight, let your chest sink for 2 s as the blades squeeze (retraction) · 2. Push the floor for 2 s, spreading them fully (protraction) · 3. Repeat without bending elbows or moving hips","resp":"Inhale as the blades squeeze, exhale as you push the floor.","err":"Bending the elbows: keep them straight, the movement is small · Sagging hips or lower back: glutes and transversus on · Shrugging: keep shoulders away from your ears","mus":"Serratus anterior, rhomboids, middle and lower trapezius, pectoralis minor, transversus abdominis"},"fr":{"d":"Pompe scapulaire : en planche coudes tendus, alterne rétraction (la poitrine descend entre les mains) et protraction (repousse le sol en écartant les omoplates). Seules les omoplates bougent. Tempo 2 s / 2 s.","v":"Serre les omoplates, puis repousse le sol et écarte-les.","pos":"Planche haute : mains sous les épaules, coudes tendus sans verrouiller, corps droit des talons à la tête, regard au sol. Niveau facile : genoux au sol, hanches tendues.","exe":"1. Bras tendus, laisse descendre la poitrine 2 s en serrant les omoplates (rétraction) · 2. Repousse le sol 2 s en les écartant au maximum (protraction) · 3. Répète sans plier les coudes ni bouger les hanches","resp":"Inspire en serrant les omoplates, expire en repoussant le sol.","err":"Plier les coudes : garde-les tendus, le mouvement est petit · Hanches ou bas du dos qui s’affaissent : fessiers et transverse actifs · Épaules haussées : éloigne-les des oreilles","mus":"Dentelé antérieur, rhomboïdes, trapèze moyen et inférieur, petit pectoral, transverse de l’abdomen"}},"deadbug_easy":{"es":{"d":"Bicho muerto con descenso alterno de un talón desde la posición de mesa, con la zona lumbar en contacto con la esterilla y control antiextensión.","v":"Costillas abajo, baja el talón y vuelve. Lumbar pegada.","pos":"Boca arriba, cadera y rodillas a 90° (posición de mesa), brazos extendidos al techo sobre los hombros. Ligera retroversión pélvica y zona lumbar en contacto con la esterilla.","exe":"1. Activa el transverso y fija las costillas abajo · 2. Baja un talón hasta rozar el suelo en 2 s, rodilla a 90° · 3. Vuelve a mesa en 1 s · 4. Alterna piernas sin mover la pelvis","resp":"Exhala al bajar el talón, inhala al volver a la posición ón simultánea de brazo y pierna contraria desde posición de mesa, con la zona lumbar en contacto con la esterilla y control antiextensión y antirrotación.","v":"Brazo y pierna contraria lejos, costillas abajo. Vuelve.","pos":"Boca arriba, cadera y rodillas a 90° (posición de mesa), brazos extendidos al techo sobre los hombros. Ligera retroversión pélvica y zona lumbar en contacto con la esterilla.","exe":"1. Activa el transverso y fija las costillas abajo · 2. Extiende un brazo atrás y la pierna contraria al frente en 2 s, sin tocar el suelo · 3. Vuelve a mesa en 1 s · 4. Alterna lados","resp":"Exhala durante la extensión, inhala al volver al centro.","err":"Lumbar que se despega: acorta el recorrido de brazo y pierna · Costillas que se abren: exhala más y baja el esternón · Prisa: respeta el tempo 2-1","mus":"Transverso del abdomen, recto abdominal, oblicuos, psoas ilíaco, serrato anterior"},"en":{"d":"Simultaneous extension of one arm and the opposite leg from tabletop, lower back in contact with the mat, with anti-extension and anti-rotation control.","v":"Opposite arm and leg long, ribs down. Return.","pos":"Lie on your back, hips and knees at 90° (tabletop), arms straight up over your shoulders. Slight posterior pelvic tilt, lower back in contact with the mat.","exe":"1. Brace your transverse abdominis, ribs down · 2. Reach one arm overhead and extend the opposite leg in 2 s, without touching the floor · 3. Return to tabletop in 1 s · 4. Alternate sides","resp":"Exhale as you extend, inhale as you return to center.","err":"Lower back lifting: shorten the arm and leg range · Ribs flaring: exhale fully and draw the sternum down · Rushing: keep the 2-1 tempo","mus":"Transverse abdominis, rectus abdominis, obliques, iliopsoas, serratus anterior"},"fr":{"d":"Extension simultanée d’un bras et de la jambe opposée depuis la position de table, lombaires au contact du tapis, contrôle anti-extension et anti-rotation.","v":"Bras et jambe opposée loin, côtes basses. Reviens.","pos":"Allongée sur le dos, hanches et genoux à 90° (position de table), bras tendus vers le plafond au-dessus des épaules. Légère rétroversion du bassin, lombaires au contact du tapis.","exe":"1. Active le transverse, côtes basses · 2. Tends un bras vers l’arrière et la jambe opposée vers l’avant en 2 s, sans toucher le sol · 3. Reviens en table en 1 s · 4. Alterne","resp":"Expire pendant l’extension, inspire en revenant au centre.","err":"Lombaires qui décollent : réduis l’amplitude · Côtes qui s’ouvrent : expire à fond et abaisse le sternum · Précipitation : respecte le tempo 2-1","mus":"Transverse de l’abdomen, grand droit de l’abdomen, obliques, ilio-psoas, dentelé antérieur"}},"deadbug_slow":{"es":{"d":"Bicho muerto con tempo lento: extensión en 3 s y pausa isométrica de 1 s en máxima extensión, sin perder el contacto lumbar con la esterilla.","v":"Estira en tres, aguanta uno, vuelve controlada.","pos":"Boca arriba, cadera y rodillas a 90° (posición de mesa), brazos extendidos al techo sobre los hombros. Ligera retroversión pélvica y zona lumbar en contacto con la esterilla.","exe":"1. Desde mesa, activa el transverso · 2. Extiende brazo y pierna contraria en 3 s · 3. Pausa de 1 s con la lumbar pegada · 4. Vuelve en 2 s y alterna","resp":"Exhala lento durante la extensión y la pausa, inhala al volver.","err":"Aguantar la respiración: exhala de forma continua · Perder el tempo: cuenta 3-1-2 · Lumbar que se arquea en la pausa: no alejes tanto la pierna","mus":"Transverso del abdomen, recto abdominal, oblicuos, psoas ilíaco, serrato anterior"},"en":{"d":"Slow-tempo dead bug: 3 s extension and a 1 s isometric pause at full reach, without losing lower-back contact with the mat.","v":"Reach for three, hold one, return with control.","pos":"Lie on your back, hips and knees at 90° (tabletop), arms straight up over your shoulders. Slight posterior pelvic tilt, lower back in contact with the mat.","exe":"1. From tabletop, brace your transverse abdominis · 2. Extend the arm and opposite leg in 3 s · 3. Pause 1 s with your lower back flat · 4. Return in 2 s and alternate","resp":"Exhale slowly through the extension and pause, inhale as you return.","err":"Holding your breath: exhale continuously · Losing the tempo: count 3-1-2 · Back arching during the pause: don’t reach the leg as far","mus":"Transverse abdominis, rectus abdominis, obliques, iliopsoas, serratus anterior"},"fr":{"d":"Dead bug en tempo lent : extension en 3 s et pause isométrique de 1 s en extension maximale, sans perdre le contact lombaire avec le tapis.","v":"Tends en trois, tiens une, reviens contrôlée.","pos":"Allongée sur le dos, hanches et genoux à 90° (position de table), bras tendus vers le plafond au-dessus des épaules. Légère rétroversion du bassin, lombaires au contact du tapis.","exe":"1. Depuis la table, active le transverse · 2. Tends le bras et la jambe opposée en 3 s · 3. Pause de 1 s, lombaires plaquées · 4. Reviens en 2 s et alterne","resp":"Expire lentement pendant l’extension et la pause, inspire en revenant.","err":"Bloquer la respiration : expire en continu · Perdre le tempo : compte 3-1-2 · Dos qui se cambre pendant la pause : éloigne moins la jambe","mus":"Transverse de l’abdomen, grand droit de l’abdomen, obliques, ilio-psoas, dentelé antérieur"}},"crunch":{"es":{"d":"Flexión del tronco superior hasta despegar las escápulas, con ligera retroversión pélvica y cuello neutro; recorrido corto y controlado.","v":"Costillas hacia la pelvis, sube escápulas, baja lenta.","pos":"Boca arriba, rodillas dobladas y pies apoyados a la anchura de la cadera. Manos en las sienes o cruzadas en el pecho, un puño de distancia entre barbilla y pecho.","exe":"1. Activa el transverso y acerca las costillas a la pelvis · 2. Sube cabeza y hombros hasta despegar las escápulas en 1 s · 3. Pausa 1 s · 4. Baja en 2-3 s sin relajar del todo","resp":"Exhala al subir, inhala al bajar.","err":"Tirar del cuello: apoya solo los dedos y mira a las rodillas · Subir con impuls mpulso de las piernas y exige mantener la retroversión pélvica.","v":"Piernas quietas en mesa, sube escápulas, baja lenta.","pos":"Boca arriba, cadera y rodillas a 90°, espinillas paralelas al suelo. Dedos en las sienes y zona lumbar en contacto con la esterilla.","exe":"1. Fija las piernas en mesa y activa el transverso · 2. Sube cabeza y hombros hasta despegar las escápulas en 1 s · 3. Pausa 1 s · 4. Baja en 2-3 s sin mover las piernas","resp":"Exhala al subir, inhala al bajar.","err":"Piernas que se balancean: mantén las rodillas sobre la cadera · Lumbar que se arquea: aumenta la retroversión pélvica · Tirar del cuello: mirada en diagonal hacia las rodillas","mus":"Recto abdominal, oblicuos, transverso del abdomen, psoas ilíaco (isométrico)"},"en":{"d":"Crunch with hips and knees at 90° (tabletop): removes leg momentum and requires you to hold a posterior pelvic tilt.","v":"Legs still in tabletop, lift the shoulder blades, lower slowly.","pos":"Lie on your back, hips and knees at 90°, shins parallel to the floor. Fingertips at your temples, lower back in contact with the mat.","exe":"1. Lock your legs in tabletop and brace your transverse abdominis · 2. Lift head and shoulders until the shoulder blades clear in 1 s · 3. Pause 1 s · 4. Lower in 2-3 s without moving your legs","resp":"Exhale as you lift, inhale as you lower.","err":"Legs swinging: keep knees stacked over hips · Lower back arching: increase the posterior pelvic tilt · Pulling on your neck: gaze diagonally toward your knees","mus":"Rectus abdominis, obliques, transverse abdominis, iliopsoas (isometric)"},"fr":{"d":"Crunch avec hanches et genoux à 90° (position de table) : supprime l’élan des jambes et exige de maintenir la rétroversion du bassin.","v":"Jambes immobiles en table, décolle les omoplates, descends lentement.","pos":"Allongée sur le dos, hanches et genoux à 90°, tibias parallèles au sol. Doigts sur les tempes, lombaires au contact du tapis.","exe":"1. Fixe les jambes en table et active le transverse · 2. Monte tête et épaules jusqu’à décoller les omoplates en 1 s · 3. Pause 1 s · 4. Redescends en 2-3 s sans bouger les jambes","resp":"Expire en montant, inspire en descendant.","err":"Jambes qui se balancent : garde les genoux au-dessus des hanches · Dos qui se cambre : accentue la rétroversion · Tirer sur la nuque : regard en diagonale vers les genoux","mus":"Grand droit de l’abdomen, obliques, transverse de l’abdomen, ilio-psoas (isométrique)"}},"situp":{"es":{"d":"Flexión completa del tronco de tumbada a sentada, con enrollado y desenrollado vertebral controlado; combina abdomen y flexores de cadera.","v":"Enrolla hasta sentarte, desenrolla vértebra a vértebra.","pos":"Boca arriba, rodillas dobladas y pies apoyados a la anchura de la cadera. Brazos extendidos al frente o cruzados en el pecho.","exe":"1. Despega cabeza y escápulas como en un encogimiento · 2. Sigue enrollando hasta sentarte en 2 s · 3. Desenrolla vértebra a vértebra en 3 s · 4. Apoya los hombros y repite","resp":"Exhala al subir, inhala al bajar.","err":"Tirar del cuello: lleva los brazos al frente · Pies que se despegan: usa los brazos al frente como contrapeso y sube más despacio · Caer de golpe: baja en 3 s","mus":"Recto abdominal, oblicuos, psoas ilíaco, recto femoral"},"en":{"d":"Full trunk flexion from lying to seated, with controlled segmental rolling up and down; combines abdominals and hip flexors.","v":"Roll up to sitting, roll down one vertebra at a time.","pos":"Lie on your back, knees bent, feet flat and hip-width apart. Arms reaching forward or crossed on your chest.","exe":"1. Lift head and shoulder blades as in a crunch · 2. Keep curling up to sitting in 2 s · 3. Roll down one vertebra at a time in 3 s · 4. Touch your shoulders down and repeat","resp":"Exhale as you rise, inhale as you lower.","err":"Pulling on your neck: reach your arms forward · Feet lifting: use forward arms as a counterweight and rise more slowly · Dropping down: lower over 3 s","mus":"Rectus abdominis, obliques, iliopsoas, rectus femoris"},"fr":{"d":"Flexion complète du tronc de allongée à assise, avec enroulement et déroulement vertébral contrôlés ; associe abdominaux et fléchisseurs de hanche.","v":"Enroule-toi jusqu’à t’asseoir, déroule vertèbre par vertèbre.","pos":"Allongée sur le dos, genoux fléchis, pieds à plat à largeur de hanches. Bras tendus devant toi ou croisés sur la poitrine.","exe":"1. Décolle tête et omoplates comme pour un crunch · 2. Continue d’enrouler jusqu’à être assise en 2 s · 3. Déroule vertèbre par vertèbre en 3 s · 4. Repose les épaules et recommence","resp":"Expire en montant, inspire en descendant.","err":"Tirer sur la nuque : tends les bras devant · Pieds qui décollent : bras devant en contrepoids et monte plus lentement · Retomber d’un coup : descends en 3 s","mus":"Grand droit de l’abdomen, obliques, ilio-psoas, droit fémoral"}},"sideplank_knee":{"es":{"d":"Plancha lateral isométrica sobre antebrazo y rodilla, con la cadera elevada en línea hombro-cadera-rodilla; control de la flexión lateral.","v":"Codo bajo el hombro, cadera arriba, línea recta.","pos":"De lado, antebrazo apoyado con el codo justo bajo el hombro, rodillas dobladas a 90° y apiladas. Hombros, cadera y rodillas en el mismo plano.","exe":"1. Activa el transverso y empuja el suelo con el antebrazo · 2. Eleva la cadera en 1 s hasta alinear hombro, cadera y rodilla · 3. Aguanta el tiempo indicado · 4. Baja controlada y cambia de lado","resp":"Respiración continua y tranquila; exhala al elevar la cadera, sin apnea.","err":"Cadera que cae: empuja el suelo y sube la cadera · Hombro hundido: aleja el hombro de la oreja · Cadera hacia atrás: adelántala hasta alinearla","mus":"Oblicuos, cuadrado lumbar, glúteo medio, transverso del abdomen, serrato anterior"},"en":{"d":"Isometric side plank on forearm and knee, hips lifted in a shoulder-hip-knee line; resists lateral flexion.","v":"Elbow under shoulder, hips up, straight line.","pos":"Lie on your side, forearm down wit
