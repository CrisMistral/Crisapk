ale and grow tall through the crown · 2. Exhale and hinge from the hips with anterior pelvic tilt · 3. Slide hands toward your feet to gentle tension · 4. Hold, then rise slowly.","resp":"Inhale to lengthen the spine, exhale long to hinge a little further from the hips.","err":"Rounding the back to reach further: prioritise a long spine · Locked knees with strong pull: bend them slightly · Bouncing: keep the position still.","mus":"Hamstrings, gastrocnemius, erector spinae, gluteus maximus"},"fr":{"d":"Étirement statique maintenu de la chaîne postérieure par flexion de hanche avec antéversion du bassin, colonne allongée.","v":"Poitrine longue, penche-toi depuis les hanches, expire et relâche.","pos":"Assise sur les ischions, jambes tendues et serrées, pieds fléchis. Colonne longue, mains sur les cuisses.","exe":"1. Inspire et grandis-toi par le sommet du crâne · 2. Expire et bascule depuis les hanches en antéversion · 3. Glisse les mains vers les pieds jusqu’à une tension douce · 4. Maintiens et remonte lentement.","resp":"Inspire pour allonger la colonne, expire longuement pour avancer un peu depuis les hanches.","err":"Arrondir le dos pour aller loin : privilégie une colonne longue · Genoux verrouillés qui tirent fort : fléchis-les un peu · Rebondir : reste immobile.","mus":"Ischio-jambiers, gastrocnémien, érecteurs du rachis, grand fessier"}},"butterfly":{"es":{"d":"Estiramiento estático sostenido de aductores en abducción y rotación externa de cadera, con inclinación desde la cadera y columna larga.","v":"Plantas juntas, rodillas caen solas, pecho largo.","pos":"Sentada sobre los isquiones, plantas de los pies juntas y talones a una distancia cómoda de la pelvis. Manos sujetando tobillos o pies.","exe":"1. Crece con la columna larga · 2. Deja caer las rodillas hacia el suelo por gravedad · 3. Exhala e inclínate un poco desde la cadera · 4. Mantén con tensión suave en la ingle.","resp":"Respiración diafragmática; en cada exhalación larga deja que las rodillas bajen un poco más.","err":"Empujar las rodillas con los codos: deja que caigan solas · Redondear la espalda: inclínate desde la cadera · Talones demasiado cerca con dolor: aléjalos.","mus":"Aductor largo, aductor mayor, aductor corto, grácil, pectíneo"},"en":{"d":"Sustained static stretch of the adductors in hip abduction and external rotation, with a hip hinge and long spine.","v":"Soles together, knees drop on their own, long chest.","pos":"Sit on your sit bones, soles of the feet together, heels a comfortable distance from your pelvis. Hands holding ankles or feet.","exe":"1. Sit tall with a long spine · 2. Let your knees drop toward the floor by gravity · 3. Exhale and hinge slightly from the hips · 4. Hold with gentle tension in the groin.","resp":"Diaphragmatic breathing; with each long exhale let your knees drop a little more.","err":"Pushing knees down with elbows: let them fall on their own · Rounding the back: hinge from the hips · Heels too close with pain: move them away.","mus":"Adductor longus, adductor magnus, adductor brevis, gracilis, pectineus"},"fr":{"d":"Étirement statique maintenu des adducteurs en abduction et rotation externe de hanche, bascule depuis les hanches et colonne longue.","v":"Plantes jointes, genoux qui tombent seuls, poitrine longue.","pos":"Assise sur les ischions, plantes des pieds jointes, talons à distance confortable du bassin. Mains sur les chevilles ou les pieds.","exe":"1. Grandis-toi, colonne longue · 2. Laisse les genoux descendre vers le sol par gravité · 3. Expire et penche-toi un peu depuis les hanches · 4. Maintiens une tension douce à l’aine.","resp":"Respiration diaphragmatique ; à chaque longue expiration, laisse les genoux descendre un peu plus.","err":"Pousser les genoux avec les coudes : laisse-les tomber seuls · Arrondir le dos : bascule depuis les hanches · Talons trop proches avec douleur : éloigne-les.","mus":"Long adducteur, grand adducteur, court adducteur, gracile, pectiné"}},"sidequad":{"es":{"d":"Estiramiento estático sostenido del cuádriceps y flexores de cadera en decúbito lateral, con flexión de rodilla y ligera retroversión pélvica.","v":"Talón al glúteo, rodillas juntas, pelvis hacia delante.","pos":"Tumbada de lado, cabeza apoyada en el brazo de abajo, piernas alineadas con el tronco y pierna de abajo algo flexionada para estabilizar.","exe":"1. Dobla la rodilla de arriba y sujeta el tobillo · 2. Lleva el talón hacia el glúteo · 3. Rodillas juntas y ligera retroversión pélvica · 4. Mantén y cambia de lado.","resp":"Respiración diafragmática; exhala largo para relajar la parte frontal del muslo.","err":"Rodilla de arriba adelantada o separada: alinéala con la otra · Arquear la zona lumbar: activa el glúteo y mete la pelvis · Tirar con dolor de rodilla: reduce el rango.","mus":"Recto femoral, vasto lateral, vasto medial, vasto intermedio, psoas ilíaco"},"en":{"d":"Sustained static stretch of the quadriceps and hip flexors lying on your side, with knee flexion and slight posterior pelvic tilt.","v":"Heel to glute, knees together, pelvis forward.","pos":"Lie on your side, head resting on your lower arm, legs in line with your trunk and lower leg slightly bent for stability.","exe":"1. Bend your top knee and hold the ankle · 2. Draw the heel toward your glute · 3. Knees together, slight posterior pelvic tilt · 4. Hold, then switch sides.","resp":"Diaphragmatic breathing; exhale long to relax the front of the thigh.","err":"Top knee drifting forward or up: align it with the other · Arching the lower back: squeeze the glute and tuck the pelvis · Pulling with knee pain: reduce range.","mus":"Rectus femoris, vastus lateralis, vastus medialis, vastus intermedius, iliopsoas"},"fr":{"d":"Étirement statique maintenu du quadriceps et des fléchisseurs de hanche sur le côté, genou fléchi et légère rétroversion du bassin.","v":"Talon vers le fessier, genoux serrés, bassin en avant.","pos":"Allongée sur le côté, tête sur le bras du dessous, jambes alignées avec le tronc, jambe du dessous un peu fléchie pour la stabilité.","exe":"1. Fléchis le genou du dessus et tiens la cheville · 2. Amène le talon vers le fessier · 3. Genoux joints et légère rétroversion du bassin · 4. Maintiens puis change de côté.","resp":"Respiration diaphragmatique ; expire longuement pour relâcher l’avant de la cuisse.","err":"Genou du dessus qui avance ou s’écarte : aligne-le · Cambrer les lombaires : serre le fessier et rentre le bassin · Tirer avec douleur au genou : réduis l’amplitude.","mus":"Droit fémoral, vaste latéral, vaste médial, vaste intermédiaire, ilio-psoas"}},"lowlunge":{"es":{"d":"Estiramiento estático sostenido de los flexores de cadera de la pierna atrasada, con retroversión pélvica y tronco erguido en zancada con rodilla apoyada.","v":"Pelvis hacia dentro, cadera adelante, tronco alto.","pos":"Rodilla trasera en la esterilla con empeine apoyado; pie delantero plano, rodilla sobre el tobillo. Manos en la rodilla delantera o la cadera.","exe":"1. Coloca la pelvis en ligera retroversión · 2. Lleva la cadera un poco adelante hasta tensión suave en la ingle trasera · 3. Tronco alto y costillas abajo · 4. Mantén y cambia de lado.","resp":"Respiración diafragmática; exhala largo manteniendo el abdomen activo para no arquear la lumbar.","err":"Arquear la zona lumbar: retroversión pélvica y costillas abajo · Rodilla delantera más allá del pie: alarga la zancada · Presión en la rodilla trasera: acolcha la esterilla.","mus":"Psoas ilíaco, recto femoral, tensor de la fascia lata, aductores"},"en":{"d":"Sustained static stretch of the back leg’s hip flexors, with posterior pelvic tilt and an upright trunk in a kneeling lunge.","v":"Tuck the pelvis, hips forward, stand tall.","pos":"Back knee on the mat, top of foot down; front foot flat, knee over ankle. Hands on the front knee or hips.","exe":"1. Set the pelvis in a slight posterior tilt · 2. Shift your hips slightly forward to gentle tension at the back hip · 3. Tall trunk, ribs down · 4. Hold, then switch sides.","resp":"Diaphragmatic breathing; exhale long with the core engaged so the lower back doesn’t arch.","err":"Arching the lower back: posterior tilt and ribs down · Front knee past the toes: lengthen your stance · Pressure on the back knee: fold the mat for padding.","mus":"Iliopsoas, rectus femoris, tensor fasciae latae, adductors"},"fr":{"d":"Étirement statique maintenu des fléchisseurs de hanche de la jambe arrière, bassin en rétroversion et buste droit en fente genou au sol.","v":"Bassin rentré, hanches en avant, buste grand.","pos":"Genou arrière sur le tapis, dessus du pied au sol ; pied avant à plat, genou au-dessus de la cheville. Mains sur le genou avant ou les hanches.","exe":"1. Place le bassin en légère rétroversion · 2. Avance un peu les hanches jusqu’à une tension douce à l’aine arrière · 3. Buste grand, côtes basses · 4. Maintiens puis change de côté.","resp":"Respiration diaphragmatique ; expire longuement, abdos actifs pour ne pas cambrer.","err":"Cambrer les lombaires : rétroversion et côtes basses · Genou avant au-delà du pied : allonge la fente · Pression au genou arrière : plie le tapis pour amortir.","mus":"Ilio-psoas, droit fémoral, tenseur du fascia lata, adducteurs"}},"yogisquat":{"es":{"d":"Postura sostenida de sentadilla profunda que moviliza cadera en flexión, abducción y rotación externa, y tobillos en flexión dorsal.","v":"Talones abajo, pecho alto, codos abren las rodillas.","pos":"De pie, pies algo más abiertos que la cadera y puntas ligeramente hacia fuera. Manos juntas delante del pecho.","exe":"1. Baja lento flexionando cadera y rodillas · 2. Rodillas en la línea de los pies · 3. Codos por dentro de las rodillas, abriéndolas suave · 4. Pecho alto, mantén y sube despacio.","resp":"Respiración diafragmática lenta; exhala largo para relajar la cadera y hundirte un poco más.","err":"Talones levantados: abre más los pies o gira las puntas · Rodillas hacia dentro: llévalas en línea con los pies · Espalda muy redondeada: pecho alto, baja menos.","mus":"Aductores, glúteo mayor, sóleo, gastrocnemio, erector de la columna"},"en":{"d":"Sustained deep-squat hold that mobilises the hips in flexion, abduction and external rotation, and the ankles in dorsiflexion.","v":"Heels down, chest tall, elbows open the knees.","pos":"Stand with feet slightly wider than hips, toes turned slightly out. Palms together in front of your chest.","exe":"1. Lower slowly by bending hips and knees · 2. Knees track over your feet · 3. Elbows inside your knees, gently opening them · 4. Chest tall, hold, then rise slowly.","resp":"Slow diaphragmatic breathing; exhale long to relax the hips and sink a little deeper.","err":"Heels lifting: widen your stance or turn toes out · Knees caving in: track them over your feet · Very rounded back: lift your chest, go less deep.","mus":"Adductors, gluteus maximus, soleus, gastrocnemius, erector spinae"},"fr":{"d":"Squat profond maintenu qui mobilise les hanches en flexion, abduction et rotation externe, et les chevilles en flexion dorsale.","v":"Talons au sol, poitrine haute, coudes qui ouvrent les genoux.","pos":"Debout, pieds un peu plus larges que les hanches, pointes légèrement vers l’extérieur. Mains jointes devant la poitrine.","exe":"1. Descends lentement en fléchissant hanches et genoux · 2. Genoux dans l’axe des pieds · 3. Coudes à l’intérieur des genoux, écarte-les doucement · 4. Poitrine haute, maintiens et remonte lentement.","resp":"Respiration diaphragmatique lente ; expire longuement pour relâcher les hanches et descendre un peu.","err":"Talons décollés : écarte les pieds ou ouvre les pointes · Genoux vers l’intérieur : aligne-les sur les pieds · Dos très arrondi : poitrine haute, descends moins.","mus":"Adducteurs, grand fessier, soléaire, gastrocnémien, érecteurs du rachis"}},"spinaltwist":{"es":{"d":"Estiramiento estático sostenido en rotación de columna lumbar y torácica en decúbito supino, con hombros apoyados y brazos en cruz.","v":"Rodillas a un lado, ambos hombros en la esterilla.","pos":"Boca arriba, rodillas flexionadas y juntas, pies apoyados. Brazos en cruz a la altura de los hombros, palmas hacia arriba.","exe":"1. Exhala y deja caer ambas rodillas hacia un lado · 2. Mantén los dos hombros apoyados · 3. Gira la cabeza suave al lado contrario si es cómodo · 4. Sostén, vuelve al centro y cambia.","resp":"Respiración diafragmática hacia las costillas; exhala largo dejando que el peso de las piernas profundice la torsión.","err":"Despegar el hombro contrario: baja menos las rodillas · Empujar las piernas: deja que actúe la gravedad · Contener el aire: respira lento y continuo.","mus":"Oblicuos, cuadrado lumbar, glúteo medio, erector de la columna, pectoral mayor"},"en":{"d":"Sustained static stretch in lumbar and thoracic rotation lying on your back, shoulders grounded and arms out in a T.","v":"Knees to one side, both shoulders on the mat.","pos":"Lie on your back, knees bent and together, feet flat. Arms out in a T at shoulder height, palms up.","exe":"1. Exhale and let both knees drop to one side · 2. Keep both shoulders on the mat · 3. Turn your head gently the other way if comfortable · 4. Hold, return to centre, switch.","resp":"Diaphragmatic breathing into the ribs; exhale long and let the weight of your legs deepen the twist.","err":"Opposite shoulder lifting: lower the knees less · Pushing the legs down: let gravity work · Holding your breath: breathe slowly and steadily.","mus":"Obliques, quadratus lumborum, gluteus medius, erector spinae, pectoralis major"},"fr":{"d":"Étirement statique maintenu en rotation du rachis lombaire et thoracique sur le dos, épaules au sol et bras en croix.","v":"Genoux d’un côté, les deux épaules au tapis.","pos":"Allongée sur le dos, genoux fléchis et serrés, pieds au sol. Bras en croix à hauteur d’épaules, paumes vers le haut.","exe":"1. Expire et laisse tomber les deux genoux d’un côté · 2. Garde les deux épaules au sol · 3. Tourne doucement la tête de l’autre côté si c’est confortable · 4. Maintiens, reviens au centre, change.","resp":"Respiration diaphragmatique dans les côtes ; expire longuement et laisse le poids des jambes approfondir la torsion.","err":"Épaule opposée qui décolle : descends moins les genoux · Pousser les jambes : laisse agir la gravité · Bloquer l’air : respire lentement et en continu.","mus":"Obliques, carré des lombes, moyen fessier, érecteurs du rachis, grand pectoral"}},"kneehug":{"es":{"d":"Flexión de cadera y columna lumbar en decúbito supino con balanceo lateral suave, que descomprime y moviliza la zona lumbar y el sacro.","v":"Rodillas al pecho, balanceo pequeño y lento.","pos":"Boca arriba, cabeza y hombros apoyados. Lleva ambas rodillas al pecho y abrázalas por debajo de las rodillas o por las espinillas.","exe":"1. Acerca las rodillas al pecho con tensión suave · 2. Deja la zona lumbar y el sacro apoyados · 3. Balancéate lento de lado a lado, rango pequeño · 4. Vuelve al centro y suelta.","resp":"Respiración diafragmática; exhala al acercar las rodillas y respira fluido durante el balanceo.","err":"Levantar la cabeza: mantenla apoyada y el cuello relajado · Balanceo amplio o rápido: pequeño y lento · Apretar fuerte: abrazo suave, sin tensión en hombros.","mus":"Erector de la columna, cuadrado lumbar, glúteo mayor, multífidos"},"en":{"d":"Hip and lumbar flexion lying on your back with a gentle side-to-side rock that decompresses and mobilises the lower back and sacrum.","v":"Knees to chest, small slow rocking.","pos":"Lie on your back, head and shoulders down. Bring both knees to your chest and hug them below the knees or at the shins.","exe":"1. Draw knees toward chest to gentle tension · 2. Let your lower back and sacrum rest on the mat · 3. Rock slowly side to side, small range · 4. Return to centre and release.","resp":"Diaphragmatic breathing; exhale as you draw the knees in and breathe smoothly while rocking.","err":"Lifting the head: keep it down and the neck relaxed · Big or fast rocking: keep it small and slow · Squeezing hard: gentle hug, no shoulder tension.","mus":"Erector spinae, quadratus lumborum, gluteus maximus, multifidus"},"fr":{"d":"Flexion de hanche et du rachis lombaire sur le dos avec un léger bercement latéral, qui décomprime et mobilise les lombaires et le sacrum.","v":"Genoux à la poitrine, petit bercement lent.","pos":"Allongée sur le dos, tête et épaules au sol. Ramène les deux genoux à la poitrine et enlace-les sous les genoux ou aux tibias.","exe":"1. Rapproche les genoux de la poitrine avec une tension douce · 2. Laisse lombaires et sacrum au sol · 3. Berce-toi lentement d’un côté à l’autre, petite amplitude · 4. Reviens au centre et relâche.","resp":"Respiration diaphragmatique ; expire en ramenant les genoux et respire en continu pendant le bercement.","err":"Lever la tête : garde-la au sol, nuque relâchée · Bercement ample ou rapide : petit et lent · Serrer fort : étreinte douce, sans tension dans les épaules.","mus":"Érecteurs du rachis, carré des lombes, grand fessier, multifides"}},"tricepstretch":{"es":{"d":"Estiramiento estático sostenido del tríceps y dorsal ancho en flexión completa de hombro y codo, con columna neutra y cuello relajado.","v":"Codo arriba, empuja suave, costillas abajo.","pos":"De pie, pies a la anchura de la cadera, rodillas desbloqueadas y columna neutra. Hombros relajados.","exe":"1. Eleva un brazo y dobla el codo, mano entre los omóplatos · 2. Con la otra mano empuja suave el codo hacia atrás · 3. Costillas abajo, sin arquear la lumbar · 4. Mantén y cambia de brazo.","resp":"Respiración diafragmática; exhala largo para ceder un poco más con el codo.","err":"Arquear la zona lumbar: activa el abdomen y costillas abajo · Adelantar la cabeza: cuello largo y relajado · Empujar fuerte el codo: presión suave.","mus":"Tríceps braquial, dorsal ancho, redondo mayor"},"en":{"d":"Sustained static stretch of the triceps and latissimus dorsi in full shoulder and elbow flexion, with a neutral spine and relaxed neck.","v":"Elbow up, press gently, ribs down.","pos":"Stand with feet hip-width, knees soft and a neutral spine. Shoulders relaxed.","exe":"1. Raise one arm and bend the elbow, hand between your shoulder blades · 2. With the other hand gently press the elbow back · 3. Ribs down, no lower-back arch · 4. Hold, then switch arms.","resp":"Diaphragmatic breathing; exhale long to let the elbow yield a little more.","err":"Arching the lower back: brace your core, ribs down · Pushing the head forward: long, relaxed neck · Pushing the elbow hard: use gentle pressure.","mus":"Triceps brachii, latissimus dorsi, teres major"},"fr":{"d":"Étirement statique maintenu du triceps et du grand dorsal en flexion complète d’épaule et de coude, colonne neutre et nuque relâchée.","v":"Coude en haut, pousse doucement, côtes basses.","pos":"Debout, pieds à largeur de hanches, genoux déverrouillés, colonne neutre. Épaules relâchées.","exe":"1. Lève un bras et plie le coude, main entre les omoplates · 2. De l’autre main, pousse doucement le coude vers l’arrière · 3. Côtes basses, sans cambrer · 4. Maintiens puis change de bras.","resp":"Respiration diaphragmatique ; expire longuement pour laisser le coude céder un peu plus.","err":"Cambrer les lombaires : gaine l’abdomen, côtes basses · Avancer la tête : nuque longue et relâchée · Pousser fort sur le coude : pression douce.","mus":"Triceps brachial, grand dorsal, grand rond"}},"neck":{"es":{"d":"Movilidad cervical controlada en semicírculos anteriores, de hombro a hombro, combinando flexión e inclinación lateral sin extensión del cuello.","v":"Barbilla al pecho, medio círculo por delante, muy lento.","pos":"De pie o sentada con columna neutra, hombros relajados y bajos, brazos sueltos. Lleva la barbilla suave hacia el pecho.","exe":"1. Desde la barbilla al pecho, rueda la cabeza hacia un hombro · 2. Vuelve por delante al centro y sigue al otro hombro · 3. Movimiento lento, sin pasar hacia atrás · 4. Alterna los lados.","resp":"Respiración nasal tranquila; exhala al pasar por el centro y relaja los hombros.","err":"Echar la cabeza hacia atrás: el semicírculo es solo por delante · Subir los hombros: mantenlos bajos y sueltos · Ir rápido o forzar: lento y en rango cómodo.","mus":"Trapecio superior, elevador de la escápula, esternocleidomastoideo, escalenos, extensores cervicales"},"en":{"d":"Controlled neck mobility in forward half-circles from shoulder to shoulder, combining flexion and side bending with no neck extension.","v":"Chin to chest, half-circle in front, very slow.","pos":"Stand or sit with a neutral spine, shoulders relaxed and low, arms loose. Gently bring your chin toward your chest.","exe":"1. From chin to chest, roll your head toward one shoulder · 2. Roll back through the front to centre and on to the other shoulder · 3. Move slowly, never behind · 4. Alternate sides.","resp":"Calm nasal breathing; exhale as you pass through the centre and relax your shoulders.","err":"Dropping the head back: the half-circle stays in front · Shrugging: keep shoulders low and loose · Going fast or forcing: slow, comfortable range.","mus":"Upper trapezius, levator scapulae, sternocleidomastoid, scalenes, cervical extensors"},"fr":{"d":"Mobilité cervicale contrôlée en demi-cercles vers l’avant, d’une épaule à l’autre, associant flexion et inclinaison latérale sans extension.","v":"Menton à la poitrine, demi-cercle devant, très lentement.","pos":"Debout ou assise, colonne neutre, épaules relâchées et basses, bras détendus. Amène doucement le menton vers la poitrine.","exe":"1. Depuis le menton à la poitrine, roule la tête vers une épaule · 2. Repasse par l’avant au centre puis vers l’autre épaule · 3. Mouvement lent, jamais vers l’arrière · 4. Alterne les côtés.","resp":"Respiration nasale calme ; expire en passant par le centre et relâche les épaules.","err":"Basculer la tête en arrière : le demi-cercle reste devant · Hausser les épaules : garde-les basses · Aller vite ou forcer : lent, amplitude confortable.","mus":"Trapèze supérieur, élévateur de la scapula, sterno-cléido-mastoïdien, scalènes, extenseurs cervicaux"}},"shouldercircle":{"es":{"d":"Movilidad articular de hombro y escápula con circunducción amplia de los codos, en ambos sentidos, manteniendo columna neutra.","v":"Círculos grandes con los codos, hombros lejos de las orejas.","pos":"De pie o sentada, columna neutra, pies a la anchura de la cadera. Yemas de los dedos sobre los hombros, codos hacia delante.","exe":"1. Dibuja círculos grandes con los codos hacia delante, arriba, atrás y abajo · 2. Mueve también los omóplatos · 3. A mitad del tiempo cambia de sentido · 4. Ritmo lento y controlado.","resp":"Inhala al subir los codos, exhala al bajarlos. Respiración fluida.","err":"Arquear la lumbar al llevar los codos atrás: costillas abajo · Encoger el cuello: hombros lejos de las orejas · Círculos pequeños o rápidos: amplios y lentos.","mus":"Deltoides, manguito rotador, trapecio, romboides, serrato anterior, pectoral mayor"},"en":{"d":"Shoulder and shoulder-blade joint mobility with wide elbow circles in both directions, keeping a neutral spine.","v":"Big elbow circles, shoulders away from ears.","pos":"Stand or sit with a neutral spine, feet hip-width. Fingertips on your shoulders, elbows pointing forward.","exe":"1. Draw big circles with your elbows: forward, up, back and down · 2. Let your shoulder blades move too · 3. Halfway through, reverse direction · 4. Keep a slow, controlled pace.","resp":"Inhale as the elbows rise, exhale as they come down. Smooth breathing.","err":"Arching the lower back as elbows go back: ribs down · Shrugging into the neck: shoulders away from ears · Small or fast circles: make them big and slow.","mus":"Deltoids, rotator cuff, trapezius, rhomboids, serratus anterior, pectoralis major"},"fr":{"d":"Mobilité articulaire de l’épaule et de l’omoplate par de grands cercles des coudes dans les deux sens, colonne neutre.","v":"Grands cercles avec les coudes, épaules loin des oreilles.","pos":"Debout ou assise, colonne neutre, pieds à largeur de hanches. Bouts des doigts sur les épaules, coudes vers l’avant.","exe":"1. Dessine de grands cercles avec les coudes : avant, haut, arrière, bas · 2. Laisse bouger les omoplates · 3. À mi-temps, change de sens · 4. Rythme lent et contrôlé.","resp":"Inspire en montant les coudes, expire en les descendant. Respiration fluide.","err":"Cambrer en ramenant les coudes en arrière : côtes basses · Rentrer le cou : épaules loin des oreilles · Petits cercles rapides : amples et lents.","mus":"Deltoïdes, coiffe des rotateurs, trapèze, rhomboïdes, dentelé antérieur, grand pectoral"}},"breathe":{"es":{"d":"Respiración diafragmática en decúbito supino con ritmo 4:6 (exhalación más larga) para activar la respuesta parasimpática y cerrar la sesión.","v":"Inhala en cuatro por la nariz, exhala en seis, lento.","pos":"Boca arriba, piernas estiradas o rodillas flexionadas con pies apoyados. Brazos relajados junto al cuerpo o una mano en el abdomen. Ojos cerrados.","exe":"1. Inhala por la nariz en 4 tiempos, expandiendo abdomen y costillas · 2. Exhala en 6 tiempos, suave y continuo · 3. Deja que el cuerpo pese sobre la esterilla · 4. Repite varios ciclos.","resp":"Inhala 4 tiempos por la nariz hacia el abdomen, exhala 6 tiempos por nariz o boca, sin pausas forzadas.","err":"Respirar solo con el pecho: nota subir la mano del abdomen · Forzar el volumen: aire cómodo, sin esfuerzo · Tensión en mandíbula y hombros: suéltalos al exhalar.","mus":"Diafragma, intercostales, transverso del abdomen, suelo pélvico (relajación)"},"en":{"d":"Diaphragmatic breathing lying on your back at a 4:6 ratio (longer exhale) to activate the parasympathetic response and close the session.","v":"Inhale through the nose for four, exhale for six, slowly.","pos":"Lie on your back, legs long or knees bent with feet flat. Arms relaxed by your sides or one hand on your belly. Eyes closed.","exe":"1. Inhale through the nose for 4 counts, expanding belly and ribs · 2. Exhale for 6 counts, soft and steady · 3. Let your body sink into the mat · 4. Repeat for several cycles.","resp":"Inhale 4 counts through the nose into the belly, exhale 6 counts through nose or mouth, no forced pauses.","err":"Chest-only breathing: feel the hand on your belly rise · Forcing volume: comfortable breaths, no effort · Tense jaw and shoulders: release them as you exhale.","mus":"Diaphragm, intercostals, transversus abdominis, pelvic floor (relaxation)"},"fr":{"d":"Respiration diaphragmatique sur le dos au rythme 4:6 (expiration plus longue) pour activer la réponse parasympathique et clôturer la séance.","v":"Inspire par le nez sur quatre, expire sur six, lentement.","pos":"Allongée sur le dos, jambes tendues ou genoux fléchis pieds au sol. Bras relâchés le long du corps ou une main sur le ventre. Yeux fermés.","exe":"1. Inspire par le nez sur 4 temps en gonflant ventre et côtes · 2. Expire sur 6 temps, doucement et en continu · 3. Laisse le corps peser sur le tapis · 4. Répète plusieurs cycles.","resp":"Inspire 4 temps par le nez vers le ventre, expire 6 temps par le nez ou la bouche, sans pause forcée.","err":"Respirer seulement avec la poitrine : sens la main du ventre monter · Forcer le volume : souffle confortable · Mâchoire et épaules tendues : relâche-les en expirant.","mus":"Diaphragme, intercostaux, transverse de l’abdomen, plancher pelvien (relâchement)"}}};

function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getLevel(){const l=lsGet('cris_calis_level',0);return (l===0||l===1||l===2)?l:0;}

// Semana de progreso (0-3) desde que empezaste en este nivel; a partir de la 4.ª se mantiene
function weeksAtLevel(){const s=lsGet('cris_calis_start',null);if(!s)return 0;const d=(new Date(dayKey())-new Date(s))/864e5;return Math.max(0,Math.floor(d/7));}
function progWeek(){return Math.min(3,weeksAtLevel());}
function levelTimes(){const L=LEVEL_TIMES[getLevel()],w=progWeek();return {work:L.w[w],rest:L.r[w]};}

/* ─── SESIÓN DEL DÍA: se construye a partir del programa, el nivel y la semana ─── */
function buildDay(i){
  const D=WEEK[i],lv=getLevel(),items=[];
  const mk=(id,dur,rest,sides,sec,extra)=>{const e=exL(id);return {id,name:e.n,desc:e.d,voice:e.v,tip:e.tip,emoji:e.e,anim:e.a,duration:dur,rest,sides:sides||1,sec,...(extra||{})};};
  if(D.stretch){
    D.list.forEach(([id,dur,sd])=>items.push(mk(id,dur,5,sd,'st')));
  }else{
    const {work,rest}=levelTimes(),R=2;
    WARMUP.forEach(([id,dur])=>items.push(mk(id,dur,0,1,'warm')));
    for(let r=1;r<=R;r++)D.circuit.forEach((slot,k)=>{
      const id=slot[lv],e=EX[id],sd=e.sd===2?2:1;
      const last=(r===R&&k===D.circuit.length-1);
      items.push(mk(id,sd===2?Math.round(work/2):work,last?0:(k===D.circuit.length-1?Math.max(rest,40):rest),sd,'main',{round:r,rounds:R,slot:k+1,slots:D.circuit.length,repeat:r>1}));
    });
    D.cool.forEach(([id,dur,sd])=>items.push(mk(id,dur,5,sd,'cool')));
  }
  const secs=items.reduce((s,x)=>s+x.duration*x.sides+x.rest+(x.sides===2?5:0)+6,0);
  return {id:D.id,idx:i,emoji:D.emoji,color:D.color,stretch:!!D.stretch,name:t('dn')[i],focus:t('f_'+D.id),intro:t('i_'+D.id),items,mins:Math.round(secs/60)};
}

/* ─── FIGURA ANIMADA: una única animación continua que se puede copiar ─── */
let FIG_T0=performance.now(),FIG_PAUSED=false,FIG_PAUSE_AT=0;
function figTime(){return ((FIG_PAUSED?FIG_PAUSE_AT:performance.now())-FIG_T0)/1000;}
function figReset(){FIG_T0=performance.now();FIG_PAUSED=false;}
function figPause(p){if(p&&!FIG_PAUSED){FIG_PAUSE_AT=performance.now();FIG_PAUSED=true;}else if(!p&&FIG_PAUSED){FIG_T0+=performance.now()-FIG_PAUSE_AT;FIG_PAUSED=false;}}
function figFrame(svg,key,k){
  const an=FIG_ANIMS[key]||FIG_ANIMS.breathe;
  if(!svg._fit||svg._key!==key){svg._fit=figFit(an.K);svg._key=key;}
  svg.querySelector('g.fig-body').innerHTML=figSVG(figAt(an,k),svg._fit,an.hl);
}
function figLoop(){
  document.querySelectorAll('svg.fig').forEach(svg=>{
    const key=svg.dataset.anim,an=FIG_ANIMS[key]||FIG_ANIMS.breathe;
    const T=an.tempo||3,time=svg.dataset.still?T*.5:figTime();
    if(svg.dataset.still&&svg._drawn===key)return; // miniaturas: se dibujan una vez
    figFrame(svg,key,(time%T)/T);svg._drawn=key;
    const rep=svg.parentNode.querySelector('.rep-badge');
    if(rep&&S.phase==='active'){rep.textContent=an.hold?t('hold'):t('rep',{n:Math.floor(figTime()/T)+1});rep.style.display='';}
    else if(rep)rep.style.display='none';
  });
  requestAnimationFrame(figLoop);
}
requestAnimationFrame(figLoop);
function getAnim(key,opts){
  opts=opts||{};
  return `<div class="anim-wrap${opts.big?' big':''}">
    <svg class="fig" data-anim="${key}"${opts.still?' data-still="1"':''} viewBox="${FIG_VB}" xmlns="http://www.w3.org/2000/svg"${opts.mirror?' style="transform:scaleX(-1)"':''}>${FIG_MAT}<g class="fig-body"></g></svg>
    ${opts.tag?`<span class="anim-tag">${opts.tag}</span>`:''}
    ${opts.big?'<span class="rep-badge" style="display:none"></span>':''}
  </div>`;
}
function thumb(key){return `<svg class="fig thumb" data-anim="${key}" data-still="1" viewBox="${FIG_VB}" xmlns="http://www.w3.org/2000/svg">${FIG_MAT}<g class="fig-body"></g></svg>`;}

/* ─── AUDIO ─── */
let __beepCtx=null;function __getCtx(){try{if(!__beepCtx)__beepCtx=new(window.AudioContext||window.webkitAudioContext)();if(__beepCtx.state==='suspended')__beepCtx.resume();return __beepCtx;}catch(e){return null;}}
function beep(f=600,d=.2){if(!__allow('sound'))return;try{const c=__getCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}catch(e){}}
function vibrate(ms=60){if(!__allow('vib'))return;try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
let _utt=null;
function speak(tx){try{if(!__allow('voice'))return;if(!window.speechSynthesis)return;window.speechSynthesis.cancel();if(window.speechSynthesis.paused)window.speechSynthesis.resume();_utt=new SpeechSynthesisUtterance(tx);_utt.lang=VOICE_LANG[crisLang()];_utt.rate=.9;const v=window.speechSynthesis.getVoices();const ev=v.find(x=>x.lang.startsWith(crisLang()));if(ev)_utt.voice=ev;window.speechSynthesis.speak(_utt);}catch(e){}}
let _speakSeq=0;
function speakThen(tx,cb){
  const seq=++_speakSeq;let done=false;
  const fin=()=>{if(done||seq!==_speakSeq)return;done=true;cb();};
  try{
    if(!__allow('voice')||!window.speechSynthesis){fin();return;}
    window.speechSynthesis.cancel();
    if(window.speechSynthesis.paused)window.speechSynthesis.resume();
    _utt=new SpeechSynthesisUtterance(tx);
    _utt.lang=VOICE_LANG[crisLang()];_utt.rate=.9;
    const v=window.speechSynthesis.getVoices();const ev=v.find(x=>x.lang.startsWith(crisLang()));if(ev)_utt.voice=ev;
    _utt.onend=fin;_utt.onerror=fin;
    window.speechSynthesis.speak(_utt);
    setTimeout(fin,Math.max(4000,tx.length*105));
  }catch(e){fin();}
}

function techList(txt,ordered){const it=(txt||'').split(' · ').map(x=>x.replace(/^\d+[.)]\s*/,'').trim()).filter(Boolean);const tg=ordered?'ol':'ul';return `<${tg} class="tech-list">${it.map(x=>`<li>${x}</li>`).join('')}</${tg}>`;}

/* ─── SESIÓN (automática: un toque y todo fluye; tú solo copias a la figura) ─── */
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseAwake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&['prep','active','switch','rest'].includes(S.phase))keepAwake();
});
function exList(){return CUR.items;}
function startSession(){
  CUR=buildDay(curDayIdx);
  if(!lsGet('cris_calis_start',null))lsSet('cris_calis_start',dayKey());
  S={exIdx:0,side:1,phase:'idle',timer:0,total:0,interval:null,pausedPhase:null};
  document.getElementById('s-title').textContent=CUR.name+' · '+CUR.focus;
  go('session');renderSession();
}
function confirmStop(){stopSession();go('day');}
function stopSession(){stopTimer();releaseAwake();_speakSeq++;try{speechSynthesis.cancel();}catch(e){}}
function stopTimer(){if(S.interval){clearInterval(S.interval);S.interval=null;}}
function beginAll(){keepAwake();startPrep();}
function voiceOn(){return __allow('voice')&&!!window.speechSynthesis;}
// La primera vez se explica entero; en la 2.ª ronda basta el nombre y la clave
function exText(ex,first){
  const durTxt=ex.sides===2?t('v_sec_side',{n:ex.duration}):t('v_sec',{n:ex.duration});
  if(ex.repeat)return t('v_next')+ex.name+'. '+ex.voice;
  return (first?t('v_first'):t('v_next'))+ex.name+'. '+ex.desc+' '+ex.voice+t('v_will_be',{dur:durTxt});
}
function goActive(ex){
  S.phase='active';S.timer=ex.duration;S.total=ex.duration;
  figReset();beep(800,.15);vibrate(60);
}
function startPrep(){
  const ex=exList()[S.exIdx];
  S.phase='prep';S.side=1;
  vibrate(50);
  if(ex.round===2&&ex.slot===1)speak(t('v_round2'));
  if(!voiceOn()){S.timer=ex.repeat?5:8;S.total=S.timer;renderSession();S.interval=setInterval(sessionTick,1000);return;}
  S.timer=3;S.total=3;
  renderSession();
  speakThen(exText(ex,S.exIdx===0),()=>{
    if(S.phase!=='prep'||S.interval)return;
    S.interval=setInterval(sessionTick,1000);
  });
}
function advanceExDirect(){
  stopTimer();
  const L=exList();
  S.exIdx++;S.side=1;S.pausedPhase=null;
  if(S.exIdx>=L.length){S.phase='done';releaseAwake();renderSession();return;}
  if(!voiceOn()){startPrep();return;}
  const ex=L[S.exIdx];
  goActive(ex);speak(t('v_go',{n:ex.duration}));
  S.interval=setInterval(sessionTick,1000);
  renderSession();
}
function sessionTick(){
  S.timer--;
  const el=document.getElementById('s-timer');
  if(el)el.textContent=S.timer;
  __ring('s-ring',S.total?S.timer/S.total:0);
  if(S.phase==='active'){
    if(S.timer===Math.floor(S.total/2)&&S.total>=40)speak(t('v_half',{n:S.timer}));
    else if(S.timer===10&&S.total>=25)speak(t('v_last10'));
  }
  if(S.timer<=3&&S.timer>0&&(S.phase==='active'||S.phase==='prep'||S.phase==='rest'))beep(500,.08);
  if(S.timer>0)return;
  stopTimer();
  const L=exList(),ex=L[S.exIdx];
  if(S.phase==='prep'){
    goActive(ex);speak(t('v_go',{n:ex.duration}));
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='active'&&ex.sides===2&&S.side===1){
    S.side=2;S.phase='switch';S.timer=5;S.total=5;
    speak(t('v_switch',{n:ex.duration}));vibrate(60);
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='switch'){
    goActive(ex);
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='active'&&ex.rest>0&&S.exIdx<L.length-1){
    S.phase='rest';S.timer=ex.rest;S.total=ex.rest;
    beep(600,.15);vibrate(60);
    if(voiceOn()){
      S.nextReady=false;
      const nx=L[S.exIdx+1];
      const pre=(nx.round===2&&nx.slot===1)?t('v_round2')+' ':'';
      speakThen(t('v_rest',{n:ex.rest})+pre+exText(nx,false),()=>{
        S.nextReady=true;
        if(S.phase==='restwait')advanceExDirect();
      });
    }else{S.nextReady=true;}
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='rest'){
    if(voiceOn()&&!S.nextReady){S.phase='restwait';renderSession();return;}
    if(voiceOn()){advanceExDirect();}else{advanceEx();}
    return;
  }else{
    advanceEx();return;
  }
  renderSession();
}
function togglePlay(){
  if(S.phase==='paused'){
    if(S.pausedPhase==='restwait'){S.pausedPhase=null;advanceExDirect();return;}
    S.phase=S.pausedPhase||'active';S.pausedPhase=null;
    S.interval=setInterval(sessionTick,1000);
    figPause(false);keepAwake();speak(t('v_resume'));
  }else if(['prep','active','switch','rest','restwait'].includes(S.phase)){
    S.pausedPhase=S.phase;stopTimer();S.phase='paused';figPause(true);
    try{speechSynthesis.cancel();}catch(e){}
  }
  renderSession();
}
function skipPhase(){
  stopTimer();
  try{speechSynthesis.cancel();}catch(e){}
  const L=exList(),ex=L[S.exIdx];
  const ph=S.phase==='paused'?(S.pausedPhase||'active'):S.phase;
  S.pausedPhase=null;figPause(false);
  if(ph==='prep'||ph==='switch'){
    goActive(ex);S.interval=setInterval(sessionTick,1000);renderSession();
  }else if(ph==='active'&&ex.sides===2&&S.side===1){
    S.side=2;S.phase='switch';S.timer=5;S.total=5;
    S.interval=setInterval(sessionTick,1000);renderSession();
  }else if((ph==='rest'||ph==='restwait')&&voiceOn()){
    advanceExDirect();
  }else{
    advanceEx();
  }
}
function advanceEx(){
  stopTimer();
  const L=exList();
  S.exIdx++;S.side=1;S.pausedPhase=null;
  if(S.exIdx>=L.length){S.phase='done';releaseAwake();renderSession();}
  else startPrep();
}
function secLabel(ex){
  if(ex.sec==='main')return t('round',{r:ex.round,n:ex.rounds})+' · '+t('count',{i:ex.slot,n:ex.slots});
  return {warm:t('sec_warm'),cool:t('sec_cool'),st:t('sec_st')}[ex.sec];
}
function renderSession(){
  const d=CUR,L=d.items,total=L.length,el=document.getElementById('s-content');
  if(S.phase==='done'){
    try{localStorage.setItem('cris_hiit_v1_'+dayKey(),'1');}catch(e){}
    const log=lsGet('cris_calis_log',{});log[dayKey()]=d.stretch?'st':getLevel();lsSet('cris_calis_log',log);
    document.getElementById('s-fill').style.width='100%';
    document.getElementById('s-count').textContent='';
    el.innerHTML=`<div class="done-box"><div class="big">🎉</div><h2>${t('done_h')}</h2><p>${t('done_p',{name:d.name,focus:d.focus,u:__uname()})}</p></div><button class="btn btn-secondary" style="margin-bottom:8px" onclick="initHome();go('home')">${t('btn_home')}</button><button class="btn btn-primary" onclick="startSession()">${t('btn_repeat')}</button>`;
    beep(800,.2);setTimeout(()=>beep(1000,.3),250);vibrate([80,50,80]);
    speak(t('v_done'));
    return;
  }
  const ex=L[S.exIdx];
  document.getElementById('s-fill').style.width=(S.exIdx/total*100)+'%';
  document.getElementById('s-count').textContent=secLabel(ex);
  if(S.phase==='idle'){
    el.innerHTML=`
      ${getAnim(ex.anim,{big:true,tag:t('tag_first')})}
      <div class="s-box">
        <div class="s-phase">${t('idle_phase')}</div>
        <div class="s-exname">${d.focus}</div>
        <div class="s-desc">${t('idle_desc')}</div>
      </div>
      <button class="btn btn-primary" onclick="beginAll()">${t('idle_btn')}</button>`;
    figReset();return;
  }
  const isRest=S.phase==='rest'||S.phase==='restwait';
  const nextEx=S.exIdx<total-1?L[S.exIdx+1]:null;
  const showEx=(isRest&&nextEx)?nextEx:ex;
  const mirror=ex.sides===2&&S.side===2&&!isRest;
  const sideLabel=ex.sides===2&&!isRest?(S.side===1?t('side_r'):t('side_l')):'';
  let phaseLabel='',timerCls='',timerLbl='',animTag='';
  if(S.phase==='prep'){phaseLabel=t('ph_prep');timerLbl=t('tl_prep');animTag=t('tag_prep');}
  else if(S.phase==='active'){phaseLabel=t('ph_active');timerLbl=t('tl_active');animTag=t('tag_follow');}
  else if(S.phase==='paused'){phaseLabel=t('ph_paused');timerLbl=t('tl_paused');animTag=t('tag_paused');}
  else if(S.phase==='switch'){phaseLabel=t('ph_switch');timerCls=' sw-c';timerLbl=t('tl_switch');}
  else if(S.phase==='restwait'){phaseLabel=t('ph_restwait');timerCls=' rest-c';timerLbl=t('tl_restwait');animTag=nextEx?t('tag_next',{name:nextEx.name}):'';}
  else if(isRest){phaseLabel=t('ph_rest');timerCls=' rest-c';timerLbl=t('tl_rest');animTag=nextEx?t('tag_next',{name:nextEx.name}):'';}
  const showDesc=S.phase==='prep'||S.phase==='paused';
  el.innerHTML=`
    <div class="fig-holder">${getAnim(showEx.anim,{big:true,tag:animTag,mirror})}<button class="tech-btn" onclick="openTech('${showEx.id}')">📐 ${t('tech_btn')}</button></div>
    <div class="s-box s-row">
      <div class="tring small" id="s-ring"><div class="tring-in"><div class="s-timer${timerCls}" id="s-timer">${S.timer}</div><div class="s-tlbl">${timerLbl}</div></div></div>
      <div class="s-info">
        <div class="s-phase">${phaseLabel}</div>
        <div class="s-exname">${isRest&&nextEx?t('next_prefix',{name:nextEx.name}):ex.name+sideLabel}</div>
        ${showDesc?`<div class="s-desc">${ex.desc}</div>`:''}
      </div>
    </div>
    ${showDesc?`<div class="s-tip">💡 ${ex.tip}</div>`:''}
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="togglePlay()">${S.phase==='paused'?t('btn_resume'):t('btn_pause')}</button>
      <button class="btn btn-primary" onclick="skipPhase()">${t('btn_skip')}</button>
    </div>`;
  __ring('s-ring',S.total?S.timer/S.total:0);
}

/* Atrás del móvil: el padre llama __crisBack() (síncrono); true = retrocedió.
   Sesión en marcha: el primer atrás PAUSA; el segundo, ya en pausa, sale al listado. */
window.__crisBack=function(){
  if(document.getElementById('tech-ov').classList.contains('show')){closeTech();return true;}
  var ses=document.querySelector('#v-session.active');
  if(ses&&['prep','active','switch','rest','restwait'].includes(S.phase)){togglePlay();return true;}
  var el=document.querySelector('.screen.active .back-btn');
  if(el){el.click();return true;}
  return false;
};
window.addEventListener('message',function(e){
  if(e&&e.data==='cris:back'&&window.__crisBack&&window.__crisBack()){
    try{parent.postMessage('cris:back-ok','*');}catch(_){}
  }
});
