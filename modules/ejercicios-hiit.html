os y las rodillas bajo la cadera. Apoya las puntas de los pies. Espalda plana y mirada al suelo.","exe":"1. Empuja el suelo con las manos y aprieta la barriga · 2. Despega las rodillas 2 cm en 1 s · 3. Aguanta el tiempo indicado sin mover la espalda · 4. Apoya las rodillas con control","resp":"Respira sin parar, llevando el aire a las costillas. No sueltes la barriga.","err":"Cadera alta: rodillas solo a 2 cm del suelo · Hombros hundidos: empuja el suelo y separa los omóplatos · Espalda redonda o arqueada: mantenla plana como una mesa","mus":"Barriga (transverso y recto abdominal), muslo delantero (cuádriceps), hombro delantero (deltoides), costado (serrato)"},"en":{"d":"On all fours, you lift your knees 2 cm and hold still. It works your tummy, shoulders and thighs.","v":"Knees hovering, flat back, push the floor away.","pos":"Get on all fours, hands under your shoulders and knees under your hips. Rest on the balls of your feet. Flat back, eyes on the floor.","exe":"1. Push the floor away and tighten your tummy · 2. Lift your knees 2 cm in 1 s · 3. Hold for the set time, back still · 4. Lower your knees with control","resp":"Keep breathing into your ribs. Keep your tummy tight.","err":"Hips too high: knees only 2 cm off the floor · Sinking shoulders: push the floor and spread your shoulder blades · Rounded or arched back: keep it flat like a table","mus":"Tummy (transverse and rectus abdominis), front of thigh (quadriceps), front of shoulder (deltoid), side of ribs (serratus)"},"fr":{"d":"À quatre pattes, tu décolles les genoux de 2 cm et tu restes immobile. Ça travaille le ventre, les épaules et les cuisses.","v":"Genoux décollés, dos plat, repousse le sol.","pos":"Mets-toi à quatre pattes, mains sous les épaules et genoux sous les hanches. Appuie-toi sur la pointe des pieds. Dos plat, regard au sol.","exe":"1. Repousse le sol et serre le ventre · 2. Décolle les genoux de 2 cm en 1 s · 3. Tiens le temps indiqué sans bouger le dos · 4. Repose les genoux en contrôlant","resp":"Respire sans t’arrêter, vers les côtes. Garde le ventre serré.","err":"Hanches trop hautes : genoux à 2 cm du sol seulement · Épaules affaissées : repousse le sol, écarte les omoplates · Dos rond ou cambré : garde-le plat comme une table","mus":"Ventre (transverse et grand droit), avant de cuisse (quadriceps), avant d’épaule (deltoïde), côtes (dentelé)"}},"beartap":{"es":{"d":"En posición de oso, tocas el hombro contrario con una mano. Tu tronco trabaja para que la cadera no gire.","v":"Rodillas flotando, toca el hombro, cadera quieta.","pos":"Ponte en posición de oso, con las rodillas a 2 cm del suelo. Manos bajo los hombros y rodillas bajo la cadera. Pies algo más abiertos que la cadera y espalda plana.","exe":"1. Aprieta barriga y glúteos y empuja el suelo · 2. Lleva una mano al hombro contrario en 1 s · 3. Vuelve a apoyarla en 1 s · 4. Cambia de mano sin girar la cadera","resp":"Suelta el aire en cada toque. Coge aire al apoyar la mano.","err":"Mover la cadera de lado a lado: abre más los pies y ve más lenta · Subir la cadera: rodillas a 2 cm · Hundir el hombro de apoyo: empuja fuerte el suelo","mus":"Costados (oblicuos, serrato), barriga profunda (transverso), hombros (deltoides), muslo delantero (cuádriceps)"},"en":{"d":"In the bear position, you tap the opposite shoulder with one hand. Your trunk works to stop your hips turning.","v":"Knees hovering, tap the shoulder, hips still.","pos":"Get into the bear position, knees 2 cm off the floor. Hands under shoulders, knees under hips. Feet a bit wider than hips, flat back.","exe":"1. Tighten tummy and glutes, push the floor away · 2. Bring one hand to the opposite shoulder in 1 s · 3. Put it back down in 1 s · 4. Switch hands without turning your hips","resp":"Breathe out on each tap. Breathe in as the hand goes down.","err":"Hips swaying side to side: widen your feet and slow down · Hips rising: keep knees 2 cm up · Sinking into the support shoulder: push the floor hard","mus":"Sides (obliques, serratus), deep tummy (transversus), shoulders (deltoids), front of thigh (quadriceps)"},"fr":{"d":"En position de l’ours, tu touches l’épaule opposée avec une main. Ton tronc travaille pour que le bassin ne tourne pas.","v":"Genoux décollés, touche l’épaule, bassin immobile.","pos":"Mets-toi en position de l’ours, genoux à 2 cm du sol. Mains sous les épaules, genoux sous les hanches. Pieds un peu plus écartés que le bassin, dos plat.","exe":"1. Serre ventre et fessiers, repousse le sol · 2. Porte une main à l’épaule opposée en 1 s · 3. Repose-la en 1 s · 4. Change de main sans tourner le bassin","resp":"Expire à chaque touche. Inspire en reposant la main.","err":"Bassin qui bascule : écarte les pieds et ralentis · Hanches qui montent : genoux à 2 cm · Épaule d’appui affaissée : repousse fort le sol","mus":"Côtés (obliques, dentelé), ventre profond (transverse), épaules (deltoïdes), avant de cuisse (quadriceps)"}},"swimming_fast":{"es":{"d":"Tumbada boca abajo, mueves brazo y pierna contrarios rápido, como nadando. Mantén siempre la misma altura.","v":"Ritmo vivo, altura constante, mirada al suelo.","pos":"Túmbate boca abajo con brazos y piernas estirados. Despega un poco el pecho y las piernas. Mirada al suelo y glúteos apretados.","exe":"1. Sube un poco pecho, brazos y piernas · 2. Alterna brazo y pierna contrarios con movimientos cortos y rápidos · 3. Haz unos 2 cambios por segundo · 4. Mantén la misma altura hasta el final","resp":"Respira con el ritmo. Coge aire en 4 cambios y suéltalo en otros 4.","err":"Perder altura: haz movimientos más cortos antes de bajar · Levantar la cabeza: mira al suelo · Aguantar el aire: respira con el ritmo","mus":"Espalda (erectores), glúteo (glúteo mayor), muslo trasero (isquiotibiales), hombro trasero (deltoides), espalda alta (trapecio)"},"en":{"d":"Lying face down, you move the opposite arm and leg quickly, like swimming. Keep the same height the whole time.","v":"Quick pace, steady height, eyes on the floor.","pos":"Lie face down with arms and legs long. Lift your chest and legs slightly off the floor. Eyes down, glutes tight.","exe":"1. Lift your chest, arms and legs slightly · 2. Alternate opposite arm and leg in short, quick moves · 3. Do about 2 switches per second · 4. Keep the same height until the end","resp":"Breathe with the rhythm. Breathe in for 4 switches, out for 4.","err":"Losing height: make the moves shorter before you drop · Lifting the head: look at the floor · Holding your breath: breathe with the rhythm","mus":"Back (erector spinae), buttocks (gluteus maximus), back of thigh (hamstrings), back of shoulder (deltoid), upper back (trapezius)"},"fr":{"d":"Allongée sur le ventre, tu bouges vite bras et jambe opposés, comme en nageant. Garde toujours la même hauteur.","v":"Rythme vif, hauteur constante, regard au sol.","pos":"Allonge-toi sur le ventre, bras et jambes tendus. Décolle un peu le buste et les jambes. Regard au sol, fessiers serrés.","exe":"1. Décolle un peu buste, bras et jambes · 2. Alterne bras et jambe opposés en battements courts et rapides · 3. Fais environ 2 battements par seconde · 4. Garde la même hauteur jusqu’à la fin","resp":"Respire en rythme. Inspire sur 4 battements, expire sur 4.","err":"Perdre la hauteur : fais des battements plus courts avant de retomber · Relever la tête : regarde le sol · Bloquer l’air : respire avec le rythme","mus":"Dos (érecteurs), fesses (grand fessier), arrière de cuisse (ischio-jambiers), arrière d’épaule (deltoïde), haut du dos (trapèze)"}},"climber_slow":{"es":{"d":"Desde plancha alta (brazos estirados y cuerpo recto), llevas una rodilla al pecho despacio. La cadera no gira.","v":"Rodilla al pecho lenta, hombros sobre las manos.","pos":"Ponte en plancha alta, con las manos bajo los hombros. Cuerpo recto de cabeza a talones. Pies separados como la cadera, barriga y glúteos apretados.","exe":"1. Lleva una rodilla hacia el pecho en 2 s · 2. Pausa corta, con la cadera quieta · 3. Devuelve el pie atrás en 2 s · 4. Cambia de pierna","resp":"Suelta el aire al llevar la rodilla al pecho. Coge aire al volver.","err":"Hombros detrás de las manos: ponlos encima de las muñecas · Cadera alta o hundida: cuerpo en línea, glúteos apretados · Girar la cadera: ve más lenta","mus":"Barriga (recto y transverso abdominal), flexor de la cadera (psoas ilíaco), hombro delantero (deltoides), costado (serrato)"},"en":{"d":"From a high plank (arms straight, body in a line), you bring one knee to your chest slowly. Your hips do not turn.","v":"Knee to chest slowly, shoulders over hands.","pos":"Get into a high plank, hands under your shoulders. Body straight from head to heels. Feet hip-width apart, tummy and glutes tight.","exe":"1. Bring one knee toward your chest in 2 s · 2. Short pause, hips still · 3. Take the foot back in 2 s · 4. Switch legs","resp":"Breathe out as the knee comes in. Breathe in as it goes back.","err":"Shoulders behind your hands: stack them over your wrists · Hips too high or sagging: body in a line, glutes tight · Turning the hips: slow down","mus":"Tummy (rectus and transverse abdominis), hip flexor (iliopsoas), front of shoulder (deltoid), side of ribs (serratus)"},"fr":{"d":"En planche haute (bras tendus, corps aligné), tu amènes un genou à la poitrine lentement. Le bassin ne tourne pas.","v":"Genou à la poitrine lentement, épaules sur les mains.","pos":"Mets-toi en planche haute, mains sous les épaules. Corps droit de la tête aux talons. Pieds écartés comme ton bassin, ventre et fessiers serrés.","exe":"1. Amène un genou vers la poitrine en 2 s · 2. Courte pause, bassin immobile · 3. Ramène le pied en arrière en 2 s · 4. Change de jambe","resp":"Expire en amenant le genou. Inspire en revenant.","err":"Épaules en arrière des mains : place-les au-dessus des poignets · Bassin trop haut ou creusé : corps aligné, fessiers serrés · Bassin qui tourne : ralentis","mus":"Ventre (grand droit et transverse), fléchisseur de hanche (ilio-psoas), avant d’épaule (deltoïde), côtes (dentelé)"}},"climber":{"es":{"d":"Desde plancha alta (brazos estirados y cuerpo recto), cambias de rodilla al pecho con ritmo vivo. Cadera baja y en línea.","v":"Rodillas al pecho, ritmo vivo, cadera baja.","pos":"Ponte en plancha alta, con las manos bajo los hombros. Cuerpo recto de cabeza a talones. Pies separados como la cadera, barriga y glúteos apretados.","exe":"1. Lleva una rodilla al pecho · 2. Cámbiala por la otra con un paso ágil, en puntas · 3. Mantén unos 2 cambios por segundo · 4. No rebotes con la cadera","resp":"Respira con ritmo. Suelta el aire cada 2 cambios, sin aguantarlo.","err":"Cadera arriba: bájala en línea con los hombros · Hombros atrasados: ponlos encima de las muñecas · Rebotar: pasos más cortos y ligeros","mus":"Barriga (recto y transverso abdominal), flexor de la cadera (psoas ilíaco), muslo delantero (cuádriceps), hombro (deltoides)"},"en":{"d":"From a high plank (arms straight, body in a line), you switch knees to chest at a quick pace. Hips low and in line.","v":"Knees to chest, quick pace, hips low.","pos":"Get into a high plank, hands under your shoulders. Body straight from head to heels. Feet hip-width apart, tummy and glutes tight.","exe":"1. Drive one knee to your chest · 2. Switch legs with a light step, on the ball of the foot · 3. Keep about 2 switches per second · 4. Do not bounce your hips","resp":"Breathe with the rhythm. Breathe out every 2 switches, never hold it.","err":"Hips up: lower them in line with your shoulders · Shoulders behind: stack them over your wrists · Bouncing: take shorter, lighter steps","mus":"Tummy (rectus and transverse abdominis), hip flexor (iliopsoas), front of thigh (quadriceps), shoulder (deltoid)"},"fr":{"d":"En planche haute (bras tendus, corps aligné), tu alternes les genoux à la poitrine à rythme vif. Bassin bas et aligné.","v":"Genoux à la poitrine, rythme vif, bassin bas.","pos":"Mets-toi en planche haute, mains sous les épaules. Corps droit de la tête aux talons. Pieds écartés comme ton bassin, ventre et fessiers serrés.","exe":"1. Amène un genou à la poitrine · 2. Change de jambe d’un pas léger, sur la pointe du pied · 3. Garde environ 2 changements par seconde · 4. Ne fais pas rebondir le bassin","resp":"Respire en rythme. Expire tous les 2 changements, sans bloquer l’air.","err":"Bassin trop haut : aligne-le avec les épaules · Épaules en arrière : place-les au-dessus des poignets · Rebonds : fais des pas plus courts et légers","mus":"Ventre (grand droit et transverse), fléchisseur de hanche (ilio-psoas), avant de cuisse (quadriceps), épaule (deltoïde)"}},"burpee_step":{"es":{"d":"Un burpee sin saltos. Bajas, vas a plancha paso a paso, vuelves y te pones de pie. Mueve todo el cuerpo sin impacto.","v":"Manos al suelo, pie atrás, pie atrás, vuelve y arriba.","pos":"De pie, con los pies separados como la cadera. Brazos relajados, espalda recta y barriga un poco apretada.","exe":"1. Dobla cadera y rodillas y apoya las manos bajo los hombros · 2. Lleva un pie atrás y luego el otro, hasta la plancha · 3. Vuelve paso a paso, pies cerca de las manos · 4. Ponte de pie estirando la cadera","resp":"Suelta el aire al ir a plancha y al subir. Coge aire en los cambios.","err":"Cadera hundida en la plancha: aprieta glúteos y barriga · Espalda redonda al agacharte: dobla más las rodillas · Ir con prisa: controla cada paso","mus":"Muslo delantero (cuádriceps), glúteo (glúteo mayor), barriga (recto abdominal), hombro (deltoides), pecho (pectoral)"},"en":{"d":"A burpee with no jumps. You go down, step back to a plank, step in and stand up. Full body, no impact.","v":"Hands down, step back, step back, return and stand.","pos":"Stand with your feet hip-width apart. Arms relaxed, back tall and tummy lightly tight.","exe":"1. Bend your hips and knees, hands under your shoulders · 2. Step one foot back, then the other, into a plank · 3. Step back in, feet near your hands · 4. Stand up by straightening your hips","resp":"Breathe out as you step into plank and as you stand. Breathe in between.","err":"Sagging hips in plank: tighten glutes and tummy · Rounding your back as you squat: bend your knees more · Rushing: control each step","mus":"Front of thigh (quadriceps), buttocks (gluteus maximus), tummy (rectus abdominis), shoulder (deltoid), chest (pectoral)"},"fr":{"d":"Un burpee sans saut. Tu descends, tu passes en planche pas à pas, tu reviens et tu te relèves. Tout le corps, sans impact.","v":"Mains au sol, pied en arrière, l’autre, reviens et debout.","pos":"Debout, pieds écartés comme ton bassin. Bras relâchés, dos droit et ventre un peu serré.","exe":"1. Plie hanches et genoux, mains sous les épaules · 2. Recule un pied puis l’autre, jusqu’en planche · 3. Reviens pas à pas, pieds près des mains · 4. Relève-toi en tendant les hanches","resp":"Expire en passant en planche et en te relevant. Inspire entre les deux.","err":"Bassin creusé en planche : serre fessiers et ventre · Dos rond en t’accroupissant : plie plus les genoux · Aller trop vite : contrôle chaque pas","mus":"Avant de cuisse (quadriceps), fesses (grand fessier), ventre (grand droit), épaule (deltoïde), poitrine (pectoral)"}},"burpee":{"es":{"d":"Burpee completo, con saltos. Bajas, saltas a plancha, vuelves y saltas hacia arriba. Aterriza siempre suave.","v":"Abajo, plancha, pies a las manos, salta y aterriza suave.","pos":"De pie, con los pies separados como la cadera. Brazos relajados, espalda recta y barriga un poco apretada.","exe":"1. Agáchate y apoya las manos bajo los hombros · 2. Salta atrás a plancha, con la cadera en línea · 3. Salta con los pies junto a las manos · 4. Salta, brazos arriba, y aterriza en puntas con rodillas dobladas","resp":"Suelta el aire al saltar a plancha y al saltar arriba. Coge aire al agacharte.","err":"Aterrizar rígida: amortigua doblando rodillas y cadera · Cadera hundida en la plancha: aprieta barriga y glúteos · Perder la técnica por cansancio: quita el salto final","mus":"Muslo delantero (cuádriceps), glúteo (glúteo mayor), gemelos, barriga (recto abdominal), hombro (deltoides), pecho (pectoral)"},"en":{"d":"A full burpee with jumps. You go down, jump to a plank, jump back in and jump up. Always land softly.","v":"Down, plank, feet to hands, jump and land softly.","pos":"Stand with your feet hip-width apart. Arms relaxed, back tall and tummy lightly tight.","exe":"1. Squat and place your hands under your shoulders · 2. Jump back to a plank, hips in line · 3. Jump your feet next to your hands · 4. Jump up, arms high, land on your toes, knees bent","resp":"Breathe out as you jump to plank and as you jump up. Breathe in as you squat.","err":"Landing stiff: soften with your knees and hips · Sagging hips in plank: tighten tummy and glutes · Form slipping when tired: skip the final jump","mus":"Front of thigh (quadriceps), buttocks (gluteus maximus), calves, tummy (rectus abdominis), shoulder (deltoid), chest (pectoral)"},"fr":{"d":"Un burpee complet, avec sauts. Tu descends, tu sautes en planche, tu reviens et tu sautes en l’air. Atterris toujours en douceur.","v":"En bas, planche, pieds aux mains, saute et atterris en douceur.","pos":"Debout, pieds écartés comme ton bassin. Bras relâchés, dos droit et ventre un peu serré.","exe":"1. Accroupis-toi, mains sous les épaules · 2. Saute en arrière en planche, bassin aligné · 3. Ramène les pieds près des mains d’un saut · 4. Saute bras en haut, atterris sur l’avant des pieds, genoux fléchis","resp":"Expire en sautant en planche et en sautant en l’air. Inspire en t’accroupissant.","err":"Réception raide : amortis avec genoux et hanches · Bassin creusé en planche : serre ventre et fessiers · Technique qui se dégrade : supprime le saut final","mus":"Avant de cuisse (quadriceps), fesses (grand fessier), mollets, ventre (grand droit), épaule (deltoïde), poitrine (pectoral)"}},"proneW":{"es":{"d":"Tumbada boca abajo, juntas los omóplatos y despegas un poco pecho y brazos. Fortalece la espalda alta y mejora la postura.","v":"Brazos atrás, junta los omóplatos, mira al suelo.","pos":"Tumbada boca abajo, frente cerca del suelo. Brazos estirados junto al cuerpo, palmas hacia el suelo. Piernas relajadas.","exe":"1. Baja los hombros lejos de las orejas · 2. Junta los omóplatos y despega pecho y brazos en 1 s · 3. Aguanta 1 s con los brazos estirados hacia los pies · 4. Baja en 2 s","resp":"Suelta el aire al subir. Coge aire al bajar.","err":"Subir con la zona lumbar: sube poco, el trabajo está arriba · Encoger los hombros: bájalos · Mirar al frente: mira al suelo","mus":"Espalda alta (trapecio medio e inferior, romboides), hombro trasero (deltoides), espalda (erectores)"},"en":{"d":"Lying face down, you squeeze your shoulder blades and lift your chest and arms a little. It strengthens your upper back and improves posture.","v":"Arms back, squeeze your shoulder blades, look at the floor.","pos":"Lying face down, forehead near the floor. Arms straight by your sides, palms down. Legs relaxed.","exe":"1. Draw your shoulders away from your ears · 2. Squeeze your shoulder blades and lift chest and arms in 1 s · 3. Hold 1 s with arms reaching toward your feet · 4. Lower in 2 s","resp":"Breathe out going up. Breathe in coming down.","err":"Lifting with your lower back: lift only a little, the work is higher up · Shrugging: drop your shoulders · Looking ahead: look at the floor","mus":"Upper back (middle and lower trapezius, rhomboids), rear shoulder (deltoid), back (erectors)"},"fr":{"d":"Allongée sur le ventre, tu serres les omoplates et décolles un peu la poitrine et les bras. Ça renforce le haut du dos et améliore la posture.","v":"Bras en arrière, serre les omoplates, regard au sol.","pos":"Allongée sur le ventre, front près du sol. Bras tendus le long du corps, paumes vers le sol. Jambes détendues.","exe":"1. Éloigne les épaules des oreilles · 2. Serre les omoplates et décolle poitrine et bras en 1 s · 3. Tiens 1 s, bras tendus vers les pieds · 4. Redescends en 2 s","resp":"Expire en montant. Inspire en descendant.","err":"Monter avec le bas du dos : monte peu, le travail est plus haut · Hausser les épaules : baisse-les · Regarder devant : regarde le sol","mus":"Haut du dos (trapèze moyen et inférieur, rhomboïdes), arrière de l’épaule (deltoïde), dos (érecteurs)"}},"childpose":{"es":{"d":"Postura de descanso de rodillas. Estira la espalda y la cadera mientras respiras hacia la espalda.","v":"Glúteos a los talones, frente al suelo, respira hacia la espalda.","pos":"De rodillas en la esterilla, dedos gordos de los pies juntos. Rodillas separadas como tu cadera o más. Siéntate sobre los talones.","exe":"1. Desliza las manos adelante hasta estirar los brazos · 2. Apoya la frente en la esterilla · 3. Deja caer los glúteos hacia los talones · 4. Suelta hombros y cuello, y quédate así","resp":"Al coger aire, nota cómo se abre la espalda. Suéltalo despacio y hunde un poco más.","err":"Glúteos lejos de los talones: abre más las rodillas · Hombros subidos a las orejas: bájalos hacia la cadera · Aguantar el aire: suéltalo lento y largo","mus":"Espalda (erector de la columna), costado (dorsal ancho), glúteo (glúteo mayor), zona lumbar (cuadrado lumbar)"},"en":{"d":"A resting pose on your knees. It stretches your back and hips while you breathe into your back.","v":"Hips to heels, forehead down, breathe into your back.","pos":"Kneel on the mat, big toes together. Knees hip-width apart or wider. Sit back on your heels.","exe":"1. Walk your hands forward until your arms are long · 2. Rest your forehead on the mat · 3. Let your hips sink toward your heels · 4. Relax your shoulders and neck, and stay","resp":"As you breathe in, feel your back widen. Breathe out slowly and sink a little.","err":"Hips far from heels: widen your knees · Shoulders up by your ears: let them slide toward your hips · Holding your breath: breathe out long and slow","mus":"Back (erector spinae), side of the back (lats), bottom (gluteus maximus), lower back (quadratus lumborum)"},"fr":{"d":"Posture de repos à genoux. Elle étire le dos et les hanches pendant que tu respires dans le dos.","v":"Fessiers vers les talons, front au sol, respire dans le dos.","pos":"À genoux sur le tapis, gros orteils joints. Genoux écartés à largeur de hanches ou plus. Assieds-toi sur les talons.","exe":"1. Avance les mains jusqu’à tendre les bras · 2. Pose le front sur le tapis · 3. Laisse les fessiers descendre vers les talons · 4. Relâche épaules et nuque, et reste là","resp":"En inspirant, sens ton dos s’ouvrir. Expire lentement et descends un peu plus.","err":"Fessiers loin des talons : écarte davantage les genoux · Épaules vers les oreilles : relâche-les vers les hanches · Bloquer l’air : expire lentement et longtemps","mus":"Dos (érecteurs du rachis), côté du dos (grand dorsal), fessier (grand fessier), bas du dos (carré des lombes)"}},"childreach":{"es":{"d":"Vaivén lento entre cuatro patas y la postura del niño. Suelta la cadera y la espalda.","v":"Cadera atrás al soltar aire, vuelve a cuatro patas al cogerlo.","pos":"A cuatro patas. Manos debajo de los hombros y rodillas debajo de la cadera. Espalda recta y mirada al suelo.","exe":"1. Suelta aire y lleva la cadera a los talones · 2. Para 1 o 2 s con los brazos estirados · 3. Coge aire y vuelve despacio a cuatro patas · 4. Repite con calma","resp":"Suelta aire al ir atrás. Cógelo al volver, sin prisa.","err":"Ir rápido o con rebote: muévete lento y controlado · Hundir la zona lumbar al volver: mantén la espalda recta · Forzar: para al notar tirantez suave, nunca dolor","mus":"Glúteo (glúteo mayor), espalda (erector de la columna), costado (dorsal ancho), parte delantera del muslo (cuádriceps)"},"en":{"d":"A slow rock between all fours and child’s pose. It loosens your hips and back.","v":"Hips back as you breathe out, return as you breathe in.","pos":"On all fours. Hands under your shoulders, knees under your hips. Back straight, eyes on the floor.","exe":"1. Breathe out and send your hips to your heels · 2. Pause 1 or 2 s with arms long · 3. Breathe in and slowly return to all fours · 4. Repeat calmly","resp":"Breathe out as you go back. Breathe in as you return, no rush.","err":"Moving fast or bouncing: go slow and controlled · Lower back sagging on the way back: keep your back straight · Forcing it: stop at a gentle pull, never pain","mus":"Bottom (gluteus maximus), back (erector spinae), side of the back (lats), front of thigh (quadriceps)"},"fr":{"d":"Va-et-vient lent entre quatre pattes et la posture de l’enfant. Il assouplit les hanches et le dos.","v":"Hanches en arrière en expirant, reviens en inspirant.","pos":"À quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, regard vers le sol.","exe":"1. Expire et recule les hanches vers les talons · 2. Pause 1 ou 2 s, bras allongés · 3. Inspire et reviens lentement à quatre pattes · 4. Répète calmement","resp":"Expire en reculant. Inspire en revenant, sans te presser.","err":"Aller vite ou rebondir : reste lente et contrôlée · Creuser le bas du dos au retour : garde le dos droit · Forcer : arrête-toi à une tension douce, jamais de douleur","mus":"Fessier (grand fessier), dos (érecteurs du rachis), côté du dos (grand dorsal), avant de la cuisse (quadriceps)"}},"thread":{"es":{"d":"Giro suave desde cuatro patas. Abre la parte alta de la espalda y la zona de los omóplatos.","v":"Brazo por debajo, hombro y sien al suelo, respira.","pos":"A cuatro patas. Manos debajo de los hombros y rodillas debajo de la cadera. Espalda recta y cadera quieta.","exe":"1. Pasa un brazo por debajo del cuerpo, palma arriba · 2. Baja hasta apoyar hombro y sien en la esterilla · 3. Deja la cadera encima de las rodillas y quédate así · 4. Vuelve y cambia de lado","resp":"Coge aire quieta. Al soltarlo largo, deja que la espalda gire un poco más.","err":"Cadera que se va a un lado: mantenla sobre las rodillas · Peso en el cuello: apóyate en el hombro y suelta la cabeza · Aguantar el aire: respira sin parar","mus":"Entre los omóplatos (romboides y trapecio medio), hombro de atrás (deltoides posterior), espalda alta (rotadores)"},"en":{"d":"A gentle twist from all fours. It opens your upper back and the area around your shoulder blades.","v":"Arm underneath, shoulder and temple to the mat, breathe.","pos":"On all fours. Hands under your shoulders, knees under your hips. Back straight, hips still.","exe":"1. Slide one arm under your body, palm up · 2. Lower until shoulder and temple rest on the mat · 3. Keep your hips over your knees and stay · 4. Come back and switch sides","resp":"Breathe in while still. As you breathe out long, let your upper back turn a bit more.","err":"Hips drifting sideways: keep them over your knees · Weight on your neck: rest on your shoulder, relax your head · Holding your breath: keep breathing smoothly","mus":"Between the shoulder blades (rhomboids, middle trapezius), back of shoulder (rear deltoid), upper back (rotators)"},"fr":{"d":"Torsion douce à quatre pattes. Elle ouvre le haut du dos et la zone des omoplates.","v":"Bras dessous, épaule et tempe au sol, respire.","pos":"À quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, bassin immobile.","exe":"1. Glisse un bras sous ton corps, paume vers le haut · 2. Descends jusqu’à poser épaule et tempe au tapis · 3. Garde les hanches au-dessus des genoux et reste là · 4. Reviens et change de côté","resp":"Inspire sans bouger. En expirant longuement, laisse le haut du dos tourner un peu plus.","err":"Hanches qui partent sur le côté : garde-les au-dessus des genoux · Poids sur la nuque : appuie-toi sur l’épaule, relâche la tête · Bloquer l’air : respire en continu","mus":"Entre les omoplates (rhomboïdes, trapèze moyen), arrière de l’épaule (deltoïde postérieur), haut du dos (rotateurs)"}},"sphinx":{"es":{"d":"Te apoyas en los antebrazos y subes el pecho. Estira la barriga y abre el pecho sin cargar la zona lumbar.","v":"Codos bajo los hombros, pecho adelante, hombros lejos de las orejas.","pos":"Boca abajo, piernas estiradas y separadas como tu cadera. Empeines en el suelo. Antebrazos en la esterilla, codos debajo de los hombros.","exe":"1. Empuja el suelo con los antebrazos y sube el pecho · 2. Lleva los hombros abajo y atrás · 3. Pubis en el suelo y glúteos sueltos · 4. Mira al frente con el cuello largo y quédate","resp":"Coge aire hacia la barriga. Suéltalo largo y relaja la zona lumbar.","err":"Pecho hundido entre los hombros: empuja el suelo con los antebrazos · Cabeza hacia atrás: cuello largo, mira al frente · Molestia lumbar: adelanta los codos","mus":"Barriga (recto abdominal), pecho (pectoral mayor), parte delantera de la cadera (flexores de cadera)"},"en":{"d":"You rest on your forearms and lift your chest. It stretches your tummy and opens your chest without squeezing your lower back.","v":"Elbows under shoulders, chest forward, shoulders away from ears.","pos":"Lie face down, legs long and hip-width apart. Tops of your feet on the floor. Forearms on the mat, elbows under your shoulders.","exe":"1. Press your forearms down and lift your chest · 2. Draw your shoulders down and back · 3. Pubic bone down, bottom relaxed · 4. Look ahead with a long neck and stay","resp":"Breathe into your tummy. Breathe out long and let your lower back relax.","err":"Chest sinking between the shoulders: press the floor away · Head dropping back: long neck, eyes forward · Lower back discomfort: move your elbows forward","mus":"Tummy (rectus abdominis), chest (pectoralis major), front of hip (hip flexors)"},"fr":{"d":"Tu t’appuies sur les avant-bras et tu montes la poitrine. Ça étire le ventre et ouvre la poitrine sans tasser le bas du dos.","v":"Coudes sous les épaules, poitrine en avant, épaules loin des oreilles.","pos":"Allongée sur le ventre, jambes tendues à largeur de hanches. Dessus des pieds au sol. Avant-bras sur le tapis, coudes sous les épaules.","exe":"1. Pousse le sol avec les avant-bras et monte la poitrine · 2. Descends les épaules vers l’arrière · 3. Pubis au sol, fessiers relâchés · 4. Regarde devant, nuque longue, et reste là","resp":"Inspire vers le ventre. Expire longuement et relâche le bas du dos.","err":"Poitrine affaissée entre les épaules : repousse le sol · Tête basculée en arrière : nuque longue, regard devant · Gêne dans le bas du dos : avance les coudes","mus":"Ventre (grand droit), poitrine (grand pectoral), avant de la hanche (fléchisseurs de hanche)"}},"cobra":{"es":{"d":"Subes el pecho desde boca abajo con los codos doblados. Estira la barriga y mueve la espalda alta.","v":"Empuja suave, sube el pecho, codos doblados, baja lento.","pos":"Boca abajo, piernas estiradas y separadas como tu cadera. Empeines en el suelo. Manos debajo de los hombros y codos pegados al cuerpo.","exe":"1. Coge aire y sube el pecho con la espalda · 2. Codos algo doblados y hombros abajo · 3. Pubis y cadera siguen en el suelo · 4. Suelta aire y baja despacio","resp":"Coge aire al subir. Suéltalo al bajar, lento y fluido.","err":"Codos bloqueados: mantenlos algo doblados · Cabeza hacia atrás: cuello largo, mira al frente o abajo · Dolor lumbar al subir mucho: sube menos","mus":"Barriga (recto abdominal y oblicuos), pecho (pectoral mayor), parte delantera de la cadera (flexores de cadera)"},"en":{"d":"You lift your chest from lying face down, elbows bent. It stretches your tummy and moves your upper back.","v":"Press gently, lift your chest, elbows soft, lower slowly.","pos":"Lie face down, legs long and hip-width apart. Tops of your feet down. Hands under your shoulders, elbows close to your body.","exe":"1. Breathe in and lift your chest using your back · 2. Elbows slightly bent, shoulders down · 3. Pubic bone and hips stay down · 4. Breathe out and lower slowly","resp":"Breathe in as you lift. Breathe out as you lower, slow and smooth.","err":"Locked elbows: keep them slightly bent · Head dropping back: long neck, look ahead or down · Back pain when going high: lift less","mus":"Tummy (rectus abdominis, obliques), chest (pectoralis major), front of hip (hip flexors)"},"fr":{"d":"Tu montes la poitrine depuis le ventre, coudes pliés. Ça étire le ventre et mobilise le haut du dos.","v":"Pousse doucement, monte la poitrine, coudes pliés, descends lentement.","pos":"Allongée sur le ventre, jambes tendues à largeur de hanches. Dessus des pieds au sol. Mains sous les épaules, coudes près du corps.","exe":"1. Inspire et monte la poitrine avec le dos · 2. Coudes un peu pliés, épaules basses · 3. Pubis et hanches restent au sol · 4. Expire et redescends lentement","resp":"Inspire en montant. Expire en descendant, lent et fluide.","err":"Coudes verrouillés : garde-les un peu pliés · Tête basculée en arrière : nuque longue, regard devant ou vers le bas · Douleur en montant haut : monte moins","mus":"Ventre (grand droit et obliques), poitrine (grand pectoral), avant de la hanche (fléchisseurs de hanche)"}},"figure4":{"es":{"d":"Estiramiento del glúteo tumbada boca arriba. Tu pierna forma un 4 y el glúteo se estira sin esfuerzo.","v":"Rodilla abierta, pelvis apoyada, respira hacia el glúteo.","pos":"Boca arriba, rodillas dobladas y pies en el suelo. Cruza un tobillo sobre el otro muslo, justo encima de la rodilla. Punta del pie hacia ti.","exe":"1. Sube la pierna de apoyo y sujeta detrás del muslo · 2. Acércala al pecho hasta notar tirantez suave · 3. Espalda baja y hombros en la esterilla · 4. Quédate así y cambia de lado","resp":"Suelta el aire largo. Deja que la rodilla cruzada se abra un poco más.","err":"Tirar fuerte: busca tirantez suave, nunca dolor · Levantar la espalda baja o la cabeza: déjalas apoyadas · Pie flojo que carga la rodilla: punta del pie hacia ti","mus":"Glúteo (glúteo mayor y medio), músculos profundos de la cadera (piriforme y rotadores externos)"},"en":{"d":"A glute stretch lying on your back. Your legs make a 4 shape and your bottom stretches with no effort.","v":"Knee open, pelvis down, breathe into your bottom.","pos":"Lie on your back, knees bent, feet flat. Cross one ankle over the other thigh, just above the knee. Toes pulled toward you.","exe":"1. Lift the supporting leg and hold behind the thigh · 2. Draw it to your chest until you feel a gentle pull · 3. Keep your lower back and shoulders on the mat · 4. Stay there, then switch sides","resp":"Breathe out long. Let the crossed knee open a little more.","err":"Pulling hard: look for a gentle pull, never pain · Lifting your lower back or head: keep them down · Floppy foot stressing the knee: pull your toes toward you","mus":"Bottom (gluteus maximus and medius), deep hip muscles (piriformis, external rotators)"},"fr":{"d":"Étirement du fessier allongée sur le dos. Tes jambes forment un 4 et le fessier s’étire sans effort.","v":"Genou ouvert, bassin au sol, respire dans le fessier.","pos":"Allongée sur le dos, genoux pliés, pieds au sol. Croise une cheville sur l’autre cuisse, juste au-dessus du genou. Pointe du pied vers toi.","exe":"1. Lève la jambe d’appui et tiens l’arrière de la cuisse · 2. Rapproche-la de la poitrine jusqu’à une tension douce · 3. Bas du dos et épaules au tapis · 4. Reste là, puis change de côté","resp":"Expire longuement. Laisse le genou croisé s’ouvrir un peu plus.","err":"Tirer fort : cherche une tension douce, jamais de douleur · Décoller le bas du dos ou la tête : garde-les au sol · Pied relâché qui charge le genou : pointe du pied vers toi","mus":"Fessier (grand et moyen fessier), muscles profonds de la hanche (piriforme et rotateurs externes)"}},"hamstring":{"es":{"d":"Estiramiento de la parte de atrás del muslo, tumbada boca arriba. La otra pierna se queda en el suelo.","v":"Pierna arriba, pelvis apoyada, suelta aire y relaja.","pos":"Boca arriba. Una pierna estirada, o doblada con el pie en el suelo. Sube la otra y sujétala detrás del muslo o de la pantorrilla.","exe":"1. Sube la pierna con la rodilla casi estirada · 2. Acércala hasta notar tirantez suave detrás del muslo · 3. Pelvis y zona lumbar apoyadas · 4. Quédate así y cambia de pierna","resp":"Suelta el aire largo. El músculo se relaja y cede un poquito.","err":"Rodilla bloqueada: dóblala un poco · Levantar la pelvis o la cabeza: déjalas apoyadas · Tirar a tirones: tirantez constante y suave","mus":"Parte de atrás del muslo (isquiotibiales), gemelo (gastrocnemio)"},"en":{"d":"A stretch for the back of your thigh, lying on your back. The other leg stays on the floor.","v":"Leg up, pelvis down, breathe out and let go.","pos":"Lie on your back. One leg long, or bent with the foot flat. Raise the other and hold behind the thigh or calf.","exe":"1. Lift the leg with the knee almost straight · 2. Draw it in until the back of your thigh gently pulls · 3. Pelvis and lower back stay on the mat · 4. Stay there, then switch legs","resp":"Breathe out long. The muscle relaxes and gives a little.","err":"Locked knee: bend it slightly · Lifting your pelvis or head: keep them down · Jerky pulling: keep a steady, gentle pull","mus":"Back of thigh (hamstrings), calf (gastrocnemius)"},"fr":{"d":"Étirement de l’arrière de la cuisse, allongée sur le dos. L’autre jambe reste au sol.","v":"Jambe en l’air, bassin au sol, expire et relâche.","pos":"Allongée sur le dos. Une jambe tendue, ou pliée pied au sol. Lève l’autre et tiens l’arrière de la cuisse ou du mollet.","exe":"1. Lève la jambe, genou presque tendu · 2. Rapproche-la jusqu’à une tension douce derrière la cuisse · 3. Bassin et bas du dos au tapis · 4. Reste là, puis change de jambe","resp":"Expire longuement. Le muscle se relâche et cède un peu.","err":"Genou verrouillé : plie-le un peu · Décoller le bassin ou la tête : garde-les au sol · Tirer par à-coups : tension constante et douce","mus":"Arrière de la cuisse (ischio-jambiers), mollet (gastrocnémien)"}},"seatedfwd":{"es":{"d":"Sentada, te inclinas hacia delante desde la cadera. Estira la parte de atrás de las piernas con la espalda larga.","v":"Pecho largo, inclínate desde la cadera, suelta aire y relaja.","pos":"Sentada sobre los huesos del culo, piernas estiradas y juntas. Puntas de los pies hacia ti. Espalda larga y manos en los muslos.","exe":"1. Coge aire y crece hacia el techo · 2. Suelta aire e inclínate desde la cadera, no desde la espalda · 3. Desliza las manos hacia los pies hasta tirantez suave · 4. Quédate así y sube despacio","resp":"Coge aire para alargar la espalda. Suéltalo para avanzar un poco.","err":"Espalda redonda para llegar lejos: mejor espalda larga · Rodillas bloqueadas con tirón fuerte: dóblalas un poco · Rebotar: quédate quieta","mus":"Parte de atrás del muslo (isquiotibiales), gemelo (gastrocnemio), espalda (erector de la columna), glúteo (glúteo mayor)"},"en":{"d":"Seated, you fold forward from your hips. It stretches the backs of your legs while your back stays long.","v":"Long chest, fold from the hips, breathe out and let go.","pos":"Sit on your sit bones, legs straight and together. Toes pulled toward you. Back long, hands on your thighs.","exe":"1. Breathe in and grow tall · 2. Breathe out and fold from your hips, not your back · 3. Slide your hands toward your feet to a gentle pull · 4. Stay there, then come up slowly","resp":"Breathe in to lengthen your back. Breathe out to fold a little further.","err":"Rounding your back to reach far: keep it long instead · Locked knees pulling hard: bend them a little · Bouncing: stay still","mus":"Back of thigh (hamstrings), calf (gastrocnemius), back (erector spinae), bottom (gluteus maximus)"},"fr":{"d":"Assise, tu te penches en avant depuis les hanches. Ça étire l’arrière des jambes, dos long.","v":"Poitrine longue, penche-toi depuis les hanches, expire et relâche.","pos":"Assise sur les os des fesses, jambes tendues et serrées. Pointes des pieds vers toi. Dos long, mains sur les cuisses.","exe":"1. Inspire et grandis-toi vers le plafond · 2. Expire et penche-toi depuis les hanches, pas depuis le dos · 3. Glisse les mains vers les pieds jusqu’à une tension douce · 4. Reste là, puis remonte lentement","resp":"Inspire pour allonger le dos. Expire pour avancer un peu plus.","err":"Arrondir le dos pour aller loin : garde plutôt le dos long · Genoux verrouillés qui tirent fort : plie-les un peu · Rebondir : reste immobile","mus":"Arrière de la cuisse (ischio-jambiers), mollet (gastrocnémien), dos (érecteurs du rachis), fessier (grand fessier)"}},"butterfly":{"es":{"d":"Sentada con las plantas de los pies juntas. Estira la cara interna de los muslos con la espalda larga.","v":"Plantas juntas, rodillas caen solas, pecho largo.","pos":"Sentada sobre los huesos del culo, plantas de los pies juntas. Talones a una distancia cómoda. Manos en los tobillos o los pies.","exe":"1. Crece con la espalda larga · 2. Deja que las rodillas caigan solas hacia el suelo · 3. Suelta aire e inclínate un poco desde la cadera · 4. Quédate con tirantez suave en la ingle","resp":"Suelta el aire largo. Las rodillas bajan un poco más solas.","err":"Empujar las rodillas con los codos: deja que caigan solas · Espalda redonda: inclínate desde la cadera · Dolor con los talones muy cerca: aléjalos","mus":"Cara interna del muslo (aductores, grácil y pectíneo)"},"en":{"d":"Seated with the soles of your feet together. It stretches your inner thighs while your back stays long.","v":"Soles together, knees drop on their own, long chest.","pos":"Sit on your sit bones, soles of your feet together. Heels a comfortable distance away. Hands on your ankles or feet.","exe":"1. Sit tall with a long back · 2. Let your knees drop toward the floor on their own · 3. Breathe out and lean slightly from your hips · 4. Stay with a gentle pull in your groin","resp":"Breathe out long. Your knees sink a little more on their own.","err":"Pushing the knees down with your elbows: let them fall on their own · Rounded back: lean from your hips · Pain with heels too close: move them away","mus":"Inner thigh (adductors, gracilis, pectineus)"},"fr":{"d":"Assise, plantes des pieds jointes. Ça étire l’intérieur des cuisses, dos long.","v":"Plantes jointes, genoux qui tombent seuls, poitrine longue.","pos":"Assise sur les os des fesses, plantes des pieds jointes. Talons à une distance confortable. Mains sur les chevilles ou les pieds.","exe":"1. Grandis-toi, dos long · 2. Laisse les genoux descendre seuls vers le sol · 3. Expire et penche-toi un peu depuis les hanches · 4. Reste avec une tension douce à l’aine","resp":"Expire longuement. Les genoux descendent un peu plus tout seuls.","err":"Pousser les genoux avec les coudes : laisse-les tomber seuls · Dos arrondi : penche-toi depuis les hanches · Douleur avec talons trop proches : éloigne-les","mus":"Intérieur de la cuisse (adducteurs, gracile et pectiné)"}},"sidequad":{"es":{"d":"Tumbada de lado, llevas el talón al glúteo. Estira la parte delantera del muslo y de la cadera.","v":"Talón al glúteo, rodillas juntas, pelvis hacia delante.","pos":"Tumbada de lado, cabeza sobre el brazo de abajo. Cuerpo en línea recta. Pierna de abajo algo doblada para no caerte.","exe":"1. Dobla la rodilla de arriba y sujeta el tobillo · 2. Lleva el talón hacia el glúteo · 3. Rodillas juntas y pelvis un poco hacia dentro (culo metido) · 4. Quédate así y cambia de lado","resp":"Suelta el aire largo. Relaja la parte delantera del muslo.","err":"Rodilla de arriba adelantada o separada: ponla junto a la otra · Zona lumbar arqueada: aprieta el glúteo y mete la pelvis · Dolor de rodilla: tira menos","mus":"Parte delantera del muslo (cuádriceps), parte delantera de la cadera (psoas ilíaco)"},"en":{"d":"Lying on your side, you bring your heel to your bottom. It stretches the front of your thigh and hip.","v":"Heel to bottom, knees together, pelvis forward.","pos":"Lie on your side, head on your lower arm. Body in a straight line. Lower leg slightly bent so you stay steady.","exe":"1. Bend your top knee and hold the ankle · 2. Bring your heel toward your bottom · 3. Knees together, tuck your pelvis a little (tailbone under) · 4. Stay there, then switch sides","resp":"Breathe out long. Let the front of your thigh relax.","err":"Top knee drifting forward or up: line it up with the other · Lower back arching: squeeze your bottom, tuck your pelvis · Knee pain: pull less","mus":"Front of thigh (quadriceps), front of hip (iliopsoas)"},"fr":{"d":"Allongée sur le côté, tu amènes le talon vers le fessier. Ça étire l’avant de la cuisse et de la hanche.","v":"Talon vers le fessier, genoux serrés, bassin en avant.","pos":"Allongée sur le côté, tête sur le bras du dessous. Corps bien aligné. Jambe du dessous un peu pliée pour rester stable.","exe":"1. Plie le genou du dessus et tiens la cheville · 2. Amène le talon vers le fessier · 3. Genoux joints, bassin un peu rentré (coccyx vers le bas) · 4. Reste là, puis change de côté","resp":"Expire longuement. Relâche l’avant de la cuisse.","err":"Genou du dessus qui avance ou s’écarte : aligne-le sur l’autre · Bas du dos cambré : serre le fessier, rentre le bassin · Douleur au genou : tire moins","mus":"Avant de la cuisse (quadriceps), avant de la hanche (ilio-psoas)"}},"lowlunge":{"es":{"d":"Zancada con la rodilla de atrás en el suelo. Estira la parte delantera de la cadera de la pierna de atrás.","v":"Pelvis hacia dentro, cadera adelante, tronco alto.","pos":"Rodilla de atrás en la esterilla, empeine apoyado. Pie de delante plano, rodilla encima del tobillo. Manos en la rodilla o la cadera.","exe":"1. Mete un poco la pelvis (culo hacia abajo) · 2. Lleva la cadera un poco adelante hasta tirantez suave · 3. Tronco alto y costillas abajo · 4. Quédate así y cambia de lado","resp":"Suelta el aire largo. Mantén la barriga activa para no arquear la espalda.","err":"Zona lumbar arqueada: mete la pelvis y baja las costillas · Rodilla de delante pasa el pie: da un paso más largo · Presión en la rodilla de atrás: dobla la esterilla","mus":"Parte delantera de la cadera (psoas ilíaco), muslo (recto femoral), lado de la cadera (tensor de la fascia lata)"},"en":{"d":"A lunge with your back knee on the floor. It stretches the front of the back leg’s hip.","v":"Tuck the pelvis, hips forward, stand tall.","pos":"Back knee on the mat, top of the foot down. Front foot flat, knee above the ankle. Hands on your knee or hips.","exe":"1. Tuck your pelvis a little (tailbone down) · 2. Shift your hips slightly forward to a gentle pull · 3. Tall body, ribs down · 4. Stay there, then switch sides","resp":"Breathe out long. Keep your tummy engaged so your back doesn’t arch.","err":"Lower back arching: tuck your pelvis, ribs down · Front knee past your foot: take a longer step · Pressure on the back knee: fold the mat for padding","mus":"Front of hip (iliopsoas), thigh (rectus femoris), side of hip (tensor fasciae latae)"},"fr":{"d":"Fente avec le genou arrière au sol. Elle étire l’avant de la hanche de la jambe arrière.","v":"Bassin rentré, hanches en avant, buste grand.","pos":"Genou arrière sur le tapis, dessus du pied au sol. Pied avant à plat, genou au-dessus de la cheville. Mains sur le genou ou les hanches.","exe":"1. Rentre un peu le bassin (coccyx vers le bas) · 2. Avance un peu les hanches jusqu’à une tension douce · 3. Buste grand, côtes basses · 4. Reste là, puis change de côté","resp":"Expire longuement. Garde le ventre actif pour ne pas cambrer.","err":"Bas du dos cambré : rentre le bassin, côtes basses · Genou avant au-delà du pied : fais un pas plus long · Pression au genou arrière : plie le tapis pour amortir","mus":"Avant de la hanche (ilio-psoas), cuisse (droit fémoral), côté de la hanche (tenseur du fascia lata)"}},"yogisquat":{"es":{"d":"Sentadilla profunda en la que te quedas abajo. Suelta la cadera y los tobillos.","v":"Talones abajo, pecho alto, codos abren las rodillas.","pos":"De pie, pies algo más abiertos que la cadera. Puntas un poco hacia fuera. Manos juntas delante del pecho.","exe":"1. Baja despacio doblando cadera y rodillas · 2. Rodillas en la línea de los pies · 3. Codos por dentro de las rodillas, ábrelas suave · 4. Pecho alto, quédate así y sube despacio","resp":"Respira lento. Al soltar el aire, la cadera se relaja y bajas un poco más.","err":"Talones levantados: abre más los pies o gira las puntas · Rodillas hacia dentro: llévalas en línea con los pies · Espalda muy redonda: pecho alto, baja menos","mus":"Cara interna del muslo (aductores), glúteo (glúteo mayor), pantorrilla (sóleo y gemelo), espalda (erector)"},"en":{"d":"A deep squat where you stay at the bottom. It loosens your hips and ankles.","v":"Heels down, chest tall, elbows open the knees.","pos":"Stand with feet a bit wider than your hips. Toes turned slightly out. Palms together in front of your chest.","exe":"1. Lower slowly by bending hips and knees · 2. Knees in line with your feet · 3. Elbows inside your knees, gently open them · 4. Chest tall, stay there, then rise slowly","resp":"Breathe slowly. As you breathe out, your hips relax and you sink a little.","err":"Heels lifting: widen your feet or turn your toes out · Knees caving in: line them up with your feet · Very rounded back: lift your chest, go less deep","mus":"Inner thigh (adductors), bottom (gluteus maximus), calf (soleus, gastrocnemius), back (erector spinae)"},"fr":{"d":"Squat profond où tu restes en bas. Il assouplit les hanches et les chevilles.","v":"Talons au sol, poitrine haute, coudes qui ouvrent les genoux.","pos":"Debout, pieds un peu plus larges que les hanches. Pointes légèrement vers l’extérieur. Mains jointes devant la poitrine.","exe":"1. Descends lentement en pliant hanches et genoux · 2. Genoux dans l’axe des pieds · 3. Coudes à l’intérieur des genoux, écarte-les doucement · 4. Poitrine haute, reste là et remonte lentement","resp":"Respire lentement. En expirant, les hanches se relâchent et tu descends un peu.","err":"Talons décollés : écarte les pieds ou ouvre les pointes · Genoux vers l’intérieur : aligne-les sur les pieds · Dos très arrondi : poitrine haute, descends moins","mus":"Intérieur de la cuisse (adducteurs), fessier (grand fessier), mollet (soléaire et gastrocnémien), dos (érecteurs)"}},"spinaltwist":{"es":{"d":"Giro de columna tumbada boca arriba. Las rodillas caen a un lado y los hombros se quedan en el suelo.","v":"Rodillas a un lado, los dos hombros en la esterilla.","pos":"Boca arriba, rodillas dobladas y juntas, pies en el suelo. Brazos en cruz a la altura de los hombros. Palmas arriba.","exe":"1. Suelta aire y deja caer las rodillas a un lado · 2. Mantén los dos hombros apoyados · 3. Si es cómodo, gira la cabeza suave al otro lado · 4. Quédate, vuelve al centro y cambia","resp":"Respira hacia las costillas. Al soltar aire, el peso de las piernas te gira más.","err":"Hombro contrario despegado: baja menos las rodillas · Empujar las piernas: deja que trabaje su propio peso · Aguantar el aire: respira lento y seguido","mus":"Costados (oblicuos), zona lumbar (cuadrado lumbar), glúteo (glúteo medio), espalda (erector), pecho (pectoral)"},"en":{"d":"A spine twist lying on your back. Your knees drop to one side and your shoulders stay down.","v":"Knees to one side, both shoulders on the mat.","pos":"Lie on your back, knees bent and together, feet flat. Arms out in a T at shoulder height. Palms up.","exe":"1. Breathe out and let your knees drop to one side · 2. Keep both shoulders on the mat · 3. If comfortable, turn your head gently the other way · 4. Stay, come back to centre and switch","resp":"Breathe into your ribs. As you breathe out, the weight of your legs twists you more.","err":"Opposite shoulder lifting: lower your knees less · Pushing the legs down: let their weight do the work · Holding your breath: breathe slowly and steadily","mus":"Sides of tummy (obliques), lower back (quadratus lumborum), side of bottom (gluteus medius), back (erector spinae), chest (pectorals)"},"fr":{"d":"Torsion de la colonne allongée sur le dos. Les genoux tombent d’un côté et les épaules restent au sol.","v":"Genoux d’un côté, les deux épaules au tapis.","pos":"Allongée sur le dos, genoux pliés et serrés, pieds au sol. Bras en croix à hauteur d’épaules. Paumes vers le haut.","exe":"1. Expire et laisse tomber les genoux d’un côté · 2. Garde les deux épaules au tapis · 3. Si c’est confortable, tourne doucement la tête de l’autre côté · 4. Reste, reviens au centre et change","resp":"Respire dans les côtes. En expirant, le poids des jambes te fait tourner un peu plus.","err":"Épaule opposée qui décolle : descends moins les genoux · Pousser les jambes : laisse faire leur poids · Bloquer l’air : respire lentement et en continu","mus":"Côtés du ventre (obliques), bas du dos (carré des lombes), côté du fessier (moyen fessier), dos (érecteurs), poitrine (pectoral)"}},"kneehug":{"es":{"d":"Boca arriba, abrazas las rodillas y te balanceas suave hacia delante y hacia atrás. Masajea la zona lumbar.","v":"Abraza las rodillas, balancéate suave.","pos":"Boca arriba, cabeza y hombros apoyados. Lleva las dos rodillas al pecho. Abrázalas por debajo de las rodillas o por las espinillas.","exe":"1. Acerca las rodillas al pecho con tirantez suave · 2. Deja la zona lumbar apoyada · 3. Mécete lento de lado a lado, poquito · 4. Vuelve al centro y suelta","resp":"Suelta aire al acercar las rodillas. Respira con calma al mecerte.","err":"Levantar la cabeza: déjala apoyada y el cuello suelto · Balanceo grande o rápido: pequeño y lento · Apretar fuerte: abrazo suave, hombros sueltos","mus":"Espalda (erector de la columna), zona lumbar (cuadrado lumbar y multífidos), glúteo (glúteo mayor)"},"en":{"d":"On your back, you hug your knees and rock gently forward and back. It massages your lower back.","v":"Hug your knees, rock gently.","pos":"Lie on your back, head and shoulders down. Bring both knees to your chest. Hug them below the knees or at the shins.","exe":"1. Draw your knees to your chest to a gentle pull · 2. Let your lower back rest on the mat · 3. Rock slowly side to side, just a little · 4. Come back to centre and let go","resp":"Breathe out as you draw your knees in. Breathe calmly while you rock.","err":"Lifting your head: keep it down, neck relaxed · Big or fast rocking: keep it small and slow · Squeezing hard: soft hug, relaxed shoulders","mus":"Back (erector spinae), lower back (quadratus lumborum, multifidus), bottom (gluteus maximus)"},"fr":{"d":"Sur le dos, tu serres les genoux et te balances doucement d’avant en arrière. Ça masse le bas du dos.","v":"Serre les genoux, balance-toi doucement.","pos":"Allongée sur le dos, tête et épaules au sol. Ramène les deux genoux à la poitrine. Enlace-les sous les genoux ou aux tibias.","exe":"1. Rapproche les genoux de la poitrine, tension douce · 2. Laisse le bas du dos au tapis · 3. Berce-toi lentement d’un côté à l’autre, un peu · 4. Reviens au centre et relâche","resp":"Expire en ramenant les genoux. Respire calmement pendant le bercement.","err":"Lever la tête : garde-la au sol, nuque relâchée · Bercement grand ou rapide : petit et lent · Serrer fort : étreinte douce, épaules relâchées","mus":"Dos (érecteurs du rachis), bas du dos (carré des lombes et multifides), fessier (grand fessier)"}},"tricepstretch":{"es":{"d":"De pie, llevas una mano a la espalda por encima del hombro. Estira la parte de atrás del brazo y el costado.","v":"Codo arriba, empuja suave, costillas abajo.","pos":"De pie, pies separados como tu cadera. Rodillas sin bloquear y espalda recta. Hombros sueltos.","exe":"1. Sube un brazo y dobla el codo, mano entre los omóplatos · 2. Con la otra mano empuja suave el codo atrás · 3. Costillas abajo, sin arquear la espalda · 4. Quédate así y cambia de brazo","resp":"Suelta el aire largo. Deja que el codo ceda un poco más.","err":"Zona lumbar arqueada: activa la barriga y baja las costillas · Cabeza adelantada: cuello largo y suelto · Empujar fuerte el codo: presión suave","mus":"Parte de atrás del brazo (tríceps), costado (dorsal ancho y redondo mayor)"},"en":{"d":"Standing, you reach one hand down your back over your shoulder. It stretches the back of your arm and your side.","v":"Elbow up, press gently, ribs down.","pos":"Stand with feet hip-width apart. Knees soft, back straight. Shoulders relaxed.","exe":"1. Rais /* ─── NIVEL Y PROGRESO ─── */
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getLevel(){const l=lsGet('cris_calis_level',0);return (l===0||l===1||l===2)?l:0;}
function setLevel(l){lsSet('cris_calis_level',l);lsSet('cris_calis_start',dayKey());initHome();if(document.getElementById('v-day').classList.contains('active'))openDay(curDayIdx);}
// Semana de progreso (0-3) desde que empezaste en este nivel; a partir de la 4.ª se mantiene
function weeksAtLevel(){const s=lsGet('cris_calis_start',null);if(!s)return 0;const d=(new Date(dayKey())-new Date(s))/864e5;return Math.max(0,Math.floor(d/7));}
function progWeek(){return Math.min(3,weeksAtLevel());}
function levelTimes(){const L=LEVEL_TIMES[getLevel()],w=progWeek();return {work:L.w[w],rest:L.r[w]};}

/* ─── SESIÓN DEL DÍA: se construye a partir del programa, el nivel y la semana ─── */
function buildDay(i){
  const D=WEEK[i],lv=getLevel(),items=[];
  const DOV=lsGet('cris_calis_dur',{});
  const mk=(id,dur,rest,sides,sec,extra)=>{const e=exL(id);if(DOV[id])dur=DOV[id];return {id,name:e.n,desc:e.d,voice:e.v,tip:e.tip,emoji:e.e,anim:e.a,duration:dur,rest,sides:sides||1,sec,...(extra||{})};};
  if(D.stretch){
    D.list.forEach(([id,dur,sd])=>items.push(mk(id,dur,5,sd,'st')));
  }else{
    const {work,rest}=levelTimes(),R=2;
    WARMUP.forEach(([id,dur])=>items.push(mk(id,dur,0,1,'warm')));
    for(let r=1;r<=R;r++)D.circuit.forEach((slot,k)=>{
      const id=slot[lv],e=EX[id],sd=e.sd===2?2:1;
      const last=(r===R&&k===D.circuit.length-1);
      items.push(mk(id,sd===2?Math.round(work/2):work,last?0:(k===D.circuit.length-1?Math.max(rest,40):rest),sd,'main',{round:r,rounds:R,slot:k+1,slots:D.circuit.length,repeat:r>1}));
    });
    D.cool.forEach(([id,dur,sd])=>items.push(mk(id,dur,5,sd,'cool')));
  }
  const secs=items.reduce((s,x)=>s+x.duration*x.sides+x.rest+(x.sides===2?5:0)+6,0);
  return {id:D.id,idx:i,emoji:D.emoji,color:D.color,stretch:!!D.stretch,name:t('dn')[i],focus:t('f_'+D.id),intro:t('i_'+D.id),items,mins:Math.round(secs/60)};
}

/* ─── FIGURA ANIMADA: una única animación continua que se puede copiar ─── */
let FIG_T0=performance.now(),FIG_PAUSED=false,FIG_PAUSE_AT=0;
function figTime(){return ((FIG_PAUSED?FIG_PAUSE_AT:performance.now())-FIG_T0)/1000;}
function figReset(){FIG_T0=performance.now();FIG_PAUSED=false;}
function figPause(p){if(p&&!FIG_PAUSED){FIG_PAUSE_AT=performance.now();FIG_PAUSED=true;}else if(!p&&FIG_PAUSED){FIG_T0+=performance.now()-FIG_PAUSE_AT;FIG_PAUSED=false;}}
const _ANC={};
function animFor(key,exid){
  const an=figRetargetAnim(FIG_ANIMS[key]||FIG_ANIMS.breathe),tp=exid&&EX[exid]&&EX[exid].tp;
  if(tp==null)return an;const ck=key+'|'+exid;if(_ANC[ck])return _ANC[ck];
  return _ANC[ck]=Array.isArray(tp)&&an.K.length===2?{...an,seq:tp,sp:null,tempo:tp.reduce((a,b)=>a+b,0)}:{...an,tempo:+tp};
}
function figFrame(svg,key,k){
  const an=animFor(key,svg.dataset.ex);
  if(!svg._fit||svg._key!==key+svg.dataset.ex){svg._fit=figFit(an.K);svg._key=key+svg.dataset.ex;svg._hl=null;
    const ex=svg.dataset.ex;svg._zones=ex&&EXT[ex]?exZones(ex):{main:[],more:[]};
    if(svg.dataset.guide)figGuideBuild(svg,an,svg._fit);else svg._hl=exParts(svg.dataset.ex,an,null);}
  // el músculo que trabaja «late» con el esfuerzo (más intenso a mitad del recorrido)
  const amp=svg.dataset.still?.7:an.hold?.55+.45*Math.sin(k*Math.PI*2*2)**2:.35+.65*Math.sin(k*Math.PI)**2;
  svg.querySelector('g.fig-body').innerHTML=figSVG(figAt(an,k),svg._fit,svg._hl||an.hl,amp,svg._zones);
  if(svg.dataset.guide)figGuideDyn(svg,an,svg._fit,k);
}
function figLoop(){
  document.querySelectorAll('svg.fig').forEach(svg=>{
    const key=svg.dataset.anim,an=animFor(key,svg.dataset.ex);
    const T=an.tempo||3,time=svg.dataset.still?T*.5:figTime();
    if(svg.dataset.still&&svg._drawn===key)return; // miniaturas: se dibujan una vez
    figFrame(svg,key,(time%T)/T);svg._drawn=key;
    // Marca de ritmo (la figura lleva los tiempos; las repeticiones las cuentas tú)
    const rep=svg.parentNode.querySelector('.rep-badge');
    if(rep&&!svg.dataset.still&&S.phase!=='paused'){
      const ph=figPhase(an,(time%T)/T),w=ph.key==='hold'?t('hold'):ph.key?t('ph_'+ph.key):'';
      const arrow=ph.key==='down'?'⬇ ':ph.key==='up'?'⬆ ':'';
      rep.textContent=an.hold?t('hold'):(arrow+w);rep.style.display=(an.hold||w)?'':'none';
      const phId=ph.i+'/'+Math.floor(time/T);
      if(S.phase==='active'&&svg._ph!==phId&&svg.closest('#s-stage')){
        if(svg._ph!=null&&!an.hold)beep(660,.035);
        // la voz dice qué hacer en cada fase (solo si la fase dura lo suficiente y no es un vaivén continuo)
        if(svg._ph!=null&&!an.hold&&ph.key&&(ph.len||0)>=0.9&&T>=2.2&&!/^(side1|side2|circle|rock)$/.test(ph.key))speakCue(w);
        svg._ph=phId;
      }
    }else if(rep)rep.style.display='none';
  });
  requestAnimationFrame(figLoop);
}
requestAnimationFrame(figLoop);
function getAnim(key,opts){
  opts=opts||{};
  return `<div class="anim-wrap${opts.big?' big':''}">
    <svg class="fig" data-anim="${key}"${opts.ex?` data-ex="${opts.ex}"`:''}${opts.still?' data-still="1"':''}${opts.guide?' data-guide="1"':''} viewBox="${FIG_VB}" xmlns="http://www.w3.org/2000/svg"${opts.mirror?' style="transform:scaleX(-1)"':''}>${FIG_MAT}${opts.guide?'<g class="fig-ghost"></g><g class="fig-trail"></g>':''}<g class="fig-body"></g>${opts.guide?'<g class="fig-dyn"></g>':''}</svg>
    ${opts.tag?`<span class="anim-tag">${opts.tag}</span>`:''}
    ${opts.big?'<span class="rep-badge" style="display:none"></span>':''}
  </div>`;
}
function thumb(key,exid){return `<svg class="fig thumb" data-anim="${key}"${exid?` data-ex="${exid}"`:''} data-still="1" viewBox="${FIG_VB}" xmlns="http://www.w3.org/2000/svg">${FIG_MAT}<g class="fig-body"></g></svg>`;}

let __beepCtx=null;function __getCtx(){try{if(!__beepCtx)__beepCtx=new(window.AudioContext||window.webkitAudioContext)();if(__beepCtx.state==='suspended')__beepCtx.resume();return __beepCtx;}catch(e){return null;}}
function beep(f=600,d=.2){if(!__allow('sound'))return;try{const c=__getCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}catch(e){}}
function vibrate(ms=60){if(!__allow('vib'))return;try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
let _utt=null;
function speak(tx){try{if(!__allow('voice'))return;if(!window.speechSynthesis)return;window.speechSynthesis.cancel();if(window.speechSynthesis.paused)window.speechSynthesis.resume();_utt=new SpeechSynthesisUtterance(tx);_utt.lang=VOICE_LANG[crisLang()];_utt.rate=.9;const v=window.speechSynthesis.getVoices();const ev=v.find(x=>x.lang.startsWith(crisLang()));if(ev)_utt.voice=ev;window.speechSynthesis.speak(_utt);}catch(e){}}
function speakCue(w){try{if(!__allow('voice')||!window.speechSynthesis||!w)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang=VOICE_LANG[crisLang()];u.rate=1.05;const v=window.speechSynthesis.getVoices().find(x=>x.lang.startsWith(crisLang()));if(v)u.voice=v;window.speechSynthesis.speak(u);}catch(e){}}
let _speakSeq=0;
function speakThen(tx,cb){
  const seq=++_speakSeq;let done=false;
  const fin=()=>{if(done||seq!==_speakSeq)return;done=true;cb();};
  try{
    if(!__allow('voice')||!window.speechSynthesis){fin();return;}
    window.speechSynthesis.cancel();
    if(window.speechSynthesis.paused)window.speechSynthesis.resume();
    _utt=new SpeechSynthesisUtterance(tx);
    _utt.lang=VOICE_LANG[crisLang()];_utt.rate=.9;
    const v=window.speechSynthesis.getVoices();const ev=v.find(x=>x.lang.startsWith(crisLang()));if(ev)_utt.voice=ev;
    _utt.onend=fin;_utt.onerror=fin;
    window.speechSynthesis.speak(_utt);
    setTimeout(fin,Math.max(4000,tx.length*105));
  }catch(e){fin();}
}

let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseAwake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{

});
function exList(){return CUR.items;}
function startSession(){
  CUR=buildDay(curDayIdx);
  if(!lsGet('cris_calis_start',null))lsSet('cris_calis_start',dayKey());

}
function confirmStop(){stopSession();go('day');}
function stopSession(){xsToggleFocus(false);stopTimer();releaseAwake();_speakSeq++;try{speechSynthesis.cancel();}catch(e){}}
function stopTimer(){if(S.interval){clearInterval(S.interval);S.interval=null;}}
function beginAll(){keepAwake();startPrep();}
function voiceOn(){return __allow('voice')&&!!window.speechSynthesis;}
// La primera vez se explica entero; en la 2.ª ronda basta el nombre y la clave
function exText(ex,first){

function goActive(ex){
  S.phase='active';S.timer=ex.duration;S.total=ex.duration;
  figReset();beep(800,.15);vibrate(60);
}
function startPrep(){
  const ex=exList()[S.exIdx];
  S.phase='prep';S.side=1;
  vibrate(50);
  if(ex.round===2&&ex.slot===1)speak(t('v_round2'));
  if(!voiceOn()){S.timer=ex.repeat?5:8;S.total=S.timer;renderSession();S.interval=setInterval(sessionTick,1000);return;}
  S.timer=3;S.total=3;
  renderSession();
  speakThen(exText(ex,S.exIdx===0),()=>{
    if(S.phase!=='prep'||S.interval)return;
    S.interval=setInterval(sessionTick,1000);
  });
}
function advanceExDirect(){
  stopTimer();
  const L=exList();
  S.exIdx++;S.side=1;S.pausedPhase=null;
  if(S.exIdx>=L.length){S.phase='done';releaseAwake();renderSession();return;}
  if(!voiceOn()){startPrep();return;}
  const ex=L[S.exIdx];
  goActive(ex);speak(t('v_go',{n:ex.duration}));
  S.interval=setInterval(sessionTick,1000);
  renderSession();
}
function sessionTick(){
  S.timer--;
  const el=document.getElementById('s-timer');
  if(el)el.innerHTML=el.classList.contains('xs-clock')?xsClock(S.timer):el.classList.contains('s-clock')?mmss(S.timer):S.timer;
  xsTick();
  __ring('s-ring',S.total?S.timer/S.total:0);
  if(S.phase==='active'){
    if(S.timer===10&&S.total>=25)speak(t('v_last10'));
  }
  if(S.timer<=3&&S.timer>0&&(S.phase==='active'||S.phase==='prep'||S.phase==='rest'))beep(500,.08);
  if(S.timer>0)return;
  stopTimer();
  const L=exList(),ex=L[S.exIdx];
  if(S.phase==='prep'){
    goActive(ex);speak(t('v_go',{n:ex.duration}));
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='active'&&ex.sides===2&&S.side===1){
    S.side=2;S.phase='switch';S.timer=5;S.total=5;
    speak(t('v_switch',{n:ex.duration}));vibrate(60);
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='switch'){
    goActive(ex);
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='active'&&ex.rest>0&&S.exIdx<L.length-1){
    S.phase='rest';S.timer=ex.rest;S.total=ex.rest;
    beep(600,.15);vibrate(60);
    if(voiceOn()){
      S.nextReady=false;
      const nx=L[S.exIdx+1];
      const pre=(nx.round===2&&nx.slot===1)?t('v_round2')+' ':'';
      speakThen(t('v_rest',{n:ex.rest})+pre+exText(nx,false),()=>{
        S.nextReady=true;
        if(S.phase==='restwait')advanceExDirect();
      });
    }else{S.nextReady=true;}
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='rest'){
    if(voiceOn()&&!S.nextReady){S.phase='restwait';renderSession();return;}
    if(voiceOn()){advanceExDirect();}else{advanceEx();}
    return;
  }else{
    advanceEx();return;
  }
  renderSession();
}
function togglePlay(){
  if(S.phase==='paused'){
    if(S.pausedPhase==='restwait'){S.pausedPhase=null;advanceExDirect();return;}
    S.phase=S.pausedPhase||'active';S.pausedPhase=null;
    S.interval=setInterval(sessionTick,1000);
    figPause(false);keepAwake();speak(t('v_resume'));
  }else if(['prep','active','switch','rest','restwait'].includes(S.phase)){
    S.pausedPhase=S.phase;stopTimer();S.phase='paused';figPause(true);
    try{speechSynthesis.cancel();}catch(e){}
  }
  renderSession();
}
function skipPhase(){
  stopTimer();
  try{speechSynthesis.cancel();}catch(e){}
  const L=exList(),ex=L[S.exIdx];
  const ph=S.phase==='paused'?(S.pausedPhase||'active'):S.phase;
  S.pausedPhase=null;figPause(false);
  if(ph==='prep'||ph==='switch'){
    goActive(ex);S.interval=setInterval(sessionTick,1000);renderSession();
  }else if(ph==='active'&&ex.sides===2&&S.side===1){
    S.side=2;S.phase='switch';S.timer=5;S.total=5;
    S.interval=setInterval(sessionTick,1000);renderSession();
  }else if((ph==='rest'||ph==='restwait')&&voiceOn()){
    advanceExDirect();
  }else{
    advanceEx();
  }
}
function advanceEx(){
  stopTimer();
  const L=exList();
  S.exIdx++;S.side=1;S.pausedPhase=null;
  if(S.exIdx>=L.length){S.phase='done';releaseAwake();renderSession();}
  else startPrep();
}
