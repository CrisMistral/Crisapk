h the elbow directly under the shoulder, knees bent to 90° and stacked. Shoulders, hips and knees in one plane.","exe":"1. Brace your transverse abdominis and press the floor away with your forearm · 2. Lift your hips in 1 s to align shoulder, hip and knee · 3. Hold for the set time · 4. Lower with control and switch sides","resp":"Breathe steadily; exhale as you lift the hips, never hold your breath.","err":"Hips sagging: push the floor and lift the hips · Shoulder sinking: pull it away from your ear · Hips drifting back: bring them forward into line","mus":"Obliques, quadratus lumborum, gluteus medius, transverse abdominis, serratus anterior"},"fr":{"d":"Planche latérale isométrique sur l’avant-bras et le genou, bassin levé dans l’alignement épaule-hanche-genou ; contrôle de la flexion latérale.","v":"Coude sous l’épaule, bassin haut, ligne droite.","pos":"Sur le côté, avant-bras au sol, coude juste sous l’épaule, genoux fléchis à 90° et superposés. Épaules, hanches et genoux dans le même plan.","exe":"1. Active le transverse et repousse le sol avec l’avant-bras · 2. Monte le bassin en 1 s pour aligner épaule, hanche et genou · 3. Tiens le temps indiqué · 4. Redescends contrôlée et change de côté","resp":"Respiration calme et continue ; expire en montant le bassin, sans apnée.","err":"Bassin qui tombe : repousse le sol et remonte · Épaule enfoncée : éloigne-la de l’oreille · Hanches en arrière : avance-les dans l’alignement","mus":"Obliques, carré des lombes, moyen fessier, transverse de l’abdomen, dentelé antérieur"}},"sideplank":{"es":{"d":"Plancha lateral isométrica sobre antebrazo y borde del pie, con el cuerpo alineado de la cabeza a los pies; control de la flexión lateral y la rotación.","v":"Cuerpo recto como una tabla, cadera arriba. Aguanta.","pos":"De lado, antebrazo apoyado con el codo bajo el hombro, piernas extendidas y pies apilados (o el de arriba delante). Todo el cuerpo en un solo plano.","exe":"1. Empuja el suelo con el antebrazo y activa el transverso · 2. Eleva la cadera en 1 s hasta formar una línea de la cabeza a los pies · 3. Aguanta sin rotar el tronco · 4. Baja controlada y cambia de lado","resp":"Respiración continua y tranquila; exhala al elevar la cadera, sin apnea.","err":"Cadera que cae: empuja el suelo o apoya la rodilla de abajo · Tronco que rota: apila hombros y cadera · Hombro hundido: aleja el hombro de la oreja","mus":"Oblicuos, cuadrado lumbar, glúteo medio, transverso del abdomen, serrato anterior, aductores"},"en":{"d":"Isometric side plank on forearm and edge of the foot, body aligned from head to feet; resists lateral flexion and rotation.","v":"Body straight as a board, hips up. Hold.","pos":"Lie on your side, forearm down with the elbow under the shoulder, legs straight and feet stacked (or top foot in front). Whole body in one plane.","exe":"1. Press the floor with your forearm and brace your transverse abdominis · 2. Lift your hips in 1 s to form a line from head to feet · 3. Hold without rotating your trunk · 4. Lower with control and switch sides","resp":"Breathe steadily; exhale as you lift the hips, never hold your breath.","err":"Hips sagging: push the floor or drop to the bottom knee · Trunk rotating: stack shoulders and hips · Shoulder sinking: pull it away from your ear","mus":"Obliques, quadratus lumborum, gluteus medius, transverse abdominis, serratus anterior, adductors"},"fr":{"d":"Planche latérale isométrique sur l’avant-bras et la tranche du pied, corps aligné de la tête aux pieds ; contrôle de la flexion latérale et de la rotation.","v":"Corps droit comme une planche, bassin haut. Tiens.","pos":"Sur le côté, avant-bras au sol, coude sous l’épaule, jambes tendues et pieds superposés (ou pied du dessus devant). Tout le corps dans un seul plan.","exe":"1. Repousse le sol avec l’avant-bras et active le transverse · 2. Monte le bassin en 1 s pour former une ligne de la tête aux pieds · 3. Tiens sans tourner le tronc · 4. Redescends contrôlée et change de côté","resp":"Respiration calme et continue ; expire en montant le bassin, sans apnée.","err":"Bassin qui tombe : repousse le sol ou pose le genou du dessous · Tronc qui tourne : superpose épaules et hanches · Épaule enfoncée : éloigne-la de l’oreille","mus":"Obliques, carré des lombes, moyen fessier, transverse de l’abdomen, dentelé antérieur, adducteurs"}},"sideplank_dip":{"es":{"d":"Plancha lateral dinámica: descenso y elevación de la cadera en el plano frontal, con fase excéntrica controlada y hombros y cadera apilados.","v":"Baja la cadera en dos, sube en uno.","pos":"Plancha lateral sobre antebrazo y borde del pie, codo bajo el hombro, cuerpo alineado de la cabeza a los pies y transverso activado.","exe":"1. Parte de la plancha lateral con la cadera alineada · 2. Baja la cadera en 2 s hasta casi rozar el suelo · 3. Sube en 1 s ligeramente por encima de la línea neutra · 4. Completa las repeticiones y cambia de lado","resp":"Inhala al bajar la cadera, exhala al subirla.","err":"Tirones: controla la bajada en 2 s · Tronco que rota: mantén hombros y cadera apilados · Hombro hundido: empuja el suelo con el antebrazo","mus":"Oblicuos, cuadrado lumbar, glúteo medio, transverso del abdomen, serrato anterior"},"en":{"d":"Dynamic side plank: lowering and lifting the hips in the frontal plane, with a controlled eccentric phase and shoulders and hips stacked.","v":"Lower the hips for two, lift for one.","pos":"Side plank on forearm and edge of the foot, elbow under shoulder, body aligned from head to feet, transverse abdominis braced.","exe":"1. Start in a side plank with hips aligned · 2. Lower your hips in 2 s until they almost touch the floor · 3. Lift in 1 s slightly above neutral · 4. Finish the reps and switch sides","resp":"Inhale as the hips lower, exhale as they lift.","err":"Jerky reps: control the 2 s descent · Trunk rotating: keep shoulders and hips stacked · Shoulder sinking: press the floor with your forearm","mus":"Obliques, quadratus lumborum, gluteus medius, transverse abdominis, serratus anterior"},"fr":{"d":"Planche latérale dynamique : descente et montée du bassin dans le plan frontal, phase excentrique contrôlée, épaules et hanches superposées.","v":"Descends le bassin en deux, remonte en un.","pos":"Planche latérale sur l’avant-bras et la tranche du pied, coude sous l’épaule, corps aligné de la tête aux pieds, transverse activé.","exe":"1. Pars en planche latérale, bassin aligné · 2. Descends le bassin en 2 s jusqu’à presque toucher le sol · 3. Remonte en 1 s un peu au-dessus de la ligne neutre · 4. Termine la série et change de côté","resp":"Inspire en descendant le bassin, expire en le remontant.","err":"À-coups : contrôle la descente en 2 s · Tronc qui tourne : garde épaules et hanches superposées · Épaule enfoncée : repousse le sol avec l’avant-bras","mus":"Obliques, carré des lombes, moyen fessier, transverse de l’abdomen, dentelé antérieur"}},"legraise_single":{"es":{"d":"Elevación alterna de una pierna extendida con la zona lumbar en contacto con la esterilla; menor palanca que la elevación de ambas piernas.","v":"Lumbar pegada, sube una pierna y baja lenta.","pos":"Boca arriba, piernas extendidas, brazos a los lados con palmas abajo (o manos bajo los glúteos). Ligera retroversión pélvica y lumbar en contacto con la esterilla.","exe":"1. Activa el transverso y fija la pelvis · 2. Eleva una pierna extendida hasta 90° en 2 s · 3. Bájala en 3 s sin tocar el suelo · 4. Alterna piernas","resp":"Exhala al subir la pierna, inhala al bajarla.","err":"Lumbar que se arquea: dobla la pierna de apoyo o pon las manos bajo los glúteos · Bajar de golpe: cuenta 3 s · Pelvis que rota: mantén ambas caderas quietas","mus":"Recto abdominal, transverso del abdomen, psoas ilíaco, recto femoral"},"en":{"d":"Alternating single straight-leg raise with your lower back in contact with the mat; less leverage than raising both legs.","v":"Back flat, lift one leg, lower slowly.","pos":"Lie on your back, legs straight, arms by your sides palms down (or hands under your glutes). Slight posterior pelvic tilt, lower back in contact with the mat.","exe":"1. Brace your transverse abdominis and lock your pelvis · 2. Raise one straight leg to 90° in 2 s · 3. Lower it in 3 s without touching the floor · 4. Alternate legs","resp":"Exhale as the leg rises, inhale as it lowers.","err":"Lower back arching: bend the resting leg or put hands under your glutes · Dropping the leg: count 3 s · Pelvis rotating: keep both hips still","mus":"Rectus abdominis, transverse abdominis, iliopsoas, rectus femoris"},"fr":{"d":"Élévation alternée d’une jambe tendue, lombaires au contact du tapis ; moins de bras de levier que l’élévation des deux jambes.","v":"Lombaires plaquées, monte une jambe, descends lentement.","pos":"Allongée sur le dos, jambes tendues, bras le long du corps paumes au sol (ou mains sous les fessiers). Légère rétroversion du bassin, lombaires au contact du tapis.","exe":"1. Active le transverse et fixe le bassin · 2. Monte une jambe tendue jusqu’à 90° en 2 s · 3. Redescends-la en 3 s sans toucher le sol · 4. Alterne","resp":"Expire en montant la jambe, inspire en la descendant.","err":"Dos qui se cambre : plie la jambe au sol ou mains sous les fessiers · Jambe qui tombe : compte 3 s · Bassin qui tourne : garde les deux hanches immobiles","mus":"Grand droit de l’abdomen, transverse de l’abdomen, ilio-psoas, droit fémoral"}},"reversecrunch":{"es":{"d":"Retroversión pélvica y flexión de cadera desde posición de mesa, despegando ligeramente el sacro; recorrido corto y sin impulso.","v":"Enrolla la pelvis, rodillas al pecho, baja lenta.","pos":"Boca arriba, cadera y rodillas a 90° (posición de mesa), brazos a los lados con las palmas abajo. Zona lumbar en contacto con la esterilla.","exe":"1. Activa el transverso y fija las costillas abajo · 2. Enrolla la pelvis llevando las rodillas al pecho y despega el sacro en 1 s · 3. Pausa 1 s · 4. Baja en 3 s hasta la mesa","resp":"Exhala al enrollar la pelvis, inhala al bajar.","err":"Balanceo de piernas: reduce el recorrido y haz la pausa · Empujar con los brazos: apoya las palmas sin presionar · Bajar de golpe: controla los 3 s","mus":"Recto abdominal, oblicuos, transverso del abdomen, psoas ilíaco"},"en":{"d":"Posterior pelvic tilt and hip flexion from tabletop, lifting the sacrum slightly off the mat; short range, no momentum.","v":"Curl the pelvis, knees to chest, lower slowly.","pos":"Lie on your back, hips and knees at 90° (tabletop), arms by your sides palms down. Lower back in contact with the mat.","exe":"1. Brace your transverse abdominis, ribs down · 2. Curl your pelvis, bringing knees to chest and lifting the sacrum in 1 s · 3. Pause 1 s · 4. Lower in 3 s back to tabletop","resp":"Exhale as you curl the pelvis, inhale as you lower.","err":"Swinging legs: shorten the range and pause · Pushing with your arms: rest palms lightly · Dropping down: control the 3 s","mus":"Rectus abdominis, obliques, transverse abdominis, iliopsoas"},"fr":{"d":"Rétroversion du bassin et flexion de hanche depuis la position de table, en décollant légèrement le sacrum ; amplitude courte, sans élan.","v":"Enroule le bassin, genoux vers la poitrine, descends lentement.","pos":"Allongée sur le dos, hanches et genoux à 90° (position de table), bras le long du corps paumes au sol. Lombaires au contact du tapis.","exe":"1. Active le transverse, côtes basses · 2. Enroule le bassin, genoux vers la poitrine, et décolle le sacrum en 1 s · 3. Pause 1 s · 4. Redescends en 3 s jusqu’à la table","resp":"Expire en enroulant le bassin, inspire en descendant.","err":"Jambes qui se balancent : réduis l’amplitude et marque la pause · Pousser avec les bras : paumes posées sans appuyer · Retomber : contrôle les 3 s","mus":"Grand droit de l’abdomen, obliques, transverse de l’abdomen, ilio-psoas"}},"legraise":{"es":{"d":"Elevación de ambas piernas extendidas hasta 90° y descenso lento, con la zona lumbar en contacto con la esterilla; alta exigencia antiextensión.","v":"Lumbar pegada, piernas juntas, baja en tres.","pos":"Boca arriba, piernas juntas y extendidas, brazos a los lados con palmas abajo o manos bajo los glúteos. Retroversión pélvica y costillas abajo.","exe":"1. Activa el transverso y presiona la lumbar contra la esterilla · 2. Sube las piernas hasta 90° en 2 s · 3. Baja en 3 s solo hasta donde la lumbar siga pegada · 4. Repite sin tocar el suelo","resp":"Exhala al subir, inhala durante la bajada controlada.","err":"Lumbar que se arquea al bajar: detén la bajada más arriba o flexiona las rodillas · Impulso: pausa arriba · Cuello tenso: apoya la cabeza relajada","mus":"Recto abdominal, transverso del abdomen, psoas ilíaco, recto femoral, oblicuos"},"en":{"d":"Raise both straight legs to 90° and lower slowly with your lower back in contact with the mat; high anti-extension demand.","v":"Back flat, legs together, lower for three.","pos":"Lie on your back, legs together and straight, arms by your sides palms down or hands under your glutes. Posterior pelvic tilt, ribs down.","exe":"1. Brace your transverse abdominis and press your lower back into the mat · 2. Raise your legs to 90° in 2 s · 3. Lower in 3 s only as far as your back stays flat · 4. Repeat without touching the floor","resp":"Exhale as you lift, inhale during the controlled lowering.","err":"Back arching on the way down: stop higher or bend your knees · Momentum: pause at the top · Tense neck: rest your head relaxed on the mat","mus":"Rectus abdominis, transverse abdominis, iliopsoas, rectus femoris, obliques"},"fr":{"d":"Élévation des deux jambes tendues jusqu’à 90° et descente lente, lombaires au contact du tapis ; forte exigence anti-extension.","v":"Lombaires plaquées, jambes serrées, descends en trois.","pos":"Allongée sur le dos, jambes serrées et tendues, bras le long du corps paumes au sol ou mains sous les fessiers. Rétroversion du bassin, côtes basses.","exe":"1. Active le transverse et plaque les lombaires au tapis · 2. Monte les jambes jusqu’à 90° en 2 s · 3. Descends en 3 s seulement tant que le dos reste plaqué · 4. Recommence sans toucher le sol","resp":"Expire en montant, inspire pendant la descente contrôlée.","err":"Dos qui se cambre en descendant : arrête-toi plus haut ou fléchis les genoux · Élan : pause en haut · Nuque tendue : pose la tête détendue","mus":"Grand droit de l’abdomen, transverse de l’abdomen, ilio-psoas, droit fémoral, obliques"}},"birddog_easy":{"es":{"d":"Cuadrupedia con extensión alterna de un solo segmento (brazo o pierna), con columna neutra y pelvis estable; control antirrotación básico.","v":"Espalda neutra. Brazo largo y vuelve. Luego la pierna.","pos":"A cuatro patas, manos bajo los hombros y rodillas bajo la cadera. Columna neutra, mirada al suelo y transverso activado.","exe":"1. Extiende un brazo al frente a la altura del hombro en 2 s y vuelve · 2. Extiende la pierna contraria atrás, a la altura de la cadera, en 2 s y vuelve · 3. Alterna lados sin mover la pelvis","resp":"Exhala al extender, inhala al volver.","err":"Lumbar que se hunde: no subas la pierna por encima de la cadera · Cadera que rota: pelvis paralela al suelo · Hombros hundidos: empuja el suelo con la mano de apoyo","mus":"Erectores espinales, multífidos, glúteo mayor, transverso del abdomen, oblicuos, deltoides"},"en":{"d":"All-fours position extending one limb at a time (arm or leg), with neutral spine and stable pelvis; basic anti-rotation control.","v":"Neutral spine. Long arm, return. Then the leg.","pos":"On all fours, hands under shoulders and knees under hips. Neutral spine, gaze at the floor, transverse abdominis braced.","exe":"1. Reach one arm forward to shoulder height in 2 s and return · 2. Extend the opposite leg back to hip height in 2 s and return · 3. Alternate sides without moving your pelvis","resp":"Exhale as you extend, inhale as you return.","err":"Lower back sagging: don’t lift the leg above hip height · Hips rotating: keep your pelvis parallel to the floor · Shoulders sinking: push the floor with your support hand","mus":"Erector spinae, multifidus, gluteus maximus, transverse abdominis, obliques, deltoids"},"fr":{"d":"Quadrupédie avec extension alternée d’un seul membre (bras ou jambe), colonne neutre et bassin stable ; contrôle anti-rotation de base.","v":"Dos neutre. Bras long, reviens. Puis la jambe.","pos":"À quatre pattes, mains sous les épaules et genoux sous les hanches. Colonne neutre, regard vers le sol, transverse activé.","exe":"1. Tends un bras devant à hauteur d’épaule en 2 s et reviens · 2. Tends la jambe opposée derrière à hauteur de hanche en 2 s et reviens · 3. Alterne sans bouger le bassin","resp":"Expire en tendant, inspire en revenant.","err":"Dos qui se creuse : ne monte pas la jambe au-dessus de la hanche · Bassin qui tourne : garde-le parallèle au sol · Épaules enfoncées : repousse le sol avec la main d’appui","mus":"Érecteurs du rachis, multifides, grand fessier, transverse de l’abdomen, obliques, deltoïdes"}},"birddog":{"es":{"d":"Extensión simultánea de brazo y pierna contraria en cuadrupedia, con columna neutra y control antirrotación y antiextensión.","v":"Brazo y pierna contraria largos, pelvis quieta.","pos":"A cuatro patas, manos bajo los hombros y rodillas bajo la cadera. Columna neutra, mirada al suelo y transverso activado.","exe":"1. Activa el transverso · 2. Extiende a la vez un brazo al frente y la pierna contraria atrás en 2 s · 3. Pausa 1 s en línea · 4. Vuelve en 2 s y alterna","resp":"Exhala al extender, inhala al volver.","err":"Lumbar que se hunde: pierna solo a la altura de la cadera · Cadera que rota: pelvis paralela al suelo · Prisa: respeta el tempo 2-1-2","mus":"Erectores espinales, multífidos, glúteo mayor, transverso del abdomen, oblicuos, deltoides"},"en":{"d":"Simultaneous extension of one arm and the opposite leg on all fours, with neutral spine and anti-rotation and anti-extension control.","v":"Opposite arm and leg long, pelvis still.","pos":"On all fours, hands under shoulders and knees under hips. Neutral spine, gaze at the floor, transverse abdominis braced.","exe":"1. Brace your transverse abdominis · 2. Reach one arm forward and the opposite leg back together in 2 s · 3. Pause 1 s in line · 4. Return in 2 s and alternate","resp":"Exhale as you extend, inhale as you return.","err":"Lower back sagging: leg only to hip height · Hips rotating: keep your pelvis parallel to the floor · Rushing: keep the 2-1-2 tempo","mus":"Erector spinae, multifidus, gluteus maximus, transverse abdominis, obliques, deltoids"},"fr":{"d":"Extension simultanée d’un bras et de la jambe opposée à quatre pattes, colonne neutre, contrôle anti-rotation et anti-extension.","v":"Bras et jambe opposée longs, bassin immobile.","pos":"À quatre pattes, mains sous les épaules et genoux sous les hanches. Colonne neutre, regard vers le sol, transverse activé.","exe":"1. Active le transverse · 2. Tends ensemble un bras devant et la jambe opposée derrière en 2 s · 3. Pause 1 s alignée · 4. Reviens en 2 s et alterne","resp":"Expire en tendant, inspire en revenant.","err":"Dos qui se creuse : jambe seulement à hauteur de hanche · Bassin qui tourne : garde-le parallèle au sol · Précipitation : respecte le tempo 2-1-2","mus":"Érecteurs du rachis, multifides, grand fessier, transverse de l’abdomen, obliques, deltoïdes"}},"birddog_crunch":{"es":{"d":"Perro de caza con transición de extensión a flexión: codo y rodilla contrarios se juntan bajo el tronco con flexión torácica controlada.","v":"Estira largo, codo a rodilla bajo el cuerpo.","pos":"A cuatro patas, manos bajo los hombros y rodillas bajo la cadera. Columna neutra, mirada al suelo y transverso activado.","exe":"1. Extiende brazo y pierna contraria en 2 s · 2. Pausa 1 s en línea · 3. Lleva codo y rodilla bajo el cuerpo redondeando la espalda en 2 s · 4. Haz la mitad de repeticiones y cambia de lado","resp":"Inhala al extender, exhala al juntar codo y rodilla.","err":"Perder el equilibrio: ve más lenta y ancla la mano de apoyo · Lumbar hundida al extender: pierna a la altura de la cadera · Cadera que rota: pelvis paralela al suelo","mus":"Recto abdominal, oblicuos, erectores espinales, glúteo mayor, transverso del abdomen"},"en":{"d":"Bird dog moving from extension to flexion: opposite elbow and knee meet under your trunk with controlled thoracic flexion.","v":"Reach long, elbow to knee under your body.","pos":"On all fours, hands under shoulders and knees under hips. Neutral spine, gaze at the floor, transverse abdominis braced.","exe":"1. Extend the arm and opposite leg in 2 s · 2. Pause 1 s in line · 3. Bring elbow and knee together under your body, rounding your back, in 2 s · 4. Do half the reps and switch sides","resp":"Inhale as you extend, exhale as elbow meets knee.","err":"Losing balance: slow down and anchor your support hand · Back sagging on the reach: leg only to hip height · Hips rotating: keep your pelvis parallel to the floor","mus":"Rectus abdominis, obliques, erector spinae, gluteus maximus, transverse abdominis"},"fr":{"d":"Bird dog avec passage de l’extension à la flexion : coude et genou opposés se rejoignent sous le tronc, flexion thoracique contrôlée.","v":"Tends long, coude vers genou sous le corps.","pos":"À quatre pattes, mains sous les épaules et genoux sous les hanches. Colonne neutre, regard vers le sol, transverse activé.","exe":"1. Tends le bras et la jambe opposée en 2 s · 2. Pause 1 s alignée · 3. Ramène coude et genou sous le corps en arrondissant le dos en 2 s · 4. Fais la moitié des répétitions puis change de côté","resp":"Inspire en tendant, expire en rapprochant coude et genou.","err":"Perte d’équilibre : ralentis et ancre la main d’appui · Dos creusé en extension : jambe à hauteur de hanche · Bassin qui tourne : garde-le parallèle au sol","mus":"Grand droit de l’abdomen, obliques, érecteurs du rachis, grand fessier, transverse de l’abdomen"}},"hollow_tuck":{"es":{"d":"Isometría de barquito con rodillas recogidas: palanca corta, retroversión pélvica y zona lumbar en contacto con la esterilla.","v":"Lumbar pegada, costillas abajo. Respira y aguanta.","pos":"Boca arriba, rodillas dobladas sobre la cadera, cabeza y escápulas despegadas y brazos estirados junto a los muslos. Lumbar en contacto con la esterilla.","exe":"1. Haz retroversión pélvica y pega la lumbar · 2. Despega cabeza y escápulas con las costillas abajo · 3. Recoge las rodillas sobre la cadera · 4. Aguanta el tiempo indicado respirando","resp":"Respiración corta y continua, sin apnea; exhala a fondo para bajar las costillas.","err":"Lumbar que se despega: acerca las rodillas al pecho · Cuello tenso: mirada a las rodillas, barbilla algo metida · Aguantar el aire: respira de forma rítmica","mus":"Recto abdominal, transverso del abdomen, oblicuos, psoas ilíaco"},"en":{"d":"Tuck hollow hold: short lever, posterior pelvic tilt and lower back in contact with the mat.","v":"Back flat, ribs down. Breathe and hold.","pos":"Lie on your back, knees bent over your hips, head and shoulder blades lifted, arms straight alongside your thighs. Lower back in contact with the mat.","exe":"1. Tilt your pelvis back and press your lower back down · 2. Lift head and shoulder blades, ribs down · 3. Tuck knees over your hips · 4. Hold for the set time while breathing","resp":"Short, steady breaths, never hold your breath; exhale fully to draw the ribs down.","err":"Lower back lifting: bring knees closer to your chest · Tense neck: gaze at your knees, chin slightly tucked · Holding your breath: breathe rhythmically","mus":"Rectus abdominis, transverse abdominis, obliques, iliopsoas"},"fr":{"d":"Hollow hold groupé : levier court, rétroversion du bassin et lombaires au contact du tapis.","v":"Lombaires plaquées, côtes basses. Respire et tiens.","pos":"Allongée sur le dos, genoux fléchis au-dessus des hanches, tête et omoplates décollées, bras tendus le long des cuisses. Lombaires au contact du tapis.","exe":"1. Fais une rétroversion du bassin et plaque les lombaires · 2. Décolle tête et omoplates, côtes basses · 3. Ramène les genoux au-dessus des hanches · 4. Tiens le temps indiqué en respirant","resp":"Respiration courte et continue, sans apnée ; expire à fond pour abaisser les côtes.","err":"Lombaires qui décollent : rapproche les genoux de la poitrine · Nuque tendue : regard vers les genoux, menton légèrement rentré · Apnée : respire en rythme","mus":"Grand droit de l’abdomen, transverse de l’abdomen, obliques, ilio-psoas"}},"hollow":{"es":{"d":"Isometría antiextensión con brazos por encima de la cabeza y piernas extendidas despegadas, con retroversión pélvica y lumbar en contacto con la esterilla.","v":"Cuerpo en barca, lumbar pegada, costillas abajo. Aguanta.","pos":"Boca arriba, brazos extendidos por encima de la cabeza y piernas juntas y estiradas. Cabeza, escápulas, brazos y piernas despegados unos centímetros.","exe":"1. Haz retroversión pélvica y pega la lumbar · 2. Despega cabeza y escápulas con los brazos junto a las orejas · 3. Eleva las piernas estiradas a la altura en que la lumbar siga pegada · 4. Aguanta respirando","resp":"Respiración corta y continua, sin apnea; exhala a fondo para bajar las costillas.","err":"Lumbar arqueada: sube más las piernas o lleva los brazos hacia los muslos · Costillas abiertas: exhala y bájalas · Cuello tenso: barbilla algo metida","mus":"Recto abdominal, transverso del abdomen, oblicuos, psoas ilíaco, recto femoral"},"en":{"d":"Anti-extension hold with arms overhead and straight legs lifted, with a posterior pelvic tilt and lower back in contact with the mat.","v":"Hollow shape, back flat, ribs down. Hold.","pos":"Lie on your back, arms straight overhead, legs together and straight. Head, shoulder blades, arms and legs lifted a few centimetres off the mat.","exe":"1. Tilt your pelvis back and press your lower back down · 2. Lift head and shoulder blades, arms by your ears · 3. Lift straight legs to the height where your back stays flat · 4. Hold while breathing","resp":"Short, steady breaths, never hold your breath; exhale fully to draw the ribs down.","err":"Back arching: raise the legs higher or bring arms toward your thighs · Ribs flaring: exhale and draw them down · Tense neck: chin slightly tucked","mus":"Rectus abdominis, transverse abdominis, obliques, iliopsoas, rectus femoris"},"fr":{"d":"Gainage anti-extension, bras au-dessus de la tête et jambes tendues décollées, avec rétroversion du bassin et lombaires au contact du tapis.","v":"Corps en barque, lombaires plaquées, côtes basses. Tiens.","pos":"Allongée sur le dos, bras tendus au-dessus de la tête, jambes serrées et tendues. Tête, omoplates, bras et jambes décollés de quelques centimètres.","exe":"1. Fais une rétroversion du bassin et plaque les lombaires · 2. Décolle tête et omoplates, bras près des oreilles · 3. Monte les jambes tendues à la hauteur où le dos reste plaqué · 4. Tiens en respirant","resp":"Respiration courte et continue, sans apnée ; expire à fond pour abaisser les côtes.","err":"Dos cambré : monte les jambes ou ramène les bras vers les cuisses · Côtes ouvertes : expire et abaisse-les · Nuque tendue : menton légèrement rentré","mus":"Grand droit de l’abdomen, transverse de l’abdomen, obliques, ilio-psoas, droit fémoral"}},"hollowrock":{"es":{"d":"Balanceo en posición de barquito: la forma se mantiene rígida y el cuerpo oscila en bloque, sin flexionar la cadera ni despegar la lumbar.","v":"Barca rígida, balancéate sin romper la forma.","pos":"En posición de barquito: retroversión pélvica, lumbar en contacto con la esterilla, brazos junto a las orejas, piernas estiradas y despegadas, costillas abajo.","exe":"1. Establece el barquito con la lumbar pegada · 2. Balancéate hacia la cabeza en 1 s sin cambiar el ángulo · 3. Balancéate hacia los pies en 1 s · 4. Sigue a ritmo constante; si se rompe la forma, aguanta quieta","resp":"Respiración corta y rítmica acompañando el balanceo, sin apnea.","err":"Doblar la cadera al balancear: brazos y piernas fijos · Lumbar que se despega: reduce la amplitud o pasa al barquito estático · Impulso con brazos o piernas: mueve el cuerpo en bloque","mus":"Recto abdominal, transverso del abdomen, oblicuos, psoas ilíaco, recto femoral"},"en":{"d":"Rocking in the hollow position: the shape stays rigid and your body rocks as one unit, without bending at the hips or lifting the lower back.","v":"Rigid hollow, rock without breaking the shape.","pos":"In the hollow position: posterior pelvic tilt, lower back in contact with the mat, arms by your ears, legs straight and lifted, ribs down.","exe":"1. Set the hollow with your lower back flat · 2. Rock toward your head in 1 s without changing the angle · 3. Rock toward your feet in 1 s · 4. Keep a steady rhythm; if the shape breaks, switch to a still hold","resp":"Short, rhythmic breaths with the rocking, never hold your breath.","err":"Hips bending as you rock: lock arms and legs · Lower back lifting: reduce the range or go back to the static hollow · Swinging arms or legs: move the body as one unit","mus":"Rectus abdominis, transverse abdominis, obliques, iliopsoas, rectus femoris"},"fr":{"d":"Balancier en position hollow : la forme reste rigide et le corps oscille d’un bloc, sans plier les hanches ni décoller les lombaires.","v":"Barque rigide, balance-toi sans casser la forme.","pos":"En position hollow : rétroversion du bassin, lombaires au contact du tapis, bras près des oreilles, jambes tendues et décollées, côtes basses.","exe":"1. Installe le hollow, lombaires plaquées · 2. Bascule vers la tête en 1 s sans changer l’angle · 3. Bascule vers les pieds en 1 s · 4. Garde un rythme régulier ; si la forme casse, tiens immobile","resp":"Respiration courte et rythmée avec le balancier, sans apnée.","err":"Hanches qui plient : bras et jambes verrouillés · Lombaires qui décollent : réduis l’amplitude ou reviens au hollow statique · Élan des bras ou jambes : bouge d’un seul bloc","mus":"Grand droit de l’abdomen, transverse de l’abdomen, obliques, ilio-psoas, droit fémoral"}},"swimming":{"es":{"d":"Extensión de cadera y hombro alterna en decúbito prono: elevas brazo y pierna contrarios con el tronco estable, glúteos activos y cuello en neutro.","v":"Brazo y pierna contraria, glúteo firme, mirada al suelo.","pos":"Tumbada boca abajo, brazos estirados al frente a la anchura de los hombros, piernas juntas y estiradas, frente a un par de centímetros del suelo, mirada al suelo.","exe":"1. Activa abdomen y glúteos, hombros lejos de las orejas · 2. Eleva brazo derecho y pierna izquierda unos centímetros en 1 s · 3. Baja en 1 s sin apoyar del todo · 4. Alterna al otro lado con ritmo controlado.","resp":"Respira de forma continua: exhala en cada elevación, sin bloquear el aire.","err":"Subir la cabeza: mantén la mirada al suelo · Rotar la cadera: los dos huesos de la cadera siguen apoyados · Arquear la lumbar: aprieta glúteos y sube menos.","mus":"Erectores espinales, glúteo mayor, isquiotibiales, deltoides posterior, trapecio inferior"},"en":{"d":"Alternating hip and shoulder extension lying prone: lift the opposite arm and leg with a stable trunk, glutes engaged and neck neutral.","v":"Opposite arm and leg, glutes firm, eyes on the floor.","pos":"Lie face down, arms extended in front shoulder-width apart, legs long and together, forehead just off the floor, eyes on the floor.","exe":"1. Brace your abs and glutes, shoulders away from ears · 2. Lift right arm and left leg a few cm in 1 s · 3. Lower in 1 s without fully resting · 4. Switch sides at a controlled pace.","resp":"Breathe continuously: exhale on each lift, never hold your breath.","err":"Lifting the head: keep eyes on the floor · Rolling the hips: keep both hip bones down · Arching the low back: squeeze glutes and lift less.","mus":"Erector spinae, gluteus maximus, hamstrings, posterior deltoid, lower trapezius"},"fr":{"d":"Extension alternée de hanche et d’épaule à plat ventre : tu lèves bras et jambe opposés, tronc stable, fessiers actifs et nuque neutre.","v":"Bras et jambe opposés, fessiers serrés, regard au sol.","pos":"Allongée à plat ventre, bras tendus devant à largeur d’épaules, jambes tendues et serrées, front à quelques centimètres du sol, regard au sol.","exe":"1. Gaine abdos et fessiers, épaules loin des oreilles · 2. Lève bras droit et jambe gauche de quelques cm en 1 s · 3. Redescends en 1 s sans relâcher · 4. Alterne à rythme contrôlé.","resp":"Respire en continu : expire à chaque élévation, sans bloquer l’air.","err":"Relever la tête : garde le regard au sol · Basculer le bassin : les deux hanches restent au sol · Cambrer : serre les fessiers et monte moins haut.","mus":"Érecteurs du rachis, grand fessier, ischio-jambiers, deltoïde postérieur, trapèze inférieur"}},"superman":{"es":{"d":"Extensión torácica y de cadera simultánea en decúbito prono, con retracción escapular, glúteos activos para proteger la lumbar y cuello en neutro.","v":"Sube todo, aprieta glúteos, 1 segundo arriba, baja.","pos":"Tumbada boca abajo, brazos estirados al frente, piernas juntas y estiradas, empeines en el suelo, mirada al suelo y abdomen ligeramente activo.","exe":"1. Aprieta glúteos y lleva las escápulas atrás y abajo · 2. Eleva brazos, pecho y piernas un palmo en 1 s · 3. Mantén 1 s arriba · 4. Baja en 2 s controlando.","resp":"Exhala al subir, inhala al bajar.","err":"Echar la cabeza atrás: mirada al suelo · Subir con impulso: sube y baja lento · Dolor lumbar: aprieta más los glúteos y reduce la altura.","mus":"Erectores espinales, glúteo mayor, isquiotibiales, trapecio medio e inferior, romboides"},"en":{"d":"Simultaneous thoracic and hip extension lying prone, with scapular retraction, glutes engaged to protect the low back and neck neutral.","v":"Lift everything, squeeze glutes, 1 second up, lower.","pos":"Lie face down, arms extended in front, legs long and together, tops of feet on the floor, eyes on the floor, abs lightly engaged.","exe":"1. Squeeze glutes and draw shoulder blades back and down · 2. Lift arms, chest and legs a hand-width in 1 s · 3. Hold 1 s · 4. Lower in 2 s with control.","resp":"Exhale as you lift, inhale as you lower.","err":"Throwing the head back: eyes on the floor · Using momentum: lift and lower slowly · Low-back pain: squeeze glutes harder and lift less.","mus":"Erector spinae, gluteus maximus, hamstrings, middle and lower trapezius, rhomboids"},"fr":{"d":"Extension thoracique et de hanche simultanée à plat ventre, avec rétraction scapulaire, fessiers actifs pour protéger les lombaires et nuque neutre.","v":"Tout en haut, fessiers serrés, 1 seconde, redescends.","pos":"Allongée à plat ventre, bras tendus devant, jambes tendues et serrées, dessus des pieds au sol, regard au sol, abdos légèrement gainés.","exe":"1. Serre les fessiers, omoplates vers l’arrière et le bas · 2. Lève bras, buste et jambes d’un empan en 1 s · 3. Tiens 1 s · 4. Redescends en 2 s en contrôlant.","resp":"Expire en montant, inspire en descendant.","err":"Rejeter la tête en arrière : regard au sol · Monter avec élan : monte et descends lentement · Gêne lombaire : serre plus les fessiers et monte moins.","mus":"Érecteurs du rachis, grand fessier, ischio-jambiers, trapèze moyen et inférieur, rhomboïdes"}},"supermanhold":{"es":{"d":"Isometría en extensión torácica y de cadera en decúbito prono, con escápulas retraídas y deprimidas, glúteos activos y cuello en neutro.","v":"Arriba, glúteos firmes, hombros lejos de las orejas. Respira.","pos":"Tumbada boca abajo, brazos estirados al frente, piernas juntas y estiradas, mirada al suelo y abdomen activo.","exe":"1. Aprieta glúteos y lleva las escápulas atrás y abajo · 2. Eleva brazos, pecho y piernas en 2 s a una altura que puedas sostener · 3. Mantén el tiempo indicado sin perder altura · 4. Baja en 2 s.","resp":"Respiración corta y continua durante la isometría, sin apnea.","err":"Aguantar la respiración: respira por la nariz · Subir demasiado: poca altura y bien sostenida · Encoger hombros: bájalos lejos de las orejas.","mus":"Erectores espinales, glúteo mayor, isquiotibiales, trapecio medio e inferior, deltoides posterior"},"en":{"d":"Isometric thoracic and hip extension hold lying prone, shoulder blades retracted and depressed, glutes engaged and neck neutral.","v":"Up, glutes firm, shoulders away from ears. Breathe.","pos":"Lie face down, arms extended in front, legs long and together, eyes on the floor, abs engaged.","exe":"1. Squeeze glutes, draw shoulder blades back and down · 2. Lift arms, chest and legs in 2 s to a height you can sustain · 3. Hold for the set time without sinking · 4. Lower in 2 s.","resp":"Short, steady breaths throughout the hold; never hold your breath.","err":"Holding your breath: breathe through the nose · Lifting too high: less height, well held · Shrugging: pull shoulders away from ears.","mus":"Erector spinae, gluteus maximus, hamstrings, middle and lower trapezius, posterior deltoid"},"fr":{"d":"Maintien isométrique en extension thoracique et de hanche à plat ventre, omoplates serrées et abaissées, fessiers actifs et nuque neutre.","v":"En haut, fessiers serrés, épaules loin des oreilles. Respire.","pos":"Allongée à plat ventre, bras tendus devant, jambes tendues et serrées, regard au sol, abdos gainés.","exe":"1. Serre les fessiers, omoplates vers l’arrière et le bas · 2. Lève bras, buste et jambes en 2 s à une hauteur tenable · 3. Tiens le temps indiqué sans t’affaisser · 4. Redescends en 2 s.","resp":"Respiration courte et continue pendant le maintien, sans apnée.","err":"Bloquer la respiration : respire par le nez · Monter trop haut : moins haut mais bien tenu · Hausser les épaules : éloigne-les des oreilles.","mus":"Érecteurs du rachis, grand fessier, ischio-jambiers, trapèze moyen et inférieur, deltoïde postérieur"}},"proneY":{"es":{"d":"Elevación de brazos en Y en decúbito prono con retracción y depresión escapular, pulgares arriba y cuello en neutro; trabaja la postura de la parte alta de la espalda.","v":"Pulgares arriba, escápulas atrás y abajo, sube en Y.","pos":"Tumbada boca abajo, brazos estirados en Y a unos 45° de la cabeza, pulgares hacia arriba, frente cerca del suelo, piernas estiradas y glúteos activos.","exe":"1. Lleva las escápulas atrás y abajo · 2. Eleva los brazos en Y en 1 s sin subir el pecho de más · 3. Pausa breve arriba · 4. Baja en 2 s.","resp":"Exhala al elevar los brazos, inhala al bajar.","err":"Encoger hombros: bájalos lejos de las orejas · Levantar la cabeza: mirada al suelo · Arquear la lumbar: aprieta glúteos, el movimiento es de brazos y escápulas.","mus":"Trapecio inferior y medio, deltoides posterior, romboides, infraespinoso, erectores torácicos"},"en":{"d":"Prone Y arm raise with scapular retraction and depression, thumbs up and neck neutral; builds upper-back posture strength.","v":"Thumbs up, shoulder blades back and down, lift into a Y.","pos":"Lie face down, arms extended in a Y about 45° from your head, thumbs pointing up, forehead near the floor, legs long and glutes engaged.","exe":"1. Draw shoulder blades back and down · 2. Lift arms in a Y in 1 s without overlifting the chest · 3. Brief pause at the top · 4. Lower in 2 s.","resp":"Exhale as you lift the arms, inhale as you lower.","err":"Shrugging: pull shoulders away from ears · Lifting the head: eyes on the floor · Arching the low back: squeeze glutes, move only arms and shoulder blades.","mus":"Lower and middle trapezius, posterior deltoid, rhomboids, infraspinatus, thoracic erectors"},"fr":{"d":"Élévation des bras en Y à plat ventre avec rétraction et abaissement scapulaires, pouces vers le haut et nuque neutre ; renforce la posture du haut du dos.","v":"Pouces en haut, omoplates en arrière et en bas, monte en Y.","pos":"Allongée à plat ventre, bras tendus en Y à environ 45° de la tête, pouces vers le haut, front près du sol, jambes tendues et fessiers actifs.","exe":"1. Omoplates vers l’arrière et le bas · 2. Lève les bras en Y en 1 s sans trop soulever le buste · 3. Courte pause en haut · 4. Redescends en 2 s.","resp":"Expire en levant les bras, inspire en descendant.","err":"Hausser les épaules : éloigne-les des oreilles · Relever la tête : regard au sol · Cambrer : serre les fessiers, seuls bras et omoplates bougent.","mus":"Trapèze inférieur et moyen, deltoïde postérieur, rhomboïdes, infra-épineux, érecteurs thoraciques"}},"proneY_slow":{"es":{"d":"Elevación en Y en decúbito prono con isometría de 2 s arriba: retracción y depresión escapular mantenidas, sin impulso y cuello en neutro.","v":"Sube en Y, aguanta 2 segundos, baja lento.","pos":"Tumbada boca abajo, brazos estirados en Y a unos 45° de la cabeza, pulgares hacia arriba, mirada al suelo, piernas estiradas y glúteos activos.","exe":"1. Escápulas atrás y abajo · 2. Eleva los brazos en Y en 2 s · 3. Mantén 2 s arriba apretando entre las escápulas · 4. Baja en 2 s.","resp":"Exhala al subir, respira suave durante la pausa, inhala al bajar.","err":"Usar impulso: tempo 2-2-2 estricto · Perder la Y arriba: mantén el ángulo de 45° · Encoger hombros: depresión escapular durante toda la pausa.","mus":"Trapecio inferior y medio, romboides, deltoides posterior, infraespinoso, redondo menor"},"en":{"d":"Prone Y raise with a 2 s isometric hold at the top: sustained scapular retraction and depression, no momentum, neck neutral.","v":"Lift into a Y, hold 2 seconds, lower slowly.","pos":"Lie face down, arms extended in a Y about 45° from your head, thumbs up, eyes on the floor, legs long and glutes engaged.","exe":"1. Shoulder blades back and down · 2. Lift arms into a Y in 2 s · 3. Hold 2 s squeezing between the shoulder blades · 4. Lower in 2 s.","resp":"Exhale as you lift, breathe softly during the hold, inhale as you lower.","err":"Using momentum: strict 2-2-2 tempo · Losing the Y at the top: keep the 45° angle · Shrugging: keep shoulders down throughout the hold.","mus":"Lower and middle trapezius, rhomboids, posterior deltoid, infraspinatus, teres minor"},"fr":{"d":"Élévation en Y à plat ventre avec maintien isométrique de 2 s en haut : rétraction et abaissement scapulaires tenus, sans élan, nuque neutre.","v":"Monte en Y, tiens 2 secondes, redescends lentement.","pos":"Allongée à plat ventre, bras tendus en Y à environ 45° de la tête, pouces vers le haut, regard au sol, jambes tendues et fessiers actifs.","exe":"1. Omoplates vers l’arrière et le bas · 2. Lève les bras en Y en 2 s · 3. Tiens 2 s en serrant entre les omoplates · 4. Redescends en 2 s.","resp":"Expire en montant, respire doucement pendant la pause, inspire en descendant.","err":"Prendre de l’élan : tempo 2-2-2 strict · Perdre le Y en haut : garde l’angle de 45° · Hausser les épaules : épaules basses pendant toute la pause.","mus":"Trapèze inférieur et moyen, rhomboïdes, deltoïde postérieur, infra-épineux, petit rond"}},"bear":{"es":{"d":"Isometría en cuadrupedia con rodillas elevadas 2 cm: hombros sobre las muñecas, cadera sobre las rodillas, espalda neutra y abdomen activo.","v":"Rodillas flotando, espalda plana, empuja el suelo.","pos":"A cuatro patas: manos bajo los hombros, rodillas bajo la cadera a la anchura de la cadera, apoyada en las puntas de los pies, espalda plana y mirada al suelo.","exe":"1. Empuja el suelo con las manos y activa el abdomen · 2. Despega las rodillas 2 cm en 1 s · 3. Mantén el tiempo indicado sin mover la espalda · 4. Apoya las rodillas con control.","resp":"Respiración continua y costal, sin soltar el abdomen.","err":"Cadera alta: rodillas solo 2 cm del suelo · Hombros hundidos: empuja el suelo y separa las escápulas · Espalda redonda o arqueada: mantenla plana como una mesa.","mus":"Transverso abdominal, recto abdominal, cuádriceps, deltoides anterior, serrato anterior"},"en":{"d":"Quadruped isometric hold with knees lifted 2 cm: shoulders over wrists, hips over knees, neutral spine and abs braced.","v":"Knees hovering, flat back, push the floor away.","pos":"On all fours: hands under shoulders, knees under hips at hip width, on the balls of your feet, flat back, eyes on the floor.","exe":"1. Push the floor away and brace your abs · 2. Lift knees 2 cm in 1 s · 3. Hold for the set time without moving your back · 4. Lower knees with control.","resp":"Steady rib-cage breathing without releasing the abs.","err":"Hips too high: knees only 2 cm off the floor · Sinking shoulders: push the floor and spread shoulder blades · Rounded or arched back: keep it flat like a table.","mus":"Transverse abdominis, rectus abdominis, quadriceps, anterior deltoid, serratus anterior"},"fr":{"d":"Maintien isométrique à quatre pattes, genoux décollés de 2 cm : épaules au-dessus des poignets, hanches au-dessus des genoux, dos neutre, abdos gainés.","v":"Genoux décollés, dos plat, repousse le sol.","pos":"À quatre pattes : mains sous les épaules, genoux sous les hanches à largeur de bassin, sur la pointe des pieds, dos plat, regard au sol.","exe":"1. Repousse le sol et gaine les abdos · 2. Décolle les genoux de 2 cm en 1 s · 3. Tiens le temps indiqué sans bouger le dos · 4. Repose les genoux en contrôlant.","resp":"Respiration continue et costale, sans relâcher les abdos.","err":"Hanches trop hautes : genoux à 2 cm du sol · Épaules affaissées : repousse le sol, écarte les omoplates · Dos rond ou cambré : garde-le plat comme une table.","mus":"Transverse de l’abdomen, grand droit, quadriceps, deltoïde antérieur, dentelé antérieur"}},"beartap":{"es":{"d":"Posición de oso con toques alternos al hombro contrario: antirrotación del tronco con hombros sobre las muñecas y cadera alineada y quieta.","v":"Rodillas flotando, toca el hombro, cadera quieta.","pos":"Posición de oso: manos bajo los hombros, rodillas bajo la cadera elevadas 2 cm, pies algo más separados que la cadera para ganar estabilidad, espalda plana.","exe":"1. Activa abdomen y glúteos, empuja el suelo · 2. Lleva una mano al hombro contrario en 1 s · 3. Vuelve a apoyarla en 1 s · 4. Alterna sin que la cadera gire.","resp":"Exhala en cada toque, inhala al apoyar la mano.","err":"Balancear la cadera: separa más los pies y ve más lenta · Subir la cadera: rodillas a 2 cm · Hundir el hombro de apoyo: empuja fuerte el suelo.","mus":"Oblicuos, transverso abdominal, serrato anterior, deltoides, cuádriceps"},"en":{"d":"Bear position with alternating opposite-shoulder taps: anti-rotation core work with shoulders over wrists and hips level and still.","v":"Knees hovering, tap the shoulder, hips still.","pos":"Bear position: hands under shoulders, knees under hips lifted 2 cm, feet a bit wider than hips for stability, flat back.","exe":"1. Brace abs and glutes, push the floor away · 2. Bring one hand to the opposite shoulder in 1 s · 3. Place it back in 1 s · 4. Alternate without rotating your hips.","resp":"Exhale on each tap, inhale as the hand returns.","err":"Hips swaying: widen your feet and slow down · Hips rising: keep knees 2 cm up · Sinking into the support shoulder: push the floor hard.","mus":"Obliques, transverse abdominis, serratus anterior, deltoids, quadriceps"},"fr":{"d":"Position de l’ours avec touches alternées à l’épaule opposée : travail anti-rotation du tronc, épaules au-dessus des poignets, bassin aligné et immobile.","v":"Genoux décollés, touche l’épaule, bassin immobile.","pos":"Position de l’ours : mains sous les épaules, genoux sous les hanches décollés de 2 cm, pieds un peu plus écartés que le bassin pour la stabilité, dos plat.","exe":"1. Gaine abdos et fessiers, repousse le sol · 2. Porte une main à l’épaule opposée en 1 s · 3. Repose-la en 1 s · 4. Alterne sans faire tourner le bassin.","resp":"Expire à chaque touche, inspire en reposant la main.","err":"Bassin qui bascule : écarte les pieds et ralentis · Hanches qui montent : genoux à 2 cm · Épaule d’appui affaissée : repousse fort le sol.","mus":"Obliques, transverse de l’abdomen, dentelé antérieur, deltoïdes, quadriceps"}},"swimming_fast":{"es":{"d":"Natación en decúbito prono a tempo rápido: extensión alterna de brazo y pierna contrarios manteniendo la altura, glúteos activos y cuello en neutro.","v":"Ritmo vivo, altura constante, mirada al suelo.","pos":"Tumbada boca abajo, brazos estirados al frente, piernas estiradas, pecho y piernas ligeramente despegados del suelo, mirada al suelo y glúteos activos.","exe":"1. Eleva ligeramente pecho, brazos y piernas · 2. Alterna brazo y pierna contrarios en movimientos cortos y rápidos, unos 2 cambios por segundo · 3. Mantén la misma altura hasta el final.","resp":"Respira de forma rítmica: inhala 4 cambios, exhala 4 cambios.","err":"Perder altura: acorta el recorrido antes de bajar · Cuello en extensión: mirada al suelo · Aguantar el aire: respira con el ritmo.","mus":"Erectores espinales, glúteo mayor, isquiotibiales, deltoides posterior, trapecio inferior"},"en":{"d":"Prone swimming at a fast tempo: alternating opposite arm and leg extension while holding height, glutes engaged and neck neutral.","v":"Quick pace, steady height, eyes on the floor.","pos":"Lie face down, arms extended in front, legs long, chest and legs slightly off the floor, eyes on the floor, glutes engaged.","exe":"1. Lift chest, arms and legs slightly · 2. Alternate opposite arm and leg in short, quick flutters, about 2 switches per second · 3. Keep the same height until the end.","resp":"Breathe rhythmically: inhale for 4 switches, exhale for 4.","err":"Losing height: shorten the range before dropping · Cranking the neck: eyes on the floor · Holding your breath: breathe with the rhythm.","mus":"Erector spinae, gluteus maximus, hamstrings, posterior deltoid, lower trapezius"},"fr":{"d":"Nage à plat ventre à tempo rapide : extension alternée bras et jambe opposés en gardant la hauteur, fessiers actifs et nuque neutre.","v":"Rythme vif, hauteur constante, regard au sol.","pos":"Allongée à plat ventre, bras tendus devant, jambes tendues, buste et jambes légèrement décollés, regard au sol, fessiers actifs.","exe":"1. Décolle légèrement buste, bras et jambes · 2. Alterne bras et jambe opposés en battements courts et rapides, environ 2 par seconde · 3. Garde la même hauteur jusqu’à la fin.","resp":"Respire en rythme : inspire sur 4 battements, expire sur 4.","err":"Perdre la hauteur : réduis l’amplitude avant de retomber · Nuque en extension : regard au sol · Bloquer l’air : respire avec le rythme.","mus":"Érecteurs du rachis, grand fessier, ischio-jambiers, deltoïde postérieur, trapèze inférieur"}},"climber_slow":{"es":{"d":"Flexión de cadera alterna desde plancha alta a tempo lento: hombros sobre las muñecas, cadera alineada y abdomen activo sin rotar la pelvis.","v":"Rodilla al pecho lenta, hombros sobre las manos.","pos":"Plancha alta: manos bajo los hombros, brazos estirados, cuerpo en línea de cabeza a talones, pies a la anchura de la cadera, glúteos y abdomen activos.","exe":"1. Lleva una rodilla hacia el pecho en 2 s · 2. Pausa breve con la cadera quieta · 3. Devuelve el pie atrás en 2 s · 4. Alterna.","resp":"Exhala al llevar la rodilla al pecho, inhala al volver.","err":"Hombros por detrás de las manos: adelántalos sobre las muñecas · Cadera alta o hundida: línea recta, glúteos activos · Rotar la pelvis: ve más lenta.","mus":"Recto abdominal, transverso abdominal, psoas ilíaco, deltoides anterior, serrato anterior"},"en":{"d":"Alternating hip flexion from a high plank at a slow tempo: shoulders over wrists, hips aligned and abs braced without rotating the pelvis.","v":"Knee to chest slowly, shoulders over hands.","pos":"High plank: hands under shoulders, arms straight, body in a line from head to heels, feet hip-width, glutes and abs engaged.","exe":"1. Draw one knee toward your chest in 2 s · 2. Brief pause, hips still · 3. Return the foot in 2 s · 4. Alternate.","resp":"Exhale as the knee comes in, inhale as it returns.","err":"Shoulders behind hands: stack them over wrists · Hips too high or sagging: straight line, glutes on · Rotating the pelvis: slow down.","mus":"Rectus abdominis, transverse abdominis, iliopsoas, anterior deltoid, serratus anterior"},"fr":{"d":"Flexion de hanche alternée en planche haute à tempo lent : épaules au-dessus des poignets, bassin aligné, abdos gainés sans rotation.","v":"Genou à la poitrine lentement, épaules sur les mains.","pos":"Planche haute : mains sous les épaules, bras tendus, corps aligné de la tête aux talons, pieds à largeur de bassin, fessiers et abdos gainés.","exe":"1. Amène un genou vers la poitrine en 2 s · 2. Courte pause, bassin immobile · 3. Ramène le pied en 2 s · 4. Alterne.","resp":"Expire en amenant le genou, inspire en revenant.","err":"Épaules en arrière des mains : place-les au-dessus des poignets · Bassin trop haut ou creusé : ligne droite, fessiers serrés · Rotation du bassin : ralentis.","mus":"Grand droit, transverse de l’abdomen, ilio-psoas, deltoïde antérieur, dentelé antérieur"}},"climber":{"es":{"d":"Flexión de cadera alterna y dinámica desde plancha alta: hombros sobre las muñecas, cadera baja y alineada, abdomen activo y ritmo constante.","v":"Rodillas al pecho, ritmo vivo, cadera baja.","pos":"Plancha alta: manos bajo los hombros, brazos estirados, cuerpo en línea de cabeza a talones, pies a la anchura de la cadera, abdomen y glúteos activos.","exe":"1. Lleva una rodilla al pecho · 2. Cámbiala por la otra con un paso ágil, apoyando la punta del pie · 3. Mantén un ritmo constante, unos 2 cambios por segundo, sin rebotar la cadera.","resp":"Respiración rítmica: exhala cada 2 cambios, sin bloquear el aire.","err":"Cadera arriba: bájala en línea con los hombros · Hombros atrasados: sobre las muñecas · Rebotar: pasos más cortos y ligeros.","mus":"Recto abdominal, transverso abdominal, psoas ilíaco, cuádriceps, deltoides anterior"},"en":{"d":"Dynamic alternating hip flexion from a high plank: shoulders over wrists, hips low and aligned, abs braced and a steady rhythm.","v":"Knees to chest, quick pace, hips low.","pos":"High plank: hands under shoulders, arms straight, body in a line from head to heels, feet hip-width, abs and glutes engaged.","exe":"1. Drive one knee to your chest · 2. Switch legs with a light step, landing on the ball of the foot · 3. Keep a steady pace, about 2 switches per second, without bouncing the hips.","resp":"Rhythmic breathing: exhale every 2 switches, never hold your breath.","err":"Hips up: lower them in line with the shoulders · Shoulders behind: stack over wrists · Bouncing: shorter, lighter steps.","mus":"Rectus abdominis, transverse abdominis, iliopsoas, quadriceps, anterior deltoid"},"fr":{"d":"Flexion de hanche alternée et dynamique en planche haute : épaules au-dessus des poignets, bassin bas et aligné, abdos gainés, rythme régulier.","v":"Genoux à la poitrine, rythme vif, bassin bas.","pos":"Planche haute : mains sous les épaules, bras tendus, corps aligné de la tête aux talons, pieds à largeur de bassin, abdos et fessiers gainés.","exe":"1. Amène un genou à la poitrine · 2. Change de jambe d’un pas léger, sur la pointe du pied · 3. Garde un rythme régulier, environ 2 changements par seconde, sans rebond du bassin.","resp":"Respiration rythmée : expire tous les 2 changements, sans bloquer l’air.","err":"Bassin trop haut : aligne-le avec les épaules · Épaules en arrière : au-dessus des poignets · Rebonds : pas plus courts et légers.","mus":"Grand droit, transverse de l’abdomen, ilio-psoas, quadriceps, deltoïde antérieur"}},"burpee_step":{"es":{"d":"Burpee sin impacto: sentadilla a apoyo de manos, paso atrás a plancha alta alineada, regreso paso a paso y extensión completa de cadera.","v":"Manos al suelo, pie atrás, pie atrás, vuelve y arriba.","pos":"De pie, pies a la anchura de la cadera, brazos relajados, tronco erguido y abdomen activo.","exe":"1. Flexiona cadera y rodillas y apoya las manos bajo los hombros · 2. Lleva un pie y luego el otro atrás a plancha · 3. Vuelve paso a paso con los pies cerca de las manos · 4. Ponte de pie extendiendo la cadera.","resp":"Exhala al bajar a plancha y al subir; inhala en las transiciones.","err":"Cadera hundida en la plancha: activa glúteos y abdomen · Redondear la espalda al agacharte: flexiona más las rodillas · Ir con prisa: controla cada paso.","mus":"Cuádriceps, glúteo mayor, recto abdominal, deltoides anterior, pectoral mayor"},"en":{"d":"Low-impact burpee: squat down to hand support, step back to an aligned high plank, step back in and fully extend the hips.","v":"Hands down, step back, step back, return and stand.","pos":"Stand with feet hip-width, arms relaxed, torso tall and abs engaged.","exe":"1. Bend hips and knees and place hands under shoulders · 2. Step one foot, then the other, back to plank · 3. Step back in, feet near hands · 4. Stand up by extending your hips.","resp":"Exhale stepping into plank and standing up; inhale on the transitions.","err":"Sagging hips in plank: brace glutes and abs · Rounding the back when squatting: bend knees more · Rushing: control each step.","mus":"Quadriceps, gluteus maximus, rectus abdominis, anterior deltoid, pectoralis major"},"fr":{"d":"Burpee sans impact : squat jusqu’à l’appui des mains, pas en arrière en planche haute alignée, retour pas à pas et extension complète des hanches.","v":"Mains au sol, pied en arrière, l’autre, reviens et debout.","pos":"Debout, pieds à largeur de bassin, bras relâchés, buste droit et abdos gainés.","exe":"1. Fléchis hanches et genoux, mains sous les épaules · 2. Recule un pied puis l’autre en planche · 3. Reviens pas à pas, pieds près des mains · 4. Relève-toi en tendant les hanches.","resp":"Expire en passant en planche et en te relevant ; inspire dans les transitions.","err":"Bassin creusé en planche : gaine fessiers et abdos · Dos rond en t’accroupissant : plie plus les genoux · Aller trop vite : contrôle chaque pas.","mus":"Quadriceps, grand fessier, grand droit, deltoïde antérieur, grand pectoral"}},"burpee":{"es":{"d":"Burpee completo: sentadilla, salto atrás a plancha alta alineada, retorno de los pies a las manos y salto vertical con aterrizaje suave y amortiguado.","v":"Abajo, plancha, pies a las manos, salta y aterriza suave.","pos":"De pie, pies a la anchura de la cadera, brazos relajados, tronco erguido y abdomen activo.","exe":"1. Agáchate y apoya las manos bajo los hombros · 2. Salta atrás a plancha con cadera alineada · 3. Salta con los pies junto a las manos · 4. Salta vertical con brazos arriba y aterriza en la punta del pie flexionando rodillas.","resp":"Exhala al saltar a plancha y en el salto vertical; inhala al agacharte.","err":"Aterrizar rígida: amortigua con rodillas y cadera · Cadera hundida en la plancha: abdomen y glúteos activos · Perder la técnica por cansancio: quita el salto final.","mus":"Cuádriceps, glúteo mayor, gemelos, recto abdominal, deltoides anterior, pectoral mayor"},"en":{"d":"Full burpee: squat, jump back to an aligned high plank, jump feet to hands and jump up, landing softly and absorbing the impact.","v":"Down, plank, feet to hands, jump and land softly.","pos":"Stand with feet hip-width, arms relaxed, torso tall and abs engaged.","exe":"1. Squat and place hands under shoulders · 2. Jump back to plank with hips aligned · 3. Jump feet next to hands · 4. Jump up reaching overhead and land on the balls of your feet, knees bent.","resp":"Exhale jumping to plank and on the vertical jump; inhale as you squat.","err":"Landing stiff: absorb with knees and hips · Sagging hips in plank: brace abs and glutes · Form breaking down when tired: drop the final jump.","mus":"Quadriceps, gluteus maximus, calves, rectus abdominis, anterior deltoid, pectoralis major"},"fr":{"d":"Burpee complet : squat, saut en planche haute alignée, retour des pieds vers les mains et saut vertical avec réception souple et amortie.","v":"En bas, planche, pieds aux mains, saute et atterris en douceur.","pos":"Debout, pieds à largeur de bassin, bras relâchés, buste droit et abdos gainés.","exe":"1. Accroupis-toi, mains sous les épaules · 2. Saute en planche, bassin aligné · 3. Ramène les pieds près des mains d’un saut · 4. Saute bras en haut et réceptionne-toi sur l’avant des pieds, genoux fléchis.","resp":"Expire en sautant en planche et lors du saut vertical ; inspire en t’accroupissant.","err":"Réception raide : amortis avec genoux et hanches · Bassin creusé en planche : gaine abdos et fessiers · Technique qui se dégrade : supprime le saut final.","mus":"Quadriceps, grand fessier, mollets, grand droit, deltoïde antérieur, grand pectoral"}},"childpose":{"es":{"d":"Estiramiento estático sostenido de la musculatura extensora de la espalda y la cadera en flexión, con respiración diafragmática dirigida a la zona posterior del tronco.","v":"Glúteos a los talones, frente al suelo, respira hacia la espalda.","pos":"De rodillas sobre la esterilla, dedos de los pies juntos y rodillas a la anchura de la cadera o más abiertas. Siéntate sobre los talones.","exe":"1. Desliza las manos hacia delante hasta estirar los brazos · 2. Apoya la frente en la esterilla · 3. Deja caer los glúteos hacia los talones · 4. Relaja hombros y cuello y mantén.","resp":"Respiración diafragmática: al inhalar expande costillas y espalda; exhala largo para hundirte un poco más.","err":"Glúteos lejos de los talones: abre más las rodillas · Hombros tensos hacia las orejas: suéltalos hacia la cadera · Contener el aire: exhala lento y largo.","mus":"Erector de la columna, dorsal ancho, glúteo mayor, cuadrado lumbar, fascia toracolumbar"},"en":{"d":"Sustained static stretch of the back extensors and hips in flexion, with diaphragmatic breathing directed into the posterior trunk.","v":"Hips to heels, forehead down, breathe into your back.","pos":"Kneel on the mat with big toes together and knees hip-width or wider apart. Sit back on your heels.","exe":"1. Walk your hands forward until your arms are long · 2. Rest your forehead on the mat · 3. Let your hips sink toward your heels · 4. Relax shoulders and neck and hold.","resp":"Diaphragmatic breathing: inhale to expand ribs and back; exhale slowly to sink a little deeper.","err":"Hips far from heels: widen your knees · Shoulders creeping to ears: draw them toward your hips · Holding your breath: exhale long and slow.","mus":"Erector spinae, latissimus dorsi, gluteus maximus, quadratus lumborum, thoracolumbar fascia"},"fr":{"d":"Étirement statique maintenu des extenseurs du dos et des hanches en flexion, avec respiration diaphragmatique dirigée vers l’arrière du tronc.","v":"Fessiers vers les talons, front au sol, respire dans le dos.","pos":"À genoux sur le tapis, gros orteils joints et genoux écartés à largeur de hanches ou plus. Assieds-toi sur les talons.","exe":"1. Avance les mains jusqu’à tendre les bras · 2. Pose le front sur le tapis · 3. Laisse descendre les fessiers vers les talons · 4. Relâche épaules et nuque et maintiens.","resp":"Respiration diaphragmatique : inspire en ouvrant côtes et dos, expire longuement pour descendre un peu plus.","err":"Fessiers loin des talons : écarte davantage les genoux · Épaules vers les oreilles : relâche-les vers les hanches · Bloquer l’air : expire lentement.","mus":"Érecteurs du rachis, grand dorsal, grand fessier, carré des lombes, fascia thoraco-lombaire"}},"childreach":{"es":{"d":"Movilidad dinámica controlada de cadera y columna: flexión de cadera hacia la postura del niño y regreso a cuadrupedia con columna neutra.","v":"Cadera atrás al exhalar, vuelve a cuatro patas al inhalar.","pos":"A cuatro patas: manos bajo los hombros, rodillas bajo la cadera, columna neutra y mirada al suelo.","exe":"1. Exhala y lleva la cadera hacia los talones sin mover las manos · 2. Pausa 1–2 s con los brazos estirados · 3. Inhala y vuelve despacio a cuadrupedia · 4. Repite con ritmo lento.","resp":"Exhala al llevar la cadera atrás, inhala al volver. Ritmo lento y continuo.","err":"Moverte rápido o con rebote: ve lento y controlado · Hundir la zona lumbar al volver: mantén columna neutra · Forzar el rango: para donde notes tensión suave.","mus":"Glúteo mayor, erector de la columna, dorsal ancho, cápsula de cadera, cuádriceps"},"en":{"d":"Controlled dynamic mobility for hips and spine: hip flexion into child’s pose and back to all fours with a neutral spine.","v":"Hips back as you exhale, return to all fours as you inhale.","pos":"On all fours: hands under shoulders, knees under hips, neutral spine, gaze down.","exe":"1. Exhale and send your hips toward your heels without moving your hands · 2. Pause 1–2 s with arms long · 3. Inhale and slowly return to all fours · 4. Repeat at a slow pace.","resp":"Exhale as your hips move back, inhale as you return. Slow, continuous rhythm.","err":"Moving fast or bouncing: go slow and controlled · Sagging lower back on return: keep a neutral spine · Forcing range: stop at gentle tension.","mus":"Gluteus maximus, erector spinae, latissimus dorsi, hip joint capsule, quadriceps"},"fr":{"d":"Mobilité dynamique contrôlée des hanches et du rachis : flexion de hanche vers la posture de l’enfant puis retour à quatre pattes, colonne neutre.","v":"Hanches en arrière à l’expiration, retour à quatre pattes à l’inspiration.","pos":"À quatre pattes : mains sous les épaules, genoux sous les hanches, colonne neutre, regard vers le sol.","exe":"1. Expire et recule les hanches vers les talons sans bouger les mains · 2. Pause 1–2 s bras allongés · 3. Inspire et reviens lentement à quatre pattes · 4. Répète à rythme lent.","resp":"Expire en reculant les hanches, inspire en revenant. Rythme lent et continu.","err":"Aller vite ou rebondir : reste lente et contrôlée · Creuser les lombaires au retour : garde la colonne neutre · Forcer l’amplitude : arrête-toi à une tension douce.","mus":"Grand fessier, érecteurs du rachis, grand dorsal, capsule de la hanche, quadriceps"}},"thread":{"es":{"d":"Movilidad y estiramiento en rotación torácica desde cuadrupedia, con apoyo del hombro para abrir la zona dorsal y escapular.","v":"Brazo por debajo, hombro y sien al suelo, respira.","pos":"A cuatro patas: manos bajo los hombros, rodillas bajo la cadera, columna neutra y cadera estable.","exe":"1. Pasa un brazo por debajo del cuerpo, palma hacia arriba · 2. Baja hasta apoyar hombro y sien en la esterilla · 3. Mantén la cadera sobre las rodillas y sostén · 4. Vuelve y cambia de lado.","resp":"Inhala en la posición, exhala largo para dejar que la parte alta de la espalda gire un poco más.","err":"Desplazar la cadera hacia un lado: mantenla sobre las rodillas · Cargar peso en el cuello: apoya el hombro y relaja la cabeza · Contener el aire: respira fluido.","mus":"Romboides, trapecio medio, deltoides posterior, rotadores torácicos, infraespinoso"},"en":{"d":"Mobility and stretch in thoracic rotation from all fours, resting on the shoulder to open the upper back and shoulder blade area.","v":"Arm underneath, shoulder and temple to the mat, breathe.","pos":"On all fours: hands under shoulders, knees under hips, neutral spine and stable pelvis.","exe":"1. Slide one arm under your body, palm up · 2. Lower until shoulder and temple rest on the mat · 3. Keep hips over knees and hold · 4. Return and switch sides.","resp":"Inhale in position, then exhale long to let your upper back rotate a little further.","err":"Hips shifting sideways: keep them over your knees · Loading the neck: rest on the shoulder and relax your head · Holding your breath: keep breathing smoothly.","mus":"Rhomboids, middle trapezius, posterior deltoid, thoracic rotators, infraspinatus"},"fr":{"d":"Mobilité et étirement en rotation thoracique à quatre pattes, en appui sur l’épaule pour ouvrir le haut du dos et la zone scapulaire.","v":"Bras dessous, épaule et tempe au sol, respire.","pos":"À quatre pattes : mains sous les épaules, genoux sous les hanches, colonne neutre, bassin stable.","exe":"1. Glisse un bras sous ton corps, paume vers le haut · 2. Descends jusqu’à poser épaule et tempe sur le tapis · 3. Garde les hanches au-dessus des genoux et maintiens · 4. Reviens et change de côté.","resp":"Inspire en position, puis expire longuement pour laisser le haut du dos tourner un peu plus.","err":"Hanches qui partent sur le côté : garde-les au-dessus des genoux · Poids sur la nuque : appuie-toi sur l’épaule · Bloquer l’air : respire en continu.","mus":"Rhomboïdes, trapèze moyen, deltoïde postérieur, rotateurs thoraciques, infra-épineux"}},"sphinx":{"es":{"d":"Extensión suave y sostenida de la columna apoyada en antebrazos, con estiramiento de la pared abdominal y apertura del pecho, sin compresión lumbar.","v":"Codos bajo los hombros, pecho adelante, hombros lejos de las orejas.","pos":"Boca abajo, piernas estiradas a la anchura de la cadera y empeines apoyados. Antebrazos en la esterilla, codos bajo los hombros.","exe":"1. Presiona antebrazos contra el suelo y eleva el pecho · 2. Lleva los hombros hacia abajo y atrás · 3. Pubis apoyado y glúteos relajados · 4. Mirada al frente, cuello largo; mantén.","resp":"Respiración diafragmática: inhala hacia el abdomen apoyado, exhala largo relajando la zona lumbar.","err":"Hundir el pecho entre los hombros: empuja el suelo con los antebrazos · Echar la cabeza atrás: cuello largo, mirada al frente · Molestia lumbar: adelanta los codos.","mus":"Recto abdominal, pectoral mayor, flexores de cadera, extensores torácicos (movilidad)"},"en":{"d":"Gentle sustained spinal extension on the forearms, stretching the abdominal wall and opening the chest without compressing the lower back.","v":"Elbows under shoulders, chest forward, shoulders away from ears.","pos":"Lie face down, legs long and hip-width, tops of feet on the mat. Forearms on the mat, elbows under shoulders.","exe":"1. Press your forearms into the floor and lift your chest · 2. Draw shoulders down and back · 3. Pubic bone down, glutes relaxed · 4. Gaze forward, long neck; hold.","resp":"Diaphragmatic breathing: inhale into the belly on the mat, exhale long to relax the lower back.","err":"Chest sinking between shoulders: push the floor away · Dropping the head back: long neck, eyes forward · Lower back discomfort: move elbows further forward.","mus":"Rectus abdominis, pectoralis major, hip flexors, thoracic extensors (mobility)"},"fr":{"d":"Extension douce et maintenue du rachis sur les avant-bras, étirant la paroi abdominale et ouvrant la poitrine, sans compression lombaire.","v":"Coudes sous les épaules, poitrine en avant, épaules loin des oreilles.","pos":"Allongée sur le ventre, jambes tendues à largeur de hanches, dessus des pieds au sol. Avant-bras sur le tapis, coudes sous les épaules.","exe":"1. Pousse les avant-bras dans le sol et soulève la poitrine · 2. Descends les épaules vers l’arrière · 3. Pubis au sol, fessiers relâchés · 4. Regard devant, nuque longue ; maintiens.","resp":"Respiration diaphragmatique : inspire vers le ventre au sol, expire longuement en relâchant les lombaires.","err":"Poitrine affaissée entre les épaules : repousse le sol · Tête basculée en arrière : nuque longue, regard devant · Gêne lombaire : avance les coudes.","mus":"Grand droit de l’abdomen, grand pectoral, fléchisseurs de hanche, extenseurs thoraciques"}},"cobra":{"es":{"d":"Extensión controlada de columna desde decúbito prono con los brazos semiflexionados; estira la pared abdominal y moviliza la columna torácica.","v":"Empuja suave, sube el pecho, codos doblados, baja lento.","pos":"Boca abajo, piernas estiradas a la anchura de la cadera, empeines apoyados. Manos bajo los hombros y codos pegados al cuerpo.","exe":"1. Inhala y eleva el pecho usando la espalda, manos como apoyo · 2. Codos semiflexionados y hombros abajo · 3. Pubis y cadera en el suelo · 4. Exhala y baja despacio.","resp":"Inhala al subir el pecho, exhala al bajar. Mantén un ritmo lento y fluido.","err":"Bloquear los codos: mantenlos algo doblados · Echar la cabeza atrás: cuello largo, mirada al frente o abajo · Subir demasiado con dolor lumbar: reduce la altura.","mus":"Recto abdominal, oblicuos, pectoral mayor, flexores de cadera, erector de la columna (movilidad)"},"en":{"d":"Controlled spinal extension from prone with slightly bent arms; stretches the abdominal wall and mobilises the thoracic spine.","v":"Press gently, lift your chest, elbows soft, lower slowly.","pos":"Lie face down, legs long and hip-width, tops of feet down. Hands under shoulders, elbows close to your body.","exe":"1. Inhale and lift your chest using your back, hands for support · 2. Keep elbows soft and shoulders down · 3. Pubic bone and hips stay down · 4. Exhale and lower slowly.","resp":"Inhale as you lift your chest, exhale as you lower. Keep a slow, fluid rhythm.","err":"Locking the elbows: keep them slightly bent · Throwing the head back: long neck, gaze forward or down · Going too high with back pain: reduce the height.","mus":"Rectus abdominis, obliques, pectoralis major, hip flexors, erector spinae (mobility)"},"fr":{"d":"Extension contrôlée du rachis depuis le ventre, bras semi-fléchis ; étire la paroi abdominale et mobilise le rachis thoracique.","v":"Pousse doucement, monte la poitrine, coudes fléchis, redescends lentement.","pos":"Allongée sur le ventre, jambes tendues à largeur de hanches, dessus des pieds au sol. Mains sous les épaules, coudes près du corps.","exe":"1. Inspire et soulève la poitrine avec le dos, mains en appui · 2. Coudes semi-fléchis, épaules basses · 3. Pubis et hanches au sol · 4. Expire et redescends lentement.","resp":"Inspire en montant la poitrine, expire en redescendant. Rythme lent et fluide.","err":"Verrouiller les coudes : garde-les un peu fléchis · Basculer la tête en arrière : nuque longue, regard devant ou bas · Monter trop haut avec douleur : réduis la hauteur.","mus":"Grand droit de l’abdomen, obliques, grand pectoral, fléchisseurs de hanche, érecteurs du rachis"}},"figure4":{"es":{"d":"Estiramiento estático sostenido del glúteo y rotadores profundos en flexión, abducción y rotación externa de cadera, con pelvis y sacro apoyados.","v":"Rodilla abierta, pelvis apoyada, respira hacia el glúteo.","pos":"Boca arriba, rodillas flexionadas y pies apoyados. Cruza un tobillo sobre el muslo contrario, justo encima de la rodilla, con el pie en flexión.","exe":"1. Eleva la pierna de apoyo y sujeta por detrás del muslo · 2. Acércala al pecho hasta notar tensión suave en el glúteo · 3. Mantén sacro y hombros apoyados · 4. Sostén y cambia de lado.","resp":"Respiración diafragmática; en cada exhalación larga deja que la rodilla cruzada se abra un poco más.","err":"Tirar con fuerza: busca tensión suave 5–6/10 · Levantar el sacro o la cabeza: mantenlos en la esterilla · Pie relajado que carga la rodilla: mantén el pie en flexión.","mus":"Glúteo mayor, glúteo medio, piriforme, rotadores externos profundos de cadera"},"en":{"d":"Sustained static stretch of the glutes and deep rotators in hip flexion, abduction and external rotation, with pelvis and sacrum grounded.","v":"Knee open, pelvis down, breathe into the glute.","pos":"Lie on your back, knees bent, feet flat. Cross one ankle over the opposite thigh just above the knee, foot flexed.","exe":"1. Lift the supporting leg and hold behind the thigh · 2. Draw it toward your chest until you feel gentle glute tension · 3. Keep sacrum and shoulders down · 4. Hold, then switch sides.","resp":"Diaphragmatic breathing; with each long exhale let the crossed knee open a little more.","err":"Pulling hard: aim for gentle tension 5–6/10 · Lifting sacrum or head: keep them on the mat · Relaxed foot stressing the knee: keep the foot flexed.","mus":"Gluteus maximus, gluteus medius, piriformis, deep hip external rotators"},"fr":{"d":"Étirement statique maintenu du fessier et des rotateurs profonds en flexion, abduction et rotation externe de hanche, bassin et sacrum au sol.","v":"Genou ouvert, bassin au sol, respire dans le fessier.","pos":"Allongée sur le dos, genoux fléchis, pieds au sol. Croise une cheville sur la cuisse opposée juste au-dessus du genou, pied fléchi.","exe":"1. Lève la jambe d’appui et tiens l’arrière de la cuisse · 2. Rapproche-la de la poitrine jusqu’à une tension douce au fessier · 3. Sacrum et épaules au sol · 4. Maintiens puis change.","resp":"Respiration diaphragmatique ; à chaque longue expiration, laisse le genou croisé s’ouvrir un peu plus.","err":"Tirer fort : vise une tension douce 5–6/10 · Décoller le sacrum ou la tête : garde-les au tapis · Pied relâché qui charge le genou : garde le pied fléchi.","mus":"Grand fessier, moyen fessier, piriforme, rotateurs externes profonds de la hanche"}},"hamstring":{"es":{"d":"Estiramiento estático sostenido de la cadena posterior del muslo en flexión de cadera, con pelvis neutra y la otra pierna apoyada.","v":"Pierna arriba, pelvis apoyada, exhala y suelta.","pos":"Boca arriba, una pierna estirada o flexionada con el pie apoyado. Sube la otra pierna y sujétala por detrás del muslo o la pantorrilla.","exe":"1. Eleva la pierna con la rodilla casi estirada · 2. Acércala hasta notar tensión suave detrás del muslo · 3. Mantén la pelvis y la zona lumbar apoyadas · 4. Sostén y cambia de pierna.","resp":"Respiración diafragmática; exhala largo para relajar el isquiotibial y ganar unos milímetros.","err":"Bloquear la rodilla: permite una ligera flexión · Levantar la pelvis o la cabeza: mantenlas apoyadas · Tirar a tirones: tensión constante y suave.","mus":"Isquiotibiales (bíceps femoral, semitendinoso, semimembranoso), gastrocnemio"},"en":{"d":"Sustained static stretch of the back of the thigh in hip flexion, with a neutral pelvis and the other leg grounded.","v":"Leg up, pelvis down, exhale and release.","pos":"Lie on your back, one leg long or bent with foot flat. Raise the other leg and hold behind the thigh or calf.","exe":"1. Lift the leg with the knee almost straight · 2. Draw it in until you feel gentle tension behind the thigh · 3. Keep pelvis and lower back on the mat · 4. Hold, then switch legs.","resp":"Diaphragmatic breathing; exhale long to relax the hamstring and gain a few millimetres.","err":"Locking the knee: allow a slight bend · Lifting pelvis or head: keep them down · Jerky pulling: keep tension steady and gentle.","mus":"Hamstrings (biceps femoris, semitendinosus, semimembranosus), gastrocnemius"},"fr":{"d":"Étirement statique maintenu de l’arrière de la cuisse en flexion de hanche, bassin neutre et l’autre jambe au sol.","v":"Jambe en l’air, bassin au sol, expire et relâche.","pos":"Allongée sur le dos, une jambe tendue ou fléchie pied au sol. Lève l’autre jambe et tiens l’arrière de la cuisse ou du mollet.","exe":"1. Lève la jambe, genou presque tendu · 2. Rapproche-la jusqu’à une tension douce derrière la cuisse · 3. Garde bassin et lombaires au tapis · 4. Maintiens puis change de jambe.","resp":"Respiration diaphragmatique ; expire longuement pour relâcher l’ischio-jambier et gagner quelques millimètres.","err":"Verrouiller le genou : garde une légère flexion · Décoller le bassin ou la tête : garde-les au sol · Tirer par à-coups : tension constante et douce.","mus":"Ischio-jambiers (biceps fémoral, semi-tendineux, semi-membraneux), gastrocnémien"}},"seatedfwd":{"es":{"d":"Estiramiento estático sostenido de la cadena posterior mediante flexión de cadera con anteversión pélvica, manteniendo la columna larga.","v":"Pecho largo, inclínate desde la cadera, exhala y suelta.","pos":"Sentada sobre los isquiones, piernas estiradas y juntas, pies en flexión. Columna larga y manos sobre los muslos.","exe":"1. Inhala y crece desde la coronilla · 2. Exhala e inclínate desde la cadera con anteversión pélvica · 3. Desliza las manos hacia los pies hasta tensión suave · 4. Mantén y sube despacio.","resp":"Inhala para alargar la columna, exhala largo para avanzar un poco desde la cadera.","err":"Redondear la espalda para llegar lejos: prioriza columna larga · Bloquear rodillas con tirón fuerte: dóblalas un poco · Rebotar: mantén quieta la posición.","mus":"Isquiotibiales, gastrocnemio, erector de la columna, glúteo mayor"},"en":{"d":"Sustained static stretch of the posterior chain through hip flexion with anterior pelvic tilt, keeping the spine long.","v":"Long chest, hinge from the hips, exhale and release.","pos":"Sit on your sit bones, legs straight and together, feet flexed. Spine long, hands on your thighs.","exe":"1. Inh
