<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calistenia — Quico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Lexend:wght@400;500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#26a69a;--teal-dark:#1a6b64;--teal-light:#4dd0e1;--mint:#d6f0eb;--mint-mid:#b8e4dd;--mint-soft:#e8f8f5;--text:#1a6b64;--text-soft:#2d6b64}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--mint);min-height:100vh;color:var(--text)}
.screen{display:none;min-height:100vh;padding:16px 16px 100px}
.screen.active{display:block}
.max-w{max-width:440px;margin:0 auto;padding-top:12px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.back-btn{background:rgba(26,107,100,.12);border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--teal-dark)}
.topbar h1{font-size:1.15rem;font-weight:700;color:var(--teal-dark)}
.home-header{text-align:center;margin-bottom:16px}
.home-header h1{font-size:1.6rem;font-weight:800;color:var(--teal-dark);margin-bottom:4px}
.home-header p{font-size:.85rem;color:var(--text-soft)}
.bubble{background:rgba(255,255,255,.8);border:2px solid var(--mint-mid);border-radius:16px;padding:10px 16px;font-size:.85rem;font-weight:600;color:var(--teal-dark);text-align:center;margin:0 auto 20px;max-width:300px}
.today-card{border-radius:20px;padding:22px;color:#fff;margin-bottom:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s}
.today-card:active{transform:scale(.98)}
.tc-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.8;margin-bottom:4px}
.tc-day{font-size:1.6rem;font-weight:800;margin-bottom:2px}
.tc-focus{font-size:.9rem;opacity:.9;font-weight:600}
.tc-meta{font-size:.78rem;opacity:.75;margin-top:6px}
.tc-emoji{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:3.5rem;opacity:.3}
.week-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);margin-bottom:10px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
.wday{border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;border:2px solid var(--mint-mid);background:rgba(255,255,255,.75);transition:transform .1s}
.wday:active{transform:scale(.93)}
.wday.today-mark{border-color:var(--teal);background:rgba(38,166,154,.1)}
.wday .wd-emoji{font-size:1.2rem;display:block;margin-bottom:3px}
.wday .wd-name{font-size:.6rem;font-weight:700;color:var(--teal-dark)}
.day-header{border-radius:20px;padding:22px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.dh-focus{font-size:1.1rem;font-weight:800;margin-bottom:4px}
.dh-meta{font-size:.82rem;opacity:.85}
.dh-emoji{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:3rem;opacity:.3}
.day-intro{background:rgba(255,255,255,.82);border:2px solid var(--mint-mid);border-radius:14px;padding:14px;margin-bottom:14px;font-size:.84rem;color:var(--text);line-height:1.5}
.ex-item{background:rgba(255,255,255,.82);border:2px solid var(--mint-mid);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.ex-num{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-info{flex:1}
.ex-name{font-size:.9rem;font-weight:700;color:var(--teal-dark)}
.ex-meta{font-size:.72rem;color:var(--text-soft);margin-top:2px}
.ex-emoji{font-size:1.5rem}
.btn{border:none;border-radius:12px;padding:14px;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;margin-top:4px}
.btn-secondary{background:var(--mint-soft);color:var(--teal-dark);border:2px solid var(--mint-mid)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}
/* Session */
.s-prog{background:var(--mint-mid);border-radius:999px;height:6px;margin-bottom:12px;overflow:hidden}
.s-fill{height:100%;background:linear-gradient(90deg,var(--teal-dark),var(--teal-light));border-radius:999px;transition:width .5s}
.s-count{font-size:.72rem;font-weight:700;color:var(--text-soft);text-align:center;margin-bottom:10px}
.dots{display:flex;justify-content:center;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint-mid)}
.dot.done{background:var(--teal)}.dot.active{background:var(--teal-light);transform:scale(1.4)}
/* Figure animation */
.anim-wrap{position:relative;width:100%;height:190px;margin-bottom:10px;border-radius:16px;overflow:hidden;background:var(--mint-soft);border:2px solid var(--mint-mid)}
.anim-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.anim-tag{position:absolute;top:8px;left:10px;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);background:rgba(255,255,255,.8);border-radius:10px;padding:3px 10px;pointer-events:none}
/* Session box */
.s-box{background:rgba(255,255,255,.9);border:2px solid var(--mint-mid);border-radius:18px;padding:18px;text-align:center;margin-bottom:12px}
.s-phase{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:4px}
.s-exname{font-size:1.1rem;font-weight:800;color:var(--teal-dark);margin-bottom:8px;line-height:1.3}
.s-desc{font-size:.82rem;color:var(--text-soft);line-height:1.5;margin-bottom:10px;text-align:left}
.s-timer{font-size:3.8rem;font-weight:800;color:var(--teal-dark);font-variant-numeric:tabular-nums;line-height:1;margin-bottom:2px}
.s-timer.rest-c{color:#059669}.s-timer.sw-c{color:#d97706}
.s-tlbl{font-size:.7rem;color:var(--text-soft)}
.s-tip{background:var(--mint-soft);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.78rem;color:var(--text);line-height:1.4;margin-bottom:10px;text-align:left}
.done-box{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;border-radius:20px;padding:32px;text-align:center;margin-bottom:14px}
.done-box .big{font-size:3.5rem;margin-bottom:10px}
.done-box h2{font-size:1.4rem;font-weight:800;margin-bottom:8px}
.done-box p{font-size:.88rem;opacity:.9;line-height:1.5}

.calm *,.calm *::before,.calm *::after{animation:none !important;transition:none !important}

/* Anillo de tiempo: se vacía según pasa — para ver cuánto queda sin leer números */
.tring{width:176px;height:176px;border-radius:50%;margin:4px auto 10px;display:flex;align-items:center;justify-content:center;background:conic-gradient(#26a69a 360deg,#cde9e4 0);flex-shrink:0;}
.tring-in{width:144px;height:144px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;}
.tring .s-timer{font-size:2.6rem;margin-bottom:0}

/* Quico con manitas (mascota) */
.quico-mascot{position:relative;width:-moz-fit-content;width:fit-content;margin:0 auto 6px;filter:drop-shadow(0 3px 8px rgba(93,64,55,.18));}
.quico-mascot .qm-head{display:block;margin:0;filter:none;}
.qm-paws{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:64%;line-height:0;}
.qm-paws svg{display:block;width:100%;}

/* Figura que se copia */
.anim-wrap.big{height:min(44vh,320px);background:linear-gradient(180deg,#f3fbf9,#e3f5f1)}
.anim-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.rep-badge{position:absolute;bottom:10px;left:12px;font-size:.85rem;font-weight:800;color:#fff;background:var(--teal);border-radius:12px;padding:4px 12px;pointer-events:none}
/* Nivel */
.lvl-row{display:flex;gap:6px;margin-bottom:8px}
.lvl-chip{flex:1;border:2px solid var(--mint-mid);background:rgba(255,255,255,.8);border-radius:12px;padding:10px 4px;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:700;color:var(--teal-dark);cursor:pointer}
.lvl-chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.lvl-chip:active{transform:scale(.96)}
.prog-note{font-size:.76rem;color:var(--text-soft);text-align:center;margin-bottom:16px;line-height:1.45}
#day-lvl .lvl-row{margin-bottom:14px}
.sec-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);margin:14px 0 8px}
.ex-item{padding:8px 12px 8px 8px}
.ex-item svg.thumb{width:86px;height:64px;border-radius:10px;background:var(--mint-soft);flex-shrink:0}
.wday.st{background:rgba(255,255,255,.55)}
/* Sesión: temporizador pequeño al lado del nombre */
.s-row{display:flex;align-items:center;gap:14px;text-align:left}
.s-info{flex:1;min-width:0}
.tring.small{width:108px;height:108px;margin:0}
.tring.small .tring-in{width:88px;height:88px}
.tring.small .s-timer{font-size:2rem}
.tring.small .s-tlbl{font-size:.6rem}

/* Botón y ficha de técnica */
.fig-holder{position:relative}
.tech-btn{position:absolute;top:8px;right:10px;z-index:2;border:none;background:#fff;color:var(--teal-dark);font-family:'Outfit',sans-serif;font-weight:800;font-size:.8rem;border-radius:12px;padding:6px 12px;box-shadow:0 2px 8px rgba(26,107,100,.22);cursor:pointer}
.tech-btn:active{transform:scale(.95)}
.tech-btn.sm{position:static;box-shadow:none;border:2px solid var(--mint-mid);font-size:1.05rem;padding:6px 9px;flex-shrink:0}
.tech-ov{position:fixed;inset:0;background:rgba(15,59,55,.45);display:none;z-index:50;overflow-y:auto;padding:16px}
.tech-ov.show{display:block}
.tech-card{max-width:440px;margin:0 auto;background:#fff;border-radius:20px;padding:14px 14px 16px;box-shadow:0 10px 30px rgba(15,59,55,.25)}
.tech-card .anim-wrap.big{height:min(34vh,240px)}
.tech-name{font-size:1.15rem;font-weight:800;color:var(--teal-dark);margin:4px 2px}
.tech-mus{font-size:.78rem;color:var(--text-soft);margin:0 2px 10px;line-height:1.4}
.tech-sec{background:var(--mint-soft);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tech-h{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal);margin-bottom:4px}
.tech-sec p,.tech-list{font-size:.84rem;line-height:1.5;color:var(--text)}
.tech-list{padding-left:18px}.tech-list li{margin-bottom:3px}

/* ── Estilo tipo app de entrenamiento (fondo claro, figura grande, tipografía serif) ── */
body{background:#f6fbfa}
#v-day.screen{padding:0 0 110px}
#v-day .max-w{padding:0 18px}
.day-hero{position:relative}
#day-hero .anim-wrap.big{height:min(40vh,300px);border:none;border-radius:0 0 28px 28px;margin:0}
.hero-back{position:absolute;top:14px;left:14px;z-index:3;background:rgba(255,255,255,.92)}
.day-title{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:2.1rem;color:#12302d;margin:16px 0 0}
.day-sub{color:#5f7f7a;font-size:.92rem;margin-bottom:14px}
.day-stats{display:flex;gap:26px;margin-bottom:16px}
.day-stats div{display:flex;flex-direction:column}.day-stats b{font-size:1.05rem;color:#12302d}.day-stats span{font-size:.7rem;color:#8aa6a1}
.set-h{font-weight:800;font-size:.92rem;color:#12302d;margin:4px 0 8px}
.ex-count{font-weight:800;font-size:1rem;color:#12302d;margin:18px 0 2px}
.ex-row{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;border-bottom:1px solid #e3efec;padding:10px 0;text-align:left;cursor:pointer;font-family:'Outfit',sans-serif}
.ex-row:active{background:#eef6f4}
.ex-row svg.thumb{width:96px;height:70px;border-radius:12px;background:#eef6f4;flex-shrink:0}
.ex-row .ex-txt{flex:1;min-width:0}
.ex-row .ex-name{font-size:.98rem;font-weight:700;color:#12302d}
.ex-row .ex-meta{font-size:.8rem;color:#7a9a95;margin-top:3px;font-variant-numeric:tabular-nums}
.ex-i{color:var(--teal);font-size:1.15rem;flex-shrink:0}
.cta-bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px 20px;background:linear-gradient(rgba(246,251,250,0),#f6fbfa 40%);z-index:5}
.btn.cta{display:block;max-width:440px;margin:0 auto;border-radius:999px;font-size:1.05rem;padding:16px}
/* Hoja del ejercicio */
.tech-ov{padding:0}
.tech-ov .tech-card{border-radius:26px 26px 0 0;margin:10vh auto 0;min-height:90vh;padding:14px 18px 10px;position:relative}
.sh-name{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:1.65rem;color:#12302d;margin:12px 2px 10px;line-height:1.15}
.sh-dur{display:flex;align-items:center;gap:12px;margin:0 2px 14px}
.sh-dur span{font-weight:800;color:#12302d;flex:1}
.sh-dur button{width:34px;height:34px;border-radius:50%;border:none;background:#eef6f4;font-size:1.2rem;color:#12302d;cursor:pointer}
.sh-dur b{font-variant-numeric:tabular-nums;font-size:1.05rem;color:#12302d;min-width:60px;text-align:center}
.sh-h{font-weight:800;color:#12302d;margin:2px 2px 6px}
.sh-list{padding-left:20px;font-size:.92rem;line-height:1.5;color:#223b38;margin-bottom:12px}
.sh-list li{margin-bottom:5px}
.sh-more{font-size:.83rem;line-height:1.45;color:#34504c;background:#f3f9f8;border-radius:12px;padding:9px 11px;margin-bottom:6px}
.sh-foot{display:flex;align-items:center;gap:12px;position:sticky;bottom:0;background:#fff;padding:12px 0 8px;margin-top:8px}
#sh-nav{display:flex;align-items:center;gap:8px}
#sh-nav button{width:36px;height:36px;border-radius:50%;border:none;background:#e7f4f1;color:var(--teal-dark);font-size:1.35rem;line-height:1;cursor:pointer}
#sh-nav button:disabled{opacity:.35}
#sh-nav span{font-weight:700;color:#12302d;min-width:44px;text-align:center}
.sh-foot #tech-close{flex:1;border-radius:999px;margin:0}
.sh-x{position:absolute;top:22px;right:26px;z-index:4;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.9);color:#567;font-size:1rem;cursor:pointer}
/* Sesión */
#v-session.screen{padding:0;background:#fff}
.s-top{position:relative}
.s-top .s-prog{position:absolute;top:0;left:0;right:0;height:4px;border-radius:0;margin:0;z-index:3;background:#e3efec}
.s-back{position:absolute;top:14px;left:14px;z-index:3;background:rgba(255,255,255,.9)}
#s-stage .anim-wrap.big{height:52vh;border:none;border-radius:0;margin:0;background:linear-gradient(180deg,#fbfdfd,#eef6f4)}
.s-bottom{max-width:440px;margin:0 auto;padding:14px 20px 30px;text-align:center}
.s-cap{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);min-height:1em}
.s-clock{font-family:'DM Serif Display',Georgia,serif;font-size:4.4rem;line-height:1;color:#12302d;font-variant-numeric:tabular-nums;margin:4px 0 6px}
.s-clock.rest{color:#059669}.s-clock.sw{color:#d97706}
.s-big{font-family:'DM Serif Display',Georgia,serif;font-size:2.5rem;line-height:1.1;color:#12302d;margin:10px 0 6px}
.s-name{font-family:'DM Serif Display',Georgia,serif;font-size:1.25rem;color:#12302d;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.i-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid #9fb8b4;background:#fff;color:#56716d;font:800 .78rem 'Outfit',sans-serif;cursor:pointer;line-height:1;padding:0}
.s-small{font-size:.88rem;color:#5f7f7a;margin:10px 0 14px;line-height:1.5}
.pill{border:none;background:#eef6f4;color:var(--teal-dark);font:800 .95rem 'Outfit',sans-serif;border-radius:999px;padding:14px 46px;cursor:pointer;margin-top:12px}
.ctrl{display:flex;align-items:center;justify-content:space-around;background:#f1f7f6;border-radius:999px;padding:6px;margin:16px auto 10px;max-width:300px}
.ctrl button{border:none;background:none;font-size:1.3rem;width:54px;height:54px;border-radius:50%;cursor:pointer;color:#12302d}
.ctrl .play{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.s-count{font-size:.78rem;color:#8aa6a1;margin-top:6px}
/* Móvil en horizontal: la figura ocupa toda la pantalla */
@media (orientation:landscape) and (max-height:520px){
 #s-stage .anim-wrap.big{height:100vh}
 .s-bottom{position:fixed;left:12px;bottom:10px;padding:6px 14px;background:rgba(255,255,255,.92);border-radius:18px;display:flex;align-items:center;gap:14px;text-align:left;max-width:none}
 .s-bottom .s-clock{font-size:2.1rem;margin:0}.s-bottom .s-name{font-size:.9rem}.s-bottom .s-big{font-size:1.4rem;margin:0}
 .s-bottom .ctrl{margin:0;padding:2px}.s-bottom .ctrl button{width:40px;height:40px;font-size:1rem}
 .s-bottom .s-count,.s-bottom .s-cap,.s-bottom .s-small{display:none}
 .s-bottom .pill{margin:0;padding:8px 18px}
}

/*LAND_BADGE*/@media (orientation:landscape) and (max-height:520px){.rep-badge{top:14px;right:14px;left:auto;bottom:auto}}



/*DYS_READ2*/
/* Lectura fácil (dislexia): Lexend, texto más grande, más interlineado y espaciado; serif solo en el reloj */
.sh-list,.sh-more,.s-small,.day-intro,.ex-row .ex-name,.ex-row .ex-meta,.sh-dur,.sh-h,.day-sub,.prog-note{font-family:'Lexend','Outfit',sans-serif}
.sh-list{font-size:1rem;line-height:1.7;letter-spacing:.015em;word-spacing:.06em;padding-left:22px;color:#1d3532}
.sh-list li{margin-bottom:10px}
.sh-more{font-size:.95rem;line-height:1.65;letter-spacing:.012em;word-spacing:.05em;padding:11px 13px;margin-bottom:8px;color:#1d3532}
.sh-more>b{display:block;margin-bottom:2px}.sh-more li b{display:inline}
.tech-card,.sh-list,.sh-more,.day-intro,.s-small{text-align:left;hyphens:none;-webkit-hyphens:none}
.s-bottom .s-small{text-align:center}
.day-intro{font-size:.95rem;line-height:1.65;letter-spacing:.01em}
.s-small{font-size:.95rem;line-height:1.6}
.sh-name,.s-name,.day-title,.s-big{font-family:'Lexend','Outfit',sans-serif;font-weight:700;letter-spacing:-.005em}
.sh-name{font-size:1.45rem}.day-title{font-size:1.8rem}.s-big{font-size:2rem}.s-name{font-size:1.15rem}
.ex-row .ex-name{font-weight:500;font-size:1rem}
/*XS_V1*/
/* ── Pantalla de ejercicio (composición vertical: figura → progreso → tiempo → nombre → controles → sesión) ── */
#v-session.screen{padding:0;background:var(--xs-bg)}
.xs{--xs-bg:#f6f9f8;--xs-media:#edf3f1;--xs-ink:#12302d;--xs-soft:#6d8a86;--xs-track:#dbe7e4;--xs-accent:#1f8a7e;--xs-accent-ink:#0f5f57;--xs-rest:#e6f4ef;--xs-heat:#f97316;--xs-surface:#e8f0ee;
  height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--xs-bg);color:var(--xs-ink);transition:background-color .5s ease}
.xs.is-rest{--xs-bg:var(--xs-rest);--xs-media:#e1f1eb;--xs-surface:#d9ece6}
.xs-media{position:relative;flex:0 1 auto;min-height:170px;height:clamp(210px,calc(100dvh - 310px),64dvh);background:var(--xs-media);overflow:hidden;transition:background-color .5s ease}
#s-stage.xs-visual,#s-stage{position:absolute;inset:0}
#s-stage .anim-wrap.big{position:absolute;inset:0;height:100%;margin:0;border:none;border-radius:0;background:transparent}
#s-stage .anim-wrap svg{top:64px;left:12px;width:calc(100% - 24px);height:calc(100% - 130px)}
.xs-media-el{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.xs-media-el.mirror{transform:scaleX(-1)}
.xs-enter{animation:xsEnter .45s cubic-bezier(.2,.7,.2,1)}
@keyframes xsEnter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.xs.is-paused .xs-media #s-stage{opacity:.72;transition:opacity .3s}
/* Controles secundarios sobre la figura: discretos y translúcidos */

/* ─── AVATAR BIOMECÁNICO (vista lateral, cinemática directa) ───
   Cada postura = ángulos (grados; 0=derecha, 90=abajo, -90=arriba).
   t: tronco (cadera→cuello) · c: curva de la columna · hd: cabeza (relativa)
   a/b: brazo cercano/lejano [brazo, antebrazo] · l/m: pierna cercana/lejana [muslo, espinilla, pie]
   Bases biomecánicas:
   · Proporciones: longitudes de segmento relativas a la estatura (Winter 2009; Drillis y Contini).
   · Silueta: perfiles sagitales de cada segmento a partir de perímetros antropométricos de mujer adulta
     (gemelo y glúteo por detrás, pecho por delante, cintura, lordosis), como los modelos estadísticos
     de cuerpo 3D. Un poco más gruesos que la media por legibilidad y por la ropa.
   · Reajuste («retargeting»): al pasar de las proporciones antiguas a las antropométricas, cada postura
     se corrige lo mínimo para conservar sus apoyos (manos, rodillas, pies en la esterilla) sin salir
     del rango articular.
   · Movimiento de mínimo tirón («minimum jerk», Flash y Hogan 1985): así acelera y frena una persona.
   · Centro de masas con las fracciones de masa de Dempster/Winter: la sombra cae bajo él. */
const FIG_FLOOR=134,FIG_VB='0 0 200 150',FIG_MAT='<rect x="6" y="134" width="188" height="7" rx="3.5" fill="#b8e4dd"/>';
const FIG_H=120; // estatura de referencia en unidades del dibujo
const FIG_LEN={T:.317*FIG_H,UA:.186*FIG_H,FA:.146*FIG_H,TH:.245*FIG_H,SH:.246*FIG_H,FT:.104*FIG_H,NK:.088*FIG_H,HR:.066*FIG_H,HAND:.066*FIG_H};
const FIG_LEN0={T:44,UA:21,FA:19,TH:29,SH:27,FT:9,NK:11,HR:9}; // proporciones con las que se diseñaron las posturas
const FIG_COL={near:'#1a6b64',far:'#8ccdc3',torso:'#26a69a',hl:'#f59e0b',hlFar:'#fbc97a',skin:'#1a6b64',mat:'#b8e4dd'};
function fd(a){const r=a*Math.PI/180;return [Math.cos(r),Math.sin(r)];}
function fadd(p,a,len){const d=fd(a);return [p[0]+d[0]*len,p[1]+d[1]*len];}
function figJoints(P,Ln){
  const L=Ln||FIG_LEN,hip=[0,0];
  const neck=fadd(hip,P.t,L.T);
  const perp=fd(P.t+90),mid=[(hip[0]+neck[0])/2+perp[0]*(P.c||0),(hip[1]+neck[1])/2+perp[1]*(P.c||0)];
  const head=fadd(neck,P.t+(P.hd||0),L.NK);
  const bun=fadd(head,P.t+(P.hd||0)+(P.bun||0),L.HR*.95);
  // hombro: sobre la curva, cerca del cuello
  const sh=[.1*mid[0]+.9*neck[0]+(neck[0]-hip[0])*-.08,.1*mid[1]+.9*neck[1]+(neck[1]-hip[1])*-.08];
  const arm=(A)=>{const e=fadd(sh,A[0],L.UA);return [sh,e,fadd(e,A[1],L.FA)];};
  // pie sin ángulo indicado: si la espinilla baja hacia el suelo, la planta queda plana (dorsiflexión del tobillo)
  const leg=(G)=>{const k=fadd(hip,G[0],L.TH),an=fadd(k,G[1],L.SH);let f=G[2];
    if(f==null){f=G[1]-90;if(Math.sin(G[1]*Math.PI/180)>.5)f=Math.cos(f*Math.PI/180)>=0?0:180;}
    return [hip,k,an,fadd(an,f,L.FT)];};
  const J={hip,neck,mid,head,bun,a:arm(P.a),b:arm(P.b),l:leg(P.l),m:leg(P.m)};
  // P.ra / P.rb = 'l'|'m': esa mano sujeta el tobillo de esa pierna (el codo queda hacia arriba)
  for(const [k,rk] of [['a','ra'],['b','rb']])if(P[rk]){const T=J[P[rk]][2];J[k]=figReach(sh,T,L.UA,L.FA);}
  // anclaje: el apoyo que no se mueve en todo el ejercicio se queda en su sitio y el cuerpo se desplaza sobre él
  if(P.anc&&(!Ln||Ln===FIG_LEN)){const q=figAnchorPt(J,P.anc),dx=P.ax-q[0];if(dx){const mv=p=>{p[0]+=dx;};
    const seen=new Set();for(const p of [J.hip,J.neck,J.mid,J.head,J.bun,...J.a,...J.b,...J.l,...J.m])if(!seen.has(p)){seen.add(p);mv(p);} /* la cadera la comparten las 2 piernas: se mueve una sola vez */}}
  return J;
}
function figAnchorPt(J,k){return {toeL:J.l[3],toeM:J.m[3],kneeL:J.l[1],kneeM:J.m[1],wristA:J.a[2],wristB:J.b[2],hip:J.hip,head:J.head}[k];}
/* Cinemática inversa de 2 segmentos: brazo y antebrazo hasta el objetivo (si no llega, lo más cerca posible) */
function figReach(S,T,L1,L2){
  const dx=T[0]-S[0],dy=T[1]-S[1],d=Math.max(.01,Math.min(Math.hypot(dx,dy),L1+L2-.01)),b=Math.atan2(dy,dx);
  const A=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));
  const cand=[b+A,b-A].map(g=>{const e=[S[0]+Math.cos(g)*L1,S[1]+Math.sin(g)*L1];const g2=Math.atan2(T[1]-e[1],T[0]-e[0]);return [S,e,[e[0]+Math.cos(g2)*L2,e[1]+Math.sin(g2)*L2]];});
  return cand[0][1][1]<=cand[1][1][1]?cand[0]:cand[1];
}
function figPoints(J){return [J.hip,J.neck,J.mid,J.head,J.bun,...J.a,...J.b,...J.l,...J.m];}
function figBBox(J){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of figPoints(J)){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}return {x0:x0-10,y0:y0-10,x1:x1+10,y1:y1+8};}
function figLerp(A,B,k){
  const o={};for(const key of ['t','c','hd','bun','up','fr']){const d0=key==='fr'?1:0;const av=A[key]==null?d0:A[key],bv=B[key]==null?d0:B[key];o[key]=av+(bv-av)*k;}
  if(A.anc&&A.anc===B.anc){o.anc=A.anc;o.ax=A.ax;}
  if(A.ra||B.ra)o.ra=A.ra||B.ra;if(A.rb||B.rb)o.rb=A.rb||B.rb;
  for(const key of ['a','b','l','m']){o[key]=A[key].map((v,i)=>{const w=B[key][i];if(v==null&&w==null)return null;const vv=v!=null?v:w,ww=w!=null?w:v;return vv+(ww-vv)*k;});}
  return o;
}
/* Ajuste de encuadre para una animación (misma escala y x para todos sus fotogramas) */
function figFit(A,B){
  const list=Array.isArray(A)?A:[A,B];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const P of list){const q=figBBox(figJoints(P));x0=Math.min(x0,q.x0);x1=Math.max(x1,q.x1);y0=Math.min(y0,q.y0-(P.up||0));y1=Math.max(y1,q.y1);}
  const s=Math.min(1.2,180/(x1-x0),(FIG_FLOOR-8)/(y1-y0));
  return {s,cx:100-((x0+x1)/2)*s};
}
/* ── Apoyos en el suelo: altura de cada punto de contacto sobre la esterilla ── */
function figSupport(P,Ln){
  const L=Ln||FIG_LEN,J=figJoints(P,L);
  const pts={head:[J.head,L.HR],hip:[J.hip,8],neck:[J.neck,8],mid:[J.mid,7],
    elbowA:[J.a[1],3.6],wristA:[J.a[2],3.6],elbowB:[J.b[1],3.6],wristB:[J.b[2],3.6],
    kneeL:[J.l[1],3.6],ankleL:[J.l[2],3.6],toeL:[J.l[3],3.6],kneeM:[J.m[1],3.6],ankleM:[J.m[2],3.6],toeM:[J.m[3],3.6]};
  let low=-1e9;for(const k in pts)low=Math.max(low,pts[k][0][1]+pts[k][1]);
  const h={};for(const k in pts)h[k]=low-(pts[k][0][1]+pts[k][1]);
  return h;
}
function figPosition(P){return figMap(P,{s:1,cx:0}).M;}
/* Ángulo relativo (flexión) de una articulación, en (-180,180] */
function figRel(a,b){let d=((b-a)%360+540)%360-180;return d;}
/* Centro de masas en coordenadas del esqueleto (sin encuadre) */
function figCOMJ(J){return figCOM(J,v=>v);}
/* Base de apoyo: tramo horizontal que cubren los puntos que tocan el suelo (con el talón) */
function figBase(P,Ln){
  const L=Ln||FIG_LEN,J=figJoints(P,L),h=figSupport(P,L),xs=[];
  const pt={head:J.head,hip:J.hip,neck:J.neck,mid:J.mid,elbowA:J.a[1],wristA:J.a[2],elbowB:J.b[1],wristB:J.b[2],kneeL:J.l[1],ankleL:J.l[2],toeL:J.l[3],kneeM:J.m[1],ankleM:J.m[2],toeM:J.m[3]};
  const EXT={hip:7,mid:6,neck:5,head:4,kneeL:2,kneeM:2,elbowA:2,elbowB:2}; // superficie de apoyo de cada zona
  for(const k in h)if(h[k]<2){const e=EXT[k]||0;xs.push(pt[k][0]-e,pt[k][0]+e);if(k.startsWith('ankle')){const G=k==='ankleL'?J.l:J.m,d=[G[3][0]-G[2][0],G[3][1]-G[2][1]],n=Math.hypot(d[0],d[1])||1;xs.push(G[2][0]-d[0]/n*2.6);}}
  return xs.length?[Math.min(...xs),Math.max(...xs)]:null;
}
/* ── Reajuste a proporciones antropométricas conservando los apoyos y el equilibrio ── */
const FIG_RT_KEYS=[['t'],['a',0],['a',1],['b',0],['b',1],['l',0],['l',1],['l',2],['m',0],['m',1],['m',2]];
function figRetarget(P){
  // apoyos pensados: lo que tocaba o casi tocaba la esterilla (manos y rodillas «flotando» por las proporciones antiguas)
  const h0=figSupport(P,FIG_LEN0),C=Object.keys(h0).filter(k=>h0[k]<5.5);
  if(!C.length)return P;
  // si el centro de masas queda fuera de los apoyos, el cuerpo caería hacia ese lado:
  // la mano / antebrazo / rodilla más baja de ese lado es un apoyo aunque en el dibujo antiguo flotara
  if(!P.up){const J0=figJoints(P,FIG_LEN0),x=figCOM(J0,v=>v)[0],B=figBase(P,FIG_LEN0);
    if(B&&(x<B[0]-1||x>B[1]+1)){const side=x<B[0]?-1:1,pt={wristA:J0.a[2],wristB:J0.b[2],elbowA:J0.a[1],elbowB:J0.b[1],kneeL:J0.l[1],kneeM:J0.m[1],ankleL:J0.l[2],toeL:J0.l[3],ankleM:J0.m[2],toeM:J0.m[3]};
      const cand=Object.keys(pt).filter(k=>h0[k]<30&&(pt[k][0]-x)*side>-4).sort((a,b)=>h0[a]-h0[b]);
      if(cand.length){const lo=h0[cand[0]];cand.filter(k=>h0[k]<=lo+4).forEach(k=>{if(!C.includes(k))C.push(k);});}}}
  const get=(Q,k)=>k.length===1?Q[k[0]]:Q[k[0]][k[1]];

/* Postura en el instante k∈[0,1) del ciclo. an.K = fotogramas; an.loop: recorre y vuelve
   al primero de golpe (para giros completos); si no, va y vuelve (ping-pong).
   Interpolación de mínimo tirón: 10x³−15x⁴+6x⁵ (velocidad en campana, como el movimiento humano). */
function figAt(an,k){
  const K=an.K,n=K.length;
  const ease=x=>x*x*x*(10+x*(6*x-15));
  if(an.loop){const f=k*(n-1),i=Math.min(n-2,Math.floor(f));return figLerp(K[i],K[i+1],ease(f-i));}
  if(n===2&&an.seq){const q=an.seq,T=q[0]+q[1]+q[2]+q[3];let x=k*T;
    if(x<q[0])return figLerp(K[0],K[1],ease(x/q[0]));x-=q[0];
    if(x<q[1])return figLerp(K[1],K[1],0);x-=q[1];
    if(x<q[2])return figLerp(K[1],K[0],ease(x/q[2]));return figLerp(K[0],K[0],0);}
  if(n===2&&an.sp){return k<an.sp?figLerp(K[0],K[1],ease(k/an.sp)):figLerp(K[1],K[0],ease((k-an.sp)/(1-an.sp)));}
  const f=k*n,i=Math.floor(f)%n;return figLerp(K[i],K[(i+1)%n],ease(f-Math.floor(f)));
}
/* Fase actual del ciclo (para marcar el ritmo): índice, etiqueta y segundos dentro de la fase */
function figPhase(an,k){
  const n=an.K.length,T=an.tempo||3,ph=an.ph||[];
  let i,start,len;
  if(an.hold)return {i:0,key:'hold',sec:0};
  if(n===2&&an.seq){const q=an.seq,Tt=q[0]+q[1]+q[2]+q[3];let x=k*Tt,j=0;while(j<3&&x>=q[j]){x-=q[j];j++;}
    const lab=[ph[0]||'',"hold",ph[1]||'',"hold"][j];return {i:j,key:lab,sec:Math.floor(x)+1,len:q[j]};}
  if(an.loop){const segs=n-1;i=Math.min(segs-1,Math.floor(k*segs));start=i/segs;len=1/segs;}
  else if(n===2&&an.sp){i=k<an.sp?0:1;start=i?an.sp:0;len=i?1-an.sp:an.sp;}
  else{i=Math.floor(k*n)%n;start=i/n;len=1/n;}
  return {i,key:ph[i%Math.max(1,ph.length)]||'',sec:Math.floor((k-start)*T)+1,len:len*T};
}

et your chest sink as your shoulder blades squeeze together, then push the floor away to spread them.","v":"Squeeze your shoulder blades, push the floor.","tip":"Your elbows don’t bend. Easy level: knees down."},"deadbug_easy":{"n":"Easy dead bug","d":"On your back, arms to the ceiling and knees in tabletop. Lower one foot to touch the floor and return. Alternate.","v":"Tap the floor with one foot, return. Alternate.","tip":"Lower back pressed into the mat."},"deadbug":{"n":"Dead bug","d":"On your back, arms to the ceiling and knees in tabletop. Extend one arm back and the opposite leg at the same time. Return and alternate.","v":"Opposite arm and leg long. Return. Lower back down.","tip":"Exhale as you extend. If your lower back lifts, don’t reach as far."},"deadbug_slow":{"n":"Slow dead bug","d":"Dead bug extending over 3 seconds and pausing one second with arm and leg long.","v":"Extend slowly, hold, return.","tip":"Slowness is what makes it hard."},"crunch":{"n":"Crunch","d":"On your back, knees bent. Lift your head and shoulders looking at your knees and lower slowly.","v":"Shoulders up, lower slowly.","tip":"Keep a fist of space between chin and chest."},"crunch_tt":{"n":"Tabletop crunch","d":"With your knees in the air at 90 degrees, lift your head and shoulders and lower slowly.","v":"Legs still, up and down.","tip":"Exhale as you lift."},"situp":{"n":"Sit-up","d":"On your back, knees bent. Come all the way up to sitting and roll down one vertebra at a time.","v":"Up to sitting, down slowly.","tip":"If you pull on your neck, reach your arms forward."},"sideplank_knee":{"n":"Knee side plank","d":"On your side on your forearm and bottom knee. Lift your hips into a line. Hold and switch sides.","v":"Hips up, hold.","tip":"Elbow right under your shoulder."},"sideplank":{"n":"Side plank","d":"On your side on your forearm and the edge of your foot. Hips up, body straight. Hold and switch sides.","v":"Body straight as a board. Hold.","tip":"To make it easier, rest your bottom knee down."},"sideplank_dip":{"n":"Side plank hip dips","d":"In a side plank, lower your hips almost to the floor and lift them. Switch sides.","v":"Hips down and up.","tip":"Controlled movement, no jerking."},"legraise_single":{"n":"Single-leg raise","d":"On your back, legs straight. Lift one leg toward the ceiling and lower it without touching the floor. Alternate.","v":"One leg up, lower slowly. Alternate.","tip":"Hands under your glutes if you feel your lower back."},"reversecrunch":{"n":"Reverse crunch","d":"On your back, knees in tabletop. Bring your knees toward your chest lifting your hips slightly and lower slowly.","v":"Knees to chest, lower slowly.","tip":"No swinging: the movement is small."},"legraise":{"n":"Leg raise","d":"On your back, legs together and straight. Lift them to the ceiling and lower slowly without touching the floor.","v":"Legs up, slow lowering.","tip":"If your lower back lifts, bend your knees a little."},"birddog_easy":{"n":"Easy bird dog","d":"On all fours, reach one arm forward and return; then the opposite leg back. Alternate.","v":"Reach one arm, return. Then the leg.","tip":"Back flat like a table."},"birddog":{"n":"Bird dog","d":"On all fours, reach one arm forward and the opposite leg back at the same time. Return and alternate.","v":"Opposite arm and leg long. Return and switch.","tip":"Imagine a glass of water on your back that mustn’t spill."},"birddog_crunch":{"n":"Bird dog elbow to knee","d":"Extend your arm and opposite leg, then bring elbow and knee together under your body. Halfway through, switch sides.","v":"Reach long, elbow to knee.","tip":"Go slowly to keep your balance."},"hollow_tuck":{"n":"Tuck hollow hold","d":"On your back, lift your shoulders and arms, knees bent in the air. Lower back down. Hold.","v":"Lower back down, hold. Breathe.","tip":"The closer your knees, the easier it is."},"hollow":{"n":"Hollow hold","d":"On your back, arms overhead and legs straight, everything slightly off the floor. Lower back down. Hold.","v":"Body shaped like a boat. Hold.","tip":"Raise your legs higher if your lower back lifts."},"hollowrock":{"n":"Hollow rock","d":"In the hollow position, rock forward and back without breaking the shape.","v":"Boat shape, rock.","tip":"If the shape breaks, go back to holding still."},"swimming":{"n":"Swimmers","d":"Face down, arms forward. Lift one arm and the opposite leg together and alternate, as if swimming.","v":"Opposite arm and leg up. Alternate.","tip":"Look at the floor so you don’t strain your neck."},"superman":{"n":"Superman","d":"Face down, arms forward. Lift your arms, chest and legs a hand’s width at the same time, then lower.","v":"Everything up, one second, down.","tip":"Squeeze your glutes to protect your lower back."},"supermanhold":{"n":"Superman hold","d":"Lift your arms, chest and legs and stay up, breathing.","v":"Up and hold.","tip":"A little height done well beats a lot forced."},"proneY":{"n":"Prone Y raise","d":"Face down, arms forward in a Y with thumbs up. Lift your arms squeezing your shoulder blades and lower.","v":"Arms up in a Y, shoulder blades together.","tip":"Shoulders drop away from your ears."},"proneY_slow":{"n":"Prone Y raise with pause","d":"Y raises holding 2 seconds at the top.","v":"Up, hold, down.","tip":"No momentum: lift with your back."},"bear":{"n":"Bear hold","d":"On all fours, lift your knees 2 centimetres off the floor and hold with a flat back.","v":"Knees hovering. Hold.","tip":"If it’s too hard, lower your knees and lift again."},"beartap":{"n":"Bear shoulder taps","d":"In the bear position, tap the opposite shoulder with one hand and alternate.","v":"Knees hovering, tap your shoulder, alternate.","tip":"Your hips don’t sway."},"swimming_fast":{"n":"Fast swimmers","d":"Face-down swimmers at a livelier pace, without losing height.","v":"Opposite arm and leg, lively pace.","tip":"Breathe calmly even though the pace is fast."},"climber_slow":{"n":"Slow mountain climber","d":"In a plank, bring one knee toward your chest, return and switch. Slowly.","v":"Knee to chest, alternate slowly.","tip":"Shoulders over your hands."},"climber":{"n":"Mountain climber","d":"In a plank, alternate knees to chest with rhythm, as if running.","v":"Knees to chest, lively pace.","tip":"Hips low, in line with your shoulders."},"burpee_step":{"n":"Step-back burpee","d":"Standing, crouch with hands on the floor, step your feet back to a plank one at a time, return and stand up.","v":"Down, feet back, feet in, up.","tip":"No rush: each step done well."},"burpee":{"n":"Burpee","d":"Crouch, jump back to a plank, jump your feet to your hands and jump up with arms to the ceiling.","v":"Down, plank, back in and jump.","tip":"If you need to, skip the final jump."},"childpose":{"n":"Child’s pose","d":"Kneeling, sit back on your heels and stretch your arms forward with your forehead on the floor.","v":"Breathe into your back.","tip":"Spread your knees if that feels more comfortable."},"childreach":{"n":"Child’s pose to all fours","d":"From all fours, bring your hips to your heels and return, slowly.","v":"Hips back, breathe, return.","tip":"Sink in gently, don’t force it."},"thread":{"n":"Thread the needle","d":"On all fours, slide one arm under your body and rest your shoulder on the floor.","v":"Arm underneath, shoulder down. Breathe.","tip":"It opens your upper back. No rush."},"sphinx":{"n":"Sphinx","d":"Face down, propped on your forearms with elbows under your shoulders. Chest open.","v":"Chest open, shoulders away from your ears.","tip":"If your lower back complains, move your elbows forward."},"cobra":{"n":"Gentle cobra","d":"Face down, hands under your shoulders. Lift your chest using your back, without fully straightening your arms.","v":"Chest up, lower gently.","tip":"Height doesn’t matter. No pain."},"figure4":{"n":"Figure 4","d":"On your back, cross one ankle over the opposite knee and draw your legs toward your chest.","v":"Breathe into your glute.","tip":"If it’s too much, leave your bottom foot on the floor."},"hamstring":{"n":"Hamstring stretch","d":"On your back, lift one straight leg and hold it behind the thigh.","v":"Leg up, breathe and let go.","tip":"You can bend your knee a little."},"seatedfwd":{"n":"Seated forward fold","d":"Seated with legs straight, lean forward from your hips, without forcing.","v":"Lean from your hips, breathe.","tip":"Bend your knees if they pull a lot."},"butterfly":{"n":"Butterfly","d":"Seated, bring the soles of your feet together and let your knees drop. Lean forward a little.","v":"Knees open, breathe.","tip":"Don’t push your knees down with your elbows."},"sidequad":{"n":"Side-lying quad stretch","d":"Lying on your side, bring your top heel to your glute holding your ankle.","v":"Heel to glute, knees together.","tip":"If you can’t reach your ankle, hold your trousers."},"lowlunge":{"n":"Low lunge","d":"One knee on the mat and the other foot in front. Shift your hips slightly forward.","v":"Hips forward, torso tall.","tip":"Put something soft under your knee if it bothers you."},"yogisquat":{"n":"Deep squat","d":"Feet wide, lower into a deep squat with your hands together in front of your chest.","v":"Sink down and breathe.","tip":"If your heels lift, widen your feet."},"spinaltwist":{"n":"Supine twist","d":"On your back, knees bent. Let them drop to one side with your arms out wide.","v":"Knees to one side, breathe.","tip":"Let the weight of your legs do the work."},"kneehug":{"n":"Knees to chest","d":"On your back, hug your knees and rock gently forward and back.","v":"Hug your knees, rock gently.","tip":"It’s a massage for your lower back."},"tricepstretch":{"n":"Triceps stretch","d":"Standing, raise one arm, bend the elbow and bring your hand down your back. Your other hand gently pushes the elbow.","v":"Elbow up, push gently.","tip":"Keep your neck relaxed."},"neck":{"n":"Neck mobility","d":"Standing or sitting, slowly bring your chin to your chest and look forward again.","v":"Chin to chest, slowly, and back.","tip":"Never tip your head back."},"shouldercircle":{"n":"Shoulder circles","d":"Hands on your shoulders, draw big circles with your elbows.","v":"Big circles with your elbows.","tip":"Halfway through, switch direction."},"breathe":{"n":"Closing breath","d":"Lying on your back, close your eyes. Inhale for 4 counts and exhale for 6.","v":"Inhale for four, exhale for six.","tip":"Let your body sink into the mat."},"gluteknee":{"n":"Knee to chest","d":"On your back, one leg straight on the mat. Hug the other knee and draw it to your chest.","v":"Hug your knee, draw it in and breathe.","tip":"If you can’t reach your knee, hold behind your thigh."},"donkey":{"n":"Donkey kick","d":"On all fours. With your knee bent, lift your heel toward the ceiling and lower it slowly. Then the other leg.","v":"Heel to the ceiling, squeeze your glute, back still.","tip":"Only lift as high as your back stays flat."},"squathold_half":{"n":"Half squat hold","d":"Lower halfway, as if sitting on a high chair, and stay there breathing.","v":"Hips back, chest up, breathe.","tip":"If your legs shake, come up a little: it still counts."},"rockback":{"n":"All-fours rock back","d":"On all fours with your knees apart. Slowly take your hips back toward your heels and return.","v":"Hips back to your heels, breathe out.","tip":"Only go as far as feels comfortable."},"hiphinge":{"n":"Hip hinge","d":"Standing, arms crossed on your chest. Push your hips back and tilt forward with a straight back. Come back up.","v":"Hips back, long back, come up.","tip":"Knees soft, don’t squat down."},"goodmorning":{"n":"Good mornings","d":"Standing, arms crossed on your chest. Push your hips back and tilt forward until almost level, back straight. Come up squeezing your glutes.","v":"Hips back, straight back, squeeze your glutes to come up.","tip":"Only go as low as your back stays straight."},"sldl":{"n":"Single-leg deadlift","d":"Standing on one leg. Tilt forward while the other leg stretches back, like a seesaw. Come back up.","v":"Body and leg in line, like a seesaw.","tip":"If you lose balance, touch down with the back toes."},"pelvictilt":{"n":"Pelvic tilt","d":"On your back, knees bent. Lift your hips a little by curling your back from the bottom, then lower slowly.","v":"Curl your pelvis, lift a little, lower slowly.","tip":"It’s a small, gentle movement."},"proneW":{"n":"Chest lift, arms back","d":"Lying face down, arms straight by your sides. Lift chest and arms off the floor, squeezing your shoulder blades, and lower slowly.","v":"Arms back, squeeze your shoulder blades, look at the floor.","tip":"Lift only a little: the work is in your upper back."}},"fr":{"march":{"n":"Marche sur place","d":"Debout, lève un genou puis l’autre en balançant les bras. Rythme confortable.","v":"Genoux en haut, bras relâchés. Réveille ton corps.","tip":"Pour plus d’intensité, monte les genoux à hauteur de hanche."},"armcircle":{"n":"Cercles de bras","d":"Debout, dessine de grands cercles vers l’arrière avec les bras tendus.","v":"Grands cercles lents. Relâche les épaules.","tip":"À mi-parcours, change de sens."},"hipcircle":{"n":"Cercles de hanches","d":"Mains sur la taille, genoux souples. Dessine de grands cercles avec les hanches.","v":"Grands cercles de hanches, sans te presser.","tip":"À mi-parcours, change de sens."},"catcow":{"n":"Chat-vache","d":"À quatre pattes. À l’inspiration, creuse le dos et regarde devant ; à l’expiration, arrondis-le comme un chat.","v":"Inspire, ouvre la poitrine. Expire, arrondis le dos.","tip":"Bouge avec ta respiration, sans forcer."},"squat_half":{"n":"Demi-squat","d":"Pieds écartés à largeur de hanches. Recule les hanches comme pour t’asseoir, seulement à mi-hauteur, puis remonte.","v":"Hanches en arrière, poitrine haute. Descends et remonte.","tip":"Les genoux suivent la direction des pieds. Poids sur les talons."},"squat":{"n":"Squat","d":"Pieds écartés à largeur de hanches. Recule les hanches jusqu’à ce que les cuisses soient presque parallèles au sol, puis remonte en poussant le sol.","v":"Descends contrôlée, remonte en poussant le sol.","tip":"Dos long et talons bien au sol. Bras devant pour l’équilibre."},"jumpsquat":{"n":"Squat sauté","d":"Fais un squat et, en remontant, saute en douceur. Atterris genoux souples et enchaîne.","v":"Descends, saute, atterris en douceur.","tip":"Si tu ne peux pas sauter (voisins, genoux), fais des squats avec 3 secondes de pause en bas."},"lunge_short":{"n":"Fente arrière courte","d":"Debout, fais un petit pas en arrière et plie légèrement les deux genoux. Reviens et change de jambe.","v":"Pas en arrière, descends un peu, reviens. Alterne.","tip":"Garde le poids sur la jambe avant. Va lentement pour garder l’équilibre."},"lunge":{"n":"Fente arrière","d":"Fais un grand pas en arrière et descends le genou arrière près du sol. Reviens en poussant sur la jambe avant. Alterne.","v":"Pas en arrière, genou en bas, reviens. Alterne les jambes.","tip":"Le genou avant reste au-dessus de la cheville. Buste droit."},"lunge_knee":{"n":"Fente arrière avec montée de genou","d":"Fente arrière et, en revenant, monte ce genou à hauteur de hanche. Alterne les jambes.","v":"Fente arrière et genou en haut. Avec contrôle.","tip":"Si tu perds l’équilibre, pose le pied un instant avant de monter le genou."},"sumo":{"n":"Squat sumo","d":"Pieds plus écartés que les hanches, pointes vers l’extérieur. Descends buste droit et remonte en serrant les fessiers.","v":"Pieds écartés, genoux vers l’extérieur. Descends et remonte.","tip":"Les genoux pointent dans la même direction que les pieds."},"sumo_pulse":{"n":"Squat sumo pulsé","d":"Position sumo. Descends et fais deux petits rebonds en bas avant de remonter.","v":"Descends, deux petits rebonds, remonte.","tip":"Rebonds petits et contrôlés, sans te laisser tomber."},"sumohold":{"n":"Squat sumo tenu","d":"Descends en position sumo et reste là, buste droit et genoux vers l’extérieur.","v":"Tiens en bas. Respire.","tip":"Si ça brûle trop, remonte un peu et continue de tenir."},"calfraise":{"n":"Montées sur pointes","d":"Debout, monte lentement sur la pointe des pieds et redescends sans poser complètement les talons.","v":"Monte sur les pointes, descends lentement.","tip":"Fixe un point devant toi pour garder l’équilibre."},"calfraise_slow":{"n":"Montées sur pointes lentes","d":"Monte sur les pointes, tiens 2 secondes en haut et descends en 3 secondes.","v":"Monte, tiens, descends lentement.","tip":"Plus c’est lent, plus les mollets travaillent."},"squathold":{"n":"Squat isométrique","d":"Descends en squat et reste immobile, comme assise sur une chaise invisible.","v":"Tiens en bas. Respire tranquillement.","tip":"Niveau facile : reste à mi-hauteur."},"bridge":{"n":"Pont fessier","d":"Sur le dos, genoux pliés et pieds au sol. Monte les hanches en serrant les fessiers et redescends lentement.","v":"Monte les hanches, serre les fessiers, descends lentement.","tip":"Pousse avec les talons. Ne cambre pas le bas du dos."},"bridgehold":{"n":"Pont fessier tenu","d":"Monte les hanches en pont et garde-les en haut, fessiers serrés.","v":"Hanches en haut, tiens. Respire.","tip":"Si tu sens le bas du dos, descends un peu les hanches."},"bridge1leg":{"n":"Pont fessier sur une jambe","d":"Pont avec une jambe tendue vers le haut. Monte et descends les hanches. À mi-parcours, change de jambe.","v":"Une jambe en l’air, monte les hanches. Change à mi-parcours.","tip":"Les hanches montent droites, sans basculer d’un côté."},"bridgemarch":{"n":"Pont fessier en marche","d":"En pont, ramène un genou vers la poitrine puis l’autre, sans laisser descendre les hanches.","v":"Hanches en haut, marche lente.","tip":"Si les hanches descendent, fais le pont classique."},"pushup_knee":{"n":"Pompe sur les genoux","d":"Genoux sur le tapis et mains sous les épaules. Descends la poitrine vers le sol et remonte, corps droit des genoux à la tête.","v":"Poitrine en bas, pousse pour remonter. Abdos gainés.","tip":"Coudes à environ 45 degrés du corps, pas trop écartés."},"pushup":{"n":"Pompe","d":"En planche, mains sous les épaules. Descends la poitrine près du sol et remonte, corps bien aligné.","v":"Corps droit, descends et remonte.","tip":"Si les hanches s’affaissent, passe aux pompes sur les genoux."},"pushup_slow":{"n":"Pompe lente","d":"Pompe en descendant en 3 secondes et en remontant en 3 secondes.","v":"Trois secondes en bas, trois en haut.","tip":"La lenteur fait la difficulté : pas besoin d’en faire beaucoup."},"shouldertap_knee":{"n":"Touchers d’épaules sur les genoux","d":"En planche sur les genoux, touche l’épaule opposée avec une main et alterne.","v":"Touche l’épaule, alterne. Hanches immobiles.","tip":"Écarte un peu les genoux pour plus de stabilité."},"shouldertap":{"n":"Touchers d’épaules en planche","d":"En planche haute, touche l’épaule opposée avec une main et alterne, sans balancer les hanches.","v":"Touche l’épaule et alterne. Hanches immobiles.","tip":"Pieds écartés = plus facile ; pieds joints = plus difficile."},"shouldertap_hard":{"n":"Touchers d’épaules, pieds joints","d":"Planche haute pieds joints. Touche lentement l’épaule opposée et alterne.","v":"Pieds joints, touchers lents. Rien ne bouge.","tip":"Compte deux secondes à chaque toucher."},"floordip":{"n":"Dips au sol","d":"Assise, mains derrière toi doigts vers toi, genoux pliés. Monte les hanches, puis plie et tends les coudes.","v":"Plie les coudes vers l’arrière et tends.","tip":"Niveau facile : petit mouvement. Épaules loin des oreilles."},"floordip_leg":{"n":"Dips au sol, jambe tendue","d":"Comme les dips au sol, mais avec une jambe tendue. À mi-parcours, change de jambe.","v":"Coudes en arrière et tends. Change de jambe à mi-parcours.","tip":"Garde les hanches hautes tout le temps."},"downdog":{"n":"Chien tête en bas pédalé","d":"Mains et pieds au sol, hanches en haut, comme un V inversé. Plie un genou puis l’autre.","v":"Hanches en haut, pédale doucement.","tip":"Tu peux garder les genoux pliés : l’important, c’est le dos long."},"pike":{"n":"Pompe en pike","d":"Depuis le V inversé, plie les coudes pour approcher la tête du sol entre les mains, puis remonte.","v":"Hanches en haut, tête vers le sol, remonte.","tip":"Ça travaille les épaules. Rapproche les pieds des mains pour corser l’exercice."},"pike_slow":{"n":"Pompe en pike lente","d":"Pompe en pike en descendant en 3 secondes.","v":"Descends en trois secondes, remonte.","tip":"Coudes vers l’arrière, pas sur les côtés."},"plank_knee":{"n":"Planche sur les genoux","d":"Avant-bras ou mains au sol, genoux posés. Corps droit des genoux à la tête. Tiens.","v":"Abdos gainés. Respire.","tip":"Regarde le sol pour ne pas forcer sur la nuque."},"plank":{"n":"Planche","d":"Mains sous les épaules et jambes tendues. Corps bien aligné. Tiens.","v":"Corps droit, respire tranquillement.","tip":"Si le bas du dos se creuse, pose les genoux."},"plankleg":{"n":"Planche avec jambe levée","d":"En planche, lève une jambe tendue d’une main de hauteur et redescends-la. Alterne.","v":"Planche solide, lève une jambe, alterne.","tip":"Les hanches ne tournent pas quand tu lèves la jambe."},"plankdog":{"n":"Planche vers chien tête en bas","d":"Depuis la planche, pousse les hanches vers le haut jusqu’au V inversé et reviens en planche.","v":"Hanches en haut, retour en planche.","tip":"Niveau facile : fais-le avec les genoux posés en planche."},"scap":{"n":"Pompe scapulaire","d":"En planche bras tendus, laisse la poitrine descendre en rapprochant les omoplates, puis pousse le sol pour les écarter.","v":"Rapproche les omoplates, pousse le sol.","tip":"Les coudes ne plient pas. Niveau facile : genoux posés."},"deadbug_easy":{"n":"Dead bug facile","d":"Sur le dos, bras vers le plafond et genoux en table. Descends un pied toucher le sol et reviens. Alterne.","v":"Touche le sol avec un pied, reviens. Alterne.","tip":"Le bas du dos reste collé au tapis."},"deadbug":{"n":"Dead bug","d":"Sur le dos, bras vers le plafond et genoux en table. Tends en même temps un bras en arrière et la jambe opposée. Reviens et alterne.","v":"Bras et jambe opposée loin. Reviens. Bas du dos collé.","tip":"Expire en tendant. Si le bas du dos se décolle, tends moins loin."},"deadbug_slow":{"n":"Dead bug lent","d":"Dead bug en tendant en 3 secondes et en marquant une pause d’une seconde bras et jambe loin.","v":"Tends lentement, tiens, reviens.","tip":"C’est la lenteur qui le rend difficile."},"crunch":{"n":"Crunch","d":"Sur le dos, genoux pliés. Monte la tête et les épaules en regardant tes genoux et redescends lentement.","v":"Monte les épaules, descends lentement.","tip":"Garde l’espace d’un poing entre le menton et la poitrine."},"crunch_tt":{"n":"Crunch jambes en table","d":"Genoux en l’air à 90 degrés, monte la tête et les épaules et redescends lentement.","v":"Jambes immobiles, monte et descends.","tip":"Expire en montant."},"situp":{"n":"Sit-up","d":"Sur le dos, genoux pliés. Monte jusqu’à t’asseoir et redescends vertèbre par vertèbre.","v":"Monte jusqu’à t’asseoir, descends lentement.","tip":"Si tu tires sur la nuque, tends les bras devant toi."},"sideplank_knee":{"n":"Planche latérale sur le genou","d":"Sur le côté, en appui sur l’avant-bras et le genou du bas. Monte les hanches pour former une ligne. Tiens et change de côté.","v":"Hanches en haut, tiens.","tip":"Le coude reste juste sous l’épaule."},"sideplank":{"n":"Planche latérale","d":"Sur le côté, en appui sur l’avant-bras et le bord du pied. Hanches en haut, corps droit. Tiens et change de côté.","v":"Corps droit comme une planche. Tiens.","tip":"Pour simplifier, pose le genou du bas."},"sideplank_dip":{"n":"Planche latérale avec descentes","d":"En planche latérale, descends les hanches presque au sol et remonte-les. Change de côté.","v":"Descends les hanches et remonte.","tip":"Mouvement contrôlé, sans à-coups."},"legraise_single":{"n":"Levée d’une jambe","d":"Sur le dos, jambes tendues. Lève une jambe vers le plafond et redescends-la sans toucher le sol. Alterne.","v":"Une jambe en haut, descends lentement. Alterne.","tip":"Mains sous les fessiers si tu sens le bas du dos."},"reversecrunch":{"n":"Crunch inversé","d":"Sur le dos, genoux en table. Ramène les genoux vers la poitrine en décollant un peu les hanches et redescends lentement.","v":"Genoux à la poitrine, descends lentement.","tip":"Sans élan : le mouvement est petit."},"legraise":{"n":"Levée de jambes","d":"Sur le dos, jambes jointes et tendues. Monte-les vers le plafond et redescends-les lentement sans toucher le sol.","v":"Jambes en haut, descente lente.","tip":"Si le bas du dos se décolle, plie un peu les genoux."},"birddog_easy":{"n":"Bird dog facile","d":"À quatre pattes, tends un bras devant et reviens ; puis la jambe opposée derrière. Alterne.","v":"Tends un bras, reviens. Puis la jambe.","tip":"Dos plat comme une table."},"birddog":{"n":"Bird dog","d":"À quatre pattes, tends en même temps un bras devant et la jambe opposée derrière. Reviens et alterne.","v":"Bras et jambe opposée longs. Reviens et change.","tip":"Imagine un verre d’eau sur ton dos qui ne doit pas tomber."},"birddog_crunch":{"n":"Bird dog coude-genou","d":"Tends le bras et la jambe opposée, puis rapproche coude et genou sous le corps. À mi-parcours, change de côté.","v":"Tends loin, coude au genou.","tip":"Va lentement pour garder l’équilibre."},"hollow_tuck":{"n":"Position creuse groupée","d":"Sur le dos, monte les épaules et les bras, genoux pliés en l’air. Bas du dos collé. Tiens.","v":"Bas du dos collé, tiens. Respire.","tip":"Plus les genoux sont proches, plus c’est facile."},"hollow":{"n":"Position creuse","d":"Sur le dos, bras en arrière et jambes tendues, le tout légèrement décollé du sol. Bas du dos collé. Tiens.","v":"Corps en forme de barque. Tiens.","tip":"Monte davantage les jambes si le bas du dos se décolle."},"hollowrock":{"n":"Position creuse en balancier","d":"En position creuse, balance-toi d’avant en arrière sans perdre la forme.","v":"Forme de barque, balance-toi.","tip":"Si tu perds la forme, reviens à la position tenue immobile."},"swimming":{"n":"Nageuse","d":"Sur le ventre, bras devant. Lève en même temps un bras et la jambe opposée et alterne, comme en nageant.","v":"Bras et jambe opposée en haut. Alterne.","tip":"Regarde le sol pour ne pas forcer sur la nuque."},"superman":{"n":"Superman","d":"Sur le ventre, bras devant. Lève en même temps les bras, la poitrine et les jambes d’une main de hauteur, puis redescends.","v":"Tout en haut, une seconde, en bas.","tip":"Serre les fessiers pour protéger le bas du dos."},"supermanhold":{"n":"Superman tenu","d":"Lève les bras, la poitrine et les jambes et reste en haut en respirant.","v":"En haut et tiens.","tip":"Mieux vaut peu de hauteur bien faite que beaucoup en forçant."},"proneY":{"n":"Élévations en Y","d":"Sur le ventre, bras devant en Y, pouces vers le haut. Lève les bras en rapprochant les omoplates et redescends.","v":"Bras en Y en haut, omoplates serrées.","tip":"Les épaules descendent loin des oreilles."},"proneY_slow":{"n":"Élévations en Y avec pause","d":"Élévations en Y en tenant 2 secondes en haut.","v":"En haut, tiens, en bas.","tip":"Pas d’élan : monte avec le dos."},"bear":{"n":"Ours","d":"À quatre pattes, décolle les genoux de 2 centimètres du sol et tiens, dos plat.","v":"Genoux en suspension. Tiens.","tip":"Si c’est trop dur, pose les genoux et remonte."},"beartap":{"n":"Ours avec touchers d’épaules","d":"En position d’ours, touche l’épaule opposée avec une main et alterne.","v":"Genoux en suspension, touche l’épaule, alterne.","tip":"Les hanches ne se balancent pas."},"swimming_fast":{"n":"Nageuse rapide","d":"Nageuse sur le ventre à un rythme plus soutenu, sans perdre de hauteur.","v":"Bras et jambe opposée, rythme soutenu.","tip":"Respire calmement même si le rythme est rapide."},"climber_slow":{"n":"Mountain climber lent","d":"En planche, ramène un genou vers la poitrine, reviens et change. Lentement.","v":"Genou à la poitrine, alterne lentement.","tip":"Épaules au-dessus des mains."},"climber":{"n":"Mountain climber","d":"En planche, alterne les genoux vers la poitrine en rythme, comme si tu courais.","v":"Genoux à la poitrine, rythme soutenu.","tip":"Hanches basses, alignées avec les épaules."},"burpee_step":{"n":"Burpee sans saut","d":"Debout, accroupis-toi mains au sol, recule les pieds en planche un par un, reviens et relève-toi.","v":"En bas, pieds en arrière, pieds devant, debout.","tip":"Sans te presser : chaque pas bien fait."},"burpee":{"n":"Burpee","d":"Accroupis-toi, saute en planche, ramène les pieds vers les mains et saute bras vers le plafond.","v":"En bas, planche, reviens et saute.","tip":"Si besoin, supprime le saut final."},"childpose":{"n":"Posture de l’enfant","d":"À genoux, assieds-toi sur les talons et tends les bras devant, front au sol.","v":"Respire dans ton dos.","tip":"Écarte les genoux si c’est plus confortable."},"childreach":{"n":"De l’enfant à quatre pattes","d":"Depuis quatre pattes, ramène les hanches vers les talons et reviens, lentement.","v":"Hanches en arrière, respire, reviens.","tip":"Laisse-toi descendre en douceur, sans forcer."},"thread":{"n":"Aiguille qu’on enfile","d":"À quatre pattes, passe un bras sous ton corps et pose l’épaule au sol.","v":"Bras dessous, épaule au sol. Respire.","tip":"Ça ouvre le haut du dos. Sans te presser."},"sphinx":{"n":"Sphinx","d":"Sur le ventre, en appui sur les avant-bras, coudes sous les épaules. Poitrine ouverte.","v":"Poitrine ouverte, épaules loin des oreilles.","tip":"Si le bas du dos gêne, avance les coudes."},"cobra":{"n":"Cobra doux","d":"Sur le ventre, mains sous les épaules. Monte la poitrine avec le dos, sans tendre complètement les bras.","v":"Monte la poitrine, redescends doucement.","tip":"La hauteur ne compte pas. Aucune douleur."},"figure4":{"n":"Figure 4","d":"Sur le dos, croise une cheville sur le genou opposé et ramène les jambes vers la poitrine.","v":"Respire dans le fessier.","tip":"Si c’est trop, laisse le pied du bas au sol."},"hamstring":{"n":"Étirement des ischios","d":"Sur le dos, lève une jambe tendue et tiens-la derrière la cuisse.","v":"Jambe en haut, respire et relâche.","tip":"Tu peux plier un peu le genou."},"seatedfwd":{"n":"Pince assise","d":"Assise jambes tendues, penche-toi en avant depuis les hanches, sans forcer.","v":"Penche-toi depuis les hanches, respire.","tip":"Plie les genoux si ça tire trop."},"butterfly":{"n":"Papillon","d":"Assise, joins les plantes des pieds et laisse tomber les genoux. Penche-toi un peu en avant.","v":"Genoux ouverts, respire.","tip":"N’appuie pas sur les genoux avec les coudes."},"sidequad":{"n":"Quadriceps sur le côté","d":"Allongée sur le côté, ramène le talon du dessus vers le fessier en tenant la cheville.","v":"Talon au fessier, genoux serrés.","tip":"Si tu n’atteins pas la cheville, tiens ton pantalon."},"lowlunge":{"n":"Fente basse","d":"Un genou sur le tapis et l’autre pied devant. Avance un peu les hanches.","v":"Hanches en avant, buste haut.","tip":"Mets quelque chose de doux sous le genou si ça gêne."},"yogisquat":{"n":"Squat profond","d":"Pieds écartés, descends en squat profond, mains jointes devant la poitrine.","v":"Descends et respire.","tip":"Si les talons se lèvent, écarte davantage les pieds."},"spinaltwist":{"n":"Torsion allongée","d":"Sur le dos, genoux pliés. Laisse-les tomber d’un côté, bras en croix.","v":"Genoux d’un côté, respire.","tip":"Laisse le poids des jambes faire le travail."},"kneehug":{"n":"Genoux à la poitrine","d":"Sur le dos, serre tes genoux et balance-toi doucement d’avant en arrière.","v":"Serre les genoux, balance-toi doucement.","tip":"C’est un massage pour le bas du dos."},"tricepstretch":{"n":"Étirement des triceps","d":"Debout, lève un bras, plie le coude et amène la main dans le dos. L’autre main pousse doucement le coude.","v":"Coude en haut, pousse doucement.","tip":"Garde la nuque détendue."},"neck":{"n":"Mobilité de la nuque","d":"Debout ou assise, amène lentement le menton vers la poitrine et regarde de nouveau devant.","v":"Menton vers la poitrine, lentement, et reviens.","tip":"Ne bascule jamais la tête en arrière."},"shouldercircle":{"n":"Cercles d’épaules","d":"Mains sur les épaules, dessine de grands cercles avec les coudes.","v":"Grands cercles avec les coudes.","tip":"À mi-parcours, change de sens."},"breathe":{"n":"Respiration finale","d":"Allongée sur le dos, ferme les yeux. Inspire sur 4 temps et expire sur 6.","v":"Inspire sur quatre, expire sur six.","tip":"Laisse ton corps peser sur le tapis."},"gluteknee":{"n":"Genou à la poitrine","d":"Sur le dos, une jambe tendue au sol. Serre l’autre genou et ramène-le vers la poitrine.","v":"Serre le genou, ramène-le et respire.","tip":"Si tu n’atteins pas le genou, tiens l’arrière de la cuisse."},"donkey":{"n":"Kick arrière (donkey kick)","d":"À quatre pattes. Genou plié, monte le talon vers le plafond et redescends lentement. Puis l’autre jambe.","v":"Talon vers le plafond, serre le fessier, dos immobile.","tip":"Monte seulement tant que le dos reste plat."},"squathold_half":{"n":"Demi-squat tenu","d":"Descends à mi-hauteur, comme pour t’asseoir sur une chaise haute, et reste là en respirant.","v":"Hanches en arrière, poitrine haute, respire.","tip":"Si les jambes tremblent, remonte un peu : ça compte quand même."},"rockback":{"n":"Balancier à quatre pattes","d":"À quatre pattes, genoux écartés. Emmène lentement les hanches vers les talons et reviens.","v":"Hanches vers les talons, expire.","tip":"Descends seulement tant que c’est confortable."},"hiphinge":{"n":"Charnière de hanche","d":"Debout, bras croisés sur la poitrine. Recule les hanches et penche le buste, dos droit. Remonte.","v":"Hanches en arrière, dos long, remonte.","tip":"Genoux souples, sans t’accroupir."},"goodmorning":{"n":"Good morning","d":"Debout, bras croisés sur la poitrine. Recule les hanches et penche le buste presque à l’horizontale, dos droit. Remonte en serrant les fessiers.","v":"Hanches en arrière, dos droit, remonte en serrant les fessiers.","tip":"Descends seulement tant que le dos reste droit."},"sldl":{"n":"Soulevé de terre sur une jambe","d":"Debout sur une jambe. Penche le buste en avant pendant que l’autre jambe s’allonge en arrière, comme une balançoire. Remonte.","v":"Buste et jambe alignés, comme une balançoire.","tip":"Si tu perds l’équilibre, pose la pointe du pied arrière."},"pelvictilt":{"n":"Bascule du bassin","d":"Sur le dos, genoux pliés. Décolle un peu les hanches en enroulant le dos depuis le bas, puis redescends lentement.","v":"Enroule le bassin, monte un peu, redescends lentement.","tip":"C’est un petit mouvement doux."},"proneW":{"n":"Buste levé, bras en arrière","d":"Allongée sur le ventre, bras tendus le long du corps. Décolle poitrine et bras en serrant les omoplates, puis redescends lentement.","v":"Bras en arrière, serre les omoplates, regard au sol.","tip":"Monte peu : le travail est dans le haut du dos."}}};

const EXT={"march":{"es":{"d":"Marcha en el sitio subiendo las rodillas. Calienta el cuerpo y activa las piernas y la barriga.","v":"Espalda alta, sube la rodilla y mueve el brazo contrario.","pos":"De pie, con los pies separados al ancho de tus caderas. Rodillas un poco sueltas. Espalda recta y hombros bajos y relajados.","exe":"1. Sube una rodilla sin echar el cuerpo hacia atrás · 2. Apoya el pie suave, primero la parte delantera · 3. Mueve el brazo contrario hacia delante · 4. Mantén un ritmo constante de 1 s por paso.","resp":"Respira por la nariz. Coge aire en 2 pasos y suéltalo en 2.","err":"Echar el cuerpo atrás: sube menos la rodilla y aprieta la barriga · Pisar fuerte con el talón: apoya suave la punta primero · Subir los hombros: bájalos y suelta el cuello","mus":"Flexores de la cadera (psoas), parte delantera del muslo (recto femoral), lateral del glúteo (glúteo medio), gemelos, barriga (transverso)"},"en":{"d":"Marching on the spot, lifting your knees. It warms you up and works your legs and belly.","v":"Stand tall, lift the knee, swing the opposite arm.","pos":"Stand with feet hip-width apart. Keep your knees soft. Back straight, shoulders low and relaxed.","exe":"1. Lift one knee without leaning back · 2. Set the foot down softly, front of the foot first · 3. Swing the opposite arm forward · 4. Keep a steady pace of 1 s per step.","resp":"Breathe through your nose. In for 2 steps, out for 2.","err":"Leaning back: lift the knee less and tighten your belly · Stomping on the heel: land softly on the front of the foot · Shrugging: drop your shoulders and relax your neck","mus":"Hip flexors (psoas), front of the thigh (rectus femoris), side of the bottom (gluteus medius), calves, deep belly (transversus)"},"fr":{"d":"Marche sur place en montant les genoux. Elle réchauffe le corps et travaille les jambes et le ventre.","v":"Buste haut, monte le genou, bras opposé devant.","pos":"Debout, pieds écartés à la largeur des hanches. Genoux un peu souples. Dos droit, épaules basses et détendues.","exe":"1. Monte un genou sans pencher le buste en arrière · 2. Repose le pied en douceur, l’avant du pied d’abord · 3. Balance le bras opposé vers l’avant · 4. Garde un rythme régulier de 1 s par pas.","resp":"Respire par le nez. Inspire sur 2 pas, expire sur 2 pas.","err":"Pencher le buste en arrière : monte moins le genou et serre le ventre · Taper du talon : pose doucement l’avant du pied · Épaules qui montent : baisse-les et relâche le cou","mus":"Avant de la hanche (psoas), avant de la cuisse (droit fémoral), côté du fessier (moyen fessier), mollets, ventre profond (transverse)"}},"armcircle":{"es":{"d":"Círculos amplios con los brazos estirados. Mueven y calientan los hombros. A mitad, cambias de sentido.","v":"Hombros lejos de las orejas, brazos largos, círculos grandes.","pos":"De pie, pies al ancho de caderas y rodillas sueltas. Espalda recta. Brazos en cruz a la altura de los hombros, palmas abajo.","exe":"1. Empieza con círculos pequeños hacia atrás · 2. Hazlos más grandes poco a poco, sin arquear la espalda · 3. Tarda unos 2 s en cada círculo · 4. A mitad, cambia y gira hacia delante.","resp":"Respira sin parar. Coge aire en medio círculo y suéltalo en el otro medio.","err":"Subir los hombros: bájalos lejos de las orejas · Arquear la espalda baja: aprieta la barriga · Girar muy rápido: hazlo lento y amplio","mus":"Hombros (deltoides y manguito rotador), parte alta y media de la espalda (trapecio y romboides), costado del pecho (serrato)"},"en":{"d":"Wide circles with straight arms. They loosen and warm up your shoulders. Halfway, you switch direction.","v":"Shoulders away from ears, long arms, big circles.","pos":"Stand with feet hip-width and soft knees. Back straight. Arms out to the sides at shoulder height, palms down.","exe":"1. Start with small backward circles · 2. Make them bigger bit by bit, without arching your back · 3. Take about 2 s per circle · 4. Halfway, switch to forward circles.","resp":"Keep breathing. Breathe in for half a circle, out for the other half.","err":"Shrugging: keep your shoulders away from your ears · Arching your lower back: tighten your belly · Spinning too fast: go slow and wide","mus":"Shoulders (deltoids and rotator cuff), upper and middle back (trapezius and rhomboids), side of the chest (serratus anterior)"},"fr":{"d":"Grands cercles avec les bras tendus. Ils mobilisent et réchauffent les épaules. À mi-temps, tu changes de sens.","v":"Épaules loin des oreilles, bras longs, grands cercles.","pos":"Debout, pieds à la largeur des hanches, genoux souples. Dos droit. Bras en croix à hauteur d’épaules, paumes vers le bas.","exe":"1. Commence par de petits cercles vers l’arrière · 2. Agrandis-les peu à peu, sans cambrer le dos · 3. Prends environ 2 s par cercle · 4. À mi-temps, tourne vers l’avant.","resp":"Respire sans t’arrêter. Inspire sur un demi-cercle, expire sur l’autre.","err":"Épaules qui montent : éloigne-les des oreilles · Bas du dos cambré : serre le ventre · Tourner trop vite : va lentement et en grand","mus":"Épaules (deltoïdes et coiffe des rotateurs), haut et milieu du dos (trapèze et rhomboïdes), côté de la poitrine (dentelé antérieur)"}},"hipcircle":{"es":{"d":"Círculos amplios con la cadera. Sueltan la cadera y la pelvis mientras el resto del cuerpo queda quieto.","v":"Rodillas sueltas, hombros quietos, dibuja el círculo con la cadera.","pos":"De pie, pies un poco más abiertos que las caderas. Rodillas algo dobladas. Manos en la cintura y hombros relajados.","exe":"1. Lleva la cadera hacia un lado · 2. Pasa la cadera hacia atrás y al otro lado · 3. Cierra el círculo llevando la cadera hacia delante · 4. Tarda 3 o 4 s por círculo. A mitad, cambia de sentido.","resp":"Respira lento y sin parar. Suelta el aire al llevar la cadera delante.","err":"Mover los hombros en vez de la cadera: mira un punto fijo y deja el tronco quieto · Rodillas rígidas: mantenlas sueltas · Círculos pequeños y rápidos: hazlos más amplios, sin dolor","mus":"Lateral del glúteo (glúteo medio), cadera (psoas), costados (oblicuos), lumbares (cuadrado lumbar), interior del muslo (aductores)"},"en":{"d":"Wide circles with your hips. They loosen your hips and pelvis while the rest of you stays still.","v":"Soft knees, still shoulders, draw the circle with your hips.","pos":"Stand with feet a little wider than your hips. Knees slightly bent. Hands on your waist, shoulders relaxed.","exe":"1. Move your hips to one side · 2. Push your hips back, then to the other side · 3. Close the circle by moving your hips forward · 4. Take 3 or 4 s per circle. Switch direction halfway.","resp":"Breathe slowly and steadily. Breathe out as your hips move forward.","err":"Moving your shoulders instead of your hips: look at a fixed point, keep your torso still · Locked knees: keep them soft · Small, fast circles: make them wider, without pain","mus":"Side of the bottom (gluteus medius), hip flexors (psoas), sides of the waist (obliques), lower back (quadratus lumborum), inner thigh"},"fr":{"d":"Grands cercles avec les hanches. Ils assouplissent les hanches et le bassin, le reste du corps reste immobile.","v":"Genoux souples, épaules immobiles, dessine le cercle avec le bassin.","pos":"Debout, pieds un peu plus écartés que les hanches. Genoux un peu fléchis. Mains sur la taille, épaules relâchées.","exe":"1. Déplace le bassin sur un côté · 2. Pousse les hanches en arrière, puis vers l’autre côté · 3. Ferme le cercle en avançant les hanches · 4. Prends 3 ou 4 s par cercle. Change de sens à mi-temps.","resp":"Respire lentement et sans t’arrêter. Expire quand les hanches passent devant.","err":"Bouger les épaules au lieu du bassin : fixe un point et garde le buste immobile · Genoux bloqués : garde-les souples · Petits cercles rapides : agrandis-les, sans douleur","mus":"Côté du fessier (moyen fessier), hanche (psoas), côtés de la taille (obliques), bas du dos (carré des lombes), intérieur de la cuisse"}},"catcow":{"es":{"d":"A cuatro patas, alternas es
