high, elbows back, straighten. Switch legs halfway.","pos":"Sit with your hands behind your hips, fingers toward you. One knee bent, foot flat. Other leg straight, heel on the floor. Hips high and level.","exe":"1. Lift your hips by squeezing the bent-leg glute · 2. Bend your elbows backward in 2 s, to a right angle · 3. Push for 1 s and straighten without locking · 4. Halfway through the set, switch legs","resp":"Breathe in as your elbows bend. Breathe out as you push.","err":"Hips dropping or tilting: squeeze the glute and level your hips · Shoulders shrugged: move them away from your ears · Elbows out wide: point them back","mus":"Back of arm (triceps), front of shoulder (deltoid), chest (pectorals), bottom (gluteus maximus), back of thigh (hamstrings)"},"fr":{"d":"Dips au sol avec une jambe tendue. Avec moins d’appui, l’arrière des bras travaille plus. Change de jambe à la moitié de la série.","v":"Hanches hautes, coudes en arrière, tends. Change de jambe à mi-série.","pos":"Assise, mains derrière les hanches, doigts vers toi. Un genou plié, pied à plat. L’autre jambe tendue, talon au sol. Hanches hautes et bien droites.","exe":"1. Monte les hanches en serrant le fessier de la jambe pliée · 2. Plie les coudes vers l’arrière en 2 s, jusqu’à angle droit · 3. Pousse en 1 s et tends sans verrouiller · 4. À la moitié de la série, change de jambe","resp":"Inspire en pliant les coudes. Expire en poussant.","err":"Hanches qui tombent ou penchent : serre le fessier et remets le bassin droit · Épaules haussées : éloigne-les des oreilles · Coudes ouverts : oriente-les vers l’arrière","mus":"Arrière du bras (triceps), avant de l’épaule (deltoïde), poitrine (pectoraux), fesses (grand fessier), arrière de la cuisse"}},"downdog":{"es":{"d":"Perro boca abajo en movimiento. Formas una V al revés y doblas una rodilla y luego la otra. Estira la parte de atrás de las piernas y fortalece hombros.","v":"Empuja el suelo, cadera arriba, pedalea suave.","pos":"Empieza a cuatro patas, con los dedos de las manos abiertos. Sube la cadera hasta formar una V al revés. Brazos junto a las orejas y cabeza relajada.","exe":"1. Empuja el suelo y aleja el pecho de las manos · 2. Dobla una rodilla mientras el otro talón baja, en 1 a 2 s · 3. Alterna con ritmo, sin mover la cadera","resp":"Respira lento y sin parar. Suelta el aire al bajar cada talón.","err":"Espalda redonda: dobla las 2 rodillas y lleva la cadera atrás y arriba · Hombros hacia las orejas: empuja el suelo · Peso en las muñecas: apoya toda la mano","mus":"Hombros (deltoides), costado (serrato), brazos (tríceps), espalda (erectores), parte de atrás del muslo, gemelos"},"en":{"d":"A moving downward dog. You make an upside-down V and bend one knee, then the other. It stretches the backs of your legs and strengthens your shoulders.","v":"Push the floor, hips high, pedal gently.","pos":"Start on all fours with your fingers spread. Lift your hips into an upside-down V. Arms by your ears, head relaxed.","exe":"1. Push the floor and move your chest away from your hands · 2. Bend one knee as the other heel lowers, over 1 to 2 s · 3. Alternate with rhythm, keeping your hips still","resp":"Breathe slowly and steadily. Breathe out as each heel lowers.","err":"Rounded back: bend both knees and send your hips back and up · Shoulders creeping to your ears: push the floor away · Weight in your wrists: press through the whole hand","mus":"Shoulders (deltoids), side of ribs (serratus), arms (triceps), back (erector spinae), back of thigh (hamstrings), calves"},"fr":{"d":"Chien tête en bas en mouvement. Tu formes un V à l’envers et tu plies un genou puis l’autre. Il étire l’arrière des jambes et renforce les épaules.","v":"Repousse le sol, hanches hautes, pédale doucement.","pos":"Commence à quatre pattes, doigts bien écartés. Monte les hanches pour former un V à l’envers. Bras près des oreilles, tête relâchée.","exe":"1. Repousse le sol et éloigne la poitrine des mains · 2. Plie un genou pendant que l’autre talon descend, en 1 à 2 s · 3. Alterne en rythme, sans bouger les hanches","resp":"Respire lentement et sans t’arrêter. Expire quand chaque talon descend.","err":"Dos rond : plie les 2 genoux et envoie les hanches en arrière et en haut · Épaules vers les oreilles : repousse le sol · Poids sur les poignets : appuie avec toute la main","mus":"Épaules (deltoïdes), côtes (dentelé), bras (triceps), dos (érecteurs), arrière de la cuisse (ischio-jambiers), mollets"}},"pike":{"es":{"d":"Flexión en pica: desde la V al revés, bajas la cabeza hacia el suelo. Es un empuje hacia arriba que fortalece sobre todo los hombros.","v":"Cadera alta, codos atrás, cabeza al suelo y empuja.","pos":"V al revés: manos separadas como tus hombros. Pies a 1 metro de las manos. Cadera alta, piernas estiradas o rodillas un poco dobladas. Mira entre tus manos.","exe":"1. Pasa el peso a las manos con la cadera alta · 2. Baja en 2 s doblando los codos hacia atrás · 3. Acerca la cabeza al suelo, por delante de las manos · 4. Empuja en 1 s hasta estirar los brazos","resp":"Coge aire al bajar. Suéltalo al empujar.","err":"Codos hacia los lados: apúntalos hacia atrás · Bajar la cadera: mantenla alta, no es una flexión normal · Apoyar la cabeza: para a 2 o 3 centímetros del suelo","mus":"Hombros (deltoides), parte de atrás del brazo (tríceps), parte alta de la espalda (trapecio), costado (serrato), pecho alto"},"en":{"d":"Pike push-up: from the upside-down V, you lower your head toward the floor. It is an overhead push that mainly strengthens your shoulders.","v":"Hips high, elbows back, head down, then push.","pos":"Upside-down V: hands shoulder-width apart. Feet about 1 metre from your hands. Hips high, legs straight or knees slightly bent. Look between your hands.","exe":"1. Shift your weight onto your hands, hips high · 2. Lower in 2 s, bending your elbows back · 3. Bring your head near the floor, ahead of your hands · 4. Push for 1 s until your arms are straight","resp":"Breathe in as you lower. Breathe out as you push.","err":"Elbows out to the sides: point them back · Hips dropping: keep them high, this is not a normal push-up · Resting on your head: stop 2 or 3 centimetres from the floor","mus":"Shoulders (deltoids), back of arm (triceps), upper back (trapezius), side of ribs (serratus), upper chest"},"fr":{"d":"Pompe en pic : depuis le V à l’envers, tu descends la tête vers le sol. C’est une poussée vers le haut qui renforce surtout les épaules.","v":"Hanches hautes, coudes en arrière, tête vers le sol, pousse.","pos":"V à l’envers : mains écartées comme tes épaules. Pieds à 1 mètre des mains. Hanches hautes, jambes tendues ou genoux un peu pliés. Regarde entre tes mains.","exe":"1. Porte le poids sur les mains, hanches hautes · 2. Descends en 2 s en pliant les coudes vers l’arrière · 3. Approche la tête du sol, devant les mains · 4. Pousse en 1 s jusqu’à tendre les bras","resp":"Inspire en descendant. Expire en poussant.","err":"Coudes sur les côtés : oriente-les vers l’arrière · Hanches qui descendent : garde-les hautes, ce n’est pas une pompe classique · Tête posée : arrête-toi à 2 ou 3 centimètres du sol","mus":"Épaules (deltoïdes), arrière du bras (triceps), haut du dos (trapèze), côtes (dentelé), haut de la poitrine"}},"pike_slow":{"es":{"d":"Flexión en pica lenta: 3 segundos para bajar y 1 para subir. Con los pies más cerca de las manos, los hombros trabajan todavía más.","v":"Baja en tres segundos, codos atrás. Empuja.","pos":"V al revés con los pies algo más cerca de las manos, a unos 70 u 80 centímetros. Manos separadas como tus hombros. Cadera alta y mirada entre las manos.","exe":"1. Pasa el peso a las manos · 2. Baja contando 3 s, codos hacia atrás · 3. Pausa breve con la cabeza a 2 o 3 centímetros del suelo · 4. Empuja en 1 s hasta estirar los brazos","resp":"Coge aire durante la bajada lenta. Suéltalo al empujar.","err":"Codos hacia los lados: llévalos atrás · Caer rápido al final: controla los 3 segundos enteros · Espalda redonda: dobla un poco las rodillas y sube la cadera","mus":"Hombros (deltoides), parte de atrás del brazo (tríceps), parte alta de la espalda (trapecio), costado (serrato), pecho alto"},"en":{"d":"A slow pike push-up: 3 seconds down and 1 second up. With your feet closer to your hands, your shoulders work even harder.","v":"Lower for three seconds, elbows back. Push.","pos":"Upside-down V with your feet a bit closer to your hands, about 70 to 80 centimetres. Hands shoulder-width apart. Hips high, look between your hands.","exe":"1. Shift your weight onto your hands · 2. Lower for a count of 3, elbows back · 3. Pause briefly, head 2 or 3 centimetres off the floor · 4. Push for 1 s until your arms are straight","resp":"Breathe in during the slow lowering. Breathe out as you push.","err":"Elbows out to the sides: bring them back · Dropping fast at the end: control all 3 seconds · Rounded back: bend your knees a little and lift your hips","mus":"Shoulders (deltoids), back of arm (triceps), upper back (trapezius), side of ribs (serratus), upper chest"},"fr":{"d":"Pompe en pic lente : 3 secondes pour descendre et 1 pour monter. Avec les pieds plus près des mains, les épaules travaillent encore plus.","v":"Descends en trois secondes, coudes en arrière. Pousse.","pos":"V à l’envers, pieds un peu plus près des mains, à 70 ou 80 centimètres environ. Mains écartées comme tes épaules. Hanches hautes, regard entre les mains.","exe":"1. Porte le poids sur les mains · 2. Descends en comptant 3 s, coudes vers l’arrière · 3. Courte pause, tête à 2 ou 3 centimètres du sol · 4. Pousse en 1 s jusqu’à tendre les bras","resp":"Inspire pendant la descente lente. Expire en poussant.","err":"Coudes sur les côtés : ramène-les vers l’arrière · Chute rapide à la fin : contrôle les 3 secondes en entier · Dos rond : plie un peu les genoux et monte les hanches","mus":"Épaules (deltoïdes), arrière du bras (triceps), haut du dos (trapèze), côtes (dentelé), haut de la poitrine"}},"plank_knee":{"es":{"d":"Plancha quieta sobre las rodillas. Fortalece la barriga y los glúteos, que sujetan tu espalda. Es una buena base para empezar.","v":"Ombligo adentro, glúteos firmes. Respira.","pos":"Antebrazos o manos debajo de los hombros. Rodillas apoyadas detrás, cadera estirada. Cuerpo recto de rodillas a cabeza y mirada al suelo.","exe":"1. Empuja el suelo y separa un poco los omóplatos · 2. Aprieta barriga y glúteos, cadera recta · 3. Aguanta el tiempo indicado sin perder la línea","resp":"Coge aire por la nariz. Suéltalo lento por la boca, sin soltar la barriga.","err":"Culo en alto: bájalo apretando glúteos · Zona lumbar hundida: mete un poco la pelvis y activa la barriga · Pecho hundido: empuja el suelo","mus":"Barriga (transverso, recto y oblicuos), culo (glúteo mayor), costado (serrato), hombros (deltoides)"},"en":{"d":"A still plank on your knees. It strengthens your tummy and glutes, which support your back. It is a good place to start.","v":"Navel in, glutes tight. Breathe.","pos":"Forearms or hands under your shoulders. Knees down behind you, hips straight. Body straight from knees to head, eyes on the floor.","exe":"1. Push the floor and spread your shoulder blades slightly · 2. Squeeze tummy and glutes, hips level · 3. Hold for the set time without losing the line","resp":"Breathe in through your nose. Breathe out slowly through your mouth, tummy still firm.","err":"Bottom up high: lower it by squeezing your glutes · Lower back sagging: tuck your pelvis slightly and firm your tummy · Chest sinking: push the floor away","mus":"Tummy (transversus, abs and obliques), bottom (gluteus maximus), side of ribs (serratus), shoulders (deltoids)"},"fr":{"d":"Planche immobile sur les genoux. Elle renforce le ventre et les fessiers, qui soutiennent ton dos. C’est une bonne base pour commencer.","v":"Nombril rentré, fessiers serrés. Respire.","pos":"Avant-bras ou mains sous les épaules. Genoux posés derrière, hanches tendues. Corps droit des genoux à la tête, regard au sol.","exe":"1. Repousse le sol et écarte un peu les omoplates · 2. Serre ventre et fessiers, bassin droit · 3. Tiens le temps indiqué sans perdre la ligne","resp":"Inspire par le nez. Expire lentement par la bouche, ventre toujours serré.","err":"Fesses en l’air : baisse-les en serrant les fessiers · Bas du dos creusé : bascule un peu le bassin et serre le ventre · Poitrine qui s’affaisse : repousse le sol","mus":"Ventre (transverse, grand droit et obliques), fesses (grand fessier), côtes (dentelé), épaules (deltoïdes)"}},"plank":{"es":{"d":"Plancha alta quieta, con los brazos estirados. Fortalece barriga, glúteos, piernas y hombros. Todo el cuerpo trabaja a la vez.","v":"Cuerpo recto, glúteos firmes, respira tranquila.","pos":"Manos debajo de los hombros y brazos estirados sin bloquear. Piernas estiradas, pies separados como tu cadera. Cuerpo recto de talones a cabeza.","exe":"1. Empuja el suelo y aleja el pecho de las manos · 2. Aprieta glúteos y muslos, ombligo hacia dentro · 3. Aguanta el tiempo indicado respirando con calma","resp":"Respira sin parar. Suelta el aire largo, sin soltar la barriga.","err":"Zona lumbar hundida: mete un poco la pelvis o apoya las rodillas · Cadera muy alta: bájala en línea con hombros y talones · Hombros hundidos: empuja el suelo","mus":"Barriga (transverso, recto y oblicuos), culo (glúteo), muslos (cuádriceps), costado (serrato), hombros"},"en":{"d":"A still high plank with straight arms. It strengthens your tummy, glutes, legs and shoulders. Your whole body works together.","v":"Body straight, glutes tight, breathe calmly.","pos":"Hands under your shoulders, arms straight but not locked. Legs straight, feet hip-width apart. Body straight from heels to head.","exe":"1. Push the floor and move your chest away from your hands · 2. Squeeze glutes and thighs, navel in · 3. Hold for the set time, breathing calmly","resp":"Keep breathing. Breathe out long, keeping your tummy firm.","err":"Lower back sagging: tuck your pelvis slightly or drop to your knees · Hips too high: lower them in line with shoulders and heels · Shoulders sinking: push the floor","mus":"Tummy (transversus, abs and obliques), bottom (glutes), thighs (quadriceps), side of ribs (serratus), shoulders"},"fr":{"d":"Planche haute immobile, bras tendus. Elle renforce le ventre, les fessiers, les jambes et les épaules. Tout le corps travaille ensemble.","v":"Corps droit, fessiers serrés, respire calmement.","pos":"Mains sous les épaules, bras tendus sans verrouiller. Jambes tendues, pieds écartés comme ton bassin. Corps droit des talons à la tête.","exe":"1. Repousse le sol et éloigne la poitrine des mains · 2. Serre fessiers et cuisses, nombril rentré · 3. Tiens le temps indiqué en respirant calmement","resp":"Respire sans t’arrêter. Expire longuement, ventre toujours serré.","err":"Bas du dos creusé : bascule un peu le bassin ou pose les genoux · Hanches trop hautes : aligne-les avec épaules et talons · Épaules qui s’affaissent : repousse le sol","mus":"Ventre (transverse, grand droit et obliques), fesses (fessiers), cuisses (quadriceps), côtes (dentelé), épaules"}},"plankleg":{"es":{"d":"Plancha alta subiendo una pierna y luego la otra. Trabaja glúteos y barriga, y enseña a mantener la cadera quieta.","v":"Plancha firme, sube una pierna, cadera quieta. Alterna.","pos":"Plancha alta: manos debajo de los hombros, pies separados como tu cadera. Cuerpo recto de talones a cabeza. Cadera recta, sin ladearse.","exe":"1. Aprieta la barriga y empuja el suelo · 2. Sube una pierna estirada un palmo en 1 s · 3. Aguanta 1 s y baja en 1 s · 4. Cambia de pierna sin mover la cadera","resp":"Suelta el aire al subir la pierna. Cógelo al bajarla.","err":"Cadera que gira: sube menos y aprieta el otro glúteo · Arquear la zona lumbar: sube la pierna solo un palmo · Cadera hundida: barriga firme","mus":"Culo (glúteo mayor y medio), parte de atrás del muslo, barriga (transverso y oblicuos), hombros, costado (serrato)"},"en":{"d":"A high plank where you lift one leg, then the other. It works your glutes and tummy, and teaches you to keep your hips still.","v":"Firm plank, lift one leg, hips still. Alternate.","pos":"High plank: hands under your shoulders, feet hip-width apart. Body straight from heels to head. Hips level, not tilting.","exe":"1. Firm your tummy and push the floor · 2. Lift one straight leg a hand’s width in 1 s · 3. Hold 1 s, lower in 1 s · 4. Switch legs without moving your hips","resp":"Breathe out as the leg lifts. Breathe in as it lowers.","err":"Hips turning: lift less and squeeze the other glute · Lower back arching: lift the leg only a hand’s width · Hips sagging: keep your tummy firm","mus":"Bottom (gluteus maximus and medius), back of thigh (hamstrings), tummy (transversus and obliques), shoulders, side of ribs"},"fr":{"d":"Planche haute en levant une jambe puis l’autre. Elle travaille les fessiers et le ventre, et t’apprend à garder le bassin immobile.","v":"Planche solide, lève une jambe, bassin immobile. Alterne.","pos":"Planche haute : mains sous les épaules, pieds écartés comme ton bassin. Corps droit des talons à la tête. Bassin bien droit, sans pencher.","exe":"1. Serre le ventre et repousse le sol · 2. Lève une jambe tendue d’une main en 1 s · 3. Tiens 1 s, redescends en 1 s · 4. Change de jambe sans bouger le bassin","resp":"Expire en levant la jambe. Inspire en la baissant.","err":"Bassin qui tourne : lève moins haut et serre l’autre fessier · Bas du dos creusé : lève la jambe d’une main seulement · Bassin qui s’affaisse : ventre serré","mus":"Fesses (grand et moyen fessier), arrière de la cuisse, ventre (transverse et obliques), épaules, côtes (dentelé)"}},"plankdog":{"es":{"d":"Pasas de plancha a perro boca abajo y vuelves. Fortalece hombros y barriga, y estira la parte de atrás de las piernas.","v":"Empuja el suelo, cadera arriba. Vuelve a plancha firme.","pos":"Plancha alta: manos debajo de los hombros con los dedos abiertos. Pies separados como tu cadera. Cuerpo recto. Más fácil: rodillas apoyadas.","exe":"1. Aprieta la barriga y empuja el suelo · 2. Sube la cadera arriba y atrás en 2 s, hasta la V al revés · 3. Vuelve a la plancha en 2 s, hombros sobre las manos","resp":"Suelta el aire al subir la cadera. Cógelo al volver a plancha.","err":"Espalda redonda en la V: dobla las rodillas y alarga la espalda · Cadera hundida al volver: frena en línea recta con los glúteos · Hombros encogidos: empuja el suelo","mus":"Hombros (deltoides), costado (serrato), brazos (tríceps), barriga (transverso y recto), parte de atrás de las piernas"},"en":{"d":"You move from plank to downward dog and back. It strengthens your shoulders and tummy, and stretches the backs of your legs.","v":"Push the floor, hips up. Back to a firm plank.","pos":"High plank: hands under your shoulders, fingers spread. Feet hip-width apart. Body straight. Easier: knees down.","exe":"1. Firm your tummy and push the floor · 2. Send hips up and back in 2 s into the upside-down V · 3. Return to plank in 2 s, shoulders over hands","resp":"Breathe out as your hips rise. Breathe in as you return to plank.","err":"Rounded back in the V: bend your knees and lengthen your spine · Hips sagging on the way back: stop at a straight line, glutes tight · Shoulders shrugged: push the floor","mus":"Shoulders (deltoids), side of ribs (serratus), arms (triceps), tummy (transversus and abs), backs of the legs"},"fr":{"d":"Tu passes de la planche au chien tête en bas, puis tu reviens. Il renforce les épaules et le ventre, et étire l’arrière des jambes.","v":"Repousse le sol, hanches en haut. Reviens en planche solide.","pos":"Planche haute : mains sous les épaules, doigts écartés. Pieds écartés comme ton bassin. Corps droit. Plus facile : genoux posés.","exe":"1. Serre le ventre et repousse le sol · 2. Monte les hanches en haut et en arrière en 2 s · 3. Arrive au V à l’envers, bras près des oreilles · 4. Reviens en planche en 2 s, épaules au-dessus des mains","resp":"Expire en montant les hanches. Inspire en revenant en planche.","err":"Dos rond dans le V : plie les genoux et allonge le dos · Bassin qui s’affaisse au retour : arrête-toi en ligne droite, fessiers serrés · Épaules haussées : repousse le sol","mus":"Épaules (deltoïdes), côtes (dentelé), bras (triceps), ventre (transverse et grand droit), arrière des jambes"}},"scap":{"es":{"d":"Flexión de omóplatos: con los brazos estirados, solo se mueven los omóplatos. Fortalece los músculos que sujetan tus hombros.","v":"Junta los omóplatos, luego empuja el suelo y sepáralos.","pos":"Plancha alta: manos debajo de los hombros, codos estirados sin bloquear. Cuerpo recto de talones a cabeza. Más fácil: rodillas apoyadas.","exe":"1. Brazos rectos, deja bajar el pecho en 2 s · 2. Los omóplatos se juntan (retracción) · 3. Empuja el suelo en 2 s y sepáralos (protracción) · 4. Repite sin doblar los codos ni mover la cadera","resp":"Coge aire al juntar los omóplatos. Suéltalo al empujar el suelo.","err":"Doblar los codos: mantenlos estirados, el movimiento es pequeño · Cadera o zona lumbar hundida: aprieta glúteos y barriga · Hombros encogidos: aléjalos de las orejas","mus":"Costado (serrato), espalda media (romboides y trapecio), pecho profundo (pectoral menor), barriga (transverso)"},"en":{"d":"Scapular push-up: with straight arms, only your shoulder blades move. It strengthens the muscles that hold your shoulders steady.","v":"Squeeze your shoulder blades, then push the floor apart.","pos":"High plank: hands under your shoulders, elbows straight but not locked. Body straight from heels to head. Easier: knees down.","exe":"1. Arms straight, let your chest sink for 2 s · 2. Your shoulder blades come together (retraction) · 3. Push the floor for 2 s, spreading them (protraction) · 4. Repeat without bending elbows or moving hips","resp":"Breathe in as the blades come together. Breathe out as you push.","err":"Bending your elbows: keep them straight, the movement is small · Hips or lower back sagging: squeeze glutes and tummy · Shoulders shrugged: move them away from your ears","mus":"Side of ribs (serratus), mid back (rhomboids and trapezius), deep chest (pectoralis minor), deep tummy (transversus)"},"fr":{"d":"Pompe scapulaire : bras tendus, seules les omoplates bougent. Elle renforce les muscles qui tiennent tes épaules stables.","v":"Serre les omoplates, puis repousse le sol et écarte-les.","pos":"Planche haute : mains sous les épaules, coudes tendus sans verrouiller. Corps droit des talons à la tête. Plus facile : genoux posés.","exe":"1. Bras tendus, laisse descendre la poitrine en 2 s · 2. Les omoplates se rapprochent (rétraction) · 3. Repousse le sol en 2 s et écarte-les (protraction) · 4. Répète sans plier les coudes ni bouger les hanches","resp":"Inspire quand les omoplates se rapprochent. Expire en repoussant le sol.","err":"Plier les coudes : garde-les tendus, le mouvement est petit · Bassin ou bas du dos qui s’affaisse : serre fessiers et ventre · Épaules haussées : éloigne-les des oreilles","mus":"Côtes (dentelé), milieu du dos (rhomboïdes et trapèze), poitrine profonde (petit pectoral), ventre (transverse)"}},"deadbug_easy":{"es":{"d":"Tumbada boca arriba, bajas un talón y luego el otro. Entrena la barriga para que la espalda no se arquee.","v":"Costillas abajo. Baja un talón y vuelve. Espalda pegada.","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos estirados hacia el techo. Pega la espalda baja a la esterilla.","exe":"1. Aprieta la barriga como un cinturón y baja las costillas · 2. Baja un talón en 2 s, rodilla doblada, hasta rozar el suelo · 3. Vuelve a la mesa en 1 s · 4. Cambia de pierna sin mover la cadera","resp":"Suelta el aire al bajar el talón y tómalo al volver.","err":"Espalda arqueada: baja menos el pie · Cadera que gira: ve más despacio y aprieta la barriga · Brazos que caen: mantenlos encima de los hombros","mus":"Barriga profunda (transverso), barriga (recto abdominal), costados (oblicuos), cadera (psoas ilíaco)"},"en":{"d":"Lying on your back, you lower one heel, then the other. It trains your belly to keep your back from arching.","v":"Ribs down. Lower one heel and come back. Back flat.","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms straight up to the ceiling. Press your lower back into the mat.","exe":"1. Tighten your belly like a belt and drop your ribs · 2. Lower one heel in 2 s, knee bent, to tap the floor · 3. Return to tabletop in 1 s · 4. Switch legs without moving your hips","resp":"Breathe out as the heel lowers, breathe in as you return.","err":"Back arching: lower your foot less far · Hips turning: go slower and tighten your belly · Arms dropping: keep them over your shoulders","mus":"Deep belly (transverse abdominis), belly (rectus abdominis), sides (obliques), hip (iliopsoas)"},"fr":{"d":"Allongée sur le dos, tu descends un talon, puis l’autre. Ça apprend au ventre à empêcher le dos de se creuser.","v":"Côtes basses. Descends un talon et reviens. Dos plaqué.","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras tendus vers le plafond. Plaque le bas du dos au tapis.","exe":"1. Serre le ventre comme une ceinture et baisse les côtes · 2. Descends un talon en 2 s, genou plié, jusqu’à effleurer le sol · 3. Reviens en table en 1 s · 4. Change de jambe sans bouger les hanches","resp":"Souffle en descendant le talon, inspire en revenant.","err":"Dos qui se creuse : descends moins le pied · Hanches qui tournent : va plus lentement et serre le ventre · Bras qui tombent : garde-les au-dessus des épaules","mus":"Ventre profond (transverse), ventre (grand droit), côtés (obliques), hanche (ilio-psoas)"}},"deadbug":{"es":{"d":"Tumbada boca arriba, estiras a la vez un brazo y la pierna contraria. Entrena la barriga para no arquear ni girar.","v":"Brazo y pierna contraria lejos. Costillas abajo. Vuelve.","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos estirados hacia el techo. Pega la espalda baja a la esterilla.","exe":"1. Aprieta la barriga como un cinturón y baja las costillas · 2. Estira un brazo atrás y la pierna contraria en 2 s · 3. Para antes de tocar el suelo. Vuelve a la mesa en 1 s · 4. Cambia de lado","resp":"Suelta el aire al estirar y tómalo al volver al centro.","err":"Espalda que se despega: estira menos brazo y pierna · Costillas que se abren: suelta más aire y bájalas · Prisa: sigue el ritmo, 2 segundos y 1 segundo","mus":"Barriga profunda (transverso), barriga (recto abdominal), costados (oblicuos), cadera (psoas ilíaco), costillas (serrato anterior)"},"en":{"d":"Lying on your back, you stretch one arm and the opposite leg together. It trains your belly not to arch or twist.","v":"Opposite arm and leg long. Ribs down. Come back.","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms straight up to the ceiling. Press your lower back into the mat.","exe":"1. Tighten your belly like a belt and drop your ribs · 2. Reach one arm back and the opposite leg out in 2 s · 3. Stop before touching the floor. Return to tabletop in 1 s · 4. Switch sides","resp":"Breathe out as you stretch, breathe in as you come back.","err":"Back lifting off: stretch your arm and leg less far · Ribs flaring: breathe out more and lower them · Rushing: keep the rhythm, 2 seconds then 1 second","mus":"Deep belly (transverse abdominis), belly (rectus abdominis), sides (obliques), hip (iliopsoas), ribs (serratus anterior)"},"fr":{"d":"Allongée sur le dos, tu tends ensemble un bras et la jambe opposée. Ça apprend au ventre à ne pas creuser ni tourner.","v":"Bras et jambe opposée loin. Côtes basses. Reviens.","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras tendus vers le plafond. Plaque le bas du dos au tapis.","exe":"1. Serre le ventre comme une ceinture et baisse les côtes · 2. Tends un bras en arrière et la jambe opposée en 2 s · 3. Arrête avant le sol. Reviens en table en 1 s · 4. Change de côté","resp":"Souffle en tendant, inspire en revenant au centre.","err":"Bas du dos qui décolle : tends moins loin · Côtes qui s’ouvrent : souffle plus et baisse-les · Précipitation : garde le rythme, 2 secondes puis 1 seconde","mus":"Ventre profond (transverse), ventre (grand droit), côtés (obliques), hanche (ilio-psoas), côtes (dentelé antérieur)"}},"deadbug_slow":{"es":{"d":"Bicho muerto a cámara lenta. Estiras en 3 s y aguantas 1 s, con la espalda baja pegada al suelo.","v":"Estira en 3, aguanta 1, vuelve despacio.","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos estirados hacia el techo. Pega la espalda baja a la esterilla.","exe":"1. Desde la mesa, aprieta la barriga como un cinturón · 2. Estira un brazo y la pierna contraria en 3 s · 3. Pausa 1 s con la espalda baja pegada · 4. Vuelve en 2 s y cambia de lado","resp":"Suelta el aire despacio al estirar y en la pausa, y tómalo al volver.","err":"Aguantar el aire: suéltalo poco a poco todo el rato · Perder el ritmo: cuenta 3, 1 y 2 · Espalda arqueada en la pausa: no alejes tanto la pierna","mus":"Barriga profunda (transverso), barriga (recto abdominal), costados (oblicuos), cadera (psoas ilíaco), costillas (serrato anterior)"},"en":{"d":"Dead bug in slow motion. You stretch in 3 s and hold 1 s, with your lower back flat on the floor.","v":"Stretch for 3, hold for 1, come back slowly.","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms straight up to the ceiling. Press your lower back into the mat.","exe":"1. From tabletop, tighten your belly like a belt · 2. Reach one arm and the opposite leg in 3 s · 3. Pause 1 s with your lower back flat · 4. Return in 2 s and switch sides","resp":"Breathe out slowly as you stretch and pause, then breathe in as you return.","err":"Holding your breath: breathe out steadily the whole time · Losing the rhythm: count 3, 1 and 2 · Back arching in the pause: don’t reach your leg so far","mus":"Deep belly (transverse abdominis), belly (rectus abdominis), sides (obliques), hip (iliopsoas), ribs (serratus anterior)"},"fr":{"d":"Dead bug au ralenti. Tu tends en 3 s et tu tiens 1 s, le bas du dos plaqué au sol.","v":"Tends en 3, tiens 1, reviens doucement.","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras tendus vers le plafond. Plaque le bas du dos au tapis.","exe":"1. Depuis la table, serre le ventre comme une ceinture · 2. Tends un bras et la jambe opposée en 3 s · 3. Pause 1 s, bas du dos plaqué · 4. Reviens en 2 s et change de côté","resp":"Souffle lentement en tendant et pendant la pause, inspire en revenant.","err":"Bloquer l’air : souffle en continu · Perdre le rythme : compte 3, 1 et 2 · Dos qui se creuse pendant la pause : tends la jambe moins loin","mus":"Ventre profond (transverse), ventre (grand droit), côtés (obliques), hanche (ilio-psoas), côtes (dentelé antérieur)"}},"crunch":{"es":{"d":"Encogimiento corto. Subes solo la cabeza y los hombros. Trabaja la barriga sin forzar el cuello.","v":"Costillas hacia la cadera. Sube los hombros. Baja lenta.","pos":"Túmbate boca arriba con las rodillas dobladas. Pies apoyados, separados como tu cadera. Dedos en las sienes o brazos cruzados. Deja un puño entre barbilla y pecho.","exe":"1. Aprieta la barriga y acerca las costillas a la cadera · 2. Sube cabeza y hombros en 1 s, hasta despegar los omóplatos · 3. Pausa 1 s · 4. Baja en 2-3 s sin soltar del todo","resp":"Suelta el aire al subir y tómalo al bajar.","err":"Tirar del cuello: apoya solo los dedos y mira a las rodillas · Subir con impulso: haz la pausa arriba · Barriga que se hincha: suelta el aire y mete el ombligo","mus":"Barriga (recto abdominal), costados (oblicuos interno y externo), barriga profunda (transverso)"},"en":{"d":"A short crunch. You lift only your head and shoulders. It works your belly without straining your neck.","v":"Ribs toward hips. Lift your shoulders. Lower slowly.","pos":"Lie on your back with knees bent. Feet flat, hip-width apart. Fingers at your temples or arms crossed on your chest. Keep a fist between chin and chest.","exe":"1. Tighten your belly and draw your ribs toward your hips · 2. Lift head and shoulders in 1 s, shoulder blades off the mat · 3. Pause 1 s · 4. Lower in 2-3 s without fully relaxing","resp":"Breathe out as you lift, breathe in as you lower.","err":"Pulling your neck: use only your fingertips and look at your knees · Using momentum: pause at the top · Belly puffing out: breathe out and pull your navel in","mus":"Belly (rectus abdominis), sides (internal and external obliques), deep belly (transverse abdominis)"},"fr":{"d":"Un crunch court. Tu montes seulement la tête et les épaules. Ça travaille le ventre sans forcer la nuque.","v":"Côtes vers les hanches. Monte les épaules. Redescends lentement.","pos":"Allonge-toi sur le dos, genoux pliés. Pieds au sol, écartés comme tes hanches. Doigts sur les tempes ou bras croisés. Garde un poing entre menton et poitrine.","exe":"1. Serre le ventre et rapproche les côtes des hanches · 2. Monte tête et épaules en 1 s, omoplates décollées · 3. Pause 1 s · 4. Redescends en 2-3 s sans tout relâcher","resp":"Souffle en montant, inspire en descendant.","err":"Tirer sur la nuque : pose juste les doigts et regarde tes genoux · Prendre de l’élan : fais la pause en haut · Ventre qui gonfle : souffle et rentre le nombril","mus":"Ventre (grand droit), côtés (obliques interne et externe), ventre profond (transverse)"}},"crunch_tt":{"es":{"d":"Encogimiento con las piernas en el aire, en posición de mesa. Las piernas no dan impulso y la barriga trabaja más.","v":"Piernas quietas. Sube los hombros. Baja lenta.","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Dedos en las sienes. Pega la espalda baja a la esterilla.","exe":"1. Deja las piernas quietas en mesa y aprieta la barriga · 2. Sube cabeza y hombros en 1 s, hasta despegar los omóplatos · 3. Pausa 1 s · 4. Baja en 2-3 s sin mover las piernas","resp":"Suelta el aire al subir y tómalo al bajar.","err":"Piernas que se balancean: rodillas quietas encima de la cadera · Espalda arqueada: mete un poco el culo y pega la espalda baja · Tirar del cuello: mira en diagonal a las rodillas","mus":"Barriga (recto abdominal), costados (oblicuos), barriga profunda (transverso), cadera, que trabaja quieta (psoas ilíaco)"},"en":{"d":"A crunch with your legs up in tabletop. Your legs can’t swing to help, so your belly works harder.","v":"Legs still. Lift your shoulders. Lower slowly.","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Fingers at your temples. Press your lower back into the mat.","exe":"1. Keep your legs still in tabletop and tighten your belly · 2. Lift head and shoulders in 1 s, shoulder blades off the mat · 3. Pause 1 s · 4. Lower in 2-3 s without moving your legs","resp":"Breathe out as you lift, breathe in as you lower.","err":"Legs swinging: keep your knees still over your hips · Back arching: tuck your tailbone a little and press your lower back down · Pulling your neck: look diagonally at your knees","mus":"Belly (rectus abdominis), sides (obliques), deep belly (transverse abdominis), hip, working without moving (iliopsoas)"},"fr":{"d":"Un crunch avec les jambes en l’air, en position de table. Les jambes ne donnent pas d’élan, donc le ventre travaille plus.","v":"Jambes immobiles. Monte les épaules. Redescends lentement.","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Doigts sur les tempes. Plaque le bas du dos au tapis.","exe":"1. Garde les jambes immobiles en table et serre le ventre · 2. Monte tête et épaules en 1 s, omoplates décollées · 3. Pause 1 s · 4. Redescends en 2-3 s sans bouger les jambes","resp":"Souffle en montant, inspire en descendant.","err":"Jambes qui se balancent : genoux immobiles au-dessus des hanches · Dos qui se creuse : rentre un peu les fesses et plaque le bas du dos · Tirer sur la nuque : regarde vers tes genoux","mus":"Ventre (grand droit), côtés (obliques), ventre profond (transverse), hanche, qui travaille sans bouger (ilio-psoas)"}},"situp":{"es":{"d":"Abdominal completo: pasas de tumbada a sentada y vuelves despacio. Trabaja la barriga y la parte delantera de la cadera.","v":"Enróllate hasta sentarte. Desenróllate hueso a hueso.","pos":"Túmbate boca arriba con las rodillas dobladas. Pies apoyados, separados como tu cadera. Brazos estirados al frente o cruzados en el pecho.","exe":"1. Despega cabeza y omóplatos, como en un encogimiento · 2. Sigue enrollándote hasta sentarte en 2 s · 3. Baja en 3 s, apoyando la espalda vértebra a vértebra · 4. Apoya los hombros y repite","resp":"Suelta el aire al subir y tómalo al bajar.","err":"Tirar del cuello: lleva los brazos al frente · Pies que se levantan: usa los brazos como contrapeso y sube más despacio · Caer de golpe: baja en 3 segundos","mus":"Barriga (recto abdominal), costados (oblicuos), parte delantera de la cadera (psoas ilíaco), muslo (recto femoral)"},"en":{"d":"A full sit-up: you go from lying to sitting and back down slowly. It works your belly and the front of your hips.","v":"Curl up to sitting. Roll down one bone at a time.","pos":"Lie on your back with knees bent. Feet flat, hip-width apart. Arms straight in front or crossed on your chest.","exe":"1. Lift head and shoulder blades, like a crunch · 2. Keep curling up to sitting in 2 s · 3. Roll down one vertebra at a time in 3 s · 4. Touch your shoulders down and repeat","resp":"Breathe out as you lift, breathe in as you lower.","err":"Pulling your neck: reach your arms forward · Feet lifting: use your arms as a counterweight and go slower · Dropping fast: lower in 3 seconds","mus":"Belly (rectus abdominis), sides (obliques), front of hip (iliopsoas), front of thigh (rectus femoris)"},"fr":{"d":"Un relevé de buste complet : tu passes d’allongée à assise, puis tu redescends lentement. Ça travaille le ventre et l’avant des hanches.","v":"Enroule-toi jusqu’à t’asseoir. Déroule-toi doucement.","pos":"Allonge-toi sur le dos, genoux pliés. Pieds au sol, écartés comme tes hanches. Bras tendus devant toi ou croisés sur la poitrine.","exe":"1. Décolle tête et omoplates, comme pour un crunch · 2. Continue d’enrouler jusqu’à être assise en 2 s · 3. Déroule-toi vertèbre par vertèbre en 3 s · 4. Repose les épaules et recommence","resp":"Souffle en montant, inspire en descendant.","err":"Tirer sur la nuque : tends les bras devant toi · Pieds qui décollent : sers-toi des bras comme contrepoids et monte plus lentement · Tomber d’un coup : redescends en 3 secondes","mus":"Ventre (grand droit), côtés (obliques), avant de la hanche (ilio-psoas), avant de la cuisse (droit fémoral)"}},"sideplank_knee":{"es":{"d":"Plancha de lado apoyando el antebrazo y la rodilla. Trabaja los costados para mantener el cuerpo recto.","v":"Codo bajo el hombro. Cadera arriba. Línea recta.","pos":"Túmbate de lado. Apoya el antebrazo con el codo justo bajo el hombro. Rodillas dobladas en ángulo recto, una encima de la otra. Hombros, cadera y rodillas en línea.","exe":"1. Aprieta la barriga y empuja el suelo con el antebrazo · 2. Sube la cadera en 1 s: hombro, cadera y rodilla en línea · 3. Aguanta el tiempo indicado · 4. Baja con control y cambia de lado","resp":"Respira tranquila todo el rato y suelta el aire al subir la cadera.","err":"Cadera que cae: empuja el suelo y súbela · Hombro hundido: aléjalo de la oreja · Cadera hacia atrás: llévala hacia delante hasta la línea","mus":"Costados (oblicuos), zona lumbar (cuadrado lumbar), lado del glúteo (glúteo medio), barriga profunda (transverso), costillas (serrato anterior)"},"en":{"d":"A side plank on your forearm and knee. It works the sides of your waist to keep your body straight.","v":"Elbow under shoulder. Hips up. Straight line.","pos":"Lie on your side. Put your forearm down, elbow right under your shoulder. Knees bent at a right angle, one on top of the other. Shoulders, hips and knees in line.","exe":"1. Tighten your belly and push the floor with your forearm · 2. Lift your hips in 1 s: shoulder, hip and knee in line · 3. Hold for the set time · 4. Lower with control and switch sides","resp":"Breathe calmly all the time and breathe out as your hips lift.","err":"Hips dropping: push the floor and lift them · Shoulder sinking: move it away from your ear · Hips sticking back: bring them forward into line","mus":"Sides (obliques), lower back (quadratus lumborum), side of bottom (gluteus medius), deep belly (transverse abdominis), ribs (serratus anterior)"},"fr":{"d":"Une planche sur le côté, sur l’avant-bras et le genou. Ça travaille les côtés de la taille pour garder le corps droit.","v":"Coude sous l’épaule. Bassin haut. Ligne droite.","pos":"Allonge-toi sur le côté. Pose l’avant-bras, coude juste sous l’épaule. Genoux pliés à angle droit, l’un sur l’autre. Épaules, hanches et genoux alignés.","exe":"1. Serre le ventre et repousse le sol avec l’avant-bras · 2. Monte le bassin en 1 s, épaule, hanche et genou alignés · 3. Tiens le temps indiqué · 4. Redescends avec contrôle et change de côté","resp":"Respire calmement tout le temps et souffle en montant le bassin.","err":"Bassin qui tombe : repousse le sol et remonte-le · Épaule qui s’écrase : éloigne-la de l’oreille · Bassin en arrière : avance-le jusqu’à la ligne","mus":"Côtés (obliques), bas du dos (carré des lombes), côté des fesses (moyen fessier), ventre profond (transverse), côtes (dentelé antérieur)"}},"sideplank":{"es":{"d":"Plancha de lado sobre el antebrazo y el borde del pie. Trabaja los costados para mantener el cuerpo recto, sin girar.","v":"Cuerpo recto como una tabla. Cadera arriba. Aguanta.","pos":"Túmbate de lado con las piernas estiradas. Apoya el antebrazo con el codo bajo el hombro. Pies uno encima del otro, o el de arriba delante. Cuerpo en línea.","exe":"1. Empuja el suelo con el antebrazo y aprieta la barriga · 2. Sube la cadera en 1 s: línea recta de cabeza a pies · 3. Aguanta sin girar el tronco · 4. Baja con control y cambia de lado","resp":"Respira tranquila todo el rato y suelta el aire al subir la cadera.","err":"Cadera que cae: empuja el suelo o apoya la rodilla de abajo · Tronco que gira: hombros y cadera uno encima del otro · Hombro hundido: aléjalo de la oreja","mus":"Costados (oblicuos), zona lumbar (cuadrado lumbar), lado del glúteo (glúteo medio), faja interna (transverso), costillas (serrato), ingles (aductores)"},"en":{"d":"A side plank on your forearm and the edge of your foot. It works the sides of your waist to keep you straight, without twisting.","v":"Body straight like a board. Hips up. Hold.","pos":"Lie on your side, legs straight. Put your forearm down, elbow under your shoulder. Feet stacked, or top foot in front. Whole body in one line.","exe":"1. Push the floor with your forearm and tighten your belly · 2. Lift your hips in 1 s: straight line from head to feet · 3. Hold without twisting your trunk · 4. Lower with control and switch sides","resp":"Breathe calmly all the time and breathe out as your hips lift.","err":"Hips dropping: push the floor or put your bottom knee down · Trunk twisting: stack shoulders and hips · Shoulder sinking: move it away from your ear","mus":"Sides (obliques), lower back (quadratus lumborum), side of bottom (gluteus medius), deep belly (transverse), ribs (serratus), inner thigh (adductors)"},"fr":{"d":"Une planche sur le côté, sur l’avant-bras et le bord du pied. Ça travaille les côtés de la taille pour rester droite, sans tourner.","v":"Corps droit comme une planche. Bassin haut. Tiens.","pos":"Allonge-toi sur le côté, jambes tendues. Pose l’avant-bras, coude sous l’épaule. Pieds l’un sur l’autre, ou celui du dessus devant. Tout le corps aligné.","exe":"1. Repousse le sol avec l’avant-bras et serre le ventre · 2. Monte le bassin en 1 s, droite de la tête aux pieds · 3. Tiens sans tourner le buste · 4. Redescends avec contrôle et change de côté","resp":"Respire calmement tout le temps et souffle en montant le bassin.","err":"Bassin qui tombe : repousse le sol ou pose le genou du dessous · Buste qui tourne : épaules et hanches l’une sur l’autre · Épaule qui s’écrase : éloigne-la de l’oreille","mus":"Côtés (obliques), bas du dos (carré des lombes), côté des fesses (moyen fessier), ventre profond (transverse), côtes (dentelé), cuisses (adducteurs)"}},"sideplank_dip":{"es":{"d":"Plancha de lado en movimiento. Bajas y subes la cadera despacio, sin girar el cuerpo.","v":"Baja la cadera en 2, sube en 1.","pos":"Ponte en plancha de lado sobre el antebrazo y el borde del pie. Codo bajo el hombro. Cuerpo recto de cabeza a pies y barriga apretada.","exe":"1. Empieza en plancha de lado con la cadera en línea · 2. Baja la cadera en 2 s, casi hasta el suelo · 3. Súbela en 1 s, un poco por encima de la línea · 4. Termina las repeticiones y cambia de lado","resp":"Toma aire al bajar la cadera y suéltalo al subirla.","err":"Tirones: baja despacio, en 2 segundos · Tronco que gira: hombros y cadera uno encima del otro · Hombro hundido: empuja el suelo con el antebrazo","mus":"Costados (oblicuos), zona lumbar (cuadrado lumbar), lado del glúteo (glúteo medio), barriga profunda (transverso), costillas (serrato anterior)"},"en":{"d":"A moving side plank. You lower and lift your hips slowly, without twisting your body.","v":"Lower your hips for 2, lift for 1.","pos":"Get into a side plank on your forearm and the edge of your foot. Elbow under your shoulder. Body straight from head to feet, belly tight.","exe":"1. Start in a side plank with hips in line · 2. Lower your hips in 2 s, almost to the floor · 3. Lift them in 1 s, a little above the line · 4. Finish the reps and switch sides","resp":"Breathe in as your hips lower, breathe out as they lift.","err":"Jerky moves: lower slowly, over 2 seconds · Trunk twisting: stack shoulders and hips · Shoulder sinking: push the floor with your forearm","mus":"Sides (obliques), lower back (quadratus lumborum), side of bottom (gluteus medius), deep belly (transverse abdominis), ribs (serratus anterior)"},"fr":{"d":"Une planche sur le côté en mouvement. Tu descends et remontes le bassin lentement, sans tourner le corps.","v":"Descends le bassin en 2, remonte en 1.","pos":"Mets-toi en planche sur le côté, sur l’avant-bras et le bord du pied. Coude sous l’épaule. Corps droit de la tête aux pieds, ventre serré.","exe":"1. Pars en planche sur le côté, bassin aligné · 2. Descends le bassin en 2 s, presque jusqu’au sol · 3. Remonte en 1 s, un peu au-dessus de la ligne · 4. Termine la série et change de côté","resp":"Inspire en descendant le bassin, souffle en le remontant.","err":"À-coups : descends lentement, en 2 secondes · Buste qui tourne : épaules et hanches l’une sur l’autre · Épaule qui s’écrase : repousse le sol avec l’avant-bras","mus":"Côtés (obliques), bas du dos (carré des lombes), côté des fesses (moyen fessier), ventre profond (transverse), côtes (dentelé antérieur)"}},"legraise_single":{"es":{"d":"Tumbada boca arriba, subes una pierna estirada y luego la otra. Es más fácil que subir las dos juntas.","v":"Espalda pegada. Sube una pierna y baja lenta.","pos":"Túmbate boca arriba con las piernas estiradas. Brazos a los lados con las palmas abajo, o manos bajo los glúteos. Pega la espalda baja a la esterilla.","exe":"1. Aprieta la barriga y deja la cadera quieta · 2. Sube una pierna estirada en 2 s, hasta apuntar al techo · 3. Bájala en 3 s sin tocar el suelo · 4. Cambia de pierna","resp":"Suelta el aire al subir la pierna y tómalo al bajarla.","err":"Espalda arqueada: dobla la otra pierna o pon las manos bajo los glúteos · Bajar de golpe: cuenta 3 segundos · Cadera que gira: deja quietos los dos lados","mus":"Barriga (recto abdominal), barriga profunda (transverso), parte delantera de la cadera (psoas ilíaco), muslo (recto femoral)"},"en":{"d":"Lying on your back, you lift one straight leg, then the other. It’s easier than lifting both together.","v":"Back flat. Lift one leg and lower slowly.","pos":"Lie on your back, legs straight. Arms by your sides, palms down, or hands under your bottom. Press your lower back into the mat.","exe":"1. Tighten your belly and keep your hips still · 2. Raise one straight leg in 2 s, pointing to the ceiling · 3. Lower it in 3 s without touching the floor · 4. Switch legs","resp":"Breathe out as the leg lifts, breathe in as it lowers.","err":"Back arching: bend the other leg or put your hands under your bottom · Dropping fast: count 3 seconds · Hips turning: keep both sides still","mus":"Belly (rectus abdominis), deep belly (transverse abdominis), front of hip (iliopsoas), front of thigh (rectus femoris)"},"fr":{"d":"Allongée sur le dos, tu montes une jambe tendue, puis l’autre. C’est plus facile que de monter les deux ensemble.","v":"Dos plaqué. Monte une jambe et redescends lentement.","pos":"Allonge-toi sur le dos, jambes tendues. Bras le long du corps, paumes au sol, ou mains sous les fesses. Plaque le bas du dos au tapis.","exe":"1. Serre le ventre et garde le bassin immobile · 2. Monte une jambe tendue en 2 s, vers le plafond · 3. Redescends-la en 3 s sans toucher le sol · 4. Change de jambe","resp":"Souffle en montant la jambe, inspire en la descendant.","err":"Dos qui se creuse : plie l’autre jambe ou mets les mains sous les fesses · Descendre d’un coup : compte 3 secondes · Bassin qui tourne : garde les deux côtés immobiles","mus":"Ventre (grand droit), ventre profond (transverse), avant de la hanche (ilio-psoas), avant de la cuisse (droit fémoral)"}},"reversecrunch":{"es":{"d":"Encogimiento inverso: llevas las rodillas al pecho enrollando la pelvis. Movimiento corto y sin impulso.","v":"Enrolla la pelvis, rodillas al pecho, baja lenta.","pos":"Túmbate boca arriba en posición de mesa (rodillas encima de la cadera, espinillas paralelas al suelo). Brazos a los lados, palmas abajo. Espalda baja pegada.","exe":"1. Aprieta la barriga y baja las costillas · 2. Enrolla la pelvis en 1 s, rodillas al pecho, glúteos algo despegados · 3. Pausa 1 s · 4. Baja en 3 s hasta la mesa","resp":"Suelta el aire al enrollar la pelvis y tómalo al bajar.","err":"Piernas que se balancean: sube menos y haz la pausa · Empujar con los brazos: apoya las palmas sin apretar · Bajar de golpe: tómate los 3 segundos","mus":"Barriga (recto abdominal), costados (oblicuos), barriga profunda (transverso), parte delantera de la cadera (psoas ilíaco)"},"en":{"d":"A reverse crunch: you curl your pelvis to bring your knees to your chest. Short range, no swinging.","v":"Curl your pelvis, knees to chest, lower slowly.","pos":"Lie on your back in tabletop (knees over hips, shins parallel to the floor). Arms by your sides, palms down. Lower back on the mat.","exe":"1. Tighten your belly and drop your ribs · 2. Curl your pelvis in 1 s, knees to chest, bottom slightly up · 3. Pause 1 s · 4. Lower in 3 s back to tabletop","resp":"Breathe out as you curl your pelvis, breathe in as you lower.","err":"Legs swinging: move less and pause · Pushing with your arms: rest your palms without pressing · Dropping fast: take the full 3 seconds","mus":"Belly (rectus abdominis), sides (obliques), deep belly (transverse abdominis), front of hip (iliopsoas)"},"fr":{"d":"Un crunch inversé : tu enroules le bassin pour amener les genoux vers la poitrine. Mouvement court, sans élan.","v":"Enroule le bassin, genoux à la poitrine, redescends lentement.","pos":"Allonge-toi sur le dos en position de table (genoux au-dessus des hanches, tibias parallèles au sol). Bras le long du corps, paumes au sol. Bas du dos plaqué.","exe":"1. Serre le ventre et baisse les côtes · 2. Enroule le bassin en 1 s, genoux à la poitrine, fesses décollées · 3. Pause 1 s · 4. Redescends en 3 s jusqu’à la table","resp":"Souffle en enroulant le bassin, inspire en redescendant.","err":"Jambes qui se balancent : bouge moins et fais la pause · Pousser avec les bras : pose les paumes sans appuyer · Descendre d’un coup : prends bien les 3 secondes","mus":"Ventre (grand droit), côtés (obliques), ventre profond (transverse), avant de la hanche (ilio-psoas)"}},"legraise":{"es":{"d":"Tumbada boca arriba, subes las dos piernas estiradas y las bajas despacio. Es exigente: la espalda no debe arquearse.","v":"Espalda pegada, piernas juntas, baja en 3.","pos":"Túmbate boca arriba con las piernas juntas y estiradas. Brazos a los lados con las palmas abajo, o manos bajo los glúteos. Espalda baja pegada y costillas abajo.","exe":"1. Aprieta la barriga y pega la espalda baja a la esterilla · 2. Sube las piernas en 2 s, hasta apuntar al techo · 3. Baja en 3 s solo mientras la espalda siga pegada · 4. Repite sin tocar el suelo","resp":"Suelta el aire al subir y tómalo mientras bajas despacio.","err":"Espalda arqueada al bajar: para más arriba o dobla las rodillas · Impulso: haz una pausa arriba · Cuello tenso: apoya la cabeza relajada","mus":"Barriga (recto abdominal), barriga profunda (transverso), costados (oblicuos), cadera (psoas ilíaco), muslo (recto femoral)"},"en":{"d":"Lying on your back, you lift both straight legs and lower them slowly. It’s hard work: your back must not arch.","v":"Back flat, legs together, lower for 3.","pos":"Lie on your back, legs together and straight. Arms by your sides, palms down, or hands under your bottom. Lower back flat, ribs down.","exe":"1. Tighten your belly and press your lower back into the mat · 2. Raise your legs in 2 s, pointing to the ceiling · 3. Lower in 3 s only while your back stays flat · 4. Repeat without touching the floor","resp":"Breathe out as you lift, breathe in as you lower slowly.","err":"Back arching on the way down: stop higher or bend your knees · Using momentum: pause at the top · Tense neck: rest your head and relax","mus":"Belly (rectus abdominis), deep belly (transverse abdominis), sides (obliques), hip (iliopsoas), thigh (rectus femoris)"},"fr":{"d":"Allongée sur le dos, tu montes les deux jambes tendues et tu les descends lentement. C’est exigeant : le dos ne doit pas se creuser.","v":"Dos plaqué, jambes serrées, descends en 3.","pos":"Allonge-toi sur le dos, jambes serrées et tendues. Bras le long du corps, paumes au sol, ou mains sous les fesses. Bas du dos plaqué, côtes basses.","exe":"1. Serre le ventre et plaque le bas du dos au tapis · 2. Monte les jambes en 2 s, vers le plafond · 3. Descends en 3 s tant que le dos reste plaqué · 4. Recommence sans toucher le sol","resp":"Souffle en montant, inspire pendant la descente lente.","err":"Dos qui se creuse en descendant : arrête plus haut ou plie les genoux · Élan : fais une pause en haut · Nuque tendue : pose la tête, détendue","mus":"Ventre (grand droit), ventre profond (transverse), côtés (obliques), hanche (ilio-psoas), cuisse (droit fémoral)"}},"birddog_easy":{"es":{"d":"A cuatro patas, estiras solo un brazo o solo una pierna. Aprendes a mantener la espalda quieta, sin girar.","v":"Espalda recta. Brazo largo y vuelve. Luego la pierna.","pos":"Ponte a cuatro patas. Manos bajo los hombros y rodillas bajo la cadera. Espalda recta, sin hundirla ni redondearla. Mirada al suelo y barriga apretada.","exe":"1. Estira un brazo al frente en 2 s, a la altura del hombro · 2. Vuelve y estira la pierna contraria atrás en 2 s · 3. Súbela solo hasta la altura de la cadera y vuelve · 4. Cambia de lado sin mover la cadera","resp":"Suelta el aire al estirar y tómalo al volver.","err":"Espalda que se hunde: no subas la pierna más alta que la cadera · Cadera que gira: cadera paralela al suelo · Hombros hundidos: empuja el suelo con la mano","mus":"Espalda (erectores y multífidos), glúteo (glúteo mayor), barriga profunda (transverso), costados (oblicuos), hombro (deltoides)"},"en":{"d":"On all fours, you stretch just one arm or just one leg. You learn to keep your back still, without twisting.","v":"Back straight. Arm long and back. Then the leg.","pos":"Get on all fours. Hands under shoulders, knees under hips. Back straight, not sagging or rounded. Eyes on the floor, belly tight.","exe":"1. Reach one arm forward in 2 s, at shoulder height · 2. Come back and stretch the opposite leg back in 2 s · 3. Lift it only to hip height, then return · 4. Switch sides without moving your hips","resp":"Breathe out as you stretch, breathe in as you come back.","err":"Back sagging: don’t lift your leg above hip height · Hips turning: keep them level with the floor · Shoulders sinking: push the floor with your hand","mus":"Back (erector spinae and multifidus), bottom (gluteus maximus), deep belly (transverse abdominis), sides (obliques), shoulder (deltoid)"},"fr":{"d":"À quatre pattes, tu tends seulement un bras ou seulement une jambe. Tu apprends à garder le dos immobile, sans tourner.","v":"Dos droit. Bras long et reviens. Puis la jambe.","pos":"Mets-toi à quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, ni creusé ni arrondi. Regard au sol, ventre serré.","exe":"1. Tends un bras devant en 2 s, à hauteur d’épaule · 2. Reviens et tends la jambe opposée derrière en 2 s · 3. Monte-la seulement à hauteur de hanche, puis reviens · 4. Change de côté sans bouger le bassin","resp":"Souffle en tendant, inspire en revenant.","err":"Dos qui se creuse : ne monte pas la jambe plus haut que la hanche · Bassin qui tourne : garde-le parallèle au sol · Épaules qui s’écrasent : repousse le sol avec la main","mus":"Dos (érecteurs et multifides), fesses (grand fessier), ventre profond (transverse), côtés (obliques), épaule (deltoïde)"}},"birddog":{"es":{"d":"Perro de caza: a cuatro patas, estiras a la vez un brazo y la pierna contraria. Entrena la espalda para no girar ni hundirse.","v":"Brazo y pierna contraria largos. Cadera quieta.","pos":"Ponte a cuatro patas. Manos bajo los hombros y rodillas bajo la cadera. Espalda recta, sin hundirla ni redondearla. Mirada al suelo y barriga apretada.","exe":"1. Aprieta la barriga como un cinturón · 2. Estira un brazo y la pierna contraria a la vez en 2 s · 3. Pausa 1 s en línea recta · 4. Vuelve en 2 s y cambia de lado","resp":"Suelta el aire al estirar y tómalo al volver.","err":"Espalda que se hunde: pierna solo a la altura de la cadera · Cadera que gira: cadera paralela al suelo · Prisa: sigue el ritmo, 2, 1 y 2 segundos","mus":"Espalda (erectores y multífidos), glúteo (glúteo mayor), barriga profunda (transverso), costados (oblicuos), hombro (deltoides)"},"en":{"d":"Bird dog: on all fours, you stretch one arm and the opposite leg together. It trains your back not to twist or sag.","v":"Opposite arm and leg long. Hips still.","pos":"Get on all fours. Hands under shoulders, knees under hips. Back straight, not sagging or rounded. Eyes on the floor, belly tight.","exe":"1. Tighten your belly like a belt · 2. Reach one arm and the opposite leg together in 2 s · 3. Pause 1 s in a straight line · 4. Return in 2 s and switch sides","resp":"Breathe out as you stretch, breathe in as you come back.","err":"Back sagging: leg only to hip height · Hips turning: keep them level with the floor · Rushing: keep the rhythm, 2, 1 and 2 seconds","mus":"Back (erector spinae and multifidus), bottom (gluteus maximus), deep belly (transverse abdominis), sides (obliques), shoulder (deltoid)"},"fr":{"d":"Bird dog : à quatre pattes, tu tends ensemble un bras et la jambe opposée. Ça apprend au dos à ne pas tourner ni se creuser.","v":"Bras et jambe opposée longs. Bassin immobile.","pos":"Mets-toi à quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, ni creusé ni arrondi. Regard au sol, ventre serré.","exe":"1. Serre le ventre comme une ceinture · 2. Tends ensemble un bras et la jambe opposée en 2 s · 3. Pause 1 s, bien alignée · 4. Reviens en 2 s et change de côté","resp":"Souffle en tendant, inspire en revenant.","err":"Dos qui se creuse : jambe seulement à hauteur de  deep belly (transverse abdominis)"},"fr":{"d":"Bird dog avec crunch : tu tends le bras et la jambe opposée, puis tu rapproches coude et genou sous le corps.","v":"Tends loin. Coude au genou sous le corps.","pos":"Mets-toi à quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos droit, ni creusé ni arrondi. Regard au sol, ventre serré.","exe":"1. Tends un bras et la jambe opposée en 2 s · 2. Pause 1 s, bien alignée · 3. Ramène coude et genou sous le corps en 2 s, dos rond · 4. Fais la moitié des répétitions puis change de côté","resp":"Inspire en tendant, souffle en rapprochant coude et genou.","err":"Perdre l’équilibre : va plus lentement et plante bien la main · Dos qui se creuse en tendant : jambe à hauteur de hanche · Bassin qui tourne : garde-le parallèle au sol","mus":"Ventre (grand droit), côtés (obliques), dos (érecteurs), fesses (grand fessier), ventre profond (transverse)"}},"hollow_tuck":{"es":{"d":"Barquito con las rodillas recogidas. Es la versión fácil: aguantas quieta con la espalda baja pegada al suelo.","v":"Espalda pegada, costillas abajo. Respira y aguanta.","pos":"Túmbate boca arriba con las rodillas dobladas encima de la cadera. Cabeza y omóplatos despegados. Brazos estirados junto a los muslos. Espalda baja pegada.","exe":"1. Mete un poco el culo y pega la espalda baja al suelo · 2. Despega cabeza y omóplatos con las costillas abajo · 3. Recoge las rodillas encima de la cadera · 4. Aguanta el tiempo indicado, respirando","resp":"Respira corto y sin parar, soltando bien el aire para bajar las costillas.","err":"Espalda que se despega: acerca las rodillas al pecho · Cuello tenso: mira a las rodillas, barbilla un poco metida · Aguantar el aire: respira con ritmo","mus":"Barriga (recto abdominal), barriga profunda (transverso), costados (oblicuos), parte delantera de la cadera (psoas ilíaco)"},"en":{"d":"Hollow hold (a curved boat shape) with knees tucked. It’s the easy version: you hold still with your lower back on the floor.","v":"B  · 3. Short pause at the top · 4. Lower in 2 s","resp":"Breathe out as you lift your arms. Breathe in as you lower.","err":"Shrugging: pull your shoulders away from your ears · Lifting the head: look at the floor · Arching the low back: squeeze glutes, move only arms and shoulder blades","mus":"Upper back (middle and lower trapezius, rhomboids), back of shoulder (posterior deltoid, infraspinatus)"},"fr":{"d":"Allongée sur le ventre, tu lèves les bras en forme de Y. Ça renforce le haut du dos et aide ta posture.","v":"Pouces en haut, omoplates en arrière et en bas, monte en Y.","pos":"Allonge-toi sur le ventre, bras tendus en Y, à environ 45 degrés de la tête. Pouces vers le haut, front près du sol. Jambes tendues, fessiers serrés.","exe":"1. Omoplates vers l’arrière et le bas · 2. Lève les bras en Y en 1 s, buste près du sol · 3. Courte pause en haut · 4. Redescends en 2 s","resp":"Expire en levant les bras. Inspire en descendant.","err":"Hausser les épaules : éloigne-les des oreilles · Relever la tête : regarde le sol · Cambrer le bas du dos : serre les fessiers, seuls bras et omoplates bougent","mus":"Haut du dos (trapèze moyen et inférieur, rhomboïdes), arrière d’épaule (deltoïde postérieur, infra-épineux)"}},"proneY_slow":{"es":{"d":"Tumbada boca abajo, subes los brazos en Y y aguantas 2 s arriba. Sin impulso y con el cuello recto.","v":"Sube en Y, aguanta 2 segundos, baja lento.","pos":"Túmbate boca abajo con los brazos estirados en Y, a unos 45 grados de la cabeza. Pulgares arriba y mirada al suelo. Piernas estiradas y glúteos apretados.","exe":"1. Lleva los omóplatos atrás y abajo · 2. Sube los brazos en Y en 2 s · 3. Aguanta 2 s apretando entre los omóplatos · 4. Baja en 2 s","resp":"Suelta el aire al subir. Respira suave en la pausa. Coge aire al bajar.","err":"Usar impulso: cuenta 2 segundos en cada fase · Cerrar la Y arriba: mantén los brazos a 45 grados · Encoger los hombros: mantenlos bajos toda la pausa","mus":"Espalda alta (trapecio medio e inferior,
