 Suéltalo al subir.","err":"Dejarte caer en los rebotes: hazlos cortos y con fuerza · Rodillas que se cierran: mantenlas sobre el segundo dedo · Cuerpo que se inclina: pecho alto y barriga firme","mus":"Interior del muslo (aductores), glúteos (mayor y medio), parte delantera del muslo (cuádriceps), barriga (transverso)"},"en":{"d":"A sumo squat with 2 small pulses at the bottom. It keeps your muscles working longer. Lower in 2 s, 2 pulses, rise in 1 s.","v":"At the bottom, 2 short pulses, stay tight, knees out.","pos":"Sumo stance: feet well wider than your shoulders, toes turned out. Back straight, hands at your chest.","exe":"1. Lower in 2 s until thighs are almost level · 2. Do 2 short pulses of 5 to 10 cm · 3. Push the floor away and rise in 1 s · 4. Squeeze your bottom at the top and repeat.","resp":"Breathe in as you lower. Short breaths in the pulses. Breathe out as you rise.","err":"Dropping into the pulses: keep them short and active · Knees closing in: keep them over your second toe · Leaning forward: chest up, belly firm","mus":"Inner thigh (adductors), bottom (gluteus maximus and medius), front of the thigh (quadriceps), deep belly (transversus)"},"fr":{"d":"Squat sumo avec 2 petits rebonds en bas. Les muscles travaillent plus longtemps. Descends en 2 s, 2 rebonds, remonte en 1 s.","v":"En bas, 2 petits rebonds, ventre serré, genoux ouverts.","pos":"Position sumo : pieds bien plus écartés que les épaules, pointes ouvertes. Dos droit, mains à la poitrine.","exe":"1. Descends en 2 s, cuisses presque parallèles au sol · 2. Fais 2 petits rebonds de 5 à 10 cm · 3. Pousse le sol et remonte en 1 s · 4. Serre les fessiers en haut et recommence.","resp":"Inspire en descendant. Souffle court pendant les rebonds. Expire en remontant.","err":"Se laisser tomber dans les rebonds : garde-les courts et actifs · Genoux qui se ferment : garde-les dans l’axe du deuxième orteil · Buste qui penche : poitrine haute, ventre ferme","mus":"Intérieur de la cuisse (adducteurs), fessiers (grand et moyen fessier), avant de la cuisse (quadriceps), ventre profond (transverse)"}},"sumohold":{"es":{"d":"Te quedas quieta abajo en sentadilla sumo. Trabaja glúteos e interior del muslo sin moverte. Mantén la tensión todo el tiempo.","v":"Quieta abajo, rodillas fuera, pecho alto, respira.","pos":"Pies bastante más abiertos que los hombros y puntas hacia fuera. Espalda recta. Manos en el pecho y mirada al frente.","exe":"1. Baja en 3 s a la postura sumo · 2. Empuja las rodillas hacia fuera · 3. Aguanta quieta, barriga firme, el tiempo marcado · 4. Al terminar, sube despacio en 2 s.","resp":"Respira sin parar y con calma. Nunca aguantes el aire.","err":"Aguantar el aire: respira con ritmo · Rodillas que se cierran: empújalas hacia fuera · Cuerpo que se inclina al cansarte: sube un poco y recupera el pecho alto","mus":"Interior del muslo (aductores), glúteos (mayor y medio), parte delantera del muslo (cuádriceps), lumbares (erectores)"},"en":{"d":"You hold still at the bottom of a sumo squat. It works your bottom and inner thighs. Keep the muscles tight the whole time.","v":"Stay low, knees out, chest up, keep breathing.","pos":"Feet well wider than your shoulders, toes turned out. Back straight. Hands at your chest, eyes forward.","exe":"1. Lower in 3 s into the sumo position · 2. Press your knees out · 3. Hold still, belly firm, for the set time · 4. When done, rise slowly in 2 s.","resp":"Breathe steadily and calmly. Never hold your breath.","err":"Holding your breath: breathe in a steady rhythm · Knees drifting in: press them out · Leaning forward as you tire: rise a little and lift your chest","mus":"Inner thigh (adductors), bottom (gluteus maximus and medius), front of the thigh (quadriceps), lower back (erectors)"},"fr":{"d":"Tu restes immobile en bas du squat sumo. Il travaille les fessiers et l’intérieur des cuisses. Garde les muscles actifs tout le temps.","v":"Immobile en bas, genoux ouverts, poitrine haute, respire.","pos":"Pieds bien plus écartés que les épaules, pointes ouvertes. Dos droit. Mains à la poitrine, regard devant.","exe":"1. Descends en 3 s en position sumo · 2. Pousse les genoux vers l’extérieur · 3. Tiens immobile, ventre ferme, le temps indiqué · 4. À la fin, remonte lentement en 2 s.","resp":"Respire calmement, sans t’arrêter. Ne bloque jamais ton souffle.","err":"Bloquer le souffle : respire en rythme · Genoux qui se ferment : pousse-les vers l’extérieur · Buste qui penche avec la fatigue : remonte un peu et redresse la poitrine","mus":"Intérieur de la cuisse (adducteurs), fessiers (grand et moyen fessier), avant de la cuisse (quadriceps), bas du dos (érecteurs)"}},"calfraise":{"es":{"d":"Subes y bajas de puntillas. Fortalece los gemelos (pantorrilla). Baja despacio, sin apoyar del todo el talón.","v":"Sube recta sobre el dedo gordo, baja lenta sin apoyar el talón.","pos":"De pie, pies al ancho de caderas y paralelos. Rodillas estiradas pero sin bloquear. Brazos a los lados y mirada a un punto fijo.","exe":"1. Sube de puntillas en 1 s, peso en el dedo gordo · 2. Para un instante arriba, tobillos rectos · 3. Baja en 2 s hasta que el talón casi roce el suelo · 4. Repite sin rebotar.","resp":"Suelta el aire al subir. Coge aire al bajar.","err":"Tobillos que se abren hacia fuera: lleva el peso al dedo gordo · Rebotar: baja despacio · Cadera hacia delante: mantén el cuerpo en línea recta","mus":"Pantorrilla (gemelos y sóleo), músculos que sujetan el tobillo (tibial posterior y peroneos)"},"en":{"d":"You rise onto your toes and lower down. It strengthens your calves. Lower slowly, heels not quite touching.","v":"Rise straight over the big toe, lower slowly, heel off the floor.","pos":"Stand with feet hip-width and parallel. Knees straight but not locked. Arms by your sides, eyes on a fixed point.","exe":"1. Rise onto your toes in 1 s, weight over the big toe · 2. Pause briefly at the top, ankles straight · 3. Lower in 2 s until the heel almost touches · 4. Repeat without bouncing.","resp":"Breathe out as you rise. Breathe in as you lower.","err":"Ankles rolling out: shift the weight to your big toe · Bouncing: lower slowly · Hips pushing forward: keep your body in a straight line","mus":"Calves (gastrocnemius and soleus), ankle support muscles (tibialis posterior and peroneals)"},"fr":{"d":"Tu montes et descends sur la pointe des pieds. Il renforce les mollets. Descends lentement, sans poser tout à fait le talon.","v":"Monte sur le gros orteil, descends lentement, talon en l’air.","pos":"Debout, pieds à la largeur des hanches et parallèles. Genoux tendus sans les bloquer. Bras le long du corps, regard sur un point fixe.","exe":"1. Monte sur la pointe en 1 s, poids sur le gros orteil · 2. Courte pause en haut, chevilles droites · 3. Descends en 2 s, le talon frôle le sol · 4. Répète sans rebondir.","resp":"Expire en montant. Inspire en descendant.","err":"Chevilles qui partent vers l’extérieur : mets le poids sur le gros orteil · Rebondir : descends lentement · Hanches qui avancent : garde le corps bien aligné","mus":"Mollets (gastrocnémien et soléaire), muscles qui tiennent la cheville (tibial postérieur et fibulaires)"}},"calfraise_slow":{"es":{"d":"Elevación de talones muy lenta. Subes en 1 s, aguantas 2 s arriba y bajas en 3 s. Así la pantorrilla trabaja más tiempo.","v":"Arriba y aguanta 2, baja en 3, tobillos rectos.","pos":"De pie, pies al ancho de caderas y paralelos. Rodillas estiradas pero sin bloquear. Brazos a los lados y mirada a un punto fijo.","exe":"1. Sube en 1 s lo más alto posible, sobre el dedo gordo · 2. Aguanta 2 s arriba sin balancearte · 3. Baja en 3 s, muy controlada · 4. Roza el suelo con el talón y repite.","resp":"Suelta el aire al subir. Respira suave arriba. Coge aire al bajar.","err":"Acortar la pausa o la bajada: cuenta los segundos · Subir poco: sube todo lo que puedas · Balancearte: barriga firme y mirada fija","mus":"Pantorrilla (gemelos y sóleo), tobillo (tibial posterior y peroneos), flexores de los dedos del pie"},"en":{"d":"A very slow calf raise. Rise in 1 s. Hold 2 s at the top. Lower in 3 s. Your calves work for longer.","v":"Up, hold for 2, lower for 3, ankles straight.","pos":"Stand with feet hip-width and parallel. Knees straight but not locked. Arms by your sides, eyes on a fixed point.","exe":"1. Rise high in 1 s, weight over the big toe · 2. Hold 2 s at the top without swaying · 3. Lower in 3 s, slowly and with control · 4. Brush the floor with your heel and repeat.","resp":"Breathe out as you rise. Breathe gently at the top. Breathe in as you lower.","err":"Rushing the pause or the lowering: count the seconds · Not rising fully: go as high as you can · Swaying: firm belly, fixed gaze","mus":"Calves (gastrocnemius and soleus), ankle muscles (tibialis posterior and peroneals), toe flexors"},"fr":{"d":"Montée sur pointes très lente. Monte en 1 s. Tiens 2 s en haut. Descends en 3 s. Les mollets travaillent plus longtemps.","v":"En haut, tiens 2, descends sur 3, chevilles droites.","pos":"Debout, pieds à la largeur des hanches et parallèles. Genoux tendus sans les bloquer. Bras le long du corps, regard sur un point fixe.","exe":"1. Monte haut en 1 s, poids sur le gros orteil · 2. Tiens 2 s en haut sans osciller · 3. Descends en 3 s, lentement et en contrôle · 4. Effleure le sol avec le talon et recommence.","resp":"Expire en montant. Respire doucement en haut. Inspire en descendant.","err":"Raccourcir la pause ou la descente : compte les secondes · Monter trop peu : monte le plus haut possible · Osciller : ventre ferme, regard fixe","mus":"Mollets (gastrocnémien et soléaire), cheville (tibial postérieur et fibulaires), fléchisseurs des orteils"}},"squathold":{"es":{"d":"Te quedas quieta en sentadilla. Fácil a media altura. Más difícil con los muslos casi paralelos al suelo. Fortalece piernas y glúteos.","v":"Cadera atrás, talones firmes, rodillas fuera, respira.","pos":"De pie, pies al ancho de caderas y puntas un poco hacia fuera. Espalda recta. Brazos al frente, a la altura del pecho.","exe":"1. Lleva la cadera atrás y baja en 3 s · 2. Para a media altura, o más abajo si puedes · 3. Aguanta quieta, barriga firme y peso en los talones · 4. Al terminar, sube en 2 s.","resp":"Respira sin parar y con calma. No aguantes el aire.","err":"Peso en las puntas: siéntate más atrás, peso en los talones · Rodillas hacia dentro: alinéalas con el segundo dedo · Espalda redonda o arqueada: pecho alto y espalda recta","mus":"Parte delantera del muslo (cuádriceps), glúteos, interior del muslo (aductores), parte de atrás del muslo (isquiotibiales)"},"en":{"d":"You hold still in a squat. Easy at half height. Harder with thighs almost level with the floor. It strengthens legs and bottom.","v":"Hips back, heels down, knees out, keep breathing.","pos":"Stand with feet hip-width, toes slightly out. Back straight. Arms forward at chest height.","exe":"1. Push your hips back and lower in 3 s · 2. Stop at half height, or lower if you can · 3. Hold still, belly firm, weight in your heels · 4. When done, rise in 2 s.","resp":"Breathe steadily and calmly. Don’t hold your breath.","err":"Weight on your toes: sit further back, weight in your heels · Knees caving in: line them up with your second toe · Rounded or arched back: chest up, back straight","mus":"Front of the thigh (quadriceps), bottom (glutes), inner thigh (adductors), back of the thigh (hamstrings), deep belly (transversus)"},"fr":{"d":"Tu restes immobile en squat. Facile à mi-hauteur. Plus dur avec les cuisses presque parallèles au sol. Il renforce jambes et fessiers.","v":"Hanches en arrière, talons au sol, genoux ouverts, respire.","pos":"Debout, pieds à la largeur des hanches, pointes un peu ouvertes. Dos droit. Bras devant à hauteur de poitrine.","exe":"1. Envoie les hanches en arrière et descends en 3 s · 2. Arrête-toi à mi-hauteur, ou plus bas si tu peux · 3. Tiens immobile, ventre ferme, poids dans les talons · 4. À la fin, remonte en 2 s.","resp":"Respire calmement, sans t’arrêter. Ne bloque pas ton souffle.","err":"Poids sur les pointes : assieds-toi plus en arrière, poids dans les talons · Genoux qui rentrent : aligne-les avec le deuxième orteil · Dos rond ou cambré : poitrine haute, dos droit","mus":"Avant de la cuisse (quadriceps), fessiers, intérieur de la cuisse (adducteurs), arrière de la cuisse (ischio-jambiers)"}},"bridge":{"es":{"d":"Tumbada boca arriba, subes la cadera. Formas una línea recta de rodillas a hombros. Fortalece glúteos y parte de atrás del muslo.","v":"Empuja con los talones, aprieta glúteos, costillas abajo.","pos":"Tumbada boca arriba, rodillas dobladas. Pies al ancho de caderas, a un palmo de los glúteos. Brazos junto al cuerpo, palmas abajo.","exe":"1. Aprieta la barriga y pega un poco la espalda baja al suelo · 2. Empuja con los talones y sube la cadera en 1 s · 3. Aprieta los glúteos 1 s arriba · 4. Baja en 2 s, vértebra a vértebra.","resp":"Suelta el aire al subir la cadera. Coge aire al bajar.","err":"Arquear la espalda baja arriba: baja las costillas y aprieta la barriga · Empujar con las puntas: apoya el peso en los talones · Rodillas que se abren o se cierran: mantenlas al ancho de caderas","mus":"Glúteos (mayor y medio), parte de atrás del muslo (isquiotibiales), barriga (transverso), lumbares (erectores)"},"en":{"d":"Lying on your back, you lift your hips. You make a straight line from knees to shoulders. It strengthens your bottom and back of thighs.","v":"Push through your heels, squeeze your bottom, ribs down.","pos":"Lie on your back, knees bent. Feet hip-width, a hand’s length from your bottom. Arms by your sides, palms down.","exe":"1. Tighten your belly, press your lower back gently down · 2. Push through your heels and lift your hips in 1 s · 3. Squeeze your bottom for 1 s at the top · 4. Lower in 2 s, one vertebra at a time.","resp":"Breathe out as you lift your hips. Breathe in as you lower.","err":"Arching your lower back at the top: ribs down, belly tight · Pushing through your toes: put the weight in your heels · Knees falling in or out: keep them hip-width apart","mus":"Bottom (gluteus maximus and medius), back of the thigh (hamstrings), deep belly (transversus), lower back (erectors)"},"fr":{"d":"Allongée sur le dos, tu montes les hanches. Tu formes une ligne droite des genoux aux épaules. Il renforce fessiers et arrière des cuisses.","v":"Pousse dans les talons, serre les fessiers, côtes basses.","pos":"Allongée sur le dos, genoux pliés. Pieds à la largeur des hanches, à une main des fessiers. Bras le long du corps, paumes au sol.","exe":"1. Serre le ventre et plaque doucement le bas du dos au sol · 2. Pousse dans les talons et monte les hanches en 1 s · 3. Serre les fessiers 1 s en haut · 4. Redescends en 2 s, vertèbre par vertèbre.","resp":"Expire en montant les hanches. Inspire en descendant.","err":"Bas du dos cambré en haut : baisse les côtes, serre le ventre · Pousser avec les pointes : mets le poids dans les talons · Genoux qui s’ouvrent ou se ferment : garde-les écartés comme les hanches","mus":"Fessiers (grand et moyen fessier), arrière de la cuisse (ischio-jambiers), ventre profond (transverse), bas du dos (érecteurs)"}},"bridgehold":{"es":{"d":"Te quedas quieta arriba en el puente de glúteo. Mantén los glúteos apretados sin cargar la espalda baja.","v":"Cadera arriba, glúteos apretados, costillas abajo, respira.","pos":"Tumbada boca arriba, rodillas dobladas. Pies al ancho de caderas, a un palmo de los glúteos. Brazos junto al cuerpo, palmas abajo.","exe":"1. Empuja con los talones y sube la cadera en 2 s · 2. Forma una línea recta de rodillas a hombros, costillas abajo · 3. Aguanta con glúteos apretados el tiempo marcado · 4. Baja en 2 o 3 s, vértebra a vértebra.","resp":"Respira sin parar, soltando el aire despacio. No aguantes el aire.","err":"Molestia en la espalda baja: baja un poco la cadera y aprieta la barriga · La cadera cae al cansarte: vuelve a apretar los glúteos · Lo notas sobre todo detrás del muslo: acerca los pies","mus":"Glúteos (mayor y medio), parte de atrás del muslo (isquiotibiales), barriga (transverso), interior del muslo (aductores)"},"en":{"d":"You hold still at the top of a glute bridge. Keep your bottom squeezed without straining your lower back.","v":"Hips up, bottom squeezed, ribs down, keep breathing.","pos":"Lie on your back, knees bent. Feet hip-width, a hand’s length from your bottom. Arms by your sides, palms down.","exe":"1. Push through your heels and lift your hips in 2 s · 2. Make a straight line from knees to shoulders, ribs down · 3. Hold with your bottom squeezed for the set time · 4. Lower in 2 or 3 s, one vertebra at a time.","resp":"Keep breathing, with long, slow breaths out. Don’t hold your breath.","err":"Lower back discomfort: drop your hips a little, tighten your belly · Hips sagging as you tire: squeeze your bottom again · Feeling it mostly in the back of the thighs: move your feet closer","mus":"Bottom (gluteus maximus and medius), back of the thigh (hamstrings), deep belly (transversus), inner thigh (adductors)"},"fr":{"d":"Tu restes immobile en haut du pont fessier. Garde les fessiers serrés sans charger le bas du dos.","v":"Hanches hautes, fessiers serrés, côtes basses, respire.","pos":"Allongée sur le dos, genoux pliés. Pieds à la largeur des hanches, à une main des fessiers. Bras le long du corps, paumes au sol.","exe":"1. Pousse dans les talons et monte les hanches en 2 s · 2. Forme une ligne droite des genoux aux épaules, côtes basses · 3. Tiens, fessiers serrés, le temps indiqué · 4. Redescends en 2 ou 3 s, vertèbre par vertèbre.","resp":"Respire sans t’arrêter, avec de longues expirations. Ne bloque pas le souffle.","err":"Gêne dans le bas du dos : baisse un peu les hanches, serre le ventre · Hanches qui tombent avec la fatigue : resserre les fessiers · Tu sens surtout l’arrière des cuisses : rapproche les pieds","mus":"Fessiers (grand et moyen fessier), arrière de la cuisse (ischio-jambiers), ventre profond (transverse), intérieur de la cuisse (adducteurs)"}},"bridge1leg":{"es":{"d":"Puente de glúteo con 1 sola pierna apoyada y la otra estirada. Trabaja el glúteo y el control de la cadera. A mitad, cambias de pierna.","v":"Cadera nivelada, empuja con el talón, aprieta el glúteo.","pos":"Tumbada boca arriba. Apoya un pie en el centro, rodilla doblada. Estira la otra pierna, muslos a la misma altura. Palmas contra el suelo.","exe":"1. Aprieta la barriga y pega un poco la espalda baja · 2. Empuja con el talón y sube la cadera en 1 s · 3. Aguanta 1 s arriba, cadera a la misma altura · 4. Baja en 2 s. A mitad de tiempo, cambia de pierna.","resp":"Suelta el aire al subir. Coge aire al bajar.","err":"Cadera que cae hacia el lado libre: aprieta el lateral del glúteo de apoyo · Arquear la espalda baja: costillas abajo · Subir demasiado y torcerte: sube solo lo que controles recta","mus":"Glúteos (mayor y medio), parte de atrás del muslo (isquiotibiales), barriga (transverso), costados (oblicuos)"},"en":{"d":"A glute bridge on 1 leg, with the other leg straight. It works your bottom and hip control. Switch legs halfway.","v":"Hips level, push through the heel, squeeze your bottom.","pos":"Lie on your back. Put one foot in the middle, knee bent. Stretch the other leg out, thighs level. Palms press the floor.","exe":"1. Tighten your belly, press your lower back gently down · 2. Push through the heel and lift your hips in 1 s · 3. Hold 1 s at the top, hips level · 4. Lower in 2 s. Switch legs halfway through.","resp":"Breathe out as you lift. Breathe in as you lower.","err":"Hip dropping on the free side: squeeze the side of your bottom on the working leg · Arching your lower back: ribs down · Lifting too high and twisting: only go as high as you stay level","mus":"Bottom (gluteus maximus and medius), back of the thigh (hamstrings), deep belly (transversus), sides of the waist (obliques)"},"fr":{"d":"Pont fessier sur 1 seule jambe, l’autre jambe tendue. Il travaille les fessiers et le contrôle du bassin. Change de jambe à mi-temps.","v":"Bassin à niveau, pousse dans le talon, serre le fessier.","pos":"Allongée sur le dos. Pose un pied au centre, genou plié. Tends l’autre jambe, cuisses à la même hauteur. Paumes pressées au sol.","exe":"1. Serre le ventre et plaque doucement le bas du dos · 2. Pousse dans le talon et monte les hanches en 1 s · 3. Tiens 1 s en haut, bassin bien à niveau · 4. Redescends en 2 s. Change de jambe à mi-temps.","resp":"Expire en montant. Inspire en descendant.","err":"Bassin qui tombe du côté libre : serre le côté du fessier d’appui · Bas du dos cambré : baisse les côtes · Monter trop haut en tournant : monte seulement tant que le bassin reste droit","mus":"Fessiers (grand et moyen fessier), arrière de la cuisse (ischio-jambiers), ventre profond (transverse), côtés de la taille (obliques)"}},"bridgemarch":{"es":{"d":"En puente de glúteo, subes una rodilla y luego la otra. La cadera se queda alta y quieta. Unos 2 s por pierna, sin prisa.","v":"Cadera alta y quieta, sube una rodilla, pelvis recta.","pos":"Tumbada boca arriba, rodillas dobladas. Pies al ancho de caderas, a un palmo de los glúteos. Brazos junto al cuerpo, apretando el suelo.","exe":"1. Sube la cadera al puente, en línea de rodillas a hombros · 2. Peso en un talón, sube la otra rodilla en 2 s · 3. Apoya el pie sin que baje la cadera · 4. Cambia de pierna. Al terminar, baja en 2 s.","resp":"Suelta el aire al subir cada rodilla. Coge aire al apoyar el pie.","err":"Cadera que cae al subir el pie: aprieta el glúteo de apoyo o haz el puente normal · Pelvis que gira: muévete más lento · Arquear la espalda baja: costillas abajo y barriga firme","mus":"Glúteos (mayor y medio), parte de atrás del muslo (isquiotibiales), flexores de la cadera (psoas), barriga (transverso y oblicuos)"},"en":{"d":"In a glute bridge, you lift one knee, then the other. Your hips stay high and still. About 2 s per leg, no rush.","v":"Hips high and still, lift one knee, pelvis level.","pos":"Lie on your back, knees bent. Feet hip-width, a hand’s length from your bottom. Arms by your sides, pressing the floor.","exe":"1. Lift into a bridge, a straight line from knees to shoulders · 2. Weight on one heel, lift the other knee in 2 s · 3. Set the foot down without your hips dropping · 4. Switch legs. At the end, lower in 2 s.","resp":"Breathe out as each knee lifts. Breathe in as the foot goes down.","err":"Hips dropping as the foot lifts: squeeze the bottom of the standing leg or do a normal bridge · Pelvis twisting: move more slowly · Arching your lower back: ribs down, belly firm","mus":"Bottom (gluteus maximus and medius), back of the thigh (hamstrings), hip flexors (psoas), belly (transversus and obliques)"},"fr":{"d":"En pont fessier, tu montes un genou puis l’autre. Les hanches restent hautes et immobiles. Environ 2 s par jambe, sans te presser.","v":"Hanches hautes et immobiles, monte un genou, bassin à niveau.","pos":"Allongée sur le dos, genoux pliés. Pieds à la largeur des hanches, à une main des fessiers. Bras le long du corps, pressés au sol.","exe":"1. Monte en pont, ligne droite des genoux aux épaules · 2. Poids sur un talon, monte l’autre genou en 2 s · 3. Repose le pied sans que les hanches baissent · 4. Change de jambe. À la fin, redescends en 2 s.","resp":"Expire en montant chaque genou. Inspire en reposant le pied.","err":"Hanches qui baissent quand le pied monte : serre le fessier d’appui ou fais un pont simple · Bassin qui tourne : va plus lentement · Bas du dos cambré : côtes basses, ventre ferme","mus":"Fessiers (grand et moyen fessier), arrière de la cuisse (ischio-jambiers), avant de la hanche (psoas), ventre (transverse et obliques)"}},"donkey":{"es":{"d":"A cuatro patas, subes un talón hacia el techo con la rodilla doblada. Trabaja el glúteo sin cargar las rodillas ni necesitar equilibrio de pie.","v":"Talón al techo, aprieta el glúteo, espalda quieta.","pos":"A cuatro patas. Manos bajo los hombros y rodillas bajo la cadera. Espalda recta, mirada al suelo.","exe":"1. Aprieta la barriga para que la espalda no se mueva · 2. Con la rodilla doblada, sube el talón hacia el techo en 1 s · 3. Aprieta el glúteo 1 s arriba · 4. Baja en 2 s sin apoyar del todo. Luego, la otra pierna","resp":"Suelta el aire al subir el talón. Coge aire al bajar.","err":"Arquear la espalda baja: sube menos y aprieta la barriga · Girar la cadera: las 2 caderas miran al suelo · Hacerlo con impulso: sube despacio","mus":"Glúteo (glúteo mayor), parte de atrás del muslo (isquiotibiales), barriga (transverso), zona lumbar (erectores)"},"en":{"d":"On all fours, you lift one heel toward the ceiling with your knee bent. It works your glute without loading your knees or needing standing balance.","v":"Heel to the ceiling, squeeze your glute, back still.","pos":"On all fours. Hands under shoulders, knees under hips. Back flat, eyes on the floor.","exe":"1. Tighten your belly so your back stays still · 2. With your knee bent, lift the heel toward the ceiling in 1 s · 3. Squeeze the glute for 1 s at the top · 4. Lower in 2 s without fully resting. Then the other leg","resp":"Breathe out as the heel goes up. Breathe in as it comes down.","err":"Arching your lower back: lift less and tighten your belly · Twisting your hips: both hips face the floor · Swinging: lift slowly","mus":"Glutes (gluteus maximus), back of the thigh (hamstrings), belly (transversus), lower back (erectors)"},"fr":{"d":"À quatre pattes, tu montes un talon vers le plafond, genou plié. Ça travaille le fessier sans charger les genoux ni demander d’équilibre debout.","v":"Talon vers le plafond, serre le fessier, dos immobile.","pos":"À quatre pattes. Mains sous les épaules, genoux sous les hanches. Dos plat, regard vers le sol.","exe":"1. Serre le ventre pour que le dos ne bouge pas · 2. Genou plié, monte le talon vers le plafond en 1 s · 3. Serre le fessier 1 s en haut · 4. Redescends en 2 s sans reposer complètement. Puis l’autre jambe","resp":"Expire en montant le talon. Inspire en descendant.","err":"Creuser le bas du dos : monte moins et serre le ventre · Tourner les hanches : les 2 hanches face au sol · Prendre de l’élan : monte lentement","mus":"Fessier (grand fessier), arrière de la cuisse (ischio-jambiers), ventre (transverse), bas du dos (érecteurs)"}},"squathold_half":{"es":{"d":"Te quedas quieta a media altura de una sentadilla. Trabaja piernas y glúteos sin bajar tanto como la sentadilla mantenida.","v":"Cadera atrás, pecho alto, respira.","pos":"De pie, pies al ancho de caderas y puntas un poco hacia fuera. Brazos al frente para equilibrarte.","exe":"1. Lleva la cadera atrás y baja en 2 s a media altura · 2. Peso en todo el pie, rodillas hacia el segundo dedo · 3. Quédate ahí respirando el tiempo marcado · 4. Sube en 2 s","resp":"Respira sin parar, soltando el aire despacio. No aguantes el aire.","err":"Rodillas hacia dentro: llévalas hacia los pies · Talones que se levantan: echa el peso atrás · Aguantar el aire: suéltalo despacio","mus":"Parte delantera del muslo (cuádriceps), glúteos (glúteo mayor), barriga (transverso)"},"en":{"d":"You stay still halfway down a squat. It works legs and glutes without going as low as the full squat hold.","v":"Hips back, chest up, breathe.","pos":"Standing, feet hip-width apart, toes turned slightly out. Arms forward for balance.","exe":"1. Push your hips back and lower halfway in 2 s · 2. Weight on the whole foot, knees toward the second toe · 3. Stay there breathing for the set time · 4. Come up in 2 s","resp":"Keep breathing, letting the air out slowly. Don’t hold your breath.","err":"Knees caving in: point them toward your feet · Heels lifting: shift your weight back · Holding your breath: let it out slowly","mus":"Front of the thigh (quadriceps), glutes (gluteus maximus), belly (transversus)"},"fr":{"d":"Tu restes immobile à mi-hauteur d’un squat. Ça travaille jambes et fessiers sans descendre aussi bas que le squat tenu.","v":"Hanches en arrière, poitrine haute, respire.","pos":"Debout, pieds largeur de hanches, pointes un peu vers l’extérieur. Bras devant pour l’équilibre.","exe":"1. Recule les hanches et descends à mi-hauteur en 2 s · 2. Poids sur tout le pied, genoux vers le deuxième orteil · 3. Reste là en respirant le temps indiqué · 4. Remonte en 2 s","resp":"Respire sans t’arrêter, en soufflant lentement. Ne bloque pas l’air.","err":"Genoux vers l’intérieur : oriente-les vers les pieds · Talons qui se lèvent : porte le poids en arrière · Bloquer l’air : souffle doucement","mus":"Avant de la cuisse (quadriceps), fessiers (grand fessier), ventre (transverse)"}},"hiphinge":{"es":{"d":"Aprendes a doblarte desde la cadera con la espalda recta. Calienta glúteos y la parte de atrás del muslo.","v":"Cadera atrás, espalda larga, vuelve arriba.","pos":"De pie, pies al ancho de caderas. Rodillas un poco sueltas. Brazos cruzados en el pecho.","exe":"1. Lleva la cadera atrás como si cerraras una puerta con el culo · 2. El pecho baja solo, espalda recta, en 2 s · 3. Para cuando notes la parte de atrás del muslo · 4. Aprieta los glúteos y vuelve arriba en 2 s","resp":"Coge aire al bajar. Suéltalo al subir.","err":"Doblar mucho las rodillas: es una bisagra, no una sentadilla · Redondear la espalda: baja menos · Mirar al frente: mira al suelo delante de ti","mus":"Glúteo (glúteo mayor), parte de atrás del muslo (isquiotibiales), zona lumbar (erectores)"},"en":{"d":"You learn to bend from the hips with a straight back. It warms up your glutes and the back of your thighs.","v":"Hips back, long back, come up.","pos":"Standing, feet hip-width apart. Knees soft. Arms crossed on your chest.","exe":"1. Push your hips back as if closing a door with your bottom · 2. Your chest lowers on its own, back straight, in 2 s · 3. Stop when you feel the back of your thighs · 4. Squeeze your glutes and come up in 2 s","resp":"Breathe in going down. Breathe out coming up.","err":"Bending your knees a lot: it’s a hinge, not a squat · Rounding your back: go less deep · Looking ahead: look at the floor in front of you","mus":"Glutes (gluteus maximus), back of the thigh (hamstrings), lower back (erectors)"},"fr":{"d":"Tu apprends à te plier depuis les hanches, dos droit. Ça échauffe les fessiers et l’arrière des cuisses.","v":"Hanches en arrière, dos long, remonte.","pos":"Debout, pieds largeur de hanches. Genoux souples. Bras croisés sur la poitrine.","exe":"1. Recule les hanches comme pour fermer une porte avec les fesses · 2. La poitrine descend toute seule, dos droit, en 2 s · 3. Arrête-toi quand tu sens l’arrière des cuisses · 4. Serre les fessiers et remonte en 2 s","resp":"Inspire en descendant. Expire en remontant.","err":"Trop plier les genoux : c’est une charnière, pas un squat · Arrondir le dos : descends moins · Regarder devant : regarde le sol devant toi","mus":"Fessier (grand fessier), arrière de la cuisse (ischio-jambiers), bas du dos (érecteurs)"}},"goodmorning":{"es":{"d":"Bisagra de cadera más profunda y lenta. Fortalece glúteos, parte de atrás del muslo y espalda baja sin material.","v":"Cadera atrás, espalda recta, sube apretando glúteos.","pos":"De pie, pies al ancho de caderas. Rodillas un poco sueltas. Brazos cruzados en el pecho.","exe":"1. Aprieta la barriga · 2. Lleva la cadera atrás e inclina el cuerpo en 3 s, espalda recta · 3. Baja hasta casi la horizontal o hasta donde la espalda siga recta · 4. Aprieta los glúteos y sube en 2 s","resp":"Coge aire al bajar. Suéltalo al subir.","err":"Espalda que se redondea: baja menos · Rodillas muy dobladas: déjalas casi quietas · Subir con la espalda: sube empujando con la cadera","mus":"Glúteo (glúteo mayor), parte de atrás del muslo (isquiotibiales), zona lumbar (erectores), barriga (transverso)"},"en":{"d":"A deeper, slower hip hinge. It strengthens glutes, the back of the thighs and lower back with no equipment.","v":"Hips back, straight back, squeeze your glutes to come up.","pos":"Standing, feet hip-width apart. Knees soft. Arms crossed on your chest.","exe":"1. Tighten your belly · 2. Push your hips back and tilt forward in 3 s, back straight · 3. Go down until almost level or as far as your back stays straight · 4. Squeeze your glutes and come up in 2 s","resp":"Breathe in going down. Breathe out coming up.","err":"Rounding your back: go less deep · Knees bending a lot: keep them almost still · Lifting with your back: push up with your hips","mus":"Glutes (gluteus maximus), back of the thigh (hamstrings), lower back (erectors), belly (transversus)"},"fr":{"d":"Une charnière de hanche plus profonde et plus lente. Elle renforce fessiers, arrière des cuisses et bas du dos sans matériel.","v":"Hanches en arrière, dos droit, remonte en serrant les fessiers.","pos":"Debout, pieds largeur de hanches. Genoux souples. Bras croisés sur la poitrine.","exe":"1. Serre le ventre · 2. Recule les hanches et penche le buste en 3 s, dos droit · 3. Descends presque à l’horizontale ou tant que le dos reste droit · 4. Serre les fessiers et remonte en 2 s","resp":"Inspire en descendant. Expire en remontant.","err":"Dos qui s’arrondit : descends moins · Genoux très pliés : garde-les presque immobiles · Remonter avec le dos : pousse avec les hanches","mus":"Fessier (grand fessier), arrière de la cuisse (ischio-jambiers), bas du dos (érecteurs), ventre (transverse)"}},"sldl":{"es":{"d":"Bisagra de cadera sobre una sola pierna. Trabaja el glúteo y el equilibrio. Primero con una pierna y luego con la otra.","v":"Cuerpo y pierna en línea, como un balancín.","pos":"De pie sobre una pierna, rodilla un poco suelta. La otra pierna, justo detrás, con la punta en el suelo. Brazos colgando.","exe":"1. Aprieta la barriga y mira al suelo · 2. Inclina el cuerpo en 3 s mientras la otra pierna sube atrás · 3. Cuerpo y pierna en línea recta, cadera mirando al suelo · 4. Vuelve arriba en 2 s apretando el glúteo de apoyo","resp":"Coge aire al bajar. Suéltalo al subir.","err":"Perder el equilibrio: apoya la punta del pie de atrás cuando lo necesites · Abrir la cadera hacia un lado: las 2 caderas miran al suelo · Redondear la espalda: baja menos","mus":"Glúteo (glúteo mayor y medio), parte de atrás del muslo (isquiotibiales), zona lumbar (erectores), barriga (transverso)"},"en":{"d":"A hip hinge on one leg. It works your glute and your balance. First one leg, then the other.","v":"Body and leg in line, like a seesaw.","pos":"Standing on one leg, knee soft. The other leg just behind, toes on the floor. Arms hanging.","exe":"1. Tighten your belly and look at the floor · 2. Tilt forward in 3 s while the other leg rises behind · 3. Body and leg in a straight line, hips facing the floor · 4. Come back up in 2 s squeezing the standing glute","resp":"Breathe in going down. Breathe out coming up.","err":"Losing balance: touch down with the back toes whenever you need · Hip opening to the side: both hips face the floor · Rounding your back: go less deep","mus":"Glutes (gluteus maximus and medius), back of the thigh (hamstrings), lower back (erectors), belly (transversus)"},"fr":{"d":"Une charnière de hanche sur une jambe. Ça travaille le fessier et l’équilibre. D’abord une jambe, puis l’autre.","v":"Buste et jambe alignés, comme une balançoire.","pos":"Debout sur une jambe, genou souple. L’autre jambe juste derrière, pointe au sol. Bras relâchés.","exe":"1. Serre le ventre et regarde le sol · 2. Penche le buste en 3 s pendant que l’autre jambe monte derrière · 3. Buste et jambe en ligne droite, hanches face au sol · 4. Remonte en 2 s en serrant le fessier d’appui","resp":"Inspire en descendant. Expire en remontant.","err":"Perdre l’équilibre : pose la pointe du pied arrière dès que besoin · Hanche qui s’ouvre sur le côté : les 2 hanches face au sol · Dos arrondi : descends moins","mus":"Fessier (grand et moyen fessier), arrière de la cuisse (ischio-jambiers), bas du dos (érecteurs), ventre (transverse)"}},"pushup_knee":{"es":{"d":"Flexión con las rodillas en el suelo. Fortalece pecho, hombros y brazos, y te enseña a mantener el cuerpo recto.","v":"Codos hacia atrás, baja despacio y empuja el suelo.","pos":"Rodillas en la esterilla, separadas como tu cadera. Manos debajo de los hombros. Cuerpo recto de rodillas a cabeza y mirada al suelo.","exe":"1. Aprieta la barriga y los glúteos · 2. Baja en 2 s con los codos en diagonal hacia atrás · 3. Para con el pecho a un puño del suelo · 4. Empuja el suelo en 1 s y estira sin bloquear","resp":"Coge aire al bajar. Suéltalo al empujar.","err":"Culo en alto: aprieta glúteos y alinea la cadera · Codos muy abiertos: llévalos en diagonal hacia atrás · Cabeza adelantada: cuello recto, mira al suelo","mus":"Pecho (pectoral), hombro delantero (deltoides), parte de atrás del brazo (tríceps), costado (serrato), barriga (transverso)"},"en":{"d":"A push-up with your knees on the floor. It builds chest, shoulders and arms, and teaches you to keep your body straight.","v":"Elbows back, lower slowly and push the floor away.","pos":"Knees on the mat, hip-width apart. Hands under your shoulders. Body straight from knees to head, eyes on the floor.","exe":"1. Squeeze your tummy and your glutes · 2. Lower in 2 s, elbows angled back · 3. Stop with your chest a fist from the floor · 4. Push the floor for 1 s and straighten without locking","resp":"Breathe in as you lower. Breathe out as you push.","err":"Bottom up high: squeeze your glutes and line up your hips · Elbows wide: angle them back · Head poking forward: keep your neck long, look down","mus":"Chest (pectorals), front of shoulder (deltoid), back of arm (triceps), side of ribs (serratus), deep tummy (transversus)"},"fr":{"d":"Pompe sur les genoux. Elle renforce la poitrine, les épaules et les bras, et t’apprend à garder le corps droit.","v":"Coudes vers l’arrière, descends doucement et repousse le sol.","pos":"Genoux sur le tapis, écartés comme ton bassin. Mains sous les épaules. Corps droit des genoux à la tête, regard au sol.","exe":"1. Serre le ventre et les fessiers · 2. Descends en 2 s, coudes en diagonale vers l’arrière · 3. Arrête-toi, poi
