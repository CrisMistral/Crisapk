<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calistenia — Quico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#26a69a;--teal-dark:#1a6b64;--teal-light:#4dd0e1;--mint:#d6f0eb;--mint-mid:#b8e4dd;--mint-soft:#e8f8f5;--text:#1a6b64;--text-soft:#2d6b64}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--mint);min-height:100vh;color:var(--text)}
.screen{display:none;min-height:100vh;padding:16px 16px 100px}
.screen.active{display:block}
.max-w{max-width:440px;margin:0 auto;padding-top:12px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.back-btn{background:rgba(26,107,100,.12);border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--teal-dark)}
.topbar h1{font-size:1.15rem;font-weight:700;color:var(--teal-dark)}
.home-header{text-align:center;margin-bottom:16px}
.home-header h1{font-size:1.6rem;font-weight:800;color:var(--teal-dark);margin-bottom:4px}
.home-header p{font-size:.85rem;color:var(--text-soft)}
.bubble{background:rgba(255,255,255,.8);border:2px solid var(--mint-mid);border-radius:16px;padding:10px 16px;font-size:.85rem;font-weight:600;color:var(--teal-dark);text-align:center;margin:0 auto 20px;max-width:300px}
.today-card{border-radius:20px;padding:22px;color:#fff;margin-bottom:16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s}
.today-card:active{transform:scale(.98)}
.tc-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.8;margin-bottom:4px}
.tc-day{font-size:1.6rem;font-weight:800;margin-bottom:2px}
.tc-focus{font-size:.9rem;opacity:.9;font-weight:600}
.tc-meta{font-size:.78rem;opacity:.75;margin-top:6px}
.tc-emoji{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:3.5rem;opacity:.3}
.week-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);margin-bottom:10px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
.wday{border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;border:2px solid var(--mint-mid);background:rgba(255,255,255,.75);transition:transform .1s}
.wday:active{transform:scale(.93)}
.wday.today-mark{border-color:var(--teal);background:rgba(38,166,154,.1)}
.wday .wd-emoji{font-size:1.2rem;display:block;margin-bottom:3px}
.wday .wd-name{font-size:.6rem;font-weight:700;color:var(--teal-dark)}
.day-header{border-radius:20px;padding:22px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.dh-focus{font-size:1.1rem;font-weight:800;margin-bottom:4px}
.dh-meta{font-size:.82rem;opacity:.85}
.dh-emoji{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:3rem;opacity:.3}
.day-intro{background:rgba(255,255,255,.82);border:2px solid var(--mint-mid);border-radius:14px;padding:14px;margin-bottom:14px;font-size:.84rem;color:var(--text);line-height:1.5}
.ex-item{background:rgba(255,255,255,.82);border:2px solid var(--mint-mid);border-radius:14px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.ex-num{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;font-size:.78rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ex-info{flex:1}
.ex-name{font-size:.9rem;font-weight:700;color:var(--teal-dark)}
.ex-meta{font-size:.72rem;color:var(--text-soft);margin-top:2px}
.ex-emoji{font-size:1.5rem}
.btn{border:none;border-radius:12px;padding:14px;font-family:'Outfit',sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;margin-top:4px}
.btn-secondary{background:var(--mint-soft);color:var(--teal-dark);border:2px solid var(--mint-mid)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{flex:1}
/* Session */
.s-prog{background:var(--mint-mid);border-radius:999px;height:6px;margin-bottom:12px;overflow:hidden}
.s-fill{height:100%;background:linear-gradient(90deg,var(--teal-dark),var(--teal-light));border-radius:999px;transition:width .5s}
.s-count{font-size:.72rem;font-weight:700;color:var(--text-soft);text-align:center;margin-bottom:10px}
.dots{display:flex;justify-content:center;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint-mid)}
.dot.done{background:var(--teal)}.dot.active{background:var(--teal-light);transform:scale(1.4)}
/* Figure animation */
.anim-wrap{position:relative;width:100%;height:190px;margin-bottom:10px;border-radius:16px;overflow:hidden;background:var(--mint-soft);border:2px solid var(--mint-mid)}
.anim-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.anim-tag{position:absolute;top:8px;left:10px;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);background:rgba(255,255,255,.8);border-radius:10px;padding:3px 10px;pointer-events:none}
/* Session box */
.s-box{background:rgba(255,255,255,.9);border:2px solid var(--mint-mid);border-radius:18px;padding:18px;text-align:center;margin-bottom:12px}
.s-phase{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);margin-bottom:4px}
.s-exname{font-size:1.1rem;font-weight:800;color:var(--teal-dark);margin-bottom:8px;line-height:1.3}
.s-desc{font-size:.82rem;color:var(--text-soft);line-height:1.5;margin-bottom:10px;text-align:left}
.s-timer{font-size:3.8rem;font-weight:800;color:var(--teal-dark);font-variant-numeric:tabular-nums;line-height:1;margin-bottom:2px}
.s-timer.rest-c{color:#059669}.s-timer.sw-c{color:#d97706}
.s-tlbl{font-size:.7rem;color:var(--text-soft)}
.s-tip{background:var(--mint-soft);border-left:3px solid var(--teal);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.78rem;color:var(--text);line-height:1.4;margin-bottom:10px;text-align:left}
.done-box{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;border-radius:20px;padding:32px;text-align:center;margin-bottom:14px}
.done-box .big{font-size:3.5rem;margin-bottom:10px}
.done-box h2{font-size:1.4rem;font-weight:800;margin-bottom:8px}
.done-box p{font-size:.88rem;opacity:.9;line-height:1.5}

.calm *,.calm *::before,.calm *::after{animation:none !important;transition:none !important}

/* Anillo de tiempo: se vacía según pasa — para ver cuánto queda sin leer números */
.tring{width:176px;height:176px;border-radius:50%;margin:4px auto 10px;display:flex;align-items:center;justify-content:center;background:conic-gradient(#26a69a 360deg,#cde9e4 0);flex-shrink:0;}
.tring-in{width:144px;height:144px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;}
.tring .s-timer{font-size:2.6rem;margin-bottom:0}

/* Quico con manitas (mascota) */
.quico-mascot{position:relative;width:-moz-fit-content;width:fit-content;margin:0 auto 6px;filter:drop-shadow(0 3px 8px rgba(93,64,55,.18));}
.quico-mascot .qm-head{display:block;margin:0;filter:none;}
.qm-paws{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);width:64%;line-height:0;}
.qm-paws svg{display:block;width:100%;}

/* Figura que se copia */
.anim-wrap.big{height:min(44vh,320px);background:linear-gradient(180deg,#f3fbf9,#e3f5f1)}
.anim-wrap svg{position:absolute;inset:0;width:100%;height:100%}
.rep-badge{position:absolute;bottom:10px;left:12px;font-size:.85rem;font-weight:800;color:#fff;background:var(--teal);border-radius:12px;padding:4px 12px;pointer-events:none}
/* Nivel */
.lvl-row{display:flex;gap:6px;margin-bottom:8px}
.lvl-chip{flex:1;border:2px solid var(--mint-mid);background:rgba(255,255,255,.8);border-radius:12px;padding:10px 4px;font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:700;color:var(--teal-dark);cursor:pointer}
.lvl-chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.lvl-chip:active{transform:scale(.96)}
.prog-note{font-size:.76rem;color:var(--text-soft);text-align:center;margin-bottom:16px;line-height:1.45}
#day-lvl .lvl-row{margin-bottom:14px}
.sec-title{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--teal);margin:14px 0 8px}
.ex-item{padding:8px 12px 8px 8px}
.ex-item svg.thumb{width:86px;height:64px;border-radius:10px;background:var(--mint-soft);flex-shrink:0}
.wday.st{background:rgba(255,255,255,.55)}
/* Sesión: temporizador pequeño al lado del nombre */
.s-row{display:flex;align-items:center;gap:14px;text-align:left}
.s-info{flex:1;min-width:0}
.tring.small{width:108px;height:108px;margin:0}
.tring.small .tring-in{width:88px;height:88px}
.tring.small .s-timer{font-size:2rem}
.tring.small .s-tlbl{font-size:.6rem}
</style>
</head>
<body>

<div id="v-home" class="screen active">
<div class="max-w">
  <div class="home-header"><img src="../quico/quico_happy.png" alt="Quico" style="width:112px;height:auto;object-fit:contain;display:block;margin:0 auto 6px;filter:drop-shadow(0 4px 10px rgba(93,64,55,.18))"><h1 data-i18n="home_h">💪 Calistenia en casa</h1><p data-i18n="home_sub">20 min · solo una esterilla · sin material</p></div>
  <div class="bubble" data-i18n="bubble">Solo tienes que copiar a la figura 💚</div>
  <div id="lvl-home"></div>
  <div class="today-card" id="today-card" onclick="openTodayDay()"></div>
  <div class="week-title" data-i18n="week_title">Tu semana</div>
  <div class="week-grid" id="week-grid"></div>
</div>
</div>

<div id="v-day" class="screen">
<div class="max-w">
  <div class="topbar"><button class="back-btn" onclick="initHome();go('home')">←</button><h1 id="day-title"></h1></div>
  <div class="day-header" id="day-header"></div>
  <div id="day-lvl"></div>
  <div class="day-intro" id="day-intro"></div>
  <div id="ex-list"></div>
  <button class="btn btn-primary" style="margin-top:14px" onclick="startSession()" data-i18n="btn_start_auto">▶ Empezar sesión automática</button>
</div>
</div>

<div id="v-session" class="screen">
<div class="max-w">
  <div class="topbar"><button class="back-btn" onclick="confirmStop()">←</button><h1 id="s-title"></h1></div>
  <div class="s-prog"><div class="s-fill" id="s-fill"></div></div>
  <div class="s-count" id="s-count"></div>
  <div id="s-content"></div>
</div>
</div>

/* ─── FIGURA ARTICULADA (cinemática directa) ───
   Cada postura = ángulos (grados; 0=derecha, 90=abajo, -90=arriba).
   t: tronco (cadera→cuello) · c: curva de la columna · hd: cabeza (relativa)
   a/b: brazo cercano/lejano [brazo, antebrazo] · l/m: pierna cercana/lejana [muslo, espinilla, pie]
   La figura se escala y centra sola, y cada fotograma se «apoya» en la esterilla. */
const FIG_FLOOR=134,FIG_VB='0 0 200 150',FIG_MAT='<rect x="6" y="134" width="188" height="7" rx="3.5" fill="#b8e4dd"/>';
const FIG_LEN={T:44,UA:21,FA:19,TH:29,SH:27,FT:9,NK:11,HR:9};
const FIG_COL={near:'#1a6b64',far:'#8ccdc3',torso:'#26a69a',hl:'#f59e0b',hlFar:'#fbc97a',skin:'#1a6b64',mat:'#b8e4dd'};
function fd(a){const r=a*Math.PI/180;return [Math.cos(r),Math.sin(r)];}
function fadd(p,a,len){const d=fd(a);return [p[0]+d[0]*len,p[1]+d[1]*len];}
function figJoints(P){
  const L=FIG_LEN,hip=[0,0];
  const neck=fadd(hip,P.t,L.T);
  const perp=fd(P.t+90),mid=[(hip[0]+neck[0])/2+perp[0]*(P.c||0),(hip[1]+neck[1])/2+perp[1]*(P.c||0)];
  const head=fadd(neck,P.t+(P.hd||0),L.NK);
  const bun=fadd(head,P.t+(P.hd||0)+(P.bun||0),L.HR*.95);
  // hombro: sobre la curva, cerca del cuello
  const sh=[.1*mid[0]+.9*neck[0]+(neck[0]-hip[0])*-.08,.1*mid[1]+.9*neck[1]+(neck[1]-hip[1])*-.08];
  const arm=(A)=>{const e=fadd(sh,A[0],L.UA);return [sh,e,fadd(e,A[1],L.FA)];};
  const leg=(G)=>{const k=fadd(hip,G[0],L.TH),an=fadd(k,G[1],L.SH);const f=G[2]!=null?G[2]:G[1]-90;return [hip,k,an,fadd(an,f,L.FT)];};
  return {hip,neck,mid,head,bun,a:arm(P.a),b:arm(P.b),l:leg(P.l),m:leg(P.m)};
}
function figPoints(J){return [J.hip,J.neck,J.mid,J.head,J.bun,...J.a,...J.b,...J.l,...J.m];}
function figBBox(J){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of figPoints(J)){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}return {x0:x0-10,y0:y0-10,x1:x1+10,y1:y1+8};}
function figLerp(A,B,k){
  const o={};for(const key of ['t','c','hd','bun','up']){o[key]=(A[key]||0)+((B[key]||0)-(A[key]||0))*k;}
  for(const key of ['a','b','l','m']){o[key]=A[key].map((v,i)=>{const w=B[key][i];if(v==null&&w==null)return null;const vv=v!=null?v:w,ww=w!=null?w:v;return vv+(ww-vv)*k;});}
  return o;
}
/* Ajuste de encuadre para una animación (misma escala y x para todos sus fotogramas) */
function figFit(A,B){
  const list=Array.isArray(A)?A:[A,B];
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const P of list){const q=figBBox(figJoints(P));x0=Math.min(x0,q.x0);x1=Math.max(x1,q.x1);y0=Math.min(y0,q.y0-(P.up||0));y1=Math.max(y1,q.y1);}
  const s=Math.min(1.2,180/(x1-x0),(FIG_FLOOR-8)/(y1-y0));
  return {s,cx:100-((x0+x1)/2)*s};
}
function figSVG(P,fit,hl){
  const J=figJoints(P),s=fit.s,FLOOR=FIG_FLOOR;
  // apoyo: el punto más bajo del cuerpo toca la esterilla
  let low=-1e9;const rad={head:FIG_LEN.HR,torso:6.5,limb:4.2};
  low=Math.max(low,J.head[1]+rad.head,J.hip[1]+rad.torso,J.neck[1]+rad.torso,J.mid[1]+rad.torso);
  for(const q of [...J.a.slice(1),...J.b.slice(1),...J.l.slice(1),...J.m.slice(1)])low=Math.max(low,q[1]+rad.limb);
  const X=v=>(fit.cx+v[0]*s).toFixed(1),Y=v=>(FLOOR-(low-v[1]+(P.up||0))*s).toFixed(1);
  const w=n=>(n*s).toFixed(1);
  const H=hl||[];
  const seg=(pts,col,wd)=>`<path d="M${pts.map(p=>X(p)+' '+Y(p)).join(' L')}" stroke="${col}" stroke-width="${w(wd)}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  const col=(part,far)=>H.includes(part)?(far?FIG_COL.hlFar:FIG_COL.hl):(far?FIG_COL.far:FIG_COL.near);
  let out='';
  out+=seg(J.b,col('arm2',1),7.5);
  out+=seg(J.m,col('leg2',1),9.5);
  // tronco (curva cuadrática)
  const tc=H.includes('torso')?FIG_COL.hl:FIG_COL.torso;
  out+=`<path d="M${X(J.hip)} ${Y(J.hip)} Q${X(J.mid)} ${Y(J.mid)} ${X(J.neck)} ${Y(J.neck)}" stroke="${tc}" stroke-width="${w(15)}" stroke-linecap="round" fill="none"/>`;
  out+=`<circle cx="${X(J.bun)}" cy="${Y(J.bun)}" r="${w(4.2)}" fill="${FIG_COL.near}"/>`;
  out+=`<circle cx="${X(J.head)}" cy="${Y(J.head)}" r="${w(FIG_LEN.HR)}" fill="${H.includes('head')?FIG_COL.hl:FIG_COL.near}"/>`;
  out+=seg(J.l,col('leg'),10);
  out+=seg(J.a,col('arm'),8);
  out+=`<circle cx="${X(J.a[2])}" cy="${Y(J.a[2])}" r="${w(3.8)}" fill="${col('arm')}"/>`;
  return out;
}

/* Postura en el instante k∈[0,1) del ciclo. an.K = fotogramas; an.loop: recorre y vuelve
   al primero de golpe (para giros completos); si no, va y vuelve (ping-pong). */
function figAt(an,k){
  const K=an.K,n=K.length;
  const ease=x=>x*x*(3-2*x);
  if(an.loop){const f=k*(n-1),i=Math.min(n-2,Math.floor(f));return figLerp(K[i],K[i+1],ease(f-i));}
  const f=k*n,i=Math.floor(f)%n;return figLerp(K[i],K[(i+1)%n],ease(f-Math.floor(f)));
}

too much, leave your bottom foot on the floor."},"hamstring":{"n":"Hamstring stretch","d":"On your back, lift one straight leg and hold it behind the thigh.","v":"Leg up, breathe and let go.","tip":"You can bend your knee a little."},"seatedfwd":{"n":"Seated forward fold","d":"Seated with legs straight, lean forward from your hips, without forcing.","v":"Lean from your hips, breathe.","tip":"Bend your knees if they pull a lot."},"butterfly":{"n":"Butterfly","d":"Seated, bring the soles of your feet together and let your knees drop. Lean forward a little.","v":"Knees open, breathe.","tip":"Don’t push your knees down with your elbows."},"sidequad":{"n":"Side-lying quad stretch","d":"Lying on your side, bring your top heel to your glute holding your ankle.","v":"Heel to glute, knees together.","tip":"If you can’t reach your ankle, hold your trousers."},"lowlunge":{"n":"Low lunge","d":"One knee on the mat and the other foot in front. Shift your hips slightly forward.","v":"Hips forward, torso tall.","tip":"Put something soft under your knee if it bothers you."},"yogisquat":{"n":"Deep squat","d":"Feet wide, lower into a deep squat with your hands together in front of your chest.","v":"Sink down and breathe.","tip":"If your heels lift, widen your feet."},"spinaltwist":{"n":"Supine twist","d":"On your back, knees bent. Let them drop to one side with your arms out wide.","v":"Knees to one side, breathe.","tip":"Let the weight of your legs do the work."},"kneehug":{"n":"Knees to chest","d":"On your back, hug your knees and rock gently side to side.","v":"Hug your knees, rock.","tip":"It’s a massage for your lower back."},"tricepstretch":{"n":"Triceps stretch","d":"Standing, raise one arm, bend the elbow and bring your hand down your back. Your other hand gently pushes the elbow.","v":"Elbow up, push gently.","tip":"Keep your neck relaxed."},"neck":{"n":"Neck mobility","d":"Standing or seated, bring your chin to your chest and draw half circles in front, shoulder to shoulder.","v":"Half circle in front, very gently.","tip":"Never tip your head back."},"shouldercircle":{"n":"Shoulder circles","d":"Hands on your shoulders, draw big circles with your elbows.","v":"Big circles with your elbows.","tip":"Halfway through, switch direction."},"breathe":{"n":"Closing breath","d":"Lying on your back, close your eyes. Inhale for 4 counts and exhale for 6.","v":"Inhale for four, exhale for six.","tip":"Let your body sink into the mat."}},"fr":{"march":{"n":"Marche sur place","d":"Debout, lève un genou puis l’autre en balançant les bras. Rythme confortable.","v":"Genoux en haut, bras relâchés. Réveille ton corps.","tip":"Pour plus d’intensité, monte les genoux à hauteur de hanche."},"armcircle":{"n":"Cercles de bras","d":"Debout, dessine de grands cercles vers l’arrière avec les bras tendus.","v":"Grands cercles lents. Relâche les épaules.","tip":"À mi-parcours, change de sens."},"hipcircle":{"n":"Cercles de hanches","d":"Mains sur la taille, genoux souples. Dessine de grands cercles avec les hanches.","v":"Grands cercles de hanches, sans te presser.","tip":"À mi-parcours, change de sens."},"catcow":{"n":"Chat-vache","d":"À quatre pattes. À l’inspiration, creuse le dos et regarde devant ; à l’expiration, arrondis-le comme un chat.","v":"Inspire, ouvre la poitrine. Expire, arrondis le dos.","tip":"Bouge avec ta respiration, sans forcer."},"squat_half":{"n":"Demi-squat","d":"Pieds écartés à largeur de hanches. Recule les hanches comme pour t’asseoir, seulement à mi-hauteur, puis remonte.","v":"Hanches en arrière, poitrine haute. Descends et remonte.","tip":"Les genoux suivent la direction des pieds. Poids sur les talons."},"squat":{"n":"Squat","d":"Pieds écartés à largeur de hanches. Recule les hanches jusqu’à ce que les cuisses soient presque parallèles au sol, puis remonte en poussant le sol.","v":"Descends contrôlée, remonte en poussant le sol.","tip":"Dos long et talons bien au sol. Bras devant pour l’équilibre."},"jumpsquat":{"n":"Squat sauté","d":"Fais un squat et, en remontant, saute en douceur. Atterris genoux souples et enchaîne.","v":"Descends, saute, atterris en douceur.","tip":"Si tu ne peux pas sauter (voisins, genoux), fais des squats avec 3 secondes de pause en bas."},"lunge_short":{"n":"Fente arrière courte","d":"Debout, fais un petit pas en arrière et plie légèrement les deux genoux. Reviens et change de jambe.","v":"Pas en arrière, descends un peu, reviens. Alterne.","tip":"Garde le poids sur la jambe avant. Va lentement pour garder l’équilibre."},"lunge":{"n":"Fente arrière","d":"Fais un grand pas en arrière et descends le genou arrière près du sol. Reviens en poussant sur la jambe avant. Alterne.","v":"Pas en arrière, genou en bas, reviens. Alterne les jambes.","tip":"Le genou avant reste au-dessus de la cheville. Buste droit."},"lunge_knee":{"n":"Fente arrière avec montée de genou","d":"Fente arrière et, en revenant, monte ce genou à hauteur de hanche. Alterne les jambes.","v":"Fente arrière et genou en haut. Avec contrôle.","tip":"Si tu perds l’équilibre, pose le pied un instant avant de monter le genou."},"sumo":{"n":"Squat sumo","d":"Pieds plus écartés que les hanches, pointes vers l’extérieur. Descends buste droit et remonte en serrant les fessiers.","v":"Pieds écartés, genoux vers l’extérieur. Descends et remonte.","tip":"Les genoux pointent dans la même direction que les pieds."},"sumo_pulse":{"n":"Squat sumo pulsé","d":"Position sumo. Descends et fais deux petits rebonds en bas avant de remonter.","v":"Descends, deux petits rebonds, remonte.","tip":"Rebonds petits et contrôlés, sans te laisser tomber."},"sumohold":{"n":"Squat sumo tenu","d":"Descends en position sumo et reste là, buste droit et genoux vers l’extérieur.","v":"Tiens en bas. Respire.","tip":"Si ça brûle trop, remonte un peu et continue de tenir."},"calfraise":{"n":"Montées sur pointes","d":"Debout, monte lentement sur la pointe des pieds et redescends sans poser complètement les talons.","v":"Monte sur les pointes, descends lentement.","tip":"Fixe un point devant toi pour garder l’équilibre."},"calfraise_slow":{"n":"Montées sur pointes lentes","d":"Monte sur les pointes, tiens 2 secondes en haut et descends en 3 secondes.","v":"Monte, tiens, descends lentement.","tip":"Plus c’est lent, plus les mollets travaillent."},"squathold":{"n":"Squat isométrique","d":"Descends en squat et reste immobile, comme assise sur une chaise invisible.","v":"Tiens en bas. Respire tranquillement.","tip":"Niveau facile : reste à mi-hauteur."},"bridge":{"n":"Pont fessier","d":"Sur le dos, genoux pliés et pieds au sol. Monte les hanches en serrant les fessiers et redescends lentement.","v":"Monte les hanches, serre les fessiers, descends lentement.","tip":"Pousse avec les talons. Ne cambre pas le bas du dos."},"bridgehold":{"n":"Pont fessier tenu","d":"Monte les hanches en pont et garde-les en haut, fessiers serrés.","v":"Hanches en haut, tiens. Respire.","tip":"Si tu sens le bas du dos, descends un peu les hanches."},"bridge1leg":{"n":"Pont fessier sur une jambe","d":"Pont avec une jambe tendue vers le haut. Monte et descends les hanches. À mi-parcours, change de jambe.","v":"Une jambe en l’air, monte les hanches. Change à mi-parcours.","tip":"Les hanches montent droites, sans basculer d’un côté."},"bridgemarch":{"n":"Pont fessier en marche","d":"En pont, ramène un genou vers la poitrine puis l’autre, sans laisser descendre les hanches.","v":"Hanches en haut, marche lente.","tip":"Si les hanches descendent, fais le pont classique."},"pushup_knee":{"n":"Pompe sur les genoux","d":"Genoux sur le tapis et mains sous les épaules. Descends la poitrine vers le sol et remonte, corps droit des genoux à la tête.","v":"Poitrine en bas, pousse pour remonter. Abdos gainés.","tip":"Coudes à environ 45 degrés du corps, pas trop écartés."},"pushup":{"n":"Pompe","d":"En planche, mains sous les épaules. Descends la poitrine près du sol et remonte, corps bien aligné.","v":"Corps droit, descends et remonte.","tip":"Si les hanches s’affaissent, passe aux pompes sur les genoux."},"pushup_slow":{"n":"Pompe lente","d":"Pompe en descendant en 3 secondes et en remontant en 3 secondes.","v":"Trois secondes en bas, trois en haut.","tip":"La lenteur fait la difficulté : pas besoin d’en faire beaucoup."},"shouldertap_knee":{"n":"Touchers d’épaules sur les genoux","d":"En planche sur les genoux, touche l’épaule opposée avec une main et alterne.","v":"Touche l’épaule, alterne. Hanches immobiles.","tip":"Écarte un peu les genoux pour plus de stabilité."},"shouldertap":{"n":"Touchers d’épaules en planche","d":"En planche haute, touche l’épaule opposée avec une main et alterne, sans balancer les hanches.","v":"Touche l’épaule et alterne. Hanches immobiles.","tip":"Pieds écartés = plus facile ; pieds joints = plus difficile."},"shouldertap_hard":{"n":"Touchers d’épaules, pieds joints","d":"Planche haute pieds joints. Touche lentement l’épaule opposée et alterne.","v":"Pieds joints, touchers lents. Rien ne bouge.","tip":"Compte deux secondes à chaque toucher."},"floordip":{"n":"Dips au sol","d":"Assise, mains derrière toi doigts vers toi, genoux pliés. Monte les hanches, puis plie et tends les coudes.","v":"Plie les coudes vers l’arrière et tends.","tip":"Niveau facile : petit mouvement. Épaules loin des oreilles."},"floordip_leg":{"n":"Dips au sol, jambe tendue","d":"Comme les dips au sol, mais avec une jambe tendue. À mi-parcours, change de jambe.","v":"Coudes en arrière et tends. Change de jambe à mi-parcours.","tip":"Garde les hanches hautes tout le temps."},"downdog":{"n":"Chien tête en bas pédalé","d":"Mains et pieds au sol, hanches en haut, comme un V inversé. Plie un genou puis l’autre.","v":"Hanches en haut, pédale doucement.","tip":"Tu peux garder les genoux pliés : l’important, c’est le dos long."},"pike":{"n":"Pompe en pike","d":"Depuis le V inversé, plie les coudes pour approcher la tête du sol entre les mains, puis remonte.","v":"Hanches en haut, tête vers le sol, remonte.","tip":"Ça travaille les épaules. Rapproche les pieds des mains pour corser l’exercice."},"pike_slow":{"n":"Pompe en pike lente","d":"Pompe en pike en descendant en 3 secondes.","v":"Descends en trois secondes, remonte.","tip":"Coudes vers l’arrière, pas sur les côtés."},"plank_knee":{"n":"Planche sur les genoux","d":"Avant-bras ou mains au sol, genoux posés. Corps droit des genoux à la tête. Tiens.","v":"Abdos gainés. Respire.","tip":"Regarde le sol pour ne pas forcer sur la nuque."},"plank":{"n":"Planche","d":"Mains sous les épaules et jambes tendues. Corps bien aligné. Tiens.","v":"Corps droit, respire tranquillement.","tip":"Si le bas du dos se creuse, pose les genoux."},"plankleg":{"n":"Planche avec jambe levée","d":"En planche, lève une jambe tendue d’une main de hauteur et redescends-la. Alterne.","v":"Planche solide, lève une jambe, alterne.","tip":"Les hanches ne tournent pas quand tu lèves la jambe."},"plankdog":{"n":"Planche vers chien tête en bas","d":"Depuis la planche, pousse les hanches vers le haut jusqu’au V inversé et reviens en planche.","v":"Hanches en haut, retour en planche.","tip":"Niveau facile : fais-le avec les genoux posés en planche."},"scap":{"n":"Pompe scapulaire","d":"En planche bras tendus, laisse la poitrine descendre en rapprochant les omoplates, puis pousse le sol pour les écarter.","v":"Rapproche les omoplates, pousse le sol.","tip":"Les coudes ne plient pas. Niveau facile : genoux posés."},"deadbug_easy":{"n":"Dead bug facile","d":"Sur le dos, bras vers le plafond et genoux en table. Descends un pied toucher le sol et reviens. Alterne.","v":"Touche le sol avec un pied, reviens. Alterne.","tip":"Le bas du dos reste collé au tapis."},"deadbug":{"n":"Dead bug","d":"Sur le dos, bras vers le plafond et genoux en table. Tends en même temps un bras en arrière et la jambe opposée. Reviens et alterne.","v":"Bras et jambe opposée loin. Reviens. Bas du dos collé.","tip":"Expire en tendant. Si le bas du dos se décolle, tends moins loin."},"deadbug_slow":{"n":"Dead bug lent","d":"Dead bug en tendant en 3 secondes et en marquant une pause d’une seconde bras et jambe loin.","v":"Tends lentement, tiens, reviens.","tip":"C’est la lenteur qui le rend difficile."},"crunch":{"n":"Crunch","d":"Sur le dos, genoux pliés. Monte la tête et les épaules en regardant tes genoux et redescends lentement.","v":"Monte les épaules, descends lentement.","tip":"Garde l’espace d’un poing entre le menton et la poitrine."},"crunch_tt":{"n":"Crunch jambes en table","d":"Genoux en l’air à 90 degrés, monte la tête et les épaules et redescends lentement.","v":"Jambes immobiles, monte et descends.","tip":"Expire en montant."},"situp":{"n":"Sit-up","d":"Sur le dos, genoux pliés. Monte jusqu’à t’asseoir et redescends vertèbre par vertèbre.","v":"Monte jusqu’à t’asseoir, descends lentement.","tip":"Si tu tires sur la nuque, tends les bras devant toi."},"sideplank_knee":{"n":"Planche latérale sur le genou","d":"Sur le côté, en appui sur l’avant-bras et le genou du bas. Monte les hanches pour former une ligne. Tiens et change de côté.","v":"Hanches en haut, tiens.","tip":"Le coude reste juste sous l’épaule."},"sideplank":{"n":"Planche latérale","d":"Sur le côté, en appui sur l’avant-bras et le bord du pied. Hanches en haut, corps droit. Tiens et change de côté.","v":"Corps droit comme une planche. Tiens.","tip":"Pour simplifier, pose le genou du bas."},"sideplank_dip":{"n":"Planche latérale avec descentes","d":"En planche latérale, descends les hanches presque au sol et remonte-les. Change de côté.","v":"Descends les hanches et remonte.","tip":"Mouvement contrôlé, sans à-coups."},"legraise_single":{"n":"Levée d’une jambe","d":"Sur le dos, jambes tendues. Lève une jambe vers le plafond et redescends-la sans toucher le sol. Alterne.","v":"Une jambe en haut, descends lentement. Alterne.","tip":"Mains sous les fessiers si tu sens le bas du dos."},"reversecrunch":{"n":"Crunch inversé","d":"Sur le dos, genoux en table. Ramène les genoux vers la poitrine en décollant un peu les hanches et redescends lentement.","v":"Genoux à la poitrine, descends lentement.","tip":"Sans élan : le mouvement est petit."},"legraise":{"n":"Levée de jambes","d":"Sur le dos, jambes jointes et tendues. Monte-les vers le plafond et redescends-les lentement sans toucher le sol.","v":"Jambes en haut, descente lente.","tip":"Si le bas du dos se décolle, plie un peu les genoux."},"birddog_easy":{"n":"Bird dog facile","d":"À quatre pattes, tends un bras devant et reviens ; puis la jambe opposée derrière. Alterne.","v":"Tends un bras, reviens. Puis la jambe.","tip":"Dos plat comme une table."},"birddog":{"n":"Bird dog","d":"À quatre pattes, tends en même temps un bras devant et la jambe opposée derrière. Reviens et alterne.","v":"Bras et jambe opposée longs. Reviens et change.","tip":"Imagine un verre d’eau sur ton dos qui ne doit pas tomber."},"birddog_crunch":{"n":"Bird dog coude-genou","d":"Tends le bras et la jambe opposée, puis rapproche coude et genou sous le corps. À mi-parcours, change de côté.","v":"Tends loin, coude au genou.","tip":"Va lentement pour garder l’équilibre."},"hollow_tuck":{"n":"Position creuse groupée","d":"Sur le dos, monte les épaules et les bras, genoux pliés en l’air. Bas du dos collé. Tiens.","v":"Bas du dos collé, tiens. Respire.","tip":"Plus les genoux sont proches, plus c’est facile."},"hollow":{"n":"Position creuse","d":"Sur le dos, bras en arrière et jambes tendues, le tout légèrement décollé du sol. Bas du dos collé. Tiens.","v":"Corps en forme de barque. Tiens.","tip":"Monte davantage les jambes si le bas du dos se décolle."},"hollowrock":{"n":"Position creuse en balancier","d":"En position creuse, balance-toi d’avant en arrière sans perdre la forme.","v":"Forme de barque, balance-toi.","tip":"Si tu perds la forme, reviens à la position tenue immobile."},"swimming":{"n":"Nageuse","d":"Sur le ventre, bras devant. Lève en même temps un bras et la jambe opposée et alterne, comme en nageant.","v":"Bras et jambe opposée en haut. Alterne.","tip":"Regarde le sol pour ne pas forcer sur la nuque."},"superman":{"n":"Superman","d":"Sur le ventre, bras devant. Lève en même temps les bras, la poitrine et les jambes d’une main de hauteur, puis redescends.","v":"Tout en haut, une seconde, en bas.","tip":"Serre les fessiers pour protéger le bas du dos."},"supermanhold":{"n":"Superman tenu","d":"Lève les bras, la poitrine et les jambes et reste en haut en respirant.","v":"En haut et tiens.","tip":"Mieux vaut peu de hauteur bien faite que beaucoup en forçant."},"proneY":{"n":"Élévations en Y","d":"Sur le ventre, bras devant en Y, pouces vers le haut. Lève les bras en rapprochant les omoplates et redescends.","v":"Bras en Y en haut, omoplates serrées.","tip":"Les épaules descendent loin des oreilles."},"proneY_slow":{"n":"Élévations en Y avec pause","d":"Élévations en Y en tenant 2 secondes en haut.","v":"En haut, tiens, en bas.","tip":"Pas d’élan : monte avec le dos."},"bear":{"n":"Ours","d":"À quatre pattes, décolle les genoux de 2 centimètres du sol et tiens, dos plat.","v":"Genoux en suspension. Tiens.","tip":"Si c’est trop dur, pose les genoux et remonte."},"beartap":{"n":"Ours avec touchers d’épaules","d":"En position d’ours, touche l’épaule opposée avec une main et alterne.","v":"Genoux en suspension, touche l’épaule, alterne.","tip":"Les hanches ne se balancent pas."},"swimming_fast":{"n":"Nageuse rapide","d":"Nageuse sur le ventre à un rythme plus soutenu, sans perdre de hauteur.","v":"Bras et jambe opposée, rythme soutenu.","tip":"Respire calmement même si le rythme est rapide."},"climber_slow":{"n":"Mountain climber lent","d":"En planche, ramène un genou vers la poitrine, reviens et change. Lentement.","v":"Genou à la poitrine, alterne lentement.","tip":"Épaules au-dessus des mains."},"climber":{"n":"Mountain climber","d":"En planche, alterne les genoux vers la poitrine en rythme, comme si tu courais.","v":"Genoux à la poitrine, rythme soutenu.","tip":"Hanches basses, alignées avec les épaules."},"burpee_step":{"n":"Burpee sans saut","d":"Debout, accroupis-toi mains au sol, recule les pieds en planche un par un, reviens et relève-toi.","v":"En bas, pieds en arrière, pieds devant, debout.","tip":"Sans te presser : chaque pas bien fait."},"burpee":{"n":"Burpee","d":"Accroupis-toi, saute en planche, ramène les pieds vers les mains et saute bras vers le plafond.","v":"En bas, planche, reviens et saute.","tip":"Si besoin, supprime le saut final."},"childpose":{"n":"Posture de l’enfant","d":"À genoux, assieds-toi sur les talons et tends les bras devant, front au sol.","v":"Respire dans ton dos.","tip":"Écarte les genoux si c’est plus confortable."},"childreach":{"n":"De l’enfant à quatre pattes","d":"Depuis quatre pattes, ramène les hanches vers les talons et reviens, lentement.","v":"Hanches en arrière, respire, reviens.","tip":"Laisse-toi descendre en douceur, sans forcer."},"thread":{"n":"Aiguille qu’on enfile","d":"À quatre pattes, passe un bras sous ton corps et pose l’épaule au sol.","v":"Bras dessous, épaule au sol. Respire.","tip":"Ça ouvre le haut du dos. Sans te presser."},"sphinx":{"n":"Sphinx","d":"Sur le ventre, en appui sur les avant-bras, coudes sous les épaules. Poitrine ouverte.","v":"Poitrine ouverte, épaules loin des oreilles.","tip":"Si le bas du dos gêne, avance les coudes."},"cobra":{"n":"Cobra doux","d":"Sur le ventre, mains sous les épaules. Monte la poitrine avec le dos, sans tendre complètement les bras.","v":"Monte la poitrine, redescends doucement.","tip":"La hauteur ne compte pas. Aucune douleur."},"figure4":{"n":"Figure 4","d":"Sur le dos, croise une cheville sur le genou opposé et ramène les jambes vers la poitrine.","v":"Respire dans le fessier.","tip":"Si c’est trop, laisse le pied du bas au sol."},"hamstring":{"n":"Étirement des ischios","d":"Sur le dos, lève une jambe tendue et tiens-la derrière la cuisse.","v":"Jambe en haut, respire et relâche.","tip":"Tu peux plier un peu le genou."},"seatedfwd":{"n":"Pince assise","d":"Assise jambes tendues, penche-toi en avant depuis les hanches, sans forcer.","v":"Penche-toi depuis les hanches, respire.","tip":"Plie les genoux si ça tire trop."},"butterfly":{"n":"Papillon","d":"Assise, joins les plantes des pieds et laisse tomber les genoux. Penche-toi un peu en avant.","v":"Genoux ouverts, respire.","tip":"N’appuie pas sur les genoux avec les coudes."},"sidequad":{"n":"Quadriceps sur le côté","d":"Allongée sur le côté, ramène le talon du dessus vers le fessier en tenant la cheville.","v":"Talon au fessier, genoux serrés.","tip":"Si tu n’atteins pas la cheville, tiens ton pantalon."},"lowlunge":{"n":"Fente basse","d":"Un genou sur le tapis et l’autre pied devant. Avance un peu les hanches.","v":"Hanches en avant, buste haut.","tip":"Mets quelque chose de doux sous le genou si ça gêne."},"yogisquat":{"n":"Squat profond","d":"Pieds écartés, descends en squat profond, mains jointes devant la poitrine.","v":"Descends et respire.","tip":"Si les talons se lèvent, écarte davantage les pieds."},"spinaltwist":{"n":"Torsion allongée","d":"Sur le dos, genoux pliés. Laisse-les tomber d’un côté, bras en croix.","v":"Genoux d’un côté, respire.","tip":"Laisse le poids des jambes faire le travail."},"kneehug":{"n":"Genoux à la poitrine","d":"Sur le dos, serre les genoux dans tes bras et balance-toi doucement de gauche à droite.","v":"Serre tes genoux, balance-toi.","tip":"C’est un massage pour le bas du dos."},"tricepstretch":{"n":"Étirement des triceps","d":"Debout, lève un bras, plie le coude et amène la main dans le dos. L’autre main pousse doucement le coude.","v":"Coude en haut, pousse doucement.","tip":"Garde la nuque détendue."},"neck":{"n":"Mobilité de la nuque","d":"Debout ou assise, amène le menton vers la poitrine et dessine des demi-cercles devant, d’une épaule à l’autre.","v":"Demi-cercle devant, tout en douceur.","tip":"Ne bascule jamais la tête en arrière."},"shouldercircle":{"n":"Cercles d’épaules","d":"Mains sur les épaules, dessine de grands cercles avec les coudes.","v":"Grands cercles avec les coudes.","tip":"À mi-parcours, change de sens."},"breathe":{"n":"Respiration finale","d":"Allongée sur le dos, ferme les yeux. Inspire sur 4 temps et expire sur 6.","v":"Inspire sur quatre, expire sur six.","tip":"Laisse ton corps peser sur le tapis."}}};
/* Ejercicio en el idioma actual */
function exL(id){const e=EX[id],tr=(EX_L[crisLang()]||{})[id];return tr?{...e,n:tr.n,d:tr.d,v:tr.v,tip:tr.tip}:e;}

/* ─── NIVEL Y PROGRESO ─── */
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getLevel(){const l=lsGet('cris_calis_level',0);return (l===0||l===1||l===2)?l:0;}
function setLevel(l){lsSet('cris_calis_level',l);lsSet('cris_calis_start',dayKey());initHome();if(document.getElementById('v-day').classList.contains('active'))openDay(curDayIdx);}
// Semana de progreso (0-3) desde que empezaste en este nivel; a partir de la 4.ª se mantiene
function weeksAtLevel(){const s=lsGet('cris_calis_start',null);if(!s)return 0;const d=(new Date(dayKey())-new Date(s))/864e5;return Math.max(0,Math.floor(d/7));}
function progWeek(){return Math.min(3,weeksAtLevel());}
function levelTimes(){const L=LEVEL_TIMES[getLevel()],w=progWeek();return {work:L.w[w],rest:L.r[w]};}

/* ─── SESIÓN DEL DÍA: se construye a partir del programa, el nivel y la semana ─── */
function buildDay(i){
  const D=WEEK[i],lv=getLevel(),items=[];
  const mk=(id,dur,rest,sides,sec,extra)=>{const e=exL(id);return {id,name:e.n,desc:e.d,voice:e.v,tip:e.tip,emoji:e.e,anim:e.a,duration:dur,rest,sides:sides||1,sec,...(extra||{})};};
  if(D.stretch){
    D.list.forEach(([id,dur,sd])=>items.push(mk(id,dur,5,sd,'st')));
  }else{
    const {work,rest}=levelTimes(),R=2;
    WARMUP.forEach(([id,dur])=>items.push(mk(id,dur,0,1,'warm')));
    for(let r=1;r<=R;r++)D.circuit.forEach((slot,k)=>{
      const id=slot[lv],e=EX[id],sd=e.sd===2?2:1;
      const last=(r===R&&k===D.circuit.length-1);
      items.push(mk(id,sd===2?Math.round(work/2):work,last?0:(k===D.circuit.length-1?Math.max(rest,40):rest),sd,'main',{round:r,rounds:R,slot:k+1,slots:D.circuit.length,repeat:r>1}));
    });
    D.cool.forEach(([id,dur,sd])=>items.push(mk(id,dur,5,sd,'cool')));
  }
  const secs=items.reduce((s,x)=>s+x.duration*x.sides+x.rest+(x.sides===2?5:0)+6,0);
  return {id:D.id,idx:i,emoji:D.emoji,color:D.color,stretch:!!D.stretch,name:t('dn')[i],focus:t('f_'+D.id),intro:t('i_'+D.id),items,mins:Math.round(secs/60)};
}

/* ─── FIGURA ANIMADA: una única animación continua que se puede copiar ─── */
let FIG_T0=performance.now(),FIG_PAUSED=false,FIG_PAUSE_AT=0;
function figTime(){return ((FIG_PAUSED?FIG_PAUSE_AT:performance.now())-FIG_T0)/1000;}
function figReset(){FIG_T0=performance.now();FIG_PAUSED=false;}
function figPause(p){if(p&&!FIG_PAUSED){FIG_PAUSE_AT=performance.now();FIG_PAUSED=true;}else if(!p&&FIG_PAUSED){FIG_T0+=performance.now()-FIG_PAUSE_AT;FIG_PAUSED=false;}}
function figFrame(svg,key,k){
  const an=FIG_ANIMS[key]||FIG_ANIMS.breathe;
  if(!svg._fit||svg._key!==key){svg._fit=figFit(an.K);svg._key=key;}
  svg.querySelector('g.fig-body').innerHTML=figSVG(figAt(an,k),svg._fit,an.hl);
}
function figLoop(){
  document.querySelectorAll('svg.fig').forEach(svg=>{
    const key=svg.dataset.anim,an=FIG_ANIMS[key]||FIG_ANIMS.breathe;
    const T=an.tempo||3,time=svg.dataset.still?T*.5:figTime();
    if(svg.dataset.still&&svg._drawn===key)return; // miniaturas: se dibujan una vez
    figFrame(svg,key,(time%T)/T);svg._drawn=key;
    const rep=svg.parentNode.querySelector('.rep-badge');
    if(rep&&S.phase==='active'){rep.textContent=an.hold?t('hold'):t('rep',{n:Math.floor(figTime()/T)+1});rep.style.display='';}
    else if(rep)rep.style.display='none';
  });
  requestAnimationFrame(figLoop);
}
requestAnimationFrame(figLoop);
function getAnim(key,opts){
  opts=opts||{};
  return `<div class="anim-wrap${opts.big?' big':''}">
    <svg class="fig" data-anim="${key}"${opts.still?' data-still="1"':''} viewBox="${FIG_VB}" xmlns="http://www.w3.org/2000/svg"${opts.mirror?' style="transform:scaleX(-1)"':''}>${FIG_MAT}<g class="fig-body"></g></svg>
    ${opts.tag?`<span class="anim-tag">${opts.tag}</span>`:''}
    ${opts.big?'<span class="rep-badge" style="display:none"></span>':''}
  </div>`;
}
function thumb(key){return `<svg class="fig thumb" data-anim="${key}" data-still="1" viewBox="${FIG_VB}" xmlns="http://www.w3.org/2000/svg">${FIG_MAT}<g class="fig-body"></g></svg>`;}

const TODAY=new Date().getDay();
function todayDayIdx(){const m={1:0,2:1,3:2,4:3,5:4,6:5,0:6};return m[TODAY];}
let curDayIdx=0,CUR=null;
let S={exIdx:0,side:1,phase:'ready',timer:0,interval:null};

/* ─── AUDIO ─── */
let __beepCtx=null;function __getCtx(){try{if(!__beepCtx)__beepCtx=new(window.AudioContext||window.webkitAudioContext)();if(__beepCtx.state==='suspended')__beepCtx.resume();return __beepCtx;}catch(e){return null;}}
function beep(f=600,d=.2){if(!__allow('sound'))return;try{const c=__getCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.3,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.start();o.stop(c.currentTime+d);}catch(e){}}
function vibrate(ms=60){if(!__allow('vib'))return;try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
let _utt=null;
function speak(tx){try{if(!__allow('voice'))return;if(!window.speechSynthesis)return;window.speechSynthesis.cancel();if(window.speechSynthesis.paused)window.speechSynthesis.resume();_utt=new SpeechSynthesisUtterance(tx);_utt.lang=VOICE_LANG[crisLang()];_utt.rate=.9;const v=window.speechSynthesis.getVoices();const ev=v.find(x=>x.lang.startsWith(crisLang()));if(ev)_utt.voice=ev;window.speechSynthesis.speak(_utt);}catch(e){}}
let _speakSeq=0;
function speakThen(tx,cb){
  const seq=++_speakSeq;let done=false;
  const fin=()=>{if(done||seq!==_speakSeq)return;done=true;cb();};
  try{
    if(!__allow('voice')||!window.speechSynthesis){fin();return;}
    window.speechSynthesis.cancel();
    if(window.speechSynthesis.paused)window.speechSynthesis.resume();
    _utt=new SpeechSynthesisUtterance(tx);
    _utt.lang=VOICE_LANG[crisLang()];_utt.rate=.9;
    const v=window.speechSynthesis.getVoices();const ev=v.find(x=>x.lang.startsWith(crisLang()));if(ev)_utt.voice=ev;
    _utt.onend=fin;_utt.onerror=fin;
    window.speechSynthesis.speak(_utt);
    setTimeout(fin,Math.max(4000,tx.length*105));
  }catch(e){fin();}
}

/* ─── NAV ─── */
function go(v){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('v-'+v).classList.add('active');window.scrollTo(0,0);}

/* ─── INICIO ─── */
function levelChips(){
  const lv=getLevel(),names=t('lvl');
  return `<div class="lvl-row" role="radiogroup" aria-label="${t('lvl_label')}">${names.map((n,i)=>`<button class="lvl-chip${i===lv?' on':''}" role="radio" aria-checked="${i===lv}" onclick="setLevel(${i})">${['🌱','🌿','🌳'][i]} ${n}</button>`).join('')}</div>`;
}
function progText(){
  const {work,rest}=levelTimes();
  let s=t('prog',{w:progWeek()+1,work,rest});
  if(weeksAtLevel()>=4&&getLevel()<2)s+='<br><b>'+t('prog_up',{lvl:t('lvl')[getLevel()+1]})+'</b>';
  return s;
}
function initHome(){
  const ti=todayDayIdx(),d=buildDay(ti);
  document.getElementById('lvl-home').innerHTML=levelChips()+`<div class="prog-note">${progText()}</div>`;
  const tc=document.getElementById('today-card');
  tc.style.background=d.color;
  tc.innerHTML=`<div class="tc-label">${t('tc_today',{name:d.name})}</div><div class="tc-day">${d.focus}</div><div class="tc-meta">${d.stretch?t('tc_meta_st',{m:d.mins}):t('tc_meta',{m:d.mins,lvl:t('lvl')[getLevel()]})}</div><div class="tc-emoji">${d.emoji}</div>`;
  const dayNames=t('wl');
  document.getElementById('week-grid').innerHTML=WEEK.map((w,i)=>`<div class="wday ${i===ti?'today-mark':''}${w.stretch?' st':''}" onclick="openDay(${i})"><span class="wd-emoji">${w.emoji}</span><span class="wd-name">${dayNames[i]}</span></div>`).join('');
}
function openTodayDay(){openDay(todayDayIdx());}

/* ─── DÍA ─── */
function openDay(i){
  curDayIdx=i;const d=buildDay(i);CUR=d;
  document.getElementById('day-title').textContent=d.name;
  const dh=document.getElementById('day-header');
  dh.style.background=d.color;
  dh.innerHTML=`<div class="dh-focus">${d.focus}</div><div class="dh-meta">${t('dh_meta',{m:d.mins})}${d.stretch?'':' · '+t('lvl')[getLevel()]}</div><div class="dh-emoji">${d.emoji}</div>`;
  document.getElementById('day-lvl').innerHTML=d.stretch?'':levelChips();
  document.getElementById('day-intro').innerHTML=d.intro;
  const sec={warm:t('sec_warm'),main:t('sec_main',{r:2}),cool:t('sec_cool'),st:t('sec_st')};
  let html='',last='';
  d.items.forEach(ex=>{
    if(ex.sec==='main'&&ex.repeat)return; // la 2.ª ronda repite la 1.ª
    if(ex.sec!==last){html+=`<div class="sec-title">${sec[ex.sec]}</div>`;last=ex.sec;}
    const meta=ex.sides===2?t('ex_side',{n:ex.duration}):t('ex_sec',{n:ex.duration});
    html+=`<div class="ex-item">${thumb(ex.anim)}<div class="ex-info"><div class="ex-name">${ex.emoji} ${ex.name}</div><div class="ex-meta">${meta}</div></div></div>`;
  });
  document.getElementById('ex-list').innerHTML=html;
  go('day');
}

/* ─── SESIÓN (automática: un toque y todo fluye; tú solo copias a la figura) ─── */
let wakeLock=null;
async function keepAwake(){try{if('wakeLock' in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
function releaseAwake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&['prep','active','switch','rest'].includes(S.phase))keepAwake();
});
function exList(){return CUR.items;}
function startSession(){
  CUR=buildDay(curDayIdx);
  if(!lsGet('cris_calis_start',null))lsSet('cris_calis_start',dayKey());
  S={exIdx:0,side:1,phase:'idle',timer:0,total:0,interval:null,pausedPhase:null};
  document.getElementById('s-title').textContent=CUR.name+' · '+CUR.focus;
  go('session');renderSession();
}
function confirmStop(){stopSession();go('day');}
function stopSession(){stopTimer();releaseAwake();_speakSeq++;try{speechSynthesis.cancel();}catch(e){}}
function stopTimer(){if(S.interval){clearInterval(S.interval);S.interval=null;}}
function beginAll(){keepAwake();startPrep();}
function voiceOn(){return __allow('voice')&&!!window.speechSynthesis;}
// La primera vez se explica entero; en la 2.ª ronda basta el nombre y la clave
function exText(ex,first){
  const durTxt=ex.sides===2?t('v_sec_side',{n:ex.duration}):t('v_sec',{n:ex.duration});
  if(ex.repeat)return t('v_next')+ex.name+'. '+ex.voice;
  return (first?t('v_first'):t('v_next'))+ex.name+'. '+ex.desc+' '+ex.voice+t('v_will_be',{dur:durTxt});
}
function goActive(ex){
  S.phase='active';S.timer=ex.duration;S.total=ex.duration;
  figReset();beep(800,.15);vibrate(60);
}
function startPrep(){
  const ex=exList()[S.exIdx];
  S.phase='prep';S.side=1;
  vibrate(50);
  if(ex.round===2&&ex.slot===1)speak(t('v_round2'));
  if(!voiceOn()){S.timer=ex.repeat?5:8;S.total=S.timer;renderSession();S.interval=setInterval(sessionTick,1000);return;}
  S.timer=3;S.total=3;
  renderSession();
  speakThen(exText(ex,S.exIdx===0),()=>{
    if(S.phase!=='prep'||S.interval)return;
    S.interval=setInterval(sessionTick,1000);
  });
}
function advanceExDirect(){
  stopTimer();
  const L=exList();
  S.exIdx++;S.side=1;S.pausedPhase=null;
  if(S.exIdx>=L.length){S.phase='done';releaseAwake();renderSession();return;}
  if(!voiceOn()){startPrep();return;}
  const ex=L[S.exIdx];
  goActive(ex);speak(t('v_go',{n:ex.duration}));
  S.interval=setInterval(sessionTick,1000);
  renderSession();
}
function sessionTick(){
  S.timer--;
  const el=document.getElementById('s-timer');
  if(el)el.textContent=S.timer;
  __ring('s-ring',S.total?S.timer/S.total:0);
  if(S.phase==='active'){
    if(S.timer===Math.floor(S.total/2)&&S.total>=40)speak(t('v_half',{n:S.timer}));
    else if(S.timer===10&&S.total>=25)speak(t('v_last10'));
  }
  if(S.timer<=3&&S.timer>0&&(S.phase==='active'||S.phase==='prep'||S.phase==='rest'))beep(500,.08);
  if(S.timer>0)return;
  stopTimer();
  const L=exList(),ex=L[S.exIdx];
  if(S.phase==='prep'){
    goActive(ex);speak(t('v_go',{n:ex.duration}));
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='active'&&ex.sides===2&&S.side===1){
    S.side=2;S.phase='switch';S.timer=5;S.total=5;
    speak(t('v_switch',{n:ex.duration}));vibrate(60);
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='switch'){
    goActive(ex);
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='active'&&ex.rest>0&&S.exIdx<L.length-1){
    S.phase='rest';S.timer=ex.rest;S.total=ex.rest;
    beep(600,.15);vibrate(60);
    if(voiceOn()){
      S.nextReady=false;
      const nx=L[S.exIdx+1];
      const pre=(nx.round===2&&nx.slot===1)?t('v_round2')+' ':'';
      speakThen(t('v_rest',{n:ex.rest})+pre+exText(nx,false),()=>{
        S.nextReady=true;
        if(S.phase==='restwait')advanceExDirect();
      });
    }else{S.nextReady=true;}
    S.interval=setInterval(sessionTick,1000);
  }else if(S.phase==='rest'){
    if(voiceOn()&&!S.nextReady){S.phase='restwait';renderSession();return;}
    if(voiceOn()){advanceExDirect();}else{advanceEx();}
    return;
  }else{
    advanceEx();return;
  }
  renderSession();
}
function togglePlay(){
  if(S.phase==='paused'){
    if(S.pausedPhase==='restwait'){S.pausedPhase=null;advanceExDirect();return;}
    S.phase=S.pausedPhase||'active';S.pausedPhase=null;
    S.interval=setInterval(sessionTick,1000);
    figPause(false);keepAwake();speak(t('v_resume'));
  }else if(['prep','active','switch','rest','restwait'].includes(S.phase)){
    S.pausedPhase=S.phase;stopTimer();S.phase='paused';figPause(true);
    try{speechSynthesis.cancel();}catch(e){}
  }
  renderSession();
}
function skipPhase(){
  stopTimer();
  try{speechSynthesis.cancel();}catch(e){}
  const L=exList(),ex=L[S.exIdx];
  const ph=S.phase==='paused'?(S.pausedPhase||'active'):S.phase;
  S.pausedPhase=null;figPause(false);
  if(ph==='prep'||ph==='switch'){
    goActive(ex);S.interval=setInterval(sessionTick,1000);renderSession();
  }else if(ph==='active'&&ex.sides===2&&S.side===1){
    S.side=2;S.phase='switch';S.timer=5;S.total=5;
    S.interval=setInterval(sessionTick,1000);renderSession();
  }else if((ph==='rest'||ph==='restwait')&&voiceOn()){
    advanceExDirect();
  }else{
    advanceEx();
  }
}
function advanceEx(){
  stopTimer();
  const L=exList();
  S.exIdx++;S.side=1;S.pausedPhase=null;
  if(S.exIdx>=L.length){S.phase='done';releaseAwake();renderSession();}
  else startPrep();
}
function secLabel(ex){
  if(ex.sec==='main')return t('round',{r:ex.round,n:ex.rounds})+' · '+t('count',{i:ex.slot,n:ex.slots});
  return {warm:t('sec_warm'),cool:t('sec_cool'),st:t('sec_st')}[ex.sec];
}
function renderSession(){
  const d=CUR,L=d.items,total=L.length,el=document.getElementById('s-content');
  if(S.phase==='done'){
    try{localStorage.setItem('cris_hiit_v1_'+dayKey(),'1');}catch(e){}
    const log=lsGet('cris_calis_log',{});log[dayKey()]=d.stretch?'st':getLevel();lsSet('cris_calis_log',log);
    document.getElementById('s-fill').style.width='100%';
    document.getElementById('s-count').textContent='';
    el.innerHTML=`<div class="done-box"><div class="big">🎉</div><h2>${t('done_h')}</h2><p>${t('done_p',{name:d.name,focus:d.focus,u:__uname()})}</p></div><button class="btn btn-secondary" style="margin-bottom:8px" onclick="initHome();go('home')">${t('btn_home')}</button><button class="btn btn-primary" onclick="startSession()">${t('btn_repeat')}</button>`;
    beep(800,.2);setTimeout(()=>beep(1000,.3),250);vibrate([80,50,80]);
    speak(t('v_done'));
    return;
  }
  const ex=L[S.exIdx];
  document.getElementById('s-fill').style.width=(S.exIdx/total*100)+'%';
  document.getElementById('s-count').textContent=secLabel(ex);
  if(S.phase==='idle'){
    el.innerHTML=`
      ${getAnim(ex.anim,{big:true,tag:t('tag_first')})}
      <div class="s-box">
        <div class="s-phase">${t('idle_phase')}</div>
        <div class="s-exname">${d.focus}</div>
        <div class="s-desc">${t('idle_desc')}</div>
      </div>
      <button class="btn btn-primary" onclick="beginAll()">${t('idle_btn')}</button>`;
    figReset();return;
  }
  const isRest=S.phase==='rest'||S.phase==='restwait';
  const nextEx=S.exIdx<total-1?L[S.exIdx+1]:null;
  const showEx=(isRest&&nextEx)?nextEx:ex;
  const mirror=ex.sides===2&&S.side===2&&!isRest;
  const sideLabel=ex.sides===2&&!isRest?(S.side===1?t('side_r'):t('side_l')):'';
  let phaseLabel='',timerCls='',timerLbl='',animTag='';
  if(S.phase==='prep'){phaseLabel=t('ph_prep');timerLbl=t('tl_prep');animTag=t('tag_prep');}
  else if(S.phase==='active'){phaseLabel=t('ph_active');timerLbl=t('tl_active');animTag=t('tag_follow');}
  else if(S.phase==='paused'){phaseLabel=t('ph_paused');timerLbl=t('tl_paused');animTag=t('tag_paused');}
  else if(S.phase==='switch'){phaseLabel=t('ph_switch');timerCls=' sw-c';timerLbl=t('tl_switch');}
  else if(S.phase==='restwait'){phaseLabel=t('ph_restwait');timerCls=' rest-c';timerLbl=t('tl_restwait');animTag=nextEx?t('tag_next',{name:nextEx.name}):'';}
  else if(isRest){phaseLabel=t('ph_rest');timerCls=' rest-c';timerLbl=t('tl_rest');animTag=nextEx?t('tag_next',{name:nextEx.name}):'';}
  const showDesc=S.phase==='prep'||S.phase==='paused';
  el.innerHTML=`
    ${getAnim(showEx.anim,{big:true,tag:animTag,mirror})}
    <div class="s-box s-row">
      <div class="tring small" id="s-ring"><div class="tring-in"><div class="s-timer${timerCls}" id="s-timer">${S.timer}</div><div class="s-tlbl">${timerLbl}</div></div></div>
      <div class="s-info">
        <div class="s-phase">${phaseLabel}</div>
        <div class="s-exname">${isRest&&nextEx?t('next_prefix',{name:nextEx.name}):ex.name+sideLabel}</div>
        ${showDesc?`<div class="s-desc">${ex.desc}</div>`:''}
      </div>
    </div>
    ${showDesc?`<div class="s-tip">💡 ${ex.tip}</div>`:''}
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="togglePlay()">${S.phase==='paused'?t('btn_resume'):t('btn_pause')}</button>
      <button class="btn btn-primary" onclick="skipPhase()">${t('btn_skip')}</button>
    </div>`;
  __ring('s-ring',S.total?S.timer/S.total:0);
}

applyStaticI18n();
initHome();
if(location.hash==='#suave')openDay(6); // modo eco (poca batería): directo a los estiramientos suaves
/* Atrás del móvil: el padre llama __crisBack() (síncrono); true = retrocedió.
   Sesión en marcha: el primer atrás PAUSA; el segundo, ya en pausa, sale al listado. */
window.__crisBack=function(){
  var ses=document.querySelector('#v-session.active');
  if(ses&&['prep','active','switch','rest','restwait'].includes(S.phase)){togglePlay();return true;}
  var el=document.querySelector('.screen.active .back-btn');
  if(el){el.click();return true;}
  return false;
};
window.addEventListener('message',function(e){
  if(e&&e.data==='cris:back'&&window.__crisBack&&window.__crisBack()){
    try{parent.postMessage('cris:back-ok','*');}catch(_){}
  }
});
