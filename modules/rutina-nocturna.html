<!doctype html>
<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quico — Rutina nocturna</title>
<style>
:root{
  --bg1:#0f0f23;--bg2:#1a1a3a;--bg3:#2d1b69;
  --accent:#4fd1c7;--accent2:#7c3aed;--accent2-text:#c4b5fd;--accent3:#f59e0b;
  --card:rgba(255,255,255,0.08);
  --text:#f8fafc;--text-dim:#cbd5e1;--text-soft:#94a3b8;
}

* { box-sizing: border-box; }
button { font-family: inherit; }

body {
  margin: 0;
  font-family: 'Outfit', -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(ellipse at top, var(--bg3) 0%, var(--bg2) 50%, var(--bg1) 100%);
  background-color: var(--bg1);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 20px 100px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 420px;
  background: var(--card);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
}

.header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }

.title {
  font-size: 1.2rem;
  font-weight: 700;
  margin: 0;
  background: linear-gradient(135deg, var(--text), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle { font-size:0.85rem; color:var(--text-dim); margin:2px 0 0 0; }

.card {
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.05);
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border: none;
  padding: 12px 16px;
  min-height: 44px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.9rem;
  width: 100%;
  margin-bottom: 8px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79,209,199,0.4); }
.btn.sec { background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.2); }
.btn:disabled { opacity:.45; cursor:default; transform:none; box-shadow:none; }

.controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }

.step-visual { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }

.timer {
  font-size: 2.2rem;
  font-weight: 700;
  margin: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.timer.emo { background:none; -webkit-text-fill-color:currentColor; }

.step-counter { font-size:0.8rem; color:var(--text-soft); margin-top:2px; }

/* Plan de la noche: los 6 pasos como botones que se quitan o se ponen */
.steprow { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:3px; margin:0 0 12px; }
.stp { min-height:48px; padding:0; font-size:1.5rem; line-height:1; border-radius:12px; cursor:pointer;
  color:var(--text); background:rgba(79,209,199,.14); border:2px solid rgba(79,209,199,.6); }
.stp.off { opacity:.4; background:transparent; border-style:dashed; border-color:rgba(255,255,255,.4); filter:grayscale(1); }
.xinfo { font-size:.8rem; color:var(--text-soft); text-align:center; margin:0 0 12px; }

/* Lo que toca ahora: una cosa a la vez con su cuenta atrás */
.dots { display:flex; gap:6px; justify-content:center; margin:4px 0 12px; }
.dots i { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.18); }
.dots i.ok { background:var(--accent); }
.dots i.on { background:var(--accent2-text); }
.sx-card {
  background: rgba(255,255,255,0.08);
  padding: 14px 16px;
  border-radius: 12px;
  border-left: 4px solid var(--accent2);
  text-align: center;
}
.sx-card.sx-work, .sx-card.sx-done, .sx-card.sx-task { border-left-color: var(--accent); }
.sx-card.sx-switch, .sx-card.sx-wait { border-left-color: var(--accent3); }
.sx-card.sx-med, .sx-card.sx-close { border-left-color: var(--accent2-text); }
.sx-top { display:flex; justify-content:space-between; font-size:.8rem; color:var(--text-soft); }
.sx-kind { font-weight:700; color:var(--accent2-text); }
.sx-work .sx-kind, .sx-done .sx-kind { color:var(--accent); }
.sx-switch .sx-kind { color:var(--accent3); }
.sx-name { font-weight:700; font-size:1.15rem; margin:8px 0 2px; overflow-wrap:anywhere; }
.sx-side { display:inline-block; margin-top:4px; padding:3px 10px; border-radius:20px; background:rgba(255,255,255,.1); font-size:.85rem; font-weight:600; }
.sx-count { font-size:3.2rem; font-weight:800; line-height:1.1; margin:8px 0 4px; font-variant-numeric:tabular-nums; color:var(--accent); }
.sx-prep .sx-count, .sx-med .sx-count, .sx-close .sx-count { color:var(--accent2-text); }
.sx-switch .sx-count { color:var(--accent3); }
.sx-desc { font-size:.95rem; color:var(--text-dim); line-height:1.5; }
.sx-med .sx-desc { font-size:1rem; line-height:1.65; }
.sx-phrase { font-style:italic; font-size:1rem; line-height:1.5; color:var(--accent3); }
.sx-foot { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:12px; font-size:.8rem; color:var(--text-soft); text-align:left; }
.sx-skip { background:rgba(255,255,255,.1); color:var(--text); border:0; border-radius:16px; min-height:44px; padding:6px 14px; font-size:.85rem; font-weight:600; cursor:pointer; flex-shrink:0; }
.sx-wait .sx-name { font-size:1.4rem; }
.bed { margin:16px 0 4px; min-height:60px; font-size:1.1rem; }
.sx-close .sx-name { font-size:1.2rem; }

.note {
  background: rgba(79,209,199,0.1);
  border: 1px solid rgba(79,209,199,0.2);
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
  font-size: 0.85rem;
}

.meditation-intro {
  background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(79,209,199,0.1));
  border: 1px solid rgba(124,58,237,0.3);
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 0.9rem;
  font-style: italic;
  text-align: center;
}

/* «Siguiente» late suave cuando toca ir a la cama */
.pulse { animation: npulse 1.6s ease-in-out infinite; }
@keyframes npulse { 0%,100% { box-shadow:0 0 0 0 rgba(79,209,199,.55); } 50% { box-shadow:0 0 0 9px rgba(79,209,199,0); } }

.hidden { display: none !important; }

/* La pantalla se apaga y se vuelve cálida a medida que avanza la noche */
.dim {
  position: fixed;
  inset: 0;
  background: #120800;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.5s ease;
  z-index: 100;
}

.calm *,.calm *::before,.calm *::after{animation:none !important;transition:none !important}
.calm #dim{transition:opacity 1.5s ease !important}

.tring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(#4fd1c7 360deg,rgba(255,255,255,.12) 0);flex-shrink:0;}
.tring-in{width:96px;height:96px;border-radius:50%;background:#161632;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.tring .timer{font-size:1.4rem;}

@media (max-width:400px){
  body{padding:12px 12px 96px}
  .app{padding:16px 14px}
  .card{padding:14px 12px}
}

/* modo «menos texto» */
.simple .subtitle,.simple .meditation-intro,.simple #stepDesc,.simple .xinfo,.simple #infoBtn{display:none}
</style>
</head>
<body>

<div class="app">
  <!-- Pantalla principal -->
  <div id="home">
    <div class="header" style="flex-direction:column">
      <img src="../quico/quico_happy.png" alt="Quico" style="width:96px;height:auto;display:block;margin:0 auto 8px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.45))">
      <div style="text-align:center">
        <h1 class="title" data-i18n="title">Quico — Rutina nocturna</h1>
        <p class="subtitle" data-i18n="subtitle">Ritual diario para un sueño reparador</p>
      </div>
    </div>

    <div class="card">
      <h3 id="planH" style="margin:0 0 12px;text-align:center">Plan</h3>
      <div class="steprow" id="stepRow"></div>
      <p class="xinfo" data-i18n="plan_hint">Toca un paso para quitarlo o volver a ponerlo</p>
      <button class="btn" onclick="startRoutine()" data-i18n="start_btn">▶️ Comenzar rutina</button>
    </div>

    <button class="btn sec" id="infoBtn" onclick="showInfo()" data-i18n="info_btn">ℹ️ Ver información</button>
  </div>

  <!-- Pantalla de rutina -->
  <div id="routine" class="hidden">
    <div class="step-visual">
      <div style="min-width:0">
        <h3 id="stepTitle" style="margin:0 0 4px 0"></h3>
        <p id="stepDesc" style="margin:0;color:var(--text-dim);font-size:0.9rem"></p>
      </div>
      <div class="tring" id="n-ring"><div class="tring-in">
        <div class="timer" id="timer"></div>
        <div class="step-counter" id="counter"></div>
      </div></div>
    </div>

    <div id="stepContent"></div>

    <div class="controls">
      <button class="btn sec" id="pauseBtn" onclick="pauseRoutine()">⏸️ Pausar</button>
      <button class="btn" id="nextBtn" onclick="nextStep()">⏭️</button>
      <button class="btn hidden" id="endBtn" onclick="endRoutine()" style="grid-column:1/-1" data-i18n="finish_home_btn">🏠 Volver al inicio</button>
    </div>
  </div>

  <!-- Pantalla de información -->
  <div id="info" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px">
      <h2 style="margin:0;font-size:1.2rem" data-i18n="info_h">ℹ️ Información</h2>
      <button class="btn sec" onclick="showHome()" style="width:auto;margin:0;flex-shrink:0;min-height:44px;padding:8px 14px;font-size:.85rem" data-i18n="info_back">← Volver</button>
    </div>

    <div class="card">
      <h4 style="margin:0 0 12px 0" data-i18n="info_ben_h">🌙 Beneficios de la rutina</h4>
      <p style="font-size:0.9rem;line-height:1.5;color:var(--text-dim);margin:0" data-i18n="info_ben_p"></p>
    </div>
  </div>
</div>

<div id="dim" class="dim"></div>

// Devuelve el paso i con el texto en el idioma actual (fusiona con el dato ES)
function stepL(i){
  const lang=crisLang(),es=steps[i];
  if(lang==='es'||!STEPS_L[lang]||!STEPS_L[lang][i])return es;
  const tr=STEPS_L[lang][i],mix=(a,b)=>a.map((x,j)=>({...x,...(b&&b[j])}));
  const out={...es,title:tr.title,desc:tr.desc};
  if(es.tasks)out.tasks=mix(es.tasks,tr.tasks);
  if(es.stretches)out.stretches=mix(es.stretches,tr.stretches);
  if(es.meditation&&tr.meditation)out.meditation={...es.meditation,intro:tr.meditation.intro,closing:tr.meditation.closing,steps:mix(es.meditation.steps,tr.meditation.steps)};
  return out;
}
function applyStaticI18n(){document.documentElement.lang=crisLang();document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.getAttribute('data-i18n'));});}

/* Plan de cada paso: lista de tramos con su segundo de inicio. Un solo motor para todo:
   tareas (task), estiramientos (prep → work [→ switch → work] … → done) y meditación (med … → close).
   La duración del paso es la suma de sus tramos. */
const SX_PREP1 = 14, SX_PREP = 12, SX_SWITCH = 5, SX_DONE = 5, MED_CLOSE = 8;
const _plans = {};
function plan(i) {
  if (_plans[i]) return _plans[i];
  const st = steps[i], seg = []; let at = 0;
  const add = (k, len, j, side) => { seg.push({ k, len, j, side, at }); at += len; };
  if (st.tasks) st.tasks.forEach((x, j) => add('task', x.secs, j, 0));
  else if (st.stretches) {
    st.stretches.forEach((s, j) => {
      add('prep', j ? SX_PREP : SX_PREP1, j, 0);
      (s.sides || [0]).forEach((_, k) => { if (k) add('switch', SX_SWITCH, j, k); add('work', s.secs, j, k); });
    });
    add('done', SX_DONE, st.stretches.length - 1, 0);
  } else if (st.meditation) {
    st.meditation.steps.forEach((p, j) => add('med', p.secs, j, 0));
    add('close', MED_CLOSE, st.meditation.steps.length - 1, 0);
  }
  return _plans[i] = { seg, total: at };
}
steps.forEach((s, i) => { s.duration = plan(i).total; });

/* Pasos activos (personalización en la portada): {off:[ids]} — nunca 0 pasos */
function offIds(){
  let o=[];try{o=(JSON.parse(localStorage.getItem('cris_noche_cfg')||'{}').off||[]).filter(id=>steps.some(s=>s.id===id));}catch(e){}
  return o.length>=steps.length?[]:o;
}
function onSteps(){const o=offIds();return steps.map((_,i)=>i).filter(i=>!o.includes(steps[i].id));}
function toggleStep(id){
  const o=offIds(),k=o.indexOf(id);
  if(k>=0)o.splice(k,1);else{if(steps.length-o.length<=1)return;o.push(id);}
  try{localStorage.setItem('cris_noche_cfg',JSON.stringify({off:o}));}catch(e){}
  renderHome();
}

/* ── VOZ ── */
let _utt = null, _vc = null, _vcLang = '';
const plain = x => String(x).replace(/[\u{1F000}-\u{1FAFF}\u{2300}-\u{23FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu, '').replace(/\s+/g, ' ').trim();
try{window.speechSynthesis&&speechSynthesis.addEventListener('voiceschanged',()=>{_vc=null;});}catch(e){}
// La voz del idioma exacto (es-ES, en-US, fr-FR), mejor si es del propio móvil
function pickVoice(){
  try{
    const l=crisLang();if(_vc&&_vcLang===l)return _vc;
    const w=VOICE_LANG[l].toLowerCase(),n=x=>(x.lang||'').replace('_','-').toLowerCase(),v=speechSynthesis.getVoices();
    _vcLang=l;return _vc=v.find(x=>n(x)===w&&x.localService)||v.find(x=>n(x)===w)||v.find(x=>n(x).startsWith(l+'-'))||v.find(x=>n(x)===l)||null;
  }catch(e){return null;}
}
/* Safari pierde frases si se llama a cancel() sin nada sonando: solo se corta si hay algo */
function hush(){try{const ss=window.speechSynthesis;if(ss&&(ss.speaking||ss.pending))ss.cancel();}catch(e){}}
// queue = true: espera a que termine lo que se está diciendo (no lo corta)
function speak(tx, queue) {
  try {if(!__allow('voice')||!window.speechSynthesis)return;
    const ss = window.speechSynthesis;
    if (!queue) hush();
    if (ss.paused) ss.resume();
    _utt = new SpeechSynthesisUtterance(tx);
    _utt.lang = VOICE_LANG[crisLang()]; _utt.rate = .82; _utt.pitch = .95;
    const v = pickVoice(); if (v) _utt.voice = v;
    ss.speak(_utt);
  } catch (e) {}
}
try{window.speechSynthesis&&speechSynthesis.getVoices();}catch(e){} // las voces cargan tarde: se piden ya

/* ── SONIDOS: campanitas suaves (seno con caída exponencial) ── */
let __beepCtx=null;function __getCtx(){try{if(!__beepCtx)__beepCtx=new(window.AudioContext||window.webkitAudioContext)();if(__beepCtx.state!=='running'){const r=__beepCtx.resume();if(r&&r.catch)r.catch(()=>{});}return __beepCtx;}catch(e){return null;}}
/* iOS solo deja sonar el audio que empieza en un toque: se «despierta» al pulsar Comenzar */
function __unlockAudio(){try{const c=__getCtx();if(!c)return;const b=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(0);}catch(e){}}
function beep(freq,dur,vol){
  try{if(!__allow('sound'))return;
    const c=__getCtx();if(!c)return;
    const t0=c.currentTime,d=dur||.5,v=vol||.12;
    [[1,v],[2,v*.2]].forEach(([m,a])=>{ // tono + un armónico flojito: suena a campana
      const o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=(freq||587)*m;o.connect(g);g.connect(c.destination);
      g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(a,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.start(t0);o.stop(t0+d+.05);
    });
  }catch(e){}
}
function vibrate(p){try{if(!__allow('vib'))return;if(navigator.vibrate)navigator.vibrate(p||60);}catch(e){}}
function chime(){beep(523,.4);setTimeout(()=>beep(784,.8),300);}

/* ── TEXTOS DEL TRAMO ── */
const fmt = s => s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : String(s);
function durWords(s){if(s<60)return t('v_sec',{n:s});const m=Math.round(s/60);return m===1?t('v_min1'):t('v_min',{n:m});}
const phraseVoice = () => plain(t('phrase_text').replace(/["«»“”]/g, ''));
// Lo que toca ahora, en pocas palabras (al reanudar o al volver con la pantalla apagada)
function nowName(){
  const g=plan(cur).seg[segIdx],st=stepL(cur);if(!g)return '';
  if(g.k==='task')return plain(st.tasks[g.j].name);
  if(g.k==='med')return plain(st.meditation.steps[g.j].phase);
  if(g.k==='close')return st.meditation.closing;
  if(g.k==='done')return plain(t('sx_done'));
  const s=st.stretches[g.j];return s.name+(s.sides?'. '+s.sides[g.side]:'');
}
// «Después: …» = el siguiente elemento del paso o, tras el último, el siguiente paso
function afterTxt(g){
  const st=stepL(cur);let n='';
  if(g.k==='task'){const x=st.tasks[g.j+1];if(x)n=x.name;}
  else if(g.k==='med'){const x=st.meditation.steps[g.j+1];if(x)n=x.phase;}
  else if(g.k!=='done'&&g.k!=='close'){const x=st.stretches[g.j+1];if(x)n=x.name;}
  if(!n){const k=nextOn(cur);if(k>=0)n=stepL(k).title;}
  return n?t('sx_next',{n}):t('sx_last');
}
function dotsHtml(n,j,all){let h='';for(let i=0;i<n;i++)h+=`<i class="${all||i<j?'ok':i===j?'on':''}"></i>`;return h;}

function renderCard(g,left){
  const st=stepL(cur),box=$('box');if(!box)return;
  let h='',btn='',n=0;
  if(g.k==='task'){
    const x=st.tasks[g.j];n=st.tasks.length;
    h=`<div class="sx-name">${x.name}</div><div class="sx-count" id="sxCount">${fmt(left)}</div>`
      +(x.phrase?`<div class="sx-phrase">${t('phrase_text')}</div>`:x.say?`<div class="sx-desc">${x.say}</div>`:'');
    btn=`<button class="sx-skip" onclick="taskDone()">${t('task_done')}</button>`;
  }else if(g.k==='med'||g.k==='close'){
    const m=st.meditation,ph=m.steps[g.j];n=m.steps.length;
    h=g.k==='med'?`<div class="sx-name">${ph.phase}</div><div class="sx-count" id="sxCount">${fmt(left)}</div><div class="sx-desc">${ph.instruction}</div>`
      :`<div class="sx-name">🌙</div><div class="sx-count" id="sxCount">${left}</div><div class="sx-desc">${m.closing}</div>`;
  }else{
    const list=st.stretches,s=list[g.j],done=g.k==='done';n=list.length;
    const kind={prep:t('sx_prep'),work:t('sx_hold'),switch:t('sx_switch'),done:''}[g.k];
    h=`<div class="sx-top"><span>${done?'':(g.j+1)+'/'+n}</span><span class="sx-kind">${kind}</span></div>
      <div class="sx-name">${done?t('sx_done'):s.name}</div>
      ${s.sides&&!done?`<div class="sx-side">${s.sides[g.side]} · ${g.side+1}/${s.sides.length}</div>`:''}
      <div class="sx-count" id="sxCount">${left}</div>${done?'':`<div class="sx-desc">${s.desc}</div>`}`;
    if(!done)btn=`<button class="sx-skip" onclick="skipStretch()">${t('sx_skip')}</button>`;
  }
  box.innerHTML=`<div class="sx-card sx-${g.k}">${h}<div class="sx-foot"><span>${afterTxt(g)}</span>${btn}</div></div>`;
  $('dots').innerHTML=dotsHtml(n,g.j,g.k==='done'||g.k==='close');
}

/* Avisos de cada tramo (voz, campanita, vibración; todo respeta los ajustes y el modo calma).
   first: primer aviso del paso (lleva el título delante) · quiet: ya sonó la campanita del paso */
function announce(g,first,quiet,jump){
  const st=stepL(cur),pre=first?plain(st.title)+'. ':'';
  if(g.k==='task'){
    const x=st.tasks[g.j];
    speak(pre+(x.phrase?phraseVoice():x.say||plain(x.name)+'. '+durWords(x.secs)+'.'));
    if(!quiet)beep(587,.5);vibrate(60);
  }else if(g.k==='med'){
    if(g.j)beep(392,1.2,.1); // ojos cerrados: campana grave y la siguiente indicación
    speak(pre+st.meditation.steps[g.j].instruction);
  }else if(g.k==='close'){
    beep(392,1.2,.1);speak(st.meditation.closing);medClosed=true;
  }else if(jump&&(g.k==='work'||g.k==='switch')){
    speak(pre+nowName()); // vuelve tras apagar la pantalla: solo qué toca ahora
  }else{
    const s=st.stretches[g.j];
    if(g.k==='prep'){
      speak((g.j?pre+t('v_next',{n:s.name,d:s.desc}):t('v_first',{title:plain(st.title),n:s.name,d:s.desc}))
        +(s.sides?' '+t('v_startside',{s:s.sides[0]}):''));
      if(!quiet)beep(440,.6);vibrate(60);
    }else if(g.k==='work'){
      speak(t('v_go',{s:s.secs}),true);beep(659,.8);vibrate(150);
    }else if(g.k==='switch'){
      speak(t('v_switch',{s:s.sides[g.side]}));beep(523,.4);setTimeout(()=>beep(523,.4),450);vibrate([60,80,60]);
    }else{
      speak(t('v_sx_done'));chime();vibrate([80,60,160]);
    }
  }
}

/* Motor: busca el tramo del segundo e; si cambió, pinta la tarjeta y avisa; si no, solo la cuenta */
function updateGuided(e,jump,quiet){
  const p=plan(cur);
  if(e>=p.total){stepEnd();return;}
  let i=0;while(e>=p.seg[i].at+p.seg[i].len)i++;
  const g=p.seg[i],left=g.at+g.len-e;
  if(i!==segIdx){const first=segIdx<0;segIdx=i;renderCard(g,left);announce(g,first,quiet,jump);}
  else{
    if(!jump&&g.k==='work'&&left<=3)beep(440,.15,.06); // 3, 2, 1
    const c=$('sxCount');if(c)c.textContent=g.k==='task'||g.k==='med'?fmt(left):left;
  }
  setRing((p.total-e)/p.total,Math.ceil((p.total-e)/60)+' min');
}
function setRing(f,txt,isEmo){
  const r=$('n-ring');if(r)r.style.background='conic-gradient(#4fd1c7 '+(Math.max(0,Math.min(1,f))*360)+'deg,rgba(255,255,255,.12) 0)';
  const tm=$('timer');tm.textContent=txt;tm.classList.toggle('emo',!!isEmo);
}

/* Tiempo por marcas de reloj: el móvil frena o congela los temporizadores con la pantalla apagada,
   así que cada 250 ms se mira cuánto ha pasado de verdad desde el inicio del paso */
function tick(){
  if(!isRunning||waiting)return;
  const n=Math.floor((Date.now()-base)/1000);
  if(n<lastEl){base=Date.now()-lastEl*1000;return;} // el reloj del sistema fue hacia atrás
  if(n===lastEl)return;
  const jump=n>lastEl+2;lastEl=el=n;
  updateGuided(n,jump);
}
function clearTick(){if(timer)clearInterval(timer);timer=null;}
function startTimer(){
  clearTick();base=Date.now()-el*1000;timer=setInterval(tick,250);
  isRunning=true;keepAwake();syncPause();
}
function stopTimer(){clearTick();isRunning=false;}

function loadStep(i,cue){
  const st=stepL(i);
  cur=i;el=0;lastEl=0;segIdx=-1;waiting=false;base=Date.now();
  $('stepTitle').textContent=st.title;
  $('stepDesc').textContent=st.desc;
  $('counter').textContent=(ON.indexOf(i)+1)+'/'+ON.length;
  $('stepContent').innerHTML=(st.meditation?`<div class="meditation-intro">${st.meditation.intro}</div>`:'')
    +'<div class="dots" id="dots"></div><div id="box"></div>'
    +(st.stretches?`<div class="note">${t('stretch_tip')}</div>`:'');
  const nb=$('nextBtn'),n=nextOn(i);
  nb.textContent=n<0?t('finish_btn'):t('next',{e:emo(steps[n].title)});
  nb.className='btn'+(st.stretches||st.meditation?' sec':'');
  setDim(steps[i].dim||0);
  if(cue){chime();vibrate([60,60,60]);}
  if(i===ON[ON.length-1])markNight();
  updateGuided(0,false,cue);
}

function startRoutine() {
  __unlockAudio();
  hush(); resetRun();
  ON=onSteps(); nightKey=nightKeyNow();
  showView('routine');
  loadStep(ON[0],false);
  startTimer();
}

// Se acabó el tiempo del paso (o se tocó «✓ Hecho» en la última tarea)
function stepEnd(){
  if(steps[cur].wait&&nextOn(cur)>=0){enterWait();return;}
  nextStep();
}
function enterWait(){
  clearTick();waiting=true;isRunning=true;segIdx=-1;
  const n=(stepL(cur).tasks||[]).length;
  $('dots').innerHTML=dotsHtml(n,n,true);
  $('box').innerHTML=`<div class="sx-card sx-wait"><div class="sx-name">${t('wait_h')}</div><div class="sx-desc">${t('wait_p')}</div>
    <button class="btn bed" onclick="nextStep()">${t('wait_btn')}</button></div>`;
  setRing(0,'🛏️',true);
  $('nextBtn').classList.add('pulse');
  speak(t('v_wait'));beep(523,.4);vibrate([80,60,160]);
  syncPause();
}

// ✓ Hecho: a la siguiente tarea; en la última, se acaba el paso
function taskDone(){
  const p=plan(cur),nx=p.seg[segIdx+1];
  if(nx&&nx.k==='task')go(nx.at);else stepEnd();
}
// ⏩ Saltar este: al siguiente estiramiento (o al final si es el último)
function skipStretch(){
  const p=plan(cur),g=p.seg[segIdx];if(!g)return;
  const to=p.seg.find(x=>(x.k==='prep'&&x.j>g.j)||x.k==='done');
  if(to&&to!==g)go(to.at);
}
function go(at){el=lastEl=at;if(isRunning)base=Date.now()-at*1000;else startTimer();updateGuided(at);}

function pauseRoutine() {
  if (finished) return;
  if (waiting) { // esperando «A la cama»: pausar no hace nada (solo se reanuda si el atrás lo paró)
    if (!isRunning) { isRunning = true; keepAwake(); speak(t('v_wait')); syncPause(); }
    return;
  }
  if (isRunning) { stopTimer(); hush(); releaseAwake(); }
  else { startTimer(); speak(nowName()); }
  syncPause();
}

function nextStep() {
  if (finished) return;
  const n = nextOn(cur);
  if (n < 0) { finishRoutine(); return; }
  loadStep(n, true);
  if (!timer) startTimer();
  syncPause();
}

function finishRoutine() {
  stopTimer(); waiting = false; finished = true;
  releaseAwake(); markNight();
  $('stepTitle').textContent = t('finish_title');
  $('stepDesc').textContent = t('finish_desc');
  $('counter').textContent = '';
  setRing(1, '🌙', true);
  $('stepContent').innerHTML = `<div class="sx-card sx-close" style="padding:22px 16px">
      <div class="sx-name">${t('finish_strong')}</div>
      <div class="sx-desc" style="margin-top:10px">${t('finish_sweet',{u:__uname()})}</div></div>`;
  $('pauseBtn').classList.add('hidden'); $('nextBtn').classList.add('hidden'); $('endBtn').classList.remove('hidden');
  if (!medClosed) speak(t('v_finish')); // si la meditación ya dio las buenas noches, silencio
  dimT1 = setTimeout(() => { darkOn = true; setDim(.9); }, 4000);
}
// Con la pantalla ya oscura, un toque la aclara un poco durante 8 s
document.addEventListener('click', () => {
  if (!finished || !darkOn) return;
  setDim(.3); clearTimeout(dimT2); dimT2 = setTimeout(() => setDim(.9), 8000);
});
// 🏠 Volver al inicio: dentro de Quico vuelve a la portada de la app
function endRoutine() {
  showHome();
  if (window.parent !== window) { try { const b = parent.document.getElementById('homeBtn'); if (b) b.click(); } catch (e) {} }
}

/* Pantalla encendida mientras la rutina corre: si se apaga, el móvil congela el temporizador y la voz */
let wakeLock = null, _wlp = null;
async function keepAwake() {
  if (wakeLock || _wlp || !('wakeLock' in navigator)) return;
  try { _wlp = navigator.wakeLock.request('screen'); wakeLock = await _wlp; wakeLock.addEventListener('release', () => { wakeLock = null; }); }
  catch (e) {} finally { _wlp = null; }
}
function releaseAwake() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {} }
// el móvil suelta el bloqueo al salir de la app: se recupera al volver (y se pone al día el tiempo)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && isRunning) { keepAwake(); tick(); } });

/* Atrás del móvil: el padre llama __crisBack() (síncrono); true = retrocedió.
   Corriendo → pausa · en pausa (o en info / al terminar) → portada del módulo · en la portada → false */
window.__crisBack=function(){
  if(!$('home').classList.contains('hidden'))return false;
  if(!$('routine').classList.contains('hidden')&&isRunning){
    if(waiting){isRunning=false;hush();releaseAwake();syncPause();}
    else pauseRoutine();
    return true;
  }
  showHome();return true;
};
/* Puente para versiones mezcladas: si el index viejo aún manda postMessage */
window.addEventListener('message',function(e){
  if(e&&e.data==='cris:back'&&window.__crisBack&&window.__crisBack()){
    try{parent.postMessage('cris:back-ok','*');}catch(_){}
  }
});
applyStaticI18n();
renderHome();
syncPause();
</script>
